ward, not by scanning the middle."],"rare":false,"keys":["number of islands","connected cells","flood fill","area of island","regions"]},{"id":"gr-bfs","name":"BFS — fewest moves from one start","when":"Minimum number of steps, and every step costs the same.","tool":"a queue plus a visited set; count distance by level, exactly like tree BFS","invariant":"when a cell is first dequeued, the distance recorded is the shortest possible","cx":"O(rows · cols)","code":"from collections import deque\ndef shortest(g, start, goal):\n    R, C = len(g), len(g[0])\n    q = deque([start]); seen = {start}; steps = 0\n    while q:\n        for _ in range(len(q)):          # one whole ring per round = one step\n            r, c = q.popleft()\n            if (r, c) == goal: return steps\n            for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):\n                nr, nc = r + dr, c + dc\n                if 0 <= nr < R and 0 <= nc < C and g[nr][nc] != \"#\" and (nr,nc) not in seen:\n                    seen.add((nr, nc))   # mark on PUSH, never on pop\n                    q.append((nr, nc))\n        steps += 1\n    return -1","asks":["shortest path in a binary matrix (8 directions)","minimum knight moves on a board","word ladder (each word is a node, one-letter changes are edges)","open the lock / minimum genetic mutation — BFS over states, not cells","shortest path in a grid with obstacle elimination (the state is (r, c, remaining))","jump game III, minimum jumps to reach the end","sliding puzzle (the board layout is the node)","escape a maze, nearest exit from the entrance"],"examples":[{"n":"Shortest Path in Binary Matrix","s":"LC 1091"},{"n":"Word Ladder","s":"LC 127"},{"n":"Open the Lock","s":"LC 752"},{"n":"Shortest Path in a Grid with Obstacles Elimination","s":"LC 1293"},{"n":"Nearest Exit from Entrance in Maze","s":"LC 1926"},{"n":"Sliding Puzzle","s":"LC 773"}],"traps":["Mark visited when you PUSH, not when you pop — otherwise the same cell is queued many times and the queue explodes.","DFS cannot answer 'shortest' on an unweighted graph. It finds <i>a</i> path, not the short one.","When you may revisit a cell with a different budget, the visited key must include the budget.","A 'state' need not be a cell: a word, a lock combination, or a whole board can be the node."],"rare":false,"keys":["shortest path in a binary matrix","minimum steps","fewest moves","maze","knight moves"]},{"id":"gr-multi","name":"Multi-source BFS","when":"Several things spread simultaneously, or every cell needs its distance to the nearest X.","tool":"seed the queue with ALL sources at distance 0, then run one ordinary BFS","invariant":"the first time a cell is reached, it is reached from its nearest source","cx":"O(rows · cols) — the same single pass, no matter how many sources","code":"from collections import deque\ndef nearest_zero(mat):\n    R, C = len(mat), len(mat[0])\n    dist = [[-1] * C for _ in range(R)]\n    q = deque()\n    for r in range(R):\n        for c in range(C):\n            if mat[r][c] == 0:\n                dist[r][c] = 0\n                q.append((r, c))      # EVERY source enters before the loop starts\n    while q:\n        r, c = q.popleft()\n        for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < R and 0 <= nc < C and dist[nr][nc] == -1:\n                dist[nr][nc] = dist[r][c] + 1\n                q.append((nr, nc))\n    return dist","asks":["rotting oranges — minutes until everything rots","01 matrix — distance of each cell to the nearest 0","walls and gates — distance to the nearest gate","as far from land as possible (the maximum distance to any land)","shortest bridge (flood one island, then BFS outward from all of it)","map of highest peak; spreading fire or infection with a time limit","shortest distance from all buildings"],"examples":[{"n":"Rotting Oranges","s":"LC 994"},{"n":"01 Matrix","s":"LC 542"},{"n":"Walls and Gates","s":"LC 286"},{"n":"As Far from Land as Possible","s":"LC 1162"},{"n":"Shortest Bridge","s":"LC 934"},{"n":"Map of Highest Peak","s":"LC 1765"}],"traps":["Every source must be in the queue BEFORE the loop starts. Running one BFS per source is O(sources · cells) and will time out.","Rotting oranges has to report −1 when something is left unreached — check for survivors at the end.","Counting minutes: either use the level-by-level form, or store the distance in the grid and take the maximum."],"rare":false,"keys":["rotting oranges","distance to nearest","spreads every minute","all sources at once","01 matrix","simultaneously"]},{"id":"gr-border","name":"Start from the border","when":"Cells are safe, or not captured, if they connect to the edge of the grid.","tool":"a flood fill launched from every border cell","invariant":"anything the border flood does not reach is enclosed","cx":"O(R·C) time and space","code":"def solve_surrounded(board):\n    R, C = len(board), len(board[0])\n    def dfs(r, c):\n        if 0 <= r < R and 0 <= c < C and board[r][c] == \"O\":\n            board[r][c] = \"#\"\n            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                dfs(r + dr, c + dc)\n    for r in range(R):\n        dfs(r, 0); dfs(r, C - 1)\n    for c in range(C):\n        dfs(0, c); dfs(R - 1, c)\n    for r in range(R):\n        for c in range(C):\n            board[r][c] = \"O\" if board[r][c] == \"#\" else \"X\"\n    return board","asks":["surrounded regions","water that can reach both oceans (flood from each border, intersect)","land cells that cannot walk off the grid","closed islands"],"examples":[{"n":"Surrounded Regions","s":"LC 130"},{"n":"Pacific Atlantic Water Flow","s":"LC 417"},{"n":"Number of Enclaves","s":"LC 1020"},{"n":"Number of Closed Islands","s":"LC 1254"}],"traps":["Going backward from the border is the trick: flow uphill from the ocean, instead of testing each cell.","Use BFS or an iterative stack on big grids to avoid recursion limits."],"keys":["surrounded","enclosed","cannot reach the boundary","reach the edge","both oceans"],"rare":false}]},{"id":"toposort","group":"graph","name":"Topological sort (ordering & cycles)","buys":"Gives a valid order over n tasks in O(V + E), instead of guessing permutations.","lives":"directed graph of dependencies (a DAG, if the input is sane)","core":"Whenever the statement says 'before', 'requires', 'prerequisite' or 'depends on', you have a directed graph and you want an order where every arrow points forward. Kahn's method is the one to memorise: repeatedly take anything with no remaining prerequisites. If you finish having emitted fewer than n nodes, the leftovers form a cycle — so the SAME algorithm also tells you whether it's even possible.","recognise":[{"cue":"<b>prerequisites</b>, 'must come before', dependencies, build order","note":"the definition"},{"cue":"<b>is it possible</b> to finish / 'is there a cycle' in a DIRECTED graph","note":"count what you emit"},{"cue":"<b>alien dictionary</b>, 'deduce the order of the letters'","note":"build edges from adjacent pairs"},{"cue":"<b>longest path in a DAG</b>, 'minimum time to finish all tasks'","note":"DP along the topological order"}],"notwhen":["The graph is UNDIRECTED → cycle detection there is union-find or DFS with a parent check, not topo sort.","You need the shortest path with weights → use Dijkstra (unless it's a DAG, where topo order + DP is faster)."],"pick":[{"if":"produce an order, or detect a cycle, iteratively","then":"to-kahn"},{"if":"you prefer recursion, or need the DFS colouring","then":"to-dfs"}],"variants":[{"id":"to-kahn","name":"Kahn's algorithm (BFS on indegree)","when":"Any ordering or 'is it possible' question. This is the default.","tool":"indegree count per node + a queue of everything currently at indegree 0","invariant":"anything in the queue has all its prerequisites already emitted","cx":"O(V + E)","code":"from collections import deque\ndef topo(n, edges):                  # edges = [(a, b)] meaning a must come before b\n    adj = [[] for _ in range(n)]\n    indeg = [0] * n\n    for a, b in edges:\n        adj[a].append(b)\n        indeg[b] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    order = []\n    while q:\n        u = q.popleft()\n        order.append(u)\n        for v in adj[u]:\n            indeg[v] -= 1            # one prerequisite satisfied\n            if indeg[v] == 0:\n                q.append(v)\n    return order if len(order) == n else []   # short -> a cycle exists","asks":["course schedule — can all courses be finished (cycle detection)","course schedule II — return a valid order","alien dictionary — derive the letter order from a sorted word list","minimum height trees (peel leaves inward, the undirected cousin)","parallel courses / minimum semesters — count the BFS levels","build order, task scheduling with dependencies","sort items by group with dependencies (topo sort twice: groups, then items)","find all possible orderings (topo sort + backtracking)"],"examples":[{"n":"Course Schedule","s":"LC 207"},{"n":"Course Schedule II","s":"LC 210"},{"n":"Alien Dictionary","s":"LC 269"},{"n":"Minimum Height Trees","s":"LC 310"},{"n":"Parallel Courses","s":"LC 1136"},{"n":"Sort Items by Groups Respecting Dependencies","s":"LC 1203"}],"traps":["Get the edge DIRECTION right. 'To take b you need a' is an edge a→b, and reversing it passes the sample and fails everything else.","The cycle check is <code>len(order) == n</code>. There is no separate cycle pass to write.","Alien dictionary has a trap case: if a longer word comes before its own prefix, the input is invalid regardless of letters.","'Minimum semesters' is the number of BFS ROUNDS, so use the level-by-level form."],"rare":false,"keys":["prerequisites","course schedule","order of tasks","dependencies","build order","alien dictionary"]},{"id":"to-dfs","name":"DFS post-order + three-colour cycle check","when":"You prefer recursion, or you want cycle detection with the path visible.","tool":"colours: 0 unvisited, 1 in the current stack, 2 finished. Meeting a 1 means a cycle","invariant":"a node turns 2 only after everything it points to is already 2","cx":"O(V + E)","code":"def topo_dfs(n, adj):\n    color = [0] * n           # 0 = new, 1 = on the current path, 2 = done\n    order = []\n    def dfs(u):\n        if color[u] == 1: return False     # back edge -> CYCLE\n        if color[u] == 2: return True      # already settled\n        color[u] = 1\n        for v in adj[u]:\n            if not dfs(v): return False\n        color[u] = 2\n        order.append(u)                     # post-order\n        return True\n    for i in range(n):\n        if not dfs(i): return []\n    return order[::-1]                      # reverse the post-order","asks":["course schedule I / II via DFS","detect a cycle in a directed graph","find eventual safe states (nodes that cannot reach a cycle)","longest path in a DAG; largest colour value in a directed graph","strongly connected components (Kosaraju / Tarjan build on this)","reconstruct itinerary (Hierholzer's post-order, the Eulerian path cousin)"],"examples":[{"n":"Course Schedule II","s":"LC 210"},{"n":"Find Eventual Safe States","s":"LC 802"},{"n":"Longest Path With Different Adjacent Characters","s":"LC 2246"},{"n":"Reconstruct Itinerary","s":"LC 332"}],"traps":["Two states are not enough. 'Visited' alone cannot tell a cross edge from a back edge — you need the third colour.","The answer is the post-order REVERSED. Forgetting the reverse gives you a valid-looking but wrong order.","Deep graphs overflow Python's recursion limit; Kahn's has no such problem."],"rare":false,"keys":["detect cycle in a directed graph","safe states","recursion stack","topological order with DFS"]}]},{"id":"shortest-path","group":"graph","name":"Weighted shortest paths","buys":"Exploring every possible route is exponential. Always settling the nearest unfinished node first gets it to O(E log V).","lives":"weighted graph — roads with distances, flights with prices, edges with risk","core":"Pick the algorithm by the weights, nothing else. All edges equal → BFS. Non-negative weights → Dijkstra, which is just BFS with a priority queue instead of a plain one. Negative edges, or a cap on the number of edges used → Bellman-Ford. Every pair, with n small → Floyd-Warshall, three nested loops.","recognise":[{"cue":"edges carry a <b>cost / distance / time / price</b>, and all are non-negative","note":"Dijkstra"},{"cue":"<b>cheapest</b> / fastest / minimum total, on a weighted graph","note":"Dijkstra"},{"cue":"<b>at most k stops</b> / exactly k edges, or NEGATIVE weights","note":"Bellman-Ford"},{"cue":"<b>all pairs</b>, and n ≤ ~400","note":"Floyd-Warshall — O(n³) and four lines long"},{"cue":"weights are only <b>0 or 1</b>","note":"0-1 BFS with a deque, O(V+E), no heap needed"},{"cue":"'maximise the <b>minimum</b> edge on the path' (signal, capacity)","note":"modified Dijkstra, or binary search + BFS"},{"cue":"edge costs are only <b>0 or 1</b>","note":"0-1 BFS"},{"cue":"<b>minimise the maximum</b> on a path, or the state has extras","note":"Dijkstra on a changed cost"}],"notwhen":["All edges cost the same → use plain BFS; a heap here is pure overhead.","You want to connect everything as cheaply as possible, not travel between two points → that's an MST (Kruskal / Prim), not a shortest path."],"pick":[{"if":"non-negative weights, one source","then":"sp-dijkstra"},{"if":"negative edges, or a limit on the number of edges","then":"sp-bellman"},{"if":"every pair of nodes and n is small","then":"sp-floyd"},{"if":"edges cost only 0 or 1","then":"sp-01bfs"},{"if":"cost is a bottleneck or product, or extra state is needed","then":"sp-mod"}],"variants":[{"id":"sp-dijkstra","name":"Dijkstra (non-negative weights)","when":"One source, weighted edges, no negatives.","tool":"a min-heap of (distance so far, node); settle the closest unfinished node each time","invariant":"the first time a node is popped, its distance is final — nothing cheaper can appear later","cx":"O(E log V)","code":"import heapq\ndef dijkstra(n, adj, src):            # adj[u] = [(v, weight), ...]\n    dist = [float('inf')] * n\n    dist[src] = 0\n    h = [(0, src)]\n    while h:\n        d, u = heapq.heappop(h)\n        if d > dist[u]:\n            continue                   # a stale copy -- skip it, do not re-expand\n        for v, w in adj[u]:\n            nd = d + w\n            if nd < dist[v]:\n                dist[v] = nd\n                heapq.heappush(h, (nd, v))\n    return dist","asks":["network delay time — when does the signal reach everyone","cheapest flights within k stops (needs the k-limit, so usually Bellman-Ford)","path with maximum probability (use −log, or a max-heap)","swim in rising water; path with minimum effort (minimise the MAXIMUM edge)","minimum cost to reach a destination in time","number of ways to arrive at the destination (Dijkstra, counting as you relax)","second minimum time to reach the end","reachable nodes in a subdivided graph"],"examples":[{"n":"Network Delay Time","s":"LC 743"},{"n":"Path with Maximum Probability","s":"LC 1514"},{"n":"Path With Minimum Effort","s":"LC 1631"},{"n":"Swim in Rising Water","s":"LC 778"},{"n":"Minimum Cost to Reach Destination in Time","s":"LC 1928"},{"n":"Number of Ways to Arrive at Destination","s":"LC 1976"}],"traps":["The <code>if d > dist[u]: continue</code> line is not optional — without it stale heap entries re-expand nodes and the complexity degrades.","Dijkstra is WRONG with negative edges. The 'settled is final' invariant simply does not hold.","For 'minimise the maximum edge', the relaxation becomes <code>max(d, w)</code> rather than <code>d + w</code>.","Python has no decrease-key: push a duplicate and skip stale pops. That is the standard idiom."],"rare":false,"keys":["shortest path","minimum time","network delay","weighted edges","non-negative weights"]},{"id":"sp-bellman","name":"Bellman-Ford (negatives, or a k-edge cap)","when":"Negative weights, or 'at most k edges / stops'.","tool":"relax EVERY edge, n−1 times — or exactly k+1 times for the k-stop version","invariant":"after round i, every shortest path using at most i edges is correct","cx":"O(V · E)","code":"def cheapest_k_stops(n, flights, src, dst, k):\n    dist = [float('inf')] * n\n    dist[src] = 0\n    for _ in range(k + 1):             # k stops = k+1 edges\n        snap = dist[:]                 # use LAST round's values only\n        for u, v, w in flights:\n            if snap[u] + w < dist[v]:\n                dist[v] = snap[u] + w\n    return -1 if dist[dst] == float('inf') else dist[dst]","asks":["cheapest flights within k stops","shortest path with negative edge weights","detect a negative cycle (one extra round still improves something)","currency arbitrage (a negative cycle in log space)","minimum cost with exactly k edges used"],"examples":[{"n":"Cheapest Flights Within K Stops","s":"LC 787"},{"n":"Network Delay Time","s":"LC 743 — compare with the Dijkstra version"}],"traps":["The snapshot copy is the whole trick for the k-stop version. Relaxing in place lets one round use two edges, which breaks the limit.","k STOPS means k+1 edges. Off by one here is the single most common failure on LC 787.","An n-th round that still improves something proves a negative cycle."],"rare":false,"keys":["negative weights","at most k stops","cheapest flights","negative cycle"]},{"id":"sp-floyd","name":"Floyd-Warshall (all pairs)","when":"You need distances between EVERY pair and n is small (the n ≤ 100–400 bound is the tell).","tool":"three nested loops, with the intermediate node k on the OUTSIDE","invariant":"after the k-th round, dist[i][j] is optimal using only {0..k} as intermediates","cx":"O(n³) time, O(n²) space","code":"def floyd(n, dist):                 # dist[i][j] pre-filled, inf where no edge\n    for k in range(n):               # k MUST be the outer loop\n        for i in range(n):\n            for j in range(n):\n                if dist[i][k] + dist[k][j] < dist[i][j]:\n                    dist[i][j] = dist[i][k] + dist[k][j]\n    return dist","asks":["find the city with the smallest number of reachable neighbours within a threshold","all-pairs shortest path for a small graph","transitive closure — 'can i reach j' for every pair","course schedule IV — is x a prerequisite of y, answered for many queries","minimum cost to convert one string to another (26 nodes)","evaluate division (ratios between variables)"],"examples":[{"n":"Find the City With the Smallest Number of Neighbors at a Threshold Distance","s":"LC 1334"},{"n":"Course Schedule IV","s":"LC 1462"},{"n":"Minimum Cost to Convert String I","s":"LC 2976"},{"n":"Evaluate Division","s":"LC 399"}],"traps":["k on the OUTSIDE. Any other loop order gives wrong answers that still look plausible.","n = 400 is 64 million operations — fine in C++, slow in Python. Check the bound before committing.","Initialise dist[i][i] = 0 and everything else to infinity, then lay the edges in."],"rare":false,"keys":["every pair","all pairs shortest","n ≤ 400","city with fewest neighbours"]},{"id":"sp-01bfs","name":"0-1 BFS","when":"Every edge costs 0 or 1, for example free moves and paid moves.","tool":"a deque: 0-cost edges to the front, 1-cost edges to the back","invariant":"the deque stays sorted by distance","cx":"O(V + E)","code":"from collections import deque\n\ndef min_cost_grid(grid):\n    R, C = len(grid), len(grid[0])\n    dist = [[float(\"inf\")] * C for _ in range(R)]\n    dist[0][0] = 0\n    q = deque([(0, 0)])\n    while q:\n        r, c = q.popleft()\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            x, y = r + dr, c + dc\n            if 0 <= x < R and 0 <= y < C:\n                w = grid[x][y]        # 0 = free, 1 = costs one\n                if dist[r][c] + w < dist[x][y]:\n                    dist[x][y] = dist[r][c] + w\n                    (q.appendleft if w == 0 else q.append)((x, y))\n    return dist[R - 1][C - 1]","asks":["fewest obstacles to remove to reach the corner","fewest arrows to change to make a valid path","fewest walls to break"],"examples":[{"n":"Minimum Cost to Make at Least One Valid Path in a Grid","s":"LC 1368"},{"n":"Minimum Obstacle Removal to Reach Corner","s":"LC 2290"}],"traps":["Only push when the distance improves, or you revisit forever."],"keys":["remove the fewest obstacles","break walls","free move","cost 0 or 1"],"rare":false},{"id":"sp-mod","name":"Dijkstra on a changed cost or state","when":"The path cost is not a simple sum (a bottleneck, a product), or the state needs extra information like time left.","tool":"a heap of (cost, node, extra state)","invariant":"states pop in order of cost, so the first pop of a state is final","cx":"O(E log V), times the number of extra states","code":"import heapq\n\ndef min_effort(h):\n    R, C = len(h), len(h[0])\n    best = {(0, 0): 0}\n    pq = [(0, 0, 0)]\n    while pq:\n        e, r, c = heapq.heappop(pq)\n        if (r, c) == (R - 1, C - 1):\n            return e\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            x, y = r + dr, c + dc\n            if 0 <= x < R and 0 <= y < C:\n                ne = max(e, abs(h[r][c] - h[x][y]))   # bottleneck, not a sum\n                if ne < best.get((x, y), float(\"inf\")):\n                    best[(x, y)] = ne\n                    heapq.heappush(pq, (ne, x, y))","asks":["path whose largest step is smallest","path with maximum probability (use a max-heap on the product)","cheapest route within a time limit (state: node, time)","up to k free or discounted edges"],"examples":[{"n":"Path With Minimum Effort","s":"LC 1631"},{"n":"Swim in Rising Water","s":"LC 778"},{"n":"Path with Maximum Probability","s":"LC 1514"},{"n":"Minimum Cost to Reach Destination in Time","s":"LC 1928"}],"traps":["With extra state, the visited check is on (node, state), not node alone."],"keys":["minimise the maximum","bottleneck","maximum probability","within time limit","up to k discounts"],"rare":false}]},{"id":"dsu","group":"graph","name":"Union-Find (disjoint set union)","buys":"A DFS re-run per query is O(V + E) each time. Union-Find answers 'are these connected' in effectively O(1), even as the graph keeps growing.","lives":"undirected connectivity: friends, networks, merged accounts, equivalent items","core":"Each group keeps one representative node. find(x) walks to it; union(a,b) hangs one group's representative under the other's. It beats DFS because it can answer 'are these two connected' while edges are STILL ARRIVING — DFS would have to start over from scratch after every new edge. This is the one that ambushed you in a real OA.","recognise":[{"cue":"<b>merging groups</b> incrementally, 'join these two'","note":"the definition"},{"cue":"<b>are these connected</b>, 'same network', 'same component'","note":"find(a) == find(b)"},{"cue":"<b>number of groups</b> after a stream of operations","note":"start at n, subtract one per successful union"},{"cue":"a <b>cycle in an UNDIRECTED graph</b>, 'the redundant edge'","note":"an edge whose ends already share a root"},{"cue":"<b>cheapest way to connect everything</b>","note":"Kruskal — sort the edges, union the cheap ones that help"},{"cue":"<b>accounts / emails / items to merge</b> transitively","note":"union by a shared key"}],"notwhen":["The graph is DIRECTED and direction matters → union-find ignores direction entirely.","You need to UNDO a union → plain DSU can't do that; you'd need a rollback variant.","The whole graph is given up front and you only need the components once → a DFS sweep works just as well."],"pick":[{"if":"count components, or test connectivity as edges arrive","then":"dsu-connect"},{"if":"find a cycle or a redundant edge in an undirected graph","then":"dsu-cycle"},{"if":"connect everything at minimum total cost","then":"dsu-kruskal"},{"if":"MST, dense graph or implicit edges","then":"dsu-prim"}],"variants":[{"id":"dsu-connect","name":"The structure itself","when":"Connectivity questions, component counts, incremental merging.","tool":"parent array + union by SIZE + path compression","invariant":"every node in a group reaches the same root, and the root knows the group's size","cx":"near O(1) amortised per operation (inverse Ackermann)","code":"class DSU:\n    def __init__(self, n):\n        self.p = list(range(n))       # everyone is their own root\n        self.sz = [1] * n\n        self.groups = n\n    def find(self, x):\n        while self.p[x] != x:\n            self.p[x] = self.p[self.p[x]]   # path compression, halving as we climb\n            x = self.p[x]\n        return x\n    def union(self, a, b):\n        ra, rb = self.find(a), self.find(b)\n        if ra == rb: return False      # already together -- this edge is redundant\n        if self.sz[ra] < self.sz[rb]: ra, rb = rb, ra\n        self.p[rb] = ra                # SMALL hangs under BIG -> shallow trees\n        self.sz[ra] += self.sz[rb]\n        self.groups -= 1\n        return True","asks":["number of connected components in an undirected graph","number of provinces / friend circles","number of islands II — land appears one cell at a time","accounts merge; sentence similarity; synonymous expressions","satisfiability of equality equations (union the equals, then check the not-equals)","the earliest moment everyone becomes friends","largest component by size; 'is there a valid path between two nodes'","a capacity rule on merging — reject a union that would exceed the cap"],"examples":[{"n":"Number of Provinces","s":"LC 547"},{"n":"Number of Islands II","s":"LC 305"},{"n":"Accounts Merge","s":"LC 721"},{"n":"Satisfiability of Equality Equations","s":"LC 990"},{"n":"The Earliest Moment When Everyone Become Friends","s":"LC 1101"},{"n":"Number of Operations to Make Network Connected","s":"LC 1319"}],"traps":["Without union by size AND path compression it degrades to a linked list and times out.","ALWAYS compare roots, never the raw values: <code>find(a) == find(b)</code>.","Have union return a boolean. 'Did this edge actually join anything' is what most problems really ask.","For a capacity rule, test <code>sz[ra] + sz[rb] &gt; CAP</code> BEFORE merging, and leave both sides untouched if it fails."],"rare":false,"keys":["union","merge groups","accounts merge","are they connected","online connectivity","number of components after each"]},{"id":"dsu-cycle","name":"Cycle / redundancy detection","when":"An undirected graph, and you want the edge that closes a loop.","tool":"union each edge in order; the first union that returns False closes a cycle","invariant":"before adding an edge, its two ends are in the same set exactly when a path already joins them","cx":"O(E · α)","code":"def redundant_connection(edges):\n    dsu = DSU(len(edges) + 1)\n    for a, b in edges:\n        if not dsu.union(a, b):      # both ends already connected -> this edge closes a loop\n            return [a, b]\n    return []\n\n# a valid TREE on n nodes = exactly n-1 edges AND no cycle at all\ndef is_tree(n, edges):\n    if len(edges) != n - 1: return False\n    dsu = DSU(n)\n    return all(dsu.union(a, b) for a, b in edges)","asks":["redundant connection — the edge to remove to restore a tree","graph valid tree","detect a cycle in an undirected graph","number of operations to make the network connected (count spare edges vs components)","remove the maximum number of edges while keeping the graph traversable","checking whether adding an edge would create a loop, as edges stream in"],"examples":[{"n":"Redundant Connection","s":"LC 684"},{"n":"Graph Valid Tree","s":"LC 261"},{"n":"Number of Operations to Make Network Connected","s":"LC 1319"},{"n":"Remove Max Number of Edges to Keep Graph Fully Traversable","s":"LC 1579"}],"traps":["A tree needs BOTH conditions: exactly n−1 edges and no cycle. Checking only one is a common miss.","Nodes numbered from 1 need a DSU of size n+1, or everything is off by one.","In a DIRECTED graph this does not detect cycles — use the three-colour DFS instead."],"rare":false,"keys":["redundant connection","extra edge","cycle in an undirected graph","edge that closes a loop"]},{"id":"dsu-kruskal","name":"Kruskal — minimum spanning tree","when":"Connect every node as cheaply as possible.","tool":"sort every edge by weight, then union the ones that actually join two groups","invariant":"the cheapest edge crossing any cut is always safe to take (the cut property)","cx":"O(E log E), dominated by the sort","code":"def mst_cost(n, edges):            # edges = [(w, u, v)]\n    edges.sort()                     # cheapest first -- this IS the greedy choice\n    dsu = DSU(n)\n    total, used = 0, 0\n    for w, u, v in edges:\n        if dsu.union(u, v):          # skip it if both ends are already connected\n            total += w\n            used += 1\n            if used == n - 1: break  # a spanning tree has exactly n-1 edges\n    return total if used == n - 1 else -1   # -1: the graph is disconnected","asks":["minimum cost to connect all points (build the complete graph on Manhattan distances)","connecting cities with minimum cost","optimise water distribution in a village (a virtual node for the wells)","min cost to supply water / to connect all islands","find critical and pseudo-critical edges in an MST","the maximum edge on the MST path — 'minimise the hardest hop'"],"examples":[{"n":"Min Cost to Connect All Points","s":"LC 1584"},{"n":"Connecting Cities With Minimum Cost","s":"LC 1135"},{"n":"Optimize Water Distribution in a Village","s":"LC 1168"},{"n":"Find Critical and Pseudo-Critical Edges in Minimum Spanning Tree","s":"LC 1489"}],"traps":["MST ≠ shortest path. The MST connects everything cheaply; it does NOT give the shortest route between two particular nodes.","Stop at n−1 edges, and if you never reach n−1 the graph was disconnected — report that rather than returning a partial total.","'A well in a house' becomes an edge from a virtual node 0 — that re-framing is the entire trick in LC 1168."],"rare":false,"keys":["minimum spanning tree","connect all cities at minimum cost","sort edges by weight"]},{"id":"dsu-prim","name":"Prim — minimum spanning tree with a heap","when":"Connect everything cheaply on a DENSE graph, or when the edges are implicit (all pairs of points).","tool":"a heap of (edge cost, node) leaving the current tree","invariant":"the cheapest edge leaving the tree is always safe to add","cx":"O(E log V)","code":"import heapq\n\ndef min_cost_connect_points(points):\n    n = len(points)\n    seen, total = set(), 0\n    pq = [(0, 0)]\n    while len(seen) < n:\n        cost, u = heapq.heappop(pq)\n        if u in seen:\n            continue\n        seen.add(u)\n        total += cost\n        for v in range(n):\n            if v not in seen:\n                d = abs(points[u][0] - points[v][0]) + abs(points[u][1] - points[v][1])\n                heapq.heappush(pq, (d, v))\n    return total","asks":["connect all points at the least cost","minimum spanning tree of a dense graph","GfG style: give the MST weight"],"examples":[{"n":"Min Cost to Connect All Points","s":"LC 1584"}],"traps":["Check <code>seen</code> when you POP, since one node sits in the heap several times."],"keys":["minimum spanning tree","MST","connect all","minimum cost to connect"],"rare":false}]},{"id":"dp-1d","group":"dp","name":"1-D dynamic programming","buys":"Plain recursion explores O(2ⁿ) paths. DP solves each subproblem once, getting it to O(n) or O(n·k).","lives":"a sequence, where the answer at i depends on a few earlier answers","core":"Answer two questions, in order. First: WHAT IS THE STATE — what does dp[i] actually mean, as a full English sentence? Second: what CHOICE do you make at i, and which earlier states does it need? If you can't say that sentence, you don't have a DP yet, and writing code won't save you. Start from the plain recursion, add memoisation, then flatten it into a loop if you want.","recognise":[{"cue":"<b>maximum / minimum / count the ways</b>, over a sequence of choices","note":"the DP trio"},{"cue":"<b>take it or skip it</b> at each position","note":"dp[i] = best(take, skip)"},{"cue":"<b>cannot use two adjacent</b> / a cooldown applies","note":"dp[i] reads dp[i-2]"},{"cue":"<b>unlimited copies</b> of each item (coins, cuts)","note":"unbounded knapsack — loop forward"},{"cue":"<b>longest increasing</b> subsequence, and n ≤ 2500 vs n ≤ 10⁵","note":"O(n²) DP vs patience + binary search"},{"cue":"overlapping subproblems you can SEE when you draw the recursion tree","note":"memoise it"},{"cue":"<b>cooldown, holding, buy / sell</b>, a few named modes","note":"state machine DP"},{"cue":"<b>split into pieces</b>, segment, number of decodings","note":"dp over the last piece"}],"notwhen":["A local choice is provably safe at every step → use <b>greedy</b> instead, O(n log n) and much shorter.","The window is contiguous and you're tracking a running total → sliding window, not DP.","Each step depends on ALL previous states, not just a few → you probably need a different state, or a tree / segment structure."],"pick":[{"if":"take-or-skip along a line, with an adjacency rule","then":"dp-linear"},{"if":"the best CONTIGUOUS run (sum or product)","then":"dp-kadane"},{"if":"unlimited copies of items hitting a target","then":"dp-coin"},{"if":"the longest increasing / chain-like subsequence","then":"dp-lis"},{"if":"a few modes with restricted switching","then":"dp-state"},{"if":"cut the sequence into pieces","then":"dp-partition"}],"variants":[{"id":"dp-linear","name":"Linear take-or-skip","when":"Walk the sequence; at each position you choose, and a rule limits adjacent choices.","tool":"dp[i] = the best answer considering the first i items","invariant":"dp[i] is final before dp[i+1] is computed, and only reads a fixed window behind it","cx":"O(n) time, O(1) space once you keep only the last two values","code":"def rob(nums):\n    # state: best loot from the first i houses.  choice at i: rob it (+ dp[i-2]) or skip (dp[i-1])\n    prev2, prev1 = 0, 0\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1\n\ndef climb(n):\n    # state: ways to reach step i.  choice: arrive from i-1 or i-2\n    a, b = 1, 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b","asks":["climbing stairs; min cost climbing stairs; Fibonacci-shaped counting","house robber I (line) and II (circle — run it twice, excluding one end each time)","decode ways — count the ways to split a digit string into letters","delete and earn (bucket by value, then it IS house robber)","best time to buy and sell stock with cooldown / with a fee (a small state machine)","maximum alternating subsequence sum; tiling a 2×n board; 'n-th tribonacci'","jump game II when you want the fewest jumps as a DP (greedy is faster)","partition into at most k groups along a line"],"examples":[{"n":"Climbing Stairs","s":"LC 70"},{"n":"Min Cost Climbing Stairs","s":"LC 746"},{"n":"House Robber","s":"LC 198"},{"n":"House Robber II","s":"LC 213"},{"n":"Decode Ways","s":"LC 91"},{"n":"Delete and Earn","s":"LC 740"},{"n":"Best Time to Buy and Sell Stock with Cooldown","s":"LC 309"}],"traps":["Write the state as a SENTENCE in a comment first. Most wrong DP is a wrong state, not wrong code.","Decode Ways has nasty zeros: '0' alone decodes to nothing, and '10' / '20' only work as pairs.","The circular version is two linear runs, not a clever single pass.","Rolling two variables instead of an array is the standard O(1)-space move — do it last, after it works."],"rare":false,"keys":["climbing stairs","number of ways to reach","no two adjacent","house robber","minimum cost to reach the top"]},{"id":"dp-kadane","name":"Kadane — best contiguous run","when":"Maximum (or minimum) sum or product of a CONTIGUOUS subarray.","tool":"cur = best run ENDING here; answer = best cur ever seen","invariant":"a run ending at i either extends the run ending at i-1 or starts fresh at i","cx":"O(n) time, O(1) space","code":"def max_subarray(a):\n    cur = best = a[0]\n    for x in a[1:]:\n        cur = max(x, cur + x)      # start fresh, or extend -- that is the whole decision\n        best = max(best, cur)\n    return best\n\ndef max_product(a):\n    # products need BOTH extremes: a big negative times a negative becomes the new maximum\n    cur_hi = cur_lo = best = a[0]\n    for x in a[1:]:\n        cands = (x, cur_hi * x, cur_lo * x)\n        cur_hi, cur_lo = max(cands), min(cands)\n        best = max(best, cur_hi)\n    return best","asks":["maximum subarray sum (and returning the actual indices)","maximum product subarray","maximum sum circular subarray (total − minimum subarray, with the all-negative special case)","best time to buy and sell stock (the same shape: track the min so far)","maximum absolute sum of any subarray","longest turbulent subarray; maximum ascending subarray sum","K-concatenation maximum sum"],"examples":[{"n":"Maximum Subarray","s":"LC 53"},{"n":"Maximum Product Subarray","s":"LC 152"},{"n":"Maximum Sum Circular Subarray","s":"LC 918"},{"n":"Best Time to Buy and Sell Stock","s":"LC 121"},{"n":"Maximum Absolute Sum of Any Subarray","s":"LC 1749"}],"traps":["Start from a[0], not 0 — seeding with 0 silently returns 0 for an all-negative array.","Products need the minimum tracked too, because two negatives make a maximum.","The circular version's trap: if every number is negative, total − min is 0, which is not a legal non-empty answer."],"rare":false,"keys":["maximum subarray","largest sum contiguous","maximum product subarray","best contiguous"]},{"id":"dp-coin","name":"Unbounded knapsack (coins, cuts, steps)","when":"Unlimited copies of each item, and you must hit or fill a target.","tool":"dp over the TARGET; loop items outside and amount inside (or the reverse — the order decides the meaning)","invariant":"dp[t] is final for every t below the one you are filling","cx":"O(items · target)","code":"def coin_change(coins, amount):           # FEWEST coins\n    dp = [float('inf')] * (amount + 1)\n    dp[0] = 0                                 # zero coins make zero\n    for t in range(1, amount + 1):\n        for c in coins:\n            if c <= t:\n                dp[t] = min(dp[t], dp[t - c] + 1)\n    return -1 if dp[amount] == float('inf') else dp[amount]\n\ndef count_combinations(coins, amount):    # how many COMBINATIONS (order does not matter)\n    dp = [0] * (amount + 1); dp[0] = 1\n    for c in coins:                        # coins OUTSIDE -> combinations\n        for t in range(c, amount + 1):     # forward -> a coin may be reused\n            dp[t] += dp[t - c]\n    return dp[amount]","asks":["coin change — fewest coins to make the amount","coin change II — how many combinations make the amount","combination sum IV — how many PERMUTATIONS (swap the loops!)","perfect squares — fewest squares summing to n","rod cutting / integer break for maximum product","minimum number of refuelling or rechargeable steps","word break — can the string be cut into dictionary words","number of ways to climb with a given set of step sizes"],"examples":[{"n":"Coin Change","s":"LC 322"},{"n":"Coin Change II","s":"LC 518"},{"n":"Combination Sum IV","s":"LC 377"},{"n":"Perfect Squares","s":"LC 279"},{"n":"Word Break","s":"LC 139"},{"n":"Integer Break","s":"LC 343"}],"traps":["LOOP ORDER CHANGES THE ANSWER. Items outside counts combinations; target outside counts permutations. LC 518 and LC 377 are the same code with the loops swapped — know which one you need.","Unbounded loops the amount FORWARD (reuse allowed); 0/1 knapsack loops it BACKWARD (one use only).","dp[0] = 1 for counting and dp[0] = 0 for minimising. Mixing them up breaks everything downstream.","Return −1 when the target is unreachable — do not report infinity."],"rare":false,"keys":["unlimited supply","coin change","minimum coins","number of combinations","rod cutting","perfect squares"]},{"id":"dp-lis","name":"Longest increasing subsequence","when":"The longest chain where each item beats the previous by some rule.","tool":"O(n²): dp[i] = best chain ending at i. O(n log n): a tails array + binary search","invariant":"tails[k] holds the SMALLEST possible ending value of an increasing run of length k+1","cx":"O(n²) or O(n log n) — and the constraint tells you which one is required","code":"# O(n^2) -- fine for n <= 2500, and it lets you reconstruct the sequence\ndef lis_quadratic(a):\n    dp = [1] * len(a)\n    for i in range(len(a)):\n        for j in range(i):\n            if a[j] < a[i]:\n                dp[i] = max(dp[i], dp[j] + 1)\n    return max(dp, default=0)\n\n# O(n log n) -- required once n hits 1e5.  tails is NOT the answer sequence, only its length is right\nfrom bisect import bisect_left\ndef lis_fast(a):\n    tails = []\n    for x in a:\n        i = bisect_left(tails, x)       # bisect_right for non-decreasing runs\n        if i == len(tails): tails.append(x)\n        else: tails[i] = x\n    return len(tails)","asks":["longest increasing subsequence (both complexities — Pattern Radar drills exactly this choice)","number of longest increasing subsequences (needs the O(n²) form plus a count array)","russian doll envelopes (sort by width, LIS on height, descending on ties)","maximum length of a pair chain; longest string chain","minimum number of removals to make an array sorted = n − LIS","box stacking, 'maximum height by stacking'","longest arithmetic subsequence (state becomes (index, difference))","minimum number of increasing subsequences to cover the array (= longest DECREASING run)"],"examples":[{"n":"Longest Increasing Subsequence","s":"LC 300"},{"n":"Number of Longest Increasing Subsequence","s":"LC 673"},{"n":"Russian Doll Envelopes","s":"LC 354"},{"n":"Longest String Chain","s":"LC 1048"},{"n":"Maximum Length of Pair Chain","s":"LC 646"},{"n":"Longest Arithmetic Subsequence","s":"LC 1027"}],"traps":["The tails array is NOT the subsequence. Its length is correct; its contents usually are not a real answer.","Russian dolls: sort widths ascending but heights DESCENDING within equal widths, or one width pairs with itself.","Strictly increasing uses bisect_left; non-decreasing uses bisect_right. One character, different problem.","Read the bound. n ≤ 2500 permits O(n²); n ≤ 10⁵ demands the log version."],"rare":false,"keys":["longest increasing subsequence","longest chain","Russian doll","box stacking","number of LIS"]},{"id":"dp-state","name":"State machine DP","when":"On each day you are in one of a few modes, and the rules restrict moves between them.","tool":"one variable for each state, all updated per step","invariant":"each variable is the best result ending today in that state","cx":"O(n·states) time, O(states) space","code":"def max_profit_cooldown(prices):\n    hold, sold, rest = float(\"-inf\"), 0, 0\n    for p in prices:\n        hold, sold, rest = max(hold, rest - p), hold + p, max(rest, sold)\n    return max(sold, rest)","asks":["stock trading with cooldown","with a transaction fee","with at most k transactions","alternating sums or modes","flip at most one segment"],"examples":[{"n":"Best Time to Buy and Sell Stock II","s":"LC 122"},{"n":"Best Time to Buy and Sell Stock with Cooldown","s":"LC 309"},{"n":"Best Time to Buy and Sell Stock with Transaction Fee","s":"LC 714"},{"n":"Best Time to Buy and Sell Stock III","s":"LC 123"},{"n":"Best Time to Buy and Sell Stock IV","s":"LC 188"}],"traps":["Update all the states at once, from the previous day's values.","Draw the states and arrows first. The transitions then write themselves."],"keys":["cooldown","holding","transaction","buy and sell","at most k transactions","mode","must rest after"],"rare":false},{"id":"dp-partition","name":"Cut the string or array into pieces","when":"Split a sequence into consecutive pieces, each with a rule, and count or minimise.","tool":"dp[i] = answer for the first i items; try every last piece","invariant":"dp[i] is correct for each prefix before it is used","cx":"O(n²) or O(n·max piece)","code":"def word_break(s, words):\n    words = set(words)\n    dp = [True] + [False] * len(s)\n    for i in range(1, len(s) + 1):\n        for j in range(max(0, i - 20), i):   # 20 = the longest word\n            if dp[j] and s[j:i] in words:\n                dp[i] = True\n                break\n    return dp[-1]","asks":["word break","decode ways","fewest cuts into palindromes","split array into pieces of at most k, maximise the sum","fewest extra characters left over"],"examples":[{"n":"Word Break","s":"LC 139"},{"n":"Decode Ways","s":"LC 91"},{"n":"Palindrome Partitioning II","s":"LC 132"},{"n":"Partition Array for Maximum Sum","s":"LC 1043"},{"n":"Extra Characters in a String","s":"LC 2707"}],"traps":["dp has n+1 slots, and dp[0] is the empty prefix.","Decode ways: a '0' is never valid alone. That is the case to test."],"keys":["segment the string","split into","partition into","number of ways to decode","cuts","dictionary words","consecutive groups"],"rare":false}]},{"id":"dp-2d","group":"dp","name":"2-D dynamic programming","buys":"Branching recursion is exponential. Filling the table once instead gets it to O(n·m).","lives":"a grid, two sequences compared, or an item list against a budget","core":"The second dimension shows up for one of three reasons: you're moving on an actual grid, you're comparing TWO sequences (one index each), or you're tracking a BUDGET alongside your position. Name both axes in a sentence before writing anything — dp[i][j] = ... — and the transitions usually write themselves once you've done that.","recognise":[{"cue":"<b>grid</b>, and 'how many paths' or 'cheapest path'","note":"dp[r][c] from the top and the left"},{"cue":"<b>two strings</b> compared, matched or transformed","note":"dp[i][j] over the two prefixes"},{"cue":"<b>pick or skip</b> each item against a weight / sum budget","note":"0/1 knapsack"},{"cue":"<b>split the array into k parts</b>, 'burst / merge in some order'","note":"interval DP"},{"cue":"'the answer for a RANGE, built from smaller ranges'","note":"interval DP — loop by length"},{"cue":"count numbers <b>up to 10^18</b> with a <b>digit</b> rule","note":"digit DP"}],"notwhen":["Only one index really matters → you're carrying a dimension you don't need; shrink the state.","n·m is bigger than about 10⁸ → the table won't fit in the time budget; look for a greedy or a different state."],"pick":[{"if":"movement on a grid","then":"dp-grid"},{"if":"two sequences compared","then":"dp-twostring"},{"if":"items against a capacity or target, each usable once","then":"dp-knapsack"},{"if":"the answer for a range built from sub-ranges","then":"dp-interval"},{"if":"count numbers in a huge range by a digit rule","then":"dp-digit"}],"variants":[{"id":"dp-grid","name":"Grid paths & costs","when":"Move through a grid, usually only right and down.","tool":"dp[r][c] built from dp[r-1][c] and dp[r][c-1]","invariant":"every cell is final before any cell that depends on it is computed","cx":"O(rows · cols), reducible to O(cols) space with a rolling row","code":"def min_path_sum(g):\n    R, C = len(g), len(g[0])\n    dp = [[0] * C for _ in range(R)]\n    for r in range(R):\n        for c in range(C):\n            if r == 0 and c == 0: dp[r][c] = g[r][c]\n            elif r == 0:          dp[r][c] = dp[r][c-1] + g[r][c]      # top row: only from the left\n            elif c == 0:          dp[r][c] = dp[r-1][c] + g[r][c]      # left col: only from above\n            else:                 dp[r][c] = min(dp[r-1][c], dp[r][c-1]) + g[r][c]\n    return dp[R-1][C-1]","asks":["unique paths; unique paths II (with obstacles)","minimum path sum; maximum points / cherry pickup","triangle minimum path sum","dungeon game (fill BACKWARD from the princess — the direction is the trick)","maximal square / maximal rectangle of ones","count square submatrices with all ones","number of paths with a falling-path constraint","minimum falling path sum"],"examples":[{"n":"Unique Paths","s":"LC 62"},{"n":"Unique Paths II","s":"LC 63"},{"n":"Minimum Path Sum","s":"LC 64"},{"n":"Triangle","s":"LC 120"},{"n":"Maximal Square","s":"LC 221"},{"n":"Dungeon Game","s":"LC 174"},{"n":"Minimum Falling Path Sum","s":"LC 931"}],"traps":["Handle the first row and first column explicitly, or pad the table with a sentinel border. Half of grid-DP bugs live there.","Dungeon Game must be filled from the END backwards: health needed later changes what is safe now.","Maximal Square's transition is <code>min</code> of three neighbours plus one — not a sum.","An obstacle makes the cell 0 ways, which must not be confused with 'not computed yet'."],"rare":false,"keys":["only right or down","unique paths","minimum path sum","triangle","dungeon","maximal square"]},{"id":"dp-twostring","name":"Two sequences (LCS / edit distance)","when":"Two strings or arrays compared, matched, or transformed into each other.","tool":"dp[i][j] over the first i of one and the first j of the other; a padded row and column of zeros","invariant":"dp[i][j] only ever reads the cell diagonally up-left, up, and left","cx":"O(n·m) time, O(min(n,m)) space with a rolling row","code":"def lcs(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]     # the padding row/col IS the base case\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i-1] == b[j-1]:\n                dp[i][j] = dp[i-1][j-1] + 1        # match: consume both\n            else:\n                dp[i][j] = max(dp[i-1][j], dp[i][j-1])   # drop one or the other\n    return dp[n][m]\n\ndef edit_distance(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1): dp[i][0] = i            # delete everything\n    for j in range(m + 1): dp[0][j] = j            # insert everything\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i-1] == b[j-1]: dp[i][j] = dp[i-1][j-1]\n            else: dp[i][j] = 1 + min(dp[i-1][j-1],  # replace\n                                     dp[i-1][j],     # delete\n                                     dp[i][j-1])     # insert\n    return dp[n][m]","asks":["longest common subsequence; longest common substring (reset to 0 on a mismatch instead of taking a max)","edit distance; one edit distance away; delete operations to make two strings equal","distinct subsequences — count how many times t appears inside s","wildcard matching and regular expression matching","shortest common supersequence; minimum ASCII delete sum","interleaving string; is one string a subsequence of another","uncrossed lines (LCS wearing a different story)","longest palindromic subsequence (LCS of the string and its reverse)"],"examples":[{"n":"Longest Common Subsequence","s":"LC 1143"},{"n":"Edit Distance","s":"LC 72"},{"n":"Distinct Subsequences","s":"LC 115"},{"n":"Regular Expression Matching","s":"LC 10"},{"n":"Wildcard Matching","s":"LC 44"},{"n":"Interleaving String","s":"LC 97"},{"n":"Longest Palindromic Subsequence","s":"LC 516"}],"traps":["The index shift: dp[i][j] uses a[i-1] and b[j-1]. Mixing the two conventions is the classic off-by-one here.","SUBSTRING is not SUBSEQUENCE. A mismatch resets a substring run to zero; a subsequence takes the max.","Edit distance needs the first row and column pre-filled with 0..n and 0..m, not zeros.","Regex '*' matches zero or more of the PREVIOUS character — handle the zero case first and the rest follows."],"rare":false,"keys":["longest common subsequence","edit distance","insert, delete, replace","two strings","shortest common supersequence","distinct subsequences","wildcard matching"]},{"id":"dp-knapsack","name":"0/1 knapsack & subset sum","when":"Each item may be used AT MOST once, against a capacity or a target sum.","tool":"dp over capacity, looping the capacity BACKWARD so each item is used once","invariant":"when filling dp[t] for item i, dp already reflects items 0..i-1 only","cx":"O(items · capacity)","code":"def knapsack(weights, values, cap):\n    dp = [0] * (cap + 1)\n    for i in range(len(weights)):\n        for t in range(cap, weights[i] - 1, -1):   # BACKWARD -- the one-use guarantee\n            dp[t] = max(dp[t], dp[t - weights[i]] + values[i])\n    return dp[cap]\n\ndef can_partition(nums):                  # equal-sum halves\n    total = sum(nums)\n    if total % 2: return False            # odd total can never split evenly\n    target = total // 2\n    dp = [False] * (target + 1); dp[0] = True\n    for x in nums:\n        for t in range(target, x - 1, -1):\n            dp[t] = dp[t] or dp[t - x]\n    return dp[target]","asks":["partition equal subset sum; subset sum; target sum (assign + or − to each number)","last stone weight II (minimise the difference = partition as evenly as possible)","ones and zeroes (a knapsack with TWO capacities)","profitable schemes; number of subsets with a given sum","minimum difference between two subset sums","tallest billboard; 'split into two groups with the closest totals'","0/1 knapsack with a count limit (bounded knapsack — binary-split the copies)"],"examples":[{"n":"Partition Equal Subset Sum","s":"LC 416"},{"n":"Target Sum","s":"LC 494"},{"n":"Last Stone Weight II","s":"LC 1049"},{"n":"Ones and Zeroes","s":"LC 474"},{"n":"Profitable Schemes","s":"LC 879"}],"traps":["BACKWARD loop for 0/1, FORWARD for unbounded. This single direction is the difference between the two whole families.","An odd total means 'partition into equal halves' is instantly false — check it before building any table.","Target Sum converts to subset sum: picking a subset P to be positive means sum(P) = (total + target) / 2, and it must be a whole number.","Two capacities means two dimensions, both looped backward."],"rare":false,"keys":["each item once","subset sum","partition equal","capacity","target sum","0/1"]},{"id":"dp-interval","name":"Interval DP (build ranges from sub-ranges)","when":"The answer for a range depends on splitting it, and the order of operations matters.","tool":"loop by LENGTH, then by left end; try every split point inside","invariant":"all shorter ranges are already solved before any longer range is attempted","cx":"O(n³) — which is why n ≤ ~100–500 in these problems","code":"def burst_balloons(nums):\n    a = [1] + nums + [1]                 # virtual balloons at both ends\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]\n    for length in range(2, n):            # LENGTH outside -- the key loop order\n        for l in range(0, n - length):\n            r = l + length\n            for k in range(l + 1, r):     # k is the LAST balloon burst in (l, r)\n                dp[l][r] = max(dp[l][r],\n                               dp[l][k] + a[l]*a[k]*a[r] + dp[k][r])\n    return dp[0][n-1]","asks":["burst balloons; minimum cost to merge stones","palindrome partitioning II — fewest cuts","longest palindromic subsequence / substring (the range form)","matrix chain multiplication; minimum score triangulation of a polygon","stone game variants where you take from either end","remove boxes; strange printer","minimum cost to cut a stick"],"examples":[{"n":"Burst Balloons","s":"LC 312"},{"n":"Palindrome Partitioning II","s":"LC 132"},{"n":"Longest Palindromic Subsequence","s":"LC 516"},{"n":"Minimum Score Triangulation of Polygon","s":"LC 1039"},{"n":"Minimum Cost to Cut a Stick","s":"LC 1547"},{"n":"Stone Game","s":"LC 877"}],"traps":["Loop by LENGTH first. Iterating l and r in the natural order reads cells that have not been filled.","Burst Balloons only works if you think of k as the LAST balloon popped in the range, not the first. That reframing is the entire problem.","The virtual 1s at both ends remove every boundary check.","O(n³) with n = 500 is 125 million — borderline in Python, so check the bound first."],"rare":false,"keys":["burst balloons","matrix chain","merge stones","minimum cost to cut","palindromic subsequence","order of operations"]},{"id":"dp-digit","name":"Digit DP","when":"Count numbers in [L, R] whose digits satisfy a rule, where R may be 10^9 to 10^18.","tool":"recursion over positions with (pos, tight, state) memoised","invariant":"tight tracks whether the prefix still equals N's prefix","cx":"O(digits · 10 · states)","code":"from functools import lru_cache\n\ndef count_without_digit_4(n):            # how many of 0..n contain no digit 4\n    s = str(n)\n    @lru_cache(None)\n    def go(i, tight):\n        if i == len(s):\n            return 1\n        top = int(s[i]) if tight else 9\n        return sum(go(i + 1, tight and d == top) for d in range(top + 1) if d != 4)\n    return go(0, True)","asks":["how many numbers up to N have a digit rule","count of a digit across 1..N","numbers with unique or repeated digits","digit sum between limits"],"examples":[{"n":"Numbers At Most N Given Digit Set","s":"LC 902"},{"n":"Number of Digit One","s":"LC 233"},{"n":"Count Numbers with Unique Digits","s":"LC 357"},{"n":"Numbers With Repeated Digits","s":"LC 1012"}],"traps":["Answer for [L, R] = f(R) − f(L−1).","If leading zeros matter to the rule, add a 'started' flag to the state."],"keys":["count numbers between L and R","digits","up to 10^18","sum of digits","no two adjacent digits"],"rare":true}]},{"id":"backtracking","group":"search","name":"Backtracking (try, recurse, undo)","buys":"Nothing asymptotically — it IS the exponential blow-up. What it buys you is PRUNING and a clean way to enumerate.","lives":"subsets, permutations, combinations, board puzzles; n is always small","core":"One shape, three lines: choose, recurse, un-choose. The template never changes — only the loop bounds and the pruning test do. The constraint is the giveaway: n ≤ 10 means permutations are fine, n ≤ 20 means subsets are fine, and anything larger means this is the wrong pattern — you want DP or greedy instead.","recognise":[{"cue":"<b>all</b> subsets / permutations / combinations, print THEM not just the count","note":"you must enumerate"},{"cue":"<b>n ≤ 10 to 20</b> in the constraints","note":"exponential is affordable, and intended"},{"cue":"<b>board puzzle</b> — n-queens, sudoku, word search","note":"place, recurse, remove"},{"cue":"'<b>partition</b> into k groups', 'can these be split evenly'","note":"backtracking with pruning"},{"cue":"<b>palindrome partitioning</b>, 'all ways to split'","note":"cut, recurse on the rest"},{"cue":"<b>all the ways</b> to split a string","note":"backtrack over cut positions"},{"cue":"<b>generate all</b> strings of a shape","note":"build one character at a time"},{"cue":"<b>k groups</b> and very small n","note":"assign items to buckets"}],"notwhen":["You only need the COUNT or the BEST, not the full list → that's usually DP, and much faster.","n is large → 2ⁿ won't finish in time. Re-read the constraints; you have the wrong pattern."],"pick":[{"if":"subsets or combinations (order does not matter)","then":"bk-subsets"},{"if":"permutations (order matters)","then":"bk-perms"},{"if":"a grid or board to fill","then":"bk-board"},{"if":"list every way to cut a string","then":"bk-partition"},{"if":"generate all strings under a rule","then":"bk-build"},{"if":"put n items in k groups","then":"bk-bucket"}],"variants":[{"id":"bk-subsets","name":"Subsets & combinations","when":"Choose a set, where order does not matter.","tool":"a start index, so you never look backwards — that is what prevents duplicate sets","invariant":"every recursive call only considers items at or after `start`","cx":"O(2ⁿ · n) for subsets, O(C(n,k) · k) for combinations","code":"def subsets(nums):\n    out, cur = [], []\n    def go(start):\n        out.append(cur[:])                  # every node is an answer -- copy it\n        for i in range(start, len(nums)):\n            if i > start and nums[i] == nums[i-1]:\n                continue                     # skip duplicates (needs nums sorted)\n            cur.append(nums[i])\n            go(i + 1)                        # i+1: never reuse this item\n            cur.pop()                        # UNDO\n    go(0)\n    return out","asks":["subsets; subsets II (with duplicates)","combinations C(n, k); combination sum I / II / III","palindrome partitioning — every way to cut into palindromes","letter combinations of a phone number","partition to k equal sum subsets","generate parentheses (the choice is '(' or ')', with a validity rule)","beautiful arrangement; splitting a string into unique substrings"],"examples":[{"n":"Subsets","s":"LC 78"},{"n":"Subsets II","s":"LC 90"},{"n":"Combination Sum","s":"LC 39"},{"n":"Combination Sum II","s":"LC 40"},{"n":"Palindrome Partitioning","s":"LC 131"},{"n":"Generate Parentheses","s":"LC 22"},{"n":"Letter Combinations of a Phone Number","s":"LC 17"}],"traps":["Append a COPY (<code>cur[:]</code>). Appending the live list gives you a result full of identical empty lists.","<code>go(i + 1)</code> uses each item once; <code>go(i)</code> allows reuse. One character apart, two different problems.","Duplicate skipping needs the input SORTED, and the test is <code>i > start</code>, not <code>i > 0</code>.","Prune early: if the running sum already exceeds the target, return instead of recursing."],"rare":false,"keys":["all subsets","all combinations","combination sum","power set","choose k"]},{"id":"bk-perms","name":"Permutations","when":"Order matters — arrangements, not selections.","tool":"a used[] flag array (or swap in place); every unused item is a candidate at every depth","invariant":"cur always holds a valid partial arrangement with no repeats","cx":"O(n! · n)","code":"def permute(nums):\n    nums.sort()                             # needed for duplicate skipping\n    out, cur = [], []\n    used = [False] * len(nums)\n    def go():\n        if len(cur) == len(nums):\n            out.append(cur[:]); return\n        for i in range(len(nums)):\n            if used[i]: continue\n            if i > 0 and nums[i] == nums[i-1] and not used[i-1]:\n                continue                     # the duplicate rule for permutations\n            used[i] = True;  cur.append(nums[i])\n            go()\n            cur.pop();       used[i] = False\n    go()\n    return out","asks":["permutations; permutations II (with duplicates)","next permutation (the O(n) in-place trick, not backtracking)","n-queens, counted or listed","letter case permutation; string permutations","the travelling salesman for n ≤ 10 (brute force before you reach for bitmask DP)","matchsticks to square; fair distribution of cookies"],"examples":[{"n":"Permutations","s":"LC 46"},{"n":"Permutations II","s":"LC 47"},{"n":"Next Permutation","s":"LC 31"},{"n":"Letter Case Permutation","s":"LC 784"},{"n":"Matchsticks to Square","s":"LC 473"}],"traps":["The duplicate rule here (<code>not used[i-1]</code>) differs from the subsets rule. Memorise both; they are not interchangeable.","Reset BOTH the flag and the list on the way out, in the reverse order you set them.","n = 11 already gives 40 million permutations. Check the bound before writing this."],"rare":false,"keys":["all permutations","all arrangements","next arrangement","order matters"]},{"id":"bk-board","name":"Board / grid filling","when":"Place things on a grid under constraints.","tool":"place a mark, recurse, remove the mark; keep fast 'is this legal' sets","invariant":"the board is always in a legal state when you recurse, and restored when you return","cx":"exponential, but pruning makes it tractable","code":"def solve_n_queens(n):\n    cols, diag, anti = set(), set(), set()\n    board, out = [], []\n    def go(r):\n        if r == n:\n            out.append(board[:]); return\n        for c in range(n):\n            if c in cols or (r - c) in diag or (r + c) in anti:\n                continue                     # O(1) legality test -- this is the pruning\n            cols.add(c); diag.add(r - c); anti.add(r + c); board.append(c)\n            go(r + 1)\n            board.pop(); anti.discard(r + c); diag.discard(r - c); cols.discard(c)\n    go(0)\n    return out","asks":["n-queens I and II","sudoku solver; valid sudoku","word search (one word) and word search II (with a trie)","rat in a maze, all paths through a grid","unique paths III — walk over every empty square exactly once","flood a grid under constraints; 'number of ways to colour'"],"examples":[{"n":"N-Queens","s":"LC 51"},{"n":"N-Queens II","s":"LC 52"},{"n":"Sudoku Solver","s":"LC 37"},{"n":"Word Search","s":"LC 79"},{"n":"Unique Paths III","s":"LC 980"}],"traps":["Diagonals are identified by <code>r - c</code> and anti-diagonals by <code>r + c</code>. That turns the legality test into O(1) and is the whole reason n-queens finishes.","Restore the board EXACTLY, in reverse order. A missed restore corrupts every later branch silently.","Word Search must mark the current cell before recursing and unmark after, or a path reuses a letter."],"rare":false,"keys":["N-Queens","sudoku","word search","rat in a maze","place on the board"]},{"id":"bk-partition","name":"Split a string every valid way","when":"Return all the ways to cut a string into valid pieces.","tool":"a start index and a list of pieces so far","invariant":"the pieces so far exactly spell s[0..start)","cx":"exponential, O(n·2^n) worst case","code":"def palindrome_partitions(s):\n    out, cur = [], []\n    def go(start):\n        if start == len(s):\n            out.append(cur[:])\n            return\n        for end in range(start + 1, len(s) + 1):\n            piece = s[start:end]\n            if piece == piece[::-1]:\n                cur.append(piece)\n                go(end)\n                cur.pop()\n    go(0)\n    return out","asks":["all palindrome partitions","all valid IP addresses from digits","maximum count of unique pieces","all sentences from a dictionary"],"examples":[{"n":"Palindrome Partitioning","s":"LC 131"},{"n":"Restore IP Addresses","s":"LC 93"},{"n":"Split a String Into the Max Number of Unique Substrings","s":"LC 1593"}],"traps":["'All the ways' means backtrack. 'How many' or 'minimum' is usually DP."],"keys":["all possible partitions","all ways to split","every valid way to segment","restore","list all"],"rare":false},{"id":"bk-build","name":"Build a string under a rule","when":"Generate all strings of a fixed shape, one character at a time.","tool":"the string built so far and the remaining budget","invariant":"every prefix built can still be completed validly","cx":"exponential in the output length","code":"def generate_parens(n):\n    out = []\n    def go(cur, opens, closes):\n        if len(cur) == 2 * n:\n            out.append(cur)\n            return\n        if opens < n:\n            go(cur + \"(\", opens + 1, closes)\n        if closes < opens:\n            go(cur + \")\", opens, closes + 1)\n    go(\"\", 0, 0)\n    return out","asks":["all valid parentheses","phone keypad letters","strings with letter case changes","k-th happy string"],"examples":[{"n":"Letter Combinations of a Phone Number","s":"LC 17"},{"n":"Generate Parentheses","s":"LC 22"},{"n":"Letter Case Permutation","s":"LC 784"},{"n":"The k-th Lexicographical String of All Happy Strings of Length n","s":"LC 1415"}],"traps":["Prune while building, not after. Generating everything and filtering will time out."],"keys":["generate all","all combinations of letters","valid strings of length n","phone keypad"],"rare":false},{"id":"bk-bucket","name":"Assign items to k buckets","when":"Split n items (n ≤ ~16) into k groups to balance them or make them equal.","tool":"a bucket array, trying each item in each bucket","invariant":"each bucket's total never exceeds the limit","cx":"O(k^n) with heavy pruning","code":"def can_partition_k(nums, k):\n    total = sum(nums)\n    if total % k:\n        return False\n    target = total // k\n    nums.sort(reverse=True)              # biggest first fails fastest\n    buckets = [0] * k\n    def go(i):\n        if i == len(nums):\n            return True\n        for b in range(k):\n            if buckets[b] + nums[i] <= target:\n                buckets[b] += nums[i]\n                if go(i + 1):\n                    return True\n                buckets[b] -= nums[i]\n            if buckets[b] == 0:          # empty buckets are all the same\n                break\n        return False\n    return go(0)","asks":["partition into k equal-sum subsets","form a square from matchsticks","share jobs among k workers, minimise the maximum","fair distribution of cookies"],"examples":[{"n":"Partition to K Equal Sum Subsets","s":"LC 698"},{"n":"Matchsticks to Square","s":"LC 473"},{"n":"Find Minimum Time to Finish All Jobs","s":"LC 1723"},{"n":"Fair Distribution of Cookies","s":"LC 2305"}],"traps":["Both prunes matter: sort descending, and stop after trying one empty bucket."],"keys":["k subsets","k groups","k workers","distribute among","n ≤ 16","equal sum"],"rare":false}]},{"id":"greedy","group":"search","name":"Greedy (one pass, locally best)","buys":"Replaces an O(2ⁿ) search or an O(n²) DP with O(n log n) — usually just a sort and one pass.","lives":"anything where a local choice provably cannot hurt the future","core":"Greedy is the cheapest pattern to code, and the easiest to get silently wrong. The whole game is the JUSTIFICATION: you must be able to say, in one sentence, why taking the best thing right now never costs you later (the exchange argument). If you can't say that sentence, write the DP instead — a greedy that passes the samples but fails the hidden tests is the costliest mistake you can make in an OA.","recognise":[{"cue":"<b>sort first</b>, then one pass, and the choice is obvious","note":"the classic shape"},{"cue":"<b>maximum number of non-overlapping</b> / fewest removals","note":"sort by END time"},{"cue":"<b>can you reach</b> the end, 'is it possible'","note":"track the FURTHEST reach"},{"cue":"<b>always serve the most urgent / cheapest next</b>","note":"greedy driven by a heap"},{"cue":"<b>two ends</b>, pair the biggest with the smallest","note":"sort + two pointers"},{"cue":"constraints against <b>both neighbours</b>","note":"one pass each way"},{"cue":"a <b>running balance</b> that must stay non-negative","note":"counter with a reset"}],"notwhen":["A choice now can make a LATER choice impossible in a way you can't bound → use DP.","Coin change with arbitrary denominations — the classic greedy TRAP. Taking the biggest coin first fails on coins [1, 3, 4] with amount 6 (greedy gives 4+1+1 = 3 coins, optimal is 3+3 = 2). Use DP.","You need the count of ways, not just one best answer → use DP."],"pick":[{"if":"'can I get to the end' / reachability","then":"gr-reach"},{"if":"pair items from both ends after sorting","then":"gr-pair"},{"if":"spend a budget on the most valuable thing each step","then":"gr-local"},{"if":"each position is constrained by both neighbours","then":"gr-twopass"},{"if":"a running total must stay non-negative","then":"gr-balance"}],"variants":[{"id":"gr-reach","name":"Furthest reach","when":"'Can you reach the end', or 'fewest jumps / refuels / taps'.","tool":"one variable: the furthest index reachable so far","invariant":"every index up to `reach` is reachable, so if i ever passes reach you are stuck","cx":"O(n) time, O(1) space","code":"def can_jump(nums):\n    reach = 0\n    for i, x in enumerate(nums):\n        if i > reach:\n            return False                 # a gap you cannot cross\n        reach = max(reach, i + x)        # the only state you need\n    return True\n\ndef min_jumps(nums):                     # fewest jumps: BFS-by-level, without a queue\n    jumps = cur_end = furthest = 0\n    for i in range(len(nums) - 1):\n        furthest = max(furthest, i + nums[i])\n        if i == cur_end:                 # the current jump's range is exhausted\n            jumps += 1\n            cur_end = furthest\n    return jumps","asks":["jump game I (can you reach the end) and II (fewest jumps)","gas station — the unique valid start","minimum number of taps to water a garden; video stitching","minimum number of refuelling stops (heap-greedy)","maximum distance you can travel, 'furthest building with ladders and bricks'","can place flowers; candy distribution"],"examples":[{"n":"Jump Game","s":"LC 55"},{"n":"Jump Game II","s":"LC 45"},{"n":"Gas Station","s":"LC 134"},{"n":"Minimum Number of Taps to Open to Water a Garden","s":"LC 1326"},{"n":"Video Stitching","s":"LC 1024"},{"n":"Minimum Number of Refueling Stops","s":"LC 871"}],"traps":["Jump Game II's loop stops at <code>len-1</code>. Including the last index counts one jump too many.","Gas Station: if the total gas is less than the total cost there is NO answer; otherwise the answer is the index right after the lowest running deficit.","'Fewest jumps' is really BFS by level — recognising that explains why the two variables are named end and furthest."],"rare":false,"keys":["jump game","can you reach the end","minimum jumps","minimum refuels","tap watering"]},{"id":"gr-pair","name":"Sort, then pair from the ends","when":"Match items against each other to minimise count or maximise value.","tool":"sort, then two pointers from both ends","invariant":"the current extremes are always each other's best available partner","cx":"O(n log n)","code":"def num_rescue_boats(people, limit):\n    people.sort()\n    l, r, boats = 0, len(people) - 1, 0\n    while l <= r:\n        if people[l] + people[r] <= limit:\n            l += 1                        # the lightest rides along with the heaviest\n        r -= 1                             # the heaviest always leaves, alone or paired\n        boats += 1\n    return boats","asks":["boats to save people","assign cookies to children; two city scheduling","maximum number of pairs under a sum limit","minimise the maximum pair sum in an array","advantage shuffle (play your weakest card that still beats theirs)","array partition, maximum sum of min pairs"],"examples":[{"n":"Boats to Save People","s":"LC 881"},{"n":"Assign Cookies","s":"LC 455"},{"n":"Minimize Maximum Pair Sum in Array","s":"LC 1877"},{"n":"Two City Scheduling","s":"LC 1029"},{"n":"Advantage Shuffle","s":"LC 870"}],"traps":["The heaviest person always leaves on this trip — so <code>r</code> decrements unconditionally, while <code>l</code> only advances if the pairing fits.","<code>while l &lt;= r</code>, so the middle person still gets a boat.","Two City Scheduling sorts by the DIFFERENCE between the two costs, not by either cost."],"rare":false,"keys":["boats","pair the heaviest with the lightest","assign cookies","minimum number of boats","match from both ends"]},{"id":"gr-local","name":"Spend the budget on the best thing now","when":"A sequence of steps, each consuming a resource, where the best immediate value is provably safe.","tool":"sort or a heap, plus a running budget; sometimes a swap-out when something better appears","invariant":"the set you hold is the best possible set of its size for the prefix seen so far","cx":"O(n log n)","code":"import heapq\ndef max_events(events):                  # attend the most events, one per day\n    events.sort()                        # by start day\n    h, day, i, count = [], 0, 0, 0\n    while h or i < len(events):\n        if not h:\n            day = max(day, events[i][0])\n        while i < len(events) and events[i][0] <= day:\n            heapq.heappush(h, events[i][1]); i += 1     # all events open today\n        heapq.heappop(h)                 # attend the one ending SOONEST\n        count += 1; day += 1\n        while h and h[0] < day:\n            heapq.heappop(h)             # expired, can never be attended\n    return count","asks":["maximum number of events that can be attended","task scheduler with cooldown; reorganise string","IPO — maximise capital with k projects","course schedule III — take the most courses before their deadlines (swap out the longest)","minimum cost to hire k workers; maximum performance of a team","candy, partition labels, remove k digits (the stack form)","largest number from a list (custom comparator)"],"examples":[{"n":"Maximum Number of Events That Can Be Attended","s":"LC 1353"},{"n":"Task Scheduler","s":"LC 621"},{"n":"IPO","s":"LC 502"},{"n":"Course Schedule III","s":"LC 630"},{"n":"Maximum Performance of a Team","s":"LC 1383"},{"n":"Candy","s":"LC 135"}],"traps":["'Swap out the worst thing I already took' (Course Schedule III) is a greedy that needs a heap — a plain sort cannot undo a choice.","Say the exchange argument out loud before coding. If you cannot, write the DP.","Sorting by the wrong key is the usual failure, and it still passes the samples. Decide the key from the proof, not from the example."],"rare":false,"keys":["maximise profit by choosing","IPO","at each step take the best","best immediate","task with deadlines"]},{"id":"gr-twopass","name":"Left pass, right pass","when":"Each position has constraints against both of its neighbours.","tool":"one pass applying the left rule, a second applying the right","invariant":"after both passes, both neighbour rules hold","cx":"O(n) time, O(n) space","code":"def candy(ratings):\n    n = len(ratings)\n    c = [1] * n\n    for i in range(1, n):\n        if ratings[i] > ratings[i - 1]:\n            c[i] = c[i - 1] + 1\n    for i in range(n - 2, -1, -1):\n        if ratings[i] > ratings[i + 1]:\n            c[i] = max(c[i], c[i + 1] + 1)\n    return sum(c)","asks":["candy distribution by ratings","dominoes falling from both sides","distance to the nearest character","moves to bring all balls to each box"],"examples":[{"n":"Candy","s":"LC 135"},{"n":"Push Dominoes","s":"LC 838"},{"n":"Shortest Distance to a Character","s":"LC 821"},{"n":"Minimum Number of Operations to Move All Balls to Each Box","s":"LC 1769"}],"traps":["The second pass must take the max, so it keeps what the first established."],"keys":["higher than its neighbours","both neighbours","left and right","nearest on either side"],"rare":false},{"id":"gr-balance","name":"Running balance","when":"A running total must never go negative, or must end at zero.","tool":"one counter updated per element, with a reset or fix when it breaks","invariant":"the counter equals the surplus so far","cx":"O(n) time, O(1) space","code":"def can_complete_circuit(gas, cost):\n    if sum(gas) < sum(cost):\n        return -1\n    start, tank = 0, 0\n    for i in range(len(gas)):\n        tank += gas[i] - cost[i]\n        if tank < 0:                     # nothing up to i can be the start\n            start, tank = i + 1, 0\n    return start","asks":["gas station circuit","fewest insertions to balance brackets","valid parentheses with wildcards (track a min and max balance)","fewest swaps to balance"],"examples":[{"n":"Gas Station","s":"LC 134"},{"n":"Minimum Add to Make Parentheses Valid","s":"LC 921"},{"n":"Valid Parenthesis String","s":"LC 678"},{"n":"Minimum Number of Swaps to Make the String Balanced","s":"LC 1963"}],"traps":["Gas station: total gas < total cost means no answer, whatever the start."],"keys":["never goes negative","balance","circular route","fuel","starting point","minimum to make valid"],"rare":false}]},{"id":"sort-dc","group":"linear","name":"Sorting algorithms & divide and conquer","buys":"Sorting internals answer questions that a library sort cannot: counts during a merge, or the k-th element in linear time.","lives":"arrays","core":"A library sort gives you only the final order. When the question needs something that happens DURING the sort (how many pairs crossed over) or needs less than a full sort (only the k-th), use the algorithm itself.","recognise":[{"cue":"<b>inversions</b>, 'how many smaller to the right'","note":"count during merge sort"},{"cue":"<b>k-th largest</b> with O(n) average expected","note":"quickselect"},{"cue":"values in a <b>small range</b>, or 'O(n), no comparison sort'","note":"counting or bucket sort"},{"cue":"solve the left half, solve the right, <b>combine</b>","note":"divide and conquer"}],"notwhen":["The final sorted order is all you need → call the library sort."],"pick":[{"if":"count pairs (i<j) with a relation
