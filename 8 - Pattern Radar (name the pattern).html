 across the array","then":"dc-mergecount"},{"if":"only the k-th element matters","then":"dc-quickselect"},{"if":"the value range is small or a frequency decides the order","then":"dc-bucket"},{"if":"the answer combines two halves","then":"dc-split"}],"variants":[{"id":"dc-mergecount","name":"Count during merge sort","when":"Count pairs i<j with a relation, such as a[i] > a[j]. n is too big for O(n²).","tool":"merge sort; at each merge, count the pairs crossing between halves","invariant":"each half is sorted, so crossing pairs are counted in one sweep","cx":"O(n log n) time, O(n) space","code":"def count_inversions(a):\n    def sort(lo, hi):\n        if hi - lo < 2:\n            return 0\n        mid = (lo + hi) // 2\n        count = sort(lo, mid) + sort(mid, hi)\n        merged, i, j = [], lo, mid\n        while i < mid or j < hi:\n            if j == hi or (i < mid and a[i] <= a[j]):\n                merged.append(a[i]); i += 1\n            else:\n                count += mid - i             # every remaining left value is bigger\n                merged.append(a[j]); j += 1\n        a[lo:hi] = merged\n        return count\n    return sort(0, len(a))","asks":["count inversions","how many smaller numbers after each element","reverse pairs with a[i] > 2·a[j]","range sums falling within limits"],"examples":[{"n":"Sort an Array","s":"LC 912"},{"n":"Count of Smaller Numbers After Self","s":"LC 315"},{"n":"Reverse Pairs","s":"LC 493"},{"n":"Count of Range Sum","s":"LC 327"}],"traps":["With a condition unlike the merge order (2·a[j]), count in a separate sweep before merging.","Use a Fenwick tree as the alternative when values can be compressed."],"keys":["inversions","number of smaller elements to the right","pairs i < j with","how far from sorted"],"rare":false},{"id":"dc-quickselect","name":"Quickselect","when":"You want only the k-th largest or smallest, not the whole order.","tool":"partition around a random pivot, recurse into one side","invariant":"after a partition the pivot sits in its final position","cx":"O(n) average, O(n²) worst","code":"import random\n\ndef kth_largest(nums, k):\n    target = len(nums) - k\n    lo, hi = 0, len(nums) - 1\n    while True:\n        p = random.randint(lo, hi)\n        nums[p], nums[hi] = nums[hi], nums[p]\n        store = lo\n        for i in range(lo, hi):\n            if nums[i] < nums[hi]:\n                nums[i], nums[store] = nums[store], nums[i]\n                store += 1\n        nums[store], nums[hi] = nums[hi], nums[store]\n        if store == target:\n            return nums[store]\n        if store < target:\n            lo = store + 1\n        else:\n            hi = store - 1","asks":["k-th largest element","k closest points","median in expected linear time"],"examples":[{"n":"Kth Largest Element in an Array","s":"LC 215"},{"n":"K Closest Points to Origin","s":"LC 973"},{"n":"Wiggle Sort II","s":"LC 324"}],"traps":["Use a random pivot, or sorted input hits the O(n²) worst case.","In an exam, a heap or sort is usually accepted and safer."],"keys":["k-th largest","k-th smallest","without sorting","median","k closest"],"rare":false},{"id":"dc-bucket","name":"Counting and bucket sort","when":"The values lie in a small range, or the index itself can be a frequency.","tool":"an array of counts or buckets indexed by value","invariant":"bucket b holds exactly the items that map to b","cx":"O(n + range)","code":"def top_k_frequent(nums, k):\n    freq = {}\n    for x in nums:\n        freq[x] = freq.get(x, 0) + 1\n    buckets = [[] for _ in range(len(nums) + 1)]   # index = frequency\n    for x, c in freq.items():\n        buckets[c].append(x)\n    out = []\n    for c in range(len(nums), 0, -1):\n        out += buckets[c]\n        if len(out) >= k:\n            return out[:k]","asks":["sort by frequency","h-index","maximum gap in linear time","top k frequent in O(n)","sort a string of lowercase letters"],"examples":[{"n":"H-Index","s":"LC 274"},{"n":"Maximum Gap","s":"LC 164"},{"n":"Sort Characters By Frequency","s":"LC 451"},{"n":"Top K Frequent Elements","s":"LC 347"}],"traps":["Only useful when the range is small compared with n.","Frequency is at most n, so n+1 buckets are always enough."],"keys":["lowercase letters only","values from 1 to 100","sort by frequency","linear time sort","O(n) without comparison"],"rare":false},{"id":"dc-split","name":"Divide and conquer","when":"The answer for a range can be built from the answers for two halves.","tool":"a recursive function on (lo, hi) and a combine step","invariant":"each half is solved independently","cx":"usually O(n log n)","code":"def diff_ways(expr):\n    if expr.isdigit():\n        return [int(expr)]\n    out = []\n    for i, ch in enumerate(expr):\n        if ch in \"+-*\":\n            for a in diff_ways(expr[:i]):\n                for b in diff_ways(expr[i + 1:]):\n                    out.append(a + b if ch == \"+\" else a - b if ch == \"-\" else a * b)\n    return out","asks":["all results of adding parentheses","balanced BST from a sorted array","sort a linked list","closest pair idea","build a permutation with a structural property"],"examples":[{"n":"Different Ways to Add Parentheses","s":"LC 241"},{"n":"Convert Sorted Array to Binary Search Tree","s":"LC 108"},{"n":"Sort List","s":"LC 148"},{"n":"Beautiful Array","s":"LC 932"}],"traps":["Memoise if the same range repeats. It then becomes interval DP."],"keys":["split in half","left half and right half","every way of parenthesising","recursively divide"],"rare":false}]},{"id":"math","group":"maths","name":"Maths & number theory","buys":"A formula turns an impossible loop into one line.","lives":"integers, usually huge limits with a modulo","core":"Answers 'modulo 1e9+7', limits up to 10^18, and words like prime, divisor, GCD or arrangements are all signs that the question is really one of a few standard formulas.","recognise":[{"cue":"<b>modulo 1e9+7</b>, huge exponent","note":"fast power"},{"cue":"<b>prime, factors, divisors</b>","note":"sieve or trial division"},{"cue":"<b>GCD, LCM</b>, 'equal groups', 'divides all'","note":"Euclid"},{"cue":"<b>number of ways to arrange / choose</b>","note":"nCr"},{"cue":"<b>digits</b>, reverse a number, big-number strings","note":"digit walking"},{"cue":"two players <b>play optimally</b>","note":"parity, game observation"},{"cue":"<b>points, lines, rectangles</b>","note":"coordinate geometry"}],"notwhen":["The count of ways depends on earlier choices with restrictions → it is DP rather than a formula."],"pick":[{"if":"GCD, LCM, equal grouping","then":"ma-gcd"},{"if":"primes or factors","then":"ma-sieve"},{"if":"powers, or anything modulo a prime","then":"ma-modpow"},{"if":"count of arrangements or selections","then":"ma-ncr"},{"if":"work on the digits of a number","then":"ma-digits"},{"if":"two players, or a pattern in small cases","then":"ma-game"},{"if":"points and shapes","then":"ma-geom"}],"variants":[{"id":"ma-gcd","name":"GCD and LCM","when":"Something must divide everything equally, or two periods must line up.","tool":"Euclid's algorithm","invariant":"gcd(a, b) = gcd(b, a mod b)","cx":"O(log min(a, b))","code":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\ndef lcm(a, b):\n    return a // gcd(a, b) * b        # divide first to avoid overflow","asks":["GCD of an array","can everything be split into equal groups","when two cycles coincide (LCM)","count subarrays with GCD = k","is target reachable with two jugs (target divisible by gcd)"],"examples":[{"n":"Greatest Common Divisor of Strings","s":"LC 1071"},{"n":"X of a Kind in a Deck of Cards","s":"LC 914"},{"n":"Water and Jug Problem","s":"LC 365"},{"n":"Nth Magical Number","s":"LC 878"},{"n":"Number of Subarrays With GCD Equal to K","s":"LC 2447"}],"traps":["GCD of many numbers: fold from the left; it shrinks quickly.","Slope as a fraction: divide dx and dy by their GCD."],"keys":["GCD","HCF","LCM","greatest common","divides all","equal groups","coincide again","at the same time again"],"rare":false},{"id":"ma-sieve","name":"Primes and factorisation","when":"The question is about primes, prime factors or the count of divisors.","tool":"a sieve array, or trial division up to √n","invariant":"every composite is crossed out by its smallest prime factor","cx":"sieve O(n log log n); trial division O(√n)","code":"def sieve(n):\n    is_prime = [True] * (n + 1)\n    is_prime[0:2] = [False, False][: n + 1]\n    i = 2\n    while i * i <= n:\n        if is_prime[i]:\n            for m in range(i * i, n + 1, i):\n                is_prime[m] = False\n        i += 1\n    return [i for i, p in enumerate(is_prime) if p]\n\ndef factorise(x):\n    out, p = {}, 2\n    while p * p <= x:\n        while x % p == 0:\n            out[p] = out.get(p, 0) + 1\n            x //= p\n        p += 1\n    if x > 1:\n        out[x] = out.get(x, 0) + 1\n    return out","asks":["count primes below n","prime factors of each number","number of divisors","primes in a range","connect numbers sharing a factor (with DSU)","Euler totient"],"examples":[{"n":"Count Primes","s":"LC 204"},{"n":"Largest Component Size by Common Factor","s":"LC 952"},{"n":"Distinct Prime Factors of Product of Array","s":"LC 2521"},{"n":"Closest Prime Numbers in Range","s":"LC 2523"}],"traps":["1 is not prime.","Start crossing out at i×i.","After trial division, a leftover x > 1 is itself a prime factor."],"keys":["prime","divisors","factors","co-prime","perfect square","semi-prime"],"rare":false},{"id":"ma-modpow","name":"Fast power and modular arithmetic","when":"A huge exponent, or an answer given modulo a prime.","tool":"square-and-multiply; apply the modulo at each step","invariant":"result × base^n stays equal to the true answer","cx":"O(log n)","code":"MOD = 10**9 + 7\n\ndef power(base, n, mod=MOD):\n    result = 1\n    base %= mod\n    while n:\n        if n & 1:\n            result = result * base % mod\n        base = base * base % mod\n        n >>= 1\n    return result\n\ndef inverse(a, mod=MOD):             # division under a prime modulus\n    return power(a, mod - 2, mod)","asks":["compute x^n","count of strings of length n by digit rules","division under a modulo","polygon or circular arrangement counts","matrix power for a recurrence with huge n"],"examples":[{"n":"Pow(x, n)","s":"LC 50"},{"n":"Super Pow","s":"LC 372"},{"n":"Count Good Numbers","s":"LC 1922"},{"n":"Count Collisions of Monkeys on a Polygon","s":"LC 2550"}],"traps":["You cannot divide under a modulus. Multiply by the inverse instead.","A subtraction can go negative: write <code>(a - b + MOD) % MOD</code>.","In Python, <code>pow(a, n, MOD)</code> is built in."],"keys":["modulo 10^9+7","1e9+7","answer may be large","raise to the power","n up to 10^18"],"rare":false},{"id":"ma-ncr","name":"Combinatorics (nCr)","when":"Count arrangements or selections where there are no sequential restrictions.","tool":"precomputed factorials and inverse factorials","invariant":"nCr = n! / (r! (n−r)!)","cx":"O(n) precompute, O(1) per query","code":"MOD = 10**9 + 7\n\ndef build(n):\n    fact = [1] * (n + 1)\n    for i in range(1, n + 1):\n        fact[i] = fact[i - 1] * i % MOD\n    inv = [1] * (n + 1)\n    inv[n] = pow(fact[n], MOD - 2, MOD)\n    for i in range(n, 0, -1):\n        inv[i - 1] = inv[i] * i % MOD\n    def ncr(a, b):\n        if b < 0 or b > a:\n            return 0\n        return fact[a] * inv[b] % MOD * inv[a - b] % MOD\n    return ncr","asks":["paths in a grid by formula","ways to reach a position in k steps","arrangements with repeated items (n!/a!b!)","distributing identical items (stars and bars)","Pascal's triangle"],"examples":[{"n":"Unique Paths","s":"LC 62"},{"n":"Pascal's Triangle","s":"LC 118"},{"n":"Number of Ways to Reach a Position After Exactly k Steps","s":"LC 2400"},{"n":"Count All Valid Pickup and Delivery Options","s":"LC 1359"}],"traps":["Precompute up to the largest n once, not per query.","Inclusion-exclusion: total minus the bad arrangements is often easier."],"keys":["number of ways to choose","arrangements","permutations of","how many ways to distribute","select r from n"],"rare":false},{"id":"ma-digits","name":"Digit walking and big numbers","when":"You work on individual digits, or numbers too large for an integer type.","tool":"%10 and //10, or a carry over strings","invariant":"the number so far equals the digits consumed so far","cx":"O(digits)","code":"def add_strings(a, b):\n    i, j, carry, out = len(a) - 1, len(b) - 1, 0, []\n    while i >= 0 or j >= 0 or carry:\n        d = carry\n        if i >= 0:\n            d += int(a[i]); i -= 1\n        if j >= 0:\n            d += int(b[j]); j -= 1\n        out.append(str(d % 10))\n        carry = d // 10\n    return \"\".join(reversed(out))","asks":["reverse an integer","palindrome number","digit sum, digital root","happy number (cycle detection)","add or multiply numbers held as strings","base conversion"],"examples":[{"n":"Reverse Integer","s":"LC 7"},{"n":"Palindrome Number","s":"LC 9"},{"n":"Add Digits","s":"LC 258"},{"n":"Happy Number","s":"LC 202"},{"n":"Multiply Strings","s":"LC 43"},{"n":"Add Binary","s":"LC 67"}],"traps":["Watch for overflow in Java and C++ when reversing.","Remember the final carry."],"keys":["digit","sum of digits","reverse the number","as a string","binary string","base"],"rare":false},{"id":"ma-game","name":"Observation and games","when":"Two players play optimally, or a process looks random but small cases show a pattern.","tool":"work out n = 1..10 by hand and look for the pattern","invariant":"the outcome depends only on a simple quantity (parity, n mod k)","cx":"usually O(1)","code":"def nim_game(n):                     # take 1..3 stones: multiples of 4 lose\n    return n % 4 != 0\n\ndef bulbs_on(n):                     # a bulb is toggled once per divisor\n    return int(n ** 0.5)             # only perfect squares have odd divisors","asks":["who wins with optimal play","XOR of pile sizes decides Nim","toggling bulbs by divisors","parity of a total decides feasibility"],"examples":[{"n":"Nim Game","s":"LC 292"},{"n":"Bulb Switcher","s":"LC 319"},{"n":"Divisor Game","s":"LC 1025"},{"n":"Stone Game","s":"LC 877"}],"traps":["Never guess from 2 or 3 cases. Check at least to n = 10.","Many piles: the first player wins if the XOR of all piles is non-zero."],"keys":["play optimally","Alice and Bob","who wins","take turns","toggle","first player"],"rare":false},{"id":"ma-geom","name":"Basic coordinate geometry","when":"Points, lines or rectangles on a plane.","tool":"cross products, slopes as reduced fractions, interval overlap per axis","invariant":"two rectangles overlap iff they overlap on both axes","cx":"O(n) to O(n²)","code":"def rect_overlap(a, b):              # (x1, y1, x2, y2)\n    return min(a[2], b[2]) > max(a[0], b[0]) and min(a[3], b[3]) > max(a[1], b[1])\n\ndef cross(o, a, b):                  # > 0 means a left turn\n    return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])","asks":["do two rectangles overlap","most points on one line","is it a valid square","area and perimeter by formula","convex hull"],"examples":[{"n":"Rectangle Overlap","s":"LC 836"},{"n":"Max Points on a Line","s":"LC 149"},{"n":"Valid Square","s":"LC 593"},{"n":"Erect the Fence","s":"LC 587"}],"traps":["Never store slopes as floats. Use a (dy, dx) pair reduced by the GCD.","Check whether touching at an edge counts as overlap."],"keys":["points on a plane","coordinates","rectangle","lie on the same line","distance between points"],"rare":true}]},{"id":"design","group":"design","name":"Design a data structure","buys":"Each operation hits its required speed by joining two simple structures, each covering the other's weakness.","lives":"a class with several methods","core":"The statement gives you methods and says O(1) or O(log n). Ask: what lookup do I need, and what order do I need? A hashmap gives lookup. A list, heap or second stack gives order. The answer is nearly always both together.","recognise":[{"cue":"<b>LRU, LFU</b>, 'evict the least recently used'","note":"hashmap + doubly linked list"},{"cue":"stack or queue that also reports <b>min / max / frequency</b>","note":"store extra data per entry"},{"cue":"implement a <b>queue using stacks</b>, circular buffer","note":"two stacks, or a ring"},{"cue":"insert, delete, <b>getRandom in O(1)</b>","note":"array + value→index map"},{"cue":"<b>timestamp</b>, 'value at time t', snapshots","note":"sorted history + binary search"},{"cue":"<b>next() / hasNext()</b>","note":"iterator with a stack"}],"notwhen":["The question has one function and no 'implement the class' → look at the other patterns."],"pick":[{"if":"evict by least recent or least frequent","then":"ds-lru"},{"if":"stack with a min / max / frequency","then":"ds-aux"},{"if":"build one container from another","then":"ds-queue"},{"if":"uniform random in O(1)","then":"ds-random"},{"if":"values over time","then":"ds-timekey"},{"if":"next() and hasNext()","then":"ds-iter"}],"variants":[{"id":"ds-lru","name":"LRU / LFU cache","when":"A fixed capacity, and evict the least recently or least frequently used.","tool":"hashmap for lookup + doubly linked list for order (OrderedDict in Python)","invariant":"the list is in recency order at all times","cx":"O(1) per operation","code":"from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.data = OrderedDict()\n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n        return self.data[key]\n    def put(self, key, value):\n        if key in self.data:\n            self.data.move_to_end(key)\n        self.data[key] = value\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)   # oldest out","asks":["LRU cache","LFU cache (a list per frequency + a min-frequency variable)","browser history forward / back","design a linked list"],"examples":[{"n":"LRU Cache","s":"LC 146"},{"n":"LFU Cache","s":"LC 460"},{"n":"Design Browser History","s":"LC 1472"},{"n":"Design Linked List","s":"LC 707"}],"traps":["An interviewer may forbid OrderedDict. Know the node-based version with sentinel head and tail.","get counts as a use: move the key to the front."],"keys":["least recently used","least frequently used","cache","capacity","evict"],"rare":false},{"id":"ds-aux","name":"Stack with extra data per entry","when":"A stack must also report its minimum, maximum or most frequent item.","tool":"a second stack or a tuple stored at each level","invariant":"each level remembers the answer for the stack up to that level","cx":"O(1) per operation","code":"class MinStack:\n    def __init__(self):\n        self.s = []                  # (value, minimum at this depth)\n    def push(self, x):\n        self.s.append((x, min(x, self.s[-1][1]) if self.s else x))\n    def pop(self):\n        self.s.pop()\n    def top(self):\n        return self.s[-1][0]\n    def getMin(self):\n        return self.s[-1][1]","asks":["min stack","max frequency stack","stock span online","stack with increment over the bottom k"],"examples":[{"n":"Min Stack","s":"LC 155"},{"n":"Maximum Frequency Stack","s":"LC 895"},{"n":"Online Stock Span","s":"LC 901"},{"n":"Design a Stack With Increment Operation","s":"LC 1381"}],"traps":["The extra value belongs to the depth, so popping restores the old answer automatically."],"keys":["retrieve the minimum in constant time","getMin","most frequent element pop","stack that supports"],"rare":false},{"id":"ds-queue","name":"One container built from another","when":"Implement a queue with stacks, a stack with queues, or a circular buffer.","tool":"two stacks (in + out), or an array with head and size","invariant":"items in the out stack are older than anything in the in stack","cx":"amortised O(1)","code":"class MyQueue:\n    def __init__(self):\n        self.a, self.b = [], []\n    def push(self, x):\n        self.a.append(x)\n    def peek(self):\n        if not self.b:\n            while self.a:\n                self.b.append(self.a.pop())\n        return self.b[-1]\n    def pop(self):\n        self.peek()\n        return self.b.pop()\n    def empty(self):\n        return not self.a and not self.b","asks":["queue using two stacks","stack using queues","circular queue","circular deque"],"examples":[{"n":"Implement Queue using Stacks","s":"LC 232"},{"n":"Implement Stack using Queues","s":"LC 225"},{"n":"Design Circular Queue","s":"LC 622"},{"n":"Design Circular Deque","s":"LC 641"}],"traps":["Refill the out stack only when it is EMPTY, or the order breaks.","Circular buffer: use <code>(head + size) % cap</code> and hold the size."],"keys":["implement a queue using","using only stacks","circular buffer","ring buffer","fixed-size queue"],"rare":false},{"id":"ds-random","name":"O(1) insert, delete, getRandom","when":"Uniform random choice plus fast insert and delete.","tool":"an array of values and a value→index map","invariant":"the map always gives each value's true position","cx":"O(1) per operation","code":"import random\n\nclass RandomizedSet:\n    def __init__(self):\n        self.a, self.at = [], {}\n    def insert(self, x):\n        if x in self.at:\n            return False\n        self.at[x] = len(self.a)\n        self.a.append(x)\n        return True\n    def remove(self, x):\n        if x not in self.at:\n            return False\n        i, last = self.at[x], self.a[-1]\n        self.a[i], self.at[last] = last, i   # move the last value into the gap\n        self.a.pop()\n        del self.at[x]\n        return True\n    def getRandom(self):\n        return random.choice(self.a)","asks":["insert / delete / getRandom in O(1)","the same, with duplicates allowed (a set of indexes for each value)"],"examples":[{"n":"Insert Delete GetRandom O(1)","s":"LC 380"},{"n":"Insert Delete GetRandom O(1) - Duplicates allowed","s":"LC 381"}],"traps":["Swap with the last element, because popping from the end is the only O(1) delete on an array.","Update the map BEFORE deleting x, or removing the last value breaks."],"keys":["getRandom","equal probability","uniformly at random","average O(1)"],"rare":false},{"id":"ds-timekey","name":"History with binary search","when":"Look up a value as of some time or version.","tool":"key → sorted list of (time, value)","invariant":"each list is sorted because times arrive in increasing order","cx":"O(1) set, O(log n) get","code":"import bisect\n\nclass TimeMap:\n    def __init__(self):\n        self.times, self.vals = {}, {}\n    def set(self, key, value, t):\n        self.times.setdefault(key, []).append(t)\n        self.vals.setdefault(key, []).append(value)\n    def get(self, key, t):\n        i = bisect.bisect_right(self.times.get(key, []), t) - 1\n        return self.vals[key][i] if i >= 0 else \"\"","asks":["time-based key-value store","snapshot array","stock price with corrections","average journey times"],"examples":[{"n":"Time Based Key-Value Store","s":"LC 981"},{"n":"Snapshot Array","s":"LC 1146"},{"n":"Stock Price Fluctuation","s":"LC 2034"},{"n":"Design Underground System","s":"LC 1396"}],"traps":["Search with bisect_right then subtract one, to get the last time ≤ t."],"keys":["timestamp","at time t","snapshot","version","most recent value before"],"rare":false},{"id":"ds-iter","name":"Iterator with a stack","when":"Implement next() and hasNext() over a nested or tree structure, lazily.","tool":"a stack holding the unexplored part","invariant":"the top of the stack is always the next item","cx":"amortised O(1), O(depth) space","code":"class BSTIterator:\n    def __init__(self, root):\n        self.s = []\n        self.push_left(root)\n    def push_left(self, n):\n        while n:\n            self.s.append(n)\n            n = n.left\n    def next(self):\n        n = self.s.pop()\n        self.push_left(n.right)\n        return n.val\n    def hasNext(self):\n        return bool(self.s)","asks":["BST iterator","flatten a nested list iterator","peeking iterator"],"examples":[{"n":"Binary Search Tree Iterator","s":"LC 173"},{"n":"Flatten Nested List Iterator","s":"LC 341"},{"n":"Peeking Iterator","s":"LC 284"}],"traps":["Do the work lazily in next(). Flattening everything up front is what the question bans."],"keys":["next()","hasNext()","iterator","lazily","nested list"],"rare":false}]}]}</script>

<script id="vizgen">/* =====================================================================================
   VIZ ENGINE  --  the trace generators for Pattern Radar's "watch it run".

   These run IN THE BROWSER, so they work on whatever input you type, not just a canned
   example. Each generator declares:

      input   the fields to show (array / string / number / interval pairs) + defaults
      prep    optional: normalise the input (e.g. binary search needs it sorted) + say so
      check   optional: return an error string if the input cannot be run
      run     produce {trace, answer} -- recording a frame at every interesting step
      brute   the same answer computed a DIFFERENT, obviously-correct way

   build_radar.py runs this file under Node and fuzzes every generator: hundreds of random
   inputs, asserting run().answer === brute() each time, plus a structural check that every
   frame points at a real code line and real cell indices. A generator that lies fails the
   build. That is why the animation can be trusted.

   Add one: write G["variant-id"] = {...} and rebuild.
   ===================================================================================== */
(function () {
  "use strict";

  function Trace(data, code, kind, caption) {
    this.kind = kind || "array";
    this.data = data;
    this.code = code;
    this.caption = caption || "";
    this.frames = [];
  }
  Trace.prototype.snap = function (line, note, o) {
    o = o || {};
    /* A span is what to shade: [lo, hi] on a row, [r1, c1, r2, c2] on a grid. Once a search
       range empties out it can arrive inverted or past the ends -- that means "nothing to
       shade", so normalise instead of drawing nonsense. Trees and graphs have no span. */
    var span = o.span || null;
    if (span && this.kind !== "grid" && this.kind !== "tree" && this.kind !== "graph") {
      var n = this.data.length;
      var a = Math.max(0, span[0]), b = Math.min(n - 1, span[1]);
      span = (a > b) ? null : [a, b];
    }
    this.frames.push({
      line: line, note: note,
      ptr: o.ptr || {},
      span: span,
      mark: o.mark || {},
      emark: o.emark || {},
      aux: o.aux || []
    });
  };
  /* mark every index in [a,b] with one state */
  function range(a, b, state) {
    var m = {};
    for (var i = a; i <= b; i++) m[i] = state;
    return m;
  }
  function merge() {
    var out = {};
    for (var i = 0; i < arguments.length; i++) {
      var o = arguments[i] || {};
      for (var k in o) if (o.hasOwnProperty(k)) out[k] = o[k];
    }
    return out;
  }
  function kv(obj, fmt) {
    var out = [], ks = Object.keys(obj);
    ks.sort(function (a, b) { return (a - b) || (a < b ? -1 : 1); });
    for (var i = 0; i < ks.length; i++) out.push((fmt ? fmt(ks[i], obj[ks[i]]) : ks[i] + " → " + obj[ks[i]]));
    return out;
  }
  function strs(a) { return a.map(function (x) { return String(x); }); }

  var G = {};

  /* ================================ SLIDING WINDOW ================================ */

  G["sw-fixed"] = {
    input: [{ id: "a", label: "array", type: "ints", def: "2 1 5 1 3 2" },
            { id: "k", label: "window k", type: "int", def: 3 }],
    check: function (v) {
      if (v.k > v.a.length) return "k must be ≤ the array length";
      if (v.k < 1) return "k must be at least 1";
    },
    brute: function (v) {
      var best = -Infinity;
      for (var i = 0; i + v.k <= v.a.length; i++) {
        var s = 0;
        for (var j = i; j < i + v.k; j++) s += v.a[j];
        if (s > best) best = s;
      }
      return best;
    },
    run: function (v) {
      var a = v.a, k = v.k;
      var t = new Trace(a, ["s = sum(a[:k])", "best = s", "for r in range(k, len(a)):",
                            "    s += a[r] - a[r-k]", "    best = max(best, s)"],
                        "array", "k = " + k + ", biggest window sum");
      var s = 0, i;
      for (i = 0; i < k; i++) s += a[i];
      t.snap(0, "Build the first window once: " + a.slice(0, k).join(" + ") + " = " + s +
                ". Everything after this is one add and one remove.",
             { span: [0, k - 1], aux: [{ label: "sum", text: String(s) }] });
      var best = s;
      t.snap(1, "best = " + best + " so far.",
             { span: [0, k - 1], aux: [{ label: "sum", text: String(s) }, { label: "best", text: String(best) }] });
      for (var r = k; r < a.length; r++) {
        t.snap(3, "a[" + r + "]=" + a[r] + " enters, a[" + (r - k) + "]=" + a[r - k] +
                  " leaves. One in, one out — that is why this is O(n), not O(n·k).",
               { ptr: { "in": r, out: r - k }, span: [r - k, r], mark: { [r - k]: "gone" },
                 aux: [{ label: "sum", text: s + " − " + a[r - k] + " + " + a[r] },
                       { label: "best", text: String(best) }] });
        s += a[r] - a[r - k];
        if (s > best) best = s;
        t.snap(4, "window [" + (r - k + 1) + ".." + r + "] sums to " + s + ". best = " + best + ".",
               { span: [r - k + 1, r],
                 aux: [{ label: "sum", text: String(s) }, { label: "best", text: String(best) }] });
      }
      t.snap(4, "Answer " + best + ". " + a.length + " elements, " + a.length + " steps.",
             { aux: [{ label: "best", text: String(best) }] });
      return { trace: t, answer: best };
    }
  };

  G["sw-longest"] = {
    input: [{ id: "s", label: "string", type: "string", def: "abcabcbb" }],
    brute: function (v) {
      var best = 0;
      for (var i = 0; i < v.s.length; i++) {
        var seen = {};
        for (var j = i; j < v.s.length; j++) {
          if (seen[v.s[j]]) break;
          seen[v.s[j]] = 1;
          if (j - i + 1 > best) best = j - i + 1;
        }
      }
      return best;
    },
    run: function (v) {
      var s = v.s;
      var t = new Trace(s, ["for r, ch in enumerate(s):", "    while ch in window:",
                            "        window.remove(s[l]); l += 1", "    window.add(ch)",
                            "    best = max(best, r - l + 1)"],
                        "string", "longest substring with no repeated character");
      var win = {}, l = 0, best = 0;
      for (var r = 0; r < s.length; r++) {
        var ch = s[r];
        t.snap(0, "r reaches '" + ch + "'.",
               { ptr: { l: l, r: r }, span: [l, r],
                 aux: [{ label: "window", items: Object.keys(win) }, { label: "best", text: String(best) }] });
        while (win[ch]) {
          t.snap(2, "'" + ch + "' is already inside, so the window is invalid. Drop s[" + l + "]='" + s[l] +
                    "' and move l forward. l NEVER goes back — that is the whole O(n) argument.",
                 { ptr: { l: l, r: r }, span: [l, r], mark: { [l]: "bad" },
                   aux: [{ label: "window", items: Object.keys(win) }] });
          delete win[s[l]]; l++;
        }
        win[ch] = 1;
        if (r - l + 1 > best) best = r - l + 1;
        t.snap(4, "valid again: \"" + s.slice(l, r + 1) + "\", length " + (r - l + 1) + ". best = " + best + ".",
               { ptr: { l: l, r: r }, span: [l, r],
                 aux: [{ label: "window", items: Object.keys(win) }, { label: "best", text: String(best) }] });
      }
      t.snap(4, "Answer " + best + ". Note it was a WHILE, not an if — one new character can force several exits.",
             { aux: [{ label: "best", text: String(best) }] });
      return { trace: t, answer: best };
    }
  };

  G["sw-shortest"] = {
    input: [{ id: "a", label: "array (positive)", type: "ints", def: "2 3 1 2 4 3" },
            { id: "target", label: "target sum", type: "int", def: 7 }],
    check: function (v) {
      for (var i = 0; i < v.a.length; i++) if (v.a[i] <= 0) return "this variant needs POSITIVE numbers — with negatives, shrinking can raise the sum, so the window logic collapses (use prefix sum + deque)";
    },
    brute: function (v) {
      var best = 0;
      for (var i = 0; i < v.a.length; i++) {
        var s = 0;
        for (var j = i; j < v.a.length; j++) {
          s += v.a[j];
          if (s >= v.target) { if (!best || j - i + 1 < best) best = j - i + 1; break; }
        }
      }
      return best;
    },
    run: function (v) {
      var a = v.a, target = v.target;
      var t = new Trace(a, ["for r, x in enumerate(a):", "    s += x", "    while s >= target:",
                            "        best = min(best, r - l + 1)", "        s -= a[l]; l += 1"],
                        "array", "shortest window with sum ≥ " + target);
      var l = 0, s = 0, best = Infinity;
      for (var r = 0; r < a.length; r++) {
        s += a[r];
        t.snap(1, "a[" + r + "]=" + a[r] + " joins; sum = " + s + ".",
               { ptr: { l: l, r: r }, span: [l, r],
                 aux: [{ label: "sum", text: String(s) },
                       { label: "best", text: best === Infinity ? "—" : String(best) }] });
        while (s >= target) {
          if (r - l + 1 < best) best = r - l + 1;
          t.snap(3, "sum " + s + " ≥ " + target + ", so this window is VALID — record length " +
                    (r - l + 1) + ", then try to shrink it.",
                 { ptr: { l: l, r: r }, span: [l, r],
                   aux: [{ label: "sum", text: String(s) }, { label: "best", text: String(best) }] });
          s -= a[l]; l++;
          t.snap(4, "drop a[" + (l - 1) + "]; sum = " + s +
                    ". Shortest means: record WHILE valid, then shrink.",
                 { ptr: { l: l, r: r }, span: l <= r ? [l, r] : null, mark: { [l - 1]: "gone" },
                   aux: [{ label: "sum", text: String(s) }] });
        }
      }
      var ans = best === Infinity ? 0 : best;
      t.snap(3, ans ? ("Answer " + ans + ". Compare with 'longest': there you record AFTER shrinking, here BEFORE.")
                    : "No window ever reached the target, so the answer is 0.",
             { aux: [{ label: "best", text: String(ans) }] });
      return { trace: t, answer: ans };
    }
  };

  G["sw-deque"] = {
    input: [{ id: "a", label: "array", type: "ints", def: "1 3 -1 -3 5 3" },
            { id: "k", label: "window k", type: "int", def: 3 }],
    check: function (v) {
      if (v.k > v.a.length) return "k must be ≤ the array length";
      if (v.k < 1) return "k must be at least 1";
    },
    brute: function (v) {
      var out = [];
      for (var i = 0; i + v.k <= v.a.length; i++) {
        var m = -Infinity;
        for (var j = i; j < i + v.k; j++) if (v.a[j] > m) m = v.a[j];
        out.push(m);
      }
      return out.join(",");
    },
    run: function (v) {
      var a = v.a, k = v.k;
      var t = new Trace(a, ["for r, x in enumerate(a):", "    while dq and a[dq[-1]] <= x: dq.pop()",
                            "    dq.append(r)", "    if dq[0] <= r - k: dq.popleft()",
                            "    if r >= k-1: out.append(a[dq[0]])"],
                        "array", "k = " + k + ", maximum of every window");
      var dq = [], out = [];
      for (var r = 0; r < a.length; r++) {
        var x = a[r];
        while (dq.length && a[dq[dq.length - 1]] <= x) {
          t.snap(1, "a[" + dq[dq.length - 1] + "]=" + a[dq[dq.length - 1]] + " is newer AND not bigger than " +
                    x + ", so it can never be a maximum again. Pop it from the BACK.",
                 { ptr: { r: r }, mark: { [dq[dq.length - 1]]: "bad" },
                   aux: [{ label: "deque (indices)", items: strs(dq) }] });
          dq.pop();
        }
        dq.push(r);

  function clockCells(iv) {

      };

  G["iv-merge"] = {
    input: [{ id: "iv", label: "intervals  start,end", type: "pairs", def: "1,3 2,6 8,10 15,18" }],

        if (v.iv[i][0] < 1) return "start times must be 1 or more (the clock starts at 1)";
      }
    },
    brute: function (v) {
      /* Independent check: union-find over PAIRWISE overlap, then each component's extent.

                 { span: [s - 1, e - 1], mark: range(s - 1, e - 1, "done"),

          t.snap(2, "index " + i + " is past reach (" + reach + ") — there is a gap nothing can cross, " +
                    "so the end is unreachable.",
                 { ptr: { i: i, reach: reach }, mark: { [i]: "bad" },
                   aux: [{ label: "reach", text: String(reach) }] });
          break;
        }
        var nr = Math.max(reach, i + a[i]);
        t.snap(3, "from index " + i + " you can jump " + a[i] + ", landing as far as " + (i + a[i]) + ". " +
                  (nr > reach ? "reach improves to " + nr + "." : "that is no further than reach already is."),
               { ptr: { i: i, reach: Math.min(nr, a.length - 1) },
                 span: [0, Math.min(nr, a.length - 1)], mark: { [i]: "pick" },
                 aux: [{ label: "reach", text: String(nr) }] });
        reach = nr;
      }
      if (ok) {
        t.snap(4, "Every index stayed within reach, so the end is reachable. O(n), O(1) space — the DP " +
                  "version would be O(n²) for the same answer.",
               { span: [0, a.length - 1], mark: range(0, a.length - 1, "done"),
                 aux: [{ label: "reach", text: String(reach) }] });
      }
      return { trace: t, answer: ok };
    }
  };

  G["gr-pair"] = {
    input: [{ id: "people", label: "weights", type: "ints", def: "3 2 2 1" },
            { id: "limit", label: "boat limit", type: "int", def: 3 }],
    check: function (v) {
      for (var i = 0; i < v.people.length; i++) {
        if (v.people[i] < 1) return "weights must be at least 1";
        if (v.people[i] > v.limit) return "someone heavier than the limit can never board — weight " +
                                          v.people[i] + " > limit " + v.limit;
      }
    },
    brute: function (v) {              /* exhaustive matching for small n */
      var n = v.people.length;
      if (n > 8) return null;
      var p = v.people.slice().sort(function (a, b) { return a - b; });
      var best = n;
      var go = function (used, boats) {
        if (boats >= best) return;
        var first = -1;
        for (var i = 0; i < n; i++) if (!(used >> i & 1)) { first = i; break; }
        if (first < 0) { best = Math.min(best, boats); return; }
        go(used | (1 << first), boats + 1);                       /* alone */
        for (var j = first + 1; j < n; j++) {
          if (used >> j & 1) continue;
          if (p[first] + p[j] <= v.limit) go(used | (1 << first) | (1 << j), boats + 1);
        }
      };
      go(0, 0);
      return best;
    },
    run: function (v) {
      var people = v.people.slice().sort(function (a, b) { return a - b; }), limit = v.limit;
      var t = new Trace(people, ["people.sort()", "l, r = 0, len(people)-1", "while l <= r:",
                                 "    if people[l] + people[r] <= limit: l += 1",
                                 "    r -= 1; boats += 1"],
                        "array", "fewest boats, 2 people max, limit " + limit);
      var l = 0, r = people.length - 1, boats = 0;
      t.snap(0, "Sorted. Now the question is only ever 'can the lightest ride with the heaviest', because " +
                "the heaviest has to leave on this trip regardless.",
             { ptr: { l: l, r: r }, span: [l, r], aux: [{ label: "boats", text: "0" }] });
      while (l <= r) {
        var fits = people[l] + people[r] <= limit;
        if (l === r) {
          t.snap(3, "one person left (" + people[l] + ") — they get a boat to themselves.",
                 { ptr: { l: l }, mark: { [l]: "done" }, aux: [{ label: "boats", text: String(boats + 1) }] });
        } else {
          t.snap(3, people[l] + " + " + people[r] + " = " + (people[l] + people[r]) +
                    (fits ? " ≤ " + limit + " — they share a boat."
                          : " > " + limit + " — the heaviest goes alone."),
                 { ptr: { l: l, r: r }, span: [l, r],
                   mark: merge({ [r]: "pick" }, fits ? { [l]: "pick" } : { [l]: "bad" }),
                   aux: [{ label: "boats", text: String(boats + 1) }] });
        }
        if (fits) l += 1;
        r -= 1;
        boats += 1;
      }
      t.snap(4, "Answer " + boats + " boats. r drops EVERY round (the heaviest always leaves); l only advances " +
                "when the pairing actually fits.",
             { aux: [{ label: "boats", text: String(boats) }] });
      return { trace: t, answer: boats };
    }
  };

  /* ================================== UNION-FIND ================================== */

  G["dsu-connect"] = {
    input: [{ id: "n", label: "number of nodes", type: "int", def: 6 },
            { id: "edges", label: "edges  a,b", type: "pairs", def: "0,1 1,2 3,4" }],
    check: function (v) {
      if (v.n < 1 || v.n > 10) return "use between 1 and 10 nodes so the trace stays watchable";
      for (var i = 0; i < v.edges.length; i++) {
        var e = v.edges[i];
        if (e[0] < 0 || e[1] < 0 || e[0] >= v.n || e[1] >= v.n)
          return "edge " + e[0] + "," + e[1] + " uses a node outside 0.." + (v.n - 1);
      }
    },
    brute: function (v) {              /* flood fill over the adjacency -- not DSU */
      var adj = [], i;
      for (i = 0; i < v.n; i++) adj.push([]);
      for (i = 0; i < v.edges.length; i++) {
        adj[v.edges[i][0]].push(v.edges[i][1]);
        adj[v.edges[i][1]].push(v.edges[i][0]);
      }
      var seen = {}, comps = 0;
      for (i = 0; i < v.n; i++) {
        if (seen[i]) continue;
        comps++;
        var st = [i]; seen[i] = 1;
        while (st.length) {
          var u = st.pop();
          for (var k = 0; k < adj[u].length; k++) if (!seen[adj[u][k]]) { seen[adj[u][k]] = 1; st.push(adj[u][k]); }
        }
      }
      return comps;
    },
    run: function (v) {
      var n = v.n, edges = v.edges, i;
      var cells = [];
      for (i = 0; i < n; i++) cells.push(i);
      var t = new Trace(cells, ["p = list(range(n));  groups = n", "for a, b in edges:",
                                "    ra, rb = find(a), find(b)", "    if ra == rb: continue   # redundant",
                                "    p[rb] = ra;  groups -= 1"],
                        "array", "count groups as edges arrive (cells are the nodes)");
      var p = [];
      for (i = 0; i < n; i++) p.push(i);
      var groups = n;
      function find(x) { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; }
      var roots = function () { var o = []; for (var k = 0; k < n; k++) o.push(String(find(k))); return o; };
      t.snap(0, "Everyone starts as their own group. The reason this beats a DFS sweep is that it answers " +
                "'are these two connected' while edges are STILL ARRIVING.",
             { mark: range(0, n - 1, "pick"),
               aux: [{ label: "parent", items: strs(p) }, { label: "groups", text: String(groups) }] });
      for (i = 0; i < edges.length; i++) {
        var a = edges[i][0], b = edges[i][1];
        var ra = find(a), rb = find(b);
        if (ra === rb) {
          t.snap(3, "edge " + a + "–" + b + ": both already lead to root " + ra +
                    " — this edge joins nothing, so it CLOSES A CYCLE. That is the whole redundant-edge test.",
                 { ptr: { a: a, b: b }, mark: merge({ [a]: "bad" }, { [b]: "bad" }),
                   aux: [{ label: "root of each", items: roots() }, { label: "groups", text: String(groups) }] });
          continue;
        }
        t.snap(2, "edge " + a + "–" + b + ": root of " + a + " is " + ra + ", root of " + b + " is " + rb +
                  ". Different, so this edge really merges two groups.",
               { ptr: { a: a, b: b }, mark: merge({ [a]: "pick" }, { [b]: "pick" },
                                                  { [ra]: "done" }, { [rb]: "done" }),
                 aux: [{ label: "root of each", items: roots() }] });
        p[rb] = ra;
        groups -= 1;
        t.snap(4, "hang " + rb + " under " + ra + ". One union, one fewer group → " + groups + ".",
               { ptr: { a: a, b: b }, mark: { [ra]: "done" },
                 aux: [{ label: "parent", items: strs(p) }, { label: "root of each", items: roots() },
                       { label: "groups", text: String(groups) }] });
      }
      t.snap(4, "Answer " + groups + " group(s). Always compare ROOTS, never the raw values.",
             { aux: [{ label: "root of each", items: roots() }, { label: "groups", text: String(groups) }] });
      return { trace: t, answer: groups };
    }
  };

  /* ============================== TOPOLOGICAL SORT ================================ */

  G["to-kahn"] = {
    input: [{ id: "n", label: "number of tasks", type: "int", def: 6 },
            { id: "edges", label: "a before b", type: "pairs", def: "0,1 0,2 1,3 2,3 3,4" }],
    check: function (v) {
      if (v.n < 1 || v.n > 10) return "use between 1 and 10 tasks so the trace stays watchable";
      for (var i = 0; i < v.edges.length; i++) {
        var e = v.edges[i];
        if (e[0] < 0 || e[1] < 0 || e[0] >= v.n || e[1] >= v.n)
          return "edge " + e[0] + "," + e[1] + " uses a task outside 0.." + (v.n - 1);
      }
    },
    brute: function (v) {              /* three-colour DFS cycle check -- not Kahn */
      var adj = [], i;
      for (i = 0; i < v.n; i++) adj.push([]);
      for (i = 0; i < v.edges.length; i++) adj[v.edges[i][0]].push(v.edges[i][1]);
      var color = [];
      for (i = 0; i < v.n; i++) color.push(0);
      var bad = false;
      var dfs = function (u) {
        if (color[u] === 1) { bad = true; return; }
        if (color[u] === 2) return;
        color[u] = 1;
        for (var k = 0; k < adj[u].length; k++) { dfs(adj[u][k]); if (bad) return; }
        color[u] = 2;
      };
      for (i = 0; i < v.n && !bad; i++) dfs(i);
      return bad ? 0 : 1;
    },
    run: function (v) {
      var n = v.n, edges = v.edges, i;
      var cells = [];
      for (i = 0; i < n; i++) cells.push(i);
      var t = new Trace(cells, ["indeg[b] += 1 for every edge a->b", "q = [i for i if indeg[i] == 0]",
                                "while q:", "    u = q.popleft(); order.append(u)",
                                "    for v in adj[u]: indeg[v] -= 1",
                                "        if indeg[v] == 0: q.append(v)",
                                "return order if len(order) == n else CYCLE"],
                        "array", "Kahn's algorithm — cells are the tasks");
      var adj = [], indeg = [];
      for (i = 0; i < n; i++) { adj.push([]); indeg.push(0); }
      for (i = 0; i < edges.length; i++) { adj[edges[i][0]].push(edges[i][1]); indeg[edges[i][1]] += 1; }
      t.snap(0, "indegree = how many prerequisites each task still has. Get the edge DIRECTION right: " +
                "'to do b you need a' is an edge a→b.",
             { aux: [{ label: "indegree", items: strs(indeg) }] });
      var q = [];
      for (i = 0; i < n; i++) if (indeg[i] === 0) q.push(i);
      t.snap(1, "everything at indegree 0 can start immediately: " + (q.length ? q.join(", ") : "nothing") +
                (q.length ? "." : " — and if nothing can start, every task is waiting on another one."),
             { mark: (function () { var m = {}; for (var k = 0; k < q.length; k++) m[q[k]] = "pick"; return m; })(),
               aux: [{ label: "queue", items: strs(q) }, { label: "indegree", items: strs(indeg) }] });
      var order = [];
      while (q.length) {
        var u = q.shift();
        order.push(u);
        t.snap(3, "task " + u + " has no prerequisites left — emit it.",
               { ptr: { u: u }, mark: merge((function () { var m = {}; for (var k = 0; k < order.length; k++) m[order[k]] = "done"; return m; })(), { [u]: "pick" }),
                 aux: [{ label: "order", items: strs(order) }, { label: "queue", items: strs(q) }] });
        for (i = 0; i < adj[u].length; i++) {
          var w = adj[u][i];
          indeg[w] -= 1;
          t.snap(4, "task " + w + " loses a prerequisite → indegree " + indeg[w] +
                    (indeg[w] === 0 ? ", which frees it. Into the queue." : ", still waiting."),
                 { ptr: { u: u, w: w }, mark: merge({ [u]: "done" }, { [w]: indeg[w] === 0 ? "pick" : "bad" }),
                   aux: [{ label: "indegree", items: strs(indeg) }, { label: "queue", items: strs(q) }] });
          if (indeg[w] === 0) q.push(w);
        }
      }
      var ok = order.length === n ? 1 : 0;
      t.snap(6, ok
             ? ("Emitted all " + n + " tasks, so a valid order exists: " + order.join(" → ") + ".")
             : ("Only " + order.length + " of " + n + " tasks came out. The leftovers all still have " +
                "prerequisites, which can only mean they depend on each other — a CYCLE. " +
                "The cycle check is just len(order) == n; there is no separate pass to write."),
             { mark: (function () {
                 var m = {};
                 for (var k = 0; k < n; k++) m[k] = order.indexOf(k) >= 0 ? "done" : "bad";
                 return m;
               })(),
               aux: [{ label: "order", items: strs(order) },
                     { label: "verdict", text: ok ? "possible" : "cycle" }] });
      return { trace: t, answer: ok };
    }
  };
})();

/* =====================================================================================
   VIZ ENGINE, part C  --  the GRID stage.
   Grid traversal (flood fill, BFS, multi-source) and the 2-D DP family, where the thing
   worth watching is a table or a board filling in. Loads after viz_engine.js.
   ===================================================================================== */
(function () {
  "use strict";
  var G = (typeof module !== "undefined" && module.exports)
        ? require("./viz_engine.js")
        : window.VIZGEN;
  var H = G.__helpers, Trace = H.Trace, merge = H.merge, strs = H.strs;

  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  /* a grid Trace: data = {r, c, cells}; mark/ptr keys are "row,col" */
  function gridTrace(cells, code, caption) {
    var t = new Trace({ r: cells.length, c: cells[0].length, cells: cells }, code, "grid", caption);
    return t;
  }
  function K(r, c) { return r + "," + c; }
  function copyGrid(g) { return g.map(function (row) { return row.slice(); }); }
  function markAll(pred, g, state) {
    var m = {};
    for (var r = 0; r < g.length; r++)
      for (var c = 0; c < g[0].length; c++)
        if (pred(g[r][c], r, c)) m[K(r, c)] = state;
    return m;
  }

  /* ============================= GRID TRAVERSAL =================================== */

  G["gr-flood"] = {
    input: [{ id: "g", label: "grid rows of 0 / 1", type: "grid01", def: "11000 11000 00100 00011" }],
    check: function (v) {
      if (v.g.length > 7 || v.g[0].length > 10) return "keep the grid within 7 rows and 10 columns";
    },
    brute: function (v) {                 /* BFS components -- different traversal to run() */
      var g = copyGrid(v.g), R = g.length, C = g[0].length, n = 0;
      for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
        if (g[r][c] !== 1) continue;
        n++;
        var q = [[r, c]]; g[r][c] = 0;
        while (q.length) {
          var cur = q.shift();
          for (var d = 0; d < 4; d++) {
            var nr = cur[0] + DIRS[d][0], nc = cur[1] + DIRS[d][1];
            if (nr >= 0 && nr < R && nc >= 0 && nc < C && g[nr][nc] === 1) { g[nr][nc] = 0; q.push([nr, nc]); }
          }
        }
      }
      return n;
    },
    run: function (v) {
      var g = copyGrid(v.g), R = g.length, C = g[0].length;
      var t = gridTrace(g.map(function (row) { return row.map(String); }),
                        ["for r in range(R):", "  for c in range(C):", "    if g[r][c] == 1:",
                         "      islands += 1; sink(r, c)", "",
                         "def sink(r, c):   # DFS", "    if out of bounds or g[r][c] != 1: return",
                         "    g[r][c] = 0                     # mark BEFORE recursing",
                         "    for each of the 4 neighbours: sink(...)"],
                        "count the islands — a grid IS a graph");
      var done = {}, islands = 0;
      t.snap(0, "Each cell is a node and each legal move is an edge. Scan for an unvisited 1; every time " +
                "you find one, a whole new region starts there.",
             { aux: [{ label: "islands", text: "0" }] });
      for (var r = 0; r < R; r++) {
        for (var c = 0; c < C; c++) {
          if (g[r][c] !== 1) continue;
          islands++;
          t.snap(3, "cell (" + r + "," + c + ") is land nobody has reached — island #" + islands +
                    " starts here. Now sink the whole thing so it is never counted twice.",
                 { ptr: { start: K(r, c) }, mark: merge(done, { [K(r, c)]: "pick" }),
                   aux: [{ label: "islands", text: String(islands) }] });
          var st = [[r, c]], sunk = 0;
          while (st.length) {
            var cur = st.pop();
            if (g[cur[0]][cur[1]] !== 1) continue;
            g[cur[0]][cur[1]] = 0;                       /* mark BEFORE recursing */
            done[K(cur[0], cur[1])] = "done";
            sunk++;
            t.snap(7, "sink (" + cur[0] + "," + cur[1] + ") — marked visited BEFORE looking at its " +
                      "neighbours. Mark after, and two adjacent cells call each other forever.",
                   { ptr: { at: K(cur[0], cur[1]) }, mark: merge(done, { [K(cur[0], cur[1])]: "pick" }),
                     aux: [{ label: "islands", text: String(islands) },
                           { label: "cells in this island", text: String(sunk) }] });
            for (var d = 0; d < 4; d++) {
              var nr = cur[0] + DIRS[d][0], nc = cur[1] + DIRS[d][1];
              if (nr >= 0 && nr < R && nc >= 0 && nc < C && g[nr][nc] === 1) st.push([nr, nc]);
            }
          }
        }
      }
      t.snap(3, "Answer " + islands + " island(s). Every cell was entered at most once, so the whole sweep " +
                "is O(rows · cols) no matter how tangled the shapes are.",
             { mark: done, aux: [{ label: "islands", text: String(islands) }] });
      return { trace: t, answer: islands };
    }
  };

  G["gr-bfs"] = {
    input: [{ id: "g", label: "grid (0 open, 1 wall)", type: "grid01", def: "00010 01010 01000 01110 00001" }],
    check: function (v) {
      if (v.g.length > 7 || v.g[0].length > 10) return "keep the grid within 7 rows and 10 columns";
      if (v.g[0][0] === 1) return "the top-left cell is a wall, so there is nowhere to start";
    },
    brute: function (v) {                 /* Dijkstra-with-equal-weights -- a different route */
      var g = v.g, R = g.length, C = g[0].length;
      var dist = g.map(function (row) { return row.map(function () { return Infinity; }); });
      dist[0][0] = 0;
      for (var it = 0; it < R * C; it++) {
        for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
          if (g[r][c] === 1 || dist[r][c] === Infinity) continue;
          for (var d = 0; d < 4; d++) {
            var nr = r + DIRS[d][0], nc = c + DIRS[d][1];
            if (nr < 0 || nr >= R || nc < 0 || nc >= C || g[nr][nc] === 1) continue;
            if (dist[r][c] + 1 < dist[nr][nc]) dist[nr][nc] = dist[r][c] + 1;
          }
        }
      }
      return dist[R - 1][C - 1] === Infinity ? -1 : dist[R - 1][C - 1];
    },
    run: function (v) {
      var g = v.g, R = g.length, C = g[0].length;
      var show = g.map(function (row) { return row.map(function (x) { return x === 1 ? "■" : "·"; }); });
      var t = gridTrace(show,
                        ["q = deque([start]); seen = {start}", "while q:", "    for _ in range(len(q)):",
                         "        r, c = q.popleft()", "        if (r,c) == goal: return steps",
                         "        for each neighbour:", "            if open and not seen:",
                         "                seen.add(it); q.append(it)   # mark on PUSH",
                         "    steps += 1"],
                        "fewest steps from top-left to bottom-right");
      var seen = {}, q = [[0, 0]], steps = 0, found = -1;
      seen[K(0, 0)] = 0;
      var walls = markAll(function (x) { return x === 1; }, g, "bad");
      t.snap(0, "BFS finishes one whole distance ring before starting the next, which is exactly why it " +
                "returns the SHORTEST path. DFS would find a path, not the short one.",
             { ptr: { start: K(0, 0) }, mark: merge(walls, { [K(0, 0)]: "pick" }),
               aux: [{ label: "steps", text: "0" }, { label: "frontier", text: "1 cell" }] });
      while (q.length && found < 0) {
        var ring = q, nxt = [];
        for (var i = 0; i < ring.length && found < 0; i++) {
          var r = ring[i][0], c = ring[i][1];
          if (r === R - 1 && c === C - 1) { found = steps; break; }
          for (var d = 0; d < 4; d++) {
            var nr = r + DIRS[d][0], nc = c + DIRS[d][1];
            if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;
            if (g[nr][nc] === 1 || seen.hasOwnProperty(K(nr, nc))) continue;
            seen[K(nr, nc)] = steps + 1;                 /* mark on PUSH, never on pop */
            nxt.push([nr, nc]);
          }
        }
        if (found >= 0) break;
        var reached = {};
        Object.keys(seen).forEach(function (k2) { reached[k2] = "done"; });
        nxt.forEach(function (p) { reached[K(p[0], p[1])] = "pick"; });
        steps++;
        t.snap(7, nxt.length
               ? ("ring " + steps + ": " + nxt.length + " new cell(s) reached, each marked the moment it was " +
                  "PUSHED. Mark on pop instead and the same cell gets queued many times.")
               : ("ring " + steps + ": nothing new is reachable — the goal is walled off."),
               { mark: merge(walls, reached),
                 aux: [{ label: "steps", text: String(steps) }, { label: "frontier", text: nxt.length + " cells" }] });
        q = nxt;
      }
      var fin = {};
      Object.keys(seen).forEach(function (k2) { fin[k2] = "done"; });
      t.snap(4, found >= 0
             ? ("Reached the bottom-right in " + found + " steps. The first time a cell is dequeued, its " +
                "distance is already the smallest possible.")
             : "The goal is unreachable — every open cell was exhausted.",
             { mark: merge(walls, fin, found >= 0 ? { [K(R - 1, C - 1)]: "pick" } : {}),
               aux: [{ label: "answer", text: found >= 0 ? String(found) : "unreachable" }] });
      return { trace: t, answer: found };
    }
  };

  G["gr-multi"] = {
    input: [{ id: "g", label: "grid (1 = a source)", type: "grid01", def: "00100 00000 10000 00000 00001" }],
    check: function (v) {
      if (v.g.length > 7 || v.g[0].length > 10) return "keep the grid within 7 rows and 10 columns";
      var any = false;
      for (var r = 0; r < v.g.length; r++) for (var c = 0; c < v.g[0].length; c++) if (v.g[r][c] === 1) any = true;
      if (!any) return "mark at least one cell as 1 — those are the sources everything spreads from";
    },
    brute: function (v) {                 /* per-cell Manhattan scan to the nearest source */
