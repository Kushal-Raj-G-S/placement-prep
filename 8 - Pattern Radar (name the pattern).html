_at_most(a, k, ok):            # ok = the 'at most' predicate's state update\n    from collections import defaultdict\n    cnt = defaultdict(int)\n    l = total = 0\n    for r, x in enumerate(a):\n        cnt[x] += 1\n        while len(cnt) > k:\n            cnt[a[l]] -= 1\n            if cnt[a[l]] == 0: del cnt[a[l]]\n            l += 1\n        total += r - l + 1              # every window ending at r is valid\n    return total\n\ndef count_exactly(a, k):\n    return count_at_most(a, k) - count_at_most(a, k - 1)","asks":["subarrays with exactly K distinct integers","binary subarrays with sum exactly equal to goal","count 'nice' subarrays — exactly k odd numbers","count substrings containing all three characters a, b, c (that is 'at least', = total − atMost(2 kinds))","number of substrings with exactly k unique characters"],"examples":[{"n":"Subarrays with K Different Integers","s":"LC 992"},{"n":"Binary Subarrays With Sum","s":"LC 930 — also solvable with prefix + hashmap, in your notes"},{"n":"Count Number of Nice Subarrays","s":"LC 1248"},{"n":"Number of Substrings Containing All Three Characters","s":"LC 1358"}],"traps":["You cannot maintain 'exactly K' with one window — it is not monotonic, so there is nothing to shrink on. The subtraction trick exists precisely because of that.","<code>total += r - l + 1</code> counts windows; <code>best = max(best, r-l+1)</code> measures one. Do not mix them up.","For a 0/1 array, prefix sum + hashmap gives the same answer in one pass — either is accepted."],"rare":false,"keys":["exactly k","count subarrays with k distinct","number of subarrays having k odd"]},{"id":"sw-deque","name":"Monotonic deque inside the window","when":"You need the MAX or MIN of each window, and recomputing it is O(k) per step.","tool":"a deque of INDICES whose values are monotonically decreasing (for max) — front is the answer","invariant":"the deque holds exactly the indices that could still be the window max, newest last","cx":"O(n) — each index is pushed once and popped once","code":"from collections import deque\ndef max_sliding_window(a, k):\n    dq, out = deque(), []            # dq holds INDICES, values decreasing\n    for r, x in enumerate(a):\n        while dq and a[dq[-1]] <= x:\n            dq.pop()                 # x is newer AND bigger -> they can never win\n        dq.append(r)\n        if dq[0] <= r - k:\n            dq.popleft()             # front fell out of the window\n        if r >= k - 1:\n            out.append(a[dq[0]])\n    return out","asks":["sliding window maximum / minimum","longest subarray with max − min ≤ limit (one max-deque + one min-deque)","shortest subarray with sum at least K, WITH negatives (deque over prefix sums)","constrained subsequence sum, jump game VI (deque over a DP array)","maximum of all subarrays of every size (histogram variant — monotonic stack instead)"],"examples":[{"n":"Sliding Window Maximum","s":"LC 239"},{"n":"Longest Continuous Subarray With Absolute Diff ≤ Limit","s":"LC 1438"},{"n":"Shortest Subarray with Sum at Least K","s":"LC 862"},{"n":"Jump Game VI","s":"LC 1696"},{"n":"Constrained Subsequence Sum","s":"LC 1425"}],"traps":["Store indices, not values — you cannot tell when a value expires otherwise.","Pop the expired FRONT every iteration, and pop smaller elements from the BACK before pushing.","<code>&lt;=</code> versus <code>&lt;</code> when popping the back only matters for duplicates and for which index you report."],"rare":false,"keys":["maximum of every window","sliding window maximum","max minus min within limit","each window of size k maximum"]},{"id":"sw-complement","name":"Take from both ends = window on what remains","when":"You remove or pick items only from the two ENDS, or the array is circular.","tool":"a fixed or variable window over the part you do NOT take","invariant":"taken from the ends + the middle window = the whole array","cx":"O(n) time, O(1) space","code":"def max_points_from_ends(cards, k):\n    n = len(cards)\n    keep = n - k                     # the untouched middle has fixed length\n    window = sum(cards[:keep])\n    smallest = window\n    for r in range(keep, n):\n        window += cards[r] - cards[r - keep]\n        smallest = min(smallest, window)\n    return sum(cards) - smallest","asks":["maximum score taking k cards from either end","fewest removals from the ends to reduce x to 0 (longest middle summing to total−x)","circular array: fewest swaps to group all 1s"],"examples":[{"n":"Maximum Points You Can Obtain from Cards","s":"LC 1423"},{"n":"Minimum Operations to Reduce X to Zero","s":"LC 1658"},{"n":"Minimum Swaps to Group All 1's Together II","s":"LC 2134"}],"traps":["Circular window: walk indices with <code>% n</code> or double the array.","Check the case where nothing remains in the middle (keep = 0)."],"keys":["from either end","from the beginning or the end","first or last element","circular","wraps around"],"rare":false}]},{"id":"prefix-sum","group":"linear","name":"Prefix sum","buys":"Each range-sum query is O(n). After one O(n) setup pass, every query is O(1).","lives":"array (numbers), and any string you can turn into ±1 or a bitmask","core":"pre[i] = the total of everything BEFORE index i. So any range sum is one subtraction: sum(l..r) = pre[r+1] - pre[l]. The big leap: if you want 'how many ranges sum to K', rearrange that to pre[r+1] - K = pre[l], then ask a HASHMAP how many earlier prefixes had that value.","recognise":[{"cue":"<b>repeated range-sum queries</b> on a fixed array","note":"plain prefix array"},{"cue":"contiguous + <b>sum equals K</b> + negatives allowed","note":"prefix + hashmap — the signature combination"},{"cue":"<b>divisible by K</b>, 'multiple of k'","note":"hash the remainder, not the sum"},{"cue":"<b>equal number of</b> two things","note":"map one to +1 and the other to −1, then you just need sum = 0"},{"cue":"<b>range updates</b>, many of them, queried only at the end","note":"difference array"},{"cue":"product / min / max over a prefix, or 'everything except me'","note":"prefix-and-suffix pass"}],"notwhen":["All values are positive and you want the LONGEST or SHORTEST range → a <b>sliding window</b> is simpler, O(1) space.","The array changes between queries → you need a Fenwick tree / segment tree, not a static prefix.","You want the max subarray sum → that's <b>Kadane</b> (or prefix minus running-min, same idea)."],"pick":[{"if":"just answer range sums fast","then":"ps-range"},{"if":"COUNT subarrays matching a sum rule","then":"ps-count"},{"if":"find the LONGEST / shortest subarray matching a sum rule","then":"ps-longest"},{"if":"the grid is 2-D","then":"ps-2d"},{"if":"many range add operations, one read at the end","then":"ps-diff"},{"if":"'product of all except self', or you need info from both sides","then":"ps-suffix"}],"variants":[{"id":"ps-range","name":"Plain prefix array (range sums)","when":"Many queries, array never changes.","tool":"pre[0] = 0; pre[i+1] = pre[i] + a[i]","invariant":"pre[i] is always the sum of a[0:i] — note the off-by-one is deliberate, it kills the l=0 special case","cx":"O(n) build, O(1) per query","code":"def build(a):\n    pre = [0] * (len(a) + 1)\n    for i, x in enumerate(a):\n        pre[i + 1] = pre[i] + x\n    return pre\n\ndef range_sum(pre, l, r):      # inclusive l..r\n    return pre[r + 1] - pre[l]","asks":["range sum query — immutable (1-D and 2-D)","running sum of an array","find the pivot / equilibrium index where left sum = right sum","number of ways to split an array into parts with equal sums","average of every prefix, 'minimum value to get positive step by step sum'"],"examples":[{"n":"Range Sum Query — Immutable","s":"LC 303"},{"n":"Find Pivot Index","s":"LC 724"},{"n":"Running Sum of 1d Array","s":"LC 1480"},{"n":"Minimum Value to Get Positive Step by Step Sum","s":"LC 1413"}],"traps":["Use the size n+1 form with pre[0]=0. The size-n form forces an <code>if l == 0</code> branch everywhere.","Inclusive vs exclusive ends — settle it once, write it in a comment, never re-derive mid-exam."],"rare":false,"keys":["range sum query","many queries","sum from l to r","array does not change"]},{"id":"ps-count","name":"Prefix + hashmap — COUNT the subarrays","when":"'How many subarrays sum to K / are divisible by K / have equal counts.' Negatives allowed.","tool":"a dict of prefix-value → how many times it has been seen, seeded with {0: 1}","invariant":"when you are at r, the dict holds every prefix strictly before the current one, so each hit is a real subarray","cx":"O(n) time, O(n) space","code":"def subarray_sum_equals_k(a, k):\n    seen = {0: 1}                  # the empty prefix -- this seed IS the pattern\n    pre = res = 0\n    for x in a:\n        pre += x\n        res += seen.get(pre - k, 0)      # how many earlier prefixes make the gap = k\n        seen[pre] = seen.get(pre, 0) + 1\n    return res","asks":["count subarrays with sum exactly K (negatives allowed)","count subarrays with sum divisible by K — hash <code>pre % k</code>, and in Python <code>%</code> already returns non-negative","count binary subarrays with sum = goal","count nice subarrays (k odd numbers) — map odd→1, even→0","count subarrays with equal numbers of two symbols — map to +1 / −1 and count sum = 0","count subarrays with a given XOR — identical template with xor in place of sum"],"examples":[{"n":"Subarray Sum Equals K","s":"LC 560 — in your own notes"},{"n":"Subarray Sums Divisible by K","s":"LC 974"},{"n":"Binary Subarrays With Sum","s":"LC 930 — in your own notes"},{"n":"Count Number of Nice Subarrays","s":"LC 1248"},{"n":"Count Subarrays With Score Less Than K","s":"LC 2302 — window, not prefix: compare the two"}],"traps":["<code>seen = {0: 1}</code> is not decoration — without it you miss every subarray that starts at index 0.","Count the occurrences, do not just store a boolean, or you undercount repeats.","Record <code>seen[pre]</code> AFTER reading the answer, or a zero-length subarray counts itself."],"rare":false,"keys":["number of subarrays with sum k","divisible by k","count subarrays","equal number of 0s and 1s","subarray XOR equals k","negatives allowed"]},{"id":"ps-longest","name":"Prefix + hashmap — LONGEST / shortest subarray","when":"Same rearrangement, but you want a length, not a count.","tool":"a dict of prefix-value → its FIRST index (seeded {0: -1}); never overwrite","invariant":"the earliest index for each prefix value gives the longest reach to the current r","cx":"O(n) time, O(n) space","code":"def longest_sum_k(a, k):\n    first = {0: -1}                  # prefix value -> earliest index\n    pre = best = 0\n    for i, x in enumerate(a):\n        pre += x\n        if pre - k in first:\n            best = max(best, i - first[pre - k])\n        if pre not in first:         # FIRST occurrence only -> longest span\n            first[pre] = i\n    return best","asks":["longest subarray with sum K (negatives allowed)","contiguous array — longest subarray with equal 0s and 1s (map 0 → −1)","longest subarray divisible by K; continuous subarray sum that is a multiple of k, length ≥ 2 (store the index of each remainder)","longest substring where every vowel appears an even number of times (prefix of a 5-bit MASK)","smallest subarray to remove so the rest is divisible by p (store the latest index instead, to get the shortest)","maximum size subarray sum equals k"],"examples":[{"n":"Contiguous Array","s":"LC 525 — in your own notes"},{"n":"Continuous Subarray Sum","s":"LC 523 — in your own notes"},{"n":"Find Longest Awesome Substring","s":"LC 1542 — bitmask prefix"},{"n":"Find the Longest Substring Containing Vowels in Even Counts","s":"LC 1371 — in your own notes"},{"n":"Make Sum Divisible by P","s":"LC 1590 — in your own notes, shortest variant"},{"n":"Maximum Size Subarray Sum Equals k","s":"LC 325"}],"traps":["LONGEST → keep the FIRST index. SHORTEST → keep the LATEST. Getting this backwards is the classic silent wrong answer.","<code>{0: -1}</code> so a subarray starting at index 0 has the right length.","The 'length ≥ 2' clause in LC 523 is why you store indices rather than counts."],"rare":false,"keys":["longest subarray with sum k","contiguous array","longest with equal counts","shortest with sum, negatives"]},{"id":"ps-2d","name":"2-D prefix sum (integral image)","when":"A matrix, and repeated submatrix-sum queries.","tool":"pre[i+1][j+1] = a[i][j] + pre[i][j+1] + pre[i+1][j] − pre[i][j]","invariant":"pre[i][j] is the sum of the whole rectangle above-and-left of (i, j), exclusive","cx":"O(rows·cols) build, O(1) per query","code":"def build2d(g):\n    R, C = len(g), len(g[0])\n    pre = [[0] * (C + 1) for _ in range(R + 1)]\n    for i in range(R):\n        for j in range(C):\n            pre[i+1][j+1] = g[i][j] + pre[i][j+1] + pre[i+1][j] - pre[i][j]\n    return pre\n\ndef rect(pre, r1, c1, r2, c2):        # inclusive corners\n    return pre[r2+1][c2+1] - pre[r1][c2+1] - pre[r2+1][c1] + pre[r1][c1]","asks":["range sum query 2-D — immutable","count submatrices that sum to a target (fix two rows, then it becomes the 1-D count problem)","maximum side length of a square with sum ≤ threshold (binary search the side + 2-D prefix)","matrix block sum, 'number of 1s in a submatrix'","maximal square / largest all-ones rectangle (usually DP, but prefix sums also work)"],"examples":[{"n":"Range Sum Query 2D — Immutable","s":"LC 304"},{"n":"Number of Submatrices That Sum to Target","s":"LC 1074"},{"n":"Maximum Side Length of a Square with Sum ≤ Threshold","s":"LC 1292"},{"n":"Matrix Block Sum","s":"LC 1314"}],"traps":["Inclusion–exclusion: subtract the two strips, then ADD BACK the corner you removed twice.","Pad with a zero row and column. Without the pad every query needs boundary ifs."],"rare":false,"keys":["submatrix sum","matrix range query","rectangle sum","many rectangle queries"]},{"id":"ps-diff","name":"Difference array (range updates)","when":"Many 'add v to everything in [l, r]' operations, and you only read the array at the end.","tool":"diff[l] += v; diff[r+1] -= v; then one prefix sum rebuilds the array","invariant":"the prefix sum of diff is exactly the accumulated array at any point","cx":"O(1) per update, O(n) once to materialise","code":"def apply_ranges(n, ops):              # ops = [(l, r, v), ...]\n    diff = [0] * (n + 1)\n    for l, r, v in ops:\n        diff[l] += v\n        diff[r + 1] -= v               # the +1 slot is why diff has n+1 cells\n    out, run = [], 0\n    for i in range(n):\n        run += diff[i]\n        out.append(run)\n    return out","asks":["range addition, 'corporate flight bookings'","car pooling / meeting rooms as a timeline of +1 and −1 events","can all N bookings be served without exceeding capacity","number of people in a building at each hour, 'maximum population year'","'shift letters by ranges', apply many range increments to a string","check if the array can be made all-zero with range decrements"],"examples":[{"n":"Corporate Flight Bookings","s":"LC 1109"},{"n":"Car Pooling","s":"LC 1094"},{"n":"Range Addition","s":"LC 370"},{"n":"Shifting Letters II","s":"LC 2381"}],"traps":["Size the diff array n+1, or <code>diff[r+1]</code> overflows on the last range.","This is the same object as a sweep line over +1 / −1 events — recognise them as one pattern."],"rare":false,"keys":["add v to range","range updates","l r v operations","bookings","car pooling","final array after updates"]},{"id":"ps-suffix","name":"Prefix AND suffix pass","when":"Each position needs to know about everything on its left AND everything on its right.","tool":"two passes — one left to right carrying a running value, one right to left","invariant":"after pass one, cell i holds the aggregate of everything strictly left of i","cx":"O(n) time; O(1) extra if you write into the output array","code":"def product_except_self(a):\n    n = len(a)\n    out = [1] * n\n    left = 1\n    for i in range(n):\n        out[i] = left\n        left *= a[i]\n    right = 1\n    for i in range(n - 1, -1, -1):\n        out[i] *= right\n        right *= a[i]\n    return out","asks":["product of array except self (no division allowed)","trapping rain water via prefix-max and suffix-max","candy distribution — one left pass, one right pass","best time to buy and sell stock with two transactions","'can this index be the split point' — compare prefix aggregate with suffix aggregate","maximum sum of two non-overlapping subarrays"],"examples":[{"n":"Product of Array Except Self","s":"LC 238 — in your own notes"},{"n":"Trapping Rain Water","s":"LC 42"},{"n":"Candy","s":"LC 135"},{"n":"Best Time to Buy and Sell Stock III","s":"LC 123"},{"n":"Maximum Sum of Two Non-Overlapping Subarrays","s":"LC 1031"}],"traps":["Write the left pass straight into the output array and carry only a scalar — that is how you get O(1) extra space.","With division you would have to special-case zeros; the two-pass form has no such hole."],"rare":false,"keys":["product except self","left and right","everything except itself","trapping rain water","best split point"]}]},{"id":"binary-search","group":"linear","name":"Binary search","buys":"A linear scan is O(n). Binary search is O(log n); for 'search the answer', a huge range becomes O(n log(range)).","lives":"any ORDERED search space — a sorted array, or the range of possible answers","core":"You don't need a sorted array — you need a space where one check throws away half of it. That means a monotonic predicate: a line that reads FALSE FALSE FALSE TRUE TRUE TRUE, and you're hunting the boundary. Just ask: 'if X works, does every larger X also work?' If yes, binary search applies.","recognise":[{"cue":"<b>sorted</b> array, find / first / last / insert position","note":"the classic form"},{"cue":"<b>minimum X such that</b> … / maximum X such that …","note":"binary search on the answer"},{"cue":"<b>minimum capacity / speed / time / largest minimum / smallest maximum</b>","note":"the five words that give it away every time"},{"cue":"constraints are <b>huge</b> (10⁹, 10¹⁴) but the CHECK is cheap and O(n)","note":"you can't enumerate every answer, so you search for it instead"},{"cue":"<b>rotated</b> sorted array, or a mountain / peak","note":"still enough order to halve"}],"notwhen":["The predicate isn't monotonic (true at 5, false at 6, true at 7) — halving simply gives a wrong answer.","n is small enough that a linear scan fits the time budget — don't add bug surface for nothing.","You want the k-th smallest in a stream → heap, not binary search."],"pick":[{"if":"a sorted array, exact value","then":"bs-exact"},{"if":"first / last occurrence, insert position, 'count of elements ≤ x'","then":"bs-bound"},{"if":"'minimum/maximum X such that', huge range, cheap feasibility check","then":"bs-answer"},{"if":"rotated, mountain, or otherwise locally ordered","then":"bs-rotated"},{"if":"two sorted arrays and you binary search the SPLIT, not an element","then":"bs-partition"}],"variants":[{"id":"bs-exact","name":"Classic — find the value","when":"Sorted array, is x here and where.","tool":"lo, hi inclusive; mid = (lo + hi) // 2","invariant":"if x exists, it is always inside [lo, hi]","cx":"O(log n)","code":"def search(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:                 # inclusive bounds -> <=\n        mid = (lo + hi) // 2\n        if a[mid] == x:\n            return mid\n        if a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1","asks":["search in a sorted array; search a 2-D matrix (treat it as one flat sorted array)","guess number higher or lower; first bad version","valid perfect square, sqrt(x) by integer search","search in an unknown-length / infinite sorted stream (double the bound first, then search)"],"examples":[{"n":"Binary Search","s":"LC 704"},{"n":"Search a 2D Matrix","s":"LC 74"},{"n":"First Bad Version","s":"LC 278"},{"n":"Sqrt(x)","s":"LC 69"}],"traps":["Pick ONE convention (inclusive hi with <code>&lt;=</code>, or exclusive hi with <code>&lt;</code>) and never mix them.","<code>mid = lo + (hi - lo) // 2</code> in C++/Java to dodge overflow. Python integers do not overflow, so either is fine here.","Every branch must shrink the range, or you loop forever."],"rare":false,"keys":["sorted, find target","search in a sorted","search a 2D matrix","O(log n) required"]},{"id":"bs-bound","name":"Lower / upper bound (the boundary)","when":"First occurrence, last occurrence, insert position, 'how many are ≤ x'.","tool":"half-open [lo, hi); shrink toward the first index where the predicate turns TRUE","invariant":"everything left of lo is FALSE, everything at or right of hi is TRUE — so lo lands on the boundary","cx":"O(log n)","code":"def lower_bound(a, x):              # first index with a[i] >= x\n    lo, hi = 0, len(a)              # half-open: hi = n, loop while lo < hi\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo                       # == bisect_left(a, x)\n\n# upper_bound: swap the test to  a[mid] <= x   -> bisect_right\n# count of x  = upper_bound(a, x) - lower_bound(a, x)","asks":["first and last position of an element in a sorted array","search insert position","count of occurrences of x; count of elements less than x","find K closest elements (binary search the left edge of the window)","smallest element greater than target ('ceiling' / 'successor')","longest increasing subsequence in O(n log n) — lower_bound into the tails array","'count pairs / count values ≤ mid' as the CHECK inside a binary search on the answer"],"examples":[{"n":"Find First and Last Position in Sorted Array","s":"LC 34"},{"n":"Search Insert Position","s":"LC 35"},{"n":"Find K Closest Elements","s":"LC 658"},{"n":"Longest Increasing Subsequence","s":"LC 300 — the O(n log n) version"}],"traps":["In Python just use <code>bisect_left</code> / <code>bisect_right</code> unless the interviewer wants the loop.","lower_bound returns n when every element is smaller — check the index before dereferencing it.","'Last occurrence' = upper_bound − 1, not a separate search."],"rare":false,"keys":["first occurrence","last occurrence","insert position","count less than or equal","first bad"]},{"id":"bs-answer","name":"Binary search ON THE ANSWER","when":"'Minimum / maximum X such that a condition holds', the range of X is huge, and checking one X is cheap.","tool":"a <code>feasible(x)</code> function that is monotonic; binary search over the VALUE range, not the array","invariant":"feasible is FALSE below the boundary and TRUE at and above it (or the mirror image)","cx":"O(n log(range)) — the check is O(n), the search adds a log","code":"def min_feasible(lo, hi, feasible):      # feasible: False...False True...True\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if feasible(mid):\n            hi = mid                 # mid might be the answer -> keep it\n        else:\n            lo = mid + 1\n    return lo\n\n# example: minimum eating speed so that all bananas are gone within h hours\ndef min_speed(piles, h):\n    import math\n    def feasible(k):\n        return sum(math.ceil(p / k) for p in piles) <= h\n    return min_feasible(1, max(piles), feasible)","asks":["minimum eating speed / minimum ship capacity to finish within D days","split array into m parts, minimise the largest part sum","minimum days to make m bouquets","magnetic force between balls / aggressive cows — maximise the minimum gap","minimum time to complete trips / to finish all jobs","smallest divisor given a threshold","maximum number of candies / pieces each child gets","kth smallest element in a sorted matrix or in a multiplication table (count how many are ≤ mid)","minimise the maximum distance to a gas station (real-valued — iterate a fixed 100 times instead of exact equality)"],"examples":[{"n":"Koko Eating Bananas","s":"LC 875"},{"n":"Capacity To Ship Packages Within D Days","s":"LC 1011"},{"n":"Split Array Largest Sum","s":"LC 410"},{"n":"Minimum Number of Days to Make m Bouquets","s":"LC 1482"},{"n":"Magnetic Force Between Two Balls","s":"LC 1552"},{"n":"Kth Smallest Element in a Sorted Matrix","s":"LC 378"},{"n":"Smallest Divisor Given a Threshold","s":"LC 1283"}],"traps":["State the monotonicity out loud before coding: 'a bigger ship can always carry what a smaller one could'. If you cannot say that sentence, this is the wrong pattern.","Set lo and hi to real bounds — lo = max(weights) not 1, when one item must fit in one trip.","'Maximise the minimum' is the mirror: move <code>lo = mid</code> and use <code>mid = (lo + hi + 1) // 2</code> to avoid an infinite loop.","For 'largest minimum' problems the answer is the LAST true, not the first."],"rare":false,"keys":["minimum possible maximum","maximum possible minimum","smallest speed such that","ship within d days","minimise the largest","k-th smallest by counting"]},{"id":"bs-rotated","name":"Rotated / mountain — locally ordered","when":"Not globally sorted, but each step still tells you which half to drop.","tool":"compare a[mid] with an endpoint to learn which half is clean, then test whether the target lies inside it","invariant":"at least one of the two halves is always perfectly sorted","cx":"O(log n) (O(n) worst case with duplicates)","code":"def search_rotated(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == x:\n            return mid\n        if a[lo] <= a[mid]:                      # left half is sorted\n            if a[lo] <= x < a[mid]: hi = mid - 1\n            else:                   lo = mid + 1\n        else:                                     # right half is sorted\n            if a[mid] < x <= a[hi]: lo = mid + 1\n            else:                   hi = mid - 1\n    return -1","asks":["search in a rotated sorted array (with and without duplicates)","find the minimum in a rotated sorted array / how many times it was rotated","peak element; peak of a mountain array","find in a mountain array (locate the peak, then two ordinary searches)","single element in a sorted array where everything else appears twice (search on index parity)","first element greater than itself, 'find any local maximum'"],"examples":[{"n":"Search in Rotated Sorted Array","s":"LC 33"},{"n":"Find Minimum in Rotated Sorted Array","s":"LC 153"},{"n":"Find Peak Element","s":"LC 162"},{"n":"Peak Index in a Mountain Array","s":"LC 852"},{"n":"Single Element in a Sorted Array","s":"LC 540"}],"traps":["Duplicates break the 'which half is sorted' test (a[lo] == a[mid] == a[hi]); you must shrink lo/hi by one, which is O(n) worst case.","For 'find the minimum' compare against <code>a[hi]</code>, not <code>a[lo]</code> — comparing to lo fails on an unrotated array.","Peak-finding needs no sortedness at all, only that neighbours differ."],"rare":false,"keys":["rotated sorted","pivot","mountain array","peak element","bitonic"]},{"id":"bs-partition","name":"Binary search the PARTITION","when":"Two sorted arrays, and the answer is a split point rather than an element.","tool":"search how many elements of the SHORTER array go to the left side; derive the rest","invariant":"left side always holds exactly half the total, and every left element ≤ every right element","cx":"O(log min(n, m))","code":"def median_two_sorted(a, b):\n    if len(a) > len(b): a, b = b, a\n    n, m = len(a), len(b)\n    half = (n + m + 1) // 2\n    lo, hi = 0, n\n    while lo <= hi:\n        i = (lo + hi) // 2            # take i from a, the rest from b\n        j = half - i\n        aL = a[i-1] if i > 0 else float('-inf')\n        aR = a[i]   if i < n else float('inf')\n        bL = b[j-1] if j > 0 else float('-inf')\n        bR = b[j]   if j < m else float('inf')\n        if aL <= bR and bL <= aR:\n            if (n + m) % 2: return max(aL, bL)\n            return (max(aL, bL) + min(aR, bR)) / 2\n        if aL > bR: hi = i - 1\n        else:       lo = i + 1","asks":["median of two sorted arrays","k-th smallest element across two sorted arrays","k-th smallest in a sorted matrix (the counting form is usually easier)","split two arrays so both halves are balanced"],"examples":[{"n":"Median of Two Sorted Arrays","s":"LC 4"},{"n":"Kth Smallest Element in a Sorted Matrix","s":"LC 378"}],"traps":["Always search the SHORTER array, or j goes out of range.","The ±infinity sentinels replace four boundary ifs — write them, do not branch.","This one is worth memorising rather than deriving under exam pressure."],"rare":false,"keys":["median of two sorted arrays","k-th of two sorted","partition two arrays"]}]},{"id":"hashing","group":"linear","name":"Hashing (map & set)","buys":"Searching for an element is O(n). A hashmap does it in O(1), turning O(n²) into O(n).","lives":"anything you can use as a dict key — numbers, characters, tuples, frozensets, sorted strings","core":"Trade memory for time. Walk through once, and at each element ask the dict a question about the PAST: have I seen this, how many times, where was it. The whole skill is picking the right key — the value itself, a remainder, the sorted letters, a (row, col) pair, some normalised shape.","recognise":[{"cue":"<b>have I seen this before</b> / is there a duplicate","note":"set"},{"cue":"<b>how many times</b> does each thing appear","note":"Counter / frequency map"},{"cue":"<b>group together</b> things that share a property","note":"dict of key → list"},{"cue":"you need the <b>index</b> of the partner, not just that it exists","note":"dict value → index"},{"cue":"<b>unsorted</b> input and the question is about existence","note":"sorting would waste your O(n) budget"},{"cue":"<b>majority</b>, 'more than half the elements'","note":"Boyer-Moore vote"}],"notwhen":["Values are a small dense range 1..n → an ARRAY works as a faster hashmap, and if you can mutate the input, <b>cyclic sort / index-as-hash</b> does it in O(1) space.","Input is already sorted and you want a pair → use two pointers instead, O(1) space.","You need an ORDER (smallest, k-th) → use a heap or sorting; a hashmap has no order."],"pick":[{"if":"existence or duplicate detection only","then":"hs-seen"},{"if":"counts, 'most frequent', anagram checks","then":"hs-freq"},{"if":"you must return indices or distances","then":"hs-index"},{"if":"bucket items by a derived key","then":"hs-group"},{"if":"values are exactly 1..n and O(1) space is demanded","then":"hs-cyclic"},{"if":"more than n/2 and O(1) space","then":"hs-moore"}],"variants":[{"id":"hs-seen","name":"Seen-before set","when":"Existence, duplicates, membership tests.","tool":"a set; add as you go, test before you add","invariant":"the set holds exactly the elements strictly before the current index","cx":"O(n) time, O(n) space","code":"def has_duplicate(a):\n    seen = set()\n    for x in a:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False","asks":["contains duplicate; contains duplicate within distance k (set of the last k, or a dict of indices)","happy number, cycle detection in a sequence of states","longest consecutive sequence (set membership, start only where x-1 is absent — O(n))","intersection of two arrays; missing / extra element between two arrays","valid sudoku (sets per row, column and box)","'is this word in the dictionary' lookups inside a DP"],"examples":[{"n":"Contains Duplicate","s":"LC 217"},{"n":"Contains Duplicate II","s":"LC 219 — in your own notes"},{"n":"Longest Consecutive Sequence","s":"LC 128"},{"n":"Happy Number","s":"LC 202"},{"n":"Valid Sudoku","s":"LC 36"}],"traps":["Longest-consecutive is only O(n) because you start a walk ONLY at sequence starts. Without that check it is O(n²).","Sets are unordered — never rely on iteration order for an answer."],"rare":false,"keys":["contains duplicate","first repeated","already seen","exists in","longest consecutive sequence","unique"]},{"id":"hs-freq","name":"Frequency map","when":"Counts drive the answer: most frequent, anagram, 'can we rearrange'.","tool":"<code>collections.Counter</code>, or a 26-slot list for lowercase letters","invariant":"the map is the exact multiset of what you have consumed","cx":"O(n) time, O(k) space for k distinct keys","code":"from collections import Counter\ndef is_anagram(s, t):\n    return len(s) == len(t) and Counter(s) == Counter(t)\n\ndef top_k_frequent(a, k):\n    cnt = Counter(a)\n    return [x for x, _ in cnt.most_common(k)]      # or bucket sort for O(n)","asks":["valid anagram; group anagrams (key = sorted word or the 26-count tuple)","top K frequent elements / words (heap, or bucket sort by count for O(n))","first unique character; find all duplicates","ransom note, 'can string a be built from string b'","longest palindrome you can build from the letters","sort characters by frequency; reorganise a string so no two neighbours match (counts + heap)","minimum window substring and all anagram windows (counts INSIDE a sliding window)","check if two strings are k-anagrams / one edit apart"],"examples":[{"n":"Valid Anagram","s":"LC 242"},{"n":"Group Anagrams","s":"LC 49"},{"n":"Top K Frequent Elements","s":"LC 347"},{"n":"First Unique Character in a String","s":"LC 387"},{"n":"Reorganize String","s":"LC 767"},{"n":"Longest Palindrome","s":"LC 409"}],"traps":["<code>Counter</code> returns 0 for missing keys but <code>dict</code> raises — use <code>.get(k, 0)</code> or defaultdict.","Comparing whole Counters inside a sliding window is O(26) per step; a 'matched characters' counter makes it O(1).","Deleting zero-count keys matters whenever you test <code>len(cnt)</code>."],"rare":false,"keys":["most frequent","count occurrences","anagram","can be rearranged","first unique","frequency"]},{"id":"hs-index","name":"Value → index map","when":"You must return positions, or measure a distance between occurrences.","tool":"dict mapping the value (or a derived key) to where you last / first saw it","invariant":"the map answers 'where was the partner' in O(1)","cx":"O(n) time, O(n) space","code":"def two_sum(a, target):\n    pos = {}\n    for i, x in enumerate(a):\n        if target - x in pos:            # check BEFORE inserting, or x pairs with itself\n            return [pos[target - x], i]\n        pos[x] = i\n    return []","asks":["two sum (unsorted, indices required)","contains duplicate within distance k","prefix-sum lookups — subarray sum equals K, longest subarray with sum K (see Prefix sum)","isomorphic strings / word pattern (two maps, one each way)","minimum index sum of common restaurants","LRU cache (dict + doubly linked list)","first / last occurrence of each character for partitioning (partition labels)"],"examples":[{"n":"Two Sum","s":"LC 1"},{"n":"Isomorphic Strings","s":"LC 205"},{"n":"Partition Labels","s":"LC 763"},{"n":"LRU Cache","s":"LC 146"}],"traps":["Test the partner BEFORE inserting the current element, or an element matches itself.","Isomorphic / word-pattern needs a map in BOTH directions; one direction passes the samples and fails the tests.","First index or last index — decide which, exactly as in the prefix-sum variants."],"rare":false,"keys":["two sum","return indices","distance between same values","nearby duplicate","last seen position"]},{"id":"hs-group","name":"Group by a derived key","when":"Bucket items that share a normalised form.","tool":"<code>defaultdict(list)</code>, keyed by the invariant you invent","invariant":"two items land in the same bucket exactly when they are equivalent under your key","cx":"O(n · cost-of-key)","code":"from collections import defaultdict\ndef group_anagrams(words):\n    g = defaultdict(list)\n    for w in words:\n        key = tuple(sorted(w))            # or a 26-length count tuple -> O(len) not O(len log len)\n        g[key].append(w)\n    return list(g.values())","asks":["group anagrams; group shifted strings; group by the pattern of a word","group people by birth year / by prefix / by domain","find duplicate files by content hash","number of boomerangs, lines through the most points (key = the normalised slope)","group identical subtrees (key = the serialised subtree — same idea as your HackerEarth 'echo structure' question)","bulls and cows, 'count matching pairs by key'"],"examples":[{"n":"Group Anagrams","s":"LC 49"},{"n":"Group Shifted Strings","s":"LC 249"},{"n":"Find Duplicate Subtrees","s":"LC 652"},{"n":"Max Points on a Line","s":"LC 149"},{"n":"Find Duplicate File in System","s":"LC 609"}],"traps":["Keys must be hashable and canonical — tuples not lists, and normalise the slope by dividing by gcd (and fix the sign).","Floating point keys compare badly; use an exact fraction as a tuple instead."],"rare":false,"keys":["group anagrams","group by","same pattern","isomorphic","canonical form","bucket by"]},{"id":"hs-cyclic","name":"Cyclic sort / index-as-hash","when":"Values are exactly 1..n (or 0..n−1) and O(1) extra space is demanded.","tool":"the array itself — put value v at index v−1, or mark presence by negating a[v−1]","invariant":"after the pass, any index whose value does not match is exactly the anomaly","cx":"O(n) time, O(1) space","code":"def find_missing_and_duplicate(a):\n    n = len(a)\n    for i in range(n):\n        while a[i] != a[a[i] - 1]:        # send a[i] home; while, not if\n            j = a[i] - 1\n            a[i], a[j] = a[j], a[i]\n    for i in range(n):\n        if a[i] != i + 1:\n            return {\"duplicate\": a[i], \"missing\": i + 1}","asks":["missing number / all numbers disappeared from the array","find all duplicates in an array where 1 ≤ a[i] ≤ n","set mismatch (one duplicate and one missing)","first missing POSITIVE integer (the hard one — same template, ignore out-of-range values)","find the duplicate number without modifying the array (that one is Floyd's cycle detection instead)"],"examples":[{"n":"Missing Number","s":"LC 268"},{"n":"Find All Numbers Disappeared in an Array","s":"LC 448"},{"n":"Find All Duplicates in an Array","s":"LC 442"},{"n":"First Missing Positive","s":"LC 41"},{"n":"Find the Duplicate Number","s":"LC 287 — fast & slow pointers"}],"traps":["Swap in a <code>while</code>, not an <code>if</code> — the value you receive may also be out of place.","Guard the swap condition against an infinite loop when two equal values both want the same slot.","LC 287 forbids modifying the array, which is why it becomes a cycle-detection problem, not this one."],"rare":false,"keys":["numbers from 1 to n","first missing positive","find the missing","find the duplicate","O(1) extra space and values in range"]},{"id":"hs-moore","name":"Boyer-Moore majority vote","when":"An element appears more than n/2 (or n/3) times, and O(1) extra space is demanded.","tool":"one candidate and one counter","invariant":"if a majority exists it survives every cancellation of pairs","cx":"O(n) time, O(1) space","code":"def majority(nums):\n    cand, count = None, 0\n    for x in nums:\n        if count == 0:\n            cand = x\n        count += 1 if x == cand else -1\n    return cand if nums.count(cand) > len(nums) // 2 else None   # verify","asks":["the element appearing more than n/2 times","all elements appearing more than n/3 times (two candidates)","does a majority exist at all"],"examples":[{"n":"Majority Element","s":"LC 169"},{"n":"Majority Element II","s":"LC 229"}],"traps":["If a majority is not guaranteed, verify the candidate with a second pass.","For n/3 keep TWO candidates. There can be at most two such values."],"keys":["majority","more than half","more than n/2 times","more than n/3 times","O(1) space"],"rare":false}]},{"id":"monotonic-stack","group":"linear","name":"Stack & monotonic stack","buys":"'Scan right until I find a bigger one' is O(n²). A monotonic stack does it in O(n).","lives":"array (next-greater family), string (matching / parsing)","core":"A plain stack remembers what is still OPEN — unmatched brackets, unfinished frames. A MONOTONIC stack goes further: it only keeps candidates that can still win. The moment a new element beats one sitting on the stack, that stacked element's answer is decided, so you pop it and resolve it. Every index gets pushed once and popped once, so it's O(n).","recognise":[{"cue":"<b>next greater</b> / next smaller / previous greater / previous smaller","note":"textbook monotonic stack"},{"cue":"<b>span</b>, 'days until warmer', 'how far until'","note":"the same idea, reported as a distance"},{"cue":"<b>histogram</b>, largest rectangle, maximal area","note":"previous-smaller and next-smaller on each bar"},{"cue":"<b>brackets</b>, nesting, 'valid parentheses', decode a nested string","note":"plain stack"},{"cue":"<b>remove k digits</b> / smallest number after removals / lexicographically smallest","note":"greedy + monotonic stack"},{"cue":"<b>sum over all subarrays</b> of the min or max","note":"count each element's contribution"}],"notwhen":["You need the max of a fixed WINDOW → use a monotonic <b>deque</b> instead, since elements also expire from the front.","You need the k largest overall → use a heap.","The relation is recursive over a tree → use plain DFS."],"pick":[{"if":"'next/previous greater or smaller' or a distance to it","then":"ms-next"},{"if":"area / rectangle / water trapped between bars","then":"ms-hist"},{"if":"matching, nesting, undo, evaluate an expression","then":"ms-match"},{"if":"build the lexicographically best sequence under a removal budget","then":"ms-greedy"},{"if":"sum, over all subarrays, of a min or max","then":"ms-contrib"}],"variants":[{"id":"ms-next","name":"Next greater / smaller element","when":"For every element, find the first element to its right (or left) that is bigger or smaller.","tool":"a stack of INDICES whose values are monotonic; pop and resolve when the new element breaks the order","invariant":"the stack holds indices still waiting for their answer, in decreasing value order (for next-greater)","cx":"O(n) time, O(n) space","code":"def next_greater(a):\n    res = [-1] * len(a)\n    st = []                            # indices, values DECREASING\n    for i, x in enumerate(a):\n        while st and a[st[-1]] < x:    # x resolves everything smaller\n            res[st.pop()] = x\n        st.append(i)\n    return res                          # leftovers keep -1: nothing greater exists","asks":["next greater element I / II (circular — loop the array twice, mod n)","daily temperatures (report the index distance, not the value)","stock span problem (previous greater)","next smaller element, 'first smaller to the left'","sum of subarray minimums / maximums (count how many subarrays each element dominates)","number of visible people in a queue; buildings with an ocean view","132 pattern"],"examples":[{"n":"Daily Temperatures","s":"LC 739"},{"n":"Next Greater Element II (circular)","s":"LC 503"},{"n":"Online Stock Span","s":"LC 901"},{"n":"Sum of Subarray Minimums","s":"LC 907"},{"n":"Buildings With an Ocean View","s":"LC 1762"},{"n":"132 Pattern","s":"LC 456"}],"traps":["Store indices when the answer is a distance; values are enough only when the answer is the value.","Decide <code>&lt;</code> versus <code>&lt;=</code> deliberately — it decides how DUPLICATES are attributed, which is the whole correctness of 'sum of subarray minimums'.","Circular versions iterate <code>2n</code> times with <code>i % n</code>, pushing only in the first pass."],"rare":false,"keys":["next greater","next smaller","days until warmer","stock span","previous smaller","first taller to the right"]},{"id":"ms-hist","name":"Histogram / area between bars","when":"Largest rectangle, maximal area, water trapped — each bar needs its reach on BOTH sides.","tool":"an increasing stack; when a shorter bar arrives, the popped bar's rectangle is finished","invariant":"for a popped bar, the new index is its first smaller to the right and the stack top is its first smaller to the left","cx":"O(n) time, O(n) space","code":"def largest_rectangle(h):\n    st, best = [], 0                     # indices, heights INCREASING\n    for i, x in enumerate(h + [0]):      # the sentinel 0 flushes the stack\n        while st and h[st[-1]] > x:\n            height = h[st.pop()]\n            left = st[-1] + 1 if st else 0\n            best = max(best, height * (i - left))\n        st.append(i)\n    return best","asks":["largest rectangle in a histogram","maximal rectangle in a binary matrix (run the histogram row by row)","trapping rain water (stack form, or prefix-max / two-pointer form)","largest square / maximal area under constraints","sum of subarray ranges (max minus min over all subarrays)","remove duplicate letters while keeping order"],"examples":[{"n":"Largest Rectangle in Histogram","s":"LC 84"},{"n":"Maximal Rectangle","s":"LC 85"},{"n":"Trapping Rain Water","s":"LC 42"},{"n":"Sum of Subarray Ranges","s":"LC 2104"}],"traps":["Append a sentinel 0 (or flush after the loop), or bars left on the stack never get measured.","The width uses the NEW stack top after popping, not the popped index — this is the single most common bug here.","Equal heights: popping on <code>&gt;</code> vs <code>&gt;=</code> changes which bar claims the width, but the maximum comes out the same."],"rare":false,"keys":["largest rectangle","histogram","maximal rectangle","trapped water","bars"]},{"id":"ms-match","name":"Plain stack — matching, nesting, parsing","when":"Brackets, nested structures, undo, expression evaluation.","tool":"push the opener (or the current frame), pop on the closer and check the pair","invariant":"the stack is exactly the list of things still unclosed, innermost on top","cx":"O(n) time, O(n) space","code":"def valid_parentheses(s):\n    pair = {')': '(', ']': '[', '}': '{'}\n    st = []\n    for ch in s:\n        if ch in pair:\n            if not st or st.pop() != pair[ch]:\n                return False\n        else:\n            st.append(ch)\n    return not st                       # anything left open = invalid","asks":["valid parentheses; minimum add / remove to make parentheses valid","longest valid parentheses substring (stack of indices, or a two-pass counter)","decode string 'k[encoded]' — push the count and the partial string","evaluate reverse Polish notation; basic calculator I / II / III","simplify a unix path; remove all adjacent duplicates; backspace string compare","asteroid collision; make the string great","score of parentheses; maximum nesting depth","baseball game, 'undo the last operation'"],"examples":[{"n":"Valid Parentheses","s":"LC 20"},{"n":"Decode String","s":"LC 394"},{"n":"Evaluate Reverse Polish Notation","s":"LC 150"},{"n":"Basic Calculator II","s":"LC 227"},{"n":"Asteroid Collision","s":"LC 735"},{"n":"Simplify Path","s":"LC 71"},{"n":"Longest Valid Parentheses","s":"LC 32"}],"traps":["Check the stack is non-empty BEFORE popping, and check it is EMPTY at the end. Both halves are graded.","In Decode String push both the repeat count and the string built so far, then rebuild on ']'.","Calculator problems: handle the final pending number after the loop ends."],"rare":false,"keys":["valid parentheses","balanced brackets","evaluate expression","decode string","undo","nested","simplify path"]},{"id":"ms-greedy","name":"Monotonic stack as a greedy builder","when":"'Smallest / largest possible sequence after removing k items', order must be preserved.","tool":"build the answer on a stack; pop while the top is worse than the newcomer and you still have budget","invariant":"the stack is the best possible prefix achievable so far with the removals already spent","cx":"O(n) time","code":"def remove_k_digits(num, k):\n    st = []\n    for ch in num:\n        while k and st and st[-1] > ch:   # a bigger digit earlier is always worse\n            st.pop(); k -= 1\n        st.append(ch)\n    st = st[:len(st) - k] if k else st    # budget unspent -> drop from the end\n    return ''.join(st).lstrip('0') or '0'","asks":["remove k digits to make the smallest number","create the maximum number of length k (from one array, or merged from two)","remove duplicate letters / smallest subsequence of distinct characters","maximum swap, 'largest number after one exchange'","find the most competitive subsequence of size k","stamping / lexicographically smallest string after operations"],"examples":[{"n":"Remove K Digits","s":"LC 402"},{"n":"Remove Duplicate Letters","s":"LC 316"},{"n":"Find the Most Competitive Subsequence","s":"LC 1673"},{"n":"Create Maximum Number","s":"LC 321"},{"n":"Maximum Swap","s":"LC 670"}],"traps":["If the budget is unspent at the end, trim from the BACK — the input was already non-decreasing.","Leading zeros, and the empty result, need an explicit fallback.","'Distinct letters' versions also need a 'last occurrence' table so you never pop a letter you cannot get back."],"rare":false,"keys":["remove k digits","smallest possible after removing","lexicographically smallest subsequence","remove duplicate letters","keep order"]},{"id":"ms-contrib","name":"Contribution of each element","when":"SUM over all subarrays of their minimum, maximum or range.","tool":"a monotonic stack giving each element's left and right reach","invariant":"element i is the minimum of exactly (i−left)·(right−i) subarrays","cx":"O(n) time, O(n) space","code":"def sum_subarray_mins(a):\n    n, total, stack = len(a), 0, []\n    for i in range(n + 1):\n        cur = a[i] if i < n else float(\"-inf\")   # sentinel flushes the stack\n        while stack and a[stack[-1]] >= cur:\n            m = stack.pop()\n            left = stack[-1] if stack else -1\n            total += a[m] * (m - left) * (i - m)\n        stack.append(i)\n    return total","asks":["sum of minimums of all subarrays","sum of (max − min) of all subarrays","maximum of min × sum across subarrays","count subarrays in which a[i] is the maximum"],"examples":[{"n":"Sum of Subarray Minimums","s":"LC 907"},{"n":"Sum of Subarray Ranges","s":"LC 2104"},{"n":"Maximum Subarray Min-Product","s":"LC 1856"}],"traps":["Equal values: use &gt;= on one side and &gt; on the other, or duplicates are counted twice.","Apply the modulo the question asks for, in languages without big integers."],"keys":["sum over all subarrays","sum of minimums","for every subarray","each element contributes"],"rare":false}]},{"id":"heap","group":"linear","name":"Heap (priority queue)","buys":"A full sort is O(n log n). If you only need the extremes, a heap gets it in O(n log k).","lives":"any stream or collection where you repeatedly need the current best","core":"A heap hands you the smallest (or largest) item in O(1), and lets you swap it out in O(log n). Reach for it when you need 'the best remaining' over and over again — especially when the collection keeps CHANGING, which is exactly when sorting once isn't enough.","recognise":[{"cue":"<b>K largest / K smallest / K closest / K most frequent</b>","note":"a heap of size K"},{"cue":"<b>streaming</b>, 'at any time', 'as numbers arrive'","note":"you can't re-sort on every query"},{"cue":"<b>merge K sorted</b> lists or arrays","note":"heap of the k current heads"},{"cue":"<b>median</b> of a stream","note":"two heaps, balanced"},{"cue":"repeatedly 'take the biggest / cheapest and then update it'","note":"greedy driven by a heap"},{"cue":"<b>closest value</b>, floor or ceiling, with inserts and deletes","note":"sorted container"}],"notwhen":["You need the k-th element ONCE from a static array → quickselect is O(n) on average.","Counts are small integers → bucket sort by count is O(n), beating O(n log k).","You need lookups at arbitrary positions, or ordered traversal → use a balanced BST / sorted list, not a heap."],"pick":[{"if":"'K largest / smallest / closest / most frequent'","then":"hp-topk"},{"if":"k sorted sequences to interleave","then":"hp-merge"},{"if":"a running median or a balanced split","then":"hp-two"},{"if":"schedule / simulate 'always serve the most urgent next'","then":"hp-greedy"},{"if":"nearest value, while items are added AND removed","then":"hp-sorted"}],"variants":[{"id":"hp-topk","name":"Heap of size K","when":"Only the K extreme elements matter.","tool":"a MIN-heap of size k for the k LARGEST (the weakest survivor sits on top, ready to be evicted)","invariant":"the heap always holds the best k seen so far, and its root is the worst of those k","cx":"O(n log k) time, O(k) space","code":"import heapq\ndef k_largest(a, k):\n    h = []\n    for x in a:\n        heapq.heappush(h, x)\n        if len(h) > k:\n            heapq.heappop(h)          # evict the smallest -> k largest survive\n    return h                           # h[0] is the k-th largest\n\n# Python has only a MIN-heap. For a max-heap push -x, or use heapq.nlargest(k, a).","asks":["k-th largest / smallest element in an array or a stream","top K frequent elements or words (count first, then heap by count)","K closest points to the origin; K closest numbers to x","k-th largest element in a stream (a class with add())","last stone weight; maximum score after k operations","minimum cost to connect sticks / ropes (always join the two cheapest)","furthest building you can reach with ladders and bricks"],"examples":[{"n":"Kth Largest Element in an Array","s":"LC 215"},{"n":"Top K Frequent Elements","s":"LC 347"},{"n":"K Closest Points to Origin","s":"LC 973"},{"n":"Kth Largest Element in a Stream","s":"LC 703"},{"n":"Last Stone Weight","s":"LC 1046"},{"n":"Minimum Cost to Connect Sticks","s":"LC 1167"},{"n":"Furthest Building You Can Reach","s":"LC 1642"}],"traps":["K largest needs a MIN-heap, k smallest needs a MAX-heap. Getting this inverted is the classic slip.","Python's heapq is min-only: negate for a max-heap, and remember to negate back.","For tuples, ties compare the second field — push <code>(key, index, item)</code> so items never get compared directly."],"rare":false,"keys":["top k","k largest","k most frequent","k-th largest in a stream","k closest"]},{"id":"hp-merge","name":"Merge K sorted sequences","when":"k sorted lists/arrays to combine, or a sorted matrix to walk in order.","tool":"heap holding one entry per sequence: (value, which sequence, position)","invariant":"the heap always contains the smallest unconsumed element of every live sequence","cx":"O(N log k) for N total elements","code":"import heapq\ndef merge_k(lists):\n    h = [(l[0], i, 0) for i, l in enumerate(lists) if l]\n    heapq.heapify(h)\n    out = []\n    while h:\n        val, i, j = heapq.heappop(h)\n        out.append(val)\n        if j + 1 < len(lists[i]):\n            heapq.heappush(h, (lists[i][j+1], i, j+1))\n    return out","asks":["merge k sorted lists / arrays","smallest range covering elements from k lists","k-th smallest element in a sorted matrix (heap form; binary search is the faster form)","find k pairs with the smallest sums","ugly number II / super ugly number (heap of generated candidates)","k-th smallest sum of two arrays"],"examples":[{"n":"Merge k Sorted Lists","s":"LC 23"},{"n":"Smallest Range Covering Elements from K Lists","s":"LC 632"},{"n":"Find K Pairs with Smallest Sums","s":"LC 373"},{"n":"Kth Smallest Element in a Sorted Matrix","s":"LC 378"}],"traps":["Push the index alongside the value, or you cannot find the successor.","Skip empty lists when seeding, or you index [0] on nothing.","For k-pairs, seed only the first row and expand — seeding every pair defeats the point."],"rare":false,"keys":["merge k sorted","k sorted lists","smallest range covering k lists","k-th smallest in sorted matrix"]},{"id":"hp-two","name":"Two heaps (running median / balance)","when":"You need the middle of a changing collection, or to balance two halves.","tool":"a max-heap for the lower half, a min-heap for the upper half, sizes within one","invariant":"every element in the low heap ≤ every element in the high heap, and |low| − |high| ∈ {0, 1}","cx":"O(log n) per insert, O(1) per median","code":"import heapq\nclass MedianFinder:\n    def __init__(self):\n        self.lo = []      # max-heap via negation (lower half)\n        self.hi = []      # min-heap (upper half)\n    def add(self, x):\n        heapq.heappush(self.lo, -x)\n        heapq.heappush(self.hi, -heapq.heappop(self.lo))   # pass the biggest up\n        if len(self.hi) > len(self.lo):                     # rebalance\n            heapq.heappush(self.lo, -heapq.heappop(self.hi))\n    def median(self):\n        if len(self.lo) > len(self.hi):\n            return -self.lo[0]\n        return (-self.lo[0] + self.hi[0]) / 2","asks":["find the median from a data stream","sliding window median (needs lazy deletion, or a sorted container)","IPO / maximise capital (two structures: one by cost, one by profit)","balance two halves by cost, 'minimum cost to move chips / to equal heights'","schedule tasks so the load stays balanced"],"examples":[{"n":"Find Median from Data Stream","s":"LC 295"},{"n":"Sliding Window Median","s":"LC 480"},{"n":"IPO","s":"LC 502"}],"traps":["Always push-then-transfer so the ordering invariant holds; pushing straight into the 'right' heap breaks it.","Rebalance after EVERY insert, not at query time.","Heaps cannot delete from the middle — the sliding-window version needs lazy deletion with a counter."],"rare":false,"keys":["median of a stream","running median","data stream","balance two halves"]},{"id":"hp-greedy","name":"Heap-driven greedy / simulation","when":"A process where each step you must serve 'the most urgent / cheapest / largest' and then update it.","tool":"a heap as the ready-queue, often with a second ordering (time, then priority)","invariant":"the heap top is always the correct next thing to serve under the greedy rule","cx":"O(n log n)","code":"import heapq\ndef min_meeting_rooms(intervals):\n    intervals.sort()                      # by start time\n    ends = []                             # min-heap of end times\n    for s, e in intervals:\n        if ends and ends[0] <= s:\n            heapq.heappop(ends)           # a room has freed up\n        heapq.heappush(ends, e)\n    return len(ends)                      # rooms in use at the peak","asks":["meeting rooms II — minimum number of rooms","task scheduler with cooldown; reorganise string","CPU / single-threaded scheduling by shortest job next","maximum events that can be attended","car fleet, 'process in sorted order but resolve by a second key'","minimum number of refuelling stops","network delay time, cheapest flights (Dijkstra-shaped — see Graphs)"],"examples":[{"n":"Meeting Rooms II","s":"LC 253"},{"n":"Task Scheduler","s":"LC 621"},{"n":"Single-Threaded CPU","s":"LC 1834"},{"n":"Maximum Number of Events That Can Be Attended","s":"LC 1353"},{"n":"Minimum Number of Refueling Stops","s":"LC 871"}],"traps":["Sort by the right key FIRST — the heap only resolves the second dimension.","Meeting rooms also has a pure sweep-line solution with no heap; know both.","When the rule is 'serve the largest, then it decays', push the updated value back."],"rare":false,"keys":["always pick the largest","most urgent","task scheduler","reorganize string","cheapest next","minimum cost to connect ropes","meeting rooms with a heap"]},{"id":"hp-sorted","name":"Sorted container (ordered set / map)","when":"You need the nearest value above or below, or to delete arbitrary items, while the data changes.","tool":"bisect on a sorted list (Python), TreeMap (Java), set / map (C++)","invariant":"the container is always sorted after each operation","cx":"O(log n) search; list insert is O(n) in Python","code":"import bisect\n\ndef contains_near(nums, index_diff, value_diff):\n    window = []\n    for i, x in enumerate(nums):\n        pos = bisect.bisect_left(window, x - value_diff)\n        if pos < len(window) and window[pos] <= x + value_diff:\n            return True\n        bisect.insort(window, x)\n        if i >= index_diff:\n            window.pop(bisect.bisect_left(window, nums[i - index_diff]))\n    return False","asks":["nearest value within a window","booking calendar: does a new interval overlap","median of a sliding window","smallest number currently in a container, with deletes"],"examples":[{"n":"Contains Duplicate III","s":"LC 220"},{"n":"My Calendar I","s":"LC 729"},{"n":"Sliding Window Median","s":"LC 480"},{"n":"Design a Number Container System","s":"LC 2349"}],"traps":["A heap cannot delete from the middle. If you need that, use this or a lazy-deleting heap.","In Java and C++ this is built in; in Python use bisect (fine for n up to about 10^5)."],"keys":["closest value","nearest greater or equal","ceiling / floor","smallest value above","add and remove","book a slot"],"rare":false}]},{"id":"intervals","group":"linear","name":"Sorting, intervals & sweep line","buys":"Checking every pair of intervals for overlap is O(n²). Sorting first gets it to O(n log n).","lives":"lists of intervals, events, or anything with a natural order you can impose","core":"Sorting isn't the answer itself — it's what turns the answer into a single pass. Once intervals are in order, each one only needs comparing with the PREVIOUS one, so 'do these overlap' becomes just <code>start ≤ previous_end</code>. The real decision is what to sort BY.","recognise":[{"cue":"input is a list of <b>[start, end]</b> pairs","note":"almost certainly this family"},{"cue":"<b>merge / overlap / conflict / double-booked</b>","note":"sort by start"},{"cue":"<b>maximum number of non-overlapping</b> / minimum removals","note":"sort by END — the classic greedy"},{"cue":"<b>how many are active at the same time</b> (rooms, CPUs, people)","note":"sweep line of +1 / −1 events"},{"cue":"<b>two keys fight each other</b> (height and position, cost and profit)","note":"sort by one, then handle the other with a heap or insertion"}],"notwhen":["The order is already given and must be PRESERVED → sorting would wreck the answer; use a stack or a window instead.","You only need the k best → a heap at O(n log k) beats a full sort.","Values are a small dense range → counting sort does it in O(n)."],"pick":[{"if":"combine overlapping ranges into blocks","then":"iv-merge"},{"if":"insert one interval into a sorted non-overlapping list","then":"iv-insert"},{"if":"keep the most non-overlapping / remove the fewest","then":"iv-greedy"},{"if":"count how many overlap at the busiest moment","then":"iv-sweep"},{"if":"sorting by a clever key makes the problem one pass","then":"iv-sortkey"}],"variants":[{"id":"iv-merge","name":"Merge overlapping intervals","when":"Collapse a list of ranges into the smallest set of disjoint ranges.","tool":"sort by start; extend the last block or start a new one","invariant":"the output list is always disjoint and sorted","cx":"O(n log n)","code":"def merge(intervals):\n    intervals.sort(key=lambda x: x[0])\n    out = []\n    for s, e in intervals:\n        if out and s <= out[-1][1]:          # touching counts as overlapping\n            out[-1][1] = max(out[-1][1], e)  # max(), not e -- the old one may be longer\n        else:\n            out.append([s, e])\n    return out","asks":["merge intervals; summary ranges; missing ranges","employee free time (merge all busy intervals, report the gaps)","interval list intersections (two pointers over two sorted lists)","'can the person attend all meetings' (any overlap at all)","partition labels (merge the first/last occurrence ranges of each letter)","remove covered intervals"],"examples":[{"n":"Merge Intervals","s":"LC 56"},{"n":"Meeting Rooms","s":"LC 252"},{"n":"Interval List Intersections","s":"LC 986"},{"n":"Remove Covered Intervals","s":"LC 1288"},{"n":"Employee Free Time","s":"LC 759"}],"traps":["<code>out[-1][1] = max(out[-1][1], e)</code> — assigning <code>e</code> blindly shrinks a block that already reached further.","Decide whether touching ends ([1,2] and [2,3]) count as overlapping; the statement always says, and the samples prove it."],"rare":false,"keys":["merge overlapping","overlapping intervals","combine ranges","start and end times"]},{"id":"iv-insert","name":"Insert into a disjoint sorted list","when":"The list is already non-overlapping and sorted; add one interval.","tool":"three phases — everything strictly before, the merged middle, everything strictly after","invariant":"the result stays sorted and disjoint without re-sorting","cx":"O(n)","code":"def insert(intervals, new):\n    out, i, n = [], 0, len(intervals)\n    while i < n and intervals[i][1] < new[0]:    # strictly before\n        out.append(intervals[i]); i += 1\n    while i < n and intervals[i][0] <= new[1]:   # overlapping -> absorb\n        new = [min(new[0], intervals[i][0]), max(new[1], intervals[i][1])]\n        i += 1\n    out.append(new)\n    out.extend(intervals[i:])                     # strictly after\n    return out","asks":["insert interval","my calendar I / II / III (book if no conflict)","range module — add, query, remove ranges","data stream as disjoint intervals"],"examples":[{"n":"Insert Interval","s":"LC 57"},{"n":"My Calendar I","s":"LC 729"},{"n":"Data Stream as Disjoint Intervals","s":"LC 352"}],"traps":["Three loops, in order, no early return — skipping the tail copy is the usual miss.","The merged interval keeps growing while it overlaps; update both ends every time."],"rare":false,"keys":["insert interval","already sorted non-overlapping","add a new interval"]},{"id":"iv-greedy","name":"Sort by END — maximum non-overlapping","when":"'Maximum number of activities', 'minimum removals to make them disjoint', 'fewest arrows'.","tool":"sort by end time; greedily take an interval whenever it starts after the last taken end","invariant":"finishing earliest always leaves the most room for everything after — the exchange argument","cx":"O(n log n)","code":"def max_non_overlapping(intervals):\n    intervals.sort(key=lambda x: x[1])      # by END -- this is the whole trick\n    count, last_end = 0, float('-inf')\n    for s, e in intervals:\n        if s >= last_end:\n            count += 1\n            last_end = e\n    return count                             # removals = len(intervals) - count","asks":["non-overlapping intervals — minimum number to remove","maximum number of activities / events you can attend","minimum number of arrows to burst balloons","maximum length of a pair chain","two-city / task selection where each job has a deadline","video stitching, minimum taps to water a garden (reachability greedy)"],"examples":[{"n":"Non-overlapping Intervals","s":"LC 435"},{"n":"Minimum Number of Arrows to Burst Balloons","s":"LC 452"},{"n":"Maximum Length of Pair Chain","s":"LC 646"},{"n":"Video Stitching","s":"LC 1024"}],"traps":["Sort by END, not start. Sorting by start passes the samples and fails the hidden tests — this is a graded trap.","Whether <code>s &gt;= last_end</code> or <code>s &gt; last_end</code> depends on whether touching is allowed. Arrows allow touching."],"rare":false,"keys":["maximum non-overlapping","minimum removals","activity selection","fewest arrows","maximum meetings"]},{"id":"iv-sweep","name":"Sweep line (+1 / −1 events)","when":"'How many are active at once', peak concurrency, population over time.","tool":"turn each interval into two events, sort all events, run a counter","invariant":"after processing every event up to time t, the counter is exactly the number active at t","cx":"O(n log n)","code":"def max_concurrent(intervals):\n    ev = []\n    for s, e in intervals:\n        ev.append((s, 1))        # arrival\n        ev.append((e, -1))       # departure\n    ev.sort()                    # at equal times, -1 sorts first: a leaver frees the slot\n    cur = best = 0\n    for _, delta in ev:\n        cur += delta\n        best = max(best, cur)\n    return best","asks":["meeting rooms II (minimum rooms = peak concurrency)","car pooling, 'can all passengers fit'","maximum population year; number of people in a building","the skyline problem (sweep + heap of active heights)","minimum platforms at a railway station","count of intersections / points covered by the most intervals","range addition — the same object as a difference array"],"examples":[{"n":"Meeting Rooms II","s":"LC 253"},{"n":"Car Pooling","s":"LC 1094"},{"n":"Maximum Population Year","s":"LC 1854"},{"n":"The Skyline Problem","s":"LC 218"}],"traps":["Tie-breaking at equal timestamps decides correctness: if an interval ending at t does not conflict with one starting at t, the −1 must be processed first. <code>(t, -1) &lt; (t, +1)</code> gives that for free.","Small fixed time ranges (hours, years) need no sort at all — use a difference array over the range."],"rare":false,"keys":["how many at once","maximum overlap","meeting rooms needed","platforms required","peak","population at any time"]},{"id":"iv-sortkey","name":"Sort by the right key, then one pass","when":"The problem is hard in the given order and trivial in some other order.","tool":"a custom sort key — often descending on one field and ascending on the tie-breaker","invariant":"after sorting, each element's answer depends only on what came before it","cx":"O(n log n)","code":"# queue reconstruction: tallest first, and among equals, smaller k first.\n# Then inserting at index k is safe, because everyone already placed is >= this height.\ndef reconstruct_queue(people):\n    people.sort(key=lambda p: (-p[0], p[1]))\n    out = []\n    for p in people:\n        out.insert(p[1], p)\n    return out","asks":["queue reconstruction by height","largest number from a list of numbers (compare a+b vs b+a as strings)","boats to save people, two-sum style after sorting","minimum cost to connect / to hire k workers (sort by ratio, then heap)","car fleet (sort by position descending, compare arrival times)","assign cookies, 'maximum matching after sorting both sides'","wiggle sort, 'rearrange so no two adjacent are equal' (sort then interleave)","merge accounts / sort by multiple keys with a custom comparator"],"examples":[{"n":"Queue Reconstruction by Height","s":"LC 406"},{"n":"Largest Number","s":"LC 179"},{"n":"Boats to Save People","s":"LC 881"},{"n":"Car Fleet","s":"LC 853"},{"n":"Assign Cookies","s":"LC 455"}],"traps":["In Python use <code>key=</code> with a tuple; for a genuine comparator use <code>functools.cmp_to_key</code>.","Negate to sort one field descending while another stays ascending: <code>(-h, k)</code>.","Always be able to justify WHY that order makes the greedy safe; if you cannot, it is probably DP."],"rare":false,"keys":["custom sort","form the largest number","sort by","assign in order","after sorting becomes easy"]}]},{"id":"bits","group":"linear","name":"Bit manipulation","buys":"Trades O(n) extra space for O(1), and turns subset enumeration into a simple counter.","lives":"integers, and any set of at most ~20–25 items","core":"Two separate tricks live here. One: XOR cancels duplicates (x ^ x = 0, x ^ 0 = x), which finds 'the odd one out' in O(1) space. Two: an integer CAN BE a subset — bit i means 'item i is in' — which is why <code>n ≤ 20</code> in the constraints is a bitmask signal.","recognise":[{"cue":"<b>every element appears twice except one</b>","note":"XOR the whole array"},{"cue":"<b>n ≤ 20–25</b> with 'all subsets' or 'assign each item'","note":"bitmask enumeration or bitmask DP"},{"cue":"<b>without extra memory / O(1) space</b> on a counting problem","note":"XOR or bit counting"},{"cue":"'count set bits', 'power of two', 'swap without a temp'","note":"direct bit tricks"},{"cue":"<b>maximum XOR pair</b>, 'two numbers with the largest xor'","note":"binary trie"},{"cue":"<b>all pairs / all subsets</b> combined with XOR, OR or AND","note":"handle each bit separately"}],"notwhen":["n is large and you need all subsets → 2ⁿ explodes; this is a DP or greedy problem instead.","The duplicate count is 3, not 2 → plain XOR fails; count bits per position mod 3 instead."],"pick":[{"if":"find the unique / missing element with O(1) space","then":"bt-xor"},{"if":"enumerate every subset of ≤ 20 items","then":"bt-subsets"},{"if":"'state = which items are used' inside a DP","then":"bt-dp"},{"if":"arithmetic on the bits themselves","then":"bt-tricks"},{"if":"a bitwise total across all pairs or subsets","then":"bt-perbit"}],"variants":[{"id":"bt-xor","name":"XOR cancellation","when":"Pairs cancel and you want the survivor, in O(1) space.","tool":"x ^ x = 0, x ^ 0 = x, and XOR is commutative — order does not matter","invariant":"the running XOR is the XOR of everything unpaired so far","cx":"O(n) time, O(1) space","code":"def single_number(a):\n    r = 0\n    for x in a:\n        r ^= x\n    return r\n\ndef missing_number(a):                 # values 0..n with one gone\n    r = len(a)\n    for i, x in enumerate(a):\n        r ^= i ^ x\n    return r","asks":["single number (everything else appears twice)","missing number from 0..n; find the difference between two strings","two numbers appear once, the rest twice (XOR all, then split by the lowest set bit)","single number II — everything appears three times (count bits mod 3)","find the duplicate and the missing number together","maximum XOR of two numbers in an array (binary trie, or bit-by-bit greedy)","XOR queries of a subarray (prefix XOR — the same template as prefix sum)"],"examples":[{"n":"Single Number","s":"LC 136"},{"n":"Single Number II","s":"LC 137"},{"n":"Single Number III","s":"LC 260"},{"n":"Missing Number","s":"LC 268"},{"n":"Maximum XOR of Two Numbers in an Array","s":"LC 421"},{"n":"XOR Queries of a Subarray","s":"LC 1310"}],"traps":["XOR only cancels EVEN counts. Three-of-a-kind needs the mod-3 bit counting instead.","<code>x &amp; -x</code> isolates the lowest set bit — that is how you split the two-singles case.","Prefix XOR with <code>{0: 1}</code> seeding counts subarrays with a given XOR, exactly like prefix sum."],"rare":false,"keys":["appears once","every other appears twice","single number","missing number via XOR","pairs cancel"]},{"id":"bt-subsets","name":"Bitmask = subset enumeration","when":"n ≤ ~20 and you must consider every subset.","tool":"loop mask from 0 to 2ⁿ−1; bit i set means item i is chosen","invariant":"each mask is exactly one subset, and every subset appears exactly once","cx":"O(2ⁿ · n)","code":"def all_subsets(a):\n    n = len(a)\n    out = []\n    for mask in range(1 << n):               # 2^n masks\n        out.append([a[i] for i in range(n) if mask >> i & 1])\n    return out\n\n# iterate over the SUBMASKS of a mask (needed in set-cover style DP):\n#   sub = mask\n#   while sub:\n#       ...use sub...\n#       sub = (sub - 1) & mask","asks":["generate all subsets / the power set","count subsets whose sum / XOR / product meets a condition","partition into k subsets with equal sums (n ≤ 16)","maximum compatibility score sum, optimal student–mentor assignment","'the longest word chain among ≤ 20 words'","meet in the middle — split 40 items into two halves of 20"],"examples":[{"n":"Subsets","s":"LC 78"},{"n":"Partition to K Equal Sum Subsets","s":"LC 698"},{"n":"Maximum Compatibility Score Sum","s":"LC 1947"},{"n":"Maximum Product of the Length of Two Palindromic Subsequences","s":"LC 2002"}],"traps":["<code>1 &lt;&lt; n</code> is 2ⁿ; at n = 25 that is 33 million masks — check the budget before committing.","Backtracking also enumerates subsets and is easier to prune; the mask form is for DP over subsets.","<code>mask &gt;&gt; i &amp; 1</code> needs no parentheses in Python, but write them anyway for readability."],"rare":false,"keys":["n ≤ 20","all subsets","try every subset","bitmask"]},{"id":"bt-dp","name":"Bitmask DP (state = which items are used)","when":"n ≤ ~20, and the answer depends on WHICH items you have consumed, not just how many.","tool":"dp[mask] = the best value when exactly the items in mask are done","invariant":"popcount(mask) tells you how many steps have been taken, so the order is implicit","cx":"O(2ⁿ · n) or O(2ⁿ · n²)","code":"def min_cost_assignment(cost):          # cost[person][job], n x n\n    n = len(cost)\n    FULL = (1 << n) - 1\n    import functools\n    @functools.lru_cache(None)\n    def go(mask):\n        i = bin(mask).count('1')        # person i is next -> no need to store it\n        if i == n:\n            return 0\n        best = float('inf')\n        for j in range(n):\n            if not (mask >> j & 1):\n                best = min(best, cost[i][j] + go(mask | 1 << j))\n        return best\n    return go(0)","asks":["assignment problem — minimum cost to assign n people to n jobs","travelling salesman on n ≤ ~18 cities (shortest path visiting all nodes)","partition to k equal-sum subsets; fair distribution of cookies","number of ways to wear different hats; 'beautiful arrangement'","minimum number of work sessions to finish all tasks","shortest superstring / shortest path visiting all nodes"],"examples":[{"n":"Shortest Path Visiting All Nodes","s":"LC 847"},{"n":"Number of Ways to Wear Different Hats to Each Other","s":"LC 1434"},{"n":"Minimum Number of Work Sessions to Finish the Tasks","s":"LC 1986"},{"n":"Find Minimum Time to Finish All Jobs","s":"LC 1723"}],"traps":["Derive the step index from <code>popcount(mask)</code> instead of adding it to the state — it halves the state space.","2ⁿ states × n transitions: at n = 20 that is ~20 million. Fine in C++, tight in Python — memoise and prune.","The constraint <code>n ≤ 12–20</code> in a hard problem is almost always announcing this pattern."],"rare":false,"keys":["n ≤ 20","visit all","assign tasks to people","which items have been used","minimum cost permutation"]},{"id":"bt-tricks","name":"The bit tricks worth memorising","when":"Direct manipulation of bits is the question.","tool":"the standard identities","invariant":"—","cx":"O(1) or O(number of set bits)","code":"x & 1              # odd?\nx >> 1             # divide by 2\nx << k             # multiply by 2^k\nx & (x - 1)        # clear the lowest set bit  -> loop to COUNT set bits\nx & -x             # isolate the lowest set bit\nx | (x + 1)        # set the lowest zero bit\nx and not (x & (x - 1))   # power of two\nbin(x).count('1')  # popcount in Python\nx ^ y              # differing bits; a ^ b ^ b == a\n(1 << n) - 1       # a mask of n ones","asks":["number of 1 bits (Hamming weight); counting bits for 0..n (DP: <code>f[i] = f[i &gt;&gt; 1] + (i &amp; 1)</code>)","power of two / power of four","reverse the bits of a 32-bit integer","hamming distance between two numbers; total hamming distance of an array","sum of two integers without + or −","complement of a number, bitwise AND of a number range","gray code generation"],"examples":[{"n":"Number of 1 Bits","s":"LC 191"},{"n":"Counting Bits","s":"LC 338"},{"n":"Reverse Bits","s":"LC 190"},{"n":"Sum of Two Integers","s":"LC 371"},{"n":"Bitwise AND of Numbers Range","s":"LC 201"},{"n":"Gray Code","s":"LC 89"}],"traps":["Python integers are arbitrary precision and negatives are not two's complement at a fixed width — mask with <code>&amp; 0xFFFFFFFF</code> when a problem assumes 32 bits.","Shifting a negative number right in Python keeps the sign forever; loop on a masked copy.","<code>x &amp; (x-1)</code> counting is O(set bits), faster than looping 32 times."],"rare":false,"keys":["count set bits","power of two","lowest set bit","reverse bits","without using + or −","AND of range"]},{"id":"bt-perbit","name":"Count each bit on its own","when":"A sum, AND, OR or XOR across all pairs or subsets, where n is too large to enumerate them.","tool":"for each of the ~30 bits, a count of numbers having it set","invariant":"each bit contributes to the answer independently","cx":"O(30·n) time, O(1) space","code":"def total_hamming(nums):\n    total = 0\n    for bit in range(31):\n        ones = sum((x >> bit) & 1 for x in nums)\n        total += ones * (len(nums) - ones)   # pairs that differ at this bit\n    return total","asks":["sum of XOR over all pairs","total Hamming distance","sum of all subset XOR totals (a set bit appears in 2^(n−1) subsets)","best OR, AND or XOR reachable by operations"],"examples":[{"n":"Total Hamming Distance","s":"LC 477"},{"n":"Sum of All Subset XOR Totals","s":"LC 1863"},{"n":"Bit
