wise XOR of All Pairings","s":"LC 2425"},{"n":"Maximum XOR After Operations","s":"LC 2317"}],"traps":["The contribution of bit b is multiplied by 2^b unless the question only counts differing bits.","Loop over all 31 bits (or 62 for long values)."],"keys":["sum of XOR of all pairs","for all pairs","bitwise OR of all","Hamming distance","every subset XOR"],"rare":false}]},{"id":"string-match","group":"linear","name":"String matching","buys":"Naive search re-checks every position from scratch — O(n·m). KMP / Rabin-Karp do it in O(n+m).","lives":"strings — the classic 'find text inside text' problem","core":"The naive approach restarts the comparison from zero every time it slides the pattern over by one character. These algorithms reuse work instead: KMP precomputes how much of the pattern's own prefix repeats as a suffix, so a mismatch jumps forward instead of restarting. Rabin-Karp instead compares cheap rolling hashes and only checks character-by-character when two hashes collide.","recognise":[{"cue":"find every position where a <b>pattern</b> occurs inside a <b>text</b>, text up to 10⁵–10⁶ long","note":"naive O(n·m) search is too slow at that size"},{"cue":"'<b>longest prefix that is also a suffix</b>'","note":"that's literally the KMP failure array"},{"cue":"<b>multiple patterns</b> at once, or a plagiarism / duplicate-substring style question","note":"rolling hash (Rabin-Karp) compares cheaply"},{"cue":"'how many times does the string repeat', 'shortest block this is built from'","note":"the failure array's last value encodes the period"}],"notwhen":["n and m are both small (a few thousand or less) → a brute-force double loop is simpler and fast enough.","You need substrings SORTED, or the k-th distinct substring → that needs a suffix array / suffix automaton, well past OA scope.","You just need one membership check → Python's own <code>in</code> / <code>str.find</code> already runs a fast search."],"pick":[{"if":"straightforward 'find pattern in text', or you want the failure array itself","then":"sm-kmp"},{"if":"match many patterns, or a cheap collision-based check is enough","then":"sm-rabinkarp"},{"if":"you need the longest match with the prefix at EVERY position, not just one","then":"sm-z"}],"variants":[{"id":"sm-kmp","name":"KMP — the failure (LPS) array","when":"Find every occurrence of a pattern inside a text, in guaranteed O(n+m).","tool":"lps[i] = length of the longest prefix of the pattern that is also a suffix of pattern[0..i]","invariant":"on a mismatch you fall back using lps instead of restarting — the text pointer never moves backward","cx":"O(n + m) time, O(m) space","code":"def kmp_search(text, pat):\n    if not pat:\n        return list(range(len(text) + 1))\n    lps = [0] * len(pat)\n    k = 0\n    for i in range(1, len(pat)):              # build the failure array from the pattern alone\n        while k and pat[i] != pat[k]:\n            k = lps[k - 1]\n        if pat[i] == pat[k]:\n            k += 1\n        lps[i] = k\n    res, k = [], 0\n    for i, ch in enumerate(text):\n        while k and ch != pat[k]:\n            k = lps[k - 1]                     # fall back, don't restart\n        if ch == pat[k]:\n            k += 1\n        if k == len(pat):\n            res.append(i - k + 1)\n            k = lps[k - 1]                     # keep going for overlapping matches\n    return res","asks":["implement strstr / find the first (or every) occurrence of a pattern in a string","shortest palindrome you can make by adding characters only at the front","longest happy prefix (longest proper prefix that is also a suffix) — that's just lps[-1]","check if the string is built by repeating a shorter block"],"examples":[{"n":"Find the Index of the First Occurrence in a String","s":"LC 28"},{"n":"Shortest Palindrome","s":"LC 214"},{"n":"Longest Happy Prefix","s":"LC 1392"},{"n":"Repeated Substring Pattern","s":"LC 459"}],"traps":["Build the <code>lps</code> array from the PATTERN alone — it never looks at the text.","After a full match, fall back with <code>k = lps[k-1]</code> instead of resetting <code>k = 0</code>, or you miss overlapping matches.","An empty pattern matches at every position including one past the end — handle it before the main loop."],"rare":false,"keys":["pattern in text","repeated substring","longest prefix which is also suffix","strStr","occurrences of pattern"]},{"id":"sm-rabinkarp","name":"Rabin-Karp — rolling hash","when":"Search for one or many patterns using a cheap, incrementally-updated hash instead of KMP's bookkeeping.","tool":"a polynomial hash of the current window, updated in O(1) as the window slides by one character","invariant":"the hash always equals the hash of exactly the m characters currently under the window","cx":"O(n + m) average, O(n·m) worst case (hash collisions) — use a large prime modulus to make that rare","code":"def rabin_karp(text, pat, base=131, mod=10**9 + 7):\n    n, m = len(text), len(pat)\n    if m > n:\n        return []\n    h_pat = h_txt = 0\n    p_pow = pow(base, m - 1, mod)\n    for i in range(m):\n        h_pat = (h_pat * base + ord(pat[i])) % mod\n        h_txt = (h_txt * base + ord(text[i])) % mod\n    res = []\n    for i in range(n - m + 1):\n        if h_pat == h_txt and text[i:i + m] == pat:   # verify on a hash collision\n            res.append(i)\n        if i + m < n:\n            h_txt = ((h_txt - ord(text[i]) * p_pow) * base + ord(text[i + m])) % mod\n    return res","asks":["find all occurrences of a pattern in a text using a rolling hash","longest duplicate substring (binary search the length + rolling hash to check it)","repeated substring pattern — check via hashing instead of KMP","detect plagiarism / near-duplicate chunks across many documents"],"examples":[{"n":"Longest Duplicate Substring","s":"LC 1044"},{"n":"Repeated Substring Pattern","s":"LC 459"}],"traps":["Always VERIFY on a hash match (<code>text[i:i+m] == pat</code>) — a collision is rare but not impossible, and graders include adversarial cases.","Use a large prime modulus and recompute <code>p_pow</code> from <code>m</code>, not a hardcoded constant, or longer patterns break.","The rolling update is <code>(h - ord(out) * p_pow) * base + ord(in)</code> — drop the leaving character before adding the entering one."],"rare":false,"keys":["rolling hash","duplicate substring","repeated DNA","compare substrings fast"]},{"id":"sm-z","name":"Z-function — every prefix match at once","when":"You need, for EVERY position, how far the string matches its own prefix — not just one pattern search.","tool":"z[i] = length of the longest substring starting at i that matches a prefix of the string","invariant":"the window [l, r) is the rightmost prefix-match found so far, reused to shortcut new positions inside it","cx":"O(n) time, O(n) space","code":"def z_function(s):\n    n = len(s)\n    z = [0] * n\n    l = r = 0\n    for i in range(1, n):\n        if i < r:\n            z[i] = min(r - i, z[i - l])        # reuse the previous match window\n        while i + z[i] < n and s[z[i]] == s[i + z[i]]:\n            z[i] += 1\n        if i + z[i] > r:\n            l, r = i, i + z[i]\n    return z\n\n# pattern search: run z_function(pattern + SEP + text); any i with z[i] == len(pattern) is a match","asks":["pattern search via z[i] == len(pattern) on pattern + separator + text","longest prefix that also occurs elsewhere in the string","count how many positions the string matches its own prefix (self-similarity questions)"],"examples":[],"traps":["Pick a separator character that cannot appear in either string, or the z-values leak across the boundary.","The window update <code>l, r = i, i + z[i]</code> only happens when the new match EXTENDS past the current window — don't do it unconditionally."],"rare":false,"keys":["match with prefix","prefix at every position","z-function"]}]},{"id":"segment-tree","group":"linear","name":"Segment tree & Fenwick (BIT)","buys":"A naive range query or update re-scans O(n) elements every time. These structures do both in O(log n).","lives":"array that needs REPEATED range queries, where the array itself also changes between queries","core":"A plain prefix sum breaks the moment the array changes, because updating one element shifts every prefix after it. A segment tree instead stores one aggregate per node of a binary tree built over the array, so a point update or a range query only ever touches O(log n) nodes going up or down that tree. A Fenwick tree (Binary Indexed Tree) is the same idea for sums, compressed into one flat array using each index's lowest set bit.","recognise":[{"cue":"range sum / min / max query, AND the array gets <b>updated</b> between queries","note":"prefix sum alone can't handle updates — that's the signal"},{"cue":"<b>point update, range query</b> (or the reverse: range update, point query)","note":"Fenwick if it's a sum; segment tree for min/max or anything more general"},{"cue":"'<b>count of smaller elements after self</b>', counting inversions","note":"Fenwick tree over the coordinate-compressed value range"},{"cue":"<b>range update AND range query</b>, both repeated many times","note":"segment tree with lazy propagation"}],"notwhen":["The array never changes between queries → a plain prefix sum array is simpler and O(1) per query.","n is small (a few thousand or less) and there are few queries → a direct O(n) scan per query is simpler and fast enough.","You only ever append and need a running total → a prefix sum updated on the fly is enough."],"pick":[{"if":"point updates, range sum / min / max queries","then":"st-range"},{"if":"it's specifically a SUM and you want the shortest code","then":"st-fenwick"},{"if":"both the updates AND the queries are over ranges","then":"st-lazy"}],"variants":[{"id":"st-range","name":"Segment tree — range query, point update","when":"Repeated range sum / min / max queries, with single-element updates in between.","tool":"a binary tree stored flat in an array; each node holds the combined value of its range","invariant":"a node's value always equals combine() of its two children's values","cx":"O(log n) per update and per query, O(n) to build","code":"class SegTree:                      # iterative, 0-indexed, sum version\n    def __init__(self, a):\n        self.n = len(a)\n        self.t = [0] * (2 * self.n)\n        self.t[self.n:] = a\n        for i in range(self.n - 1, 0, -1):\n            self.t[i] = self.t[2 * i] + self.t[2 * i + 1]\n\n    def update(self, i, v):\n        i += self.n\n        self.t[i] = v\n        while i > 1:\n            i //= 2\n            self.t[i] = self.t[2 * i] + self.t[2 * i + 1]\n\n    def query(self, l, r):              # sum of the half-open range [l, r)\n        res = 0\n        l += self.n; r += self.n\n        while l < r:\n            if l & 1: res += self.t[l]; l += 1\n            if r & 1: r -= 1; res += self.t[r]\n            l //= 2; r //= 2\n        return res","asks":["range sum query — mutable (and its 2-D version)","range minimum / maximum query with point updates — swap the combine function","count of range sum"],"examples":[{"n":"Range Sum Query - Mutable","s":"LC 307"},{"n":"Range Sum Query 2D - Mutable","s":"LC 308"},{"n":"Count of Range Sum","s":"LC 327"}],"traps":["This implementation's query range is HALF-OPEN <code>[l, r)</code> — an off-by-one on the right edge is the classic bug.","For min/max, change both <code>combine()</code> and the identity value used when a side is empty (use +inf / -inf, not 0)."],"rare":false,"keys":["range query with updates","update value at index","range minimum","point update"]},{"id":"st-fenwick","name":"Fenwick tree (BIT) — point update, prefix query","when":"Specifically a SUM — point update, prefix or range sum query. Shorter to write than a segment tree.","tool":"a 1-indexed array where index i is responsible for a range decided by i's lowest set bit","invariant":"tree[i] holds the sum of the (i & -i) elements ending at index i","cx":"O(log n) per update and per query","code":"class Fenwick:\n    def __init__(self, n):\n        self.t = [0] * (n + 1)              # 1-indexed; index 0 is never used\n\n    def add(self, i, delta):\n        while i < len(self.t):\n            self.t[i] += delta\n            i += i & (-i)                   # move to the next responsible index\n\n    def prefix(self, i):                    # sum of [1, i]\n        s = 0\n        while i > 0:\n            s += self.t[i]\n            i -= i & (-i)\n        return s\n\n    def range_sum(self, l, r):              # sum of [l, r], 1-indexed inclusive\n        return self.prefix(r) - self.prefix(l - 1)","asks":["range sum query — mutable, Fenwick as the usual go-to over a segment tree","count of smaller numbers after self — Fenwick over coordinate-compressed values","count of range sum, reverse pairs — Fenwick over compressed values"],"examples":[{"n":"Range Sum Query - Mutable","s":"LC 307"},{"n":"Count of Smaller Numbers After Self","s":"LC 315"}],"traps":["<code>i & -i</code> isolates the lowest set bit — memorise it rather than re-deriving it under pressure.","Fenwick is naturally 1-indexed; translating a 0-indexed array means adding 1 to every index you touch.","'Count smaller after self' needs the values coordinate-compressed first, or the tree size explodes."],"rare":false,"keys":["prefix sum with updates","count smaller after updates","binary indexed tree","dynamic rank"]},{"id":"st-lazy","name":"Segment tree with lazy propagation — range update, range query","when":"BOTH the updates and the queries are over ranges, and both happen many times.","tool":"each node also stores a pending (lazy) value; push it down to children only when you actually descend into them","invariant":"a node's stored aggregate already reflects its own pending lazy value, even before the children are updated","cx":"O(log n) per update and per query","code":"class LazySegTree:                   # range-add, range-sum\n    def __init__(self, a):\n        self.n = len(a)\n        self.sum = [0] * (4 * self.n)\n        self.lazy = [0] * (4 * self.n)\n        self._build(a, 1, 0, self.n - 1)\n\n    def _build(self, a, node, l, r):\n        if l == r:\n            self.sum[node] = a[l]; return\n        m = (l + r) // 2\n        self._build(a, 2 * node, l, m); self._build(a, 2 * node + 1, m + 1, r)\n        self.sum[node] = self.sum[2 * node] + self.sum[2 * node + 1]\n\n    def _push(self, node, l, r):\n        if self.lazy[node]:\n            m = (l + r) // 2\n            for c, cl, cr in ((2 * node, l, m), (2 * node + 1, m + 1, r)):\n                self.lazy[c] += self.lazy[node]\n                self.sum[c] += self.lazy[node] * (cr - cl + 1)\n            self.lazy[node] = 0\n\n    def update(self, node, l, r, ql, qr, v):    # add v to every element in [ql, qr]\n        if qr < l or r < ql: return\n        if ql <= l and r <= qr:\n            self.sum[node] += v * (r - l + 1); self.lazy[node] += v; return\n        self._push(node, l, r)\n        m = (l + r) // 2\n        self.update(2 * node, l, m, ql, qr, v); self.update(2 * node + 1, m + 1, r, ql, qr, v)\n        self.sum[node] = self.sum[2 * node] + self.sum[2 * node + 1]\n\n    def query(self, node, l, r, ql, qr):\n        if qr < l or r < ql: return 0\n        if ql <= l and r <= qr: return self.sum[node]\n        self._push(node, l, r)\n        m = (l + r) // 2\n        return self.query(2 * node, l, m, ql, qr) + self.query(2 * node + 1, m + 1, r, ql, qr)","asks":["range add, range sum query (both repeated many times)","falling squares — lazy max-update over ranges","my calendar III — track the maximum overlap via range add / query"],"examples":[{"n":"Falling Squares","s":"LC 699"}],"traps":["Push the lazy value down BEFORE recursing into children, or a child's own aggregate goes stale.","ADD into <code>lazy[node]</code> rather than overwrite it — two range-updates on the same node must stack."],"rare":false,"keys":["range update and range query","add to range and query range","lazy"]}]},{"id":"simulation","group":"linear","name":"Simulation & matrix manipulation","buys":"No asymptotic trick here — it's O(rows · cols) either way. What you gain is fewer off-by-one bugs.","lives":"2-D matrix / grid, walked or transformed in a specific geometric order","core":"This is not about complexity — it's about HOW to walk or transform the grid correctly. Keep four shrinking boundaries (top, bottom, left, right) for a spiral. Swap, then reverse, for an in-place rotation. Mark what needs to change in one pass, then apply the change in a second pass. Get the bookkeeping right and the rest is mechanical.","recognise":[{"cue":"<b>spiral</b> order, 'walk the boundary and peel inward'","note":"four shrinking boundaries, turn when you hit one"},{"cue":"<b>rotate</b> the matrix / image 90°, in place","note":"transpose, then reverse each row"},{"cue":"set a whole <b>row and column</b> based on a condition found while scanning","note":"mark first, mutate second — never mutate while still reading"},{"cue":"the word '<b>simulate</b>' is in the statement — follow these exact rules, step by step","note":"no shortcut; implement the rules carefully and test the edges"},{"cue":"the statement lists <b>steps to perform</b>, constraints are small","note":"just simulate it"}],"notwhen":["The question is really about reachability or shortest distance on the grid → that's <b>grid traversal (BFS/DFS)</b>, not simulation.","You're counting PATHS or costs with a choice at each cell → that's grid DP.","The transformation has an exploitable shortcut (pure index arithmetic solves it) → simulating it step by step is correct but slower than it needs to be."],"pick":[{"if":"walk the matrix in a spiral or peel it layer by layer","then":"sim-spiral"},{"if":"rotate or transpose the matrix in place","then":"sim-rotate"},{"if":"mark cells while scanning, then apply the change in a second pass","then":"sim-marking"},{"if":"a described process, and the step count is small","then":"sim-rules"}],"variants":[{"id":"sim-spiral","name":"Spiral / boundary traversal","when":"Walk (or fill) a matrix in spiral order, or peel it layer by layer.","tool":"four boundaries — top, bottom, left, right — each shrinks by one once its side is done","invariant":"everything outside the current [top,bottom] x [left,right] box has already been visited exactly once","cx":"O(rows · cols)","code":"def spiral_order(g):\n    out = []\n    top, bot, left, right = 0, len(g) - 1, 0, len(g[0]) - 1\n    while top <= bot and left <= right:\n        out += [g[top][c] for c in range(left, right + 1)]; top += 1\n        out += [g[r][right] for r in range(top, bot + 1)]; right -= 1\n        if top <= bot:\n            out += [g[bot][c] for c in range(right, left - 1, -1)]; bot -= 1\n        if left <= right:\n            out += [g[r][left] for r in range(bot, top - 1, -1)]; left += 1\n    return out","asks":["spiral matrix (read it out) / spiral matrix II (generate, fill with 1..n²)","diagonal traverse","print or walk a matrix in a specific boundary order"],"examples":[{"n":"Spiral Matrix","s":"LC 54"},{"n":"Spiral Matrix II","s":"LC 59"},{"n":"Diagonal Traverse","s":"LC 498"}],"traps":["Re-check <code>top &lt;= bot</code> and <code>left &lt;= right</code> before the bottom row and left column, or a single row/column gets walked twice.","A non-square matrix needs rows and columns tracked separately — don't assume they're equal."],"rare":false,"keys":["spiral","boundary","layer by layer","clockwise traversal","diagonal order"]},{"id":"sim-rotate","name":"Rotate / transpose in place","when":"Rotate a square matrix 90° (or 180°), in place, with O(1) extra space.","tool":"transpose (swap a[i][j] with a[j][i]), then reverse each row — two simple passes","invariant":"after the transpose, a[i][j] holds what belongs at the mirrored position; reversing each row finishes the rotation","cx":"O(n²) time, O(1) extra space","code":"def rotate_90(a):\n    n = len(a)\n    for i in range(n):                   # transpose: upper triangle only\n        for j in range(i + 1, n):\n            a[i][j], a[j][i] = a[j][i], a[i][j]\n    for row in a:                        # then mirror each row left-right\n        row.reverse()","asks":["rotate image 90 degrees, in place","rotate a 1-D array by k — the same reverse-reverse-reverse trick, three reversals instead of two","game of life — apply every update 'simultaneously' using in-place encoded state"],"examples":[{"n":"Rotate Image","s":"LC 48"},{"n":"Rotate Array","s":"LC 189"},{"n":"Game of Life","s":"LC 289"}],"traps":["Transpose only the upper triangle (<code>j in range(i+1, n)</code>) — transposing the whole matrix undoes itself.","180° rotation is just two row/column reversals with no transpose at all — don't over-complicate it.","Game of Life needs every cell's OLD state while writing the NEW one — encode both in one int instead of allocating a second grid."],"rare":false,"keys":["rotate image","rotate matrix 90","transpose","in place on a matrix"]},{"id":"sim-marking","name":"Mark first, mutate second","when":"A condition found anywhere in the grid must change a whole row and column — but mutating while you scan corrupts the condition you're still checking.","tool":"two passes — first RECORD which rows/cols qualify, then apply the mutation","invariant":"the recording pass never writes a value that the still-running condition check could misread","cx":"O(rows · cols) time; O(1) extra space by reusing the matrix's own first row/column as markers","code":"def set_zeroes(m):\n    R, C = len(m), len(m[0])\n    first_row = any(m[0][c] == 0 for c in range(C))\n    first_col = any(m[r][0] == 0 for r in range(R))\n    for r in range(1, R):                # row 0 / col 0 double as the markers\n        for c in range(1, C):\n            if m[r][c] == 0:\n                m[r][0] = m[0][c] = 0\n    for r in range(1, R):\n        for c in range(1, C):\n            if m[r][0] == 0 or m[0][c] == 0:\n                m[r][c] = 0\n    if first_row: m[0] = [0] * C\n    if first_col:\n        for r in range(R): m[r][0] = 0","asks":["set matrix zeroes, with the O(1) extra space constraint","any grid problem where mutating a cell in place would change what a LATER read of it sees"],"examples":[{"n":"Set Matrix Zeroes","s":"LC 73"}],"traps":["Check whether row 0 / column 0 themselves need zeroing BEFORE you start reusing them as markers, or that information is lost.","Never zero a cell during the first (scanning) pass — only record it, or you cascade false positives into later reads."],"rare":false,"keys":["set matrix zeroes","entire row and column","without using extra space","update simultaneously"]},{"id":"sim-rules","name":"Follow the rules exactly","when":"The statement describes a process step by step and the constraints are small enough to just run it.","tool":"the state in plain variables and a loop that performs one step","invariant":"after each loop the state equals the process after that many steps","cx":"O(steps × cost of a step)","code":"def zigzag(s, rows):\n    if rows == 1 or rows >= len(s):\n        return s\n    lines = [\"\"] * rows\n    r, step = 0, 1\n    for ch in s:\n        lines[r] += ch\n        if r == 0:\n            step = 1\n        elif r == rows - 1:\n            step = -1\n        r += step\n    return \"\".join(lines)","asks":["robot moving on commands","format text under exact rules","game rounds played until a condition","count-and-say style string generation","queue at a counter, printer, elevator"],"examples":[{"n":"Zigzag Conversion","s":"LC 6"},{"n":"Count and Say","s":"LC 38"},{"n":"Text Justification","s":"LC 68"},{"n":"Game of Life","s":"LC 289"},{"n":"Walking Robot Simulation","s":"LC 874"}],"traps":["Check the constraint first: steps × step cost must fit roughly 10^8 operations. If the count of steps is huge, look for a cycle or formula.","Read the tie-break and end-of-input rules twice. That is where the marks go."],"keys":["simulate","repeat until","each round","at each step","in this order","the robot","after t seconds","perform the following"],"rare":false}]},{"id":"linked-list","group":"list","name":"Linked list surgery","buys":"Copying to an array uses O(n) extra space. Rewiring pointers in place does it with O(1).","lives":"singly linked list (and doubly, for LRU-style caches)","core":"You can't index into a linked list, so every classic trick builds the index you need out of pointers instead: two pointers moving at different speeds find the middle and the cycle, a pointer sent k steps ahead finds the k-th node from the end, and a dummy head removes every 'what if it's the first node' special case. Draw three nodes on paper before you write any of this.","recognise":[{"cue":"<b>cycle</b>, 'does it loop', 'where does the loop start'","note":"fast and slow pointers"},{"cue":"<b>middle</b> node, or the <b>k-th from the end</b>","note":"can't index, so stagger two pointers instead"},{"cue":"<b>reverse</b> the list, part of it, or in groups of k","note":"the three-pointer rewire"},{"cue":"<b>delete / insert</b> and the head itself might change","note":"dummy head"},{"cue":"<b>merge</b> two or k sorted lists","note":"dummy head + one pointer per list"},{"cue":"<b>k-th from the end</b>, 'remove the n-th from the end'","note":"two pointers with a fixed gap"},{"cue":"<b>deep copy</b>, random pointer, 'have I seen this node'","note":"hash map of nodes"}],"notwhen":["You're allowed O(n) memory and the problem is really about the values → copy to an array and solve it there. Say so out loud in an interview, then show the in-place version too.","You need random access or sorting by index → this is the wrong data structure for that."],"pick":[{"if":"find a position you cannot index (middle, k-th from end, cycle)","then":"ll-fastslow"},{"if":"reverse the whole list, a sublist, or every k nodes","then":"ll-reverse"},{"if":"delete or insert where the head may change","then":"ll-dummy"},{"if":"combine sorted lists","then":"ll-merge"},{"if":"something is measured from the end of the list","then":"ll-gap"},{"if":"you must copy the list or remember visited nodes","then":"ll-hash"}],"variants":[{"id":"ll-fastslow","name":"Fast and slow pointers","when":"You need a position you cannot compute by index.","tool":"slow moves 1 step, fast moves 2 — or fast starts k nodes ahead","invariant":"when fast reaches the end, slow is exactly at the middle (or k from the end)","cx":"O(n) time, O(1) space","code":"def middle(head):\n    slow = fast = head\n    while fast and fast.next:        # guard BOTH, or you dereference None\n        slow = slow.next\n        fast = fast.next.next\n    return slow                       # for even length this is the SECOND middle\n\ndef has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is fast:\n            return True               # a 2x runner must lap a 1x runner inside a loop\n    return False","asks":["linked list cycle — detect it, and find where it starts (reset one pointer to the head, step both by 1)","middle of the linked list","remove the n-th node from the end (one pass, two pointers n apart)","palindrome linked list (find the middle, reverse the second half, compare)","happy number — the same cycle detection over a number sequence","find the duplicate number in an array treated as a linked list","reorder list — middle, reverse, interleave"],"examples":[{"n":"Linked List Cycle","s":"LC 141"},{"n":"Linked List Cycle II","s":"LC 142"},{"n":"Middle of the Linked List","s":"LC 876"},{"n":"Remove Nth Node From End of List","s":"LC 19"},{"n":"Palindrome Linked List","s":"LC 234"},{"n":"Find the Duplicate Number","s":"LC 287"},{"n":"Reorder List","s":"LC 143"}],"traps":["<code>while fast and fast.next</code> — checking only one of them crashes on even-length lists.","Even length gives the SECOND middle. If you need the first, stop one step earlier.","Cycle START needs a second phase: reset one pointer to the head and advance both by one. Knowing <i>that</i> there is a cycle is not knowing where it begins."],"rare":false,"keys":["cycle","loop","middle of the linked list","palindrome linked list","start of the loop"]},{"id":"ll-reverse","name":"Reverse by rewiring","when":"Reverse the list, a sublist, or every group of k.","tool":"prev, cur, nxt — save the next node BEFORE you overwrite the pointer","invariant":"everything before cur is already reversed and ends at prev","cx":"O(n) time, O(1) space","code":"def reverse(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next        # save it FIRST -- you are about to destroy it\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    return prev               # prev is the new head","asks":["reverse a linked list (iterative and recursive)","reverse a sublist between positions m and n","reverse nodes in k-group, and the 'leave the remainder alone' variant","swap nodes in pairs","palindrome check and reorder list — both need the second half reversed","add two numbers stored in forward order (reverse, add, reverse back)","rotate list by k places"],"examples":[{"n":"Reverse Linked List","s":"LC 206"},{"n":"Reverse Linked List II","s":"LC 92"},{"n":"Reverse Nodes in k-Group","s":"LC 25"},{"n":"Swap Nodes in Pairs","s":"LC 24"},{"n":"Rotate List","s":"LC 61"},{"n":"Add Two Numbers II","s":"LC 445"}],"traps":["Saving <code>nxt</code> first is the whole trick. Overwrite <code>cur.next</code> before saving and the rest of the list is gone.","Return <code>prev</code>, not <code>cur</code> — cur is None when the loop ends.","For a sublist, keep a pointer to the node BEFORE the section and to the section's original head; those two get rewired at the end."],"rare":false,"keys":["reverse the list","reverse between","reverse in groups of k","swap pairs","reorder list"]},{"id":"ll-dummy","name":"Dummy head","when":"Deleting or inserting, and the head itself might be affected.","tool":"a fake node in front of the real head, so every node has a predecessor","invariant":"every node you touch has a previous node — no special case for position 0","cx":"O(n) time, O(1) space","code":"def remove_all(head, val):\n    dummy = ListNode(0, head)        # the whole point: head now has a predecessor\n    prev = dummy\n    while prev.next:\n        if prev.next.val == val:\n            prev.next = prev.next.next   # unlink, and do NOT advance\n        else:\n            prev = prev.next\n    return dummy.next","asks":["remove linked list elements by value","remove duplicates from a sorted list (keep one, or remove every duplicated value entirely)","partition list around a value (two dummy heads, then join)","odd-even linked list","insert into a sorted circular list","delete the n-th node from the end without a length pass"],"examples":[{"n":"Remove Linked List Elements","s":"LC 203"},{"n":"Remove Duplicates from Sorted List II","s":"LC 82"},{"n":"Partition List","s":"LC 86"},{"n":"Odd Even Linked List","s":"LC 328"}],"traps":["After unlinking, do NOT advance prev — the new <code>prev.next</code> has not been checked yet.","Return <code>dummy.next</code>, never the original head: it may have been removed.","Two dummy heads (one per bucket) turn 'partition' into two appends plus one join."],"rare":false,"keys":["delete node","remove elements","partition list","head may change","odd even"]},{"id":"ll-merge","name":"Merge sorted lists","when":"Two (or k) sorted lists to combine, or a list to sort in place.","tool":"dummy head + a tail pointer; always append the smaller head","invariant":"everything behind tail is sorted and finished","cx":"O(n + m) for two; O(N log k) for k with a heap","code":"def merge_two(a, b):\n    dummy = tail = ListNode(0)\n    while a and b:\n        if a.val <= b.val:\n            tail.next, a = a, a.next\n        else:\n            tail.next, b = b, b.next\n        tail = tail.next\n    tail.next = a or b          # one list still has a tail -- attach it whole\n    return dummy.next","asks":["merge two sorted lists","merge k sorted lists (heap of heads, or repeated pairwise merging)","sort a linked list in O(n log n) and O(1) space — merge sort, using the fast/slow split","intersection of two linked lists","add two numbers as linked lists","flatten a multilevel doubly linked list"],"examples":[{"n":"Merge Two Sorted Lists","s":"LC 21"},{"n":"Merge k Sorted Lists","s":"LC 23"},{"n":"Sort List","s":"LC 148"},{"n":"Intersection of Two Linked Lists","s":"LC 160"},{"n":"Add Two Numbers","s":"LC 2"}],"traps":["<code>tail.next = a or b</code> at the end — forgetting the leftover tail silently truncates the result.","Merge sort beats quicksort on a list: the split is free with fast/slow and you never need random access.","<code>&lt;=</code> rather than <code>&lt;</code> keeps the merge stable."],"rare":false,"keys":["merge two sorted lists","merge k sorted lists","sort a linked list","add two numbers"]},{"id":"ll-gap","name":"Two pointers with a fixed gap","when":"Something is measured from the END of the list, and you cannot index from the end.","tool":"two pointers exactly k nodes apart, walking together","invariant":"the distance between the two pointers never changes","cx":"O(n) time, O(1) space","code":"def remove_nth_from_end(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n):               # open a gap of n nodes\n        fast = fast.next\n    while fast.next:                 # walk together until fast is on the last node\n        fast, slow = fast.next, slow.next\n    slow.next = slow.next.next       # slow is just BEFORE the node to remove\n    return dummy.next","asks":["remove the n-th node from the end","return the k-th node from the end","rotate a list right by k (find the new tail with a gap)","swap the k-th node from the start with the k-th from the end"],"examples":[{"n":"Remove Nth Node From End of List","s":"LC 19"},{"n":"Rotate List","s":"LC 61"},{"n":"Swapping Nodes in a Linked List","s":"LC 1721"}],"traps":["Start both at a dummy so that removing the head needs no special case.","Rotate: reduce k with <code>k % length</code> first, or the gap walks off the list."],"keys":["k-th from the end","n-th node from the end","last k nodes","rotate the list"],"rare":false},{"id":"ll-hash","name":"Hash map or set of nodes","when":"You must remember nodes you have seen, or map each original node to its copy.","tool":"a dict keyed by the node object (not its value)","invariant":"the map holds exactly one entry for every node handled so far","cx":"O(n) time, O(n) space","code":"def copy_random_list(head):\n    copy = {None: None}\n    node = head\n    while node:                      # pass 1: make every copy\n        copy[node] = Node(node.val)\n        node = node.next\n    node = head\n    while node:                      # pass 2: wire them, now every target exists\n        copy[node].next = copy[node.next]\n        copy[node].random = copy[node.random]\n        node = node.next\n    return copy[head]","asks":["deep-copy a list that has random pointers","find where two lists intersect (set of nodes, or walk both and switch heads)","detect a cycle when O(n) space is allowed","delete every node whose value is in a given set","count connected runs of listed values"],"examples":[{"n":"Copy List with Random Pointer","s":"LC 138"},{"n":"Intersection of Two Linked Lists","s":"LC 160"},{"n":"Linked List Components","s":"LC 817"},{"n":"Delete Nodes From Linked List Present in Array","s":"LC 3217"}],"traps":["Key on the node, not the value: two nodes can hold the same value.","Put <code>None: None</code> in the map so null pointers need no check.","Intersection in O(1) space: when a pointer falls off the end, restart it on the other head. Both walk a+b+c steps and meet."],"keys":["deep copy","clone","random pointer","visited nodes","intersection point","same node object"],"rare":false}]},{"id":"tree-dfs","group":"tree","name":"Tree DFS (recursion with a shape)","buys":"Visits every node exactly once — O(n) — and lets the recursion stack do the bookkeeping for you.","lives":"binary tree, n-ary tree, BST","core":"Almost every tree question is one of two shapes. Either information flows UP — each node asks its children for a value and combines them (height, sum, diameter) — or information flows DOWN, with the parent passing context to the child (the path so far, a valid range). Decide which direction you need before writing a line, since it decides your function's signature.","recognise":[{"cue":"<b>height, depth, diameter, balanced, sum</b> of the tree","note":"value flows UP — post-order"},{"cue":"<b>path from the root</b>, 'path sum equals target', 'good nodes'","note":"value flows DOWN"},{"cue":"<b>BST</b>, and the question involves order or the k-th element","note":"in-order traversal is sorted"},{"cue":"<b>lowest common ancestor</b>, 'the path between two nodes'","note":"the post-order LCA shape"},{"cue":"'the best path <b>through</b> any node'","note":"return one branch upward, record both branches locally"},{"cue":"the path <b>bends</b>: 'between any two nodes', diameter","note":"post-order with a global best"},{"cue":"a <b>choice at each node</b> that constrains parent and child","note":"return a tuple of states"},{"cue":"<b>given traversals</b>, serialize, reconstruct","note":"build the tree"},{"cue":"<b>spreads from a node</b>, distance k from a target","note":"add a parent map, BFS"}],"notwhen":["You need everything at depth d together → that's <b>BFS</b>, not DFS.","The structure has cycles → it's a graph, so you need a visited set.","Depth can reach 10⁵ → Python's recursion limit will blow up; convert to an explicit stack."],"pick":[{"if":"the answer is built from the children's answers","then":"td-up"},{"if":"each node needs to know about its ancestors","then":"td-down"},{"if":"it is a BST and order matters","then":"td-bst"},{"if":"two nodes, and the relationship between them","then":"td-lca"},{"if":"the best path can bend at any node","then":"td-global"},{"if":"each node has take / skip style states","then":"td-state"},{"if":"reconstruct from traversals","then":"td-build"},{"if":"you must also move upward","then":"td-parent"},{"if":"answer needed for every node as root","then":"td-reroot"},{"if":"many ancestor queries","then":"td-lift"}],"variants":[{"id":"td-up","name":"Post-order — return a value up","when":"A node's answer depends only on its children's answers.","tool":"recurse left, recurse right, combine, return","invariant":"by the time you combine, both subtrees have already reported correctly","cx":"O(n) time, O(h) stack","code":"def height(node):\n    if not node:\n        return 0                       # the base case IS the empty tree\n    return 1 + max(height(node.left), height(node.right))\n\n# the 'best path THROUGH a node' shape -- note the two DIFFERENT values\nbest = 0\ndef gain(node):\n    global best\n    if not node: return 0\n    l = max(gain(node.left), 0)        # a negative branch is worth skipping\n    r = max(gain(node.right), 0)\n    best = max(best, node.val + l + r) # record a path through this node\n    return node.val + max(l, r)        # but return only ONE branch upward","asks":["maximum depth / minimum depth of a binary tree","diameter of a binary tree","balanced binary tree (return height and a flag, or −1 as a sentinel)","binary tree maximum path sum","count nodes, sum of all nodes, count leaves","same tree, symmetric tree, subtree of another tree","invert a binary tree; merge two binary trees","house robber III (return a pair: best-with-me, best-without-me)","count good nodes, longest univalue path"],"examples":[{"n":"Maximum Depth of Binary Tree","s":"LC 104"},{"n":"Diameter of Binary Tree","s":"LC 543"},{"n":"Balanced Binary Tree","s":"LC 110"},{"n":"Binary Tree Maximum Path Sum","s":"LC 124"},{"n":"Same Tree","s":"LC 100"},{"n":"Symmetric Tree","s":"LC 101"},{"n":"Invert Binary Tree","s":"LC 226"},{"n":"House Robber III","s":"LC 337"}],"traps":["The 'through a node' problems return ONE branch but record BOTH. Returning the two-branch value corrupts the parent.","<code>max(child, 0)</code> is how you let the recursion drop a harmful branch.","Returning a tuple (or a −1 sentinel) avoids recomputing height inside the balanced check, turning O(n²) into O(n)."],"rare":false,"keys":["height","depth","balanced","same tree","subtree sum","count nodes"]},{"id":"td-down","name":"Top-down — carry context into the children","when":"A node's answer depends on where it sits, not on its subtree.","tool":"extra parameters: the running path, the remaining target, the allowed range","invariant":"the parameters always describe the path from the root to this node","cx":"O(n) time, O(h) stack","code":"def path_sum(node, target, path, out):\n    if not node:\n        return\n    path.append(node.val)\n    if not node.left and not node.right and node.val == target:\n        out.append(list(path))         # COPY -- the list is mutated on the way back\n    else:\n        path_sum(node.left,  target - node.val, path, out)\n        path_sum(node.right, target - node.val, path, out)\n    path.pop()                          # undo before returning to the parent","asks":["path sum I / II / III (root-to-leaf, all paths, any downward path)","binary tree paths — print every root-to-leaf path","sum root to leaf numbers","count good nodes (the max value seen on the path so far)","maximum difference between a node and an ancestor","validate a BST by passing down the allowed (low, high) range","smallest string starting from a leaf"],"examples":[{"n":"Path Sum","s":"LC 112"},{"n":"Path Sum II","s":"LC 113"},{"n":"Binary Tree Paths","s":"LC 257"},{"n":"Sum Root to Leaf Numbers","s":"LC 129"},{"n":"Count Good Nodes in Binary Tree","s":"LC 1448"},{"n":"Maximum Difference Between Node and Ancestor","s":"LC 1026"}],"traps":["Append a COPY of the path, not the list itself — otherwise every answer ends up identical and empty.","<code>path.pop()</code> on the way out. Forgetting it is the classic backtracking leak.","'Leaf' means no left AND no right. A node with one child is not a leaf, and that check fails a lot of submissions."],"rare":false,"keys":["root to leaf","path sum","pass value to children","good nodes","maximum on the path"]},{"id":"td-bst","name":"BST — in-order is sorted","when":"A binary SEARCH tree, and the question is about order or searching.","tool":"in-order traversal (left, node, right) emits values in ascending order","invariant":"everything left is smaller and everything right is larger — at EVERY node, not just the parent","cx":"O(h) for a search, O(n) for a full traversal","code":"def kth_smallest(root, k):\n    st, cur = [], root\n    while st or cur:\n        while cur:                 # go as far left as possible\n            st.append(cur); cur = cur.left\n        cur = st.pop()\n        k -= 1\n        if k == 0: return cur.val  # the k-th value popped is the k-th smallest\n        cur = cur.right","asks":["validate a binary search tree (range method, or 'is the in-order strictly increasing')","k-th smallest / k-th largest element in a BST","search, insert and delete in a BST","convert a sorted array to a height-balanced BST","lowest common ancestor in a BST (compare values — no need to recurse into both sides)","minimum absolute difference in a BST; two sum on a BST","range sum of a BST; trim a BST to a range","recover a BST where two nodes were swapped"],"examples":[{"n":"Validate Binary Search Tree","s":"LC 98"},{"n":"Kth Smallest Element in a BST","s":"LC 230"},{"n":"Lowest Common Ancestor of a Binary Search Tree","s":"LC 235"},{"n":"Convert Sorted Array to Binary Search Tree","s":"LC 108"},{"n":"Range Sum of BST","s":"LC 938"},{"n":"Delete Node in a BST","s":"LC 450"}],"traps":["Validating against only the parent is WRONG — the constraint covers the whole subtree. Pass a (low, high) range down.","Equal values: the statement decides whether duplicates go left, right, or are forbidden. It always says.","The iterative in-order with an explicit stack is worth memorising — it is also the 'BST iterator' answer."],"rare":false,"keys":["binary search tree","BST","k-th smallest in BST","validate BST","inorder is sorted"]},{"id":"td-lca","name":"Lowest common ancestor","when":"Two nodes, and you need the lowest node with both beneath it.","tool":"post-order: if both sides report a hit, THIS node is the answer","invariant":"a node returns non-null exactly when p or q lies in its subtree","cx":"O(n) time, O(h) stack","code":"def lca(node, p, q):\n    if not node or node is p or node is q:\n        return node                     # found one -- report it upward\n    l = lca(node.left,  p, q)\n    r = lca(node.right, p, q)\n    if l and r:\n        return node                     # p and q split here -> this IS the LCA\n    return l or r                       # otherwise pass the single hit upward","asks":["lowest common ancestor of a binary tree (and the easier BST version)","distance between two nodes = depth(p) + depth(q) − 2·depth(lca)","all nodes at distance K from a target (build a parent map, then BFS)","the path between two nodes; step-by-step directions from one node to another","lowest common ancestor of the deepest leaves","LCA with parent pointers (walk up both and intersect, like two linked lists)"],"examples":[{"n":"Lowest Common Ancestor of a Binary Tree","s":"LC 236"},{"n":"All Nodes Distance K in Binary Tree","s":"LC 863"},{"n":"Step-By-Step Directions From a Binary Tree Node to Another","s":"LC 2096"},{"n":"Lowest Common Ancestor of Deepest Leaves","s":"LC 1123"}],"traps":["This version assumes both nodes EXIST. If they might not, you must also count how many you found.","'Distance K from a node' needs upward movement, so turn the tree into a graph with a parent map and run BFS."],"rare":false,"keys":["lowest common ancestor","LCA","first common parent","distance between two nodes"]},{"id":"td-global","name":"Post-order with a global best","when":"The best path bends at some node: it is not a single root-to-leaf chain.","tool":"return the best single arm upward, update a global with both arms","invariant":"the return value is one arm; the answer may use two","cx":"O(n) time, O(h) space","code":"def diameter(root):\n    best = 0\n    def depth(node):\n        nonlocal best\n        if not node:\n            return 0\n        l, r = depth(node.left), depth(node.right)\n        best = max(best, l + r)      # the path that bends here\n        return 1 + max(l, r)         # only one arm can continue upward\n    depth(root)\n    return best","asks":["diameter","maximum path sum between any two nodes","longest path of equal values","longest path where adjacent characters differ"],"examples":[{"n":"Diameter of Binary Tree","s":"LC 543"},{"n":"Binary Tree Maximum Path Sum","s":"LC 124"},{"n":"Longest Univalue Path","s":"LC 687"},{"n":"Longest Path With Different Adjacent Characters","s":"LC 2246"}],"traps":["Max path sum: clamp a negative arm to 0 with <code>max(0, arm)</code>.","Never return l + r upward. A path cannot fork."],"keys":["any two nodes","diameter","longest path between","path may not pass through the root","maximum path sum"],"rare":false},{"id":"td-state","name":"Tree DP: return several values","when":"Each node has a choice (take / skip, covered / not), and the parent needs each outcome.","tool":"a tuple returned from each child, one value per state","invariant":"the tuple is the best answer for the subtree in each state","cx":"O(n) time, O(h) space","code":"def rob(root):\n    def go(node):                    # returns (best if robbed, best if skipped)\n        if not node:\n            return (0, 0)\n        l, r = go(node.left), go(node.right)\n        take = node.val + l[1] + r[1]\n        skip = max(l) + max(r)\n        return (take, skip)\n    return max(go(root))","asks":["house robber on a tree","fewest cameras to cover a tree","longest zigzag path","moves to balance coins across the tree"],"examples":[{"n":"House Robber III","s":"LC 337"},{"n":"Binary Tree Cameras","s":"LC 968"},{"n":"Longest ZigZag Path in a Binary Tree","s":"LC 1372"},{"n":"Distribute Coins in Binary Tree","s":"LC 979"}],"traps":["Write down in words what each tuple slot means before coding.","Skip means children are free to be either state, so use max of the child's tuple."],"keys":["adjacent nodes cannot both","parent and child","cover every node","select nodes in a tree","minimum to monitor"],"rare":false},{"id":"td-build","name":"Build or serialize a tree","when":"You are given traversals or a string and must reconstruct the tree, or the reverse.","tool":"a value→index map of the inorder, and a moving preorder pointer","invariant":"preorder gives the root, inorder splits left from right","cx":"O(n) time, O(n) space","code":"def build(preorder, inorder):\n    at = {v: i for i, v in enumerate(inorder)}\n    next_root = iter(preorder)\n    def go(lo, hi):\n        if lo > hi:\n            return None\n        node = TreeNode(next(next_root))\n        mid = at[node.val]\n        node.left = go(lo, mid - 1)  # left FIRST: preorder is root, left, right\n        node.right = go(mid + 1, hi)\n        return node\n    return go(0, len(inorder) - 1)","asks":["build from preorder and inorder","build from inorder and postorder (take roots from the back, build right first)","serialize and deserialize","balanced BST from a sorted array","BST from preorder"],"examples":[{"n":"Construct Binary Tree from Preorder and Inorder Traversal","s":"LC 105"},{"n":"Construct Binary Tree from Inorder and Postorder Traversal","s":"LC 106"},{"n":"Serialize and Deserialize Binary Tree","s":"LC 297"},{"n":"Construct Binary Search Tree from Preorder Traversal","s":"LC 1008"}],"traps":["With postorder, build the RIGHT child first.","Serialization must write null markers, or the shape is lost."],"keys":["given inorder and preorder","reconstruct the tree","serialize","deserialize","construct the tree from"],"rare":false},{"id":"td-parent","name":"Treat the tree as a graph","when":"Movement can go UP as well as down: distance from a given node, or spreading from a node.","tool":"a parent map, then BFS with a visited set","invariant":"BFS reaches each node at its true distance from the start","cx":"O(n) time, O(n) space","code":"from collections import deque\n\ndef distance_k(root, target, k):\n    parent = {root: None}\n    stack = [root]\n    while stack:\n        n = stack.pop()\n        for c in (n.left, n.right):\n            if c:\n                parent[c] = n\n                stack.append(c)\n    q, seen = deque([(target, 0)]), {target}\n    out = []\n    while q:\n        n, d = q.popleft()\n        if d == k:\n            out.append(n.val)\n            continue\n        for m in (n.left, n.right, parent[n]):\n            if m and m not in seen:\n                seen.add(m)\n                q.append((m, d + 1))\n    return out","asks":["all nodes at distance k from a target","time for infection to spread from a node","time for news to pass down a company tree"],"examples":[{"n":"All Nodes Distance K in Binary Tree","s":"LC 863"},{"n":"Amount of Time for Binary Tree to Be Infected","s":"LC 2385"},{"n":"Time Needed to Inform All Employees","s":"LC 1376"}],"traps":["Key the maps on nodes, not values, unless values are guaranteed unique."],"keys":["distance k from","starting from a node, spreads","infect","burn the tree","neighbours including parent"],"rare":false},{"id":"td-reroot","name":"Rerooting DP","when":"You need the answer with EVERY node taken as the root.","tool":"one DFS for root 0, a second that moves the root to each child","invariant":"moving the root across an edge changes the answer by a known amount","cx":"O(n) time, O(n) space","code":"def sum_of_distances(n, edges):\n    g = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b); g[b].append(a)\n    size, ans = [1] * n, [0] * n\n    def down(u, p):\n        for v in g[u]:\n            if v != p:\n                down(v, u)\n                size[u] += size[v]\n                ans[u] += ans[v] + size[v]\n    def reroot(u, p):\n        for v in g[u]:\n            if v != p:\n                ans[v] = ans[u] - size[v] + (n - size[v])\n                reroot(v, u)\n    down(0, -1); reroot(0, -1)\n    return ans","asks":["sum of distances from every node","best root under some cost","minimum height trees"],"examples":[{"n":"Sum of Distances in Tree","s":"LC 834"},{"n":"Minimum Height Trees","s":"LC 310"}],"traps":["In Python raise the recursion limit, or the recursion fails on a long chain."],"keys":["for each node as root","every node as the root","sum of distances to all"],"rare":true},{"id":"td-lift","name":"Binary lifting","when":"Many queries for the k-th ancestor or the LCA on a big tree.","tool":"up[j][v] = the 2^j-th ancestor of v","invariant":"any jump of k decomposes into powers of two","cx":"O(n log n) build, O(log n) per query","code":"class Ancestor:\n    def __init__(self, n, parent):\n        self.up = [parent[:]]\n        for j in range(1, 17):\n            prev = self.up[-1]\n            self.up.append([prev[prev[v]] if prev[v] != -1 else -1 for v in range(n)])\n    def kth(self, v, k):\n        for j in range(17):\n            if k >> j & 1:\n                v = self.up[j][v]\n                if v == -1:\n                    return -1\n        return v","asks":["k-th ancestor queries","LCA with many queries","path aggregate queries on a tree"],"examples":[{"n":"Kth Ancestor of a Tree Node","s":"LC 1483"},{"n":"Minimum Edge Weight Equilibrium Queries in a Tree","s":"LC 2846"}],"traps":["The table needs about log2(n) levels. Keep -1 from being used as an index."],"keys":["k-th ancestor","many queries on a tree","jump up"],"rare":true}]},{"id":"tree-bfs","group":"tree","name":"Tree BFS (level order)","buys":"Finds the shallowest answer first, and gives you whole levels as units — something DFS can't do.","lives":"binary tree, n-ary tree","core":"Just a queue, and one move that matters: before each round, record how many nodes are currently in the queue. That count IS the current level, so each iteration processes exactly one level. Everything 'per level' falls out of that single line.","recognise":[{"cue":"<b>level order</b>, 'level by level', 'each row'","note":"the definition"},{"cue":"<b>right side view</b>, largest value per level, average per level","note":"last / best of each level"},{"cue":"<b>minimum depth</b>, 'shallowest leaf'","note":"BFS finds it first and can stop immediately"},{"cue":"<b>zigzag</b> / spiral order","note":"level order, reversing alternate rows"},{"cue":"<b>connect next pointers</b>, 'width of the tree'","note":"needs whole levels at once"},{"cue":"<b>width, column, vertical</b>, top / bottom view","note":"BFS with position numbers"}],"notwhen":["The answer is about a root-to-leaf path or a subtree → DFS carries that context naturally.","You need the deepest thing → DFS is usually simpler there."],"pick":[{"if":"anything phrased per level","then":"tb-levels"},{"if":"a node's horizontal position matters","then":"tb-index"}],"variants":[{"id":"tb-levels","name":"Queue, one level per round","when":"Any question phrased per level, or 'the shallowest'.","tool":"a deque; snapshot <code>len(queue)</code> at the top of each round","invariant":"each round of the outer loop handles exactly one complete level","cx":"O(n) time, O(width) space","code":"from collections import deque\ndef level_order(root):\n    if not root: return []\n    q, out = deque([root]), []\n    while q:\n        n = len(q)                 # THIS line is the whole pattern\n        level = []\n        for _ in range(n):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left:  q.append(node.left)\n            if node.right: q.append(node.right)\n        out.append(level)\n    return out","asks":["binary tree level order traversal, and bottom-up level order","zigzag / spiral level order","right side view, left side view","average, maximum or sum of each level","minimum depth of a binary tree (BFS returns the moment it meets a leaf)","populating next right pointers in each node","maximum width of a binary tree (index the nodes 2i / 2i+1)","cousins in a binary tree; deepest leaves sum","vertical order traversal (BFS plus a column index)"],"examples":[{"n":"Binary Tree Level Order Traversal","s":"LC 102"},{"n":"Binary Tree Zigzag Level Order Traversal","s":"LC 103"},{"n":"Binary Tree Right Side View","s":"LC 199"},{"n":"Minimum Depth of Binary Tree","s":"LC 111"},{"n":"Populating Next Right Pointers in Each Node","s":"LC 116"},{"n":"Maximum Width of Binary Tree","s":"LC 662"},{"n":"Average of Levels in Binary Tree","s":"LC 637"}],"traps":["Snapshot the length BEFORE the inner loop. Reading <code>len(q)</code> inside it mixes two levels together.","Use <code>collections.deque</code>; <code>list.pop(0)</code> is O(n) and turns the whole thing into O(n²).","Minimum depth via DFS must handle one-child nodes carefully; BFS sidesteps it entirely."],"rare":false,"keys":["level order","each level","zigzag","right side view","minimum depth","average of levels"]},{"id":"tb-index","name":"BFS with position numbers","when":"The answer depends on a node's horizontal position: width, vertical columns, completeness.","tool":"the queue holds (node, index); children are 2i and 2i+1","invariant":"index gives a node's slot as in a heap array","cx":"O(n) time, O(n) space","code":"from collections import deque\n\ndef max_width(root):\n    best, q = 0, deque([(root, 0)])\n    while q:\n        first = q[0][1]\n        last = q[-1][1]\n        best = max(best, last - first + 1)\n        for _ in range(len(q)):\n            node, i = q.popleft()\n            i -= first               # rebase each level so numbers stay small\n            if node.left:\n                q.append((node.left, 2 * i))\n            if node.right:\n                q.append((node.right, 2 * i + 1))\n    return best","asks":["maximum width of any level","vertical order traversal (column = parent ∓ 1)","top or bottom view","is the tree complete"],"examples":[{"n":"Maximum Width of Binary Tree","s":"LC 662"},{"n":"Vertical Order Traversal of a Binary Tree","s":"LC 987"},{"n":"Check Completeness of a Binary Tree","s":"LC 958"}],"traps":["Rebase indexes on each level, or they overflow on deep trees.","Vertical order ties are broken by row and then value. Read the statement."],"keys":["width of the tree","vertical","column","top view","bottom view","complete binary tree"],"rare":false}]},{"id":"trie","group":"tree","name":"Trie (prefix tree)","buys":"Scanning every word costs O(words · length). A trie answers each query in O(length), no matter how many words you stored.","lives":"strings sharing prefixes; also bits, for XOR problems","core":"One node per character position, with children keyed by the next character. Walking down the tree spells out a word, so 'does any stored word start with this prefix' only costs the length of the prefix. The same structure built over BITS (children 0 and 1) answers maximum-XOR questions.","recognise":[{"cue":"<b>prefix</b>, autocomplete, 'words starting with'","note":"the definition"},{"cue":"<b>a dictionary of many words</b> queried repeatedly","note":"build once, query cheaply"},{"cue":"word search in a <b>grid with many target words</b>","note":"trie + DFS prunes dead branches instantly"},{"cue":"<b>maximum XOR</b> pair, 'two numbers with the biggest xor'","note":"binary trie, greedy from the top bit"},{"cue":"<b>maximum XOR</b> against a set of numbers","note":"bitwise trie"}],"notwhen":["There's only one word, or a handful → a set or direct comparison is simpler.","You need suffixes or substring search → that's a suffix structure, or KMP / Z-algorithm."],"pick":[{"if":"insert, search, and prefix queries","then":"tr-basic"},{"if":"wildcards, or pruning a search with a dictionary","then":"tr-search"},{"if":"maximise XOR","then":"tr-xor"}],"variants":[{"id":"tr-basic","name":"Insert / search / startsWith","when":"A dictionary queried by exact word or by prefix.","tool":"a dict of children per node, plus an end-of-word flag","invariant":"the path from the root to a node spells exactly that node's prefix","cx":"O(L) per operation, O(total characters) space","code":"class Trie:\n    def __init__(self):\n        self.ch = {}            # character -> Trie\n        self.end = False        # a word ENDS here (not merely passes through)\n    def insert(self, w):\n        node = self\n        for c in w:\n            node = node.ch.setdefault(c, Trie())\n        node.end = True\n    def _walk(self, w):\n        node = self\n        for c in w:\n            if c not in node.ch: return None\n            node = node.ch[c]\n        return node\n    def search(self, w):\n        node = self._walk(w)\n        return node is not None and node.end\n    def startsWith(self, p):\n        return self._walk(p) is not None","asks":["implement a trie — insert, search, startsWith","autocomplete / search suggestions system","longest common prefix of a list of words","replace words with their shortest root (dictionary of roots)","map sum pairs; index pairs of a string","maximum XOR of two numbers (a trie over the bits, taking the opposite bit at each level)","camelcase matching, prefix and suffix search"],"examples":[{"n":"Implement Trie (Prefix Tree)","s":"LC 208"},{"n":"Replace Words","s":"LC 648"},{"n":"Search Suggestions System","s":"LC 1268"},{"n":"Maximum XOR of Two Numbers in an Array","s":"LC 421"},{"n":"Longest Common Prefix","s":"LC 14"}],"traps":["The <code>end</code> flag is not optional: without it 'app' matches when only 'apple' was inserted.","<code>setdefault</code> (or defaultdict) keeps insert to four lines.","A dict of children beats a 26-slot array when the alphabet is large or sparse; the array wins when it is dense."],"rare":false,"keys":["prefix","startsWith","dictionary","autocomplete","implement trie","longest common prefix"]},{"id":"tr-search","name":"Trie as a search pruner","when":"Many candidate words, and a search that would otherwise explore dead ends.","tool":"walk the trie alongside the search; the moment there is no child, stop","invariant":"you only ever explore prefixes that at least one real word still matches","cx":"O(cells · 4^L) worst case, but pruned enormously in practice","code":"def find_words(board, words):\n    root = Trie()\n    for w in words: root.insert(w)\n    out, R, C = set(), len(board), len(board[0])\n    def dfs(r, c, node, path):\n        ch = board[r][c]\n        if ch not in node.ch: return          # DEAD END -- the whole point\n        nxt = node.ch[ch]\n        if nxt.end: out.add(path + ch)\n        board[r][c] = \"#\"                      # mark visited\n        for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < R and 0 <= nc < C and board[nr][nc] != \"#\":\n                dfs(nr, nc, nxt, path + ch)\n        board[r][c] = ch                       # restore\n    for r in range(R):\n        for c in range(C):\n            dfs(r, c, root, \"\")\n    return list(out)","asks":["word search II — find every dictionary word in a grid","add and search word with '.' wildcards (recurse over all children on a dot)","word break / word break II with a large dictionary","concatenated words; longest word in a dictionary built one letter at a time","stream of characters — has any word just ended (store the words reversed)","palindrome pairs"],"examples":[{"n":"Word Search II","s":"LC 212"},{"n":"Design Add and Search Words Data Structure","s":"LC 211"},{"n":"Word Break II","s":"LC 140"},{"n":"Stream of Characters","s":"LC 1032"},{"n":"Concatenated Words","s":"LC 472"}],"traps":["Restore the cell after recursing, or the grid is destroyed for the next start square.","On a '.' wildcard you must try EVERY child, not just one.","Use a set for the output — the same word can be reached by two different paths.","For a stream, insert the words REVERSED and walk backwards from the newest character."],"rare":false,"keys":["word search II","many words on a board","wildcard dictionary","search with '.'"]},{"id":"tr-xor","name":"Bitwise trie (maximum XOR)","when":"Maximise XOR of a value against a set of numbers.","tool":"a binary trie of the numbers from high bit to low","invariant":"at each bit, going to the opposite bit is always best if it exists","cx":"O(30·n) time and space","code":"def max_xor(nums):\n    root = {}\n    best = 0\n    for x in nums:\n        node = root\n        for b in range(30, -1, -1):\n            node = node.setdefault((x >> b) & 1, {})\n        node, cur = root, 0\n        for b in range(30, -1, -1):\n            bit = (x >> b) & 1\n            if 1 - bit in node:\n                cur |= 1 << b\n                node = node[1 - bit]\n            else:\n                node = node[bit]\n        best = max(best, cur)\n    return best","asks":["maximum XOR of two numbers in an array","maximum XOR with a limit on the partner (sort queries offline)","maximum XOR of a subarray (trie over prefix XORs)"],"examples":[{"n":"Maximum XOR of Two Numbers in an Array","s":"LC 421"},{"n":"Maximum XOR With an Element From Array","s":"LC 1707"},{"n":"Maximum Strong Pair XOR II","s":"LC 2935"}],"traps":["Always insert with the same fixed bit count, leading zeros included.","Subarray XOR: insert prefix 0 before you start."],"keys":["maximum XOR","largest XOR","XOR with a query value"],"rare":false}]},{"id":"graph-walk","group":"graph","name":"Graph traversal (adjacency list)","buys":"Turns a list of edges into components, colourings and shortest hops.","lives":"nodes and edges, often hidden: cities, friends, words, lock states","core":"If things connect to things, it is a graph, even when the word graph never appears. Build an adjacency list, keep a visited set, then choose DFS for reachability and BFS for fewest steps.","recognise":[{"cue":"<b>connected</b>, provinces, friend circles, reachable","note":"components"},{"cue":"<b>two groups</b>, no enemies together","note":"bipartite colouring"},{"cue":"<b>fewest moves</b> between states that are not cells","note":"BFS over states"},{"cue":"each node has <b>exactly one</b> outgoing edge","note":"functional graph"},{"cue":"<b>critical</b> connection, removing it disconnects","note":"bridges"},{"cue":"<b>mutually reachable</b> groups in a directed graph","note":"SCC"},{"cue":"use <b>every edge exactly once</b>","note":"Euler path"}],"notwhen":["Edges have different weights and you need the cheapest path → weighted shortest paths.","Prerequisites or an ordering → topological sort."],"pick":[{"if":"reachability or number of groups","then":"gw-components"},{"if":"split into two conflict-free sides","then":"gw-bipartite"},{"if":"fewest moves through abstract states","then":"gw-state"},{"if":"one outgoing edge per node","then":"gw-functional"},{"if":"edge whose removal disconnects","then":"gw-bridges"},{"if":"directed, mutual reachability","then":"gw-scc"},{"if":"use each edge once","then":"gw-euler"}],"variants":[{"id":"gw-components","name":"Connected components / clone","when":"Who can reach whom, how many groups, or copy the graph.","tool":"adjacency list + visited set","invariant":"a node is marked the moment it is discovered","cx":"O(V + E)","code":"def count_components(n, edges):\n    g = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b); g[b].append(a)\n    seen, groups = set(), 0\n    for s in range(n):\n        if s in seen:\n            continue\n        groups += 1\n        stack = [s]\n        seen.add(s)\n        while stack:\n            for v in g[stack.pop()]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n    return groups","asks":["number of provinces / friend circles","is there a path","can all rooms be visited","clone a graph (old → new map)","count unreachable pairs"],"examples":[{"n":"Number of Provinces","s":"LC 547"},{"n":"Keys and Rooms","s":"LC 841"},{"n":"Find if Path Exists in Graph","s":"LC 1971"},{"n":"Clone Graph","s":"LC 133"},{"n":"Count Unreachable Pairs of Nodes in an Undirected Graph","s":"LC 2316"}],"traps":["Mark visited when you PUSH, or nodes are queued many times.","Isolated nodes count as components: loop over all n."],"keys":["connected","provinces","friend groups","can reach","clone the graph","network","cities connected by roads"],"rare":false},{"id":"gw-bipartite","name":"Two-colouring (bipartite)","when":"Split nodes into two groups with no edge inside a group.","tool":"a colour map, giving neighbours the opposite colour","invariant":"every edge joins two different colours","cx":"O(V + E)","code":"def is_bipartite(g):\n    colour = {}\n    for s in range(len(g)):\n        if s in colour:\n            continue\n        colour[s] = 0\n        stack = [s]\n        while stack:\n            u = stack.pop()\n            for v in g[u]:\n                if v not in colour:\n                    colour[v] = 1 - colour[u]\n                    stack.append(v)\n                elif colour[v] == colour[u]:\n                    return False\n    return True","asks":["is the graph bipartite","split people who dislike each other","odd cycle detection"],"examples":[{"n":"Is Graph Bipartite?","s":"LC 785"},{"n":"Possible Bipartition","s":"LC 886"}],"traps":["Start from every uncoloured node: the graph may be disconnected."],"keys":["two groups","two teams","dislike","enemies","no two adjacent","bipartite"],"rare":false},{"id":"gw-state","name":"BFS over states","when":"Fewest moves, but a node is a situation (a word, lock code or position + keys), not a cell.","tool":"a queue of states + a visited set of states","invariant":"BFS reaches each state first by its fewest moves","cx":"O(states × moves per state)","code":"from collections import deque\n\ndef open_lock(deadends, target):\n    dead = set(deadends)\n    if \"0000\" in dead:\n        return -1\n    q, seen = deque([(\"0000\", 0)]), {\"0000\"}\n    while q:\n        s, d = q.popleft()\n        if s == target:\n            return d\n        for i in range(4):\n            for step in (1, 9):\n                t = s[:i] + str((int(s[i]) + step) % 10) + s[i + 1:]\n                if t not in dead and t not in seen:\n                    seen.add(t)\n                    q.append((t, d + 1))\n    return -1","asks":["word ladder","open a lock","shortest path with k obstacle removals (state: cell, k)","snakes and ladders","visit all nodes (state: node, bitmask)"],"examples":[{"n":"Word Ladder","s":"LC 127"},{"n":"Open the Lock","s":"LC 752"},{"n":"Shortest Path in a Grid with Obstacles Elimination","s":"LC 1293"},{"n":"Snakes and Ladders","s":"LC 909"},{"n":"Shortest Path Visiting All Nodes","s":"LC 847"}],"traps":["The visited set must contain the WHOLE state, including keys or remaining removals.","Estimate the state count first."],"keys":["minimum number of moves","transform into","one change at a time","minimum steps to reach","with at most k"],"rare":false},{"id":"gw-functional","name":"Functional graph (one outgoing edge)","when":"Each node points to exactly one other: 'next', favourite, or an array used as pointers.","tool":"follow pointers, stamping each visit with a step number","invariant":"a revisit within the same walk closes a cycle","cx":"O(n)","code":"def longest_cycle(edges):\n    best, stamp = -1, {}\n    clock = 0\n    for s in range(len(edges)):\n        start = clock\n        u = s\n        while u != -1 and u not in stamp:\n            stamp[u] = clock\n            clock += 1\n            u = edges[u]\n        if u != -1 and stamp[u] >= start:\n            best = max(best, clock - stamp[u])\n    return best","asks":["longest cycle","closest meeting node of two walkers","find the duplicate number (array as pointers)","who ends up where after k jumps"],"examples":[{"n":"Longest Cycle in a Graph","s":"LC 2360"},{"n":"Find Closest Node to Given Two Nodes","s":"LC 2359"},{"n":"Find the Duplicate Number","s":"LC 287"},{"n":"Maximum Employees to Be Invited to a Meeting","s":"LC 2127"}],"traps":["A stamp from an EARLIER walk is not a new cycle; compare with this walk's start."],"keys":["each node has at most one outgoing edge","points to","favorite person","next[i]","jump to a[i]"],"rare":false},{"id":"gw-bridges","name":"Bridges and articulation points","when":"Which edge or node, if removed, disconnects the graph.","tool":"DFS with discovery time and low-link","invariant":"low[v] is the earliest node reachable from v's subtree","cx":"O(V + E)","code":"def bridges(n, edges):\n    g = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b); g[b].append(a)\n    disc, low, out = [-1] * n, [0] * n, []\n    t = [0]\n    def dfs(u, parent):\n        disc[u] = low[u] = t[0]; t[0] += 1\n        for v in g[u]:\n            if v == parent:\n                continue\n            if disc[v] == -1:\n                dfs(v, u)\n                low[u] = min(low[u], low[v])\n                if low[v] > disc[u]:\n                    out.append([u, v])\n            else:\n                low[u] = min(low[u], disc[v])\n    for i in range(n):\n        if disc[i] == -1:\n            dfs(i, -1)\n    return out","asks":["critical connections","articulation points","single points of failure"],"examples":[{"n":"Critical Connections in a Network","s":"LC 1192"}],"traps":["Articulation point test is low[v] >= disc[u], and the root needs at least two children."],"keys":["critical connection","removing it disconnects","single point of failure","articulation"],"rare":true},{"id":"gw-scc","name":"Strongly connected components","when":"Groups in a DIRECTED graph where everyone can reach everyone.","tool":"Kosaraju: finish order, then DFS on the reversed graph","invariant":"in reverse finish order, each DFS on the reversed graph finds one SCC","cx":"O(V + E)","code":"def scc_count(n, edges):\n    g = [[] for _ in range(n)]\n    r = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b); r[b].append(a)\n    seen, order = [False] * n, []\n    def d1(u):\n        seen[u] = True\n        for v in g[u]:\n            if not seen[v]:\n                d1(v)\n        order.append(u)\n    def d2(u):\n        seen[u] = True\n        for v in r[u]:\n            if not seen[v]:\n                d2(v)\n    for i in range(n):\n        if not seen[i]:\n            d1(i)\n    seen = [False] * n\n    count = 0\n    for u in reversed(order):\n        if not seen[u]:\n            count += 1\n            d2(u)\n    return count","asks":["count SCCs","condense a graph into a DAG","mutually reachable groups"],"examples":[],"traps":["The second DFS must run on the REVERSED graph, in reverse finish order."],"keys":["strongly connected","mutually reachable","directed","reach each other"],"rare":true},{"id":"gw-euler","name":"Euler path (use every edge once)","when":"A route that uses every edge exactly once.","tool":"Hierholzer: DFS consuming edges, record nodes on the way back","invariant":"a node is appended only when all its edges are used","cx":"O(E log E) with sorted edges","code":"import heapq\n\ndef itinerary(tickets):\n    g = {}\n    for a, b in tickets:\n        heapq.heappush(g.setdefault(a, []), b)\n    route = []\n    def go(u):\n        while g.get(u):\n            go(heapq.heappop(g[u]))\n        route.append(u)\n    go(\"JFK\")\n    return route[::-1]","asks":["reconstruct an itinerary from tickets","valid arrangement of pairs","can you draw it without lifting the pen"],"examples":[{"n":"Reconstruct Itinerary","s":"LC 332"},{"n":"Valid Arrangement of Pairs","s":"LC 2097"}],"traps":["Undirected: an Euler path exists only with 0 or 2 odd-degree nodes.","The route comes out backward. Reverse it."],"keys":["use every edge exactly once","itinerary","all tickets","without lifting"],"rare":true}]},{"id":"grid","group":"graph","name":"Grid traversal (a grid IS a graph)","buys":"Trying every path blows up exponentially. Treating the grid as a graph visits each cell once — O(rows · cols).","lives":"2-D grid of cells, where neighbours are up/down/left/right (sometimes the 8 diagonals too)","core":"Stop seeing a matrix and start seeing a graph: each cell is a node, each legal move is an edge. The only question left is which traversal to use. DFS or BFS both label connected regions, but only BFS gives you SHORTEST — it finishes a whole distance ring before starting the next one.","recognise":[{"cue":"<b>islands</b>, regions, connected blobs, flood fill, 'how many groups'","note":"DFS or BFS, either works"},{"cue":"<b>fewest steps</b> / shortest path / minimum moves on a grid","note":"BFS — and only BFS"},{"cue":"<b>everything spreads at once</b> (rot, fire, water, infection)","note":"multi-source BFS"},{"cue":"<b>distance to the nearest</b> X for every cell","note":"multi-source BFS from all the X's"},{"cue":"'can I reach the edge', 'surrounded regions'","note":"flood fill INWARD from the border"},{"cue":"<b>surrounded, enclosed</b>, 'reaches the edge'","note":"flood from the border inward"}],"notwhen":["Moves have different COSTS → plain BFS gives a wrong answer; use Dijkstra (or 0-1 BFS with a deque).","You might revisit a cell with a different budget → the state is (cell, budget), not just the cell alone.","The answer is a count of paths, not reachability → that's grid DP."],"pick":[{"if":"label or count connected regions","then":"gr-flood"},{"if":"fewest moves from ONE start","then":"gr-bfs"},{"if":"many sources spreading together, or 'distance to nearest'","then":"gr-multi"},{"if":"the border decides which cells are safe","then":"gr-border"}],"variants":[{"id":"gr-flood","name":"Flood fill / connected components","when":"Count or label regions of connected cells.","tool":"DFS (or BFS) from each unvisited cell, sinking the whole region as you go","invariant":"once a cell is marked, it belongs to exactly one region and is never counted again","cx":"O(rows · cols) — every cell is entered at most once","code":"DIRS = ((1,0), (-1,0), (0,1), (0,-1))\ndef num_islands(g):\n    R, C = len(g), len(g[0])\n    def sink(r, c):\n        if r < 0 or r >= R or c < 0 or c >= C or g[r][c] != \"1\":\n            return                       # one guard, at the TOP -- not at every call site\n        g[r][c] = \"0\"                    # mark BEFORE recursing, or you loop forever\n        for dr, dc in DIRS:\n            sink(r + dr, c + dc)\n    n = 0\n    for r in range(R):\n        for c in range(C):\n            if g[r][c] == \"1\":\n                n += 1                   # a new region starts here\n                sink(r, c)\n    return n","asks":["number of islands; max area of an island; count sub-islands","flood fill / paint bucket","surrounded regions (flood INWARD from the border, then flip the rest)","number of closed islands, number of enclaves","island perimeter; number of distinct islands (normalise each shape)","pacific atlantic water flow (two floods, one from each ocean)","making a large island (flip one 0 — label regions, then test each 0's neighbours)","count of connected components in a matrix of friends / provinces"],"examples":[{"n":"Number of Islands","s":"LC 200"},{"n":"Max Area of Island","s":"LC 695"},{"n":"Flood Fill","s":"LC 733"},{"n":"Surrounded Regions","s":"LC 130"},{"n":"Pacific Atlantic Water Flow","s":"LC 417"},{"n":"Number of Closed Islands","s":"LC 1254"},{"n":"Making A Large Island","s":"LC 827"}],"traps":["Mark the cell visited BEFORE recursing into neighbours, or two adjacent cells call each other forever.","Put the bounds check at the top of the function, not at each of the four call sites — four chances to get it wrong.","A 1000×1000 grid can blow Python's recursion limit; use an explicit stack or BFS.","'Surrounded regions' is solved by flooding from the BORDER in
