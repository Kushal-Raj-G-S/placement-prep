  * { box-sizing:border-box; }

<script type="application/json" id="shapes">
[
  {
    "id":"s1","title":"One integer","raw":"5",
    "code":"n = int(input())",
    "note":"The simplest possible case. int() ignores the trailing newline for you, so no strip needed."
  },
  {
    "id":"s2","title":"A count, then that many numbers on one line","raw":"5\n1 2 3 4 5",
    "code":"n = int(input())\narr = list(map(int, input().split()))",
    "note":"The single most common shape in Indian OAs. Note that n is often redundant — len(arr) gives you the same thing — but you MUST still read that first line or everything after it shifts by one."
  },
  {
    "id":"s3","title":"Numbers on one line, no count given","raw":"1 2 3 4 5",
    "code":"arr = list(map(int, input().split()))\nn = len(arr)",
    "note":"If you assume a count line that is not there, your first value gets eaten and every answer is wrong. Read the sample input character by character before you write anything."
  },
  {
    "id":"s4","title":"Two or three values on one line","raw":"5 3",
    "code":"n, k = map(int, input().split())",
    "note":"Unpacking straight from map() is the idiom. For three values: n, m, k = map(int, input().split())"
  },
  {
    "id":"s5","title":"A count, then that many separate lines","raw":"3\napple\nbanana\ncherry",
    "code":"n = int(input())\nitems = [input().strip() for _ in range(n)]",
    "note":"strip() is not optional here. Without it every string ends in \\n, so 'apple\\n' != 'apple' and your comparisons silently fail. This is one of the most common zero-scorers."
  },
  {
    "id":"s6","title":"T test cases","raw":"2\n3\n1 2 3\n4\n5 6 7 8",
    "code":"t = int(input())\nfor _ in range(t):\n    n = int(input())\n    arr = list(map(int, input().split()))\n    print(solve(n, arr))",
    "note":"Very common on CodeChef, HackerEarth and TCS. Print the answer for each case as you go, or collect them and join once at the end — the second is faster when T is large."
  },
  {
    "id":"s7","title":"A grid of numbers","raw":"3 3\n1 0 1\n0 1 0\n1 1 1",
    "code":"r, c = map(int, input().split())\ngrid = [list(map(int, input().split())) for _ in range(r)]",
    "note":"Every matrix and island problem arrives like this. Watch the row/column order: it is almost always rows first, but read the statement rather than assuming."
  },
  {
    "id":"s8","title":"A grid of characters","raw":"3 3\n#.#\n.#.\n###",
    "code":"r, c = map(int, input().split())\ngrid = [input().strip() for _ in range(r)]",
    "note":"No split() here — the characters are not separated by spaces. Using split() would give you one string per row inside a list, which quietly breaks grid[i][j] indexing."
  },
  {
    "id":"s9","title":"A graph as an edge list","raw":"4 3\n1 2\n2 3\n3 4",
    "code":"n, m = map(int, input().split())\nadj = [[] for _ in range(n + 1)]\nfor _ in range(m):\n    u, v = map(int, input().split())\n    adj[u].append(v)\n    adj[v].append(u)   # drop this line if directed",
    "note":"Size the list n+1 because these problems are almost always 1-indexed. For a weighted graph read u, v, w and append (v, w). Getting 1-indexing wrong is the classic off-by-one in every graph OA."
  },
  {
    "id":"s10","title":"A string that contains spaces","raw":"the quick brown fox",
    "code":"s = input().rstrip('\\n')",
    "note":"Do NOT call split() here — it would destroy the sentence you were asked to process. If you used sys.stdin.readline you must strip, because readline keeps the newline."
  },
  {
    "id":"s11","title":"Mixed types on one line","raw":"Kushal 21 88.5",
    "code":"parts = input().split()\nname = parts[0]\nage = int(parts[1])\nscore = float(parts[2])",
    "note":"map(int, ...) would crash on the name. Split first, then cast each field individually."
  },
  {
    "id":"s12","title":"Read until end of input","raw":"1 2\n3 4\n5 6",
    "code":"import sys\n\nfor line in sys.stdin:\n    line = line.strip()\n    if not line:\n        continue\n    a, b = map(int, line.split())\n    print(a + b)",
    "note":"No count, no sentinel — just keep reading until the stream ends. Guard against blank trailing lines or you crash on the last iteration."
  },
  {
    "id":"s13","title":"Read until a sentinel value","raw":"5\n7\n9\n-1",
    "code":"import sys\n\nnums = []\nfor line in sys.stdin:\n    x = int(line)\n    if x == -1:\n        break\n    nums.append(x)",
    "note":"The sentinel is not part of the data. Break before appending, not after."
  },
  {
    "id":"s14","title":"Everything at once (the heavy-input template)","raw":"3\n1 2 3\n4 5 6\n7 8 9",
    "code":"import sys\n\ndata = sys.stdin.buffer.read().split()\nidx = 0\n\ndef nxt():\n    global idx\n    idx += 1\n    return data[idx - 1]\n\nn = int(nxt())\nrows = [[int(nxt()) for _ in range(3)] for _ in range(n)]",
    "note":"When input is huge (10^5 lines or more) and line-by-line reading times out, read the whole stream once and walk a token pointer. This ignores line breaks entirely, which is usually fine and sometimes essential. Note buffer.read() gives bytes — int() handles them, but strings need .decode()."
  }
]
</script>
