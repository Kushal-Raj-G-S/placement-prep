<title>Twenty Weeks to AC</title>

<style>
  :root {

  }
  :root[data-theme="dark"] {
    --ground:#0E1319; --surface:#151C24; --surface-alt:#1C242E; --surface-hi:#232C37;
    --ink:#E4EAF1; --ink-mid:#AEB9C6; --ink-dim:#7C8895;
    --line:#29323D; --line-soft:#212932;
    --accent:#2FD3E8; --accent-soft:#123840; --accent-ink:#8CE9F7;

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:min(1800px,96vw); margin:0 auto; padding:32px 22px 96px; display:flex; flex-direction:column; gap:32px; }
  a { color:var(--accent); }

  button { font-family:inherit; }
  .line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
  .src { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-dim); }
  .plain { font-size:14px; color:var(--ink); }
  .eyebrow { font-family:var(--f-mono); font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); }

  .mast { display:flex; flex-direction:column; gap:14px; }
  .mast h1 { font-family:var(--f-display); font-weight:700; font-size:clamp(30px,5.2vw,46px); line-height:1.03; letter-spacing:-.015em; margin:0; text-wrap:balance; }
  .mast .lede { margin:0; max-width:66ch; color:var(--ink-mid); font-size:15.5px; }

  .readout { display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .readout .cell { background:var(--surface); padding:11px 13px; display:flex; flex-direction:column; gap:3px; }
  .readout .k { font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-dim); }
  .readout .v { font-family:var(--f-mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .readout .v small { font-size:12px; font-weight:400; color:var(--ink-dim); }
  .readout .cell.hi .v { color:var(--accent); }
  .readout .cell.warn .v { color:var(--med); }

  .today { display:grid; grid-template-columns:1fr 1fr auto; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .today .pane { background:var(--surface); padding:13px 15px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .today .pane .k { font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-dim); }
  .today .pane a { font-weight:500; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .today .pane a:hover { text-decoration:underline; }
  .today .pane .none { color:var(--ink-dim); font-size:14px; }
  .timer { background:var(--surface); padding:11px 15px; display:flex; align-items:center; gap:11px; }
  .clock { font-family:var(--f-mono); font-size:25px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; min-width:86px; }
  .clock.run { color:var(--accent); } .clock.out { color:var(--hard); }
  .timer .btns { display:flex; flex-direction:column; gap:4px; }
  .tbtn { font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; background:var(--surface-alt); color:var(--ink-mid); border:1px solid var(--line); border-radius:2px; padding:4px 8px; cursor:pointer; white-space:nowrap; }
  .tbtn:hover { background:var(--surface-hi); color:var(--ink); }
  .tbtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }

  .sec-head { display:flex; align-items:baseline; gap:13px; margin-bottom:14px; flex-wrap:wrap; }
  .sec-head h2 { font-family:var(--f-display); font-weight:600; font-size:23px; letter-spacing:-.01em; margin:0; }
  .sec-head .note { color:var(--ink-dim); font-size:13.5px; }

  .verdict-box { border:1px solid var(--med); background:var(--med-bg); border-radius:var(--r); padding:16px 18px; display:flex; flex-direction:column; gap:10px; }
  .verdict-box h2 { font-family:var(--f-display); font-weight:600; font-size:20px; margin:0; }
  .verdict-box p { margin:0; color:var(--ink-mid); font-size:14.5px; max-width:74ch; }
  .verdict-box strong { color:var(--ink); font-weight:600; }

  .findings { display:flex; flex-direction:column; gap:13px; }
  .finding { border-left:2px solid var(--accent); padding-left:15px; max-width:72ch; }
  .finding.gate { border-left-color:var(--gate); }
  .finding b { display:block; font-family:var(--f-mono); font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--accent); margin-bottom:1px; }
  .finding.gate b { color:var(--gate); }
  .finding span { color:var(--ink-mid); font-size:14.5px; }

  .toolbar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 13px; background:var(--surface-alt); border:1px solid var(--line); border-radius:var(--r); }
  .toolbar input[type="search"] { font-family:var(--f-body); font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:6px 9px; min-width:170px; flex:1 1 170px; }
  .toolbar input[type="date"] { font-family:var(--f-mono); font-size:12px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:4px 6px; }
  .fgroup { display:flex; gap:3px; }
  .fbtn { font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; background:var(--surface); color:var(--ink-dim); border:1px solid var(--line); border-radius:2px; padding:5px 8px; cursor:pointer; }
  .fbtn:hover { color:var(--ink); }
  .fbtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .tool-lab { font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-dim); }
  .toolbar .spacer { flex:1 1 auto; }
  #saveState { font-family:var(--f-mono); font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  #saveState[data-s="saving"] { color:var(--accent); }
  #saveState[data-s="error"] { color:var(--hard); }
  #saveState[data-s="local"] { color:var(--med); }

  .trackhd { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:10px 0 -6px; }
  .trackhd h3 { font-family:var(--f-display); font-weight:700; font-size:17px; margin:0; letter-spacing:.01em; text-transform:uppercase; }
  .trackhd .sub { color:var(--ink-dim); font-size:13.5px; max-width:70ch; }

  .phases { display:flex; flex-direction:column; gap:16px; }
  .phase { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .phase.now { border-color:var(--accent); }
  .phase.gate { border-left:3px solid var(--gate); }
  .phase-hd { display:flex; align-items:center; gap:11px; flex-wrap:wrap; padding:12px 16px; background:var(--surface-alt); border-bottom:1px solid var(--line); }
  .phase-hd .tag { font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line); border-radius:2px; padding:2px 6px; white-space:nowrap; }
  .phase.now .phase-hd .tag { color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft); }
  .phase.gate .phase-hd .tag { color:var(--gate); border-color:var(--gate); background:var(--gate-soft); }
  .phase-hd h3 { font-family:var(--f-display); font-weight:600; font-size:18px; margin:0; }
  .phase-hd .wk { font-family:var(--f-mono); font-size:11.5px; color:var(--ink-dim); }
  .phase-hd .tally { margin-left:auto; font-family:var(--f-mono); font-size:11.5px; font-variant-numeric:tabular-nums; color:var(--ink-dim); }
  .phase-note { padding:10px 16px; color:var(--ink-mid); font-size:13.5px; border-bottom:1px solid var(--line-soft); max-width:none; }

  .block { border-bottom:1px solid var(--line-soft); }
  .block:last-child { border-bottom:0; }
  .block-hd { width:100%; text-align:left; display:grid; grid-template-columns:14px 1fr auto; gap:11px; align-items:center; padding:12px 16px; background:none; border:0; cursor:pointer; color:inherit; }
  .block-hd:hover { background:var(--surface-alt); }
  .caret { font-family:var(--f-mono); font-size:11px; color:var(--ink-dim); transition:transform .15s ease; display:inline-block; }
  .block.open .caret { transform:rotate(90deg); }
  .block-name { font-weight:600; font-size:15px; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .pill { font-family:var(--f-mono); font-size:9.5px; letter-spacing:.05em; border-radius:2px; padding:1px 5px; font-weight:500; }
  .pill.star { color:var(--accent); border:1px solid var(--accent); }
  .pill.opt { color:var(--ink-dim); border:1px solid var(--line); }
  .pill.new { color:var(--gate); border:1px solid var(--gate); }
  .block-meta { display:flex; align-items:center; gap:9px; }
  .minibar { width:70px; height:5px; background:var(--track); border-radius:999px; overflow:hidden; }
  .minibar i { display:block; height:100%; background:var(--accent); transition:width .3s ease; }
  .block-count { font-family:var(--f-mono); font-size:11.5px; font-variant-numeric:tabular-nums; color:var(--ink-dim); min-width:42px; text-align:right; }
  .items { display:none; padding:0 16px 14px 41px; }
  .block.open .items { display:block; }
  .block-why { color:var(--ink-dim); font-size:13.5px; max-width:none; padding:2px 0 10px; }

  .item { display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line-soft); }
  .item:last-child { border-bottom:0; }
  .item a { text-decoration:none; color:var(--ink); font-size:14px; }
  .item a:hover { color:var(--accent); text-decoration:underline; }
  .item.ac a, .item.ac .plain { color:var(--ink-dim); }

  .mark { font-family:var(--f-mono); font-size:9.5px; font-weight:600; letter-spacing:.06em; border:1px solid var(--line); border-radius:2px; padding:5px 0; width:38px; text-align:center; background:var(--surface); color:var(--ink-dim); cursor:pointer; }
  .mark:hover { border-color:var(--ink-dim); color:var(--ink); }
  .mark.ac { color:var(--easy); border-color:var(--easy); background:var(--easy-bg); }
  .mark.tle { color:var(--med); border-color:var(--med); background:var(--med-bg); }

  .right { display:flex; align-items:center; gap:8px; }
  .diff { font-family:var(--f-mono); font-size:9.5px; font-weight:600; letter-spacing:.06em; border-radius:2px; padding:2px 5px; }
  .diff.E { color:var(--easy); background:var(--easy-bg); }
  .diff.M { color:var(--med); background:var(--med-bg); }
  .diff.H { color:var(--hard); background:var(--hard-bg); }
  .ago { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  .ago.stale { color:var(--med); }

  .refs { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:19px; display:flex; flex-direction:column; gap:11px; }

  .revlist { display:flex; flex-direction:column; }
  .rev { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line-soft); }

  .redo { font-family:var(--f-mono); font-size:10px; letter-spacing:.05em; background:var(--surface-alt); border:1px solid var(--line); border-radius:2px; padding:4px 7px; cursor:pointer; color:var(--ink-mid); white-space:nowrap; }
  .redo:hover { border-color:var(--accent); color:var(--accent); }

  .tbl-scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); text-align:left; font-weight:500; padding:0 12px 7px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:7px 12px 7px 0; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-mid); }
  tr:last-child td { border-bottom:0; }
  td.n,td.o { font-family:var(--f-mono); font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap; }
  td.o { color:var(--accent); }
  td.t1 { color:var(--easy); font-family:var(--f-mono); font-size:11px; white-space:nowrap; }
  td.t2 { color:var(--med); font-family:var(--f-mono); font-size:11px; white-space:nowrap; }
  td.t3 { color:var(--hard); font-family:var(--f-mono); font-size:11px; white-space:nowrap; }
  td.tx { color:var(--ink-dim); font-family:var(--f-mono); font-size:11px; white-space:nowrap; }
  td.pay { font-family:var(--f-mono); font-size:11.5px; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.below td { opacity:.55; }

  ol.play { margin:0; padding-left:19px; display:flex; flex-direction:column; gap:9px; }
  ol.play li { color:var(--ink-mid); font-size:14px; }
  ol.play li::marker { font-family:var(--f-mono); font-size:12px; color:var(--ink-dim); }
  ol.play b { color:var(--ink); font-weight:600; }
  ul.kit { margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  ul.kit li { list-style:none; font-size:14px; color:var(--ink-mid); }
  code { font-family:var(--f-mono); font-size:12.5px; background:var(--surface-alt); border:1px solid var(--line-soft); border-radius:2px; padding:1px 4px; color:var(--ink); }
  .flag { background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r); padding:12px 14px; font-size:14px; color:var(--ink); }
  .flag.warn { background:var(--med-bg); border-color:var(--med); }
  .flag b { font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips span { font-family:var(--f-mono); font-size:11.5px; background:var(--surface-alt); border:1px solid var(--line); border-radius:2px; padding:3px 7px; color:var(--ink-mid); }

  footer { border-top:1px solid var(--line); padding-top:18px; color:var(--ink-dim); font-size:13px; max-width:74ch; display:flex; flex-direction:column; gap:10px; }
  footer .row2 { display:flex; gap:8px; flex-wrap:wrap; }

  @media (max-width:860px) {
    .readout { grid-template-columns:repeat(3,1fr); }
    .today { grid-template-columns:1fr; }
  }
  @media (max-width:620px) {
    .readout { grid-template-columns:repeat(2,1fr); }
    .wrap { padding:22px 13px 72px; gap:26px; }
    .items { padding-left:16px; }
    .item { grid-template-columns:44px 1fr; row-gap:2px; padding:7px 0; }
    .item .right { grid-column:2; justify-content:flex-start; }
    .mark { width:44px; padding:8px 0; }
    .block-hd { padding:14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

      ["week 20", "rating past 1600; one complete + one partial in a cold 90-minute mock"]
    ], function (ci) { return ci === 0 ? "n" : ""; }));
    var p = el("p", "sub"); p.style.marginTop = "4px";
    p.textContent = "Calibration: a contest rating around 1500 clears most service-company and mid-tier product assessments. 1600-1700 clears most product-company ones.";
    c.appendChild(p);
    return c;
  }

  function revisionCard() {
    var q = revisionQueue();
    var c = el("div", "card wide");
    c.appendChild(el("h3", null, "Revision queue"));
    c.appendChild(el("p", "sub", "Anything marked TLE, plus anything solved more than " + STALE_DAYS + " days ago. Take the top one each day, oldest first."));
    if (!q.length) { c.appendChild(el("p", "sub", "Empty for now — it fills itself as your solves age.")); return c; }
    var list = el("div", "revlist");
    q.slice(0, 14).forEach(function (r) {
      var row = el("div", "rev");
      row.appendChild(link(r.it.u, r.it.t));
      row.appendChild(el("span", "src", r.why));
      var btn = el("button", "redo", "did it again"); btn.type = "button";
      btn.addEventListener("click", function () { redo(r.k); });
      row.appendChild(btn);
      list.appendChild(row);
    });
    c.appendChild(list);
    if (q.length > 14) c.appendChild(el("p", "sub", (q.length - 14) + " more behind these."));
    return c;
  }

  function refsSection() {
    var s = el("section");
    var hd = el("div", "sec-head");
    hd.appendChild(el("h2", null, "Reference"));
    hd.appendChild(el("span", "note", "keep the protocol and the ladder open during a real assessment"));
    s.appendChild(hd);
    var g = el("div", "refs");
    g.appendChild(companyCard());
    g.appendChild(protocolCard());
    g.appendChild(ladderCard());
    g.appendChild(pythonCard());
    g.appendChild(edgeCard());
    g.appendChild(milestoneCard());
    g.appendChild(revisionCard());
    s.appendChild(g);
    return s;
  }

  function footerNode() {
    var f = document.createElement("footer");
    var p = document.createElement("p"); p.style.margin = "0";
    p.textContent = "Problem sources stay yours — the patterns cheat sheet and Striver's A2Z for the per-pattern lists, your usual channels for the explanation before each block. For the aptitude and CS-fundamentals track, IndiaBix and PrepInsta company-wise sets are what most Indian students use. Company formats vary per drive; verify against your placement cell's actual recruiter list before tiering your shortlist.";
    f.appendChild(p);
    var tools = el("div", "companion-row");
    tools.style.marginTop = "4px";
    tools.innerHTML = 'The practice tools: <a href="./10%20-%20Mock%20OA%20%28timed%20exam%29.html" target="_blank" rel="noopener noreferrer">Mock OA</a> · <a href="./9%20-%20Decoder%20%28read%20the%20story%2C%20name%20the%20pattern%29.html" target="_blank" rel="noopener noreferrer">Decoder</a> · <a href="./8%20-%20Pattern%20Radar%20%28name%20the%20pattern%29.html" target="_blank" rel="noopener noreferrer">Pattern Radar</a> · <a href="./2%20-%20Stdin%20Trainer%20%28drill%29.html" target="_blank" rel="noopener noreferrer">Stdin Trainer</a> · <a href="./3%20-%20Stdin%20Survival%20Kit%20%28manual%29.html" target="_blank" rel="noopener noreferrer">Stdin Survival Kit</a> · <a href="./5%20-%20SQL%20Lab%20%28practice%29.html" target="_blank" rel="noopener noreferrer">SQL Lab</a> · <a href="./6%20-%20CS%20Core%20Drill%20%28OS%20DBMS%20CN%20OOP%20C%29.html" target="_blank" rel="noopener noreferrer">CS Core Drill</a> · <a href="./7%20-%20Aptitude%20Sprint%20%28formulas%20%2B%20practice%29.html" target="_blank" rel="noopener noreferrer">Aptitude Sprint</a>';
    f.appendChild(tools);
    var row = el("div", "row2");
    var cp = el("button", "redo", "copy progress as JSON"); cp.type = "button";
    cp.addEventListener("click", function () {
      var txt = JSON.stringify(state);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          cp.textContent = "copied"; setTimeout(function () { cp.textContent = "copy progress as JSON"; }, 1600);
        });
      }
    });
    row.appendChild(cp);
    f.appendChild(row);
    return f;
  }

  function seedOpen() {
    ui.open = new Set();
    var first = null;
    BLOCKS.forEach(function (b) {
      var s = blockStats(b);
      if (s.done > 0 && s.done < s.total) ui.open.add(b.id);
      if (first === null && s.done < s.total) first = b.id;
    });
    if (first) ui.open.add(first);
    if (!ui.open.size && BLOCKS.length) ui.open.add(BLOCKS[0].id);
  }

  function render() {
    var y = window.scrollY;
    var active = document.activeElement;
    var fk = active && active.getAttribute ? active.getAttribute("data-fk") : null;
    var caret = (active && active.tagName === "INPUT" && active.selectionStart != null) ? active.selectionStart : null;

    app.textContent = "";
    app.appendChild(masthead());
    app.appendChild(todayStrip());
    app.appendChild(verdictBox());
    app.appendChild(findings());
    app.appendChild(tracksSection());
    app.appendChild(refsSection());
    app.appendChild(footerNode());

    paintClock();
    window.scrollTo(0, y);
    if (fk) {
      var back = document.querySelector('[data-fk="' + fk + '"]');
      if (back) {
        back.focus();
        if (caret != null && back.setSelectionRange) { try { back.setSelectionRange(caret, caret); } catch (e) {} }
      }
    }
  }

  seedOpen();
  setTimer(25);
  render();
  if (state === localCopy) markSaved("local", "restored from this device");

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) {
      if (!api) return;
      artifactApi = api;
      markSaved("ok", "progress saves automatically");
    }).catch(function () {});
  }
})();
</script>

</body></html>
