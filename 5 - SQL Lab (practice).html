e is SQLite; PostgreSQL uses EXTRACT(YEAR FROM hire_date)","run":true},{"k":"code","lang":"my","code":"WITH y AS (SELECT YEAR(hire_date) AS yr, COUNT(*) AS hires FROM employees GROUP BY YEAR(hire_date))\nSELECT yr, hires, hires - LAG(hires) OVER (ORDER BY yr) AS diff_from_prev FROM y ORDER BY yr;","cap":"MySQL 8+: YEAR()","run":false},{"k":"h","t":"24. Projects nobody is assigned to / employees on several projects"},{"k":"code","lang":"sql","code":"SELECT p.name FROM projects p WHERE NOT EXISTS (SELECT 1 FROM assignments a WHERE a.project_id = p.id);\nSELECT e.name, COUNT(*) AS projects FROM employees e JOIN assignments a ON a.emp_id = e.id GROUP BY e.id, e.name HAVING COUNT(*) > 1;","cap":"no idle project; Rohan is on 2","run":true},{"k":"h","t":"Swap values with CASE (a classic)"},{"k":"code","lang":"sql","code":"CREATE TABLE seat (id INTEGER, student TEXT);\nINSERT INTO seat VALUES (1,'A'),(2,'B'),(3,'C'),(4,'D'),(5,'E');\nSELECT CASE WHEN id % 2 = 1 AND id < (SELECT MAX(id) FROM seat) THEN id + 1\n            WHEN id % 2 = 0 THEN id - 1 ELSE id END AS id, student\nFROM seat ORDER BY 1;","cap":"swap adjacent seats; the last odd one stays","run":true},{"k":"ask","t":"For streak and island problems say the trick: 'row number minus the value is constant inside a run.' For nth-per-group say: 'rank inside the partition, filter outside.'"}],"test":[{"q":"The 'date minus row_number' trick finds:","o":["Consecutive runs (gaps and islands)","Medians","Hierarchies","Duplicates"],"a":0,"w":"Within a run both advance by 1, so the difference is constant."},{"q":"LAST_VALUE(x) OVER (ORDER BY y) without a frame returns:","o":["NULL","An error","The current row's value (default frame ends at current row)","The last row of the partition"],"a":2,"w":"Specify ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING."},{"q":"Pivoting rows to columns without PIVOT uses:","o":["UNION","SUM(CASE WHEN ...) per column","LIMIT","JOIN"],"a":1,"w":"Conditional aggregation."},{"q":"Median of an even number of rows is:","o":["The mode","The lower middle","The average of the two middle values","The mean of all"],"a":2,"w":"That is why the query averages rows (cnt+1)/2 and (cnt+2)/2."},{"q":"Walking a hierarchy of unknown depth needs:","o":["A self join per level","A recursive CTE","GROUP BY","DISTINCT"],"a":1,"w":"A recursive CTE handles any depth."}],"star":true,"kw":"interview classic running total consecutive streak gaps islands pivot median missing numbers cumulative recursive hierarchy swap","mins":45},{"id":"transactions-sql","group":"G. Programmability, transactions and security","title":"Transactions in SQL: BEGIN, COMMIT, SAVEPOINT, locking reads","intro":"The commands behind ACID. The standard demo is a money transfer.","blocks":[{"k":"table","head":["Task","PostgreSQL","MySQL (InnoDB)"],"rows":[["Start","BEGIN;  or START TRANSACTION;","START TRANSACTION;  or BEGIN;"],["Make permanent","COMMIT;","COMMIT;"],["Undo","ROLLBACK;","ROLLBACK;"],["Partial undo","SAVEPOINT sp; ... ROLLBACK TO sp; RELEASE sp;","same"],["Autocommit","Each statement commits itself unless inside BEGIN (psql, and drivers per setting)","SET autocommit = 0 disables it; default ON"],["Isolation level","BEGIN ISOLATION LEVEL REPEATABLE READ;  or SET TRANSACTION ISOLATION LEVEL ...","SET SESSION TRANSACTION ISOLATION LEVEL REPEATABLE READ;"],["DDL inside","Transactional: CREATE/ALTER/DROP can be rolled back","Implicit commit: DDL ends the transaction"],["Error inside","Whole transaction becomes aborted: every command fails until ROLLBACK","Only the failing statement is rolled back (by default)"]]},{"k":"code","lang":"sql","code":"CREATE TABLE acct (id INTEGER PRIMARY KEY, owner TEXT, balance INTEGER CHECK (balance >= 0));\nINSERT INTO acct VALUES (1,'Asha',1000),(2,'Rohan',200);\n\nBEGIN;\nUPDATE acct SET balance = balance - 300 WHERE id = 1;\nSAVEPOINT after_debit;\nUPDATE acct SET balance = balance + 300 WHERE id = 99;          -- wrong account: affects 0 rows\nROLLBACK TO after_debit;                                        -- undo only the bad step\nUPDATE acct SET balance = balance + 300 WHERE id = 2;\nCOMMIT;\nSELECT * FROM acct;","cap":"debit and credit in one unit; savepoint undoes just the mistake","run":true},{"k":"code","lang":"sql","code":"BEGIN;\nUPDATE employees SET salary = 0;\nSELECT COUNT(*) AS zero_paid FROM employees WHERE salary = 0;\nROLLBACK;\nSELECT COUNT(*) AS zero_paid_after_rollback FROM employees WHERE salary = 0;","cap":"rollback restores everything","run":true},{"k":"h","t":"Locking reads"},{"k":"code","lang":"pg","code":"BEGIN;\nSELECT balance FROM account WHERE account_no = 100001 FOR UPDATE;          -- blocks other writers/lockers on this row\nUPDATE account SET balance = balance - 500 WHERE account_no = 100001;\nCOMMIT;\n\nSELECT ... FOR SHARE;                       -- others may read-lock but not modify\nSELECT ... FOR UPDATE NOWAIT;               -- error at once instead of waiting\nSELECT ... FOR UPDATE SKIP LOCKED;          -- skip rows locked by others (job queues)\nLOCK TABLE account IN EXCLUSIVE MODE;       -- explicit table lock","cap":null,"run":false},{"k":"code","lang":"my","code":"START TRANSACTION;\nSELECT balance FROM account WHERE account_no = 100001 FOR UPDATE;\nUPDATE account SET balance = balance - 500 WHERE account_no = 100001;\nCOMMIT;\n-- 8.0 adds: FOR UPDATE NOWAIT / SKIP LOCKED, and FOR SHARE (older: LOCK IN SHARE MODE)","cap":null,"run":false},{"k":"h","t":"Lost update, step by step"},{"k":"code","lang":"txt","code":"Balance = 100. Two sessions each add 10.\n\n T1: SELECT balance      -> 100\n T2: SELECT balance      -> 100\n T1: UPDATE balance = 110 ; COMMIT\n T2: UPDATE balance = 110 ; COMMIT          <- T1's +10 is lost\n\nFixes: (1) atomic UPDATE acct SET balance = balance + 10\n       (2) SELECT ... FOR UPDATE before reading\n       (3) SERIALIZABLE isolation and retry on failure\n       (4) optimistic check:  UPDATE ... WHERE id = ? AND version = ?","cap":null,"run":false},{"k":"h","t":"Deadlock demo and avoidance"},{"k":"code","lang":"txt","code":"T1: UPDATE acct SET ... WHERE id = 1;   T2: UPDATE acct SET ... WHERE id = 2;\nT1: UPDATE acct SET ... WHERE id = 2;   (waits for T2)\nT2: UPDATE acct SET ... WHERE id = 1;   (waits for T1)  -> deadlock, DB aborts one with an error\n\nAvoid: always touch rows in the same order (for a transfer, lock the lower account id first),\nkeep transactions short, retry the aborted transaction.","cap":null,"run":false},{"k":"h","t":"Good habits"},{"k":"ul","t":["Keep transactions short; never hold one open while waiting for a user.","Do not mix slow external calls (HTTP, email) inside a transaction.","Retry on serialization failures (SQLSTATE 40001) and deadlocks (40P01 in PostgreSQL, 1213 in MySQL).","Use constraints (CHECK balance >= 0) as the last line of defence.","A single statement is already atomic; use that where possible (UPDATE ... SET x = x + 1)."]},{"k":"ask","t":"\"Explain a bank transfer in SQL.\" BEGIN, debit, credit, COMMIT; if anything fails, ROLLBACK. Add FOR UPDATE or an atomic UPDATE with a balance check, consistent lock ordering and a retry loop."}],"test":[{"q":"In PostgreSQL, after an error inside a transaction block:","o":["All further commands fail until ROLLBACK","The transaction commits","The session closes","Only that statement fails"],"a":0,"w":"The transaction is marked aborted ('current transaction is aborted')."},{"q":"DDL inside a MySQL transaction:","o":["Causes an implicit commit","Is forbidden","Is deferred","Is rolled back with it"],"a":0,"w":"DDL statements commit implicitly in MySQL; PostgreSQL DDL is transactional."},{"q":"SAVEPOINT allows:","o":["Committing part of a transaction","Faster commits","Nested databases","Rolling back to a point without ending the transaction"],"a":3,"w":"ROLLBACK TO savepoint undoes later work only."},{"q":"Which prevents the lost update without changing isolation level?","o":["SELECT DISTINCT","SELECT ... FOR UPDATE","ORDER BY","LIMIT 1"],"a":1,"w":"It locks the row until the transaction ends."},{"q":"SKIP LOCKED is mainly used for:","o":["Work queues where workers take unlocked rows","Indexes","Reports","Backups"],"a":0,"w":"Each worker grabs a different available row."}],"star":true,"kw":"transaction begin commit rollback savepoint autocommit for update skip locked nowait deadlock lost update isolation","mins":25},{"id":"triggers-basics","group":"G. Programmability, transactions and security","title":"Triggers: what they are, timing, row vs statement, OLD and NEW","intro":"A trigger is code the database runs automatically when an INSERT, UPDATE or DELETE happens on a table. Triggers are a standard interview topic: definition, types, syntax, an example, and when NOT to use them.","blocks":[{"k":"h","t":"Definition and use cases"},{"k":"p","t":"A **trigger** is a stored block of code bound to a table (or view) event. The database fires it automatically; the application never calls it."},{"k":"ul","t":["Audit logging (who changed what).","Enforcing complex business rules that CHECK cannot express (rules across rows or tables).","Maintaining derived or denormalized data (running totals, counters, search columns).","Setting values automatically (updated_at, normalising text).","Cascading custom actions, soft delete, history tables.","Making a view updatable (INSTEAD OF triggers)."]},{"k":"h","t":"Classification"},{"k":"table","head":["Dimension","Options","Meaning"],"rows":[["Timing","BEFORE","Runs before the change is applied; can modify NEW values or cancel the operation. Use for validation and defaults"],["","AFTER","Runs after the change; the row is already written. Use for audit, cascading to other tables"],["","INSTEAD OF","Replaces the operation; used on views (PostgreSQL, SQL Server, Oracle). MySQL has none"],["Event","INSERT, UPDATE [OF cols], DELETE, TRUNCATE (PostgreSQL)","What fires it"],["Level","FOR EACH ROW","Once per affected row; can see OLD / NEW"],["","FOR EACH STATEMENT","Once per statement regardless of rows. PostgreSQL supports it; MySQL only has row-level"]]},{"k":"table","head":["Event","OLD","NEW"],"rows":[["INSERT","not available","the row being inserted"],["UPDATE","the row before","the row after"],["DELETE","the row being deleted","not available"]]},{"k":"p","t":"That gives the familiar count: 3 events × 2 timings × 2 levels = 12 types in the textbook."},{"k":"h","t":"Runnable example: an audit trigger (SQLite syntax)"},{"k":"code","lang":"sql","code":"CREATE TABLE salary_audit (\n  audit_id   INTEGER PRIMARY KEY AUTOINCREMENT,\n  emp_id     INTEGER, old_salary INTEGER, new_salary INTEGER,\n  changed_at TEXT DEFAULT CURRENT_TIMESTAMP\n);\nCREATE TRIGGER trg_salary_audit\nAFTER UPDATE OF salary ON employees\nFOR EACH ROW\nWHEN OLD.salary <> NEW.salary\nBEGIN\n  INSERT INTO salary_audit (emp_id, old_salary, new_salary) VALUES (OLD.id, OLD.salary, NEW.salary);\nEND;\n\nUPDATE employees SET salary = salary + 2000 WHERE dept_id = 3;     -- fires once per row changed (3 rows)\nUPDATE employees SET salary = salary WHERE id = 1;                   -- no real change: WHEN stops it\nSELECT emp_id, old_salary, new_salary FROM salary_audit ORDER BY audit_id;","cap":"AFTER UPDATE trigger, row level, with WHEN","run":true},{"k":"code","lang":"my","code":"CREATE TABLE salary_audit (\n  audit_id   INT AUTO_INCREMENT PRIMARY KEY,\n  emp_id     INT, old_salary INT, new_salary INT,\n  changed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\nDELIMITER $$\nCREATE TRIGGER trg_salary_audit AFTER UPDATE ON employees\nFOR EACH ROW\nBEGIN\n  IF OLD.salary <> NEW.salary THEN           -- MySQL has no WHEN clause: test inside the body\n    INSERT INTO salary_audit (emp_id, old_salary, new_salary) VALUES (OLD.id, OLD.salary, NEW.salary);\n  END IF;\nEND$$\nDELIMITER ;","cap":"MySQL: no WHEN, DELIMITER, IF ... END IF","run":false},{"k":"h","t":"Runnable example: a BEFORE trigger that validates"},{"k":"code","lang":"sql","code":"CREATE TRIGGER trg_salary_floor\nBEFORE INSERT ON employees\nFOR EACH ROW\nWHEN NEW.salary < 20000\nBEGIN\n  SELECT RAISE(ABORT, 'salary below minimum wage');\nEND;\n-- INSERT INTO employees (id, name, salary) VALUES (99, 'Test', 10000);   -- fails with: salary below minimum wage\nINSERT INTO employees (id, name, salary) VALUES (99, 'Test', 30000);        -- allowed\nSELECT COUNT(*) AS rows_now FROM employees;","cap":"BEFORE trigger cancels bad rows","run":true},{"k":"h","t":"PostgreSQL syntax: function + trigger"},{"k":"p","t":"In PostgreSQL the logic lives in a trigger FUNCTION (returns trigger) and CREATE TRIGGER just attaches it. One function can serve many triggers."},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_salary_audit() RETURNS trigger\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF NEW.salary IS DISTINCT FROM OLD.salary THEN\n    INSERT INTO salary_audit (emp_id, old_salary, new_salary, changed_at)\n    VALUES (OLD.id, OLD.salary, NEW.salary, now());\n  END IF;\n  RETURN NEW;                 -- AFTER triggers ignore the value; BEFORE row triggers must return NEW (or OLD for DELETE) or NULL to skip the row\nEND;\n$$;\n\nCREATE TRIGGER trg_salary_audit\nAFTER UPDATE OF salary ON employees\nFOR EACH ROW\nWHEN (OLD.salary IS DISTINCT FROM NEW.salary)\nEXECUTE FUNCTION fn_salary_audit();              -- PostgreSQL 11+; older: EXECUTE PROCEDURE","cap":null,"run":false},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_salary_floor() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF NEW.salary < 20000 THEN\n    RAISE EXCEPTION 'salary % is below minimum', NEW.salary USING ERRCODE = 'check_violation';\n  END IF;\n  RETURN NEW;\nEND; $$;\n\nCREATE TRIGGER trg_salary_floor BEFORE INSERT OR UPDATE ON employees\nFOR EACH ROW EXECUTE FUNCTION fn_salary_floor();","cap":null,"run":false},{"k":"table","head":["Special variable (PostgreSQL)","Value"],"rows":[["NEW / OLD","Row after / before"],["TG_OP","'INSERT', 'UPDATE', 'DELETE', 'TRUNCATE'"],["TG_TABLE_NAME, TG_TABLE_SCHEMA","Table the trigger is on"],["TG_WHEN, TG_LEVEL","'BEFORE'/'AFTER'/'INSTEAD OF', 'ROW'/'STATEMENT'"],["TG_ARGV[n]","Arguments passed in CREATE TRIGGER"]]},{"k":"h","t":"MySQL syntax: body written inline"},{"k":"code","lang":"my","code":"DELIMITER $$\nCREATE TRIGGER trg_salary_audit\nAFTER UPDATE ON employees\nFOR EACH ROW\nBEGIN\n  IF NEW.salary <> OLD.salary THEN\n    INSERT INTO salary_audit (emp_id, old_salary, new_salary) VALUES (OLD.id, OLD.salary, NEW.salary);\n  END IF;\nEND$$\n\nCREATE TRIGGER trg_salary_floor\nBEFORE INSERT ON employees\nFOR EACH ROW\nBEGIN\n  IF NEW.salary < 20000 THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'salary below minimum';\n  END IF;\nEND$$\nDELIMITER ;","cap":null,"run":false},{"k":"my","t":"DELIMITER is a client-side command of the mysql shell (not SQL). It lets the shell treat the semicolons inside the BEGIN...END body as part of one statement. Drivers and GUI tools do not need it."},{"k":"h","t":"PostgreSQL vs MySQL vs SQLite at a glance"},{"k":"table","head":["Feature","PostgreSQL","MySQL","SQLite"],"rows":[["Body location","Separate trigger function","Inline BEGIN...END","Inline BEGIN...END"],["Row-level","Yes","Yes (only)","Yes (only)"],["Statement-level","Yes (with transition tables REFERENCING NEW TABLE)","No","No"],["INSTEAD OF","Yes (views)","No","Yes (views)"],["TRUNCATE trigger","Yes","No","No"],["Raise an error","RAISE EXCEPTION","SIGNAL SQLSTATE","RAISE(ABORT, msg)"],["Conditional firing","WHEN (condition) on the trigger","IF inside the body","WHEN on the trigger"],["Fired by FK cascade actions","Yes","No (InnoDB cascades do not fire triggers)","Yes"],["Order of several triggers","Alphabetical by name","Creation order, or FOLLOWS / PRECEDES","Undefined"],["Drop","DROP TRIGGER name ON table;","DROP TRIGGER name;","DROP TRIGGER name;"],["Disable","ALTER TABLE t DISABLE TRIGGER name;","no switch (drop it)","no switch"]]},{"k":"h","t":"When NOT to use triggers"},{"k":"ul","t":["Rules that a CHECK, UNIQUE, FK or generated column can express: use the constraint (clearer, faster, visible).","Heavy logic or calls to external services: triggers run inside the writer's transaction and slow every write.","Chains of triggers that fire other triggers: hard to debug (and recursion risk).","Business logic that the team should see in application code: triggers are invisible side effects.","Bulk loads: they fire per row; disable or load differently."]},{"k":"trap","t":"A BEFORE UPDATE trigger that itself UPDATEs the same table can recurse forever. Modify NEW instead of running another UPDATE, or guard with pg_trigger_depth() / WHEN."},{"k":"ask","t":"\"What is a trigger? Types? Example?\" Answer in this order: definition (automatic code on INSERT/UPDATE/DELETE), BEFORE vs AFTER vs INSTEAD OF, row vs statement level, OLD/NEW, then give the audit-log example, then the drawbacks."}],"test":[{"q":"Which trigger can change the values being inserted before they are stored?","o":["AFTER INSERT","INSTEAD OF DELETE","BEFORE INSERT","AFTER DELETE"],"a":2,"w":"BEFORE row triggers may modify NEW."},{"q":"In a DELETE trigger which row reference is available?","o":["Neither","OLD only","Both","NEW only"],"a":1,"w":"There is no new row after a delete."},{"q":"Which database does NOT support statement-level triggers?","o":["Oracle","MySQL","PostgreSQL","SQL Server"],"a":1,"w":"MySQL triggers are FOR EACH ROW only."},{"q":"In PostgreSQL a trigger's logic is placed in:","o":["A function that returns trigger","A procedure called by the app","The CREATE TRIGGER body","A view"],"a":0,"w":"CREATE TRIGGER merely attaches the trigger function."},{"q":"INSTEAD OF triggers are used to:","o":["Enforce NOT NULL","Make complex views accept writes","Replace indexes","Speed up inserts"],"a":1,"w":"They intercept the write to the view and redirect it to base tables."},{"q":"Which is a good reason NOT to use a trigger?","o":["Complex cross-table validation","Rule is expressible as a CHECK constraint","Maintaining updated_at","Audit logging"],"a":1,"w":"Use the declarative constraint when possible."}],"star":true,"kw":"trigger before after instead of row statement old new audit plpgsql create trigger raise exception signal delimiter","mins":35},{"id":"triggers-patterns","group":"G. Programmability, transactions and security","title":"Trigger patterns interviewers ask you to write","intro":"Six scenarios you can write from memory. Each is shown in PostgreSQL and MySQL.","blocks":[{"k":"h","t":"1. Automatic updated_at timestamp"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION set_updated_at() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  NEW.updated_at := now();\n  RETURN NEW;\nEND; $$;\n\nCREATE TRIGGER trg_employee_updated BEFORE UPDATE ON employees\nFOR EACH ROW EXECUTE FUNCTION set_updated_at();","cap":null,"run":false},{"k":"code","lang":"my","code":"-- simplest in MySQL needs no trigger at all:\nupdated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP","cap":null,"run":false},{"k":"h","t":"2. Full audit log (who, what, when) for any table"},{"k":"code","lang":"pg","code":"CREATE TABLE audit_log (\n  audit_id   BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  table_name TEXT NOT NULL, op TEXT NOT NULL,\n  row_before JSONB, row_after JSONB,\n  changed_by TEXT NOT NULL DEFAULT current_user,\n  changed_at TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n\nCREATE OR REPLACE FUNCTION fn_audit() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  INSERT INTO audit_log (table_name, op, row_before, row_after)\n  VALUES (TG_TABLE_NAME, TG_OP,\n          CASE WHEN TG_OP IN ('UPDATE','DELETE') THEN to_jsonb(OLD) END,\n          CASE WHEN TG_OP IN ('INSERT','UPDATE') THEN to_jsonb(NEW) END);\n  RETURN NULL;                              -- AFTER trigger: return value is ignored\nEND; $$;\n\nCREATE TRIGGER trg_audit_employees AFTER INSERT OR UPDATE OR DELETE ON employees\nFOR EACH ROW EXECUTE FUNCTION fn_audit();","cap":null,"run":false},{"k":"code","lang":"my","code":"CREATE TRIGGER trg_emp_audit_upd AFTER UPDATE ON employees FOR EACH ROW\nINSERT INTO audit_log (table_name, op, row_before, row_after, changed_by)\nVALUES ('employees', 'UPDATE', JSON_OBJECT('id', OLD.id, 'salary', OLD.salary), JSON_OBJECT('id', NEW.id, 'salary', NEW.salary), CURRENT_USER());\n-- MySQL needs one trigger per event (INSERT / UPDATE / DELETE)","cap":null,"run":false},{"k":"h","t":"3. Keep stock in sync when an order line is added"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_reduce_stock() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  UPDATE product SET stock = stock - NEW.quantity WHERE product_id = NEW.product_id;   -- CHECK (stock >= 0) rejects overselling\n  RETURN NULL;\nEND; $$;\nCREATE TRIGGER trg_order_item_stock AFTER INSERT ON order_item FOR EACH ROW EXECUTE FUNCTION fn_reduce_stock();","cap":null,"run":false},{"k":"code","lang":"my","code":"DELIMITER $$\nCREATE TRIGGER trg_order_item_stock AFTER INSERT ON order_item FOR EACH ROW\nBEGIN\n  UPDATE product SET stock = stock - NEW.quantity WHERE product_id = NEW.product_id;\nEND$$\nDELIMITER ;","cap":null,"run":false},{"k":"h","t":"4. Enforce a rule across rows: max 5 open loans"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_max_open_loans() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF (SELECT COUNT(*) FROM loan WHERE member_id = NEW.member_id AND returned_on IS NULL) >= 5 THEN\n    RAISE EXCEPTION 'member % already has 5 open loans', NEW.member_id;\n  END IF;\n  RETURN NEW;\nEND; $$;\nCREATE TRIGGER trg_max_open_loans BEFORE INSERT ON loan FOR EACH ROW EXECUTE FUNCTION fn_max_open_loans();","cap":null,"run":false},{"k":"code","lang":"my","code":"DELIMITER $$\nCREATE TRIGGER trg_max_open_loans BEFORE INSERT ON loan FOR EACH ROW\nBEGIN\n  IF (SELECT COUNT(*) FROM loan WHERE member_id = NEW.member_id AND returned_on IS NULL) >= 5 THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'member already has 5 open loans';\n  END IF;\nEND$$\nDELIMITER ;","cap":null,"run":false},{"k":"note","t":"This rule is racy: two concurrent inserts can both see 4 loans. Lock the member row first (SELECT ... FOR UPDATE on member) or use SERIALIZABLE isolation. A good answer mentions this."},{"k":"h","t":"5. Soft delete: turn DELETE into an update"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_soft_delete() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  UPDATE employees SET deleted_at = now() WHERE id = OLD.id;\n  RETURN NULL;                    -- cancel the physical delete\nEND; $$;\nCREATE TRIGGER trg_soft_delete BEFORE DELETE ON employees FOR EACH ROW EXECUTE FUNCTION fn_soft_delete();","cap":null,"run":false},{"k":"h","t":"6. Writable view with INSTEAD OF"},{"k":"code","lang":"pg","code":"CREATE VIEW emp_directory AS SELECT e.id, e.name, d.name AS dept FROM employees e JOIN departments d ON d.id = e.dept_id;\n\nCREATE OR REPLACE FUNCTION fn_emp_directory_insert() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  INSERT INTO employees (name, dept_id) VALUES (NEW.name, (SELECT id FROM departments WHERE name = NEW.dept));\n  RETURN NEW;\nEND; $$;\nCREATE TRIGGER trg_emp_directory_ins INSTEAD OF INSERT ON emp_directory FOR EACH ROW EXECUTE FUNCTION fn_emp_directory_insert();","cap":null,"run":false},{"k":"h","t":"Runnable: history table with SQLite triggers"},{"k":"code","lang":"sql","code":"CREATE TABLE emp_history (emp_id INTEGER, name TEXT, deleted_at TEXT DEFAULT CURRENT_TIMESTAMP);\nCREATE TRIGGER trg_emp_deleted AFTER DELETE ON employees\nFOR EACH ROW\nBEGIN\n  INSERT INTO emp_history (emp_id, name) VALUES (OLD.id, OLD.name);\nEND;\nDELETE FROM employees WHERE id = 9;\nSELECT emp_id, name FROM emp_history;","cap":"archive deleted rows","run":true},{"k":"h","t":"Statement-level trigger with transition tables (PostgreSQL)"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION fn_log_bulk() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  INSERT INTO bulk_log (table_name, rows_affected) SELECT TG_TABLE_NAME, COUNT(*) FROM new_rows;\n  RETURN NULL;\nEND; $$;\nCREATE TRIGGER trg_bulk AFTER INSERT ON employees REFERENCING NEW TABLE AS new_rows\nFOR EACH STATEMENT EXECUTE FUNCTION fn_log_bulk();","cap":null,"run":false},{"k":"h","t":"Managing triggers"},{"k":"code","lang":"pg","code":"SELECT tgname, tgenabled FROM pg_trigger WHERE tgrelid = 'employees'::regclass AND NOT tgisinternal;\nALTER TABLE employees DISABLE TRIGGER trg_audit_employees;\nALTER TABLE employees ENABLE TRIGGER ALL;\nDROP TRIGGER trg_audit_employees ON employees;","cap":null,"run":false},{"k":"code","lang":"my","code":"SHOW TRIGGERS LIKE 'employees';\nDROP TRIGGER IF EXISTS trg_emp_audit_upd;","cap":null,"run":false},{"k":"ask","t":"\"Write a trigger that logs salary changes.\" Know pattern 2 cold. Mention OLD vs NEW, that AFTER is right for logging, the row-level FOR EACH ROW, and the performance cost on bulk updates."}],"test":[{"q":"Best timing for a trigger that logs changes to an audit table:","o":["AFTER (the change succeeded)","Neither","BEFORE (to block the change)","INSTEAD OF"],"a":0,"w":"Log only after the change is applied."},{"q":"A PostgreSQL BEFORE row trigger returning NULL:","o":["Commits the row","Raises an error","Skips the operation for that row","Rolls back the transaction"],"a":2,"w":"Returning NULL cancels the row-level operation silently."},{"q":"In MySQL the standard way to reject a row from a trigger is:","o":["THROW","ROLLBACK","RAISE EXCEPTION","SIGNAL SQLSTATE '45000'"],"a":3,"w":"SIGNAL raises a user-defined error. RAISE EXCEPTION is PostgreSQL."},{"q":"The 'max 5 open loans' trigger can still be violated because:","o":["MySQL ignores triggers","COUNT is slow","Concurrent transactions may both count 4","Triggers are optional"],"a":2,"w":"Two sessions read before either writes, a race that needs locking or SERIALIZABLE."},{"q":"Automatic updated_at in MySQL needs no trigger because of:","o":["A view","An index","ON UPDATE CURRENT_TIMESTAMP on the column","A sequence"],"a":2,"w":"The column definition does it declaratively."}],"star":true,"kw":"trigger patterns audit updated_at soft delete instead of view stock max loans history statement-level transition tables","mins":35},{"id":"procs-functions","group":"G. Programmability, transactions and security","title":"Stored functions and procedures (PostgreSQL PL/pgSQL, MySQL)","intro":"Reusable server-side code. Interviews ask for function vs procedure, parameters, control flow, error handling and one small example.","blocks":[{"k":"h","t":"Function vs procedure"},{"k":"table","head":["","Function","Procedure"],"rows":[["Returns","A value (scalar, row, or table)","Nothing (OUT / INOUT parameters instead)"],["Called with","SELECT fn(...)  or inside expressions","CALL proc(...)"],["Use inside a query","Yes","No"],["Transaction control (COMMIT / ROLLBACK)","No","PostgreSQL 11+: yes (when not already inside a transaction block). MySQL: yes"],["Typical use","Computations, lookups, trigger bodies","Multi-step workflows, batch jobs, transfers"]]},{"k":"h","t":"PostgreSQL: scalar function"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION annual_bonus(p_salary NUMERIC, p_years INT)\nRETURNS NUMERIC\nLANGUAGE plpgsql IMMUTABLE AS $$\nDECLARE\n  pct NUMERIC;\nBEGIN\n  pct := CASE WHEN p_years >= 5 THEN 0.15\n              WHEN p_years >= 2 THEN 0.10\n              ELSE 0.05 END;\n  RETURN ROUND(p_salary * pct, 2);\nEND;\n$$;\n\nSELECT name, annual_bonus(salary, 3) AS bonus FROM employees;","cap":null,"run":false},{"k":"code","lang":"pg","code":"-- table-returning function in plain SQL\nCREATE FUNCTION dept_employees(p_dept INT)\nRETURNS TABLE (emp_id INT, emp_name TEXT, salary INT)\nLANGUAGE sql STABLE AS $$\n  SELECT id, name, salary FROM employees WHERE dept_id = p_dept ORDER BY salary DESC\n$$;\nSELECT * FROM dept_employees(2);","cap":null,"run":false},{"k":"code","lang":"pg","code":"-- OUT parameters and RETURN QUERY\nCREATE FUNCTION salary_stats(p_dept INT, OUT lowest INT, OUT highest INT, OUT average NUMERIC)\nLANGUAGE sql AS $$ SELECT MIN(salary), MAX(salary), AVG(salary) FROM employees WHERE dept_id = p_dept $$;\nSELECT * FROM salary_stats(2);","cap":null,"run":false},{"k":"h","t":"PostgreSQL: procedure"},{"k":"code","lang":"pg","code":"CREATE OR REPLACE PROCEDURE transfer(p_from BIGINT, p_to BIGINT, p_amount NUMERIC)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF p_amount <= 0 THEN\n    RAISE EXCEPTION 'amount must be positive';\n  END IF;\n  UPDATE account SET balance = balance - p_amount WHERE account_no = p_from;\n  IF NOT FOUND THEN RAISE EXCEPTION 'source account % does not exist', p_from; END IF;\n  UPDATE account SET balance = balance + p_amount WHERE account_no = p_to;\n  IF NOT FOUND THEN RAISE EXCEPTION 'target account % does not exist', p_to; END IF;\nEND;\n$$;\n\nCALL transfer(100001, 100002, 500);       -- an exception rolls back both updates","cap":null,"run":false},{"k":"h","t":"PL/pgSQL building blocks"},{"k":"code","lang":"pg","code":"DO $$                                      -- anonymous block\nDECLARE\n  v_count INT;\n  r RECORD;\nBEGIN\n  SELECT COUNT(*) INTO v_count FROM employees;                   -- query into variable\n  IF v_count > 100 THEN RAISE NOTICE 'big'; ELSIF v_count > 10 THEN RAISE NOTICE 'medium'; ELSE RAISE NOTICE 'small'; END IF;\n\n  FOR r IN SELECT id, name FROM employees WHERE dept_id = 2 LOOP          -- loop over a query\n    RAISE NOTICE '% %', r.id, r.name;\n  END LOOP;\n\n  FOR i IN 1..3 LOOP RAISE NOTICE 'i=%', i; END LOOP;                     -- counted loop\n  WHILE v_count > 0 LOOP v_count := v_count - 5; END LOOP;               -- while loop\n  CASE WHEN v_count < 0 THEN RAISE NOTICE 'negative'; ELSE NULL; END CASE;\nEXCEPTION\n  WHEN unique_violation THEN RAISE NOTICE 'duplicate key';\n  WHEN division_by_zero THEN RAISE NOTICE 'divide by zero';\n  WHEN OTHERS THEN RAISE NOTICE 'error: %', SQLERRM;\nEND $$;","cap":null,"run":false},{"k":"ul","t":["Variables: DECLARE name type; assign with := or SELECT ... INTO.","FOUND is set by the last statement; GET DIAGNOSTICS n = ROW_COUNT.","RAISE NOTICE / WARNING / EXCEPTION for messages and errors.","Volatility markers: IMMUTABLE (same input, same output), STABLE (consistent within a statement), VOLATILE (default). Let the planner optimize.","SECURITY DEFINER runs with the owner's privileges (set search_path!)."]},{"k":"h","t":"MySQL: function and procedure"},{"k":"code","lang":"my","code":"DELIMITER $$\nCREATE FUNCTION annual_bonus(p_salary DECIMAL(12,2), p_years INT)\nRETURNS DECIMAL(12,2) DETERMINISTIC\nBEGIN\n  DECLARE pct DECIMAL(4,2);\n  IF p_years >= 5 THEN SET pct = 0.15;\n  ELSEIF p_years >= 2 THEN SET pct = 0.10;\n  ELSE SET pct = 0.05;\n  END IF;\n  RETURN ROUND(p_salary * pct, 2);\nEND$$\n\nCREATE PROCEDURE raise_dept_salary(IN p_dept INT, IN p_pct DECIMAL(5,2), OUT p_rows INT)\nBEGIN\n  DECLARE EXIT HANDLER FOR SQLEXCEPTION\n  BEGIN\n    ROLLBACK;\n    RESIGNAL;\n  END;\n  START TRANSACTION;\n  UPDATE employees SET salary = salary * (1 + p_pct / 100) WHERE dept_id = p_dept;\n  SET p_rows = ROW_COUNT();\n  COMMIT;\nEND$$\nDELIMITER ;\n\nCALL raise_dept_salary(2, 5, @n);\nSELECT @n;                       -- rows affected\nSELECT name, annual_bonus(salary, 3) FROM employees;","cap":null,"run":false},{"k":"table","head":["Parameter modes","Meaning"],"rows":[["IN","Value passed in (default)"],["OUT","Value returned to the caller"],["INOUT","Passed in, modified, passed back"]]},{"k":"h","t":"Error handling compared"},{"k":"table","head":["","PostgreSQL","MySQL"],"rows":[["Catch","BEGIN ... EXCEPTION WHEN condition THEN ... END","DECLARE {EXIT | CONTINUE} HANDLER FOR SQLEXCEPTION | SQLSTATE '23000' | NOT FOUND"],["Raise","RAISE EXCEPTION 'msg %', val","SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'msg'"],["Re-raise","RAISE;","RESIGNAL;"],["Error text / code","SQLERRM, SQLSTATE","GET DIAGNOSTICS CONDITION 1 ... MESSAGE_TEXT"]]},{"k":"pg","t":"A PostgreSQL EXCEPTION block opens a subtransaction (a savepoint), so it has a cost; do not wrap tight loops needlessly."},{"k":"h","t":"Pros and cons"},{"k":"ul","t":["**Pros:** fewer round trips, logic near the data, reuse, permission boundary (GRANT EXECUTE only), precompiled/cached plans.","**Cons:** harder to version-control and test, vendor-specific language (hard to migrate), business logic hidden from application code, debugging is clumsy."]},{"k":"code","lang":"sql","code":"-- not runnable here: SQLite has no stored routines.\n-- Use CREATE FUNCTION (PostgreSQL), CREATE PROCEDURE / FUNCTION (MySQL).","cap":"SQLite note","run":false},{"k":"ask","t":"\"Function vs stored procedure?\" Function returns a value and can be used inside SELECT; procedure is invoked with CALL, can have OUT parameters and (in PostgreSQL 11+/MySQL) can control transactions."}],"test":[{"q":"A PostgreSQL stored procedure is executed with:","o":["SELECT proc()","RUN proc","CALL proc()","EXEC proc"],"a":2,"w":"Functions are called in queries; procedures with CALL."},{"q":"Which can be used directly inside a SELECT list?","o":["Trigger","Procedure","Function","Cursor"],"a":2,"w":"Functions return values usable in expressions."},{"q":"MySQL delimiter is changed in the shell because:","o":["MySQL cannot parse BEGIN","To enable triggers","The body contains semicolons","To speed up compile"],"a":2,"w":"Otherwise the shell ends the statement at the first semicolon inside the body."},{"q":"Which marks a PostgreSQL function as always returning the same result for the same arguments?","o":["STABLE","IMMUTABLE","VOLATILE","STRICT"],"a":1,"w":"IMMUTABLE lets the planner pre-evaluate and index on it."},{"q":"In MySQL, an exit handler for any SQL error is declared:","o":["EXCEPTION WHEN OTHERS","DECLARE EXIT HANDLER FOR SQLEXCEPTION","ON ERROR EXIT","TRY ... CATCH"],"a":1,"w":"EXCEPTION WHEN OTHERS is PostgreSQL."}],"star":true,"kw":"stored procedure function plpgsql create function call out parameter exception handler delimiter","mins":30},{"id":"cursors-dynamic","group":"G. Programmability, transactions and security","title":"Cursors, prepared statements and dynamic SQL","intro":"Row-by-row processing and statements built at runtime: both are tools of last resort, and both attract interview questions.","blocks":[{"k":"h","t":"Cursor"},{"k":"p","t":"A cursor is a handle on a query result that lets procedural code fetch rows one at a time. Lifecycle: **DECLARE, OPEN, FETCH, CLOSE**."},{"k":"code","lang":"pg","code":"DO $$\nDECLARE\n  cur CURSOR FOR SELECT id, salary FROM employees ORDER BY id;\n  rec RECORD;\nBEGIN\n  OPEN cur;\n  LOOP\n    FETCH cur INTO rec;\n    EXIT WHEN NOT FOUND;\n    RAISE NOTICE 'employee % earns %', rec.id, rec.salary;\n  END LOOP;\n  CLOSE cur;\nEND $$;\n-- much simpler: an implicit cursor\n-- FOR rec IN SELECT id, salary FROM employees LOOP ... END LOOP;","cap":null,"run":false},{"k":"code","lang":"my","code":"DELIMITER $$\nCREATE PROCEDURE print_salaries()\nBEGIN\n  DECLARE done INT DEFAULT 0;\n  DECLARE v_id INT; DECLARE v_sal INT;\n  DECLARE cur CURSOR FOR SELECT id, salary FROM employees;\n  DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;\n  OPEN cur;\n  read_loop: LOOP\n    FETCH cur INTO v_id, v_sal;\n    IF done = 1 THEN LEAVE read_loop; END IF;\n    SELECT v_id, v_sal;\n  END LOOP;\n  CLOSE cur;\nEND$$\nDELIMITER ;","cap":null,"run":false},{"k":"ul","t":["**Prefer set-based SQL.** One UPDATE over all rows is orders of magnitude faster than looping with a cursor.","Good cursor uses: calling a procedure per row, processing huge results in batches, administration scripts.","PostgreSQL also has client-side/server-side cursors: DECLARE c CURSOR FOR ...; FETCH 100 FROM c; for paging big results (WITH HOLD to survive commits).","Types: forward-only vs scrollable; read-only vs updatable (WHERE CURRENT OF)."]},{"k":"h","t":"Prepared statements"},{"k":"p","t":"The SQL text is parsed and planned once, then executed many times with different parameters. Benefits: speed for repeated queries and, more importantly, **protection from SQL injection** because parameters are never parsed as SQL."},{"k":"code","lang":"pg","code":"PREPARE emp_by_dept (INT) AS SELECT name FROM employees WHERE dept_id = $1;\nEXECUTE emp_by_dept(2);\nDEALLOCATE emp_by_dept;","cap":null,"run":false},{"k":"code","lang":"my","code":"PREPARE stmt FROM 'SELECT name FROM employees WHERE dept_id = ?';\nSET @d = 2;\nEXECUTE stmt USING @d;\nDEALLOCATE PREPARE stmt;","cap":null,"run":false},{"k":"h","t":"Dynamic SQL"},{"k":"p","t":"Dynamic SQL builds the statement text at runtime (table or column names chosen by a variable). Identifiers cannot be bound as parameters, so quote them properly."},{"k":"code","lang":"pg","code":"CREATE OR REPLACE FUNCTION count_rows(p_table TEXT) RETURNS BIGINT LANGUAGE plpgsql AS $$\nDECLARE n BIGINT;\nBEGIN\n  EXECUTE format('SELECT COUNT(*) FROM %I', p_table) INTO n;                 -- %I quotes an identifier safely\n  RETURN n;\nEND; $$;\n\n-- values go through USING, never through string concatenation\nEXECUTE format('SELECT name FROM %I WHERE id = $1', 'employees') USING 3;","cap":null,"run":false},{"k":"code","lang":"my","code":"SET @sql = CONCAT('SELECT COUNT(*) FROM ', 'employees');    -- identifier must be validated by you (whitelist!)\nPREPARE s FROM @sql; EXECUTE s; DEALLOCATE PREPARE s;","cap":null,"run":false},{"k":"h","t":"SQL injection in one picture"},{"k":"code","lang":"txt","code":"Vulnerable app code (string building):\n  query = \"SELECT * FROM users WHERE name = '\" + input + \"'\"\n  input = ' OR '1'='1          ->  SELECT * FROM users WHERE name = '' OR '1'='1'   (returns everyone)\n  input = '; DROP TABLE users; --   ->  stacked statement\n\nFix: parameterised query\n  cursor.execute(\"SELECT * FROM users WHERE name = %s\", (input,))      # driver sends the value separately","cap":null,"run":false},{"k":"ul","t":["Always use parameter placeholders (?, $1, %s, named) from the application driver.","Whitelist dynamic identifiers (table or column names) against a fixed list.","Least privilege: the app account should not own the schema or DROP tables.","ORMs parameterise for you, but raw-SQL escape hatches do not."]},{"k":"ask","t":"\"What is SQL injection and how do you prevent it?\" Untrusted input changes the meaning of the query. Prevent with parameterised/prepared statements, input validation, least-privilege accounts, and never concatenating user input into SQL."}],"test":[{"q":"The correct order of cursor operations is:","o":["DECLARE, OPEN, FETCH, CLOSE","FETCH, OPEN, DECLARE, CLOSE","DECLARE, FETCH, OPEN, CLOSE","OPEN, DECLARE, FETCH, CLOSE"],"a":0,"w":"Declare it, open it, fetch rows, close it."},{"q":"Row-by-row cursor loops are usually:","o":["Required for UPDATE","Slower than a single set-based statement","Faster than set-based SQL","Illegal"],"a":1,"w":"Set-based operations let the optimizer work on all rows at once."},{"q":"Prepared statements help prevent SQL injection because:","o":["They encrypt data","They hash inputs","Parameters are sent separately and never parsed as SQL","They block DROP"],"a":2,"w":"The structure is fixed before values are supplied."},{"q":"Table names in dynamic SQL cannot be bound as parameters, so you should:","o":["Use LIKE","Quote with format('%I') / whitelist","Skip validation","Concatenate raw input"],"a":1,"w":"Quote or whitelist identifiers."},{"q":"In a MySQL cursor loop, the NOT FOUND handler is used to:","o":["Detect end of rows","Reset variables","Commit","Open the cursor"],"a":0,"w":"It sets a flag when FETCH has no more rows."}],"star":false,"kw":"cursor declare open fetch close prepare execute dynamic sql injection parameterised format","mins":25},{"id":"dcl-security","group":"G. Programmability, transactions and security","title":"Users, roles, GRANT / REVOKE, row-level security","intro":"Who can do what. Expect questions on GRANT syntax, roles, least privilege, and how to give analysts read-only access.","blocks":[{"k":"h","t":"Privileges"},{"k":"table","head":["Privilege","On","Allows"],"rows":[["SELECT, INSERT, UPDATE, DELETE","table / column","Read and change data"],["REFERENCES","table","Create a foreign key to it"],["TRIGGER, TRUNCATE (PostgreSQL)","table","Create triggers, truncate"],["EXECUTE","function / procedure","Call it"],["USAGE","schema, sequence","Use objects in the schema; call nextval"],["CREATE","database / schema","Create objects"],["CONNECT","database","Connect to it"],["ALL PRIVILEGES","any","Everything on that object"]]},{"k":"h","t":"PostgreSQL"},{"k":"code","lang":"pg","code":"CREATE ROLE app_read NOLOGIN;                                   -- a group role\nGRANT CONNECT ON DATABASE shop TO app_read;\nGRANT USAGE ON SCHEMA public TO app_read;\nGRANT SELECT ON ALL TABLES IN SCHEMA public TO app_read;\nALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO app_read;   -- future tables too\n\nCREATE ROLE alice LOGIN PASSWORD 'use-a-secret-manager';\nGRANT app_read TO alice;                                          -- membership\n\nGRANT INSERT, UPDATE ON orders TO app_writer;\nGRANT SELECT (id, name, dept_id) ON employees TO analyst;         -- column-level: salary stays hidden\nREVOKE ALL ON customer FROM PUBLIC;\nREVOKE INSERT ON orders FROM app_writer;\nGRANT app_read TO alice WITH ADMIN OPTION;                        -- she may grant the role onward\n\\du            -- list roles (psql)\n\\dp orders     -- list privileges (psql)","cap":null,"run":false},{"k":"code","lang":"my","code":"CREATE USER 'alice'@'%' IDENTIFIED BY 'use-a-secret-manager';\nCREATE ROLE 'app_read';\nGRANT SELECT ON shop.* TO 'app_read';\nGRANT 'app_read' TO 'alice'@'%';\nSET DEFAULT ROLE 'app_read' TO 'alice'@'%';\nGRANT SELECT (id, name) ON shop.employees TO 'analyst'@'%';\nGRANT SELECT ON shop.* TO 'bob'@'localhost' WITH GRANT OPTION;\nREVOKE INSERT ON shop.orders FROM 'alice'@'%';\nSHOW GRANTS FOR 'alice'@'%';\nDROP USER 'alice'@'%';","cap":null,"run":false},{"k":"my","t":"MySQL accounts are user@host pairs. 'alice'@'%' and 'alice'@'localhost' are different accounts."},{"k":"h","t":"Principle of least privilege"},{"k":"ul","t":["Application account: DML on its tables only. Never superuser, never schema owner.","Migrations account: DDL rights, used only during deployments.","Analysts: read-only role, ideally through views that hide sensitive columns.","Revoke default PUBLIC rights; rotate passwords; use TLS."]},{"k":"h","t":"Views as a security layer"},{"k":"code","lang":"sql","code":"CREATE VIEW employee_public AS SELECT id, name, dept_id, city FROM employees;     -- no salary\n-- then: GRANT SELECT ON employee_public TO analyst;   and keep the base table closed\nSELECT * FROM employee_public LIMIT 3;","cap":null,"run":true},{"k":"h","t":"Row-level security (PostgreSQL)"},{"k":"code","lang":"pg","code":"ALTER TABLE orders ENABLE ROW LEVEL SECURITY;\nCREATE POLICY own_orders ON orders\n  USING (customer_id = current_setting('app.customer_id')::bigint)          -- which rows are visible\n  WITH CHECK (customer_id = current_setting('app.customer_id')::bigint);    -- which rows can be written\n\n-- the app does:  SET app.customer_id = '42';  SELECT * FROM orders;   -- only customer 42's rows","cap":null,"run":false},{"k":"my","t":"MySQL has no built-in row-level security; use views with WHERE clauses plus definer rights, or filter in the application."},{"k":"h","t":"Other security basics"},{"k":"ul","t":["Encryption in transit (TLS) and at rest; hash passwords in the app (bcrypt/argon2), never store plain text in the database.","Auditing: log DDL and failed logins; PostgreSQL pgaudit extension; MySQL audit plugin.","SQL injection: see the prepared statements topic.","pg_hba.conf (PostgreSQL) controls who may connect from where and how they authenticate."]},{"k":"ask","t":"\"How would you give a reporting team read-only access without exposing salaries?\" Create a role with SELECT only on a view or on specific columns, grant the role to the users, revoke access to the base table."}],"test":[{"q":"Which statement removes a privilege?","o":["REMOVE","DENY","REVOKE","DROP GRANT"],"a":2,"w":"REVOKE is the standard command."},{"q":"Column-level read access in PostgreSQL:","o":["GRANT COLUMNS ON t","GRANT SELECT ON t.id TO r","Not possible","GRANT SELECT (id, name) ON t TO r"],"a":3,"w":"List the columns in parentheses after the privilege."},{"q":"WITH GRANT OPTION (or WITH ADMIN OPTION for roles) lets the grantee:","o":["Drop the table","Pass the privilege on to others","Log in as owner","Bypass constraints"],"a":1,"w":"It delegates granting rights."},{"q":"Which database has built-in row-level security policies?","o":["None","MySQL","PostgreSQL","SQLite"],"a":2,"w":"PostgreSQL CREATE POLICY."},{"q":"Least privilege means:","o":["No passwords","Each account gets only the permissions it needs","Only superusers log in","Everyone gets ALL PRIVILEGES"],"a":1,"w":"Limit the blast radius of mistakes and breaches."}],"star":false,"kw":"grant revoke role user privilege permissions row level security policy least privilege view","mins":25},{"id":"partitioning","group":"G. Programmability, transactions and security","title":"Table partitioning (range, list, hash) in PostgreSQL and MySQL","intro":"Splitting one huge table into smaller physical pieces while queries still see one table.","blocks":[{"k":"p","t":"Benefits: **partition pruning** (queries touching one month read only that partition), fast bulk deletes (drop a partition instead of DELETE), smaller indexes, easier archiving."},{"k":"table","head":["Method","Rule","Example key"],"rows":[["RANGE","Each partition covers an interval","order date by month or year"],["LIST","Each partition holds listed values","country, region"],["HASH","hash(key) mod N spreads rows evenly","customer_id"]]},{"k":"code","lang":"pg","code":"CREATE TABLE measurement (\n  city_id  INT  NOT NULL,\n  logdate  DATE NOT NULL,\n  temp     INT,\n  PRIMARY KEY (city_id, logdate)                -- the PK must include the partition key\n) PARTITION BY RANGE (logdate);\n\nCREATE TABLE measurement_2026_h1 PARTITION OF measurement FOR VALUES FROM ('2026-01-01') TO ('2026-07-01');\nCREATE TABLE measurement_2026_h2 PARTITION OF measurement FOR VALUES FROM ('2026-07-01') TO ('2027-01-01');\nCREATE TABLE measurement_default PARTITION OF measurement DEFAULT;\n\n-- list and hash\nCREATE TABLE customer_region (id INT, region TEXT, PRIMARY KEY (id, region)) PARTITION BY LIST (region);\nCREATE TABLE cr_south PARTITION OF customer_region FOR VALUES IN ('KA','TN','KL');\nCREATE TABLE events (id BIGINT, payload JSONB, PRIMARY KEY (id)) PARTITION BY HASH (id);\nCREATE TABLE events_p0 PARTITION OF events FOR VALUES WITH (MODULUS 4, REMAINDER 0);\n\n-- maintenance\nALTER TABLE measurement DETACH PARTITION measurement_2026_h1;    -- then archive or DROP it instantly\nEXPLAIN SELECT * FROM measurement WHERE logdate = '2026-08-01';   -- should scan only h2","cap":null,"run":false},{"k":"code","lang":"my","code":"CREATE TABLE sales (\n  id INT NOT NULL, sold_on DATE NOT NULL, amount DECIMAL(10,2),\n  PRIMARY KEY (id, sold_on)\n)\nPARTITION BY RANGE (YEAR(sold_on)) (\n  PARTITION p2025 VALUES LESS THAN (2026),\n  PARTITION p2026 VALUES LESS THAN (2027),\n  PARTITION pmax  VALUES LESS THAN MAXVALUE\n);\nALTER TABLE sales DROP PARTITION p2025;","cap":null,"run":false},{"k":"my","t":"MySQL partitioned InnoDB tables cannot have foreign keys (neither as parent nor child), and every unique key must include the partitioning column."},{"k":"h","t":"Partitioning vs sharding vs replication"},{"k":"table","head":["","What","Scope"],"rows":[["Partitioning","Split a table inside one database server","One server"],["Sharding","Split data across several servers by a shard key","Many servers (application or middleware routing)"],["Replication","Copies of the same data on other servers","Read scale and failover"]]},{"k":"ask","t":"\"When do you partition a table?\" When it is very large and queries or maintenance naturally target one slice (time ranges, tenants), so pruning and partition drops pay off."}],"test":[{"q":"The main performance idea behind partitioning is:","o":["Partition pruning","Compression","Locking","Encryption"],"a":0,"w":"The planner skips partitions that cannot contain matching rows."},{"q":"In PostgreSQL a primary key on a partitioned table must:","o":["Be a single column","Not exist","Be a UUID","Include the partition key"],"a":3,"w":"Uniqueness is enforced per partition, so the key must include the partitioning columns."},{"q":"Quickest way to remove a year of old data from a range-partitioned table:","o":["VACUUM","DELETE WHERE year = X","TRUNCATE the parent","Drop or detach that partition"],"a":3,"w":"Dropping a partition is nearly instant."},{"q":"Which partitioning type spreads rows evenly without ranges?","o":["RANGE","HASH","DEFAULT","LIST"],"a":1,"w":"HASH distributes by hash modulo N."},{"q":"Sharding differs from partitioning because it:","o":["Uses one server","Removes indexes","Spreads data over multiple servers","Needs no key"],"a":2,"w":"Shards live on different machines."}],"star":false,"kw":"partition range list hash prune sharding detach","mins":20},{"id":"design-practices","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Schema design best practices and hierarchy models","intro":"The checklist for 'design the schema for X' and the review questions that follow: naming, audit columns, soft delete, multi-tenancy, trees, migrations.","blocks":[{"k":"h","t":"Conventions interviewers like to hear"},{"k":"ul","t":["**Naming:** snake_case, singular table names (or plural, but consistent), primary key id or table_id, foreign key named parent_id, boolean columns as is_/has_. Avoid reserved words (order, user, group).","**Audit columns:** created_at, updated_at (and created_by when needed) on every table.","**Soft delete:** deleted_at TIMESTAMPTZ NULL or is_active; combine with a partial unique index (UNIQUE (email) WHERE deleted_at IS NULL).","**Constraints first:** NOT NULL by default, CHECKs for ranges and states, FKs for all relationships. The database is the last line of defence.","**Indexes:** every FK, every frequent filter, composite in the right order, partial for hot subsets.","**Money** as NUMERIC or integer minor units, **time** as UTC TIMESTAMPTZ, **ids** as BIGINT identity or UUID.","**Never** store comma-separated lists, repeated columns (phone1, phone2), or derived values that go stale."]},{"k":"h","t":"Anti-patterns"},{"k":"table","head":["Anti-pattern","Problem","Better"],"rows":[["Comma-separated ids in a column","Cannot join, index or constrain","Junction table"],["EAV (entity, attribute, value)","No types, no constraints, slow queries","Real columns, or JSONB for the truly dynamic part"],["One giant table for everything","Sparse NULLs, unclear meaning","Normalize; subtype tables"],["Polymorphic FK (target_type + target_id)","No referential integrity","Separate FK columns with a CHECK, or one junction table per type"],["Storing files as BLOB rows","Bloats backups","Object storage + URL column"],["Using FLOAT for money","Rounding errors","NUMERIC(12,2)"],["Natural key as the only PK that can change","Cascading updates","Surrogate PK + UNIQUE natural key"],["SELECT * in application code","Breaks when columns change; extra I/O","List columns"]]},{"k":"h","t":"Multi-tenant design"},{"k":"ul","t":["**Shared tables with tenant_id** on every row: cheapest. Make tenant_id part of unique keys and composite FKs; enforce isolation with row-level security (PostgreSQL).","**Schema per tenant:** stronger isolation, harder migrations.","**Database per tenant:** strongest isolation, highest operating cost."]},{"k":"h","t":"Hierarchies (trees) in SQL"},{"k":"table","head":["Model","Idea","Read subtree","Move subtree","Notes"],"rows":[["Adjacency list","parent_id column","Recursive CTE","Easy (one update)","Default choice; simple"],["Path enumeration","path = '/1/4/9/'","LIKE '/1/4/%'","Rewrite paths","Fast reads; PostgreSQL ltree type"],["Nested sets","left/right numbers","Range query","Expensive renumbering","Read-heavy, rarely changing trees"],["Closure table","All ancestor-descendant pairs in a table","Simple join","Moderate","Flexible, extra table"]]},{"k":"h","t":"Schema changes without downtime (expand and contract)"},{"k":"ol","t":["**Expand:** add the new column or table nullable; deploy code that writes both.","**Backfill** old rows in small batches.","**Switch** reads to the new structure.","**Contract:** drop the old column once nothing uses it.","Run migrations with a tool (Flyway, Liquibase, Alembic, Prisma Migrate), always in version control. Create indexes CONCURRENTLY in PostgreSQL; know that some ALTERs lock the table."]},{"k":"h","t":"Pagination"},{"k":"code","lang":"sql","code":"-- OFFSET pagination: simple but slow for deep pages (it reads and discards the skipped rows)\nSELECT id, name FROM employees ORDER BY id LIMIT 3 OFFSET 6;\n-- keyset (seek) pagination: constant speed, uses the index\nSELECT id, name FROM employees WHERE id > 6 ORDER BY id LIMIT 3;","cap":null,"run":true},{"k":"ask","t":"\"Design the schema for X\" is graded on process: clarify requirements, list entities, draw relationships and cardinality, write DDL with keys and constraints, add indexes for the main queries, then discuss growth (partitioning, caching) and edge cases (deletes, history, concurrency)."}],"test":[{"q":"Why is a comma-separated list of ids in one column bad?","o":["It uses too much memory","Only MySQL forbids it","You cannot enforce FKs, index it or join cleanly","It is too long"],"a":2,"w":"It violates 1NF and loses integrity and query power."},{"q":"Best way to keep email unique only among non-deleted rows in PostgreSQL:","o":["CHECK","UNIQUE (email)","Trigger only","Partial unique index WHERE deleted_at IS NULL"],"a":3,"w":"A partial unique index ignores soft-deleted rows."},{"q":"Keyset pagination is preferred for deep pages because:","o":["It sorts less","It is shorter","It uses OFFSET","It does not read and discard skipped rows"],"a":3,"w":"WHERE id > last_seen uses the index to jump straight to the page."},{"q":"Which tree model makes 'move a subtree' cheapest?","o":["Closure table","Nested sets","Path enumeration","Adjacency list"],"a":3,"w":"Change one parent_id."},{"q":"In expand-and-contract migrations the first step is:","o":["Lock the table","Drop the old column","Rename everything","Add the new structure alongside the old one"],"a":3,"w":"Expand first so old and new code can run together."}],"star":true,"kw":"design best practices naming soft delete multi tenant tree adjacency closure nested set path migration expand contract pagination anti pattern eav","mins":25},{"id":"postgres-essentials","group":"H. PostgreSQL, MySQL and interview answers","title":"PostgreSQL essentials: architecture, psql, MVCC, VACUUM, extensions","intro":"You work with PostgreSQL, so expect to be asked how it works internally and how you operate it.","blocks":[{"k":"h","t":"What it is"},{"k":"p","t":"PostgreSQL is an open-source object-relational database: full ACID, MVCC, rich types (arrays, JSONB, ranges, enums, geometric, network), extensibility (extensions, custom types, operators, index methods), standards-heavy SQL (CTEs, window functions, LATERAL, MERGE since 15), and procedural languages (PL/pgSQL, PL/Python...). Default port 5432."},{"k":"h","t":"Architecture"},{"k":"ul","t":["**Postmaster** process listens and forks one **backend process per connection**. That is why connection pooling (PgBouncer) matters at scale.","**Shared buffers** (page cache), **WAL buffers**, **work_mem** (per sort/hash operation, per connection), **maintenance_work_mem**, **effective_cache_size** (planner hint).","Background workers: **checkpointer**, **background writer**, **WAL writer**, **autovacuum launcher/workers**, **stats collector**, **WAL sender/receiver** (replication).","Storage: each table is a **heap** of 8 KB pages; indexes are separate structures pointing to tuple ids (ctid). TOAST stores large values out of line.","Hierarchy: cluster → databases → schemas → tables. A cluster is one running server instance."]},{"k":"h","t":"MVCC, VACUUM and bloat"},{"k":"ul","t":["An UPDATE writes a **new row version**; the old one stays (xmin = creating transaction, xmax = deleting transaction). A DELETE just marks xmax.","Old versions that no snapshot needs are **dead tuples**. **VACUUM** reclaims their space for reuse; **autovacuum** runs it automatically. **VACUUM FULL** rewrites the table (exclusive lock).","**ANALYZE** refreshes planner statistics. Autovacuum does both.","**Bloat** = dead space. Causes: long-running transactions that hold back cleanup, heavy updates, autovacuum too slow.","**Transaction id wraparound:** ids are 32-bit; VACUUM freezes old rows to avoid it. Never disable autovacuum.","**HOT updates** avoid index writes when no indexed column changes and the page has room (fillfactor)."]},{"k":"code","lang":"sql","code":"-- the same idea in SQLite terms is not available; in PostgreSQL:\n-- SELECT xmin, xmax, ctid, * FROM employees LIMIT 3;\n-- SELECT relname, n_live_tup, n_dead_tup, last_autovacuum FROM pg_stat_user_tables ORDER BY n_dead_tup DESC;","cap":"inspect row versions and dead tuples","run":false},{"k":"h","t":"psql meta-commands"},{"k":"table","head":["Command","Does"],"rows":[["\\l","list databases"],["\\c dbname","connect to a database"],["\\dt   \\dt schema.*","list tables"],["\\d table","describe columns, indexes, constraints, triggers"],["\\d+ table","same plus size and storage"],["\\dn   \\du   \\df   \\dv   \\di   \\dT","schemas, roles, functions, views, indexes, types"],["\\x","toggle expanded (vertical) output"],["\\timing","show query time"],["\\i file.sql","run a script"],["\\copy t FROM 'f.csv' CSV HEADER","client-side bulk import (COPY runs on the server)"],["\\set / \\echo / \\g / \\watch 5","variables, print, run, repeat every 5 s"],["\\q","quit"]]},{"k":"h","t":"Schemas and search_path"},{"k":"code","lang":"pg","code":"CREATE SCHEMA hr;\nCREATE TABLE hr.employee (id INT PRIMARY KEY);\nSHOW search_path;                               -- \"$user\", public\nSET search_path TO hr, public;                  -- unqualified names now look in hr first\nALTER ROLE app SET search_path = hr, public;","cap":null,"run":false},{"k":"h","t":"Extensions worth naming"},{"k":"table","head":["Extension","Adds"],"rows":[["pg_stat_statements","Per-query statistics: find the slowest queries"],["pgcrypto","Hashing, encryption, gen_random_uuid() (built in from 13)"],["uuid-ossp","UUID generators"],["pg_trgm","Trigram similarity; fast LIKE '%x%' with GIN index"],["btree_gist / btree_gin","Use scalar types in GiST/GIN (exclusion constraints)"],["PostGIS","Geospatial types and queries"],["tablefunc","crosstab pivots"],["postgres_fdw","Query other PostgreSQL servers"],["pgvector","Vector similarity search for embeddings"],["timescaledb","Time-series partitioning and compression"]]},{"k":"code","lang":"pg","code":"CREATE EXTENSION IF NOT EXISTS pg_trgm;\nCREATE INDEX idx_name_trgm ON employees USING gin (name gin_trgm_ops);\nSELECT name FROM employees WHERE name ILIKE '%ish%';   -- now index-assisted","cap":null,"run":false},{"k":"h","t":"Distinctive features to mention"},{"k":"ul","t":["Transactional DDL (rollback a CREATE TABLE).","Rich types: arrays, ranges, enums, domains (CREATE DOMAIN), composite types, JSONB, hstore, network types.","Index types: B-tree, Hash, GIN, GiST, SP-GiST, BRIN; partial, expression, covering (INCLUDE), multicolumn.","Declarative partitioning, table inheritance, foreign data wrappers.","Full-text search (tsvector, tsquery, to_tsvector, ts_rank).","LISTEN / NOTIFY for lightweight pub/sub; advisory locks (pg_advisory_lock).","Row-level security, SERIALIZABLE snapshot isolation (SSI), logical replication, generated columns, MERGE (15), SQL/JSON (16/17)."]},{"k":"code","lang":"pg","code":"-- handy PostgreSQL-only snippets\nSELECT generate_series(1, 5);\nSELECT DISTINCT ON (dept_id) dept_id, name, salary FROM employees ORDER BY dept_id, salary DESC;\nSELECT name FROM employees WHERE name ~* '^a.*a$';\nSELECT COUNT(*) FILTER (WHERE salary > 100000) FROM employees;\nSELECT * FROM employees WHERE id = ANY (ARRAY[1,2,3]);\nSELECT string_agg(name, ', ' ORDER BY name) FROM employees;\nEXPLAIN (ANALYZE, BUFFERS, VERBOSE) SELECT * FROM employees WHERE dept_id = 2;","cap":null,"run":false},{"k":"ask","t":"\"How does PostgreSQL implement MVCC?\" Each row has xmin/xmax; updates create new tuple versions; readers use a snapshot of committed transaction ids; VACUUM later removes dead versions."}],"test":[{"q":"PostgreSQL handles each client connection with:","o":["A shared singleton","A coroutine","A separate backend process","A thread in one process"],"a":2,"w":"Process-per-connection; hence pooling."},{"q":"Dead tuples are cleaned up by:","o":["ANALYZE","CHECKPOINT","VACUUM","REINDEX"],"a":2,"w":"VACUUM reclaims space from dead row versions."},{"q":"psql command to describe a table:","o":["\\x","\\l","\\d table","\\dt"],"a":2,"w":"\\d shows columns, indexes and constraints."},{"q":"Which extension helps find the slowest queries?","o":["pg_stat_statements","pg_trgm","postgis","tablefunc"],"a":0,"w":"It aggregates per-statement timing."},{"q":"Setting search_path controls:","o":["Replication targets","Which schemas are searched for unqualified names","Index lookup order","Where backups are written"],"a":1,"w":"Name resolution for unqualified objects."},{"q":"What can PostgreSQL do that MySQL cannot?","o":["Joins","Views","Primary keys","Transactional DDL"],"a":3,"w":"PostgreSQL can roll back DDL; MySQL commits it implicitly."}],"star":true,"kw":"postgresql postgres psql mvcc vacuum autovacuum bloat extension search_path schema pg_stat_statements wal architecture","mins":30},{"id":"mysql-essentials","group":"H. PostgreSQL, MySQL and interview answers","title":"MySQL essentials: engines, sql_mode, InnoDB, quirks","intro":"You learned MySQL, so keep it sharp. The key ideas: pluggable storage engines, InnoDB internals, strict mode and the quirks interviewers love.","blocks":[{"k":"h","t":"Architecture"},{"k":"ul","t":["**Server layer:** connection handling (thread per connection), parser, optimizer, caches. **Storage engine layer:** pluggable engines.","Default port 3306. Hierarchy: server → databases (= schemas) → tables.","**InnoDB** (default): transactions, row-level locking, foreign keys, MVCC via undo logs, clustered primary key, redo log for crash recovery, doublewrite buffer, buffer pool.","Query cache was removed in 8.0."]},{"k":"table","head":["Engine","Transactions","FKs","Locking","Notes"],"rows":[["InnoDB","Yes","Yes","Row-level","Default; crash-safe"],["MyISAM","No","No","Table-level","Legacy; fast reads, corruption-prone"],["MEMORY","No","No","Table-level","Data lost on restart"],["ARCHIVE","No","No","Row","Compressed insert-only logs"],["CSV","No","No","Table","Plain CSV files"]]},{"k":"h","t":"sql_mode"},{"k":"ul","t":["**ONLY_FULL_GROUP_BY** (default in 5.7+): rejects selecting non-grouped, non-aggregated columns.","**STRICT_TRANS_TABLES:** invalid values (out of range, too long) raise errors instead of silent truncation with a warning.","**NO_ZERO_DATE / NO_ZERO_IN_DATE:** forbid '0000-00-00'.","**ANSI_QUOTES:** treat double quotes as identifiers (PostgreSQL style).","**PIPES_AS_CONCAT:** make || concatenate instead of OR.","**ERROR_FOR_DIVISION_BY_ZERO:** error instead of NULL."]},{"k":"code","lang":"my","code":"SELECT @@sql_mode;\nSET SESSION sql_mode = 'STRICT_ALL_TABLES,ONLY_FULL_GROUP_BY,NO_ZERO_DATE';\nSELECT VERSION(), @@transaction_isolation, @@autocommit;","cap":null,"run":false},{"k":"h","t":"InnoDB details worth knowing"},{"k":"ul","t":["The table IS the clustered B+ tree on the PRIMARY KEY. If you declare none, InnoDB picks the first NOT NULL UNIQUE index or a hidden 6-byte row id.","Secondary indexes store the primary key as the row pointer: keep primary keys short.","**Locks:** record locks, gap locks and next-key locks (default in REPEATABLE READ) prevent phantoms; intention locks; deadlock detection is automatic.","**Redo log** gives durability (innodb_flush_log_at_trx_commit = 1 for full ACID), **undo log** gives rollback and MVCC.","**Online DDL:** many ALTER TABLE operations run INPLACE without blocking writes."]},{"k":"h","t":"Quirks and traps"},{"k":"table","head":["Quirk","Detail"],"rows":[["Case-insensitive comparison","Default collation (utf8mb4_0900_ai_ci) makes 'A' = 'a'. Use BINARY or a _bin collation for exact matching"],["Table-name case","Case-sensitive on Linux, insensitive on Windows (lower_case_table_names)"],["utf8 vs utf8mb4","'utf8' is a 3-byte subset and cannot store emoji. Always use utf8mb4"],["Implicit conversion","'abc' + 1 = 1 with a warning; comparing varchar to number converts the column and kills the index"],["|| operator","Logical OR unless PIPES_AS_CONCAT"],["Double-quoted strings","Treated as strings, not identifiers; identifiers use backticks"],["Silent truncation (non-strict)","Too-long text is cut, out-of-range numbers are clipped"],["Zero dates","'0000-00-00' accepted unless NO_ZERO_DATE"],["AUTO_INCREMENT","Only one per table, must be a key; value lost counters on rollback"],["Division","5 / 2 = 2.5 (use DIV for integers)"],["TIMESTAMP","Stored as UTC, range ends in 2038; DATETIME has no time zone conversion"],["Error 1093","Cannot update a table while selecting from it in a subquery"],["Reserved words","Backtick them: `order`, `group`"]]},{"k":"h","t":"Useful MySQL commands"},{"k":"code","lang":"my","code":"SHOW DATABASES;  USE shop;  SHOW TABLES;  DESCRIBE employees;\nSHOW CREATE TABLE employees\\G\nSHOW INDEX FROM employees;\nSHOW PROCESSLIST;      KILL 123;\nSHOW VARIABLES LIKE 'innodb_buffer_pool_size';\nSHOW ENGINE INNODB STATUS\\G          -- last deadlock, locks, buffer pool\nSHOW WARNINGS;\nEXPLAIN FORMAT=TREE SELECT ...;       -- 8.0\nSELECT * FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'shop';","cap":null,"run":false},{"k":"h","t":"MySQL 8.0 features (the modern answer)"},{"k":"ul","t":["CTEs including recursive, window functions, LATERAL derived tables.","Roles, invisible indexes (test dropping an index safely), descending indexes, functional indexes.","CHECK constraints enforced (8.0.16), atomic DDL, JSON improvements (JSON_TABLE), utf8mb4 default, EXPLAIN ANALYZE (8.0.18), INTERSECT/EXCEPT (8.0.31)."]},{"k":"h","t":"Replication and HA (overview)"},{"k":"ul","t":["Binary log records changes. Source → replica asynchronous replication; semi-synchronous waits for one replica to acknowledge.","GTIDs identify transactions to simplify failover. Group Replication / InnoDB Cluster provide multi-node HA.","Replica lag is the usual operational problem; never read-your-own-write from an async replica without care."]},{"k":"ask","t":"\"MyISAM vs InnoDB?\" InnoDB: ACID transactions, row locks, FKs, crash recovery, clustered PK. MyISAM: no transactions or FKs, table locks, crash-unsafe. Use InnoDB."}],"test":[{"q":"Default MySQL storage engine since 5.5:","o":["MyISAM","MEMORY","InnoDB","CSV"],"a":2,"w":"InnoDB."},{"q":"Which sql_mode setting makes SELECT dept_id, name ... GROUP BY dept_id fail?","o":["NO_ZERO_DATE","STRICT_TRANS_TABLES","ONLY_FULL_GROUP_BY","ANSI_QUOTES"],"a":2,"w":"name is neither grouped nor aggregated."},{"q":"InnoDB secondary indexes store, as the row locator:","o":["Row hash","Primary key value","Page number only","File offset"],"a":1,"w":"Hence short primary keys matter."},{"q":"MySQL 'utf8' charset problem:","o":["Read-only","Only 3 bytes per character, no emoji","Too slow","Not ASCII-compatible"],"a":1,"w":"Use utf8mb4."},{"q":"In MySQL, SELECT 'Abc' = 'abc' returns (default collation):","o":["0","NULL","Error","1"],"a":3,"w":"Case-insensitive comparison."}],"star":true,"kw":"mysql innodb myisam sql_mode engine quirks utf8mb4 only_full_group_by replication binlog","mins":25},{"id":"pg-vs-mysql","group":"H. PostgreSQL, MySQL and interview answers","title":"PostgreSQL vs MySQL: the full comparison table","intro":"The most direct way to check you know both. Read this before any interview where either might come up.","blocks":[{"k":"table","head":["Area","PostgreSQL","MySQL (InnoDB, 8.0)"],"rows":[["Positioning","Feature-rich, standards-focused, extensible object-relational DB","Fast, simple, widely hosted; strong for web OLTP"],["Default isolation","READ COMMITTED","REPEATABLE READ"],["MVCC storage","New row versions in the table; VACUUM cleans","Undo log holds old versions; purge thread cleans"],["Table storage","Heap (rows unordered); PK is just an index","Clustered B+ tree on the PK"],["Transactional DDL","Yes","No (implicit commit)"],["Auto id","GENERATED ... AS IDENTITY, SERIAL, sequences","AUTO_INCREMENT"],["Boolean","Real BOOLEAN","Alias for TINYINT(1)"],["Strings","TEXT = VARCHAR, no length cost; case-sensitive comparison","VARCHAR(n) with byte limits; case-insensitive default collation"],["Identifiers","Double quotes; folds unquoted names to lower case","Backticks; case rules depend on OS"],["Concatenation","||, CONCAT","CONCAT (|| is OR by default)"],["Integer division","5/2 = 2","5/2 = 2.5 (DIV for integer)"],["Type strictness","Strict, explicit casts","Lenient implicit conversions"],["Unsigned ints","No","Yes"],["Date/time","DATE, TIME, TIMESTAMP, TIMESTAMPTZ, INTERVAL","DATE, TIME, DATETIME, TIMESTAMP, YEAR"],["JSON","JSON, JSONB (binary, GIN indexable, rich operators)","JSON (binary internally), functional/generated-column indexes"],["Arrays / ranges / enums","Native arrays, range types, CREATE TYPE enums","ENUM and SET columns only"],["FULL OUTER JOIN","Yes","No (UNION of left and right joins)"],["INTERSECT / EXCEPT","Yes","8.0.31+"],["CTE / window functions","Since 8.4 (2009)","Since 8.0 (2018)"],["LATERAL joins","Yes","8.0.14+"],["RETURNING","Yes","No (MariaDB has it)"],["Upsert","ON CONFLICT ... DO UPDATE","ON DUPLICATE KEY UPDATE"],["MERGE","15+","No"],["UPDATE / DELETE with join","UPDATE ... FROM, DELETE ... USING","UPDATE ... JOIN, DELETE ... JOIN"],["Partial / expression indexes","Yes","Expression indexes yes (8.0.13), partial no"],["Index types","B-tree, Hash, GIN, GiST, SP-GiST, BRIN","B-tree, Hash (MEMORY), FULLTEXT, SPATIAL"],["Materialized views","Yes","No"],["Check constraints","Always enforced","Enforced since 8.0.16"],["Foreign keys","All table types, deferrable","InnoDB only, immediate, no deferrable"],["Exclusion constraints","Yes","No"],["Triggers","Row and statement level, INSTEAD OF, TRUNCATE","Row-level only"],["Procedural language","PL/pgSQL (+ Python, Perl, JS...)","SQL/PSM-style stored routines"],["Row-level security","Yes","No"],["Full-text search","tsvector / tsquery, GIN","FULLTEXT index, MATCH ... AGAINST"],["GROUP BY strictness","Strict","ONLY_FULL_GROUP_BY by default since 5.7"],["NULL ordering","NULLs last in ASC (NULLS FIRST/LAST available)","NULLs first in ASC"],["Replication","Streaming (physical), logical publish/subscribe","Binlog-based async/semi-sync, Group Replication"],["Extensions","Rich ecosystem (PostGIS, pgvector, TimescaleDB)","Plugins; fewer"],["Connections","Process per connection; use pooler","Thread per connection"],["Default port","5432","3306"],["Typical strengths","Complex queries, analytics, data integrity, geospatial, JSON","Simple high-volume reads, mature hosting, easy start"]]},{"k":"h","t":"Syntax you must be able to translate on demand"},{"k":"table","head":["Task","PostgreSQL","MySQL"],"rows":[["Limit","SELECT ... LIMIT 5 OFFSET 10","SELECT ... LIMIT 5 OFFSET 10 (or LIMIT 10, 5)"],["Auto id","id BIGINT GENERATED ALWAYS AS IDENTITY","id BIGINT AUTO_INCREMENT"],["Current time","now()","NOW()"],["If null","COALESCE(a, b)","COALESCE(a, b) or IFNULL(a, b)"],["If / case","CASE WHEN ... END","CASE WHEN ... END or IF(cond, a, b)"],["String aggregate","STRING_AGG(x, ', ')","GROUP_CONCAT(x SEPARATOR ', ')"],["Case-insensitive match","ILIKE","LIKE"],["Regex","~ and ~*","REGEXP"],["Show tables","\\dt","SHOW TABLES"],["Describe","\\d table","DESCRIBE table"],["Show create","pg_dump -s -t table","SHOW CREATE TABLE table"],["Cast","x::int or CAST","CAST(x AS SIGNED)"],["Rename column","ALTER TABLE t RENAME COLUMN a TO b","same (8.0) or CHANGE"],["Drop FK","DROP CONSTRAINT name","DROP FOREIGN KEY name"],["Row count of last statement","GET DIAGNOSTICS n = ROW_COUNT","ROW_COUNT()"]]},{"k":"ask","t":"\"Why PostgreSQL over MySQL?\" Stricter correctness, richer types and indexes (JSONB, arrays, ranges, partial/GIN/BRIN), transactional DDL, better planner for complex queries, extensions (PostGIS, pgvector), row-level security. \"Why MySQL?\" Simplicity, ecosystem and hosting ubiquity, fast simple workloads, easy replication."}],"test":[{"q":"Which does PostgreSQL support but MySQL does not?","o":["LIMIT","FULL OUTER JOIN","INNER JOIN","GROUP BY"],"a":1,"w":"MySQL emulates it with UNION."},{"q":"Default isolation level of PostgreSQL versus MySQL InnoDB:","o":["READ COMMITTED vs REPEATABLE READ","SERIALIZABLE vs READ COMMITTED","Both REPEATABLE READ","Both READ COMMITTED"],"a":0,"w":"PostgreSQL READ COMMITTED, InnoDB REPEATABLE READ."},{"q":"MySQL's equivalent of PostgreSQL ON CONFLICT DO UPDATE:","o":["UPSERT","ON DUPLICATE KEY UPDATE","REPLACE ONLY","MERGE"],"a":1,"w":"Different syntax, same intent."},{"q":"Which storage design does MySQL InnoDB use?","o":["Clustered B+ tree on the primary key","Hash table","Heap with separate PK index","LSM tree"],"a":0,"w":"Rows live in the primary key index."},{"q":"Case-insensitive pattern match: PostgreSQL vs MySQL default:","o":["SOUNDEX vs ILIKE","LIKE vs ILIKE","ILIKE vs LIKE","REGEXP vs LIKE"],"a":2,"w":"PostgreSQL needs ILIKE; MySQL LIKE is case-insensitive by default collation."},{"q":"RETURNING clause is native to:","o":["Both","Neither","PostgreSQL","MySQL"],"a":2,"w":"MySQL has no RETURNING."}],"star":true,"kw":"postgresql vs mysql comparison difference translate syntax","mins":15},{"id":"json-support","group":"H. PostgreSQL, MySQL and interview answers","title":"JSON in SQL: JSONB and MySQL JSON","intro":"Semi-structured data inside a relational table. Know the operators and when JSON is the right tool.","blocks":[{"k":"code","lang":"sql","code":"SELECT json_extract('{\"user\":\"asha\",\"tags\":[\"a\",\"b\"],\"geo\":{\"city\":\"Pune\"}}', '$.geo.city') AS city,\n       json_extract('{\"tags\":[\"a\",\"b\"]}', '$.tags[1]') AS second_tag,\n       json_array_length('{\"tags\":[\"a\",\"b\"]}', '$.tags') AS n_tags;","cap":"SQLite JSON functions, runnable here","run":true},{"k":"h","t":"PostgreSQL JSONB"},{"k":"code","lang":"pg","code":"CREATE TABLE event (\n  id      BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  payload JSONB NOT NULL\n);\nINSERT INTO event (payload) VALUES ('{\"user\":\"asha\",\"tags\":[\"a\",\"b\"],\"geo\":{\"city\":\"Pune\"},\"score\":7}');\n\nSELECT payload->'user'            AS as_json,       -- -> returns jsonb\n       payload->>'user'           AS as_text,       -- ->> returns text\n       payload->'geo'->>'city'    AS city,\n       payload#>>'{geo,city}'     AS city2,         -- path operator\n       (payload->>'score')::int   AS score\nFROM event;\n\nSELECT * FROM event WHERE payload @> '{\"user\":\"asha\"}';          -- contains\nSELECT * FROM event WHERE payload ? 'tags';                        -- key exists\nSELECT * FROM event WHERE payload->'tags' ? 'a';                   -- array contains element\nSELECT jsonb_array_elements_text(payload->'tags') FROM event;      -- unnest array\n\nUPDATE event SET payload = jsonb_set(payload, '{geo,city}', '\"Delhi\"');   -- change a nested value\nUPDATE event SET payload = payload || '{\"vip\": true}';                    -- merge keys\nUPDATE event SET payload = payload - 'vip';                               -- delete a key\n\nCREATE INDEX idx_event_payload ON event USING gin (payload);             -- supports @>, ?, ?|, ?&\nCREATE INDEX idx_event_user ON event ((payload->>'user'));               -- btree on one field\n\nSELECT jsonb_build_object('id', id, 'name', name) FROM employees;        -- build JSON from rows\nSELECT jsonb_agg(jsonb_build_object('n', name)) FROM employees WHERE dept_id = 2;","cap":null,"run":false},{"k":"table","head":["","JSON","JSONB"],"rows":[["Storage","Text copy, whitespace and key order preserved","Binary, decomposed, no duplicate keys, key order not kept"],["Speed","Parsed at each use","Faster queries, slightly slower writes"],["Indexing","No","GIN, expression indexes"],["Use","Rarely","Almost always"]]},{"k":"h","t":"MySQL JSON"},{"k":"code","lang":"my","code":"CREATE TABLE event (id BIGINT AUTO_INCREMENT PRIMARY KEY, payload JSON NOT NULL);\nINSERT INTO event (payload) VALUES ('{\"user\":\"asha\",\"tags\":[\"a\",\"b\"],\"geo\":{\"city\":\"Pune\"},\"score\":7}');\n\nSELECT payload->'$.user'              AS as_json,    -- returns JSON (quoted)\n       payload->>'$.user'             AS as_text,    -- unquoted text\n       JSON_EXTRACT(payload, '$.geo.city')            AS city_json,\n       JSON_UNQUOTE(JSON_EXTRACT(payload, '$.geo.city')) AS city\nFROM event;\n\nSELECT * FROM event WHERE JSON_CONTAINS(payload, '\"a\"', '$.tags');\nSELECT * FROM event WHERE JSON_EXTRACT(payload, '$.score') > 5;\n\nUPDATE event SET payload = JSON_SET(payload, '$.geo.city', 'Delhi');\nUPDATE event SET payload = JSON_REMOVE(payload, '$.score');\nSELECT JSON_OBJECT('id', id, 'name', name) FROM employees;\nSELECT JSON_ARRAYAGG(name) FROM employees WHERE dept_id = 2;\n\n-- index a JSON field via a generated column\nALTER TABLE event\n  ADD COLUMN user_name VARCHAR(50) GENERATED ALWAYS AS (payload->>'$.user') STORED,\n  ADD INDEX idx_user (user_name);\n\n-- explode a JSON array into rows (8.0)\nSELECT t.tag FROM event, JSON_TABLE(payload, '$.tags[*]' COLUMNS (tag VARCHAR(20) PATH '$')) AS t;","cap":null,"run":false},{"k":"h","t":"When to use JSON columns"},{"k":"ul","t":["**Good:** truly variable attributes (product specs per category), event payloads and API responses you store verbatim, settings, sparse metadata.","**Bad:** fields you filter, join or aggregate on constantly, anything needing foreign keys, uniqueness or strong types. Promote those to real columns.","Hybrid is normal: relational columns for the core, one JSONB column for the flexible remainder."]},{"k":"ask","t":"\"JSON vs relational columns?\" Use columns for stable, queried, constrained data. Use JSONB for flexible, rarely-queried attributes, and index the hot paths (GIN or generated column)."}],"test":[{"q":"In PostgreSQL, payload->>'user' returns:","o":["boolean","text","jsonb","an array"],"a":1,"w":"->> returns text; -> returns JSON."},{"q":"Which operator tests whether JSONB contains another JSONB document?","o":["?","#>","||","@>"],"a":3,"w":"@> is contains."},{"q":"Best index for @> queries over a JSONB column:","o":["Hash","B-tree","GIN","BRIN"],"a":2,"w":"GIN indexes JSONB keys and values."},{"q":"In MySQL you index a JSON field by:","o":["A generated column plus an index","Not possible","It is automatic","CREATE JSON INDEX"],"a":0,"w":"Generated column (or a functional index in 8.0.13+)."},{"q":"Which is a bad use of a JSON column?","o":["Optional preferences","Storing the customer_id you join on constantly","Product specs that vary by type","Storing raw API responses"],"a":1,"w":"Join keys need real columns, FKs and indexes."}],"star":false,"kw":"json jsonb operators gin json_extract json_set json_table generated column","mins":20},{"id":"metadata-queries","group":"H. PostgreSQL, MySQL and interview answers","title":"Metadata and monitoring queries (information_schema, catalogs)","intro":"Finding out what exists in a database, and what is happening in it right now. Asked as 'how do you find all tables containing column X?'","blocks":[{"k":"code","lang":"sql","code":"SELECT type, name FROM sqlite_master WHERE type IN ('table','view','index','trigger') ORDER BY type, name;","cap":"SQLite's catalog, runn
