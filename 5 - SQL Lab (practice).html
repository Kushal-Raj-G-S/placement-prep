able","run":true},{"k":"code","lang":"sql","code":"SELECT name, type, \"notnull\", pk FROM pragma_table_info('employees');","cap":"columns of a table (SQLite)","run":true},{"k":"h","t":"Standard information_schema (both engines)"},{"k":"code","lang":"sql","code":"-- all tables in a schema\nSELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';   -- MySQL: table_schema = 'shop'\n\n-- columns of a table\nSELECT column_name, data_type, is_nullable, column_default\nFROM information_schema.columns WHERE table_name = 'employees' ORDER BY ordinal_position;\n\n-- every table that has a column called email\nSELECT table_schema, table_name FROM information_schema.columns WHERE column_name = 'email';\n\n-- constraints and keys\nSELECT constraint_name, constraint_type FROM information_schema.table_constraints WHERE table_name = 'employees';\nSELECT constraint_name, column_name FROM information_schema.key_column_usage WHERE table_name = 'employees';","cap":"not runnable in SQLite","run":false},{"k":"h","t":"Foreign keys referencing a table"},{"k":"code","lang":"pg","code":"SELECT conrelid::regclass AS child_table, conname, pg_get_constraintdef(oid) AS definition\nFROM pg_constraint WHERE contype = 'f' AND confrelid = 'department'::regclass;","cap":null,"run":false},{"k":"code","lang":"my","code":"SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME FROM information_schema.KEY_COLUMN_USAGE\nWHERE REFERENCED_TABLE_NAME = 'departments' AND TABLE_SCHEMA = DATABASE();","cap":null,"run":false},{"k":"h","t":"Sizes and counts"},{"k":"code","lang":"pg","code":"SELECT relname, pg_size_pretty(pg_total_relation_size(oid)) AS total_size\nFROM pg_class WHERE relkind = 'r' AND relnamespace = 'public'::regnamespace ORDER BY pg_total_relation_size(oid) DESC LIMIT 10;\nSELECT pg_size_pretty(pg_database_size(current_database()));\nSELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC;   -- estimated row counts (fast)","cap":null,"run":false},{"k":"code","lang":"my","code":"SELECT TABLE_NAME, ROUND((DATA_LENGTH + INDEX_LENGTH) / 1024 / 1024, 1) AS size_mb, TABLE_ROWS\nFROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() ORDER BY size_mb DESC;","cap":null,"run":false},{"k":"h","t":"What is running and who is blocking whom"},{"k":"code","lang":"pg","code":"SELECT pid, usename, state, now() - query_start AS running_for, wait_event_type, left(query, 80) AS query\nFROM pg_stat_activity WHERE state <> 'idle' ORDER BY running_for DESC;\n\nSELECT pg_cancel_backend(12345);          -- cancel the current query\nSELECT pg_terminate_backend(12345);       -- kill the connection\n\n-- blockers\nSELECT blocked.pid AS blocked_pid, blocking.pid AS blocking_pid, blocked.query AS blocked_query\nFROM pg_stat_activity blocked\nJOIN pg_stat_activity blocking ON blocking.pid = ANY (pg_blocking_pids(blocked.pid));\n\n-- unused / missing indexes\nSELECT relname, indexrelname, idx_scan FROM pg_stat_user_indexes ORDER BY idx_scan ASC LIMIT 10;\nSELECT relname, seq_scan, idx_scan FROM pg_stat_user_tables WHERE seq_scan > idx_scan ORDER BY seq_scan DESC;","cap":null,"run":false},{"k":"code","lang":"my","code":"SHOW FULL PROCESSLIST;\nKILL QUERY 123;   KILL 123;\nSELECT * FROM performance_schema.data_lock_waits;      -- 8.0 lock waits\nSELECT * FROM sys.statements_with_full_table_scans LIMIT 10;\nSELECT * FROM sys.schema_unused_indexes;","cap":null,"run":false},{"k":"ask","t":"\"How do you find the slowest queries?\" PostgreSQL: pg_stat_statements, auto_explain, log_min_duration_statement. MySQL: slow query log, performance_schema / sys schema, EXPLAIN ANALYZE."}],"test":[{"q":"Query to list all columns named email across tables:","o":["SHOW COLUMNS","SELECT * FROM tables","SELECT table_name FROM information_schema.columns WHERE column_name = 'email'","DESCRIBE email"],"a":2,"w":"information_schema.columns works in both PostgreSQL and MySQL."},{"q":"PostgreSQL view of currently running queries:","o":["pg_stat_activity","pg_locks_only","pg_tables","information_queries"],"a":0,"w":"pg_stat_activity lists sessions and their queries."},{"q":"To stop one running query without dropping the connection in PostgreSQL:","o":["pg_cancel_backend","pg_terminate_backend","ROLLBACK ALL","KILL"],"a":0,"w":"Cancel the query; terminate kills the whole backend."},{"q":"MySQL command listing processes and queries:","o":["SHOW PROCESSLIST","SELECT PROCESS()","LIST SESSIONS","SHOW QUERIES"],"a":0,"w":"SHOW [FULL] PROCESSLIST."}],"star":false,"kw":"information_schema metadata catalog pg_stat_activity processlist table size find column pg_class blocking","mins":25},{"id":"ops-backup-replication","group":"H. PostgreSQL, MySQL and interview answers","title":"Operations: backups, replication, tuning, common production problems","intro":"Questions for roles that touch production: how do you back up, scale reads, tune, and debug.","blocks":[{"k":"h","t":"Backups"},{"k":"table","head":["Type","PostgreSQL","MySQL"],"rows":[["Logical (SQL/data dump)","pg_dump -Fc db > db.dump ;  pg_restore -d db db.dump ;  pg_dumpall (roles + all dbs)","mysqldump --single-transaction --routines --triggers db > db.sql ;  mysql db < db.sql"],["Physical (files)","pg_basebackup -D /backup -Ft -z -P","Percona XtraBackup / MySQL Enterprise Backup"],["Point-in-time recovery","Base backup + archived WAL (archive_command), recovery_target_time","Full backup + replay binary logs (mysqlbinlog)"],["Consistent snapshot","pg_dump uses a snapshot of one transaction","--single-transaction (InnoDB)"]]},{"k":"ul","t":["A backup you have not restored is not a backup: test restores regularly.","RPO (how much data you can lose) and RTO (how long you can be down) decide the strategy.","3-2-1 rule: three copies, two media types, one offsite."]},{"k":"h","t":"Replication and high availability"},{"k":"table","head":["","PostgreSQL","MySQL"],"rows":[["Physical","Streaming replication (WAL shipping), sync or async, hot standby for reads","n/a"],["Logical","Publication / subscription (per table, cross-version)","Row-based binlog replication"],["Failover","Patroni, repmgr, cloud-managed","InnoDB Cluster, Orchestrator, cloud-managed"],["Multi-primary","BDR / extensions","Group Replication multi-primary"]]},{"k":"ul","t":["**Read replicas** scale reads but lag; route read-your-own-writes to the primary.","**Synchronous** replication avoids data loss at the price of latency; **asynchronous** is fast but can lose the last transactions on failover.","**Split brain:** two nodes both think they are primary. Prevented by consensus/fencing."]},{"k":"h","t":"Tuning knobs"},{"k":"table","head":["Setting","Rule of thumb"],"rows":[["PostgreSQL shared_buffers","About 25% of RAM"],["PostgreSQL effective_cache_size","50-75% of RAM (planner hint only)"],["PostgreSQL work_mem","Per sort/hash node per connection: keep modest (4-64 MB), raise per session for big reports"],["PostgreSQL max_connections","Keep low (100-300) and put PgBouncer in front"],["PostgreSQL autovacuum","Keep ON; tune scale factors for big tables"],["MySQL innodb_buffer_pool_size","50-75% of RAM on a dedicated server"],["MySQL innodb_flush_log_at_trx_commit","1 for full durability, 2 for speed with small risk"],["MySQL max_connections / thread cache","Pool connections in the app (HikariCP, ProxySQL)"]]},{"k":"h","t":"Common production problems and the first thing to check"},{"k":"table","head":["Symptom","Likely cause","Check / fix"],"rows":[["Query suddenly slow","Plan changed, stale stats, new data distribution","EXPLAIN (ANALYZE); ANALYZE; add or fix index"],["CPU high with many similar queries","N+1 queries from the ORM, missing index","pg_stat_statements; batch the queries"],["Everything waits","Long transaction holding locks","pg_stat_activity / pg_locks; kill the blocker; shorten transactions"],["Disk growing, table bloated","Dead tuples, autovacuum behind","VACUUM (ANALYZE); tune autovacuum; pg_repack"],["Too many connections","No pooling, leaked connections","PgBouncer, pool size limits"],["Replica lag","Big transactions, slow replica disk","Smaller batches, better hardware, monitor lag"],["Deadlock errors","Inconsistent lock order","Lock in a fixed order; retry"],["Out-of-memory","Huge work_mem x connections","Lower work_mem; pool connections"]]},{"k":"h","t":"Connection pooling in one paragraph"},{"k":"p","t":"Opening a database connection is expensive and PostgreSQL uses a process per connection. A pooler (application-side like HikariCP, or PgBouncer/ProxySQL) keeps a small set of persistent connections and multiplexes many clients over them. Transaction-level pooling is the most efficient but breaks session features (prepared statements, SET, advisory locks)."},{"k":"ask","t":"\"Your database is slow in production, walk me through it.\" Check what is running now (activity view), look for blocking and long transactions, find the top queries by total time, EXPLAIN them, check stats/bloat/indexes, then check resources (CPU, memory, IO) and connections."}],"test":[{"q":"Tool for a logical backup of one PostgreSQL database:","o":["pg_ctl","pg_basebackup","psql -l","pg_dump"],"a":3,"w":"pg_dump; pg_basebackup is a physical base backup."},{"q":"Point-in-time recovery needs:","o":["A logical dump only","A base backup plus continuous log archive","A snapshot of the OS","Replication only"],"a":1,"w":"WAL (PostgreSQL) or binlog (MySQL) replayed to the target time."},{"q":"A common recommendation for PostgreSQL shared_buffers is roughly:","o":["100% of RAM","512 bytes","1% RAM","25% of RAM"],"a":3,"w":"A quarter of RAM is the usual starting point."},{"q":"Long-running open transactions hurt PostgreSQL because they:","o":["Disable indexes","Use CPU only","Reset sequences","Prevent VACUUM from removing dead rows"],"a":3,"w":"Old snapshots keep dead tuples visible."},{"q":"Read replicas can show stale data because replication is usually:","o":["Asynchronous","Disabled","One-way encrypted","Synchronous"],"a":0,"w":"Async replicas lag behind the primary."}],"star":false,"kw":"backup restore pg_dump mysqldump pitr replication failover tuning shared_buffers connection pool pgbouncer production slow","mins":25},{"id":"interview-qa","group":"H. PostgreSQL, MySQL and interview answers","title":"Interview rapid-fire: 60 questions with model answers","intro":"Short crisp answers for the standard questions. Say these in your own words; add one example each.","blocks":[{"k":"h","t":"Fundamentals"},{"k":"table","head":["Question","Answer"],"rows":[["What is a database / DBMS / RDBMS?","Database: organised data. DBMS: software that manages it. RDBMS: DBMS based on tables, keys, constraints and SQL (PostgreSQL, MySQL)."],["What is SQL?","Structured Query Language: declarative language to define, manipulate, query and control relational data."],["Difference between SQL and MySQL?","SQL is the language. MySQL is one database product that implements it."],["DDL, DML, DCL, TCL?","Define structure (CREATE, ALTER, DROP), change data (INSERT, UPDATE, DELETE), permissions (GRANT, REVOKE), transactions (COMMIT, ROLLBACK, SAVEPOINT)."],["Table, row, column, field?","Relation, tuple, attribute, a single cell value."],["What is a schema?","A logical container/namespace of tables and objects; also the structural definition of the database."],["Data integrity?","Accuracy and consistency of data, enforced by constraints, keys and transactions."],["What is a constraint? Types?","A rule enforced by the DB: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK, DEFAULT."]]},{"k":"h","t":"Keys"},{"k":"table","head":["Question","Answer"],"rows":[["Primary vs unique key?","One PK per table, no NULL; many UNIQUE, NULLs allowed (multiple in PostgreSQL and MySQL)."],["Primary vs foreign key?","PK identifies a row in its table; FK references a key in another (or same) table to enforce referential integrity."],["Candidate, super, alternate, composite key?","Super: any unique set. Candidate: minimal super key. Alternate: candidate not chosen as PK. Composite: key with more than one column."],["Surrogate vs natural key?","Surrogate is a system id with no meaning; natural is a real-world identifier like email or ISBN."],["Can a table have no primary key? Can a PK be NULL?","It can exist without one (not advisable). A PK can never be NULL."],["Can an FK be NULL or duplicate?","Yes to both, unless NOT NULL/UNIQUE is declared."]]},{"k":"h","t":"Queries"},{"k":"table","head":["Question","Answer"],"rows":[["WHERE vs HAVING?","WHERE filters rows before grouping; HAVING filters groups after aggregation."],["DELETE vs TRUNCATE vs DROP?","Delete rows (filterable, logged, rollbackable); remove all rows fast keeping structure; remove the whole table."],["UNION vs UNION ALL?","UNION removes duplicates (cost), UNION ALL keeps them (faster)."],["INNER vs LEFT vs FULL join?","Matches only; all left plus matches; everything from both sides with NULLs."],["Self join and cross join?","Table joined to itself via aliases; every combination (m x n rows)."],["IN vs EXISTS?","IN compares to a list; EXISTS tests whether any row exists and is NULL-safe with NOT. Optimizers often treat them alike."],["Subquery vs join?","Join combines columns; subquery filters or computes. Joins are often faster and more readable but results can duplicate rows."],["COUNT(*) vs COUNT(col)?","All rows vs non-NULL values of col."],["char vs varchar vs text?","Fixed-length padded; variable up to n; unlimited. PostgreSQL: varchar and text perform the same."],["What is NULL?","Unknown/missing value; compared only with IS NULL; ignored by aggregates."],["RANK vs DENSE_RANK vs ROW_NUMBER?","Ties share rank with gaps; ties share rank without gaps; unique sequential numbers."],["What is a CTE?","A named temporary result used within one statement; recursive CTEs walk hierarchies."],["What is a window function?","Computes over a set of related rows without collapsing them (ranking, running totals, LAG/LEAD)."],["How to find duplicates / delete them?","GROUP BY cols HAVING COUNT(*) > 1; delete keeping MIN(id) or ROW_NUMBER() > 1."],["Nth highest salary?","DENSE_RANK() OVER (ORDER BY salary DESC) = N, or ORDER BY ... LIMIT 1 OFFSET N-1 on DISTINCT salary."],["Pagination?","LIMIT/OFFSET, or keyset: WHERE id > last ORDER BY id LIMIT n."]]},{"k":"h","t":"Design and theory"},{"k":"table","head":["Question","Answer"],"rows":[["What is normalization?","Organising tables to remove redundancy and anomalies using functional dependencies: 1NF, 2NF, 3NF, BCNF, 4NF, 5NF."],["1NF / 2NF / 3NF / BCNF in one line each?","Atomic values; no partial dependency; no transitive dependency; every determinant is a super key."],["Denormalization?","Deliberately adding redundancy for read speed (reporting, caching), accepting update cost."],["Functional dependency?","X determines Y: equal X values imply equal Y values."],["ER diagram components?","Entities, attributes, relationships, cardinality, participation; weak entities; specialization."],["Cardinality types?","1:1, 1:N, M:N (junction table)."],["What is ACID?","Atomicity, Consistency, Isolation, Durability."],["Isolation levels and anomalies?","Read uncommitted, read committed, repeatable read, serializable; dirty read, non-repeatable read, phantom."],["What is a deadlock and how to avoid?","Circular lock wait; consistent lock ordering, short transactions, timeouts, retries."],["Optimistic vs pessimistic locking?","Check version at write time and retry on conflict; lock first with FOR UPDATE."],["What is MVCC?","Multiple row versions so readers do not block writers."],["CAP theorem?","During a partition choose consistency or availability."],["SQL vs NoSQL?","Structured, transactional, joins vs flexible schema, horizontal scale; choose by access patterns."],["OLTP vs OLAP?","Many small transactions vs few large analytical queries; normalized vs star schema."]]},{"k":"h","t":"Objects and performance"},{"k":"table","head":["Question","Answer"],"rows":[["What is an index? Downsides?","Structure for fast lookup (B+ tree). Costs storage and slows writes."],["Clustered vs non-clustered?","Rows stored in key order (one per table) vs separate pointer structure."],["When is an index not used?","Function on the column, leading wildcard, type mismatch, low selectivity, small table, stale stats."],["View vs materialized view?","Saved query without data vs stored result refreshed on demand."],["Stored procedure vs function?","Procedure: CALL, OUT params, transaction control. Function: returns a value, used in queries."],["What is a trigger? Types?","Auto-run code on INSERT/UPDATE/DELETE; BEFORE/AFTER/INSTEAD OF; row or statement level."],["What is a cursor?","Handle to fetch result rows one at a time; prefer set-based SQL."],["Temp table vs CTE vs view?","Session-scoped stored result; single-statement named query; permanent named query."],["How do you optimise a slow query?","EXPLAIN, index, rewrite for SARGability, reduce columns/rows early, update stats, avoid N+1."],["What is a sequence / auto-increment?","Generator of unique numbers; non-transactional, so gaps occur."],["SQL injection and prevention?","Untrusted input changes query logic; prevent with parameterised queries and least privilege."],["Partitioning vs sharding vs replication?","Split a table in one server; split data across servers; copy data to other servers."],["What is a transaction log / WAL?","Sequential record of changes written before data pages, enabling durability and recovery."],["PostgreSQL vs MySQL?","PostgreSQL: richer types/indexes, strict, transactional DDL. MySQL: simple, fast, InnoDB clustered PK."]]},{"k":"ask","t":"Practise saying each answer in 20 seconds, then one follow-up example. Interviews reward structure: define, contrast, example, edge case."}],"test":[{"q":"Which pair is correctly described? Primary key vs unique key:","o":["Both forbid NULL always","PK: one per table, not null; UNIQUE: many per table, NULLs allowed","They are identical","UNIQUE forbids duplicates but PK allows them"],"a":1,"w":"That is the standard contrast."},{"q":"Which SQL group does ROLLBACK belong to?","o":["TCL","DCL","DDL","DML"],"a":0,"w":"Transaction control."},{"q":"Finding duplicates needs:","o":["LIMIT","WHERE COUNT(*) > 1","GROUP BY ... HAVING COUNT(*) > 1","ORDER BY"],"a":2,"w":"Group, then filter groups."},{"q":"2NF removes:","o":["Transitive dependencies","Join dependencies","Partial dependencies","Multivalued dependencies"],"a":2,"w":"Partial dependencies on part of a composite key."},{"q":"Which index types can serve a range query best?","o":["Hash","B+ tree","None","Bitmap only"],"a":1,"w":"B+ tree keeps keys ordered with linked leaves."},{"q":"Faster at pulling the last 10 pages of results: OFFSET or keyset?","o":["Same","Keyset","OFFSET","Neither works"],"a":1,"w":"Keyset seeks directly via the index."}],"star":true,"kw":"interview questions answers rapid fire viva dbms sql theory","mins":25}],"plan":[{"name":"Foundations and keys","why":"The vocabulary every other topic assumes. Keys are asked in almost every interview.","ids":["dbms-intro","relational-keys","er-model","er-to-tables"]},{"name":"Normalization","why":"Functional dependencies, then 1NF to BCNF, then 4NF/5NF. Practise the closure method until it is automatic.","ids":["functional-deps","normal-forms","higher-nf","relational-algebra"]},{"name":"Writing tables (DDL)","why":"Types, every constraint, foreign-key actions, altering and dropping, auto ids.","ids":["data-types","create-table","fk-actions","alter-drop","identity-seq"]},{"name":"Scenario to tables","why":"'Here is a system, create the tables.' Six full designs plus the design checklist.","ids":["scenario-ddl-1","scenario-ddl-2","design-practices"]},{"name":"Queries: the core","why":"Everything a normal query can do. Joins and NULL handling carry most of the marks.","ids":["select-basics","null-case","aggregates","joins","subqueries","set-ops","functions"]},{"name":"Queries: advanced","why":"CTEs, window functions, changing data, views and index syntax.","ids":["cte","window","dml","views","indexes-sql"]},{"name":"Interview queries","why":"24 classic problems. After this, do the graded exercises on the practice screen.","ids":["classics-1","classics-2"]},{"name":"Triggers and server-side code","why":"Triggers get asked directly. Then procedures, cursors, transactions in SQL, and permissions.","ids":["triggers-basics","triggers-patterns","procs-functions","cursors-dynamic","transactions-sql","dcl-security"]},{"name":"Transactions and internals","why":"ACID, schedules, locking, recovery, indexing theory and how the optimizer works.","ids":["transactions","concurrency","recovery","indexing-theory","query-processing"]},{"name":"PostgreSQL and MySQL","why":"Your stack. Know the differences cold, plus JSON, monitoring, operations and scaling.","ids":["postgres-essentials","mysql-essentials","pg-vs-mysql","json-support","partitioning","metadata-queries","ops-backup-replication","distributed-olap"]},{"name":"Final pass","why":"60 rapid-fire answers. Do this last, and again the night before.","ids":["interview-qa"]}],"bank":[{"area":"Keys and normal forms (calculate)","q":"R(A, B, C, D) with F = { A → BD, C → A }. What are the candidate key(s)?","o":["{A}, {D}","{B,C,D}","{C}","{A}"],"a":2,"w":"Attributes that appear on no right-hand side must be in every key; then test closures. Keys: {C}."},{"area":"Keys and normal forms (calculate)","q":"R(A, B, C, D) with F = { A → BC, A → C }. What is the highest normal form of R?","o":["3NF","2NF","BCNF","1NF"],"a":3,"w":"Keys: {A,D}. Check partial dependencies (2NF), then each X → A for X being a super key or A prime (3NF), then every determinant a super key (BCNF)."},{"area":"Keys and normal forms (calculate)","q":"R(A, B, C, D) with F = { D → C, C → B, BD → C }. What is the closure of {D}?","o":["{B,C,D}","{C,D}","{A,B,C,D}","{B,D}"],"a":0,"w":"Start from {D} and keep applying FDs whose left side is already inside: result {B,C,D}."}
