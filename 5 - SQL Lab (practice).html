<title>SQL Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#070B11; --bg2:#0C121B; --panel:#121A26; --panel2:#182231; --edge:#1E2A3A; --edge2:#2A3A4E;
    --txt:#E8EEF6; --dim:#8397AE; --dim2:#5B6E85;
    --cy:#3FD9EC; --cy-dim:#12333D;
    --ok:#4BE08B; --ok-dim:#0E2C1D;
    --no:#FF7A6B; --no-dim:#331612;
    --am:#FFC44D; --am-dim:#332714;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,textarea{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:4px}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:15px}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;background:var(--panel);border:1px solid var(--edge);border-radius:10px}
  .logo{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
  .bar .sp{flex:1 1 auto}
  .stat{display:flex;align-items:baseline;gap:5px;font-family:var(--mono)}
  .stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
  .stat.ok b{color:var(--ok)}
  .engine{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--edge2);color:var(--dim2)}
  .engine.on{color:var(--ok);border-color:var(--ok)}
  .engine.off{color:var(--am);border-color:var(--am)}

  .btn{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
       background:var(--panel2);border:1px solid var(--edge2);border-radius:7px;padding:9px 14px;cursor:pointer;
       transition:transform .08s ease,background .15s ease,border-color .15s ease}
  .btn:hover:not(:disabled){background:var(--edge);border-color:var(--cy)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--cy);border-color:var(--cy);color:#04222A}
  .btn.primary:hover:not(:disabled){background:#5FE6F5}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.35;cursor:default}

  .hero{padding:24px 20px;background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--edge);border-radius:14px;display:flex;flex-direction:column;gap:13px}
  .hero h1{margin:0;font-family:var(--mono);font-weight:700;font-size:clamp(25px,5vw,36px);letter-spacing:-.02em;line-height:1.05}
  .hero h1 em{font-style:normal;color:var(--cy)}
  .hero p{margin:0;color:var(--dim);max-width:64ch;font-size:14.5px}
  .cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}

  .tiers{display:flex;flex-direction:column;gap:10px}
  .tier{background:var(--panel);border:1px solid var(--edge);border-radius:11px;overflow:hidden}
  .tier-h{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--edge);flex-wrap:wrap}
  .tier-h .n{font-family:var(--mono);font-size:10px;color:var(--cy);letter-spacing:.1em}
  .tier-h h3{margin:0;font-size:15px}
  .tier-h .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .exlist{display:flex;flex-direction:column}
  .ex{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;text-align:left;
      background:none;border:0;border-bottom:1px solid var(--edge);padding:11px 14px;cursor:pointer;width:100%}
  .ex:last-child{border-bottom:0}
  .ex:hover{background:var(--panel2)}
  .ex .id{font-family:var(--mono);font-size:11px;color:var(--dim2)}
  .ex .t{font-size:14px}
  .ex.done .t{color:var(--dim)}
  .tick{font-family:var(--mono);font-size:10px;font-weight:700;width:26px;text-align:center;padding:3px 0;border-radius:4px;border:1px solid var(--edge2);color:var(--dim2)}
  .tick.on{color:var(--ok);border-color:var(--ok);background:var(--ok-dim)}

  .crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);flex-wrap:wrap}
  .crumb .now{color:var(--cy)}
  .crumb .sp{flex:1 1 auto}

  .qbox{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:15px;display:flex;flex-direction:column;gap:9px}
  .qbox h2{margin:0;font-size:18px}
  .qbox .task{color:var(--txt);font-size:15px}
  .qbox .want{font-family:var(--mono);font-size:12px;color:var(--cy);background:var(--cy-dim);border:1px solid var(--cy);border-radius:7px;padding:9px 11px}
  .dialect{font-size:13px;color:var(--am);background:var(--am-dim);border:1px solid var(--am);border-radius:7px;padding:9px 11px}
  .dialect b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}

  textarea{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--edge2);border-radius:9px;padding:12px;
           font-family:var(--mono);font-size:13.5px;line-height:1.6;resize:vertical;tab-size:2}
  textarea:focus{border-color:var(--cy);outline:none}
  .runrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .runrow .sp{flex:1 1 auto}
  .kbd{font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--edge2);border-radius:4px;padding:1px 5px}

  .verdict{border-radius:9px;padding:12px 13px;font-size:14px;border:1px solid;display:flex;flex-direction:column;gap:6px}
  .verdict b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .verdict.pass{background:var(--ok-dim);border-color:var(--ok)} .verdict.pass b{color:var(--ok)}
  .verdict.fail{background:var(--no-dim);border-color:var(--no)} .verdict.fail b{color:var(--no)}
  .verdict.err{background:var(--am-dim);border-color:var(--am)} .verdict.err b{color:var(--am)}
  .verdict code{font-family:var(--mono);font-size:12.5px;background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px}

  .rpanel{background:var(--panel);border:1px solid var(--edge);border-radius:11px;overflow:hidden}
  .rpanel-h{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--edge);font-family:var(--mono);
            font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rpanel-h .sp{flex:1 1 auto}
  .tscroll{overflow:auto;max-height:340px}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
  th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:7px 11px;border-bottom:1px solid var(--edge2);
     font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cy);white-space:nowrap;font-weight:600}
  td{padding:6px 11px;border-bottom:1px solid var(--edge);white-space:nowrap;color:var(--txt)}
  tr:last-child td{border-bottom:0}
  td.null{color:var(--dim2);font-style:italic}
  .empty{padding:14px;color:var(--dim2);font-family:var(--mono);font-size:12.5px}

  .schema{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .tbl{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .tbl-h{padding:8px 11px;background:var(--panel2);border-bottom:1px solid var(--edge);font-family:var(--mono);
         font-size:12px;color:var(--cy);display:flex;gap:8px;align-items:center}
  .tbl-h .rows{margin-left:auto;font-size:10px;color:var(--dim2)}
  .cols{padding:9px 11px;display:flex;flex-direction:column;gap:3px}
  .col{font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;gap:7px}
  .col b{color:var(--txt);font-weight:500}
  .col i{color:var(--dim2);font-style:normal;font-size:10px;margin-left:auto}

  .foot{color:var(--dim2);font-size:12.5px;font-family:var(--mono);text-align:center;padding-top:4px}
  .foot a{color:var(--dim)}

  @media(max-width:640px){
    .wrap{padding:14px 11px 80px;gap:12px}
    .hero{padding:19px 15px}
    .ex{grid-template-columns:26px 1fr auto;padding:12px 11px}
    textarea{min-height:150px;font-size:14px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- study guide ---- */
  .scard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--cy);border-radius:12px;padding:16px 18px}
  .scard-l{flex:1 1 320px}
  .scard h2{margin:0 0 4px;font-size:18px;color:var(--cy);font-family:var(--mono)}
  .scard p{margin:0;color:var(--dim);font-size:13.5px}
  .sfind{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--edge2);border-radius:8px;padding:10px 12px;color:var(--txt);font-family:var(--mono);font-size:13px}
  .sfind:focus{border-color:var(--cy);outline:none}
  .star{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--am);border:1px solid var(--am);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:1px}
  .ex .id{min-width:22px}
  .topic{gap:11px}
  .topic h2{font-size:22px}
  .bh{margin:16px 0 0;font-size:15.5px;color:var(--cy);font-family:var(--mono);letter-spacing:.01em;border-top:1px solid var(--edge);padding-top:14px}
  .bp{margin:0;line-height:1.65;font-size:14.5px}
  .bp.lead{color:var(--dim);font-size:15px}
  .bl{margin:0;padding-left:20px;line-height:1.65;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
  code.ic{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--edge);border-radius:4px;padding:0 5px;color:var(--am)}
  .codew{border:1px solid var(--edge2);border-radius:9px;overflow:hidden;background:var(--bg)}
  .codeh{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 11px;background:var(--panel2);border-bottom:1px solid var(--edge);flex-wrap:wrap}
  .codeh .sp{flex:1 1 auto}
  .codeh .cap{font-size:12px;color:var(--dim)}
  .lang{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);border:1px solid var(--cy);border-radius:4px;padding:1px 6px}
  .lang.pg{color:#8FB8FF;border-color:#8FB8FF} .lang.my{color:#FFB070;border-color:#FFB070} .lang.txt{color:var(--dim);border-color:var(--edge2)}
  .mini{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--edge2);border-radius:5px;padding:3px 9px;cursor:pointer}
  .mini:hover:not(:disabled){border-color:var(--cy);color:var(--cy)} .mini:disabled{opacity:.35;cursor:default}
  pre.code{scrollbar-color:var(--edge2) var(--bg);scrollbar-width:thin;margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.8px;line-height:1.6;overflow-x:auto;white-space:pre;tab-size:2}
  .codew .rpanel{border-radius:0;border-width:1px 0 0 0}
  .codew .verdict{border-radius:0;border-width:1px 0 0 0}
  .bt{max-height:none;border:1px solid var(--edge);border-radius:9px}
  .bt table{font-family:var(--sans);font-size:13px}
  .bt td{color:var(--txt);vertical-align:top;line-height:1.5}
  .call{border:1px solid;border-radius:9px;padding:10px 13px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
  .call b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .call.note{background:var(--cy-dim);border-color:var(--cy)} .call.note b{color:var(--cy)}
  .call.trap{background:var(--no-dim);border-color:var(--no)} .call.trap b{color:var(--no)}
  .call.ask{background:var(--am-dim);border-color:var(--am)} .call.ask b{color:var(--am)}
  .call.dif{background:var(--panel2);border-color:var(--edge2)} .call.dif b{color:var(--dim)}
  .call.pg{background:#101A33;border-color:#8FB8FF} .call.pg b{color:#8FB8FF}
  .call.my{background:#2B1C0E;border-color:#FFB070} .call.my b{color:#FFB070}
  .stest{gap:12px}
  .tq{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--edge)}
  .tq:last-of-type{border-bottom:0}
  .tq-q{font-size:14.5px;line-height:1.55;margin-bottom:2px;white-space:pre-wrap}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--edge2);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:14px;line-height:1.5;width:100%}
  .opt:hover:not(:disabled){border-color:var(--cy)}
  .opt:disabled{cursor:default;color:var(--txt)}
  .opt .ol{font-family:var(--mono);font-size:11px;color:var(--dim2);border:1px solid var(--edge2);border-radius:4px;width:20px;text-align:center;flex:none;margin-top:1px}
  .opt .ot{white-space:pre-wrap}
  .opt.right{background:var(--ok-dim);border-color:var(--ok)} .opt.right .ol{color:var(--ok);border-color:var(--ok)}
  .opt.wrong{background:var(--no-dim);border-color:var(--no)} .opt.wrong .ol{color:var(--no);border-color:var(--no)}
  .why{font-size:13.5px;line-height:1.6;border-left:3px solid;padding:6px 0 6px 11px;color:var(--dim)}
  .why b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block}
  .why.ok{border-color:var(--ok)} .why.ok b{color:var(--ok)}
  .why.no{border-color:var(--no)} .why.no b{color:var(--no)}

  .prog{height:8px;background:var(--bg);border:1px solid var(--edge2);border-radius:6px;overflow:hidden;max-width:520px}
  .prog-f{height:100%;background:var(--ok);transition:width .3s ease}
  .scard-l .prog{margin-top:9px}
  .tabon{background:var(--cy-dim);border-color:var(--cy);color:var(--cy)}
  .stage.complete{border-color:var(--ok)}
  .stage.complete .tier-h .n{color:var(--ok)}
  .why-stage{padding:9px 14px;color:var(--dim);font-size:13.5px;border-bottom:1px solid var(--edge)}
  .rrow{display:grid;grid-template-columns:44px 1fr;align-items:stretch;border-bottom:1px solid var(--edge)}
  .rrow:last-child{border-bottom:0}
  .rrow.done .t{color:var(--dim)}
  .chk{background:none;border:0;border-right:1px solid var(--edge);cursor:pointer;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ok);position:relative}
  .chk::before{content:"";position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;border:2px solid var(--edge2);border-radius:5px}
  .chk.on::before{background:var(--ok-dim);border-color:var(--ok)}
  .chk:hover::before{border-color:var(--cy)}
  .rtitle{display:grid;grid-template-columns:26px 1fr auto auto;gap:11px;align-items:center;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;width:100%}
  .rtitle:hover{background:var(--panel2)}
  .rtitle .id{font-family:var(--mono);font-size:11px;color:var(--dim2)}
  .rtitle .t{font-size:14px}
  .rtitle .mins{font-family:var(--mono);font-size:10.5px;color:var(--dim2);white-space:nowrap}
  @media(max-width:640px){.rtitle{grid-template-columns:22px 1fr auto;padding:11px 10px}.rtitle .mins{display:none}}

  .qchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .qchip{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--edge2);border-radius:7px;padding:7px 11px;cursor:pointer}
  .qchip:hover{border-color:var(--cy)} .qchip.on{background:var(--cy-dim);border-color:var(--cy);color:var(--cy)}
  .qclock{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--am);font-variant-numeric:tabular-nums}
  .tq-q.big{font-size:16px;line-height:1.6;font-family:var(--sans);white-space:pre-wrap}
  .opt.chosen{background:var(--cy-dim);border-color:var(--cy)}
  .arow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 50px;gap:10px;align-items:center}
  .arow .an{font-size:13px} .arow .ac{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
  .arow .prog{max-width:none}
  @media(max-width:640px){.arow{grid-template-columns:1fr 50px}.arow .prog{grid-column:1 / 3;order:3}}

  .wmeta{font-size:11.5px;color:var(--dim2);font-family:var(--mono);margin-left:6px}
  .checks{display:flex;flex-direction:column;gap:5px}
  .chkrow{display:flex;gap:9px;font-size:13.5px;line-height:1.5;padding:6px 10px;border-radius:7px;border:1px solid}
  .chkrow.ok{background:var(--ok-dim);border-color:var(--ok)} .chkrow.no{background:var(--no-dim);border-color:var(--no)}
  .chkrow .cm{font-family:var(--mono);font-weight:700}
  .chkrow.ok .cm{color:var(--ok)} .chkrow.no .cm{color:var(--no)}
  .rubric{display:flex;flex-direction:column;gap:7px;border:1px solid var(--edge2);border-radius:9px;padding:12px 14px;background:var(--panel2)}
  .rubric b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy)}
  .rubrow{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.5;cursor:pointer}
  .rubrow input{margin-top:4px;accent-color:var(--cy)}

  .chcheat{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chipj{font-family:var(--mono);font-size:11.5px;padding:6px 10px;border:1px solid var(--edge2);border-radius:7px;color:var(--dim);text-decoration:none;background:var(--bg2)}
  .chipj:hover{border-color:var(--cy);color:var(--cy)}
  .cheatsec{scroll-margin-top:12px}
  .citem{padding:12px 14px;border-top:1px solid var(--edge)}
  .chead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
  .clab{font-size:13.5px;color:var(--txt);font-weight:600}
  .cpy{padding:4px 10px;font-size:10.5px}
  .ccode{margin:0;padding:10px 12px;background:var(--bg);border:1px solid var(--edge);border-radius:8px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-x:auto;color:#d7e3f1}

  .split2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:16px;align-items:start}
  .rcol{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
  .dpane{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px}
  .dview{margin-top:12px}.cols{font-family:var(--mono);font-size:11.5px;color:var(--cy);margin-bottom:8px;line-height:1.5}
  .chipj.on{background:var(--cy);color:#04222A;border-color:var(--cy)}
  .cres{overflow:auto;border:1px solid var(--edge);border-radius:8px;margin:6px 0}
  .cres table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  .cres th{background:var(--bg2);color:var(--cy);text-align:left;padding:6px 9px;white-space:nowrap;border-bottom:1px solid var(--edge2)}
  .cres td{padding:5px 9px;border-top:1px solid var(--edge);white-space:nowrap;color:#d7e3f1}.cres td.nul{color:var(--dim2);font-style:italic}
  .ctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:8px 0 4px}
  .ccode.syn{border-color:var(--cy-dim);color:var(--cy)}.ccode.demo{border-color:var(--ok-dim)}
  .cacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.cnote{font-size:12px;color:var(--dim)}
  .clabel{font-family:var(--mono);font-size:10.5px;color:var(--ok);margin-top:6px}.cok{font-size:12.5px;color:var(--ok);padding:6px 0}

<script type="application/json" id="ex">
[
{"id":1,"tier":1,"title":"Filter and order","task":"List the names of every employee based in Bengaluru, alphabetically.","want":"one column: name — 4 rows, ordered","ordered":true,
 "ref":"SELECT name FROM employees WHERE city = 'Bengaluru' ORDER BY name;",
 "hint":"WHERE narrows rows, ORDER BY sorts what survives."},

{"id":2,"tier":1,"title":"Compare a number","task":"Name and salary of everyone earning more than 90000, highest paid first.","want":"two columns: name, salary — 6 rows, ordered","ordered":true,
 "ref":"SELECT name, salary FROM employees WHERE salary > 90000 ORDER BY salary DESC;",
 "hint":"\"More than\" is strictly greater — 90000 itself does not qualify."},

{"id":3,"tier":1,"title":"Top N by date","task":"The three most recently hired employees, with their hire date.","want":"two columns: name, hire_date — 3 rows, newest first","ordered":true,
 "ref":"SELECT name, hire_date FROM employees ORDER BY hire_date DESC LIMIT 3;",
 "hint":"Sort descending, then cut the list short.",
 "dialect":"LIMIT works in Postgres, MySQL and SQLite. SQL Server uses SELECT TOP 3 instead, and Oracle uses FETCH FIRST 3 ROWS ONLY. If an assessment runs on SQL Server, LIMIT is a syntax error."},

{"id":4,"tier":1,"title":"Distinct values","task":"Every distinct city the company has staff in, alphabetically.","want":"one column: city — 4 rows, ordered","ordered":true,
 "ref":"SELECT DISTINCT city FROM employees ORDER BY city;",
 "hint":"DISTINCT applies to the whole selected row, not just one column."},

{"id":5,"tier":2,"title":"Count per group","task":"How many employees are in each department? Show the department id and the count. Ignore the employee with no department.","want":"two columns: dept_id, count — 3 rows","ordered":false,
 "ref":"SELECT dept_id, COUNT(*) AS n FROM employees WHERE dept_id IS NOT NULL GROUP BY dept_id;",
 "hint":"GROUP BY collapses rows that share a value; COUNT(*) counts each group. NULL is not a value you can group meaningfully here — filter it out."},

{"id":6,"tier":2,"title":"Aggregate with HAVING","task":"Average salary per city, but only for cities with more than one employee.","want":"two columns: city, avg salary — 3 rows","ordered":false,
 "ref":"SELECT city, AVG(salary) AS a FROM employees GROUP BY city HAVING COUNT(*) > 1;",
 "hint":"WHERE filters rows before grouping. HAVING filters groups after. A condition on COUNT(*) can only live in HAVING.",
 "dialect":"This is where Postgres and MySQL genuinely differ. Postgres requires every non-aggregated column in the SELECT to appear in GROUP BY, and errors if it does not. MySQL historically allowed it and returned an arbitrary row's value. Write it Postgres-strict and it is correct everywhere."},

{"id":7,"tier":2,"title":"Two aggregates, one row","task":"The highest and lowest salary in the company, as a single row.","want":"two columns: max, min — 1 row","ordered":false,
 "ref":"SELECT MAX(salary) AS hi, MIN(salary) AS lo FROM employees;",
 "hint":"With no GROUP BY, the whole table is one group."},

{"id":8,"tier":2,"title":"Sum per group","task":"Total hours logged against each project id, biggest total first.","want":"two columns: project_id, total hours — 4 rows, ordered","ordered":true,
 "ref":"SELECT project_id, SUM(hours) AS h FROM assignments GROUP BY project_id ORDER BY h DESC;",
 "hint":"You can ORDER BY an aggregate, and you can order by the alias you gave it."},

{"id":9,"tier":3,"title":"Inner join","task":"Each employee's name alongside their department's name.","want":"two columns: employee name, department name — 9 rows","ordered":false,
 "ref":"SELECT e.name, d.name FROM employees e JOIN departments d ON e.dept_id = d.id;",
 "hint":"Nine rows, not ten — an inner join silently drops the employee whose dept_id is NULL. That dropped row is the whole point of the next exercise."},

{"id":10,"tier":3,"title":"Left join keeps the orphan","task":"Every employee with their department name, including the one who has no department.","want":"two columns: employee name, department name (NULL for the orphan) — 10 rows","ordered":false,
 "ref":"SELECT e.name, d.name FROM employees e LEFT JOIN departments d ON e.dept_id = d.id;",
 "hint":"LEFT JOIN keeps all rows from the left table and fills the right side with NULL where there is no match."},

{"id":11,"tier":3,"title":"Find the empty group","task":"Departments that have no employees at all.","want":"one column: department name — 1 row","ordered":false,
 "ref":"SELECT d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;",
 "hint":"LEFT JOIN from departments, then keep only the rows where the employee side came back NULL. This anti-join pattern is asked constantly."},

{"id":12,"tier":3,"title":"Self join","task":"Employees who earn more than their own manager. Show the employee's name.","want":"one column: name — 2 rows","ordered":false,
 "ref":"SELECT e.name FROM employees e JOIN employees m ON e.manager_id = m.id WHERE e.salary > m.salary;",
 "hint":"Join the table to itself under two different aliases — one row acting as the employee, the other as the manager. Note that equal salaries do not count as \"more\"."},

{"id":13,"tier":3,"title":"Join through a bridge table","task":"Every employee-and-project pairing, showing the employee name and the project name.","want":"two columns: employee name, project name — 9 rows","ordered":false,
 "ref":"SELECT e.name, p.name FROM assignments a JOIN employees e ON a.emp_id = e.id JOIN projects p ON a.project_id = p.id;",
 "hint":"A many-to-many needs two joins: from the bridge table out to each side."},

{"id":14,"tier":4,"title":"Subquery in WHERE","task":"Employees earning above the company average salary.","want":"two columns: name, salary — 4 rows","ordered":false,
 "ref":"SELECT name, salary FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);",
 "hint":"A scalar subquery returns one value, so you can compare against it directly. You cannot use AVG() in WHERE without wrapping it like this."},

{"id":15,"tier":4,"title":"Second highest","task":"The second highest distinct salary in the company, as a single value.","want":"one column, 1 row: 120000","ordered":false,
 "ref":"SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;",
 "hint":"DISTINCT matters — two people share the top-but-one salary. Either sort distinct salaries and skip one, or take the max of everything below the max."},

{"id":16,"tier":4,"title":"Subquery picks the group","task":"Everyone working in whichever department has the largest budget.","want":"one column: name — 3 rows","ordered":false,
 "ref":"SELECT name FROM employees WHERE dept_id = (SELECT id FROM departments ORDER BY budget DESC LIMIT 1);",
 "hint":"Resolve the inner question first — which department id has the biggest budget — then filter on it."},

{"id":17,"tier":4,"title":"Anti-join with NOT EXISTS","task":"Employees not assigned to any project.","want":"one column: name — 2 rows","ordered":false,
 "ref":"SELECT name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM assignments a WHERE a.emp_id = e.id);",
 "hint":"NOT EXISTS or a LEFT JOIN ... IS NULL both work. Prefer them over NOT IN, because NOT IN returns nothing at all if the subquery yields a single NULL."},

{"id":18,"tier":5,"title":"DENSE_RANK over ties","task":"Every employee with their salary and a dense rank by salary, highest paid getting rank 1. Tied salaries must share a rank with no gap after them.","want":"three columns: name, salary, rank — 10 rows","ordered":false,
 "ref":"SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r FROM employees;",
 "hint":"RANK leaves gaps after a tie (1,2,2,4). DENSE_RANK does not (1,2,2,3). ROW_NUMBER refuses to tie at all. The wording decides which one."},

{"id":19,"tier":5,"title":"Top one per group","task":"The highest paid employee in each department. Include ties. Skip the employee with no department.","want":"three columns: dept_id, name, salary — 5 rows","ordered":false,
 "ref":"SELECT dept_id, name, salary FROM (SELECT dept_id, name, salary, RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employees WHERE dept_id IS NOT NULL) t WHERE r = 1;",
 "hint":"PARTITION BY restarts the ranking for each department. You cannot filter on a window function in WHERE directly — wrap it in a subquery and filter outside. Two departments have ties, so five rows, not three."},

{"id":20,"tier":5,"title":"Running total","task":"Employees ordered by hire date, each with a running total of salary up to and including that row.","want":"three columns: name, salary, running total — 10 rows, ordered by hire_date","ordered":true,
 "ref":"SELECT name, salary, SUM(salary) OVER (ORDER BY hire_date) AS rt FROM employees ORDER BY hire_date;",
 "hint":"An aggregate with OVER (ORDER BY ...) accumulates instead of collapsing. The default frame is everything from the start up to the current row."},

{"id":21,"tier":5,"title":"Reach into the previous row","task":"Employees ordered by hire date, each showing their own salary and the salary of the person hired immediately before them.","want":"three columns: name, salary, previous salary (NULL on the first row) — 10 rows, ordered","ordered":true,
 "ref":"SELECT name, salary, LAG(salary) OVER (ORDER BY hire_date) AS prev FROM employees ORDER BY hire_date;",
 "hint":"LAG looks backwards, LEAD looks forwards. The first row has nothing behind it, so it gets NULL."},

{"id":22,"tier":6,"title":"Nth highest salary","task":"The third highest distinct salary. This is the single most frequently asked SQL question in assessments.","want":"one column, 1 row: 98000","ordered":false,
 "ref":"SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 2;",
 "hint":"OFFSET skips rows before LIMIT takes them, so the Nth highest is OFFSET N-1. The window-function version uses DENSE_RANK() = N. Know both — interviewers ask for the second one after you give the first.",
 "dialect":"In Postgres and MySQL this is LIMIT 1 OFFSET 2. In SQL Server there is no LIMIT: you use OFFSET 2 ROWS FETCH NEXT 1 ROWS ONLY, or DENSE_RANK in a subquery. The DENSE_RANK version is the one that ports everywhere."},

{"id":23,"tier":6,"title":"Find the duplicates","task":"Which salary values are shared by more than one employee? Show the salary and how many people are on it.","want":"two columns: salary, count — 2 rows","ordered":false,
 "ref":"SELECT salary, COUNT(*) AS n FROM employees GROUP BY salary HAVING COUNT(*) > 1;",
 "hint":"Group by the thing you suspect is duplicated, then HAVING COUNT(*) > 1. Same shape as the classic duplicate-email question."},

{"id":24,"tier":6,"title":"Consecutive days","task":"Which employees logged in on three or more consecutive days? Show the employee id.","want":"one column: emp_id — 2 rows","ordered":false,
 "ref":"SELECT DISTINCT a.emp_id FROM logins a JOIN logins b ON a.emp_id = b.emp_id AND b.login_date = date(a.login_date,'+1 day') JOIN logins c ON a.emp_id = c.emp_id AND c.login_date = date(a.login_date,'+2 day');",
 "hint":"Self-join the table to itself twice, offsetting the date by one and two days. The modern alternative is a window function: subtract ROW_NUMBER() from the date and group by the result, since a constant difference means an unbroken run.",
 "dialect":"Date arithmetic is the least portable part of SQL. Here it is date(d,'+1 day') for SQLite; Postgres uses d + INTERVAL '1 day', MySQL uses DATE_ADD(d, INTERVAL 1 DAY). The logic is identical — only the function name changes."}
]
</script>

<script type="application/json" id="mat">{"topics":[{"id":"dbms-intro","group":"A. DBMS fundamentals","title":"DBMS, RDBMS, architecture and SQL families","intro":"A **database** is an organised collection of related data. A **DBMS** is the software that stores, retrieves, protects and shares it. An **RDBMS** is a DBMS built on the relational model: data lives in tables (relations) linked by keys. PostgreSQL, MySQL, Oracle and SQL Server are RDBMSs.","blocks":[{"k":"h","t":"File system vs DBMS"},{"k":"table","head":["Problem in file systems","How a DBMS fixes it"],"rows":[["Redundancy and inconsistency: same data copied in many files","One central store; normalization removes duplicates"],["Hard to query: every new question needs a new program","A declarative query language (SQL)"],["No atomic updates: a crash half-way leaves files wrong","Transactions: all or nothing"],["Concurrent access corrupts data","Locking and MVCC isolate users"],["No security granularity","Users, roles, GRANT/REVOKE, row-level policies"],["Integrity rules live in application code","Constraints enforced by the engine (PK, FK, CHECK)"],["Programs depend on file layout","Data independence (see below)"]]},{"k":"h","t":"Three-schema architecture"},{"k":"ul","t":["**External level (view level):** what each user group sees. Views live here.","**Conceptual (logical) level:** the whole database structure: tables, columns, constraints. One per database.","**Internal (physical) level:** files, pages, indexes, storage format."]},{"k":"p","t":"The mappings between levels give **data independence**."},{"k":"table","head":["Independence","Meaning","Example"],"rows":[["Logical data independence","Change the conceptual schema without changing external views or programs","Add a column to a table; existing views still work"],["Physical data independence","Change the physical storage without changing the conceptual schema","Add an index or move a table to another disk; queries are unchanged"]]},{"k":"note","t":"Physical independence is easier to achieve and is the one every real DBMS delivers. Logical independence is harder because programs often depend on column lists."},{"k":"h","t":"Tiers"},{"k":"ul","t":["**1-tier:** user works directly on the DBMS (psql, MySQL shell).","**2-tier:** client application talks straight to the DB server (JDBC/ODBC).","**3-tier:** client, application server, database server. Web apps use this; the browser never touches the DB."]},{"k":"h","t":"Components of a DBMS"},{"k":"ul","t":["**Query processor:** DDL interpreter, DML compiler (parser, rewriter, optimizer), executor.","**Storage manager:** buffer manager, file manager, authorisation and integrity manager, transaction manager (lock manager, recovery manager).","**Data dictionary (catalog):** metadata about tables, columns, indexes, users. In PostgreSQL see pg_catalog and information_schema; MySQL has information_schema."]},{"k":"h","t":"SQL sub-languages"},{"k":"table","head":["Family","Full name","Commands","Purpose"],"rows":[["DDL","Data Definition Language","CREATE, ALTER, DROP, TRUNCATE, RENAME, COMMENT","Define structure"],["DML","Data Manipulation Language","INSERT, UPDATE, DELETE, MERGE","Change data"],["DQL","Data Query Language","SELECT","Read data (some books fold it into DML)"],["DCL","Data Control Language","GRANT, REVOKE","Permissions"],["TCL","Transaction Control Language","COMMIT, ROLLBACK, SAVEPOINT, SET TRANSACTION","Group statements atomically"]]},{"k":"trap","t":"TRUNCATE is DDL in the textbooks. In MySQL it commits implicitly and cannot be rolled back. In PostgreSQL it IS transactional and can be rolled back inside a transaction."},{"k":"h","t":"Database users"},{"k":"ul","t":["**DBA:** installs, tunes, secures, backs up.","**Application programmers:** write code against the DB.","**Naive users:** use forms and apps.","**Sophisticated users:** write ad-hoc SQL (analysts)."]},{"k":"h","t":"Codd's rules in one line each"},{"k":"p","t":"Information rule (everything is in tables), guaranteed access (table + key + column finds any value), systematic NULL treatment, active online catalog, comprehensive data sub-language, view updating, high-level insert/update/delete, physical data independence, logical data independence, integrity independence, distribution independence, non-subversion (no low-level bypass). Rule 0: the system must manage data using relational capabilities only."},{"k":"ask","t":"\"Difference between DBMS and RDBMS?\" Say: DBMS may store data as files, hierarchies or documents with no required relationships; RDBMS stores data in related tables, enforces keys and constraints, supports SQL and ACID transactions, and follows Codd's rules."}],"test":[{"q":"Changing the storage structure of a table (adding an index) without changing queries demonstrates:","o":["Normalization","Logical data independence","Physical data independence","Referential integrity"],"a":2,"w":"Physical layer changed, conceptual and external layers untouched."},{"q":"Which level of the three-schema architecture does a VIEW belong to?","o":["Physical","Conceptual","Internal","External"],"a":3,"w":"Views are tailored per user group, which is the external level."},{"q":"Which of these is a DCL command?","o":["REVOKE","MERGE","SAVEPOINT","TRUNCATE"],"a":0,"w":"GRANT and REVOKE control permissions. SAVEPOINT is TCL, MERGE is DML, TRUNCATE is DDL."},{"q":"In MySQL, TRUNCATE TABLE inside a transaction:","o":["Is blocked","Commits implicitly and cannot be rolled back","Can be rolled back","Only deletes uncommitted rows"],"a":1,"w":"DDL statements cause an implicit commit in MySQL. PostgreSQL differs: TRUNCATE is transactional."},{"q":"The component that decides the cheapest way to execute a query is the:","o":["Buffer manager","Recovery manager","Lock manager","Query optimizer"],"a":3,"w":"The optimizer chooses a plan from many equivalent ones using statistics and cost estimates."}],"star":true,"kw":"dbms rdbms architecture schema independence ddl dml dcl tcl codd","mins":30},{"id":"er-model","group":"A. DBMS fundamentals","title":"ER model: entities, attributes, relationships","intro":"The ER model describes data before any table exists. Interviews ask you to read a scenario and draw or list entities, attributes, relationship types, cardinality and participation. Do this first, then map to tables.","blocks":[{"k":"h","t":"Building blocks"},{"k":"table","head":["Concept","Meaning","Example"],"rows":[["Entity","A real-world thing that can be told apart","Student 'Asha'"],["Entity set","All entities of one type","STUDENT"],["Strong entity","Has its own key","STUDENT(roll_no)"],["Weak entity","No key of its own; identified through an owner entity plus a partial key (discriminator)","DEPENDENT of EMPLOYEE (identified by employee + dependent name)"],["Attribute","Property of an entity or relationship","name, dob"],["Relationship","Association between entity sets","STUDENT enrolls_in COURSE"]]},{"k":"h","t":"Kinds of attributes"},{"k":"table","head":["Kind","Meaning","Example","Drawn as"],"rows":[["Simple (atomic)","Cannot be split","age","oval"],["Composite","Made of sub-parts","address = street + city + pin","oval with child ovals"],["Single-valued","One value","dob","oval"],["Multivalued","Many values","phone numbers, skills","double oval"],["Derived","Computed from others","age from dob","dashed oval"],["Key attribute","Identifies the entity","roll_no","underlined"],["Partial key","Identifies a weak entity within its owner","dependent_name","dashed underline"]]},{"k":"h","t":"Relationships"},{"k":"ul","t":["**Degree:** unary (recursive, e.g. EMPLOYEE manages EMPLOYEE), binary (most common), ternary (three entity sets at once, e.g. SUPPLIER supplies PART to PROJECT).","**Cardinality ratio:** 1:1, 1:N, N:1, M:N.","**Participation:** **total** (every entity must take part, double line) or **partial** (some may not, single line).","A relationship can carry its own attributes: ENROLLS has grade and semester."]},{"k":"table","head":["Scenario","Cardinality","Participation"],"rows":[["One department has many employees; each employee works in exactly one department","DEPARTMENT 1 : N EMPLOYEE","EMPLOYEE total, DEPARTMENT partial (a department may be empty)"],["A student enrolls in many courses; a course has many students","STUDENT M : N COURSE","usually partial on both sides"],["Each person has at most one passport; each passport belongs to exactly one person","PERSON 1 : 1 PASSPORT","PASSPORT total, PERSON partial"],["An employee manages many employees; each employee has at most one manager","EMPLOYEE 1 : N EMPLOYEE (recursive)","partial on both"]]},{"k":"h","t":"Extended ER"},{"k":"ul","t":["**Specialization:** split an entity set into sub-classes (EMPLOYEE into ENGINEER, MANAGER). Top-down.","**Generalization:** merge similar entity sets into a super-class. Bottom-up.","**Constraints on the hierarchy:** **disjoint** (an entity is in at most one subclass) vs **overlapping**; **total** (every super-class entity is in some subclass) vs **partial**.","**Inheritance:** subclasses inherit the attributes and relationships of the super-class (an 'is-a' relationship).","**Aggregation:** treat a relationship as an entity so it can participate in another relationship (e.g. PROJECT is_assigned_to (EMPLOYEE works_on COURSE))."]},{"k":"h","t":"Reading a scenario"},{"k":"p","t":"Nouns become entities or attributes, verbs become relationships. Look for words that give cardinality: 'each', 'at most one', 'many', 'exactly one', 'may have none'. Then ask for each entity: what uniquely identifies it?"},{"k":"code","lang":"txt","code":"Scenario: A hospital has doctors and patients. A doctor treats many patients, a patient may see many doctors. Each visit has a date and diagnosis. Each doctor belongs to one department.\n\nEntities     DOCTOR(doctor_id, name, phone[multi]), PATIENT(patient_id, name, dob, age[derived]), DEPARTMENT(dept_id, name)\nRelationships DOCTOR  M:N  PATIENT   via TREATS(visit_date, diagnosis)\n              DEPARTMENT 1:N DOCTOR  via WORKS_IN   (DOCTOR total)","cap":"worked example","run":false},{"k":"ask","t":"\"What is a weak entity?\" An entity that cannot be identified by its own attributes alone; it depends on an owner via an identifying relationship and has total participation in it. Its primary key in tables = owner's key + partial key."}],"test":[{"q":"A multivalued attribute such as 'phone numbers' is drawn as:","o":["An underlined oval","A double oval","A single oval","A dashed oval"],"a":1,"w":"Double oval = multivalued. Dashed = derived. Underlined = key."},{"q":"Which is a weak entity?","o":["COURSE with course_id","DEPENDENT identified by employee_id + dependent_name","BOOK with isbn","STUDENT with roll_no"],"a":1,"w":"DEPENDENT has no key of its own and is identified through EMPLOYEE."},{"q":"Each employee works in exactly one department; a department can have many employees. The relationship is:","o":["1:N from DEPARTMENT to EMPLOYEE","1:1","M:N","N:1 from DEPARTMENT to EMPLOYEE"],"a":0,"w":"One department, many employees: 1:N from DEPARTMENT to EMPLOYEE."},{"q":"Splitting EMPLOYEE into ENGINEER and MANAGER is called:","o":["Normalization","Denormalization","Specialization","Aggregation"],"a":2,"w":"Top-down splitting into sub-classes is specialization. Merging them back is generalization."},{"q":"Total participation means:","o":["Every entity in the set must take part in the relationship","The relationship is 1:1","Some entities may not take part","The entity is weak"],"a":0,"w":"Total (drawn with a double line) = every entity participates."}],"star":true,"kw":"er diagram entity weak attribute cardinality participation specialization generalization aggregation","mins":25},{"id":"er-to-tables","group":"A. DBMS fundamentals","title":"Mapping ER to tables (the design recipe)","intro":"Scenario questions ask 'design the tables for this'. Apply these rules mechanically and you get correct tables, keys and foreign keys without thinking twice.","blocks":[{"k":"h","t":"The seven rules"},{"k":"ol","t":["**Strong entity** becomes a table; its key becomes the primary key; simple and flattened composite attributes become columns.","**Weak entity** becomes a table whose primary key = owner's primary key + partial key. The owner's key is also a foreign key (ON DELETE CASCADE is typical).","**1:N relationship:** put a foreign key on the N side (the 'many' side) pointing to the 1 side. Relationship attributes go with it.","**1:1 relationship:** put the foreign key on the side with total participation and make it UNIQUE. If both are total, consider merging into one table.","**M:N relationship:** a new junction (associative) table with a foreign key to each side. Primary key is the pair (or a surrogate id). Relationship attributes live here.","**Multivalued attribute:** a new table (owner key, value). Primary key is the pair.","**Higher-degree (ternary) relationship:** one table with a foreign key to each participant plus its attributes."]},{"k":"table","head":["ER feature","Table result"],"rows":[["Composite address","street, city, pin as separate columns"],["Derived age","not stored (compute from dob in a query or view)"],["Recursive 1:N manager","manager_id column in the same table, FK to its own primary key"],["M:N with attributes","junction table holding those attributes (grade in ENROLLMENT)"]]},{"k":"h","t":"Worked example: university"},{"k":"code","lang":"sql","code":"CREATE TABLE dept (\n  dept_id   INTEGER PRIMARY KEY,\n  name      TEXT NOT NULL UNIQUE\n);\nCREATE TABLE student (\n  roll_no   INTEGER PRIMARY KEY,\n  name      TEXT NOT NULL,\n  dept_id   INTEGER NOT NULL REFERENCES dept(dept_id)   -- 1:N, FK on the many side\n);\nCREATE TABLE course (\n  course_id INTEGER PRIMARY KEY,\n  title     TEXT NOT NULL,\n  credits   INTEGER CHECK (credits BETWEEN 1 AND 6)\n);\nCREATE TABLE enrollment (                                -- M:N becomes a junction table\n  roll_no   INTEGER REFERENCES student(roll_no) ON DELETE CASCADE,\n  course_id INTEGER REFERENCES course(course_id),\n  grade     TEXT,\n  PRIMARY KEY (roll_no, course_id)\n);\nCREATE TABLE student_phone (                             -- multivalued attribute\n  roll_no   INTEGER REFERENCES student(roll_no) ON DELETE CASCADE,\n  phone     TEXT,\n  PRIMARY KEY (roll_no, phone)\n);\nINSERT INTO dept VALUES (1,'CSE');\nINSERT INTO student VALUES (10,'Asha',1);\nINSERT INTO course VALUES (100,'DBMS',4);\nINSERT INTO enrollment VALUES (10,100,'A');\nSELECT s.name, c.title, e.grade\nFROM enrollment e JOIN student s ON s.roll_no = e.roll_no JOIN course c ON c.course_id = e.course_id;","cap":"runs on a throwaway copy of the sample DB","run":true},{"k":"h","t":"Weak entity example"},{"k":"code","lang":"sql","code":"CREATE TABLE emp (emp_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE dependent (\n  emp_id  INTEGER NOT NULL REFERENCES emp(emp_id) ON DELETE CASCADE,\n  dep_name TEXT NOT NULL,          -- partial key\n  relation TEXT,\n  PRIMARY KEY (emp_id, dep_name)   -- owner key + partial key\n);","cap":"weak entity","run":true},{"k":"h","t":"Mapping a hierarchy (specialization)"},{"k":"table","head":["Option","How","Good when","Cost"],"rows":[["A. Table per class","One table for the super-class, one per subclass sharing the same PK (PK is also FK to the parent)","Subclasses have many own attributes; queries often need only the parent","Joins to see full object"],["B. Table per subclass only","Each subclass table holds ALL attributes, no parent table","Hierarchy is total and disjoint","Parent-wide queries need UNION; overlapping breaks"],["C. Single table","One wide table plus a type column; subclass-only columns are NULL","Few subclass attributes, simple queries","Many NULLs, weak constraints"],["D. Single table with several flags","Boolean type flags","Overlapping subclasses","Same drawbacks as C"]]},{"k":"ask","t":"\"How do you represent a many-to-many relationship?\" With a junction table holding the two foreign keys as a composite primary key plus relationship attributes. Name the table after the business fact (enrollment, order_item), not 'student_course_link'."}],"test":[{"q":"Where does the foreign key go in a 1:N relationship between DEPARTMENT (1) and EMPLOYEE (N)?","o":["In EMPLOYEE","In both","In DEPARTMENT","In a new junction table"],"a":0,"w":"The foreign key sits on the many side and points to the one side."},{"q":"An M:N relationship ENROLLS with attribute grade becomes:","o":["Not representable","A grade column in STUDENT","A grade column in COURSE","A junction table with two FKs and grade"],"a":3,"w":"Junction table holding both keys and the relationship's own attribute."},{"q":"A weak entity's primary key is:","o":["Its partial key alone","A new surrogate only","Owner's key alone","Owner's key plus partial key"],"a":3,"w":"Owner key + partial key; the owner key is also an FK."},{"q":"A multivalued attribute 'skills' of EMPLOYEE is stored as:","o":["A comma-separated text column","A separate table (emp_id, skill)","Nothing; it is ignored","A derived column"],"a":1,"w":"First normal form forbids repeating groups. Use a child table."},{"q":"Which mapping rule is right for a 1:1 relationship where one side has total participation?","o":["FK on the partial side with no UNIQUE","No FK needed","A junction table is mandatory","FK + UNIQUE on the total side"],"a":3,"w":"Put the FK on the total-participation side and make it UNIQUE so only one row can point to each parent."}],"star":true,"kw":"er mapping junction weak entity design tables hierarchy","mins":20},{"id":"relational-keys","group":"B. Relational model and normalization","title":"Relational model and every kind of key","intro":"This is the topic they ask most directly: super key, candidate key, primary key, alternate key, foreign key, composite key, surrogate key. Learn the definitions as a ladder, then practise counting super keys.","blocks":[{"k":"h","t":"Terms"},{"k":"table","head":["Term","Meaning"],"rows":[["Relation","A table: a set of tuples over attributes"],["Tuple","A row"],["Attribute","A column"],["Domain","The set of legal values of an attribute (type + constraints)"],["Degree (arity)","Number of attributes (columns)"],["Cardinality","Number of tuples (rows)"],["Schema vs instance","Schema = structure (changes rarely). Instance = the data at one moment."],["Properties of a relation","Rows are unique, row order and column order are irrelevant, every value is atomic, every column has a distinct name"]]},{"k":"h","t":"The key ladder"},{"k":"table","head":["Key","Definition","Example in STUDENT(roll_no, email, name, phone, dept_id)"],"rows":[["Super key","Any set of attributes that uniquely identifies a row. May contain extras.","{roll_no}, {roll_no, name}, {email, phone}, {roll_no, email, name}"],["Candidate key","A MINIMAL super key: remove any attribute and uniqueness is lost.","{roll_no}, {email}"],["Primary key","The one candidate key chosen as the main identifier. Not NULL, unique.","{roll_no}"],["Alternate key","Candidate keys that were not chosen as primary.","{email}"],["Composite key","A key made of two or more attributes.","{student_id, course_id} in ENROLLMENT"],["Foreign key","Attribute(s) whose values must appear as a key (usually the primary key) of another table (or the same table).","dept_id references DEPT(dept_id)"],["Unique key","A UNIQUE constraint. May allow NULLs (details differ by DBMS).","email"],["Natural key","Real-world identifier","email, passport number, ISBN"],["Surrogate key","System-generated, meaningless identifier","id SERIAL / AUTO_INCREMENT / UUID"],["Secondary / non-key attribute","Any attribute not part of a candidate key","name, phone"]]},{"k":"note","t":"Ladder: every primary key is a candidate key, every candidate key is a super key. Not the other way round."},{"k":"h","t":"Prime and non-prime attributes"},{"k":"p","t":"An attribute is **prime** if it belongs to at least one candidate key, otherwise **non-prime**. Normal-form definitions depend on this split."},{"k":"h","t":"Counting super keys (very common MCQ)"},{"k":"ul","t":["A relation with n attributes and **one single-attribute candidate key** has **2^(n-1)** super keys (the key plus any subset of the other n-1).","R(A,B,C,D), candidate key {A}: 2^3 = **8** super keys.","R(A,B,C,D), candidate keys {A} and {B}: supersets of A (8) + supersets of B (8) - supersets of both A and B (4) = **12**.","R(A,B,C,D), candidate key {A,B}: supersets of AB = 2^2 = **4**.","R(A,B,C), candidate keys {A,B} and {B,C}: supersets of AB (2) + supersets of BC (2) - supersets of ABC (1) = **3**."]},{"k":"p","t":"Method: super keys = union of all supersets of each candidate key. Use inclusion-exclusion."},{"k":"h","t":"Integrity constraints"},{"k":"table","head":["Constraint","Rule"],"rows":[["Domain","A value must belong to its attribute's domain (type, range, CHECK)"],["Entity integrity","No part of a primary key may be NULL"],["Key constraint","No two rows share the same value of a candidate key"],["Referential integrity","A foreign key value must match an existing key value in the parent table, or be NULL"],["Semantic (business) constraints","Triggers, CHECK, assertions: e.g. salary must not exceed manager's salary"]]},{"k":"h","t":"What happens on delete or update of a parent row"},{"k":"table","head":["Action","Effect on child rows"],"rows":[["NO ACTION / RESTRICT","Operation on the parent is rejected if children exist (RESTRICT checks immediately; NO ACTION checks at end of statement and can be deferred in PostgreSQL)"],["CASCADE","Delete or update the children too"],["SET NULL","Child FK becomes NULL (column must allow NULL)"],["SET DEFAULT","Child FK becomes its default (PostgreSQL; MySQL InnoDB parses but rejects it)"]]},{"k":"trap","t":"A foreign key may be NULL (unless declared NOT NULL) and it need not be UNIQUE. A foreign key may reference any UNIQUE or primary key column, not only the primary key."},{"k":"h","t":"Worked key-finding question"},{"k":"code","lang":"txt","code":"R(A, B, C, D) with candidate keys {A} and {B,C}.\n\nSuper keys containing A:        2^3 = 8\nSuper keys containing B and C:  2^2 = 4\nContaining both (A, B, C):      2^1 = 2\nTotal = 8 + 4 - 2 = 10","cap":"counting","run":false},{"k":"ask","t":"\"Difference between primary key and unique key?\" Primary key: one per table, NOT NULL implied, identifies the row. Unique: many per table, NULLs allowed (PostgreSQL and MySQL allow multiple NULLs; SQL Server allows only one)."},{"k":"ask","t":"\"Candidate key vs super key?\" Every candidate key is a super key, but a candidate key is minimal: no attribute can be dropped. Super keys can carry redundant attributes."}],"test":[{"q":"R(A,B,C,D) has the single candidate key {A}. How many super keys does R have?","o":["8","16","4","15"],"a":0,"w":"A plus any subset of {B,C,D}: 2^3 = 8."},{"q":"R(A,B,C,D) has candidate keys {A} and {B}. How many super keys?","o":["12","10","16","8"],"a":0,"w":"8 + 8 - 4 = 12."},{"q":"Which statement is false?","o":["A table may have several candidate keys","Every primary key is a candidate key","A candidate key can contain a redundant attribute","Every candidate key is a super key"],"a":2,"w":"Candidate keys are minimal, so they never contain redundant attributes."},{"q":"A foreign key column:","o":["Must be the primary key of its own table","Can be NULL and need not be unique","Must be UNIQUE","Cannot be NULL"],"a":1,"w":"FK values may repeat (many children per parent) and may be NULL unless declared otherwise."},{"q":"ON DELETE SET NULL requires that the FK column:","o":["Is declared NOT NULL","Has a default","Allows NULL","Is part of the primary key"],"a":2,"w":"You cannot set a column to NULL if it forbids NULL. A PK column can never be NULL."},{"q":"An attribute that belongs to some candidate key is called:","o":["Prime","Surrogate","Non-prime","Derived"],"a":0,"w":"Prime attributes appear in at least one candidate key."}],"star":true,"kw":"super key candidate key primary key foreign key alternate composite surrogate natural unique integrity referential","mins":30},{"id":"relational-algebra","group":"B. Relational model and normalization","title":"Relational algebra and calculus","intro":"Relational algebra is the theory behind SQL and behind the query optimizer. GATE-style questions and many interviews ask you to write or read an algebra expression, or to say what a query returns.","blocks":[{"k":"h","t":"Operators"},{"k":"table","head":["Operator","Symbol","SQL equivalent","Notes"],"rows":[["Selection","σ condition (R)","WHERE","Filters rows"],["Projection","π a, b (R)","SELECT DISTINCT a, b","Picks columns; removes duplicates in pure algebra"],["Rename","ρ x (R)","AS alias",""],["Union","R ∪ S","UNION","Union-compatible: same number and types of columns"],["Difference","R − S","EXCEPT / MINUS",""],["Intersection","R ∩ S","INTERSECT","R ∩ S = R − (R − S)"],["Cartesian product","R × S","CROSS JOIN","|R| × |S| rows"],["Theta join","R ⋈θ S","JOIN ... ON","σθ (R × S)"],["Equi join","R ⋈ S on equality","JOIN ... ON a = b","Theta join with ="],["Natural join","R ⋈ S","NATURAL JOIN","Equi join on all common attribute names, keeps one copy"],["Outer joins","⟕ ⟖ ⟗","LEFT/RIGHT/FULL JOIN","Keep unmatched rows with NULLs"],["Semi join","R ⋉ S","WHERE EXISTS / IN","Rows of R that have a match in S, only R's columns"],["Anti join","R ▷ S","WHERE NOT EXISTS","Rows of R without a match"],["Division","R ÷ S","double NOT EXISTS","'for all' queries"],["Aggregation","γ group; f(a) (R)","GROUP BY","Extended algebra"]]},{"k":"h","t":"Examples on the sample schema"},{"k":"code","lang":"txt","code":"π name (σ salary > 100000 (employee))\n   -> SELECT name FROM employees WHERE salary > 100000;\n\nπ name, dept_name (employee ⋈ employee.dept_id = department.id department)\n   -> SELECT e.name, d.name FROM employees e JOIN departments d ON e.dept_id = d.id;\n\nπ id (department) − π dept_id (employee)\n   -> departments that have no employee (set difference)","cap":"algebra and its SQL","run":false},{"k":"code","lang":"sql","code":"SELECT id FROM departments\nEXCEPT\nSELECT dept_id FROM employees;","cap":"departments with no employee","run":true},{"k":"h","t":"Division (for-all queries)"},{"k":"p","t":"R(student, course) ÷ S(course) gives the students who took EVERY course in S. SQL has no division operator; use double NOT EXISTS: there is no required course for which this student has no row."},{"k":"code","lang":"sql","code":"-- employees who work on EVERY project in dept 1  (projects 1 and 4)\nSELECT e.id, e.name\nFROM employees e\nWHERE NOT EXISTS (\n  SELECT 1 FROM projects p\n  WHERE p.dept_id = 1\n    AND NOT EXISTS (\n      SELECT 1 FROM assignments a\n      WHERE a.emp_id = e.id AND a.project_id = p.id));","cap":"division in SQL","run":true},{"k":"h","t":"Useful identities"},{"k":"ul","t":["Cascade of selections: σc1 (σc2 (R)) = σc1∧c2 (R)","Push selection through join: σc (R ⋈ S) = σc (R) ⋈ S when c uses only attributes of R. The optimizer does this to shrink inputs early.","Projection can be pushed down but must keep join attributes.","Joins are commutative and associative: R ⋈ S = S ⋈ R. The optimizer picks the cheapest order.","Size of R × S = |R| × |S| rows and (columns of R + columns of S) columns."]},{"k":"h","t":"Result sizes (typical MCQ)"},{"k":"table","head":["Expression","Rows"],"rows":[["R ∪ S","between max(|R|,|S|) and |R| + |S|"],["R ∩ S","between 0 and min(|R|,|S|)"],["R − S","between 0 and |R|"],["R × S","exactly |R| × |S|"],["Natural join, no common attributes","same as R × S"],["Natural join of R with S where common attribute is a key of S and a FK in R","exactly |R| when every FK matches"]]},{"k":"h","t":"Relational calculus in two lines"},{"k":"ul","t":["**Tuple relational calculus (TRC):** { t | EMPLOYEE(t) ∧ t.salary > 100000 }. Variables range over tuples.","**Domain relational calculus (DRC):** { <n, s> | ∃e (<e, n, s> ∈ EMPLOYEE ∧ s > 100000) }. Variables range over attribute values.","Calculus is declarative, algebra is procedural. Both have the same power when queries are **safe** (finite results). SQL is based on TRC plus algebra features."]},{"k":"note","t":"Algebra works on **sets** (no duplicate rows). SQL works on **bags** (duplicates allowed unless DISTINCT)."}],"test":[{"q":"Which operator corresponds to the SQL WHERE clause?","o":["÷ (division)","ρ (rename)","σ (selection)","π (projection)"],"a":2,"w":"Selection filters rows, projection chooses columns."},{"q":"R has 5 rows and S has 4 rows. How many rows in R × S?","o":["9","5","20","Cannot say"],"a":2,"w":"Cartesian product multiplies: 5 × 4 = 20."},{"q":"Which SQL idiom implements relational division?","o":["UNION ALL","LEFT JOIN ... IS NULL only","Double NOT EXISTS","GROUP BY HAVING"],"a":2,"w":"'There is no required item that the entity lacks' = NOT EXISTS (… NOT EXISTS …)."},{"q":"The natural join joins on:","o":["Columns with the same name in both tables","The first column of each","All columns","The primary keys only"],"a":0,"w":"Natural join pairs equal values of all same-named columns and keeps one copy of each."},{"q":"R ∩ S can be written as:","o":["R ∪ (R − S)","(R − S) − S","R − (R − S)","R × S"],"a":2,"w":"Remove from R everything that is not in S: R − (R − S)."}],"star":false,"kw":"relational algebra calculus selection projection join division union","mins":25},{"id":"functional-deps","group":"B. Relational model and normalization","title":"Functional dependencies, closure and finding keys","intro":"Everything in normalization rests on functional dependencies. Master attribute closure and you can find all candidate keys, test normal forms and compute a minimal cover quickly.","blocks":[{"k":"h","t":"Definition"},{"k":"p","t":"X → Y (X determines Y) holds in R if whenever two rows agree on X they must agree on Y. Roll number → name is a functional dependency; name → roll number is not (two students can share a name)."},{"k":"table","head":["Kind","Meaning","Example"],"rows":[["Trivial","Y ⊆ X","AB → A"],["Non-trivial","Y ⊄ X","A → B"],["Completely non-trivial","X ∩ Y = ∅","A → B (not AB → BC)"],["Full FD","Y depends on all of X, not a proper subset","{student, course} → grade"],["Partial FD","Y depends on a proper subset of a (composite) key","{student, course} → student_name, since student → student_name"],["Transitive FD","X → Y and Y → Z with Y not a key, so X → Z indirectly","emp_id → dept_id → dept_name"]]},{"k":"h","t":"Armstrong's axioms (sound and complete)"},{"k":"ul","t":["**Reflexivity:** if Y ⊆ X then X → Y","**Augmentation:** if X → Y then XZ → YZ","**Transitivity:** if X → Y and Y → Z then X → Z"]},{"k":"p","t":"Derived rules: **Union** (X → Y, X → Z gives X → YZ), **Decomposition** (X → YZ gives X → Y and X → Z), **Pseudo-transitivity** (X → Y, WY → Z gives WX → Z). Note: AB → C does NOT give A → C or B → C."},{"k":"h","t":"Attribute closure X+ (the main tool)"},{"k":"ol","t":["Start with result = X.","Repeat: for every FD L → R in F, if L ⊆ result then add R to result.","Stop when nothing new is added. That set is X+."]},{"k":"p","t":"**Uses:** (1) X is a super key iff X+ is all attributes. (2) X → Y follows from F iff Y ⊆ X+. (3) Test equivalence of two FD sets."},{"k":"code","lang":"txt","code":"R(A,B,C,D,E)   F = { A → B,  BC → D,  D → E }\n\n(AC)+ : start {A,C}\n        A → B gives {A,B,C}\n        BC → D gives {A,B,C,D}\n        D → E gives {A,B,C,D,E}   = all attributes, so AC is a super key\nA+  = {A,B}        C+ = {C}      neither is a key, so AC is minimal: candidate key","cap":"worked closure","run":false},{"k":"h","t":"Finding all candidate keys quickly"},{"k":"ol","t":["Attributes that appear on **no right-hand side** must be in every key. Start from them.","Attributes that appear **only on right-hand sides** are in no key.","Compute the closure of the must-have set. If it is everything, that is the only key.","Otherwise add one more attribute at a time (middle attributes) and test closures. Keep only minimal sets."]},{"k":"code","lang":"txt","code":"R(A,B,C,D)  F = { A → B, B → C, C → D, D → A }\nNo attribute is forced. Each of A+, B+, C+, D+ = {A,B,C,D}.\nCandidate keys: A, B, C, D   (four keys, all single attributes, all prime)","cap":"cyclic dependencies give many keys","run":false},{"k":"code","lang":"txt","code":"R(A,B,C,D,E)  F = { AB → C, C → D, D → E, E → B }\nA is on no RHS so A is in every key.  A+ = {A}.\nTry AB: AB+ = {A,B,C,D,E}. Key.\nTry AC: C → D → E → B so AC+ = all. Key.  AD: D → E → B, then AB → C: key.  AE: E → B, AB → C...: key.\nCandidate keys: AB, AC, AD, AE.","cap":"several keys","run":false},{"k":"h","t":"Equivalence and minimal (canonical) cover"},{"k":"p","t":"Two FD sets F and G are equivalent if every FD of F follows from G and vice versa. A **minimal cover** is a smallest equivalent set where (1) every right side is a single attribute, (2) no left-side attribute is extraneous, (3) no FD is redundant."},{"k":"ol","t":["Split right sides to single attributes.","Remove extraneous left-side attributes: in AB → C, B is extraneous if C ∈ A+ computed using F.","Remove redundant FDs: drop X → A if A ∈ X+ computed without that FD."]},{"k":"code","lang":"txt","code":"F = { A → BC, B → C, A → B, AB → C }\nStep 1: A → B, A → C, B → C, A → B, AB → C\nStep 2: AB → C: A+ already has C (A → C), so B is extraneous -> A → C\nStep 3: A → C is redundant (A → B → C).  Remove duplicates.\nMinimal cover: { A → B, B → C }","cap":"worked minimal cover","run":false},{"k":"trap","t":"A minimal cover is not unique, but all minimal covers have the same number of FDs only in simple cases. Do the three steps in order: splitting, then extraneous attributes, then redundant FDs."},{"k":"ask","t":"\"Given R and FDs, find the candidate keys\" and \"what is the highest normal form\" are the two most frequent DBMS theory questions. Practise the closure method until it is automatic."}],"test":[{"q":"R(A,B,C,D), F = {A→B, B→C}. What is A+?","o":["{A,B}","{A,B,C}","{A}","{A,B,C,D}"],"a":1,"w":"A → B gives B, B → C gives C. D is not reached."},{"q":"R(A,B,C,D), F = {A→B, B→C}. The candidate key(s) are:","o":["{A,C,D}","{A,D}","{A,B,D}","{A}"],"a":1,"w":"A and D never appear on a RHS (D not at all, A not at all) so both must be in the key. AD+ = ABCD."},{"q":"Which does NOT follow from AB → C?","o":["A → C","ABD → CD","AB → ABC","AB → AC"],"a":0,"w":"A → C is not implied; augmentation and union give the others."},{"q":"An FD X → Y is trivial when:","o":["X and Y are disjoint","X is a key","X ⊆ Y","Y ⊆ X"],"a":3,"w":"If Y is part of X, it holds in every relation."},{"q":"R(A,B,C) with F = {A→B, B→C, C→A}. How many candidate keys?","o":["0","1","2","3"],"a":3,"w":"A, B and C each determine the rest, so each is a candidate key."},{"q":"To test whether X is a super key you compute:","o":["Whether X is NOT NULL","Closure of X and check it equals all attributes","The complement of X","Whether X is on a RHS"],"a":1,"w":"X is a super key iff X+ = all attributes."}],"star":true,"kw":"functional dependency closure armstrong candidate keys minimal cover canonical partial transitive","mins":30},{"id":"normal-forms","group":"B. Relational model and normalization","title":"Normalization: anomalies, 1NF, 2NF, 3NF, BCNF","intro":"Normalization splits a badly designed table into smaller ones so each fact is stored once. It is driven by functional dependencies. You must be able to name the highest normal form of a relation and decompose it.","blocks":[{"k":"h","t":"Why: the three anomalies"},{"k":"code","lang":"txt","code":"EMP_DEPT(emp_id, emp_name, dept_id, dept_name, dept_head)\n 101  Asha   D1  Data   Meera\n 102  Rohan  D1  Data   Meera\n 103  Kiran  D2  Cloud  Vikram\n\nUpdate anomaly : rename Data to Analytics -> must change every employee row, miss one and it is inconsistent\nInsert anomaly : cannot add a new department until it has an employee (emp_id is the key)\nDelete anomaly : delete Kiran and you lose the fact that D2 'Cloud' exists","cap":null,"run":false},{"k":"h","t":"1NF: atomic values"},{"k":"ul","t":["Every cell holds a single indivisible value. No repeating groups, no lists, no arrays-in-a-cell, no composite values you need to query parts of.","Every row is unique (a key exists). Column and row order carry no meaning."]},{"k":"code","lang":"txt","code":"Violates 1NF:                       Fixed:\n student  phones                      student  phone\n Asha     98450, 98451                Asha     98450\n Rohan    90000                       Asha     98451\n                                      Rohan    90000","cap":null,"run":false},{"k":"note","t":"PostgreSQL ARRAY and JSONB columns, and MySQL JSON, technically hold non-atomic values. They are tools for special cases; strict relational design still uses a child table."},{"k":"h","t":"2NF: no partial dependency"},{"k":"p","t":"A relation is in 2NF if it is in 1NF and **no non-prime attribute depends on a proper subset of a candidate key**. Only matters when the key is composite. If every key is a single attribute, a 1NF relation is automatically 2NF."},{"k":"code","lang":"txt","code":"ENROLL(student_id, course_id, student_name, grade)\nKey: {student_id, course_id}\nstudent_id -> student_name   is a PARTIAL dependency (part of the key decides student_name)\n\nDecompose:\n  STUDENT(student_id, student_name)\n  ENROLL(student_id, course_id, grade)","cap":null,"run":false},{"k":"h","t":"3NF: no transitive dependency"},{"k":"p","t":"In 2NF and, for every non-trivial FD X → A, **either X is a super key or A is a prime attribute**. In words: non-prime attributes depend on the key, the whole key and nothing but the key."},{"k":"code","lang":"txt","code":"EMP(emp_id, emp_name, dept_id, dept_name)\nKey: emp_id.   emp_id -> dept_id -> dept_name   (transitive)\n\nDecompose:\n  EMP(emp_id, emp_name, dept_id)\n  DEPT(dept_id, dept_name)","cap":null,"run":false},{"k":"h","t":"BCNF: every determinant is a key"},{"k":"p","t":"For every non-trivial FD X → Y, **X must be a super key**. This is stricter than 3NF because it drops the 'or A is prime' escape hatch."},{"k":"code","lang":"txt","code":"TEACH(student, course, instructor)\nFDs: {student, course} -> instructor       (a student has one instructor per course)\n     instructor -> course                  (each instructor teaches one course)\nCandidate keys: {student, course} and {student, instructor}  -> all attributes are prime\n3NF: yes (every RHS attribute is prime).\nBCNF: NO. instructor -> course, but instructor is not a super key.\n\nBCNF decomposition:  R1(instructor, course)   R2(student, instructor)\nLossless: yes.  Dependency preserving: NO, {student, course} -> instructor is lost.","cap":null,"run":false},{"k":"h","t":"Testing the highest normal form (procedure)"},{"k":"ol","t":["Find all candidate keys (closure method). List prime attributes.","For each FD X → Y: if X is a super key, fine. If X is not a super key and Y ⊆ X, ignore (trivial).","If X is not a super key and Y has a non-prime attribute: check X. If X is a proper subset of a key, it is a **partial** dependency: violates 2NF. If X is not a subset of any key, it is **transitive**: violates 3NF.","If X is not a super key but every attribute of Y is prime: 3NF holds, BCNF fails.","The relation is in the normal form given by the worst violation."]},{"k":"code","lang":"txt","code":"R(A,B,C,D)  F = { AB → C, B → D }\nKey: A and B are on no RHS, so AB. AB+ = ABCD. Key = {A,B}, prime = A,B; non-prime = C,D.\nB → D : B is a proper subset of the key and D is non-prime: PARTIAL dependency.  => 1NF only.\n\nR(A,B,C)  F = { A → B, B → C }\nKey = A.  B → C: B not a super key, C non-prime, B not a subset of a key: TRANSITIVE.  => 2NF, not 3NF.\n\nR(A,B,C)  F = { AB → C, C → B }\nKeys: AB and AC.  All prime.  C → B has C not a super key but B is prime.  => 3NF, not BCNF.","cap":null,"run":false},{"k":"h","t":"Comparison"},{"k":"table","head":["Normal form","Condition","Removes"],"rows":[["1NF","Atomic values, key exists","Repeating groups"],["2NF","1NF + no partial dependency","Redundancy from part of a composite key"],["3NF","2NF + for X → A: X super key or A prime","Transitive dependencies"],["BCNF","For every non-trivial X → Y: X is a super key","Remaining FD redundancy"],["4NF","BCNF + no non-trivial MVD except on a super key","Multivalued redundancy"],["5NF (PJNF)","4NF + every join dependency implied by candidate keys","Join-dependency redundancy"]]},{"k":"h","t":"Properties of decompositions"},{"k":"ul","t":["**Lossless join:** joining the pieces gets back exactly the original rows. For a binary split R into R1, R2 it is lossless iff (R1 ∩ R2) → R1 or (R1 ∩ R2) → R2.","**Dependency preserving:** every original FD can be checked inside a single piece.","**BCNF** decomposition is always lossless but may not preserve dependencies.","**3NF** decomposition (synthesis algorithm using a minimal cover) is always lossless AND dependency preserving."]},{"k":"p","t":"Quick facts: every relation with 2 attributes is in BCNF. Every BCNF relation is in 3NF, every 3NF in 2NF, every 2NF in 1NF. If all attributes are prime, the relation is at least 3NF."},{"k":"h","t":"When to denormalize"},{"k":"p","t":"Read-heavy reporting systems may deliberately duplicate columns (store customer_name in orders, keep a precomputed total) to avoid joins. You trade extra storage and the risk of inconsistency for read speed. Normalize first; denormalize with a measured reason."},{"k":"ask","t":"\"What is the difference between 3NF and BCNF?\" 3NF permits a dependency X → A when A is prime even if X is not a key; BCNF does not. They differ only when a relation has overlapping composite candidate keys."}],"test":[{"q":"R(A,B,C,D) with F = {AB→C, B→D}. The highest normal form is:","o":["3NF","1NF","BCNF","2NF"],"a":1,"w":"Key is AB. B → D is a partial dependency of non-prime D on part of the key."},{"q":"R(A,B,C) with F = {A→B, B→C}. The highest normal form is:","o":["BCNF","1NF","2NF","3NF"],"a":2,"w":"Key A. B → C is transitive, so 3NF fails; no partial dependency since the key is one attribute."},{"q":"R(A,B,C) with F = {AB→C, C→B}. The highest normal form is:","o":["1NF","BCNF","3NF but not BCNF","2NF"],"a":2,"w":"Keys AB and AC, everything prime, so 3NF. C → B violates BCNF since C is not a super key."},{"q":"A relation with only two attributes is always in at least:","o":["2NF only","BCNF","4NF only","1NF only"],"a":1,"w":"Any non-trivial FD in a 2-attribute relation has a key on its left side or leaves nothing to violate, so BCNF holds."},{"q":"Which decomposition is always lossless AND dependency preserving?","o":["BCNF decomposition","Splitting by columns alphabetically","3NF synthesis from a minimal cover","Any binary split"],"a":2,"w":"3NF synthesis guarantees both. BCNF cannot guarantee dependency preservation."},{"q":"Splitting R into R1 and R2 is lossless if:","o":["R1 and R2 have equal row counts","Both are in BCNF","R1 ∩ R2 is a key of R1 or of R2","R1 and R2 have no common attribute"],"a":2,"w":"The common attributes must functionally determine all of R1 or all of R2."},{"q":"Which anomaly appears when you cannot record a new department until it has an employee?","o":["Select","Delete","Insert","Update"],"a":2,"w":"That is an insertion anomaly caused by storing department facts in the employee table."}],"star":true,"kw":"normalization 1nf 2nf 3nf bcnf anomaly partial transitive decomposition lossless dependency preserving","mins":40},{"id":"higher-nf","group":"B. Relational model and normalization","title":"4NF, 5NF, 6NF and DKNF","intro":"Higher normal forms deal with redundancy that functional dependencies cannot see: independent multi-valued facts and join dependencies. Interviews ask for definitions and one example of each.","blocks":[{"k":"h","t":"Multivalued dependency (MVD)"},{"k":"p","t":"X ↠ Y holds if, for a given X, the set of Y values is independent of the other attributes. It means a table has two or more independent 'lists' for the same X, forcing a cross product of rows."},{"k":"code","lang":"txt","code":"EMP_SKILL_LANG(emp, skill, language)     -- skills and languages are independent\n Asha  SQL     English\n Asha  SQL     Hindi\n Asha  Python  English\n Asha  Python  Hindi\n\nemp ↠ skill   and   emp ↠ language\nRedundancy: adding one new language for Asha needs a row for EVERY skill.","cap":null,"run":false},{"k":"h","t":"4NF"},{"k":"p","t":"A relation is in 4NF if it is in BCNF and for every non-trivial MVD X ↠ Y, X is a super key. Fix: split into independent tables."},{"k":"code","lang":"txt","code":"EMP_SKILL(emp, skill)       EMP_LANG(emp, language)","cap":null,"run":false},{"k":"ul","t":["A trivial MVD: Y ⊆ X, or X ∪ Y = all attributes of R.","Every FD is an MVD (X → Y implies X ↠ Y), so 4NF implies BCNF.","MVDs only occur in relations with at least three attributes."]},{"k":"h","t":"Join dependency and 5NF (PJNF)"},{"k":"p","t":"A join dependency says a relation equals the natural join of some of its projections. **5NF** (project-join normal form): every non-trivial join dependency is implied by the candidate keys. A relation not in 5NF cannot be split into two lossless pieces, but can be split into three or more."},{"k":"code","lang":"txt","code":"SUPPLIES(supplier, part, project)  with the rule:\n  if S supplies part P, P is used in project J, and S supplies to J, then S supplies P to J.\n\nNo FD or MVD helps, but the table equals the join of three pairs:\n  SP(supplier, part)   PJ(part, project)   SJ(supplier, project)\nThis 3-way decomposition is 5NF.","cap":null,"run":false},{"k":"h","t":"6NF and DKNF"},{"k":"ul","t":["**6NF:** every join dependency is trivial, so each table has the key plus at most one other attribute. Used in temporal / anchor modelling and data warehouses to track history per attribute.","**DKNF (domain-key normal form):** every constraint is a logical consequence of domain constraints and key constraints. It is the theoretical ideal; there is no general algorithm to reach it.","**EKNF** (elementary key) sits between 3NF and BCNF; rarely asked."]},{"k":"h","t":"The hierarchy"},{"k":"code","lang":"txt","code":"1NF  ⊃  2NF  ⊃  3NF  ⊃  BCNF  ⊃  4NF  ⊃  5NF  ⊃  6NF   (each is a subset of the previous)\nDKNF is a different axis: it guarantees no anomalies at all.","cap":null,"run":false},{"k":"table","head":["NF","Dependency type it handles","Typical sign you have a violation"],"rows":[["2NF","Partial FD","Composite key and some columns depend on only one part"],["3NF","Transitive FD","A column that describes another non-key column"],["BCNF","FD whose left side is not a key","Overlapping candidate keys"],["4NF","Multi-valued dependency","Cross product of two independent lists in one table"],["5NF","Join dependency","Rows only reconstructable by a 3-way join"]]},{"k":"ask","t":"\"Explain 4NF with an example.\" Use employee-skill-language: skills and languages are independent facts about an employee, so keep them in separate tables to avoid cross-product rows."}],"test":[{"q":"4NF is violated when a relation has:","o":["A non-prime attribute","A transitive dependency","A non-trivial multi-valued dependency whose left side is not a super key","A partial dependency"],"a":2,"w":"4NF = BCNF + every non-trivial MVD has a super key on the left."},{"q":"Table EMP(emp, skill, language) where skills and languages are independent is best fixed by:","o":["Adding a surrogate key","Splitting into (emp, skill) and (emp, language)","Merging skill and language into one column","Making emp the primary key"],"a":1,"w":"Independent multi-valued facts belong in separate tables."},{"q":"5NF is also called:","o":["Elementary key normal form","Boyce-Codd normal form","Domain-key normal form","Project-join normal form"],"a":3,"w":"PJNF, because it deals with join dependencies."},{"q":"Which statement is true?","o":["Every BCNF relation is in 4NF","6NF allows non-trivial join dependencies","Every 4NF relation is in BCNF",
