or deleted"],"a":3,"w":"Every movement is permanent; the balance is derived or reconciled."},{"q":"A prerequisite table linking course to course is an example of:","o":["A recursive M:N relationship (junction table)","Specialization","A view","A weak entity"],"a":0,"w":"Both columns reference course."},{"q":"Primary key for enrollment so a student enrolls once per section:","o":["(usn)","(usn, section_id)","(section_id)","A grade column"],"a":1,"w":"Composite PK is the 'once per pair' rule."},{"q":"Which MySQL technique replaces EXCLUDE for room overlap?","o":["CHECK with subquery","FULLTEXT index","ON DELETE CASCADE","Triggers or one row per room-night with UNIQUE"],"a":3,"w":"MySQL lacks exclusion constraints and CHECKs cannot see other rows."}],"star":true,"kw":"scenario hospital bank college hotel booking exclude constraint ledger prerequisite design tables","mins":25},{"id":"select-basics","group":"E. Writing queries","title":"SELECT, WHERE, ORDER BY, LIMIT, DISTINCT","intro":"Everything a basic query can do, plus the order in which the database actually evaluates it. Sample tables used by the runnable examples: employees(id, name, dept_id, manager_id, salary, hire_date, city), departments(id, name, budget), projects(id, name, dept_id, budget), assignments(emp_id, project_id, hours), logins(emp_id, login_date). Press run to execute on the live copy.","blocks":[{"k":"h","t":"Skeleton and logical execution order"},{"k":"code","lang":"sql","code":"SELECT [DISTINCT] columns / expressions\nFROM table [joins]\nWHERE row filter\nGROUP BY grouping columns\nHAVING group filter\nORDER BY sort columns\nLIMIT n OFFSET m;","cap":"written order","run":false},{"k":"code","lang":"txt","code":"Executed in this order:\nFROM / JOIN  ->  WHERE  ->  GROUP BY  ->  HAVING  ->  window functions  ->  SELECT (aliases born here)\n  ->  DISTINCT  ->  ORDER BY  ->  LIMIT / OFFSET","cap":null,"run":false},{"k":"trap","t":"Because SELECT runs after WHERE, you cannot use a SELECT alias inside WHERE (PostgreSQL, standard). You CAN use it in ORDER BY. MySQL lets you use aliases in GROUP BY and HAVING as an extension."},{"k":"h","t":"WHERE operators"},{"k":"table","head":["Operator","Example","Notes"],"rows":[["= <> != < > <= >=","salary >= 90000","<> is standard; != works in both"],["AND OR NOT","city = 'Pune' AND salary > 50000","AND binds tighter than OR; use parentheses"],["BETWEEN a AND b","salary BETWEEN 76000 AND 98000","Inclusive on both ends"],["IN (list)","city IN ('Pune','Chennai')","Same as OR chain"],["LIKE","name LIKE 'A%'","% any length, _ exactly one character"],["ILIKE (PostgreSQL)","name ILIKE 'a%'","Case-insensitive LIKE. MySQL LIKE is already case-insensitive by default collation"],["Regex","PG: name ~ '^[AB]'   MySQL: name REGEXP '^[AB]'","~* for case-insensitive in PostgreSQL"],["IS NULL / IS NOT NULL","manager_id IS NULL","Never = NULL"],["EXISTS / ANY / ALL","see the subqueries topic",""]]},{"k":"code","lang":"sql","code":"SELECT name, salary, city\nFROM employees\nWHERE city IN ('Pune', 'Chennai') AND salary BETWEEN 60000 AND 100000 AND name LIKE '%a'\nORDER BY salary DESC, name;","cap":null,"run":true},{"k":"h","t":"ORDER BY, LIMIT, OFFSET, NULL ordering"},{"k":"code","lang":"sql","code":"SELECT name, salary FROM employees ORDER BY salary DESC, name ASC LIMIT 3;          -- top 3\nSELECT name, salary FROM employees ORDER BY salary DESC LIMIT 3 OFFSET 3;                 -- rows 4-6 (pagination)","cap":"PostgreSQL / MySQL / SQLite","run":true},{"k":"table","head":["Task","PostgreSQL","MySQL","SQL Server / Oracle"],"rows":[["First n rows","LIMIT n  or  FETCH FIRST n ROWS ONLY","LIMIT n","TOP n  /  FETCH FIRST n ROWS ONLY"],["Skip m rows","OFFSET m","LIMIT n OFFSET m  or  LIMIT m, n","OFFSET m ROWS"],["NULL position","ORDER BY x NULLS FIRST/LAST (NULLs sort as largest, last in ASC)","NULLs sort as smallest, first in ASC",""]]},{"k":"p","t":"**Ties:** ORDER BY salary LIMIT 3 breaks ties arbitrarily. Add a tiebreaker column (id) for deterministic paging. **WITH TIES** (PostgreSQL 13+: FETCH FIRST 3 ROWS WITH TIES) returns all rows that tie with the last one."},{"k":"h","t":"DISTINCT"},{"k":"ul","t":["DISTINCT applies to the whole row of selected columns, not just the first column.","SELECT DISTINCT dept_id, city returns unique pairs.","**PostgreSQL only:** DISTINCT ON (dept_id) returns the first row per group according to ORDER BY. Handy for 'latest row per group'."]},{"k":"code","lang":"sql","code":"SELECT DISTINCT city FROM employees ORDER BY city;","cap":null,"run":true},{"k":"code","lang":"pg","code":"SELECT DISTINCT ON (dept_id) dept_id, name, salary FROM employees ORDER BY dept_id, salary DESC;   -- top earner per department","cap":null,"run":false},{"k":"h","t":"Expressions, aliases, literals"},{"k":"code","lang":"sql","code":"SELECT name,\n       salary * 12        AS annual,\n       salary / 1000.0    AS in_thousands,\n       'Dr. ' || name     AS title,       -- || concatenation (PostgreSQL, SQLite); MySQL uses CONCAT()\n       1 + 2              AS three\nFROM employees LIMIT 3;","cap":null,"run":true},{"k":"code","lang":"my","code":"SELECT name,\n       salary * 12        AS annual,\n       salary / 1000.0    AS in_thousands,\n       CONCAT('Dr. ', name) AS title,\n       1 + 2              AS three\nFROM employees LIMIT 3;      -- in MySQL, || means OR by default, so always use CONCAT()","cap":"MySQL: use CONCAT, never ||","run":false},{"k":"my","t":"In MySQL || is logical OR by default; use CONCAT(). Double quotes are string delimiters in MySQL but identifiers in PostgreSQL. Always single-quote strings."},{"k":"ask","t":"\"Order of execution of a SQL query?\" FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT. This explains why aliases fail in WHERE and why HAVING can use aggregates."}],"test":[{"q":"Which clause executes first?","o":["SELECT","WHERE","ORDER BY","FROM"],"a":3,"w":"FROM (and joins) builds the row set before anything is filtered."},{"q":"BETWEEN 76000 AND 98000 includes:","o":["Only the upper end","Neither end","Both ends","Only the lower end"],"a":2,"w":"BETWEEN is inclusive."},{"q":"SELECT name FROM employees WHERE name LIKE '_a%' matches:","o":["Names whose second letter is a","Names containing a anywhere","Names ending in a","Names starting with a"],"a":0,"w":"_ is exactly one character, so the 'a' is in position 2."},{"q":"Why can't you reference a SELECT alias in WHERE in PostgreSQL?","o":["Aliases can only be numbers","It is allowed","Aliases are reserved","WHERE is evaluated before SELECT"],"a":3,"w":"WHERE runs before the SELECT list is computed."},{"q":"Which returns the first row per dept_id (by the ORDER BY) in PostgreSQL?","o":["DISTINCT ON (dept_id)","LIMIT PER dept_id","SELECT TOP 1","GROUP BY *"],"a":0,"w":"DISTINCT ON is a PostgreSQL extension."},{"q":"Pagination page 3 with 10 rows per page uses:","o":["LIMIT 20 OFFSET 10","OFFSET 3","LIMIT 10 OFFSET 20","LIMIT 30"],"a":2,"w":"Skip (page-1) × size rows."}],"star":true,"kw":"select where order by limit offset distinct like between in execution order alias top fetch","mins":30},{"id":"null-case","group":"E. Writing queries","title":"NULL, three-valued logic, COALESCE, NULLIF, CASE","intro":"NULL means unknown, not zero and not empty string. It is behind a large share of interview traps.","blocks":[{"k":"h","t":"Three-valued logic"},{"k":"table","head":["Expression","Result"],"rows":[["NULL = NULL","NULL (unknown), not TRUE"],["NULL <> 5","NULL"],["x IS NULL","TRUE or FALSE, never unknown"],["TRUE AND NULL","NULL"],["FALSE AND NULL","FALSE"],["TRUE OR NULL","TRUE"],["FALSE OR NULL","NULL"],["NOT NULL","NULL"],["NULL + 5, NULL || 'x'","NULL"]]},{"k":"p","t":"WHERE keeps a row only when the condition is TRUE. FALSE and NULL both drop the row."},{"k":"h","t":"Where NULL bites"},{"k":"ul","t":["**Comparison:** WHERE manager_id = NULL returns nothing. Use IS NULL.","**NOT IN with a NULL in the list returns no rows** at all. Use NOT EXISTS or filter NULLs.","**Aggregates skip NULL:** COUNT(col) counts non-NULLs, COUNT(*) counts rows, AVG ignores NULLs (so it is not sum/rows).","**GROUP BY** treats all NULLs as one group. **DISTINCT** and **UNION** treat NULLs as equal.","**UNIQUE** columns can hold many NULLs (PostgreSQL, MySQL) because NULLs are not equal.","**ORDER BY:** PostgreSQL sorts NULL last in ASC; MySQL first."]},{"k":"code","lang":"sql","code":"SELECT COUNT(*) AS all_rows, COUNT(dept_id) AS non_null, COUNT(DISTINCT dept_id) AS distinct_depts, AVG(dept_id) AS avg_dept FROM employees;","cap":"10 rows, 9 non-null","run":true},{"k":"code","lang":"sql","code":"-- the NOT IN trap: employees.dept_id contains a NULL (Farhan)\nSELECT name FROM departments WHERE id NOT IN (SELECT dept_id FROM employees);      -- returns NOTHING","cap":"wrong answer, silently","run":true},{"k":"code","lang":"sql","code":"SELECT name FROM departments d WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);   -- Design","cap":"correct","run":true},{"k":"h","t":"Handling NULL"},{"k":"table","head":["Function","Meaning","Example"],"rows":[["COALESCE(a, b, c)","First non-NULL argument (standard, all DBs)","COALESCE(manager_id, 0)"],["NULLIF(a, b)","NULL if a = b, else a. Prevents divide by zero","total / NULLIF(count, 0)"],["IFNULL(a, b) / NVL(a, b)","MySQL / Oracle two-argument COALESCE",""],["IS DISTINCT FROM (PostgreSQL)","NULL-safe not equal: NULL IS DISTINCT FROM NULL is FALSE","a IS DISTINCT FROM b"],["<=> (MySQL)","NULL-safe equality","a <=> b"]]},{"k":"code","lang":"sql","code":"SELECT name, COALESCE(dept_id, -1) AS dept, COALESCE(manager_id, id) AS boss FROM employees WHERE id IN (1, 9, 2);","cap":null,"run":true},{"k":"h","t":"CASE expressions"},{"k":"code","lang":"sql","code":"-- searched CASE\nSELECT name, salary,\n  CASE WHEN salary >= 120000 THEN 'senior'\n       WHEN salary >= 90000  THEN 'mid'\n       ELSE 'junior' END AS band\nFROM employees ORDER BY salary DESC;\n\n-- simple CASE\nSELECT name, CASE city WHEN 'Pune' THEN 'PN' WHEN 'Bengaluru' THEN 'BLR' ELSE 'OTHER' END AS code FROM employees;","cap":null,"run":true},{"k":"p","t":"**Conditional aggregation** (pivot without PIVOT):"},{"k":"code","lang":"sql","code":"SELECT SUM(CASE WHEN city = 'Pune' THEN 1 ELSE 0 END)      AS pune,\n       SUM(CASE WHEN city = 'Bengaluru' THEN 1 ELSE 0 END) AS bengaluru,\n       COUNT(*) AS total\nFROM employees;","cap":null,"run":true},{"k":"code","lang":"pg","code":"SELECT COUNT(*) FILTER (WHERE city = 'Pune') AS pune FROM employees;   -- PostgreSQL shorthand","cap":null,"run":false},{"k":"trap","t":"CASE returns the FIRST matching branch only. An ELSE-less CASE yields NULL. All branches must produce compatible types."},{"k":"ask","t":"\"What is the difference between COUNT(*), COUNT(col) and COUNT(DISTINCT col)?\" Rows, non-NULL values, distinct non-NULL values."}],"test":[{"q":"SELECT * FROM t WHERE x = NULL returns:","o":["No rows","An error","All rows","Rows where x is null"],"a":0,"w":"x = NULL is unknown for every row; use IS NULL."},{"q":"t has values 1, 2, NULL in column x. COUNT(x) is:","o":["3","2","0","1"],"a":1,"w":"COUNT(col) ignores NULLs."},{"q":"WHERE id NOT IN (SELECT col FROM s) returns no rows if s.col contains:","o":["Duplicates","A NULL","Zero","Text"],"a":1,"w":"id <> NULL is unknown, so no row can pass."},{"q":"Which prevents division by zero?","o":["x / NULLIF(y, 0)","x / ISNULL","x % y","COALESCE(x, 1)"],"a":0,"w":"NULLIF(y, 0) turns 0 into NULL, so the result is NULL instead of an error."},{"q":"AVG over values 10, 20, NULL gives:","o":["15","30","NULL","10"],"a":0,"w":"NULL is ignored: (10+20)/2."},{"q":"FALSE AND NULL evaluates to:","o":["FALSE","NULL","Error","TRUE"],"a":0,"w":"FALSE AND anything is FALSE."}],"star":true,"kw":"null three-valued logic coalesce nullif case when not in is null distinct from conditional aggregation","mins":30},{"id":"functions","group":"E. Writing queries","title":"Built-in functions: string, numeric, date and time","intro":"Functions differ most between engines. Know the PostgreSQL form first, and its MySQL twin.","blocks":[{"k":"h","t":"String functions"},{"k":"table","head":["Task","PostgreSQL","MySQL"],"rows":[["Concatenate","a || b, CONCAT(a, b), CONCAT_WS(',', a, b)","CONCAT(a, b), CONCAT_WS(',', a, b)"],["Length","LENGTH(s), CHAR_LENGTH(s)","CHAR_LENGTH(s), LENGTH(s) = bytes"],["Upper / lower","UPPER(s), LOWER(s), INITCAP(s)","UPPER(s), LOWER(s)"],["Substring","SUBSTRING(s FROM 2 FOR 3), SUBSTR(s, 2, 3), LEFT(s, n), RIGHT(s, n)","SUBSTRING(s, 2, 3), LEFT, RIGHT"],["Position","POSITION('x' IN s), STRPOS(s, 'x')","LOCATE('x', s), INSTR(s, 'x')"],["Replace","REPLACE(s, 'a', 'b'), TRANSLATE(s, 'abc', 'xyz')","REPLACE(s, 'a', 'b')"],["Trim","TRIM(s), LTRIM, RTRIM, TRIM(BOTH 'x' FROM s)","TRIM, LTRIM, RTRIM"],["Pad","LPAD(s, 5, '0'), RPAD","LPAD, RPAD"],["Reverse / repeat","REVERSE(s), REPEAT(s, n)","REVERSE(s), REPEAT(s, n)"],["Split","SPLIT_PART(s, ',', 2), STRING_TO_ARRAY(s, ',')","SUBSTRING_INDEX(s, ',', 2)"],["Regex replace","REGEXP_REPLACE(s, pattern, repl)","REGEXP_REPLACE(s, pattern, repl) (8.0+)"]]},{"k":"code","lang":"sql","code":"SELECT name, UPPER(name) AS up, LENGTH(name) AS len, SUBSTR(name, 1, 3) AS first3,\n       REPLACE(name, 'a', '@') AS swapped, name || ' (' || city || ')' AS label\nFROM employees LIMIT 4;","cap":null,"run":true},{"k":"code","lang":"my","code":"SELECT name, UPPER(name) AS up, CHAR_LENGTH(name) AS len, SUBSTRING(name, 1, 3) AS first3,\n       REPLACE(name, 'a', '@') AS swapped, CONCAT(name, ' (', city, ')') AS label\nFROM employees LIMIT 4;      -- LENGTH() in MySQL counts BYTES; CHAR_LENGTH() counts characters","cap":"MySQL: CONCAT, CHAR_LENGTH, SUBSTRING","run":false},{"k":"h","t":"Numeric functions"},{"k":"table","head":["Function","Meaning"],"rows":[["ROUND(x, n), CEIL(x), FLOOR(x), TRUNC(x) / TRUNCATE(x, n)","Rounding; PostgreSQL TRUNC, MySQL TRUNCATE"],["ABS(x), SIGN(x), POWER(x, y), SQRT(x), MOD(x, y) or x % y","Basic maths"],["RANDOM() (PostgreSQL), RAND() (MySQL)","Random number in [0,1)"],["x / y with integers","Integer division in PostgreSQL (5 / 2 = 2); MySQL / gives decimal (5 / 2 = 2.5) and DIV gives integer. Cast to numeric to be safe"],["GREATEST(a, b, ...), LEAST(a, b, ...)","Max/min across columns (row-wise)"]]},{"k":"code","lang":"sql","code":"SELECT ROUND(95200.456, 1) AS r, ABS(-7) AS a, 7 % 3 AS m, 7 / 2 AS int_div, 7 / 2.0 AS dec_div, MAX(1, 5, 3) AS pick;","cap":"SQLite spelling of row-wise max is MAX(a,b,c)","run":true},{"k":"h","t":"Date and time"},{"k":"table","head":["Task","PostgreSQL","MySQL"],"rows":[["Now","now(), CURRENT_TIMESTAMP, CURRENT_DATE","NOW(), CURRENT_DATE, CURDATE()"],["Add days / months","date + 7;  date + INTERVAL '1 month'","DATE_ADD(d, INTERVAL 7 DAY), d + INTERVAL 1 MONTH"],["Difference in days","d2 - d1 (integer for DATE)","DATEDIFF(d2, d1)"],["Age / interval","AGE(d2, d1) returns an interval","TIMESTAMPDIFF(YEAR, d1, d2)"],["Extract part","EXTRACT(YEAR FROM d), DATE_PART('month', d)","YEAR(d), MONTH(d), EXTRACT(YEAR FROM d)"],["Truncate to period","DATE_TRUNC('month', ts)","DATE_FORMAT(d, '%Y-%m-01')"],["Format as text","TO_CHAR(d, 'YYYY-MM-DD')","DATE_FORMAT(d, '%Y-%m-%d')"],["Parse text","TO_DATE('2026-10-23', 'YYYY-MM-DD')","STR_TO_DATE('23-10-2026', '%d-%m-%Y')"],["Day of week","EXTRACT(DOW FROM d) (0 = Sunday)","DAYOFWEEK(d) (1 = Sunday), WEEKDAY(d) (0 = Monday)"]]},{"k":"code","lang":"sql","code":"SELECT name, hire_date,\n       strftime('%Y', hire_date)                         AS hire_year,\n       CAST(julianday('2026-10-23') - julianday(hire_date) AS INTEGER) AS days_employed,\n       date(hire_date, '+1 year')                        AS first_anniversary\nFROM employees ORDER BY hire_date LIMIT 4;","cap":"SQLite date functions, for the live demo","run":true},{"k":"code","lang":"my","code":"SELECT name, hire_date,\n       YEAR(hire_date)                                   AS hire_year,\n       DATEDIFF('2026-10-23', hire_date)                 AS days_employed,\n       DATE_ADD(hire_date, INTERVAL 1 YEAR)              AS first_anniversary\nFROM employees ORDER BY hire_date LIMIT 4;","cap":"MySQL: YEAR, DATEDIFF, DATE_ADD","run":false},{"k":"code","lang":"pg","code":"SELECT name,\n       EXTRACT(YEAR FROM hire_date)            AS yr,\n       AGE(CURRENT_DATE, hire_date)            AS tenure,\n       DATE_TRUNC('month', hire_date)::date    AS month_start,\n       hire_date + INTERVAL '1 year'           AS anniversary\nFROM employees;","cap":null,"run":false},{"k":"code","lang":"my","code":"SELECT name,\n       YEAR(hire_date)                             AS yr,\n       TIMESTAMPDIFF(YEAR, hire_date, CURDATE())   AS years_employed,\n       DATE_FORMAT(hire_date, '%b %Y')             AS pretty,\n       DATE_ADD(hire_date, INTERVAL 1 YEAR)        AS anniversary\nFROM employees;","cap":null,"run":false},{"k":"h","t":"Casting and misc"},{"k":"table","head":["Task","Syntax"],"rows":[["Cast","CAST(x AS INTEGER) everywhere; PostgreSQL also x::integer; MySQL CONVERT(x, SIGNED)"],["String to number safely","PostgreSQL has no TRY_CAST (use a regex check or a function); MySQL converts leniently"],["Current user / database","CURRENT_USER, current_database()  |  USER(), DATABASE()"],["Conditional","CASE, COALESCE, NULLIF, GREATEST, LEAST"]]},{"k":"ask","t":"\"Get the number of days between two dates / the first day of the month.\" PostgreSQL: d2 - d1 and DATE_TRUNC('month', d). MySQL: DATEDIFF(d2, d1) and DATE_FORMAT(d, '%Y-%m-01')."}],"test":[{"q":"In PostgreSQL, 7 / 2 returns:","o":["4","3.5","Error","3"],"a":3,"w":"Integer division when both operands are integers. MySQL would give 3.5."},{"q":"Which string concatenation form fails to concatenate in default MySQL?","o":["CONCAT(a, b)","a || b","CONCAT_WS(',', a, b)","All work"],"a":1,"w":"|| is logical OR in MySQL unless PIPES_AS_CONCAT is set."},{"q":"First day of the month in PostgreSQL:","o":["DATE_TRUNC('month', d)","DATE_FORMAT(d, '%Y-%m-01')","MONTH_START(d)","TRUNC(d)"],"a":0,"w":"DATE_TRUNC rounds down to the given unit."},{"q":"Number of days between two DATE values in MySQL:","o":["AGE(d2, d1)","DATEDIFF(d2, d1)","d2 - d1","DAYS(d1, d2)"],"a":1,"w":"DATEDIFF returns d2 minus d1 in days."},{"q":"COALESCE(NULL, NULL, 5, 7) returns:","o":["7","NULL","12","5"],"a":3,"w":"First non-NULL argument."}],"star":false,"kw":"functions string date time concat substring extract interval datediff date_trunc to_char round cast","mins":25},{"id":"aggregates","group":"E. Writing queries","title":"Aggregates, GROUP BY, HAVING, ROLLUP","intro":"Collapse many rows into summaries. The rules about what may appear in SELECT are asked constantly.","blocks":[{"k":"h","t":"Aggregate functions"},{"k":"table","head":["Function","Counts / returns","NULLs"],"rows":[["COUNT(*)","Number of rows","Includes NULL rows"],["COUNT(col)","Non-NULL values in col","Skips"],["COUNT(DISTINCT col)","Distinct non-NULL values","Skips"],["SUM, AVG, MIN, MAX","Obvious","Skip NULLs; SUM of nothing is NULL"],["STRING_AGG(col, ', ') PG  /  GROUP_CONCAT(col SEPARATOR ', ') MySQL","Concatenated text","Skips"],["ARRAY_AGG(col) (PG), JSON_AGG / JSON_ARRAYAGG","Collect into a list",""],["BOOL_AND / BOOL_OR (PG), BIT_AND / BIT_OR","Logical aggregates",""],["PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) (PG)","Median",""]]},{"k":"h","t":"GROUP BY"},{"k":"code","lang":"sql","code":"SELECT dept_id, COUNT(*) AS headcount, SUM(salary) AS payroll, ROUND(AVG(salary)) AS avg_salary, MAX(salary) AS top\nFROM employees\nGROUP BY dept_id\nORDER BY dept_id;","cap":"per department","run":true},{"k":"ul","t":["**Rule:** every column in SELECT must either be in GROUP BY or inside an aggregate function.","MySQL with ONLY_FULL_GROUP_BY off (old default) lets you select non-grouped columns and returns an arbitrary row's value: dangerous. Modern MySQL enables ONLY_FULL_GROUP_BY.","PostgreSQL allows selecting other columns of a table if you group by its primary key (functional dependency).","GROUP BY can use column positions (GROUP BY 1) or expressions (GROUP BY EXTRACT(YEAR FROM hire_date))."]},{"k":"h","t":"WHERE vs HAVING"},{"k":"table","head":["","WHERE","HAVING"],"rows":[["Filters","Individual rows before grouping","Groups after aggregation"],["Can use aggregates","No","Yes"],["Can use an index","Yes","Usually no (works on grouped data)"]]},{"k":"code","lang":"sql","code":"SELECT dept_id, COUNT(*) AS n\nFROM employees\nWHERE city <> 'Chennai'          -- row filter first\nGROUP BY dept_id\nHAVING COUNT(*) >= 3;            -- group filter","cap":null,"run":true},{"k":"p","t":"Rule: filter rows as early as possible with WHERE, and use HAVING only for conditions on aggregates."},{"k":"h","t":"Multiple columns and conditional aggregation"},{"k":"code","lang":"sql","code":"SELECT city, COUNT(*) AS n,\n       SUM(CASE WHEN salary >= 100000 THEN 1 ELSE 0 END) AS high_earners\nFROM employees GROUP BY city ORDER BY n DESC, city;","cap":null,"run":true},{"k":"h","t":"ROLLUP, CUBE, GROUPING SETS (subtotals)"},{"k":"code","lang":"pg","code":"SELECT dept_id, city, SUM(salary)\nFROM employees\nGROUP BY ROLLUP (dept_id, city);        -- detail rows, subtotal per dept, grand total\n\nSELECT dept_id, city, SUM(salary) FROM employees GROUP BY CUBE (dept_id, city);               -- all combinations\nSELECT dept_id, city, SUM(salary) FROM employees GROUP BY GROUPING SETS ((dept_id), (city), ());   -- chosen sets\nSELECT dept_id, GROUPING(dept_id) AS is_total_row FROM employees GROUP BY ROLLUP (dept_id);","cap":null,"run":false},{"k":"code","lang":"my","code":"SELECT dept_id, city, SUM(salary) FROM employees GROUP BY dept_id, city WITH ROLLUP;   -- MySQL syntax; no CUBE or GROUPING SETS","cap":null,"run":false},{"k":"h","t":"String aggregation"},{"k":"code","lang":"pg","code":"SELECT dept_id, STRING_AGG(name, ', ' ORDER BY name) AS people FROM employees GROUP BY dept_id;","cap":null,"run":false},{"k":"code","lang":"my","code":"SELECT dept_id, GROUP_CONCAT(name ORDER BY name SEPARATOR ', ') AS people FROM employees GROUP BY dept_id;","cap":null,"run":false},{"k":"code","lang":"sql","code":"SELECT dept_id, GROUP_CONCAT(name, ', ') AS people FROM employees GROUP BY dept_id;","cap":"SQLite spelling","run":true},{"k":"h","t":"DISTINCT inside aggregates and aggregate of aggregates"},{"k":"code","lang":"sql","code":"SELECT COUNT(DISTINCT city) AS cities, COUNT(DISTINCT dept_id) AS depts FROM employees;\n-- average of per-department averages (aggregate of an aggregate needs a subquery)\nSELECT ROUND(AVG(avg_sal)) FROM (SELECT AVG(salary) AS avg_sal FROM employees GROUP BY dept_id);","cap":null,"run":true},{"k":"code","lang":"my","code":"SELECT dept_id, GROUP_CONCAT(name SEPARATOR ', ') AS people FROM employees GROUP BY dept_id;      -- MySQL puts the separator in a SEPARATOR clause","cap":"MySQL: GROUP_CONCAT ... SEPARATOR","run":false},{"k":"trap","t":"SELECT dept_id, name, COUNT(*) FROM employees GROUP BY dept_id is invalid (name is neither grouped nor aggregated) in PostgreSQL and in MySQL with ONLY_FULL_GROUP_BY."},{"k":"ask","t":"\"Difference between WHERE and HAVING?\" WHERE filters rows before grouping and cannot use aggregates. HAVING filters groups after grouping and can."}],"test":[{"q":"Which is valid in HAVING but not in WHERE?","o":["salary > 50000","name LIKE 'A%'","COUNT(*) > 2","city = 'Pune'"],"a":2,"w":"Aggregates exist only after grouping."},{"q":"SELECT dept_id, name, COUNT(*) FROM employees GROUP BY dept_id fails because:","o":["name is not grouped or aggregated","dept_id may be NULL","COUNT(*) needs DISTINCT","GROUP BY requires ORDER BY"],"a":0,"w":"Every non-aggregated select column must be in GROUP BY."},{"q":"COUNT(*) vs COUNT(dept_id) differ when dept_id:","o":["Has duplicates","Is a key","Is text","Contains NULLs"],"a":3,"w":"COUNT(col) skips NULLs; COUNT(*) does not."},{"q":"GROUP BY ROLLUP (a, b) produces:","o":["Only (a, b)","All subsets of {a, b}","(a, b), (a), and grand total","Only the grand total"],"a":2,"w":"A hierarchy of subtotals; CUBE gives all subsets."},{"q":"MySQL equivalent of PostgreSQL STRING_AGG:","o":["LISTAGG","GROUP_CONCAT","ARRAY_AGG","CONCAT_AGG"],"a":1,"w":"GROUP_CONCAT(col SEPARATOR ', ')."}],"star":true,"kw":"aggregate group by having count sum avg rollup cube grouping sets string_agg group_concat where vs having","mins":35},{"id":"joins","group":"E. Writing queries","title":"Joins: inner, outer, cross, self, semi, anti","intro":"The most tested SQL topic. Know each join's definition, its result on unmatched rows, and the traps with WHERE and COUNT.","blocks":[{"k":"h","t":"The join family"},{"k":"table","head":["Join","Returns","Unmatched rows"],"rows":[["INNER JOIN (JOIN)","Only pairs satisfying ON","Dropped from both sides"],["LEFT (OUTER) JOIN","All rows of the left table + matches","Right columns are NULL"],["RIGHT (OUTER) JOIN","All rows of the right table + matches","Left columns are NULL"],["FULL (OUTER) JOIN","All rows of both","NULLs on whichever side is missing. MySQL has none (UNION a LEFT and RIGHT)"],["CROSS JOIN","Every combination (m × n rows)","n/a (no condition)"],["NATURAL JOIN","Inner join on all same-named columns","Fragile: breaks when columns are added. Avoid in real code"],["SELF JOIN","A table joined to itself via aliases","Used for hierarchies and pair comparisons"]]},{"k":"code","lang":"sql","code":"-- INNER: employees with their department\nSELECT e.name, d.name AS dept FROM employees e JOIN departments d ON d.id = e.dept_id ORDER BY e.id;","cap":"Farhan (no dept) disappears","run":true},{"k":"code","lang":"sql","code":"-- LEFT: keep every employee\nSELECT e.name, d.name AS dept FROM employees e LEFT JOIN departments d ON d.id = e.dept_id ORDER BY e.id;","cap":"Farhan appears with NULL","run":true},{"k":"code","lang":"sql","code":"-- every department including the empty one, with headcount\nSELECT d.name, COUNT(e.id) AS headcount FROM departments d LEFT JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name;","cap":"COUNT(e.id), not COUNT(*): Design must show 0","run":true},{"k":"code","lang":"sql","code":"-- FULL join emulation (works everywhere, including MySQL)\nSELECT e.name, d.name FROM employees e LEFT JOIN departments d ON d.id = e.dept_id\nUNION\nSELECT e.name, d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id;","cap":"both unmatched sides","run":true},{"k":"code","lang":"pg","code":"SELECT e.name, d.name FROM employees e FULL OUTER JOIN departments d ON d.id = e.dept_id;","cap":null,"run":false},{"k":"h","t":"Self join"},{"k":"code","lang":"sql","code":"-- employee with manager name\nSELECT e.name AS employee, m.name AS manager FROM employees e LEFT JOIN employees m ON m.id = e.manager_id ORDER BY e.id;","cap":null,"run":true},{"k":"code","lang":"sql","code":"-- employees earning more than their manager\nSELECT e.name, e.salary, m.name AS manager, m.salary AS mgr_salary FROM employees e JOIN employees m ON m.id = e.manager_id WHERE e.salary > m.salary;","cap":"Kiran and Nisha","run":true},{"k":"code","lang":"sql","code":"-- all unordered pairs in the same city (a.id < b.id avoids duplicates and self pairs)\nSELECT a.name, b.name, a.city FROM employees a JOIN employees b ON a.city = b.city AND a.id < b.id ORDER BY a.city, a.name LIMIT 5;","cap":null,"run":true},{"k":"h","t":"Many-to-many chain"},{"k":"code","lang":"sql","code":"SELECT e.name AS employee, p.name AS project, a.hours\nFROM employees e\nJOIN assignments a ON a.emp_id = e.id\nJOIN projects p    ON p.id = a.project_id\nORDER BY a.hours DESC LIMIT 4;","cap":"three tables through the junction","run":true},{"k":"h","t":"Anti-join and semi-join patterns"},{"k":"code","lang":"sql","code":"-- ANTI: employees with NO assignment (three ways)\nSELECT e.name FROM employees e LEFT JOIN assignments a ON a.emp_id = e.id WHERE a.emp_id IS NULL;\nSELECT name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM assignments a WHERE a.emp_id = e.id);\nSELECT name FROM employees WHERE id NOT IN (SELECT emp_id FROM assignments);       -- safe only because emp_id has no NULLs","cap":"Asha and Farhan","run":true},{"k":"code","lang":"sql","code":"-- SEMI: employees WITH at least one assignment, each listed once\nSELECT name FROM employees e WHERE EXISTS (SELECT 1 FROM assignments a WHERE a.emp_id = e.id);","cap":null,"run":true},{"k":"h","t":"ON vs WHERE in outer joins (classic trap)"},{"k":"code","lang":"sql","code":"-- condition in ON: Design stays, its employee columns NULL\nSELECT d.name, e.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id AND e.city = 'Pune';\n-- condition in WHERE: filters after the join, silently turning it into an inner join\nSELECT d.name, e.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.city = 'Pune';","cap":null,"run":true},{"k":"h","t":"USING, NATURAL, non-equi joins"},{"k":"code","lang":"sql","code":"-- USING (id) joins on a same-named column and shows it once\nSELECT * FROM employees JOIN employees AS b USING (id) LIMIT 1;\n-- non-equi: pair each employee with the departments whose budget they could 'fund' 1000x\nSELECT e.name, d.name FROM employees e JOIN departments d ON d.budget > e.salary * 5 WHERE e.id <= 2 ORDER BY 1, 2;","cap":null,"run":true},{"k":"my","t":"MySQL UPDATE/DELETE can use JOIN directly; PostgreSQL uses UPDATE ... FROM and DELETE ... USING (see DML topic). LEFT JOIN LATERAL is PostgreSQL (MySQL 8.0.14+ has LATERAL derived tables)."},{"k":"h","t":"Row-count rules (MCQ favourites)"},{"k":"table","head":["Join","Rows"],"rows":[["m rows join n rows, no condition","m × n"],["Inner join on FK to PK (every child has a parent)","exactly the child count"],["Left join","at least the left count; more if one left row matches several right rows"],["m rows, n rows, no matches, FULL join","m + n"]]},{"k":"ask","t":"\"INNER vs LEFT JOIN?\" Inner keeps only matching rows. Left keeps all left rows and fills NULLs where there is no match. Use left joins when 'no related row' must still appear."}],"test":[{"q":"Table A has 5 rows, B has 4 rows. How many rows does A CROSS JOIN B return?","o":["5","20","9","4"],"a":1,"w":"m × n."},{"q":"To list departments with their employee counts including empty departments you need:","o":["RIGHT JOIN from departments","CROSS JOIN","LEFT JOIN from departments and COUNT(e.id)","INNER JOIN and COUNT(*)"],"a":2,"w":"LEFT JOIN keeps empty departments, and COUNT(e.id) counts 0 for them (COUNT(*) would count 1)."},{"q":"Moving a right-table filter from ON to WHERE in a LEFT JOIN:","o":["Is a syntax error","Makes it a full join","Turns it effectively into an inner join","Changes nothing"],"a":2,"w":"WHERE removes the NULL-extended rows."},{"q":"Which is the standard way to find rows in A with no match in B, NULL-safely?","o":["UNION","A = B","NOT IN (SELECT col FROM B)","NOT EXISTS (correlated)"],"a":3,"w":"NOT EXISTS handles NULLs correctly; NOT IN returns nothing if B.col has a NULL."},{"q":"MySQL has no FULL OUTER JOIN. The workaround is:","o":["LEFT JOIN UNION RIGHT JOIN","CROSS JOIN","Two INNER JOINs","NATURAL JOIN"],"a":0,"w":"UNION of the two outer joins."},{"q":"In a self join for pairs in the same city, the condition a.id < b.id:","o":["Removes duplicate mirrored pairs and self pairs","Speeds up the join","Orders the output","Is required syntax"],"a":0,"w":"Each unordered pair appears once and no row pairs with itself."}],"star":true,"kw":"join inner left right full outer cross natural self anti semi on where using non-equi","mins":35},{"id":"subqueries","group":"E. Writing queries","title":"Subqueries: scalar, IN, EXISTS, correlated, derived, LATERAL","intro":"A query inside a query. Know which kind returns what and when to prefer a join.","blocks":[{"k":"table","head":["Kind","Returns","Where used","Example"],"rows":[["Scalar","Exactly one value","SELECT list, WHERE, SET","salary > (SELECT AVG(salary) FROM employees)"],["Row / column list","A column of values","IN, ANY, ALL, EXISTS","id IN (SELECT emp_id FROM assignments)"],["Table (derived table)","A result set with an alias","FROM","FROM (SELECT ...) AS t"],["Correlated","References the outer row; re-evaluated per row","WHERE, SELECT","WHERE salary > (SELECT AVG(salary) FROM employees x WHERE x.dept_id = e.dept_id)"]]},{"k":"code","lang":"sql","code":"-- scalar subquery\nSELECT name, salary FROM employees WHERE salary > (SELECT AVG(salary) FROM employees) ORDER BY salary DESC;","cap":"above the company average (95200)","run":true},{"k":"code","lang":"sql","code":"-- IN with a subquery\nSELECT name FROM employees WHERE dept_id IN (SELECT dept_id FROM projects WHERE budget >= 250000);","cap":null,"run":true},{"k":"code","lang":"sql","code":"-- correlated: earns more than the average of their own department\nSELECT e.name, e.dept_id, e.salary\nFROM employees e\nWHERE e.salary > (SELECT AVG(x.salary) FROM employees x WHERE x.dept_id = e.dept_id);","cap":null,"run":true},{"k":"code","lang":"sql","code":"-- scalar subquery in SELECT\nSELECT d.name, (SELECT COUNT(*) FROM employees e WHERE e.dept_id = d.id) AS headcount FROM departments d;","cap":null,"run":true},{"k":"code","lang":"sql","code":"-- derived table in FROM\nSELECT dept_id, avg_sal FROM (SELECT dept_id, AVG(salary) AS avg_sal FROM employees GROUP BY dept_id) t WHERE avg_sal > 100000;","cap":null,"run":true},{"k":"h","t":"EXISTS vs IN"},{"k":"ul","t":["EXISTS returns TRUE as soon as the subquery finds one row; it stops early and ignores the select list (SELECT 1 is a convention).","NOT EXISTS is NULL-safe. NOT IN is not (one NULL in the list returns no rows).","Modern optimizers turn both into semi-joins; performance is usually equal. Choose by correctness: prefer EXISTS / NOT EXISTS for correlated membership tests."]},{"k":"h","t":"ANY / ALL"},{"k":"code","lang":"sql","code":"-- (PostgreSQL / MySQL) salary greater than ALL salaries in dept 3\nSELECT name FROM employees WHERE salary > (SELECT MAX(salary) FROM employees WHERE dept_id = 3);\n-- ALL / ANY forms:  salary > ALL (SELECT salary FROM employees WHERE dept_id = 3)\n--                   salary = ANY (SELECT ...)   is the same as IN","cap":"SQLite lacks ANY/ALL; MAX works the same","run":true},{"k":"h","t":"Nth highest salary (the classic)"},{"k":"code","lang":"sql","code":"-- 2nd highest distinct salary (OFFSET)\nSELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;\n\n-- 2nd highest using a subquery (works on any engine)\nSELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);\n\n-- Nth via correlated count: N = 3 means exactly 2 distinct salaries are higher\nSELECT DISTINCT e.salary FROM employees e WHERE (SELECT COUNT(DISTINCT x.salary) FROM employees x WHERE x.salary > e.salary) = 2;","cap":"120000, then 120000, then 98000","run":true},{"k":"h","t":"Top earner per department (correlated)"},{"k":"code","lang":"sql","code":"SELECT name, dept_id, salary FROM employees e\nWHERE salary = (SELECT MAX(salary) FROM employees x WHERE x.dept_id = e.dept_id);","cap":"ties both appear: Meera and Vikram, Kiran and Nisha","run":true},{"k":"h","t":"LATERAL (PostgreSQL, MySQL 8.0.14+)"},{"k":"code","lang":"pg","code":"-- top 2 highest-paid per department, using LATERAL\nSELECT d.name, t.name AS employee, t.salary\nFROM departments d\nCROSS JOIN LATERAL (SELECT e.name, e.salary FROM employees e WHERE e.dept_id = d.id ORDER BY e.salary DESC LIMIT 2) t;","cap":null,"run":false},{"k":"h","t":"Subqueries in UPDATE and DELETE"},{"k":"code","lang":"sql","code":"UPDATE employees SET salary = salary + 5000 WHERE dept_id IN (SELECT id FROM departments WHERE budget < 600000);\nSELECT name, salary FROM employees WHERE dept_id = 3 ORDER BY id;","cap":null,"run":true},{"k":"my","t":"MySQL refuses to modify a table and select from the same table in one statement (error 1093) unless you wrap the subquery in a derived table. PostgreSQL has no such restriction."},{"k":"trap","t":"A scalar subquery that returns more than one row is an error ('more than one row returned by a subquery used as an expression'). Use LIMIT 1, an aggregate, or IN."},{"k":"ask","t":"\"Correlated vs non-correlated subquery?\" A non-correlated subquery runs once independently. A correlated one refers to the outer row and is conceptually run once per outer row; it can often be rewritten as a join or window function."}],"test":[{"q":"Which subquery refers to a column of the outer query?","o":["Correlated","Uncorrelated","Scalar","Derived table"],"a":0,"w":"That is the definition of correlated."},{"q":"Why is NOT EXISTS safer than NOT IN?","o":["It allows aggregates","It is not fooled by NULLs in the subquery","It is shorter","It is always faster"],"a":1,"w":"NOT IN returns no rows if the list contains a NULL."},{"q":"Second highest distinct salary using only standard features:","o":["SELECT AVG(salary) FROM e","SELECT salary FROM e ORDER BY salary LIMIT 2","SELECT MAX(salary) FROM e WHERE salary < (SELECT MAX(salary) FROM e)","SELECT MIN(salary) FROM e"],"a":2,"w":"Maximum of what remains after removing the maximum."},{"q":"A derived table in the FROM clause must:","o":["Have an alias","Return one row","Use EXISTS","Be correlated"],"a":0,"w":"PostgreSQL and MySQL require an alias for it."},{"q":"MySQL error 1093 occurs when:","o":["A foreign key fails","A value is out of range","You update a table using a subquery on the same table","A join has no ON"],"a":2,"w":"Wrap the subquery in a derived table to get around it."}],"star":true,"kw":"subquery scalar correlated exists not exists in any all derived table lateral nth highest second highest","mins":30},{"id":"set-ops","group":"E. Writing queries","title":"UNION, UNION ALL, INTERSECT, EXCEPT","intro":"Combine the results of whole queries. Both sides need the same number of columns with compatible types.","blocks":[{"k":"table","head":["Operator","Result","Duplicates","Notes"],"rows":[["UNION","Rows in either query","Removed (sort or hash)","Slower than UNION ALL"],["UNION ALL","All rows of both","Kept","Fast; use when duplicates are impossible or wanted"],["INTERSECT","Rows in both","Removed (INTERSECT ALL keeps)","MySQL 8.0.31+"],["EXCEPT / MINUS","Rows in the first not in the second","Removed","PostgreSQL, SQL Server, SQLite: EXCEPT. Oracle: MINUS. MySQL 8.0.31+: EXCEPT"]]},{"k":"code","lang":"sql","code":"SELECT city FROM employees WHERE dept_id = 1\nUNION\nSELECT city FROM employees WHERE dept_id = 3;","cap":"distinct cities","run":true},{"k":"code","lang":"sql","code":"SELECT city FROM employees WHERE dept_id = 1\nUNION ALL\nSELECT city FROM employees WHERE dept_id = 3;","cap":"6 rows: duplicates kept","run":true},{"k":"code","lang":"sql","code":"SELECT id FROM departments\nEXCEPT\nSELECT dept_id FROM employees;      -- departments with no employees","cap":null,"run":true},{"k":"code","lang":"my","code":"SELECT d.id FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;      -- EXCEPT needs MySQL 8.0.31+; this works on every version","cap":"MySQL: EXCEPT without EXCEPT","run":false},{"k":"code","lang":"sql","code":"SELECT city FROM employees WHERE dept_id = 1\nINTERSECT\nSELECT city FROM employees WHERE dept_id = 2;      -- cities common to both departments","cap":null,"run":true},{"k":"code","lang":"my","code":"SELECT DISTINCT city FROM employees WHERE dept_id = 1 AND city IN (SELECT city FROM employees WHERE dept_id = 2);      -- INTERSECT needs MySQL 8.0.31+; this works on every version","cap":"MySQL: INTERSECT without INTERSECT","run":false},{"k":"ul","t":["Column names come from the FIRST query.","ORDER BY applies to the whole combined result and goes at the very end.","Precedence: INTERSECT binds tighter than UNION and EXCEPT; use parentheses.","NULLs are considered equal for duplicate removal here (unlike in =).","Mismatched column counts or types are errors."]},{"k":"code","lang":"sql","code":"SELECT name, 'employee' AS kind FROM employees WHERE id <= 2\nUNION ALL\nSELECT name, 'department' FROM departments\nORDER BY kind, name;","cap":"tagging rows by source","run":true},{"k":"code","lang":"pg","code":"-- full outer join vs UNION: finding rows that differ between two copies of a table\n(SELECT * FROM t_old EXCEPT SELECT * FROM t_new)\nUNION ALL\n(SELECT * FROM t_new EXCEPT SELECT * FROM t_old);","cap":null,"run":false},{"k":"ask","t":"\"UNION vs UNION ALL?\" UNION removes duplicates (extra sort/hash cost), UNION ALL keeps everything and is faster. Default to UNION ALL when you know rows cannot overlap."}],"test":[{"q":"Which keeps duplicate rows?","o":["UNION ALL","EXCEPT","UNION","INTERSECT"],"a":0,"w":"UNION ALL does no duplicate elimination."},{"q":"Oracle's name for EXCEPT is:","o":["MINUS","SUBTRACT","DIFF","NOT IN"],"a":0,"w":"Oracle uses MINUS."},{"q":"The column names of a UNION come from:","o":["Both joined","The first query","The second query","Alphabetical order"],"a":1,"w":"The first SELECT defines the names."},{"q":"Set operations require:","o":["A primary key","Same table","Same number of columns with compatible types","Same row count"],"a":2,"w":"Column count and types must line up."},{"q":"Which pair is guaranteed to give a distinct result?","o":["INTERSECT ALL","UNION ALL","EXCEPT ALL","UNION"],"a":3,"w":"Plain UNION removes duplicates."}],"star":false,"kw":"union intersect except minus set operations all","mins":20},{"id":"cte","group":"E. Writing queries","title":"CTEs (WITH) and recursive queries","intro":"Common Table Expressions name a subquery so queries read top to bottom. Recursive CTEs walk trees and graphs.","blocks":[{"k":"h","t":"Basic CTE"},{"k":"code","lang":"sql","code":"WITH dept_stats AS (\n  SELECT dept_id, AVG(salary) AS avg_sal, COUNT(*) AS n FROM employees WHERE dept_id IS NOT NULL GROUP BY dept_id\n),\nrich_depts AS (\n  SELECT dept_id FROM dept_stats WHERE avg_sal > 100000\n)\nSELECT e.name, e.salary FROM employees e JOIN rich_depts r ON r.dept_id = e.dept_id ORDER BY e.salary DESC;","cap":"chained CTEs","run":true},{"k":"ul","t":["A CTE exists only for the one statement that follows it.","Later CTEs can reference earlier ones. A CTE can be used several times in the main query.","PostgreSQL 12+ inlines simple CTEs; use WITH x AS MATERIALIZED (...) or NOT MATERIALIZED to control it. Older versions always materialized them (an optimization fence).","MySQL supports CTEs from 8.0. PostgreSQL also allows data-modifying CTEs (WITH moved AS (DELETE ... RETURNING *) INSERT ...)."]},{"k":"h","t":"Recursive CTE: walk a hierarchy"},{"k":"p","t":"A recursive CTE has an anchor query, UNION ALL, and a recursive step that refers to the CTE itself. It stops when the recursive step returns no new rows."},{"k":"code","lang":"sql","code":"WITH RECURSIVE org AS (\n  SELECT id, name, manager_id, 0 AS depth, name AS path FROM employees WHERE manager_id IS NULL AND id = 1   -- anchor\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, o.depth + 1, o.path || ' > ' || e.name\n  FROM employees e JOIN org o ON e.manager_id = o.id                                                         -- recursive step\n)\nSELECT depth, path FROM org ORDER BY path;","cap":"everyone under Asha with the reporting chain","run":true},{"k":"code","lang":"my","code":"WITH RECURSIVE org AS (\n  SELECT id, name, manager_id, 0 AS depth, CAST(name AS CHAR(200)) AS path FROM employees WHERE manager_id IS NULL AND id = 1\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, o.depth + 1, CONCAT(o.path, ' > ', e.name)\n  FROM employees e JOIN org o ON e.manager_id = o.id\n)\nSELECT depth, path FROM org ORDER BY path;      -- CAST gives the path column room to grow, otherwise MySQL errors 'Data too long'","cap":"MySQL 8+: CONCAT and a wide CAST","run":false},{"k":"code","lang":"sql","code":"-- generate a number series\nWITH RECURSIVE n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM n WHERE x < 5)\nSELECT x FROM n;","cap":"PostgreSQL also has generate_series(1,5)","run":true},{"k":"code","lang":"sql","code":"-- every subordinate count under each manager\nWITH RECURSIVE sub AS (\n  SELECT id AS top, id AS member FROM employees\n  UNION ALL\n  SELECT s.top, e.id FROM sub s JOIN employees e ON e.manager_id = s.member\n)\nSELECT top, COUNT(*) - 1 AS reports FROM sub GROUP BY top HAVING COUNT(*) > 1 ORDER BY reports DESC;","cap":"total (direct + indirect) reports","run":true},{"k":"trap","t":"Forgetting the stop condition (or a cyclic graph) loops forever. PostgreSQL has CYCLE and SEARCH clauses (14+); MySQL limits depth with cte_max_recursion_depth (default 1000)."},{"k":"h","t":"CTE vs subquery vs temp table vs view"},{"k":"table","head":["","Best for"],"rows":[["Subquery","Small one-off logic"],["CTE","Readability, reuse inside one statement, recursion"],["Temp table","Reusing an expensive result across several statements, indexing the intermediate"],["View","Reusable named query for many statements and users"]]},{"k":"ask","t":"\"What is a CTE and when use a recursive one?\" A named temporary result for one statement; recursive CTEs traverse hierarchies like org charts, category trees and bill of materials."}],"test":[{"q":"A CTE is visible:","o":["Until COMMIT","For the whole session","Only in the statement that follows it","Across the database"],"a":2,"w":"It is scoped to the one statement."},{"q":"A recursive CTE consists of:","o":["Only one SELECT","A trigger and a view","Anchor member UNION ALL recursive member","Two SELECTs joined by JOIN"],"a":2,"w":"Anchor + recursive part."},{"q":"What stops a recursive CTE?","o":["COMMIT","A deadlock","LIMIT only","The recursive member returns no new rows"],"a":3,"w":"It runs until an iteration produces nothing."},{"q":"In MySQL, CTEs are available from version:","o":["5.6","5.7","They are not","8.0"],"a":3,"w":"MySQL 8.0 added CTEs and window functions."},{"q":"Best tool to traverse an employee-manager hierarchy:","o":["GROUP BY","UNION","Recursive CTE","ORDER BY"],"a":2,"w":"Recursive CTE walks arbitrary depth."}],"star":false,"kw":"cte with recursive hierarchy tree materialized","mins":25},{"id":"window","group":"E. Writing queries","title":"Window functions: ranking, LAG/LEAD, running totals","intro":"Window functions compute across related rows WITHOUT collapsing them. They solve top-N per group, running totals, differences with the previous row and more. Heavily asked in interviews.","blocks":[{"k":"h","t":"Syntax"},{"k":"code","lang":"sql","code":"function(args) OVER (\n  [PARTITION BY cols]       -- restart for each group\n  [ORDER BY cols]           -- order inside the partition\n  [ROWS | RANGE frame]      -- which rows around the current one\n)","cap":"skeleton","run":false},{"k":"p","t":"Compared with GROUP BY: GROUP BY returns one row per group; a window function keeps every row and adds a computed column. Window functions run after WHERE, GROUP BY and HAVING, so they cannot appear in WHERE: wrap in a subquery or CTE to filter on them."},{"k":"h","t":"Ranking functions"},{"k":"code","lang":"sql","code":"SELECT name, salary,\n       ROW_NUMBER() OVER (ORDER BY salary DESC, id) AS row_num,   -- 1,2,3,4... no ties\n       RANK()       OVER (ORDER BY salary DESC)     AS rnk,       -- ties share, then skip: 1,2,2,4\n       DENSE_RANK() OVER (ORDER BY salary DESC)     AS dense      -- ties share, no skip: 1,2,2,3\nFROM employees ORDER BY salary DESC, id;","cap":"compare the three on the tied 120000 and 92000","run":true},{"k":"table","head":["Function","Ties","Next value after a tie of 2"],"rows":[["ROW_NUMBER","Broken arbitrarily","Continues 1,2,3,4"],["RANK","Same rank","Skips: 1,2,2,4"],["DENSE_RANK","Same rank","No skip: 1,2,2,3"],["NTILE(n)","Splits into n buckets","Bucket numbers"],["PERCENT_RANK / CUME_DIST","Relative position 0-1",""]]},{"k":"h","t":"Top N per group"},{"k":"code","lang":"sql","code":"SELECT * FROM (\n  SELECT name, dept_id, salary, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC, id) AS rn\n  FROM employees WHERE dept_id IS NOT NULL\n) t WHERE rn <= 2 ORDER BY dept_id, rn;","cap":"two highest-paid per department","run":true},{"k":"code","lang":"sql","code":"-- all employees tied for the top salary in their department: use RANK\nSELECT name, dept_id, salary FROM (\n  SELECT name, dept_id, salary, RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employees WHERE dept_id IS NOT NULL\n) t WHERE r = 1;","cap":null,"run":true},{"k":"h","t":"LAG, LEAD, FIRST_VALUE, LAST_VALUE"},{"k":"code","lang":"sql","code":"SELECT name, hire_date, salary,\n       LAG(salary)  OVER (ORDER BY hire_date) AS prev_salary,\n       LEAD(salary) OVER (ORDER BY hire_date) AS next_salary,\n       salary - LAG(salary, 1, salary) OVER (ORDER BY hire_date) AS change_vs_prev,\n       FIRST_VALUE(name) OVER (ORDER BY hire_date) AS first_hire\nFROM employees ORDER BY hire_date;","cap":"LAG(x, offset, default)","run":true},{"k":"h","t":"Running totals, moving averages, shares"},{"k":"code","lang":"sql","code":"SELECT name, hire_date, salary,\n       SUM(salary) OVER (ORDER BY hire_date, id)                              AS running_total,\n       ROUND(AVG(salary) OVER (ORDER BY hire_date, id ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS moving_avg_3,\n       ROUND(100.0 * salary / SUM(salary) OVER (), 1)                         AS pct_of_total,\n       SUM(salary) OVER (PARTITION BY dept_id)                                AS dept_total\nFROM employees ORDER BY hire_date, id;","cap":"ROWS frame, whole-table window with empty OVER()","run":true},{"k":"h","t":"Frames"},{"k":"ul","t":["Default frame when ORDER BY is present: RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW (peers with the same ORDER BY value are included together).","ROWS counts physical rows; RANGE groups equal values. Use ROWS for exact moving windows.","LAST_VALUE needs an explicit frame (ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) or it just returns the current row.","Named windows: ... OVER w ... WINDOW w AS (PARTITION BY dept_id ORDER BY salary)."]},{"k":"h","t":"Deduplicate and gaps"},{"k":"code","lang":"sql","code":"-- keep one row per salary (delete-duplicate pattern)\nSELECT id, name, salary FROM (\n  SELECT id, name, salary, ROW_NUMBER() OVER (PARTITION BY salary ORDER BY id) AS rn FROM employees\n) t WHERE rn = 1 ORDER BY id;","cap":null,"run":true},{"k":"h","t":"Percentiles"},{"k":"code","lang":"pg","code":"SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY salary) AS median FROM employees;","cap":null,"run":false},{"k":"code","lang":"my","code":"-- MySQL has no PERCENTILE_CONT; compute the median with ROW_NUMBER and COUNT or PERCENT_RANK.","cap":null,"run":false},{"k":"ask","t":"\"RANK vs DENSE_RANK vs ROW_NUMBER?\" ROW_NUMBER gives unique numbers, RANK leaves gaps after ties, DENSE_RANK does not. For 'Nth highest salary with ties' use DENSE_RANK."}],"test":[{"q":"Salaries 100, 90, 90, 80. DENSE_RANK of 80 is:","o":["1","3","4","2"],"a":1,"w":"Dense rank has no gaps: 1, 2, 2, 3."},{"q":"Salaries 100, 90, 90, 80. RANK of 80 is:","o":["1","3","4","2"],"a":2,"w":"Ties take rank 2 twice, then the next is 4."},{"q":"Window functions are evaluated:","o":["Before WHERE","Only in HAVING","After WHERE, GROUP BY and HAVING","Before FROM"],"a":2,"w":"That is why you filter on them with a subquery or CTE."},{"q":"Which function gives the previous row's value?","o":["NTILE","FIRST_VALUE","LAG","LEAD"],"a":2,"w":"LAG looks back; LEAD looks forward."},{"q":"SUM(x) OVER () returns:","o":["A running total","The grand total repeated on every row","Per-group totals","One row total"],"a":1,"w":"Empty OVER means one window covering all rows."},{"q":"Top 2 salaries per department is best written with:","o":["GROUP BY dept_id LIMIT 2","ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) <= 2 in an outer query","HAVING salary < 3","DISTINCT"],"a":1,"w":"Rank inside each partition, then filter in the outer query."}],"star":true,"kw":"window function row_number rank dense_rank lag lead over partition by running total moving average ntile top n per group","mins":30},{"id":"dml","group":"E. Writing queries","title":"INSERT, UPDATE, DELETE, UPSERT, MERGE, RETURNING","intro":"Changing data. Interviews ask for the upsert forms, UPDATE with a join, and how to delete duplicates.","blocks":[{"k":"h","t":"INSERT"},{"k":"code","lang":"sql","code":"CREATE TABLE gadget (id INTEGER PRIMARY KEY, name TEXT NOT NULL, price NUMERIC DEFAULT 0, qty INTEGER DEFAULT 0);\nINSERT INTO gadget (id, name, price, qty) VALUES (1, 'lamp', 499, 10);                       -- one row\nINSERT INTO gadget (id, name, price) VALUES (2, 'fan', 1899), (3, 'kettle', 999);             -- several rows, qty uses DEFAULT\nINSERT INTO gadget (id, name) SELECT id + 100, name || ' copy' FROM gadget WHERE id <= 2;       -- INSERT ... SELECT\nSELECT * FROM gadget ORDER BY id;","cap":"column list is optional but always write it","run":true},{"k":"code","lang":"my","code":"INSERT INTO gadget (id, name) SELECT id + 100, CONCAT(name, ' copy') FROM gadget WHERE id <= 2;      -- MySQL: CONCAT instead of ||","cap":"MySQL: INSERT ... SELECT with CONCAT","run":false},{"k":"ul","t":["Always list the columns; a bare INSERT INTO t VALUES (...) breaks when the table gains a column.","Omitted columns get their DEFAULT, or NULL, or an error if they are NOT NULL without a default.","PostgreSQL: INSERT INTO t DEFAULT VALUES; also INSERT ... RETURNING id. MySQL: INSERT IGNORE skips rows that violate unique keys; REPLACE INTO deletes the old row then inserts (avoid, it fires delete triggers and breaks FKs).","Bulk loads: PostgreSQL COPY t FROM '/path.csv' CSV HEADER (or \\copy in psql); MySQL LOAD DATA INFILE. Far faster than thousands of INSERTs."]},{"k":"h","t":"UPDATE"},{"k":"code","lang":"sql","code":"CREATE TABLE gadget (id INTEGER PRIMARY KEY, name TEXT NOT NULL, price NUMERIC DEFAULT 0, qty INTEGER DEFAULT 0);\nINSERT INTO gadget VALUES (1,'lamp',499,10),(2,'fan',1899,0),(101,'lamp copy',0,0);\nUPDATE gadget SET price = price * 1.10 WHERE name = 'lamp';                -- expression using the old value\nUPDATE gadget SET price = 0, qty = 0 WHERE id > 100;                              -- several columns\nUPDATE gadget SET qty = (SELECT COUNT(*) FROM employees) WHERE id = 1;            -- value from a subquery\nSELECT id, name, price, qty FROM gadget ORDER BY id;","cap":null,"run":true},{"k":"trap","t":"UPDATE or DELETE without WHERE changes every row. In an interview, say 'I would run it as a SELECT first, and inside a transaction'."},{"k":"h","t":"UPDATE with a join (syntax differs)"},{"k":"code","lang":"pg","code":"UPDATE employees e\nSET    salary = e.salary * 1.05\nFROM   departments d\nWHERE  d.id = e.dept_id AND d.name = 'Data';","cap":null,"run":false},{"k":"code","lang":"my","code":"UPDATE employees e\nJOIN   departments d ON d.id = e.dept_id\nSET    e.salary = e.salary * 1.05\nWHERE  d.name = 'Data';","cap":null,"run":false},{"k":"code","lang":"sql","code":"-- portable form with a subquery (runs everywhere)\nUPDATE employees SET salary = salary * 1.05 WHERE dept_id IN (SELECT id FROM departments WHERE name = 'Data');\nSELECT name, salary FROM employees WHERE dept_id = 2 ORDER BY id;","cap":null,"run":true},{"k":"h","t":"DELETE (and deleting with a join)"},{"k":"code","lang":"sql","code":"CREATE TABLE gadget (id INTEGER PRIMARY KEY, name TEXT NOT NULL, price NUMERIC DEFAULT 0, qty INTEGER DEFAULT 0);\nINSERT INTO gadget VALUES (1,'lamp',499,10),(2,'fan',1899,0),(101,'lamp copy',0,0);\nDELETE FROM gadget WHERE id > 100;\nSELECT COUNT(*) AS left_rows FROM gadget;","cap":null,"run":true},{"k":"code","lang":"pg","code":"DELETE FROM assignments a USING projects p WHERE p.id = a.project_id AND p.budget < 150000;","cap":null,"run":false},{"k":"code","lang":"my","code":"DELETE a FROM assignments a JOIN projects p ON p.id = a.project_id WHERE p.budget < 150000;","cap":null,"run":false},{"k":"h","t":"Delete duplicate rows, keep one"},{"k":"code","lang":"sql","code":"CREATE TABLE emailing (id INTEGER PRIMARY KEY, email TEXT);\nINSERT INTO emailing VALUES (1,'a@x'),(2,'b@x'),(3,'a@x'),(4,'a@x'),(5,'b@x');\nDELETE FROM emailing WHERE id NOT IN (SELECT MIN(id) FROM emailing GROUP BY email);   -- keep the smallest id per email\nSELECT * FROM emailing ORDER BY id;","cap":"left with ids 1 and 2","run":true},{"k":"code","lang":"pg","code":"DELETE FROM emailing a USING emailing b WHERE a.email = b.email AND a.id > b.id;       -- self-join delete\n-- or with a window function:\nDELETE FROM emailing WHERE id IN (SELECT id FROM (SELECT id, ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) rn FROM emailing) t WHERE rn > 1);","cap":null,"run":false},{"k":"h","t":"UPSERT: insert or update if it exists"},{"k":"code","lang":"sql","code":"CREATE TABLE stock (sku TEXT PRIMARY KEY, qty INTEGER NOT NULL);\nINSERT INTO stock VALUES ('A1', 5);\nINSERT INTO stock (sku, qty) VALUES ('A1', 3) ON CONFLICT (sku) DO UPDATE SET qty = stock.qty + excluded.qty;\nINSERT INTO stock (sku, qty) VALUES ('B2', 7) ON CONFLICT (sku) DO NOTHING;\nSELECT * FROM stock ORDER BY sku;","cap":"PostgreSQL and SQLite syntax: A1 becomes 8","run":true},{"k":"code","lang":"my","code":"INSERT INTO stock (sku, qty) VALUES ('A1', 3)\nON DUPLICATE KEY UPDATE qty = qty + VALUES(qty);      -- newer: AS new ... qty = qty + new.qty\nINSERT IGNORE INTO stock (sku, qty) VALUES ('B2', 7);","cap":null,"run":false},{"k":"h","t":"MERGE (SQL standard)"},{"k":"code","lang":"pg","code":"MERGE INTO stock s                                    -- PostgreSQL 15+\nUSING incoming i ON s.sku = i.sku\nWHEN MATCHED THEN UPDATE SET qty = s.qty + i.qty\nWHEN NOT MATCHED THEN INSERT (sku, qty) VALUES (i.sku, i.qty);","cap":null,"run":false},{"k":"my","t":"MySQL has no MERGE; use INSERT ... ON DUPLICATE KEY UPDATE. Oracle and SQL Server do have MERGE."},{"k":"h","t":"RETURNING (PostgreSQL, SQLite 3.35+, MariaDB)"},{"k":"code","lang":"sql","code":"CREATE TABLE stock (sku TEXT PRIMARY KEY, qty INTEGER NOT NULL);\nINSERT INTO stock (sku, qty) VALUES ('C3', 1) RETURNING sku, qty;\nUPDATE stock SET qty = qty + 1 WHERE sku = 'C3' RETURNING *;","cap":"get changed rows back without a second query","run":true},{"k":"code","lang":"my","code":"INSERT INTO stock (sku, qty) VALUES ('C3', 1);\nSELECT sku, qty FROM stock WHERE sku = 'C3';            -- MySQL has no RETURNING: read the row back\nUPDATE stock SET qty = qty + 1 WHERE sku = 'C3';\nSELECT * FROM stock WHERE sku = 'C3';","cap":"MySQL: no RETURNING, so select afterwards","run":false},{"k":"ask","t":"\"How do you insert if not exists, update otherwise?\" PostgreSQL: INSERT ... ON CONFLICT (key) DO UPDATE. MySQL: INSERT ... ON DUPLICATE KEY UPDATE. Standard: MERGE."}],"test":[{"q":"PostgreSQL upsert clause:","o":["ON DUPLICATE KEY UPDATE","REPLACE INTO","UPSERT INTO","ON CONFLICT ... DO UPDATE"],"a":3,"w":"The first is MySQL, REPLACE INTO deletes and reinserts."},{"q":"Which statement forgets WHERE and updates every row?","o":["UPDATE t SET x = 1 WHERE id = 1","UPDATE t SET x = 1","DELETE FROM t WHERE id = 1","SELECT x FROM t"],"a":1,"w":"No WHERE means all rows."},{"q":"Updating with a join in PostgreSQL uses:","o":["UPDATE ... JOIN ... SET","UPDATE ... FROM ... WHERE","UPDATE ... INNER USING","MERGE only"],"a":1,"w":"MySQL uses UPDATE ... JOIN ... SET."},{"q":"Which returns the generated id of an insert in PostgreSQL?","o":["SCOPE_IDENTITY","OUTPUT","GETID","RETURNING"],"a":3,"w":"INSERT ... RETURNING."},{"q":"To delete duplicates but keep the first, you can delete rows where id NOT IN:","o":["SELECT MIN(id) ... GROUP BY key (keeps first)","SELECT COUNT(*)","SELECT MAX(id) ... GROUP BY key (keeps last)","SELECT DISTINCT *"],"a":0,"w":"MIN(id) per group keeps the first row of each."}],"star":true,"kw":"insert update delete upsert on conflict merge returning bulk copy delete duplicates update join","mins":35},{"id":"views","group":"E. Writing queries","title":"Views and materialized views","intro":"A view is a stored query that behaves like a table. Interviews ask what they are for and whether they can be updated.","blocks":[{"k":"code","lang":"sql","code":"CREATE VIEW dept_summary AS\nSELECT d.id AS dept_id, d.name AS dept, COUNT(e.id) AS headcount, COALESCE(SUM(e.salary), 0) AS payroll\nFROM departments d LEFT JOIN employees e ON e.dept_id = d.id\nGROUP BY d.id, d.name;\nSELECT * FROM dept_summary ORDER BY payroll DESC;","cap":null,"run":true},{"k":"ul","t":["A view stores **no data**, only the query. Each use re-runs it (the optimizer merges it into the outer query).","**Uses:** hide complexity, give users a restricted view (column or row security), keep a stable interface when tables change (logical data independence), reuse business definitions.","ALTER/REPLACE: CREATE OR REPLACE VIEW (PostgreSQL, MySQL). DROP VIEW v. PostgreSQL ALTER VIEW only renames or changes ownership/defaults.","**Updatable views:** simple views on one table without DISTINCT, GROUP BY, aggregates, window functions or set operations can take INSERT/UPDATE/DELETE, which pass through to the base table. Complex views are read-only unless you add INSTEAD OF triggers (PostgreSQL)."]},{"k":"h","t":"WITH CHECK OPTION"},{"k":"code","lang":"sql","code":"CREATE VIEW pune_staff AS SELECT id, name, city FROM employees WHERE city = 'Pune' WITH CHECK OPTION;\n-- UPDATE pune_staff SET city = 'Delhi' WHERE id = 5;   -- rejected: the row would leave the view","cap":"PostgreSQL / MySQL (SQLite has no CHECK OPTION)","run":false},{"k":"pg","t":"PostgreSQL supports WITH LOCAL | CASCADED CHECK OPTION and security_barrier views. Revoke access to the base table and GRANT SELECT on the view to expose only some columns."},{"k":"h","t":"Materialized views"},{"k":"code","lang":"pg","code":"CREATE MATERIALIZED VIEW sales_by_month AS\nSELECT date_trunc('month', placed_at) AS month, SUM(total) AS revenue FROM orders GROUP BY 1;\n\nCREATE UNIQUE INDEX ON sales_by_month (month);\nREFRESH MATERIALIZED VIEW sales_by_month;                     -- locks readers\nREFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_month;       -- needs a unique index, no read lock","cap":null,"run":false},{"k":"my","t":"MySQL has no materialized views. Emulate with a summary table refreshed by a scheduled EVENT or application job."},{"k":"table","head":["","View","Materialized view","Table"],"rows":[["Stores data","No","Yes (snapshot)","Yes"],["Always current","Yes","Only after refresh","Yes"],["Can be indexed","No","Yes (PostgreSQL)","Yes"],["Speed","Same as the query","Fast reads","Fast"]]},{"k":"ask","t":"\"View vs table? Can you insert into a view?\" A view is a saved query with no data of its own. Simple single-table views are updatable; joins, aggregates and DISTINCT views are not, unless INSTEAD OF triggers handle the write."}],"test":[{"q":"A standard view stores:","o":["Indexes only","Only the query definition","A copy of the data","Permissions only"],"a":1,"w":"Data is read from base tables at query time."},{"q":"WITH CHECK OPTION prevents:","o":["Writes that make a row disappear from the view","Indexing","Selects","Joins"],"a":0,"w":"Rows inserted or updated through the view must still satisfy its WHERE."},{"q":"Which view is typically NOT updatable?","o":["SELECT a FROM t WHERE b = 2","SELECT a, b FROM t WHERE a > 1","SELECT * FROM t","SELECT dept_id, COUNT(*) FROM t GROUP BY dept_id"],"a":3,"w":"Aggregation loses the mapping to base rows."},{"q":"Which engine lacks materialized views?","o":["PostgreSQL","MySQL","SQL Server (indexed views)","Oracle"],"a":1,"w":"MySQL has none; use summary tables."},{"q":"REFRESH MATERIALIZED VIEW CONCURRENTLY requires:","o":["A partition","A trigger","A unique index on the view","Superuser"],"a":2,"w":"PostgreSQL needs a unique index to diff the old and new contents."}],"star":false,"kw":"view materialized view with check option updatable instead of security","mins":20},{"id":"indexes-sql","group":"E. Writing queries","title":"Creating and using indexes (syntax and EXPLAIN)","intro":"The SQL side of indexing. Theory is in 'File organisation and indexing'.","blocks":[{"k":"code","lang":"sql","code":"CREATE INDEX idx_emp_dept ON employees (dept_id);                       -- single column\nCREATE INDEX idx_emp_city_sal ON employees (city, salary DESC);               -- composite\nCREATE UNIQUE INDEX uq_emp_name_city ON employees (name, city);               -- enforces uniqueness\nEXPLAIN QUERY PLAN SELECT * FROM employees WHERE dept_id = 2;                 -- shows SEARCH using index\nEXPLAIN QUERY PLAN SELECT * FROM employees WHERE salary > 1;                  -- SCAN (no index on salary)","cap":"SQLite shows the plan here","run":true},{"k":"table","head":["Task","PostgreSQL","MySQL"],"rows":[["Create","CREATE INDEX name ON t (col);","CREATE INDEX name ON t (col);  or ALTER TABLE t ADD INDEX ..."],["Unique","CREATE UNIQUE INDEX ...","CREATE UNIQUE INDEX ..."],["Partial index","CREATE INDEX ... ON t (col) WHERE active;","Not supported"],["Expression index","CREATE INDEX ... ON t (LOWER(email));","Functional key parts (8.0.13+): ((LOWER(email)))"],["Index type","USING btree | hash | gin | gist | brin","USING BTREE | HASH; FULLTEXT; SPATIAL"],["Build without blocking writes","CREATE INDEX CONCURRENTLY ...","ALGORITHM=INPLACE, LOCK=NONE (online DDL)"],["Drop","DROP INDEX name;","DROP INDEX name ON t;"],["Covering columns","CREATE INDEX ... ON t (a) INCLUDE (b);","put columns in the index itself"],["Show indexes","\\d table  or  pg_indexes","SHOW INDEX FROM t;"],["Plan","EXPLAIN (ANALYZE, BUFFERS) query;","EXPLAIN [ANALYZE] query;"]]},{"k":"code","lang":"pg","code":"CREATE INDEX idx_orders_open ON orders (customer_id) WHERE status = 'new';      -- small, targeted\nCREATE INDEX idx_users_lower_email ON users (LOWER(email));                              -- serves WHERE LOWER(email) = ...\nCREATE INDEX idx_docs_tsv ON docs USING gin (to_tsvector('english', body));              -- full text\nCREATE INDEX idx_events_brin ON events USING brin (created_at);                          -- huge append-only table\nCREATE INDEX CONCURRENTLY idx_big ON big_table (col);                                    -- no write lock (cannot run in a transaction)","cap":null,"run":false},{"k":"h","t":"Checklist"},{"k":"ul","t":["Unique and primary key constraints create their own indexes automatically.","Index every foreign key column (PostgreSQL does not; InnoDB does).","Composite order: equality columns first, then range, then ORDER BY columns.","Verify with EXPLAIN; an unused index only slows writes.","Rebuild / maintain: PostgreSQL REINDEX, VACUUM ANALYZE; MySQL OPTIMIZE TABLE, ANALYZE TABLE."]},{"k":"ask","t":"\"Table has 10 million rows and the query is slow: what first?\" EXPLAIN it, find the scan, index the filter/join columns in the right order, re-check the plan."}],"test":[{"q":"Which index only exists in PostgreSQL among the two?","o":["Unique","B-tree","Partial","Composite"],"a":2,"w":"MySQL cannot index a subset of rows."},{"q":"Build an index in PostgreSQL without blocking writes:","o":["CREATE INDEX ONLINE","ALTER INDEX NOWAIT","CREATE LAZY INDEX","CREATE INDEX CONCURRENTLY"],"a":3,"w":"CONCURRENTLY, and it cannot run inside a transaction block."},{"q":"PRIMARY KEY and UNIQUE automatically create:","o":["An index","A view","A trigger","A sequence only"],"a":0,"w":"A unique index backs each of them."},{"q":"An index on LOWER(email) is called:","o":["Covering","Bitmap","Expression (functional)","Partial"],"a":2,"w":"It indexes the result of an expression."},{"q":"Which index type suits a huge append-only time-series table in PostgreSQL?","o":["BRIN","Hash","GIN","Bitmap"],"a":0,"w":"BRIN stores min/max per block range with tiny size."}],"star":false,"kw":"create index unique composite partial expression covering concurrently explain drop","mins":15},{"id":"classics-1","group":"F. Classic interview queries","title":"Classic interview queries, set 1: the basics (12)","intro":"These are the queries companies reuse. Each has the problem, a tested solution on the sample database, and the idea to say out loud. Tables: employees(id, name, dept_id, manager_id, salary, hire_date, city), departments(id, name, budget), projects, assignments(emp_id, project_id, hours), logins(emp_id, login_date).","blocks":[{"k":"h","t":"Practise on real platforms (verified links)"},{"k":"code","lang":"txt","code":"HackerRank SQL   https://www.hackerrank.com/domains/sql        closest to a real OA; choose MySQL in the language box\nLeetCode DB      https://leetcode.com/problemset/database/    (blocks scripts, opens fine in a browser)\nDataLemur        https://datalemur.com/\nStrataScratch    https://www.stratascratch.com/\nSQLZoo           https://sqlzoo.net/\nIn an OA: check which engine the language box says before you write anything, add ORDER BY, and match the output column names exactly.","cap":null,"run":false},{"k":"h","t":"1. Second highest salary"},{"k":"p","t":"Return the second highest distinct salary."},{"k":"code","lang":"sql","code":"SELECT MAX(salary) AS second_highest FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);\n-- or: SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;\n-- or: SELECT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) r FROM employees) t WHERE r = 2 LIMIT 1;","cap":null,"run":true},{"k":"note","t":"Return NULL (not an error) when there is no second salary: the MAX form does that naturally. State the tie handling: DISTINCT / DENSE_RANK treats equal salaries as one rank."},{"k":"h","t":"2. Nth highest salary in general"},{"k":"code","lang":"sql","code":"SELECT salary FROM (\n  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r FROM employees\n) t WHERE r = 3 GROUP BY salary;     -- change 3 to N","cap":"98000","run":true},{"k":"h","t":"3. Find duplicate values"},{"k":"code","lang":"sql","code":"SELECT salary, COUNT(*) AS times FROM employees GROUP BY salary HAVING COUNT(*) > 1;","cap":"92000 and 120000 appear twice","run":true},{"k":"h","t":"4. Employees who earn more than their manager"},{"k":"code","lang":"sql","code":"SELECT e.name FROM employees e JOIN employees m ON m.id = e.manager_id WHERE e.salary > m.salary;","cap":"Kiran, Nisha","run":true},{"k":"h","t":"5. Departments with no employees"},{"k":"code","lang":"sql","code":"SELECT d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;\n-- or NOT EXISTS / EXCEPT","cap":"Design","run":true},{"k":"h","t":"6. Employees with no department"},{"k":"code","lang":"sql","code":"SELECT name FROM employees WHERE dept_id IS NULL;","cap":"Farhan","run":true},{"k":"h","t":"7. Department-wise highest paid (with ties)"},{"k":"code","lang":"sql","code":"SELECT d.name AS dept, e.name, e.salary\nFROM employees e JOIN departments d ON d.id = e.dept_id\nWHERE e.salary = (SELECT MAX(salary) FROM employees x WHERE x.dept_id = e.dept_id)\nORDER BY d.name;","cap":null,"run":true},{"k":"h","t":"8. Employees earning above their department average"},{"k":"code","lang":"sql","code":"SELECT e.name, e.salary FROM employees e\nWHERE e.salary > (SELECT AVG(x.salary) FROM employees x WHERE x.dept_id = e.dept_id);","cap":"correlated; the window version avoids the repeated subquery","run":true},{"k":"code","lang":"sql","code":"SELECT name, salary FROM (SELECT name, salary, AVG(salary) OVER (PARTITION BY dept_id) AS dept_avg FROM employees) t WHERE salary > dept_avg;","cap":"window version","run":true},{"k":"h","t":"9. Headcount per department including zeros"},{"k":"code","lang":"sql","code":"SELECT d.name, COUNT(e.id) AS headcount FROM departments d LEFT JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name ORDER BY headcount DESC;","cap":null,"run":true},{"k":"h","t":"10. Departments with more than 2 employees"},{"k":"code","lang":"sql","code":"SELECT d.name, COUNT(*) AS n FROM employees e JOIN departments d ON d.id = e.dept_id GROUP BY d.id, d.name HAVING COUNT(*) > 2;","cap":null,"run":true},{"k":"h","t":"11. Top 3 salaries (with ties) overall"},{"k":"code","lang":"sql","code":"SELECT name, salary FROM (SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) r FROM employees) t WHERE r <= 3 ORDER BY salary DESC, name;","cap":"ROW_NUMBER would cut tied rows","run":true},{"k":"h","t":"12. Employees assigned to every project of department 1 (relational division)"},{"k":"code","lang":"sql","code":"-- employees assigned to ALL projects of dept 1\nSELECT e.name FROM employees e\nWHERE NOT EXISTS (SELECT 1 FROM projects p WHERE p.dept_id = 1\n                  AND NOT EXISTS (SELECT 1 FROM assignments a WHERE a.emp_id = e.id AND a.project_id = p.id));\n-- GROUP BY form: count distinct required projects and compare\nSELECT a.emp_id FROM assignments a JOIN projects p ON p.id = a.project_id WHERE p.dept_id = 1\nGROUP BY a.emp_id HAVING COUNT(DISTINCT p.id) = (SELECT COUNT(*) FROM projects WHERE dept_id = 1);","cap":"Rohan (id 2)","run":true},{"k":"ask","t":"When you give an answer, name the edge cases unprompted: ties, NULLs, empty groups, and what the query returns when nothing matches."}],"test":[{"q":"Which function keeps ties together when finding the 3rd highest salary?","o":["ROW_NUMBER","DENSE_RANK","NTILE","RANK"],"a":1,"w":"DENSE_RANK has no gaps, so 'third distinct salary' is rank 3."},{"q":"How many employees earn more than their manager in the sample data?","o":["4","3","0","2"],"a":3,"w":"Kiran (92000 vs Arjun 88000) and Nisha (92000 vs Arjun 88000)."},{"q":"To list departments with zero employees you use:","o":["LEFT JOIN ... WHERE e.id IS NULL","UNION","CROSS JOIN","INNER JOIN"],"a":0,"w":"Anti-join: unmatched left rows have NULL right columns."},{"q":"The HAVING clause in 'departments with more than 2 employees' is needed because:","o":["GROUP BY requires it","JOIN requires it","WHERE cannot filter on COUNT(*)","HAVING is faster"],"a":2,"w":"The count exists only after grouping."},{"q":"Duplicates in a column are found with:","o":["LIMIT 1","GROUP BY col HAVING COUNT(*) > 1","DISTINCT col","ORDER BY col"],"a":1,"w":"Group, count, keep groups with more than one row."}],"star":true,"kw":"interview classic queries second highest nth salary duplicates manager department no employees top n ties division","mins":40},{"id":"classics-2","group":"F. Classic interview queries","title":"Classic interview queries, set 2: window, gaps, pivot, hierarchy (12)","intro":"The harder tier asked by product companies. Each solution is tested on the sample data.","blocks":[{"k":"h","t":"13. Running total"},{"k":"code","lang":"sql","code":"SELECT name, hire_date, salary, SUM(salary) OVER (ORDER BY hire_date, id) AS running_payroll FROM employees ORDER BY hire_date, id;","cap":null,"run":true},{"k":"h","t":"14. Consecutive login streaks (gaps and islands)"},{"k":"p","t":"Idea: subtract the row number from the date. Consecutive days give the same constant, which labels the island."},{"k":"code","lang":"sql","code":"WITH x AS (\n  SELECT emp_id, login_date,\n         date(login_date, '-' || ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) || ' day') AS grp\n  FROM logins\n)\nSELECT emp_id, COUNT(*) AS streak, MIN(login_date) AS from_date, MAX(login_date) AS to_date\nFROM x GROUP BY emp_id, grp ORDER BY streak DESC, emp_id;","cap":"Employee 7 has the longest streak: 4 days","run":true},{"k":"code","lang":"my","code":"WITH x AS (\n  SELECT emp_id, login_date,\n         DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) DAY) AS grp\n  FROM logins\n)\nSELECT emp_id, COUNT(*) AS streak, MIN(login_date) AS from_date, MAX(login_date) AS to_date\nFROM x GROUP BY emp_id, grp ORDER BY streak DESC, emp_id;","cap":"MySQL 8+: DATE_SUB with an INTERVAL","run":false},{"k":"code","lang":"pg","code":"-- PostgreSQL form of the same idea\nSELECT emp_id, COUNT(*) AS streak, MIN(login_date), MAX(login_date)\nFROM (SELECT emp_id, login_date, login_date::date - (ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date))::int AS grp FROM logins) t\nGROUP BY emp_id, grp;","cap":null,"run":false},{"k":"h","t":"15. Users who logged in 3 days in a row"},{"k":"code","lang":"sql","code":"SELECT DISTINCT a.emp_id FROM logins a\nJOIN logins b ON b.emp_id = a.emp_id AND b.login_date = date(a.login_date, '+1 day')\nJOIN logins c ON c.emp_id = a.emp_id AND c.login_date = date(a.login_date, '+2 day');","cap":"self-join method (employees 2 and 7)","run":true},{"k":"code","lang":"my","code":"SELECT DISTINCT a.emp_id FROM logins a\nJOIN logins b ON b.emp_id = a.emp_id AND b.login_date = DATE_ADD(a.login_date, INTERVAL 1 DAY)\nJOIN logins c ON c.emp_id = a.emp_id AND c.login_date = DATE_ADD(a.login_date, INTERVAL 2 DAY);","cap":"MySQL: DATE_ADD ... INTERVAL","run":false},{"k":"h","t":"16. Change versus the previous row"},{"k":"code","lang":"sql","code":"SELECT name, hire_date, salary, salary - LAG(salary) OVER (ORDER BY hire_date, id) AS diff_from_previous_hire FROM employees ORDER BY hire_date, id;","cap":null,"run":true},{"k":"h","t":"17. Pivot rows to columns"},{"k":"code","lang":"sql","code":"SELECT dept_id,\n       SUM(CASE WHEN city = 'Bengaluru' THEN 1 ELSE 0 END) AS bengaluru,\n       SUM(CASE WHEN city = 'Hyderabad' THEN 1 ELSE 0 END) AS hyderabad,\n       SUM(CASE WHEN city = 'Pune'      THEN 1 ELSE 0 END) AS pune\nFROM employees WHERE dept_id IS NOT NULL GROUP BY dept_id ORDER BY dept_id;","cap":null,"run":true},{"k":"code","lang":"pg","code":"SELECT * FROM crosstab('SELECT dept_id, city, COUNT(*) FROM employees GROUP BY 1,2 ORDER BY 1,2') AS ct(dept_id int, bengaluru int, hyderabad int, pune int);   -- needs the tablefunc extension","cap":null,"run":false},{"k":"h","t":"18. Median salary"},{"k":"code","lang":"sql","code":"SELECT AVG(salary) AS median FROM (\n  SELECT salary, ROW_NUMBER() OVER (ORDER BY salary) AS rn, COUNT(*) OVER () AS cnt FROM employees\n) t WHERE rn IN ((cnt + 1) / 2, (cnt + 2) / 2);","cap":"works on any engine with window functions","run":true},{"k":"code","lang":"pg","code":"SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY salary) FROM employees;","cap":null,"run":false},{"k":"h","t":"19. Find missing numbers in a sequence"},{"k":"code","lang":"sql","code":"CREATE TABLE seq (n INTEGER);\nINSERT INTO seq VALUES (1),(2),(4),(7),(8);\nWITH RECURSIVE all_n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM all_n WHERE x < (SELECT MAX(n) FROM seq))\nSELECT x AS missing FROM all_n WHERE x NOT IN (SELECT n FROM seq);","cap":"3, 5, 6","run":true},{"k":"code","lang":"pg","code":"SELECT x FROM generate_series(1, (SELECT MAX(n) FROM seq)) x WHERE x NOT IN (SELECT n FROM seq);","cap":null,"run":false},{"k":"h","t":"20. Cumulative percentage and share of total"},{"k":"code","lang":"sql","code":"SELECT name, salary,\n       ROUND(100.0 * salary / SUM(salary) OVER (), 1) AS pct,\n       ROUND(100.0 * SUM(salary) OVER (ORDER BY salary DESC, id) / SUM(salary) OVER (), 1) AS cum_pct\nFROM employees ORDER BY salary DESC, id;","cap":null,"run":true},{"k":"h","t":"21. First and last record per group"},{"k":"code","lang":"sql","code":"SELECT DISTINCT dept_id,\n       FIRST_VALUE(name) OVER (PARTITION BY dept_id ORDER BY hire_date ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS first_hire,\n       LAST_VALUE(name)  OVER (PARTITION BY dept_id ORDER BY hire_date ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS latest_hire\nFROM employees WHERE dept_id IS NOT NULL ORDER BY dept_id;","cap":"LAST_VALUE needs the full frame","run":true},{"k":"h","t":"22. Org chart: everyone under a manager"},{"k":"code","lang":"sql","code":"WITH RECURSIVE t AS (SELECT id, name, 0 AS lvl FROM employees WHERE id = 3\n  UNION ALL SELECT e.id, e.name, t.lvl + 1 FROM employees e JOIN t ON e.manager_id = t.id)\nSELECT * FROM t ORDER BY lvl, id;","cap":null,"run":true},{"k":"h","t":"23. Hires per year with year-over-year change"},{"k":"code","lang":"sql","code":"WITH y AS (SELECT strftime('%Y', hire_date) AS yr, COUNT(*) AS hires FROM employees GROUP BY 1)\nSELECT yr, hires, hires - LAG(hires) OVER (ORDER BY yr) AS diff_from_prev FROM y ORDER BY yr;","cap":"strftim
