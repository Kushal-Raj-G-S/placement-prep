uired)\ncourse(course_id INTEGER primary key, title text required, credits integer that must be between 1 and 6)\nenrollment(student_id, course_id, grade text) where a student can enrol in a course only once, an enrollment disappears when its student is deleted, and a course that still has enrollments cannot be deleted.","ref":"CREATE TABLE student (student_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE course (course_id INTEGER PRIMARY KEY, title TEXT NOT NULL, credits INTEGER CHECK (credits BETWEEN 1 AND 6));\nCREATE TABLE enrollment (\n  student_id INTEGER NOT NULL REFERENCES student(student_id) ON DELETE CASCADE,\n  course_id  INTEGER NOT NULL REFERENCES course(course_id) ON DELETE RESTRICT,\n  grade TEXT,\n  PRIMARY KEY (student_id, course_id));","checks":[{"label":"student has student_id, name","sql":"SELECT student_id, name FROM student LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"course has course_id, title, credits","sql":"SELECT course_id, title, credits FROM course LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"enrollment has student_id, course_id, grade","sql":"SELECT student_id, course_id, grade FROM enrollment LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"valid enrollment is accepted","sql":"INSERT INTO enrollment VALUES (1, 10, 'A')","ok":true,"setup":"INSERT INTO student VALUES (1,'Asha'); INSERT INTO course VALUES (10,'DBMS',4);","after":null,"expect":null},{"label":"second enrollment in the same course is rejected","sql":"INSERT INTO enrollment VALUES (1, 10, 'B')","ok":false,"setup":"INSERT INTO student VALUES (1,'Asha'); INSERT INTO course VALUES (10,'DBMS',4); INSERT INTO enrollment VALUES (1,10,'A');","after":null,"expect":null},{"label":"credits of 9 are rejected","sql":"INSERT INTO course VALUES (11, 'Big', 9)","ok":false,"setup":"","after":null,"expect":null},{"label":"name is required","sql":"INSERT INTO student VALUES (2, NULL)","ok":false,"setup":"","after":null,"expect":null},{"label":"enrollment for a missing student is rejected","sql":"INSERT INTO enrollment VALUES (99, 10, 'A')","ok":false,"setup":"INSERT INTO course VALUES (10,'DBMS',4);","after":null,"expect":null},{"label":"deleting a student removes their enrollments","sql":"DELETE FROM student WHERE student_id = 1","ok":true,"setup":"INSERT INTO student VALUES (1,'Asha'); INSERT INTO course VALUES (10,'DBMS',4); INSERT INTO enrollment VALUES (1,10,'A');","after":"SELECT COUNT(*) FROM enrollment","expect":"0"},{"label":"a course with enrollments cannot be deleted","sql":"DELETE FROM course WHERE course_id = 10","ok":false,"setup":"INSERT INTO student VALUES (1,'Asha'); INSERT INTO course VALUES (10,'DBMS',4); INSERT INTO enrollment VALUES (1,10,'A');","after":null,"expect":null}],"pre":"","mins":10},{"id":"d02","kind":"ddl","db":"empty","tier":1,"tag":"constraints","title":"Employee rules","task":"Create table employee with: emp_id (integer primary key), email (text, required, no two employees may share an email), salary (integer, must be greater than 0), status (text, defaults to 'active'), hired_on (text, required).","ref":"CREATE TABLE employee (emp_id INTEGER PRIMARY KEY, email TEXT NOT NULL UNIQUE, salary INTEGER CHECK (salary > 0), status TEXT DEFAULT 'active', hired_on TEXT NOT NULL);","checks":[{"label":"columns exist","sql":"SELECT emp_id, email, salary, status, hired_on FROM employee LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"valid row accepted","sql":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (1,'a@x.com',50000,'2026-01-01')","ok":true,"setup":"","after":null,"expect":null},{"label":"status defaults to active","sql":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (1,'a@x.com',50000,'2026-01-01')","ok":true,"setup":"","after":"SELECT status FROM employee WHERE emp_id = 1","expect":"active"},{"label":"duplicate email rejected","sql":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (2,'a@x.com',60000,'2026-01-02')","ok":false,"setup":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (1,'a@x.com',50000,'2026-01-01');","after":null,"expect":null},{"label":"zero salary rejected","sql":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (3,'b@x.com',0,'2026-01-01')","ok":false,"setup":"","after":null,"expect":null},{"label":"missing email rejected","sql":"INSERT INTO employee (emp_id, email, salary, hired_on) VALUES (4,NULL,100,'2026-01-01')","ok":false,"setup":"","after":null,"expect":null},{"label":"missing hired_on rejected","sql":"INSERT INTO employee (emp_id, email, salary) VALUES (5,'c@x.com',100)","ok":false,"setup":"","after":null,"expect":null}],"pre":"","mins":6},{"id":"d03","kind":"ddl","db":"empty","tier":2,"tag":"1:N","title":"Library loans","task":"Create member(member_id integer pk, name required), book(book_id integer pk, isbn required and unique, title required) and loan(loan_id integer pk, member_id, book_id, loaned_on required, due_on required, returned_on optional). A loan must reference an existing member and book, and due_on must not be earlier than loaned_on. Dates are text in YYYY-MM-DD form.","ref":"CREATE TABLE member (member_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE book (book_id INTEGER PRIMARY KEY, isbn TEXT NOT NULL UNIQUE, title TEXT NOT NULL);\nCREATE TABLE loan (loan_id INTEGER PRIMARY KEY, member_id INTEGER NOT NULL REFERENCES member(member_id), book_id INTEGER NOT NULL REFERENCES book(book_id),\n  loaned_on TEXT NOT NULL, due_on TEXT NOT NULL, returned_on TEXT, CHECK (due_on >= loaned_on));","checks":[{"label":"member columns","sql":"SELECT member_id, name FROM member LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"book columns","sql":"SELECT book_id, isbn, title FROM book LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"loan columns","sql":"SELECT loan_id, member_id, book_id, loaned_on, due_on, returned_on FROM loan LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"valid loan accepted","sql":"INSERT INTO loan VALUES (1,1,1,'2026-01-01','2026-01-15',NULL)","ok":true,"setup":"INSERT INTO member VALUES (1,'A'); INSERT INTO book VALUES (1,'111','T');","after":null,"expect":null},{"label":"due date before loan date rejected","sql":"INSERT INTO loan VALUES (1,1,1,'2026-01-10','2026-01-01',NULL)","ok":false,"setup":"INSERT INTO member VALUES (1,'A'); INSERT INTO book VALUES (1,'111','T');","after":null,"expect":null},{"label":"unknown member rejected","sql":"INSERT INTO loan VALUES (1,9,1,'2026-01-01','2026-01-15',NULL)","ok":false,"setup":"INSERT INTO book VALUES (1,'111','T');","after":null,"expect":null},{"label":"duplicate isbn rejected","sql":"INSERT INTO book VALUES (2,'111','T2')","ok":false,"setup":"INSERT INTO book VALUES (1,'111','T');","after":null,"expect":null}],"pre":"","mins":10},{"id":"d04","kind":"ddl","db":"empty","tier":2,"tag":"self-reference","title":"Org chart","task":"Create table staff(staff_id integer pk, name required, manager_id) where manager_id refers to another staff member (or is NULL for the top person). If a manager is deleted, their reports must stay and their manager_id becomes NULL.","ref":"CREATE TABLE staff (staff_id INTEGER PRIMARY KEY, name TEXT NOT NULL, manager_id INTEGER REFERENCES staff(staff_id) ON DELETE SET NULL);","checks":[{"label":"columns","sql":"SELECT staff_id, name, manager_id FROM staff LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"top person with NULL manager accepted","sql":"INSERT INTO staff VALUES (1,'CEO',NULL)","ok":true,"setup":"","after":null,"expect":null},{"label":"unknown manager rejected","sql":"INSERT INTO staff VALUES (2,'Dev',99)","ok":false,"setup":"","after":null,"expect":null},{"label":"deleting a manager nulls their reports' manager_id","sql":"DELETE FROM staff WHERE staff_id = 1","ok":true,"setup":"INSERT INTO staff VALUES (1,'CEO',NULL); INSERT INTO staff VALUES (2,'Dev',1);","after":"SELECT COUNT(*) FROM staff WHERE staff_id = 2 AND manager_id IS NULL","expect":"1"},{"label":"name required","sql":"INSERT INTO staff VALUES (3, NULL, NULL)","ok":false,"setup":"","after":null,"expect":null}],"pre":"","mins":10},{"id":"d05","kind":"ddl","db":"empty","tier":2,"tag":"composite key","title":"Order lines","task":"Create orders(order_id integer pk, customer text required) and order_line(order_id, line_no, product text required, qty integer greater than 0, unit_price integer not negative). A line is identified by (order_id, line_no). Deleting an order deletes its lines.","ref":"CREATE TABLE orders (order_id INTEGER PRIMARY KEY, customer TEXT NOT NULL);\nCREATE TABLE order_line (order_id INTEGER NOT NULL REFERENCES orders(order_id) ON DELETE CASCADE, line_no INTEGER NOT NULL, product TEXT NOT NULL,\n  qty INTEGER CHECK (qty > 0), unit_price INTEGER CHECK (unit_price >= 0), PRIMARY KEY (order_id, line_no));","checks":[{"label":"orders columns","sql":"SELECT order_id, customer FROM orders LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"order_line columns","sql":"SELECT order_id, line_no, product, qty, unit_price FROM order_line LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"valid line accepted","sql":"INSERT INTO order_line VALUES (1,1,'Pen',2,10)","ok":true,"setup":"INSERT INTO orders VALUES (1,'A');","after":null,"expect":null},{"label":"same line number twice in one order rejected","sql":"INSERT INTO order_line VALUES (1,1,'Ink',1,5)","ok":false,"setup":"INSERT INTO orders VALUES (1,'A'); INSERT INTO order_line VALUES (1,1,'Pen',2,10);","after":null,"expect":null},{"label":"same line number in another order accepted","sql":"INSERT INTO order_line VALUES (2,1,'Ink',1,5)","ok":true,"setup":"INSERT INTO orders VALUES (1,'A'),(2,'B'); INSERT INTO order_line VALUES (1,1,'Pen',2,10);","after":null,"expect":null},{"label":"qty 0 rejected","sql":"INSERT INTO order_line VALUES (1,2,'Pen',0,10)","ok":false,"setup":"INSERT INTO orders VALUES (1,'A');","after":null,"expect":null},{"label":"negative price rejected","sql":"INSERT INTO order_line VALUES (1,2,'Pen',1,-5)","ok":false,"setup":"INSERT INTO orders VALUES (1,'A');","after":null,"expect":null},{"label":"deleting an order deletes its lines","sql":"DELETE FROM orders WHERE order_id = 1","ok":true,"setup":"INSERT INTO orders VALUES (1,'A'); INSERT INTO order_line VALUES (1,1,'Pen',2,10);","after":"SELECT COUNT(*) FROM order_line","expect":"0"}],"pre":"","mins":10},{"id":"d06","kind":"ddl","db":"empty","tier":2,"tag":"weak entity","title":"Dependents of employees","task":"Model a weak entity: emp(emp_id integer pk, name required) and dependent(emp_id, dep_name, relation). A dependent is identified by the employee plus the dependent's name, must belong to an existing employee, and is deleted with the employee.","ref":"CREATE TABLE emp (emp_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE dependent (emp_id INTEGER NOT NULL REFERENCES emp(emp_id) ON DELETE CASCADE, dep_name TEXT NOT NULL, relation TEXT, PRIMARY KEY (emp_id, dep_name));","checks":[{"label":"emp columns","sql":"SELECT emp_id, name FROM emp LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"dependent columns","sql":"SELECT emp_id, dep_name, relation FROM dependent LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"dependent accepted","sql":"INSERT INTO dependent VALUES (1,'Tina','daughter')","ok":true,"setup":"INSERT INTO emp VALUES (1,'A');","after":null,"expect":null},{"label":"same name twice for one employee rejected","sql":"INSERT INTO dependent VALUES (1,'Tina','niece')","ok":false,"setup":"INSERT INTO emp VALUES (1,'A'); INSERT INTO dependent VALUES (1,'Tina','daughter');","after":null,"expect":null},{"label":"same name for another employee accepted","sql":"INSERT INTO dependent VALUES (2,'Tina','daughter')","ok":true,"setup":"INSERT INTO emp VALUES (1,'A'),(2,'B'); INSERT INTO dependent VALUES (1,'Tina','daughter');","after":null,"expect":null},{"label":"dependent without employee rejected","sql":"INSERT INTO dependent VALUES (9,'X','son')","ok":false,"setup":"","after":null,"expect":null},{"label":"employee deletion cascades","sql":"DELETE FROM emp WHERE emp_id = 1","ok":true,"setup":"INSERT INTO emp VALUES (1,'A'); INSERT INTO dependent VALUES (1,'Tina','daughter');","after":"SELECT COUNT(*) FROM dependent","expect":"0"}],"pre":"","mins":10},{"id":"d07","kind":"ddl","db":"empty","tier":2,"tag":"set null","title":"Products and categories","task":"Create category(category_id integer pk, name required and unique) and product(product_id integer pk, name required, category_id optional, price must be greater than 0). If a category is deleted, its products stay with category_id set to NULL.","ref":"CREATE TABLE category (category_id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE);\nCREATE TABLE product (product_id INTEGER PRIMARY KEY, name TEXT NOT NULL, category_id INTEGER REFERENCES category(category_id) ON DELETE SET NULL, price INTEGER CHECK (price > 0));","checks":[{"label":"category columns","sql":"SELECT category_id, name FROM category LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"product columns","sql":"SELECT product_id, name, category_id, price FROM product LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"product without a category accepted","sql":"INSERT INTO product VALUES (1,'Pen',NULL,10)","ok":true,"setup":"","after":null,"expect":null},{"label":"duplicate category name rejected","sql":"INSERT INTO category VALUES (2,'Toys')","ok":false,"setup":"INSERT INTO category VALUES (1,'Toys');","after":null,"expect":null},{"label":"price 0 rejected","sql":"INSERT INTO product VALUES (1,'Pen',NULL,0)","ok":false,"setup":"","after":null,"expect":null},{"label":"unknown category rejected","sql":"INSERT INTO product VALUES (1,'Pen',99,10)","ok":false,"setup":"","after":null,"expect":null},{"label":"deleting a category keeps products with NULL category","sql":"DELETE FROM category WHERE category_id = 1","ok":true,"setup":"INSERT INTO category VALUES (1,'Toys'); INSERT INTO product VALUES (1,'Car',1,100);","after":"SELECT COUNT(*) FROM product WHERE category_id IS NULL","expect":"1"}],"pre":"","mins":10},{"id":"d08","kind":"ddl","db":"empty","tier":2,"tag":"unique pair","title":"No double booking","task":"Create room(room_no integer pk) and booking(booking_id integer pk, room_no, night text, guest text required). A room can be booked for a given night only once. Bookings must refer to an existing room.","ref":"CREATE TABLE room (room_no INTEGER PRIMARY KEY);\nCREATE TABLE booking (booking_id INTEGER PRIMARY KEY, room_no INTEGER NOT NULL REFERENCES room(room_no), night TEXT NOT NULL, guest TEXT NOT NULL, UNIQUE (room_no, night));","checks":[{"label":"room columns","sql":"SELECT room_no FROM room LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"booking columns","sql":"SELECT booking_id, room_no, night, guest FROM booking LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"booking accepted","sql":"INSERT INTO booking VALUES (1,101,'2026-05-01','Asha')","ok":true,"setup":"INSERT INTO room VALUES (101);","after":null,"expect":null},{"label":"same room same night rejected","sql":"INSERT INTO booking VALUES (2,101,'2026-05-01','Rohan')","ok":false,"setup":"INSERT INTO room VALUES (101); INSERT INTO booking VALUES (1,101,'2026-05-01','Asha');","after":null,"expect":null},{"label":"same room different night accepted","sql":"INSERT INTO booking VALUES (2,101,'2026-05-02','Rohan')","ok":true,"setup":"INSERT INTO room VALUES (101); INSERT INTO booking VALUES (1,101,'2026-05-01','Asha');","after":null,"expect":null},{"label":"unknown room rejected","sql":"INSERT INTO booking VALUES (3,999,'2026-05-01','X')","ok":false,"setup":"","after":null,"expect":null},{"label":"guest required","sql":"INSERT INTO booking VALUES (4,101,'2026-05-03',NULL)","ok":false,"setup":"INSERT INTO room VALUES (101);","after":null,"expect":null}],"pre":"","mins":10},{"id":"d09","kind":"ddl","db":"empty","tier":3,"tag":"business rules","title":"Bank accounts","task":"Create account(account_no integer pk, owner required, balance integer default 0 and never negative) and transfer_log(log_id integer pk, from_acct, to_acct, amount). Both account columns reference account, amount must be greater than 0, and money cannot be transferred from an account to itself.","ref":"CREATE TABLE account (account_no INTEGER PRIMARY KEY, owner TEXT NOT NULL, balance INTEGER NOT NULL DEFAULT 0 CHECK (balance >= 0));\nCREATE TABLE transfer_log (log_id INTEGER PRIMARY KEY, from_acct INTEGER NOT NULL REFERENCES account(account_no), to_acct INTEGER NOT NULL REFERENCES account(account_no),\n  amount INTEGER NOT NULL CHECK (amount > 0), CHECK (from_acct <> to_acct));","checks":[{"label":"account columns","sql":"SELECT account_no, owner, balance FROM account LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"transfer_log columns","sql":"SELECT log_id, from_acct, to_acct, amount FROM transfer_log LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"balance defaults to 0","sql":"INSERT INTO account (account_no, owner) VALUES (1,'A')","ok":true,"setup":"","after":"SELECT balance FROM account WHERE account_no = 1","expect":"0"},{"label":"negative balance rejected","sql":"INSERT INTO account VALUES (2,'B',-5)","ok":false,"setup":"","after":null,"expect":null},{"label":"valid transfer accepted","sql":"INSERT INTO transfer_log VALUES (1,1,2,50)","ok":true,"setup":"INSERT INTO account VALUES (1,'A',100),(2,'B',0);","after":null,"expect":null},{"label":"transfer to the same account rejected","sql":"INSERT INTO transfer_log VALUES (1,1,1,50)","ok":false,"setup":"INSERT INTO account VALUES (1,'A',100);","after":null,"expect":null},{"label":"zero amount rejected","sql":"INSERT INTO transfer_log VALUES (1,1,2,0)","ok":false,"setup":"INSERT INTO account VALUES (1,'A',100),(2,'B',0);","after":null,"expect":null},{"label":"unknown account rejected","sql":"INSERT INTO transfer_log VALUES (1,1,99,10)","ok":false,"setup":"INSERT INTO account VALUES (1,'A',100);","after":null,"expect":null}],"pre":"","mins":15},{"id":"d10","kind":"ddl","db":"empty","tier":2,"tag":"1:1","title":"People and passports","task":"Create person(person_id integer pk, name required) and passport(passport_no text pk, person_id, issued_on text). Each passport belongs to exactly one existing person, and each person can have at most one passport.","ref":"CREATE TABLE person (person_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE passport (passport_no TEXT PRIMARY KEY, person_id INTEGER NOT NULL UNIQUE REFERENCES person(person_id), issued_on TEXT);","checks":[{"label":"person columns","sql":"SELECT person_id, name FROM person LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"passport columns","sql":"SELECT passport_no, person_id, issued_on FROM passport LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"passport accepted","sql":"INSERT INTO passport VALUES ('P1',1,'2026-01-01')","ok":true,"setup":"INSERT INTO person VALUES (1,'A');","after":null,"expect":null},{"label":"second passport for the same person rejected","sql":"INSERT INTO passport VALUES ('P2',1,'2026-02-01')","ok":false,"setup":"INSERT INTO person VALUES (1,'A'); INSERT INTO passport VALUES ('P1',1,'2026-01-01');","after":null,"expect":null},{"label":"passport without a person rejected","sql":"INSERT INTO passport VALUES ('P3',NULL,'2026-01-01')","ok":false,"setup":"","after":null,"expect":null},{"label":"passport for unknown person rejected","sql":"INSERT INTO passport VALUES ('P4',99,'2026-01-01')","ok":false,"setup":"","after":null,"expect":null}],"pre":"","mins":10},{"id":"d11","kind":"ddl","db":"empty","tier":2,"tag":"composite key","title":"One vote per poll","task":"Create poll(poll_id integer pk, question required) and vote(poll_id, voter text, rating integer from 1 to 5). A voter can vote only once in each poll. Votes are deleted if the poll is deleted.","ref":"CREATE TABLE poll (poll_id INTEGER PRIMARY KEY, question TEXT NOT NULL);\nCREATE TABLE vote (poll_id INTEGER NOT NULL REFERENCES poll(poll_id) ON DELETE CASCADE, voter TEXT NOT NULL, rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5), PRIMARY KEY (poll_id, voter));","checks":[{"label":"poll columns","sql":"SELECT poll_id, question FROM poll LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"vote columns","sql":"SELECT poll_id, voter, rating FROM vote LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"vote accepted","sql":"INSERT INTO vote VALUES (1,'asha',4)","ok":true,"setup":"INSERT INTO poll VALUES (1,'Q');","after":null,"expect":null},{"label":"same voter twice in a poll rejected","sql":"INSERT INTO vote VALUES (1,'asha',5)","ok":false,"setup":"INSERT INTO poll VALUES (1,'Q'); INSERT INTO vote VALUES (1,'asha',4);","after":null,"expect":null},{"label":"same voter in another poll accepted","sql":"INSERT INTO vote VALUES (2,'asha',5)","ok":true,"setup":"INSERT INTO poll VALUES (1,'Q'),(2,'R'); INSERT INTO vote VALUES (1,'asha',4);","after":null,"expect":null},{"label":"rating 6 rejected","sql":"INSERT INTO vote VALUES (1,'rohan',6)","ok":false,"setup":"INSERT INTO poll VALUES (1,'Q');","after":null,"expect":null},{"label":"deleting a poll deletes votes","sql":"DELETE FROM poll WHERE poll_id = 1","ok":true,"setup":"INSERT INTO poll VALUES (1,'Q'); INSERT INTO vote VALUES (1,'asha',4);","after":"SELECT COUNT(*) FROM vote","expect":"0"}],"pre":"","mins":10},{"id":"d12","kind":"ddl","db":"empty","tier":1,"tag":"defaults","title":"Audit log","task":"Create audit_log(log_id integer pk, action text required, actor text, created_at text that is filled with the current timestamp automatically when not supplied).","ref":"CREATE TABLE audit_log (log_id INTEGER PRIMARY KEY, action TEXT NOT NULL, actor TEXT, created_at TEXT DEFAULT CURRENT_TIMESTAMP);","checks":[{"label":"columns","sql":"SELECT log_id, action, actor, created_at FROM audit_log LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"created_at filled automatically","sql":"INSERT INTO audit_log (action, actor) VALUES ('login','asha')","ok":true,"setup":"","after":"SELECT created_at IS NOT NULL FROM audit_log","expect":"1"},{"label":"action required","sql":"INSERT INTO audit_log (actor) VALUES ('asha')","ok":false,"setup":"","after":null,"expect":null}],"pre":"","mins":6},{"id":"d13","kind":"ddl","db":"empty","tier":2,"tag":"restrict","title":"Departments and employees","task":"Create department(dept_id integer pk, name required and unique) and employee(emp_id integer pk, name required, dept_id required). Every employee must belong to an existing department, and a department that still has employees cannot be deleted.","ref":"CREATE TABLE department (dept_id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE);\nCREATE TABLE employee (emp_id INTEGER PRIMARY KEY, name TEXT NOT NULL, dept_id INTEGER NOT NULL REFERENCES department(dept_id) ON DELETE RESTRICT);","checks":[{"label":"department columns","sql":"SELECT dept_id, name FROM department LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"employee columns","sql":"SELECT emp_id, name, dept_id FROM employee LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"employee accepted","sql":"INSERT INTO employee VALUES (1,'A',1)","ok":true,"setup":"INSERT INTO department VALUES (1,'Data');","after":null,"expect":null},{"label":"employee without department rejected","sql":"INSERT INTO employee VALUES (1,'A',NULL)","ok":false,"setup":"","after":null,"expect":null},{"label":"employee in unknown department rejected","sql":"INSERT INTO employee VALUES (1,'A',9)","ok":false,"setup":"","after":null,"expect":null},{"label":"department with employees cannot be deleted","sql":"DELETE FROM department WHERE dept_id = 1","ok":false,"setup":"INSERT INTO department VALUES (1,'Data'); INSERT INTO employee VALUES (1,'A',1);","after":null,"expect":null},{"label":"empty department can be deleted","sql":"DELETE FROM department WHERE dept_id = 2","ok":true,"setup":"INSERT INTO department VALUES (1,'Data'),(2,'Ops'); INSERT INTO employee VALUES (1,'A',1);","after":null,"expect":null},{"label":"duplicate department name rejected","sql":"INSERT INTO department VALUES (2,'Data')","ok":false,"setup":"INSERT INTO department VALUES (1,'Data');","after":null,"expect":null}],"pre":"","mins":10},{"id":"d14","kind":"ddl","db":"empty","tier":3,"tag":"scheduling","title":"Doctor appointments","task":"Create doctor(doctor_id integer pk, name required), patient(patient_id integer pk, name required) and appointment(appt_id integer pk, doctor_id, patient_id, slot text, status text default 'booked' limited to 'booked', 'done' or 'cancelled'). A doctor cannot have two appointments in the same slot. All references must exist.","ref":"CREATE TABLE doctor (doctor_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE patient (patient_id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE appointment (appt_id INTEGER PRIMARY KEY, doctor_id INTEGER NOT NULL REFERENCES doctor(doctor_id), patient_id INTEGER NOT NULL REFERENCES patient(patient_id),\n  slot TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'booked' CHECK (status IN ('booked','done','cancelled')), UNIQUE (doctor_id, slot));","checks":[{"label":"doctor columns","sql":"SELECT doctor_id, name FROM doctor LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"patient columns","sql":"SELECT patient_id, name FROM patient LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"appointment columns","sql":"SELECT appt_id, doctor_id, patient_id, slot, status FROM appointment LIMIT 0","ok":true,"setup":"","after":null,"expect":null},{"label":"status defaults to booked","sql":"INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (1,1,1,'2026-05-01 10:00')","ok":true,"setup":"INSERT INTO doctor VALUES (1,'D'); INSERT INTO patient VALUES (1,'P');","after":"SELECT status FROM appointment","expect":"booked"},{"label":"same doctor same slot rejected","sql":"INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (2,1,2,'2026-05-01 10:00')","ok":false,"setup":"INSERT INTO doctor VALUES (1,'D'); INSERT INTO patient VALUES (1,'P'),(2,'Q'); INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (1,1,1,'2026-05-01 10:00');","after":null,"expect":null},{"label":"different doctor same slot accepted","sql":"INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (2,2,2,'2026-05-01 10:00')","ok":true,"setup":"INSERT INTO doctor VALUES (1,'D'),(2,'E'); INSERT INTO patient VALUES (1,'P'),(2,'Q'); INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (1,1,1,'2026-05-01 10:00');","after":null,"expect":null},{"label":"invalid status rejected","sql":"INSERT INTO appointment (appt_id, doctor_id, patient_id, slot, status) VALUES (1,1,1,'x','lost')","ok":false,"setup":"INSERT INTO doctor VALUES (1,'D'); INSERT INTO patient VALUES (1,'P');","after":null,"expect":null},{"label":"unknown patient rejected","sql":"INSERT INTO appointment (appt_id, doctor_id, patient_id, slot) VALUES (1,1,9,'x')","ok":false,"setup":"INSERT INTO doctor VALUES (1,'D');","after":null,"expect":null}],"pre":"","mins":15},{"id":"d15","kind":"ddl","db":"empty","tier":2,"tag":"ALTER","title":"Evolve a table","task":"The table gadget(id INTEGER PRIMARY KEY, name TEXT) already exists with one row. Write statements so that: (1) a new column price (integer, required, default 0) exists and the existing row gets price 0, (2) the column name is renamed to title, and (3) an index called idx_gadget_title exists on title.","ref":"ALTER TABLE gadget ADD COLUMN price INTEGER NOT NULL DEFAULT 0; ALTER TABLE gadget RENAME COLUMN name TO title; CREATE INDEX idx_gadget_title ON gadget (title);","checks":[{"label":"price column exists with default 0 on the old row","sql":"SELECT price FROM gadget WHERE id = 1","ok":true,"setup":"","after":"SELECT price FROM gadget WHERE id = 1","expect":"0"},{"label":"column renamed to title","sql":"SELECT title FROM gadget WHERE id = 1","ok":true,"setup":"","after":"SELECT title FROM gadget WHERE id = 1","expect":"lamp"},{"label":"old column name is gone","sql":"SELECT name FROM gadget","ok":false,"setup":"","after":null,"expect":null},{"label":"new rows get the default price","sql":"INSERT INTO gadget (id, title) VALUES (2, 'fan')","ok":true,"setup":"","after":"SELECT price FROM gadget WHERE id = 2","expect":"0"},{"label":"index idx_gadget_title exists","sql":"SELECT name FROM sqlite_master WHERE type = 'index' AND name = 'idx_gadget_title'","ok":true,"setup":"","after":"SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_gadget_title'","expect":"1"}],"pre":"CREATE TABLE gadget (id INTEGER PRIMARY KEY, name TEXT); INSERT INTO gadget VALUES (1, 'lamp');","mins":10},{"id":"p01","kind":"paper","db":"none","tier":3,"tag":"normalization","title":"Decompose to 3NF / BCNF","task":"Relation ENROLL(StudentID, CourseID, InstructorID, InstructorName, Grade) with F = { StudentID, CourseID → Grade ; CourseID → InstructorID ; InstructorID → InstructorName }. Find the candidate key, name the highest normal form, and decompose into relations in 3NF/BCNF.","model":"Candidate key: {StudentID, CourseID}. StudentID and CourseID appear on no right-hand side, so both are in every key; their closure is every attribute.\nPrime: StudentID, CourseID. Non-prime: InstructorID, InstructorName, Grade.\nCourseID → InstructorID is a partial dependency (part of the key determines a non-prime attribute): violates 2NF. Highest normal form: 1NF.\nInstructorID → InstructorName is a transitive dependency.\n\nDecomposition (3NF and BCNF, lossless and dependency preserving):\n  ENROLLMENT(StudentID, CourseID, Grade)         key (StudentID, CourseID)\n  COURSE(CourseID, InstructorID)                 key CourseID\n  INSTRUCTOR(InstructorID, InstructorName)       key InstructorID","rubric":["Finds the key {StudentID, CourseID} with a reason (closure or 'on no RHS')","Names the partial dependency CourseID → InstructorID and concludes 1NF","Notes the transitive dependency InstructorID → InstructorName","Produces the three relations with keys","States that the decomposition is lossless / dependency preserving"],"mins":15},{"id":"p02","kind":"paper","db":"none","tier":3,"tag":"normalization","title":"Keys and normal form by closure","task":"R(A, B, C, D, E) with F = { AB → C, C → D, D → E, E → B }. Find every candidate key, list the prime attributes and give the highest normal form with the reason.","model":"A is on no right-hand side, so A is in every key.\nAB+ = ABCDE (AB→C, C→D, D→E). Key.\nAC+ = ACDEB (C→D, D→E, E→B). Key.   AD+ = ADEBC. Key.   AE+ = AEBCD. Key.\nCandidate keys: AB, AC, AD, AE.  Prime attributes: A, B, C, D, E (all of them).\n3NF: every right-hand side attribute is prime, so yes.\nBCNF: C → D has C as determinant but C+ = {C,D,E,B} does not contain A, so C is not a super key: BCNF fails.\nHighest normal form: 3NF (not BCNF).","rubric":["Argues A must be in every key","Lists AB, AC, AD, AE","States all attributes are prime","Concludes 3NF because every RHS attribute is prime","Shows a BCNF violation such as C → D with C not a super key"],"mins":15},{"id":"p03","kind":"paper","db":"none","tier":2,"tag":"ER to tables","title":"Hospital design on paper","task":"A hospital has doctors, patients and departments. Each doctor belongs to one department. A patient can see many doctors and a doctor many patients; each visit has a date and a diagnosis. Give the entities, relationships with cardinality, and the resulting tables with primary and foreign keys.","model":"Entities: DEPARTMENT(dept_id, name), DOCTOR(doctor_id, name, specialty), PATIENT(patient_id, name, dob).\nRelationships: DEPARTMENT 1:N DOCTOR (works_in, DOCTOR total participation). DOCTOR M:N PATIENT through VISIT(visit_date, diagnosis).\n\nTables:\n  department(dept_id PK, name UNIQUE NOT NULL)\n  doctor(doctor_id PK, name NOT NULL, specialty, dept_id FK → department NOT NULL)\n  patient(patient_id PK, name NOT NULL, dob)\n  visit(visit_id PK, doctor_id FK → doctor, patient_id FK → patient, visit_date NOT NULL, diagnosis,\n        UNIQUE (doctor_id, patient_id, visit_date))\nIndex the foreign keys.","rubric":["Identifies the three entities with keys","Gives DEPARTMENT 1:N DOCTOR and puts dept_id in doctor","Makes visit a junction table for the M:N with its own attributes","Shows primary and foreign keys for each table","Mentions NOT NULL / UNIQUE or indexing"],"mins":10},{"id":"p04","kind":"paper","db":"none","tier":2,"tag":"trigger","title":"PostgreSQL audit trigger","task":"Table employees(id, name, salary) exists, plus salary_audit(audit_id, emp_id, old_salary, new_salary, changed_at). Write the PostgreSQL trigger function and trigger that records every change of salary.","model":"CREATE OR REPLACE FUNCTION fn_salary_audit() RETURNS trigger\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF NEW.salary IS DISTINCT FROM OLD.salary THEN\n    INSERT INTO salary_audit (emp_id, old_salary, new_salary, changed_at)\n    VALUES (OLD.id, OLD.salary, NEW.salary, now());\n  END IF;\n  RETURN NEW;\nEND;\n$$;\n\nCREATE TRIGGER trg_salary_audit\nAFTER UPDATE OF salary ON employees\nFOR EACH ROW\nEXECUTE FUNCTION fn_salary_audit();","rubric":["Function declared RETURNS trigger in plpgsql","Uses OLD and NEW and only logs when the salary really changed","Inserts the audit row with the old and new values and a timestamp","Returns NEW (or NULL for an AFTER trigger)","CREATE TRIGGER with AFTER UPDATE ... FOR EACH ROW EXECUTE FUNCTION"],"mins":10},{"id":"p05","kind":"paper","db":"none","tier":2,"tag":"trigger","title":"MySQL validation trigger","task":"In MySQL, products(product_id, stock) must never get a negative stock through UPDATE. Write a trigger that rejects such updates with a clear message.","model":"DELIMITER $$\nCREATE TRIGGER trg_product_stock_check\nBEFORE UPDATE ON products\nFOR EACH ROW\nBEGIN\n  IF NEW.stock < 0 THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'stock cannot be negative';\n  END IF;\nEND$$\nDELIMITER ;\n-- A CHECK (stock >= 0) constraint (MySQL 8.0.16+) would be simpler and is preferred.","rubric":["BEFORE UPDATE trigger FOR EACH ROW","Tests NEW.stock < 0","Raises the error with SIGNAL SQLSTATE '45000' and a message","Uses DELIMITER (or notes it) around the body","Mentions that a CHECK constraint is the better tool"],"mins":10},{"id":"p06","kind":"paper","db":"none","tier":2,"tag":"function","title":"PostgreSQL function","task":"Write a PostgreSQL function annual_bonus(salary NUMERIC, years INT) returning 15% of salary for 5 or more years, 10% for 2 to 4 years, 5% otherwise, rounded to 2 decimals. Show a query that uses it.","model":"CREATE OR REPLACE FUNCTION annual_bonus(p_salary NUMERIC, p_years INT)\nRETURNS NUMERIC\nLANGUAGE plpgsql IMMUTABLE AS $$\nBEGIN\n  RETURN ROUND(p_salary * CASE WHEN p_years >= 5 THEN 0.15\n                               WHEN p_years >= 2 THEN 0.10\n                               ELSE 0.05 END, 2);\nEND;\n$$;\n\nSELECT name, annual_bonus(salary, 3) FROM employees;","rubric":["CREATE FUNCTION with parameters and RETURNS NUMERIC","Correct three-way logic (CASE or IF/ELSIF)","ROUND(..., 2)","LANGUAGE plpgsql with BEGIN ... RETURN ... END and $$ quoting","A SELECT calling the function"],"mins":10},{"id":"p07","kind":"paper","db":"none","tier":3,"tag":"procedure","title":"Money transfer procedure","task":"Write a PostgreSQL procedure transfer(from_acct, to_acct, amount) on account(account_no, balance) that moves money atomically, rejecting non-positive amounts and missing accounts. Show how to call it.","model":"CREATE OR REPLACE PROCEDURE transfer(p_from BIGINT, p_to BIGINT, p_amount NUMERIC)\nLANGUAGE plpgsql AS $$\nBEGIN\n  IF p_amount <= 0 THEN\n    RAISE EXCEPTION 'amount must be positive';\n  END IF;\n  UPDATE account SET balance = balance - p_amount WHERE account_no = p_from;\n  IF NOT FOUND THEN RAISE EXCEPTION 'source account % missing', p_from; END IF;\n  UPDATE account SET balance = balance + p_amount WHERE account_no = p_to;\n  IF NOT FOUND THEN RAISE EXCEPTION 'target account % missing', p_to; END IF;\nEND;\n$$;\nCALL transfer(100001, 100002, 500);   -- any exception rolls back both updates\n-- balance >= 0 is enforced by CHECK; to be safe against races lock the rows first (SELECT ... FOR UPDATE, lower account number first).","rubric":["CREATE PROCEDURE ... LANGUAGE plpgsql","Validates the amount with RAISE EXCEPTION","Debit and credit in one unit, checks FOUND for missing accounts","Explains that an exception rolls everything back (atomicity)","CALL syntax; bonus: row locking or CHECK for overdraft"],"mins":15},{"id":"p08","kind":"paper","db":"none","tier":1,"tag":"views and grants","title":"Hide salaries from analysts","task":"Analysts may see employee names, department and city, but never salaries. Write the PostgreSQL statements: a view, a role analyst, and the grants.","model":"CREATE VIEW employee_public AS\nSELECT id, name, dept_id, city FROM employees;\n\nCREATE ROLE analyst NOLOGIN;\nREVOKE ALL ON employees FROM analyst;           -- (and from PUBLIC if needed)\nGRANT SELECT ON employee_public TO analyst;\n-- alternative: column-level grant  GRANT SELECT (id, name, dept_id, city) ON employees TO analyst;","rubric":["CREATE VIEW without the salary column","Creates the role","GRANT SELECT on the view (or column list) only","Keeps direct access to the base table closed"],"mins":6},{"id":"p09","kind":"paper","db":"none","tier":2,"tag":"indexing","title":"Choose indexes","task":"Table orders(order_id, customer_id, status, created_at, total) has 50 million rows. Frequent queries: (1) WHERE customer_id = ? ORDER BY created_at DESC LIMIT 20; (2) WHERE status = 'pending' (about 0.2% of rows); (3) WHERE created_at >= ? AND created_at < ?; (4) WHERE LOWER(email) = ? on the customers table. Write the CREATE INDEX statements for PostgreSQL and justify each.","model":"(1) CREATE INDEX idx_orders_cust_created ON orders (customer_id, created_at DESC);\n    Equality column first, then the ORDER BY column: the top 20 rows are read straight from the index.\n(2) CREATE INDEX idx_orders_pending ON orders (order_id) WHERE status = 'pending';\n    A partial index: tiny, because only 0.2% of rows qualify. (A plain index on status would have poor selectivity.)\n(3) CREATE INDEX idx_orders_created ON orders (created_at);   -- or BRIN if the table is append-only and ordered by time\n(4) CREATE INDEX idx_customers_lower_email ON customers (LOWER(email));\n    An expression index, because a plain index on email cannot serve LOWER(email).","rubric":["Composite index with equality column before the sort column","Partial index for the rare status value","Index on created_at for the range (BRIN as a bonus)","Expression index for LOWER(email)","Gives a reason for each choice"],"mins":10},{"id":"p10","kind":"paper","db":"none","tier":2,"tag":"partitioning","title":"Partition by month","task":"Write PostgreSQL DDL for a table event(id, occurred_at, payload) partitioned by month on occurred_at, with partitions for January and February 2026 and a default partition. Explain how you drop old data.","model":"CREATE TABLE event (\n  id BIGINT GENERATED ALWAYS AS IDENTITY,\n  occurred_at TIMESTAMPTZ NOT NULL,\n  payload JSONB,\n  PRIMARY KEY (id, occurred_at)          -- the key must contain the partition column\n) PARTITION BY RANGE (occurred_at);\n\nCREATE TABLE event_2026_01 PARTITION OF event FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');\nCREATE TABLE event_2026_02 PARTITION OF event FOR VALUES FROM ('2026-02-01') TO ('2026-03-01');\nCREATE TABLE event_default PARTITION OF event DEFAULT;\n\n-- old data: ALTER TABLE event DETACH PARTITION event_2026_01;  then archive or DROP TABLE event_2026_01;  (instant, unlike DELETE)","rubric":["PARTITION BY RANGE (occurred_at) on the parent","Primary key includes the partition column","Two PARTITION OF ... FOR VALUES FROM ... TO ... with correct bounds","A DEFAULT partition","Drops old data by detaching/dropping a partition"],"mins":10},{"id":"p11","kind":"paper","db":"none","tier":2,"tag":"window","title":"Top N per group (PostgreSQL)","task":"Using employees(id, name, dept_id, salary), write one query returning the top 2 earners per department, and a second PostgreSQL-specific query returning only the single top earner per department.","model":"SELECT * FROM (\n  SELECT id, name, dept_id, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC, id) AS rn\n  FROM employees\n) t WHERE rn <= 2;\n\nSELECT DISTINCT ON (dept_id) id, name, dept_id, salary\nFROM employees\nORDER BY dept_id, salary DESC, id;","rubric":["Window function with PARTITION BY dept_id ORDER BY salary DESC","Filters rn <= 2 in an outer query (not in WHERE of the same level)","Uses DISTINCT ON (dept_id) for the second query","ORDER BY begins with dept_id and sorts salary descending","Mentions a tiebreaker or RANK for ties"],"mins":10},{"id":"p12","kind":"paper","db":"none","tier":2,"tag":"upsert","title":"Insert or update, both engines","task":"stock(sku PRIMARY KEY, qty). Write the statement that adds 5 units to sku 'A1', inserting the row if it does not exist, in PostgreSQL and in MySQL.","model":"-- PostgreSQL\nINSERT INTO stock (sku, qty) VALUES ('A1', 5)\nON CONFLICT (sku) DO UPDATE SET qty = stock.qty + EXCLUDED.qty;\n\n-- MySQL\nINSERT INTO stock (sku, qty) VALUES ('A1', 5)\nON DUPLICATE KEY UPDATE qty = qty + VALUES(qty);","rubric":["PostgreSQL ON CONFLICT (sku) DO UPDATE","Adds to the existing quantity rather than overwriting","MySQL ON DUPLICATE KEY UPDATE","Uses EXCLUDED / VALUES to refer to the new row"],"mins":10},{"id":"p13","kind":"paper","db":"none","tier":1,"tag":"theory","title":"DELETE vs TRUNCATE vs DROP","task":"Explain the differences between DELETE, TRUNCATE and DROP TABLE in an interview-style answer. Include at least five points.","model":"DELETE: DML. Removes chosen rows (WHERE), row by row, logged per row, fires row triggers, can be rolled back, does not reset auto-increment, table and indexes stay.\nTRUNCATE: DDL. Removes all rows at once by deallocating pages, very fast, no WHERE, no row triggers, resets identity (RESTART IDENTITY in PostgreSQL), blocked when referenced by foreign keys (CASCADE in PostgreSQL). Rollback works in PostgreSQL but not in MySQL (implicit commit).\nDROP TABLE: DDL. Removes the table itself: structure, rows, indexes, constraints and privileges. Anything depending on it breaks (views, foreign keys unless CASCADE).","rubric":["DELETE is DML with WHERE; TRUNCATE and DROP are DDL","TRUNCATE is faster / removes all rows only","DROP removes the structure as well","Rollback and trigger behaviour differ","Mentions identity reset or foreign-key restrictions"],"mins":6},{"id":"p14","kind":"paper","db":"none","tier":2,"tag":"theory","title":"Explain ACID with a transfer","task":"Using a bank transfer of 500 from account A to account B, explain each ACID property and name the mechanism that provides it.","model":"Atomicity: debit and credit both happen or neither does (rollback using the undo log).\nConsistency: constraints and rules still hold afterwards (balance >= 0, total money unchanged); enforced by constraints, triggers and correct application logic.\nIsolation: a concurrent transaction never sees a half-done transfer (locking or MVCC; isolation levels control how strict).\nDurability: after COMMIT the transfer survives a crash because the commit record is flushed to the write-ahead log before acknowledging.","rubric":["Atomicity with the debit/credit example and rollback","Consistency with a named rule","Isolation with locking or MVCC","Durability with the write-ahead log","Names mechanisms rather than only definitions"],"mins":10},{"id":"p15","kind":"paper","db":"none","tier":2,"tag":"theory","title":"Isolation anomalies","task":"Define dirty read, non-repeatable read and phantom read with a short example each, and say which isolation level prevents each.","model":"Dirty read: T2 reads a row T1 changed but has not committed; T1 rolls back, so T2 used data that never existed. Prevented from READ COMMITTED upward.\nNon-repeatable read: T1 reads a row twice; T2 updates and commits in between, so the values differ. Prevented from REPEATABLE READ upward.\nPhantom read: T1 runs the same range query twice; T2 inserts or deletes a matching row in between, so the row set differs. Prevented by SERIALIZABLE in the standard (PostgreSQL REPEATABLE READ also prevents it; InnoDB prevents most with next-key locks).","rubric":["Dirty read definition with uncommitted data and rollback","Non-repeatable read: same row, different value","Phantom read: same predicate, different rows","Maps each to an isolation level","Mentions the default levels of PostgreSQL or MySQL"],"mins":10},{"id":"p16","kind":"paper","db":"none","tier":3,"tag":"concurrency","title":"Deadlock","task":"Describe a concrete two-transaction deadlock on rows of an accounts table, say how the database reacts, and give two ways to avoid it.","model":"T1: UPDATE accounts SET ... WHERE id = 1;   T2: UPDATE accounts SET ... WHERE id = 2;\nT1: UPDATE accounts SET ... WHERE id = 2;   (waits for T2's lock)\nT2: UPDATE accounts SET ... WHERE id = 1;   (waits for T1's lock)  -> circular wait.\nThe database detects the cycle in its wait-for graph and aborts one transaction (the victim) with a deadlock error; the other continues.\nAvoid: always lock/update rows in the same order (for example ascending id); keep transactions short; take all locks up front with SELECT ... FOR UPDATE in a fixed order; retry the aborted transaction.","rubric":["Concrete interleaving with two rows and two transactions","Names the circular wait / wait-for graph","Database aborts a victim","Consistent lock ordering","Short transactions or retry logic"],"mins":15},{"id":"p17","kind":"paper","db":"none","tier":3,"tag":"normalization","title":"Normalize an invoice","task":"Unnormalized: INVOICE(inv_no, inv_date, cust_id, cust_name, cust_city, items{ product_id, product_name, unit_price, qty }). Normalize to 3NF and give the final tables with keys.","model":"1NF: remove the repeating group: one row per invoice line. Key (inv_no, product_id).\n2NF: inv_date, cust_id, cust_name, cust_city depend on inv_no only; product_name, unit_price depend on product_id only. Split.\n3NF: cust_name and cust_city depend on cust_id, not on inv_no: split customer out.\n\n  CUSTOMER(cust_id PK, cust_name, cust_city)\n  INVOICE(inv_no PK, inv_date, cust_id FK)\n  PRODUCT(product_id PK, product_name, unit_price)\n  INVOICE_LINE(inv_no FK, product_id FK, qty, PK (inv_no, product_id))\nNote: store the price actually charged in INVOICE_LINE.unit_price if prices change over time.","rubric":["Removes the repeating group for 1NF","Identifies partial dependencies and splits invoice and product","Identifies the transitive customer dependency","Final four tables with correct keys","Mentions the price snapshot subtlety (bonus)"],"mins":15},{"id":"p18","kind":"paper","db":"none","tier":2,"tag":"relational algebra","title":"Write algebra expressions","task":"With relations EMP(eid, name, dept, salary) and DEPT(dept, dname), write relational algebra for: (a) names of employees earning more than 50000; (b) names of employees with their department names; (c) departments that have no employees.","model":"(a) π name ( σ salary > 50000 (EMP) )\n(b) π name, dname ( EMP ⋈ DEPT )              (natural join on dept)\n(c) π dept (DEPT) − π dept (EMP)                (set difference of department ids)","rubric":["(a) selection then projection in the right order","(b) join on dept then projection","(c) set difference of the department sets","Uses the correct symbols σ π ⋈ −"],"mins":10}],"shopSql":"\nCREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT, joined TEXT);\nINSERT INTO customers VALUES (1,'Anita','Mumbai','2024-01-15'),(2,'Bharat','Delhi','2024-03-02'),(3,'Chitra','Mumbai','2024-03-20'),\n (4,'Deepak','Chennai','2024-06-11'),(5,'Esha','Delhi','2024-08-30'),(6,'Faisal','Pune','2025-01-09'),(7,'Gauri',NULL,'2025-02-14'),(8,'Harsh','Mumbai','2025-04-01');\nCREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);\nINSERT INTO products VALUES (1,'Laptop','Electronics',55000),(2,'Phone','Electronics',30000),(3,'Headphones','Electronics',3000),(4,'Desk','Furniture',9000),\n (5,'Chair','Furniture',6000),(6,'Notebook','Stationery',120),(7,'Pen','Stationery',20),(8,'Backpack','Accessories',1800),(9,'Lamp','Furniture',1500),\n (10,'Mouse','Electronics',800),(11,'Monitor','Electronics',12000),(12,'Stool','Furniture',6000);\nCREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, order_date TEXT, status TEXT);\nINSERT INTO orders VALUES (1,1,'2025-01-10','delivered'),(2,1,'2025-02-14','delivered'),(3,2,'2025-02-20','cancelled'),(4,3,'2025-03-05','delivered'),\n (5,3,'2025-03-18','delivered'),(6,3,'2025-04-02','shipped'),(7,4,'2025-04-10','delivered'),(8,5,'2025-04-22','delivered'),(9,1,'2025-05-03','delivered'),\n (10,6,'2025-05-15','cancelled'),(11,2,'2025-06-01','delivered'),(12,5,'2025-06-12','shipped'),(13,4,'2025-06-30','delivered'),(14,1,'2025-07-08','pending');\nCREATE TABLE order_items (order_id INTEGER, product_id INTEGER, qty INTEGER);\nINSERT INTO order_items VALUES (1,1,1),(1,3,2),(2,6,10),(2,7,20),(3,2,1),(4,4,1),(4,5,2),(5,10,3),(5,3,1),(6,8,2),(7,2,1),(7,10,1),(8,9,4),(8,5,1),\n (9,1,1),(9,10,2),(10,4,1),(11,3,2),(11,6,5),(12,9,2),(13,5,2),(13,7,50),(14,2,1);\n","shopTables":[{"name":"customers","cols":[["id","int pk"],["name","text"],["city","text, one NULL"],["joined","text YYYY-MM-DD"]]},{"name":"products","cols":[["id","int pk"],["name","text"],["category","text"],["price","int"]]},{"name":"orders","cols":[   function buildQuiz() {

    var miss = state.quiz.miss || {};

      r.forEach(function (v) { tr.appendChild(el("td", v === null ? "nul" : null, v === null ? "NULL" : String(v))); });
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    if (rows.length > limit) wrap.appendChild(el("div", "small", "showing " + limit + " of " + rows.length + " rows"));
    return wrap;
  }
  function cheatRun(host, sql) {
    host.textContent = "";
    var d = null;
    try {
      d = cheatDb();
      var res = d.exec(sql.replace(/--.*$/gm, "").trim());   // sql.js fails on a comment after the last statement
      if (!res.length) { host.appendChild(el("div", "cok", "ran without error. It returns no rows (it ran on a throw-away copy, so the demo data is unchanged).")); return; }
      var last = res[res.length - 1];
      host.appendChild(el("div", "clabel", last.values.length + " row" + (last.values.length === 1 ? "" : "s") + " returned"));
      host.appendChild(cheatTable(last.columns, last.values, 40));
    } catch (e) { if (window.console) console.error("cheat run failed", e && e.stack); host.appendChild(el("div", "cerr", "error: " + e.message)); }
    finally { if (d) d.close(); }
  }

  function cheatData() {
    var pane = el("div", "dpane");
    pane.appendChild(el("div", "lab", "the real tables (the Run buttons use exactly these)"));
    var chips = el("div", "chcheat"), view = el("div", "dview");
    var names = [];
    try {
      var d0 = cheatDb();
      var r0 = d0.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
      names = r0.length ? r0[0].values.map(function (v) { return v[0]; }) : [];
      d0.close();
    } catch (e) {}
    var order = ["employees", "departments", "projects", "assignments", "logins", "customers", "products", "orders", "order_items", "sales", "yearly", "person", "seat", "station", "stock", "accounts"];
    names.sort(function (a, b) { var i = order.indexOf(a), j = order.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
    function show(n, btn) {
      [].forEach.call(chips.children, function (c) { c.classList.remove("on"); });
      btn.classList.add("on");
      view.textContent = "";
      var d = cheatDb();
      try {
        var info = d.exec("PRAGMA table_info(" + n + ")")[0];
        view.appendChild(el("div", "cols", n + "(" + info.values.map(function (v) { return v[1] + " " + String(v[2]).toLowerCase() + (v[5] ? " pk" : ""); }).join(", ") + ")"));
        var r = d.exec("SELECT * FROM " + n)[0];
        view.appendChild(cheatTable(r.columns, r.values, 60));
      } catch (e) { view.appendChild(el("div", "cerr", String(e.message))); }
      d.close();
    }
    names.forEach(function (n, i) {
      var b = el("button", "chipj", n); b.type = "button";
      b.addEventListener("click", function () { show(n, b); });
      chips.appendChild(b);
      if (i === 0) setTimeout(function () { show(n, b); }, 0);
    });
    pane.appendChild(chips); pane.appendChild(view);
    pane.appendChild(el("div", "small", "Pick a table to see its rows. These are SQLite tables, so an example that needs a real MySQL server shows its syntax and has no Run button."));
    return pane;
  }

  function cheatScreen() {
    var f = document.createDocumentFragment();
    var hero = el("div", "hero");
    var back = el("button", "btn ghost", "← back to the roadmap"); back.type = "button";
    back.addEventListener("click", function () { V.screen = "study"; render(); window.scrollTo(0, 0); });
    hero.appendChild(back);
    var h1 = el("h1"); h1.innerHTML = "SQL syntax. <em>See it run.</em>"; h1.style.marginTop = "12px"; hero.appendChild(h1);
    hero.appendChild(el("p", null, "Left: the syntax and an example on the real tables, with a Run button. Right: the tables themselves, so you can check the result by eye. MySQL first, with the PostgreSQL / SQL Server spelling only where it differs."));
    var q = document.createElement("input"); q.type = "search"; q.className = "sfind";
    q.placeholder = "search: join, window, trigger, DATEDIFF, LIMIT, upsert, NULL…";
    hero.appendChild(q);
    var chips = el("div", "chcheat"); hero.appendChild(chips);
    f.appendChild(hero);

    var split = el("div", "split2"), left = el("div", "lcol"), right = el("div", "rcol");
    var blocks = [];
    MAT.cheat.forEach(function (sec) {
      var c = el("a", "chipj", sec.title); c.href = "#cs-" + sec.id;
      c.addEventListener("click", function (e) { e.preventDefault(); var t = document.getElementById("cs-" + sec.id); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); });
      chips.appendChild(c);
      var box = el("div", "tier stage cheatsec"); box.id = "cs-" + sec.id;
      var h = el("div", "tier-h"); h.appendChild(el("h3", null, sec.title)); h.appendChild(el("span", "c", sec.items.length + " items")); box.appendChild(h);
      var rows = [];
      sec.items.forEach(function (it) {
        var row = el("div", "citem");
        row.appendChild(el("div", "chead")).appendChild(el("span", "clab", it.l));
        if (it.s) { row.appendChild(el("div", "ctag", "syntax")); row.appendChild(el("pre", "ccode syn", it.s)); }
        row.appendChild(el("div", "ctag", it.s ? "example (MySQL)" : "syntax and example (MySQL)"));
        row.appendChild(el("pre", "ccode", it.c));
        var actions = el("div", "cacts"), out = el("div", "cout");
        var cp = el("button", "btn ghost cpy", "copy"); cp.type = "button";
        cp.addEventListener("click", function () { try { navigator.clipboard.writeText(it.c); cp.textContent = "copied"; setTimeout(function () { cp.textContent = "copy"; }, 1200); } catch (e) { cp.textContent = "select it"; } });
        actions.appendChild(cp);
        if (it.rc) {
          var rb = el("button", "btn primary cpy", "▶ run this"); rb.type = "button";
          rb.addEventListener("click", function () { cheatRun(out, it.c); });
          actions.appendChild(rb);
          row.appendChild(actions);
        } else if (it.t) {
          actions.appendChild(el("span", "cnote", "MySQL-only spelling, and the demo database is SQLite. Same idea, runnable:"));
          row.appendChild(actions);
          row.appendChild(el("pre", "ccode demo", it.t));
          var a2 = el("div", "cacts"), rb2 = el("button", "btn primary cpy", "▶ run the demo version"); rb2.type = "button";
          rb2.addEventListener("click", function () { cheatRun(out, it.t); });
          a2.appendChild(rb2); row.appendChild(a2);
        } else {
          actions.appendChild(el("span", "cnote", "syntax only: needs a real MySQL server, or there is nothing to show"));
          row.appendChild(actions);
        }
        row.appendChild(out);
        box.appendChild(row);
        rows.push({ node: row, hay: (it.l + " " + it.c + " " + it.s + " " + (it.t || "")).toLowerCase() });
      });
      left.appendChild(box);
      blocks.push({ box: box, rows: rows, title: sec.title.toLowerCase() });
    });
    var none = el("div", "small", "Nothing matches that. Try a shorter word."); none.style.display = "none"; none.style.padding = "16px"; left.appendChild(none);
    right.appendChild(cheatData());
    split.appendChild(left); split.appendChild(right); f.appendChild(split);

    q.addEventListener("input", function () {
      var s = q.value.trim().toLowerCase(), any = false;
      blocks.forEach(function (b) {
        var shown = 0;
        b.rows.forEach(function (r) { var ok = !s || r.hay.indexOf(s) >= 0 || b.title.indexOf(s) >= 0; r.node.style.display = ok ? "" : "none"; if (ok) shown++; });
        b.box.style.display = shown ? "" : "none";
        if (shown) any = true;
      });
      none.style.display = any ? "none" : "";
    });
    return f;
  }
  function open(id, preset) {
    V.screen = "ex"; V.cur = id; V.out = null; V.verdict = null; V.revealed = false;
    if (preset) state.drafts["scratch"] = preset;
    render();
    var ta = document.getElementById("editor");
    if (ta) ta.focus();
  }

  /* ---------- exercise / scratch ---------- */
  function resultTable(r, label, note) {
    var p = el("div", "rpanel");
    var h = el("div", "rpanel-h");
    h.appendChild(el("span", null, label));
    h.appendChild(el("span", "sp"));
    h.appendChild(el("span", null, r.values.length + (r.values.length === 1 ? " row" : " rows")));
    p.appendChild(h);
    if (!r.columns.length) { p.appendChild(el("div", "empty", note || "no rows returned")); return p; }
    var sc = el("div", "tscroll");
    var t = document.createElement("table");
    var thead = document.createElement("thead"), tr = document.createElement("tr");
    r.columns.forEach(function (c) { var th = document.createElement("th"); th.textContent = c; tr.appendChild(th); });
    thead.appendChild(tr); t.appendChild(thead);
    var tb = document.createElement("tbody");
    r.values.slice(0, 200).forEach(function (row) {
      var trr = document.createElement("tr");
      row.forEach(function (v) {
        var td = document.createElement("td");
        if (v === null || v === undefined) { td.textContent = "NULL"; td.className = "null"; }
        else td.textContent = String(v);
        trr.appendChild(td);
      });
      tb.appendChild(trr);
    });
    t.appendChild(tb); sc.appendChild(t); p.appendChild(sc);
    if (r.values.length > 200) p.appendChild(el("div", "empty", "showing first 200 rows"));
    return p;
  }

  function exScreen() {
    var f = document.createDocumentFragment();
    var scratch = V.cur === "scratch";
    var e = scratch ? null : EX.filter(function (x) { return x.id === V.cur; })[0];
    var key = scratch ? "scratch" : String(V.cur);

    var crumb = el("div", "crumb");
    if (scratch) crumb.appendChild(el("span", "now", "free query"));
    else {
      crumb.appendChild(el("span", "now", "#" + e.id));
      crumb.appendChild(el("span", null, "tier " + e.tier + " · " + TIERS[e.tier - 1].name));
    }
    crumb.appendChild(el("span", "sp"));
    if (!scratch) {
      var prev = EX.filter(function (x) { return x.id === V.cur - 1; })[0];
      var nxt = EX.filter(function (x) { return x.id === V.cur + 1; })[0];
      if (prev) { var pb = el("button", "btn ghost", "prev"); pb.type = "button"; pb.addEventListener("click", function () { open(prev.id); }); crumb.appendChild(pb); }
      if (nxt) { var nb = el("button", "btn ghost", "next"); nb.type = "button"; nb.addEventListener("click", function () { open(nxt.id); }); crumb.appendChild(nb); }
    }
    f.appendChild(crumb);

    var qb = el("div", "qbox");
    if (scratch) {
      qb.appendChild(el("h2", null, "Free query"));
      qb.appendChild(el("div", "task", "Explore the database. Nothing is graded here. Try SELECT * FROM employees; to see what you are working with."));
    } else {
      qb.appendChild(el("h2", null, "#" + e.id + " · " + e.title));
      qb.appendChild(el("div", "task", e.task));
      qb.appendChild(el("div", "want", "Expected: " + e.want));
      if (e.dialect) {
        var d = el("div", "dialect");
        d.appendChild(el("b", null, "dialect note"));
        d.appendChild(el("div", null, e.dialect));
        qb.appendChild(d);
      }
    }

    var ta = document.createElement("textarea");
    ta.id = "editor";
    ta.spellcheck = false;
    ta.placeholder = scratch ? "SELECT * FROM employees;" : "SELECT ...";
    ta.value = state.drafts[key] || "";
    ta.addEventListener("input", function () { state.drafts[key] = ta.value; });
    qb.appendChild(ta);

    var row = el("div", "runrow");
    var runB = el("button", "btn primary", "run");
    runB.type = "button"; runB.disabled = engine !== "ready";
    runB.addEventListener("click", doRun);
    row.appendChild(runB);
    if (!scratch) {
      var chk = el("button", "btn", "check answer");
      chk.type = "button"; chk.disabled = engine !== "ready";
      chk.addEventListener("click", doCheck);
      row.appendChild(chk);
    }
    row.appendChild(el("span", "kbd", "ctrl+enter to run"));
    row.appendChild(el("span", "sp"));
    if (!scratch) {
      var hb = el("button", "btn ghost", V.revealed ? "hide solution" : "reveal solution");
      hb.type = "button";
      hb.addEventListener("click", function () { V.revealed = !V.revealed; render(); });
      row.appendChild(hb);
    }
    qb.appendChild(row);

    if (V.verdict) {
      var v = el("div", "verdict " + V.verdict.kind);
      v.appendChild(el("b", null, V.verdict.head));
      var body = document.createElement("div");
      body.textContent = V.verdict.body;
      v.appendChild(body);
      qb.appendChild(v);
    }

    if (!scratch && V.revealed) {
      var sol = el("div", "rpanel");
      var sh = el("div", "rpanel-h");
      sh.appendChild(el("span", null, "reference solution"));
      sol.appendChild(sh);
      var pre = el("div", "empty");
      pre.style.whiteSpace = "pre-wrap";
      pre.style.fontSize = "13px";
      pre.style.color = "var(--ok)";
      pre.textContent = e.ref;
      sol.appendChild(pre);
      if (e.hint) {
        var hn = el("div", "empty");
        hn.style.whiteSpace = "pre-wrap";
        hn.style.borderTop = "1px solid var(--edge)";
        hn.textContent = e.hint;
        sol.appendChild(hn);
      }
      qb.appendChild(sol);
    }
    f.appendChild(qb);

    if (V.out) f.appendChild(resultTable(V.out, "your result"));
    return f;
  }

  function currentSql() {
    var key = V.cur === "scratch" ? "scratch" : String(V.cur);
    return (state.drafts[key] || "").trim();
  }

  function doRun() {
    var sql = currentSql();
    if (!sql) { V.verdict = { kind: "err", head: "nothing to run", body: "Type a query first." }; render(); return; }
    try {
      V.out = runSql(sql);
      V.verdict = null;
    } catch (err) {
      V.out = null;
      V.verdict = { kind: "err", head: "sql error", body: String(err.message || err) };
    }
    save(); render();
  }

  function doCheck() {
    var e = EX.filter(function (x) { return x.id === V.cur; })[0];
    var sql = currentSql();
    if (!sql) { V.verdict = { kind: "err", head: "nothing to check", body: "Type a query first." }; render(); return; }
    var got, want;
    try { got = runSql(sql); }
    catch (err) {
      V.out = null;
      V.verdict = { kind: "err", head: "sql error", body: String(err.message || err) };
      render(); return;
    }
    try { want = runSql(e.ref); }
    catch (err2) {
      V.verdict = { kind: "err", head: "reference failed", body: "The reference query itself errored — that is my bug, not yours: " + String(err2.message || err2) };
      render(); return;
    }
    V.out = got;
    var r = compare(got, want, e.ordered);
    if (r.ok) {
      var first = !state.solved[e.id];
      state.solved[e.id] = 1;
      V.verdict = {
        kind: "pass", head: "correct",
        body: first ? "Matches the expected result set. " + (e.hint || "") : "Still correct. " + (e.hint || "")
      };
    } else {
      V.verdict = {
        kind: "fail", head: "not matching — " + r.why,
        body: "Expected " + want.values.length + " row(s) with " + want.columns.length +
              " column(s); you returned " + got.values.length + " row(s) with " + got.columns.length + " column(s)." +
              (e.ordered ? " This one is order-sensitive, so ORDER BY matters." : " Row order does not matter here, only the values.")
      };
    }
    save(); render();
  }

  document.addEventListener("keydown", function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter" && V.screen === "ex") { doRun(); ev.preventDefault(); }
  });

  function render() {
    var ta = document.getElementById("editor");
    var caret = ta && document.activeElement === ta ? ta.selectionStart : null;
    var y = window.scrollY;
    app.textContent = "";
    app.className = "wrap" + (V.screen === "cheat" ? " wide" : "");
    app.appendChild(bar());
    app.appendChild(V.screen === "home" ? home() : V.screen === "study" ? studyHome() : V.screen === "topic" ? topicScreen() : V.screen === "quiz" ? quizScreen() : V.screen === "cheat" ? cheatScreen() : V.screen === "write" ? writeHome() : V.screen === "wtask" ? wTaskScreen() : exScreen());
    window.scrollTo(0, y);
    if (caret != null) {
      var t2 = document.getElementById("editor");
      if (t2) { t2.focus(); try { t2.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  render();
  boot();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) { if (a) api = a; }).catch(function () {});
  }
})();
</script>
