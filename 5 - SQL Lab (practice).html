"5NF is weaker than 3NF"],"a":2,"w":"The chain runs 1NF ⊃ 2NF ⊃ 3NF ⊃ BCNF ⊃ 4NF ⊃ 5NF."},{"q":"Which normal form guarantees no anomalies because all constraints follow from domains and keys?","o":["DKNF","5NF","BCNF","4NF"],"a":0,"w":"Domain-key normal form."}],"star":false,"kw":"4nf 5nf 6nf dknf mvd multivalued join dependency pjnf","mins":25},{"id":"transactions","group":"C. Transactions, storage and architecture","title":"Transactions, ACID, schedules and serializability","intro":"A transaction is a unit of work that must succeed entirely or not at all. This topic explains the ACID guarantees, the problems that appear when transactions interleave, and how to decide whether a schedule is correct.","blocks":[{"k":"h","t":"ACID"},{"k":"table","head":["Property","Meaning","Example","Enforced by"],"rows":[["Atomicity","All operations happen or none do","Transfer: debit and credit both commit or both roll back","Undo log / rollback"],["Consistency","A transaction moves the database from one valid state to another; constraints hold","Total money before = total after; no FK violated","Constraints, triggers, application logic"],["Isolation","Concurrent transactions behave as if run one after another","Two transfers do not see each other's half-done work","Locks, MVCC"],["Durability","Once committed, it survives crashes","Power cut after COMMIT does not lose the transfer","Write-ahead log, fsync"]]},{"k":"h","t":"Transaction states"},{"k":"code","lang":"txt","code":"Active -> Partially committed -> Committed -> (Terminated)\n   |              |\n   v              v\n Failed  ------> Aborted -> (rolled back, restart or kill) -> Terminated","cap":null,"run":false},{"k":"ul","t":["**Active:** executing. **Partially committed:** last statement run, not yet durable. **Committed:** changes are permanent. **Failed:** cannot continue. **Aborted:** rolled back."]},{"k":"h","t":"Problems when transactions interleave"},{"k":"table","head":["Anomaly","What happens"],"rows":[["Dirty read","T2 reads a value T1 changed but has not committed; T1 then rolls back"],["Non-repeatable read","T1 reads a row twice; T2 updated and committed it in between, so the values differ"],["Phantom read","T1 runs the same range query twice; T2 inserted or deleted a matching row in between"],["Lost update","T1 and T2 read the same value, both write; one write overwrites the other"],["Write skew","Two transactions read overlapping data, each writes something different based on it, and together they break a rule (two doctors both go off call)"]]},{"k":"h","t":"Schedules"},{"k":"ul","t":["**Serial schedule:** transactions run one after another. Always correct, no concurrency.","**Serializable schedule:** interleaved but equivalent to some serial order.","**Conflicting operations** belong to different transactions, touch the same item and at least one is a write: R-W, W-R, W-W."]},{"k":"h","t":"Conflict serializability and the precedence graph"},{"k":"ol","t":["Draw a node for each transaction.","Draw an edge Ti → Tj for each conflicting pair where Ti's operation comes first.","The schedule is conflict-serializable iff the graph has **no cycle**. A topological order gives an equivalent serial schedule."]},{"k":"code","lang":"txt","code":"S:  R1(A)  W1(A)  R2(A)  W2(A)  R1(B)  W1(B)\nConflicts on A: W1(A)->R2(A), W1(A)->W2(A), R1(A)->W2(A) all give T1 -> T2\nConflicts on B: only T1 touches B.\nGraph: T1 -> T2, no cycle => conflict-serializable, equivalent to T1 then T2.\n\nS2: R1(A) R2(A) W1(A) W2(A)\nR1(A)->W2(A) gives T1->T2;  R2(A)->W1(A) gives T2->T1  => cycle => NOT serializable (this is a lost update).","cap":null,"run":false},{"k":"p","t":"**View serializability** is a weaker test (same initial reads, same final writes, same read-from relations). Every conflict-serializable schedule is view-serializable; the reverse needs blind writes. Deciding view serializability is NP-complete."},{"k":"h","t":"Recoverability"},{"k":"table","head":["Class","Rule","Notes"],"rows":[["Recoverable","If T2 reads data written by T1, T1 must commit before T2 commits","Otherwise a rollback of T1 leaves T2 committed on bad data"],["Cascadeless (ACA)","T2 reads only data already committed by others","Avoids cascading rollbacks"],["Strict","No read OR write of an item until the last writer has committed or aborted","Easiest to recover; what strict 2PL produces"]]},{"k":"p","t":"Strict ⊂ Cascadeless ⊂ Recoverable. A schedule can be serializable yet not recoverable."},{"k":"h","t":"SQL isolation levels"},{"k":"table","head":["Level","Dirty read","Non-repeatable read","Phantom"],"rows":[["READ UNCOMMITTED","Possible","Possible","Possible"],["READ COMMITTED","Prevented","Possible","Possible"],["REPEATABLE READ","Prevented","Prevented","Possible (standard)"],["SERIALIZABLE","Prevented","Prevented","Prevented"]]},{"k":"pg","t":"PostgreSQL treats READ UNCOMMITTED as READ COMMITTED (it never allows dirty reads). Its REPEATABLE READ is snapshot isolation and also prevents phantoms. SERIALIZABLE uses SSI and may abort with 'could not serialize'; retry. Default: READ COMMITTED."},{"k":"my","t":"MySQL InnoDB default is REPEATABLE READ. InnoDB uses next-key locks to prevent most phantoms for locking reads. SERIALIZABLE turns plain SELECTs into shared-locking reads."},{"k":"ask","t":"\"Which isolation level is default in PostgreSQL / MySQL?\" PostgreSQL: READ COMMITTED. MySQL InnoDB: REPEATABLE READ."}],"test":[{"q":"Which property is implemented mainly by the write-ahead log and forced flush on commit?","o":["Consistency","Durability","Atomicity","Isolation"],"a":1,"w":"Durability: the commit record must be on stable storage. The log also supports atomicity via undo."},{"q":"T2 reads a row T1 changed but T1 later rolls back. This is a:","o":["Non-repeatable read","Lost update","Phantom read","Dirty read"],"a":3,"w":"Reading uncommitted data = dirty read."},{"q":"A schedule is conflict-serializable if its precedence graph:","o":["Has no cycle","Has exactly one edge","Is empty","Has a cycle"],"a":0,"w":"Acyclic precedence graph = conflict-serializable."},{"q":"S: R1(A) R2(A) W1(A) W2(A). Is it conflict-serializable?","o":["Cannot tell","Yes, T1 then T2","No, it has a cycle","Yes, T2 then T1"],"a":2,"w":"R1(A)->W2(A) gives T1->T2 and R2(A)->W1(A) gives T2->T1: a cycle."},{"q":"Which isolation level prevents dirty reads but allows non-repeatable reads?","o":["REPEATABLE READ","SERIALIZABLE","READ COMMITTED","READ UNCOMMITTED"],"a":2,"w":"READ COMMITTED: you only see committed data, but a second read may see a newer committed value."},{"q":"Default isolation level of MySQL InnoDB is:","o":["SERIALIZABLE","REPEATABLE READ","READ COMMITTED","READ UNCOMMITTED"],"a":1,"w":"PostgreSQL uses READ COMMITTED, InnoDB uses REPEATABLE READ."}],"star":true,"kw":"transaction acid isolation level dirty read phantom serializability precedence graph recoverable cascadeless strict","mins":30},{"id":"concurrency","group":"C. Transactions, storage and architecture","title":"Concurrency control: locking, deadlocks, timestamps, MVCC","intro":"How the DBMS makes interleaved transactions behave like serial ones.","blocks":[{"k":"h","t":"Lock modes and compatibility"},{"k":"table","head":["","Held: S (shared)","Held: X (exclusive)"],"rows":[["Request S","Granted","Wait"],["Request X","Wait","Wait"]]},{"k":"p","t":"Shared lock = read, many allowed. Exclusive lock = write, only one holder."},{"k":"h","t":"Two-phase locking (2PL)"},{"k":"ul","t":["**Growing phase:** a transaction may acquire locks but not release any.","**Shrinking phase:** it may release locks but not acquire any.","2PL guarantees conflict serializability (the lock point gives the serial order) but allows deadlocks and cascading rollbacks.","**Strict 2PL:** holds all EXCLUSIVE locks until commit/abort. Gives strict (and so cascadeless) schedules.","**Rigorous 2PL:** holds ALL locks until commit.","**Conservative 2PL:** acquires all locks before starting; deadlock-free but impractical (must know the read/write sets)."]},{"k":"h","t":"Deadlock"},{"k":"p","t":"T1 holds a lock on A and wants B; T2 holds B and wants A. Neither can proceed."},{"k":"ul","t":["**Detection:** build a wait-for graph; a cycle means deadlock. Pick a victim and abort it (PostgreSQL does this after deadlock_timeout; InnoDB detects immediately).","**Prevention with timestamps:** older transaction = smaller timestamp. **Wait-die:** if the requester is older it waits, if younger it dies (aborts). **Wound-wait:** if the requester is older it wounds (aborts) the holder, if younger it waits.","**Timeout:** abort anything waiting too long.","**Avoidance in code:** always lock rows in a consistent order (e.g. ascending id)."]},{"k":"trap","t":"In wait-die only younger transactions are killed and they restart with their ORIGINAL timestamp, so they eventually become old and cannot starve."},{"k":"h","t":"Multiple granularity locking"},{"k":"p","t":"Locks can sit on a database, table, page or row. **Intention locks** on the ancestors say what is happening below: IS (intend to take S below), IX (intend to take X below), SIX (S on the whole plus X on some parts). A table lock request checks compatibility with intention locks instead of scanning every row."},{"k":"h","t":"Timestamp ordering"},{"k":"ul","t":["Each transaction gets a timestamp TS(T) at start. Each item keeps the largest read timestamp RTS and write timestamp WTS.","Read(X) by T: if TS(T) < WTS(X) the value was written by a younger transaction, so T rolls back; otherwise allowed and RTS = max(RTS, TS(T)).","Write(X) by T: if TS(T) < RTS(X) or TS(T) < WTS(X), T rolls back. **Thomas write rule:** if only TS(T) < WTS(X) the obsolete write is just ignored.","No locks, so no deadlock, but possible starvation and cascading aborts."]},{"k":"h","t":"MVCC (multi-version concurrency control)"},{"k":"p","t":"Keep several versions of a row. Readers see the snapshot that was current when their transaction (or statement) began, so **readers never block writers and writers never block readers**. Writers still block other writers on the same row."},{"k":"pg","t":"PostgreSQL stores old versions as dead tuples inside the table itself; VACUUM cleans them. Each row has hidden xmin/xmax transaction ids."},{"k":"my","t":"InnoDB keeps old versions in the undo log (rollback segment) and purges them when no snapshot needs them."},{"k":"h","t":"Optimistic concurrency control"},{"k":"p","t":"Three phases: read (work on private copies), validate (check no conflicting commit happened), write. Good when conflicts are rare. In application code you implement it with a version column: UPDATE ... WHERE id = ? AND version = ?, then check rows affected."},{"k":"code","lang":"sql","code":"UPDATE employees SET salary = 99000, name = name\nWHERE id = 2 AND salary = 98000;   -- 0 rows affected means someone changed it first","cap":"optimistic update by comparing old value","run":true},{"k":"h","t":"Explicit locks in SQL"},{"k":"code","lang":"pg","code":"BEGIN;\nSELECT * FROM accounts WHERE id = 1 FOR UPDATE;         -- X lock the row\nSELECT * FROM jobs WHERE state = 'new' LIMIT 1 FOR UPDATE SKIP LOCKED;  -- queue worker pattern\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nCOMMIT;","cap":null,"run":false},{"k":"ask","t":"\"How do you prevent lost updates?\" SELECT ... FOR UPDATE, SERIALIZABLE isolation, atomic UPDATE balance = balance - 100, or optimistic version checks."}],"test":[{"q":"In strict 2PL a transaction releases its exclusive locks:","o":["Right after use","At commit or abort","Before acquiring any other lock","Never"],"a":1,"w":"Holding X locks until the end yields strict, cascadeless schedules."},{"q":"In the wait-die scheme, when an OLDER transaction requests a lock held by a younger one:","o":["Older waits","Both abort","Younger is wounded","Older dies"],"a":0,"w":"Wait-die: older waits, younger dies."},{"q":"A deadlock is detected by finding:","o":["A cycle in the wait-for graph","A cycle in the ER diagram","Two shared locks","A table with no PK"],"a":0,"w":"Cycle in the wait-for graph = deadlock."},{"q":"In MVCC, readers:","o":["Do not block and are not blocked by writers","Always see uncommitted data","Block writers","Are blocked by writers"],"a":0,"w":"Snapshots mean read and write don't block each other."},{"q":"Which lock modes are compatible?","o":["S and X","S and S","X and X","X and S on the same row"],"a":1,"w":"Only shared with shared."},{"q":"Under the Thomas write rule, a write with TS(T) < WTS(X) (and TS(T) >= RTS(X)) is:","o":["Ignored","Rolled back","Converted to a read","Applied"],"a":0,"w":"The write is obsolete, so it is skipped instead of aborting."}],"star":false,"kw":"locking 2pl deadlock wait-die wound-wait timestamp mvcc optimistic lock for update skip locked","mins":35},{"id":"recovery","group":"C. Transactions, storage and architecture","title":"Recovery: logs, WAL, checkpoints, ARIES","intro":"What the database does after a crash so committed work survives (durability) and uncommitted work disappears (atomicity).","blocks":[{"k":"h","t":"Failure types"},{"k":"ul","t":["**Transaction failure:** logical error or deadlock victim. Undo the one transaction.","**System crash:** memory lost, disk fine. Redo committed work, undo uncommitted work.","**Media failure:** disk lost. Restore from backup and replay the log (point-in-time recovery)."]},{"k":"h","t":"The log and write-ahead logging (WAL)"},{"k":"p","t":"The log is a sequential file of records like <T1, start>, <T1, A, old=500, new=400>, <T1, commit>. **WAL rule:** a log record describing a change must reach disk BEFORE the changed data page does, and all of a transaction's log records must be on disk before it commits."},{"k":"table","head":["Policy","Meaning","Needs"],"rows":[["STEAL","Dirty pages of uncommitted transactions may be written to disk","UNDO"],["NO-STEAL","Uncommitted pages stay in memory","No undo, but memory pressure"],["FORCE","All of a transaction's pages are written to disk at commit","No REDO, but slow commits"],["NO-FORCE","Pages may be written lazily after commit","REDO"]]},{"k":"p","t":"Real systems use **STEAL + NO-FORCE**, which is why they need both undo and redo logging."},{"k":"h","t":"Update strategies"},{"k":"ul","t":["**Deferred update:** changes written to the DB only after commit. Needs REDO only.","**Immediate update:** changes may be written before commit. Needs UNDO and REDO."]},{"k":"h","t":"Checkpoints"},{"k":"p","t":"Periodically flush dirty pages and write a checkpoint record that lists active transactions. After a crash, recovery starts from the last checkpoint instead of the start of the log."},{"k":"h","t":"Recovery steps (after a crash)"},{"k":"ol","t":["Find the last checkpoint.","**Redo list:** transactions with both <start> and <commit> after the checkpoint. Reapply their changes (REDO).","**Undo list:** transactions with <start> but no <commit>. Roll back their changes in reverse order (UNDO), writing compensation records."]},{"k":"h","t":"ARIES in three passes"},{"k":"ul","t":["**Analysis:** from the checkpoint, rebuild the dirty page table and the list of active transactions.","**Redo:** repeat history. Reapply every logged change (even of transactions that will be undone) from the earliest needed point, using page LSNs to skip changes already on disk.","**Undo:** roll back the losers, writing compensation log records (CLRs) so a crash during recovery is safe."]},{"k":"p","t":"Terms: **LSN** (log sequence number), **dirty page table**, **transaction table**, **pageLSN**, **CLR**."},{"k":"h","t":"Shadow paging"},{"k":"p","t":"Keep a page table; on update write a new copy of the page and switch the table pointer atomically at commit. No log needed, but fragmentation and costly copying. Rarely used now."},{"k":"h","t":"Backups"},{"k":"ul","t":["**Logical** (pg_dump, mysqldump): SQL or data export, portable, slower to restore.","**Physical** (file copy, pg_basebackup, xtrabackup) plus archived WAL / binary logs: allows **point-in-time recovery**."]},{"k":"ask","t":"\"What is WAL and why does it exist?\" Log first, data later. It turns random page writes into sequential log appends (fast commits) and makes crash recovery possible."}],"test":[{"q":"Write-ahead logging requires that:","o":["Data pages are written before log records","Commits skip the log","The log is kept only in memory","Log records reach disk before the corresponding data pages"],"a":3,"w":"WAL = log first."},{"q":"A system with STEAL and NO-FORCE needs:","o":["Only redo","Both undo and redo","Neither","Only undo"],"a":1,"w":"STEAL requires undo, NO-FORCE requires redo."},{"q":"After a crash, transactions with a start and commit record after the last checkpoint are:","o":["Restarted","Redone","Undone","Ignored"],"a":1,"w":"Committed work must survive, so it is redone."},{"q":"Which ARIES pass repeats history?","o":["Redo","Analysis","Checkpoint","Undo"],"a":0,"w":"Redo reapplies all logged changes; Undo then rolls back losers."},{"q":"Point-in-time recovery needs a base backup plus:","o":["Archived transaction logs (WAL / binlog)","The index files only","The query cache","A schema dump"],"a":0,"w":"Replay the log forward to the chosen moment."}],"star":false,"kw":"recovery wal log checkpoint aries undo redo steal force shadow paging backup","mins":30},{"id":"indexing-theory","group":"C. Transactions, storage and architecture","title":"File organisation and indexing (B+ tree, hashing)","intro":"An index is a separate structure that lets the database find rows without scanning the table. Know the kinds, the B+ tree, the cost arithmetic, and when an index helps or hurts.","blocks":[{"k":"h","t":"Storage basics"},{"k":"ul","t":["Data is stored in fixed-size **blocks / pages** (8 KB in PostgreSQL, 16 KB in InnoDB). I/O cost is counted in block reads.","**Blocking factor** bf = floor(block size / record size). Blocks needed = ceil(records / bf).","**Heap file:** unordered, fast insert, search is a full scan. **Sorted file:** binary search possible. **Hashed file:** direct location by hash."]},{"k":"code","lang":"txt","code":"30,000 records, record = 100 bytes, block = 1,000 bytes\nbf = 1000 / 100 = 10 records per block\nblocks = 30,000 / 10 = 3,000\nlinear scan = 3,000 block reads (worst), binary search on sorted file = ceil(log2 3000) = 12","cap":null,"run":false},{"k":"h","t":"Types of indexes"},{"k":"table","head":["Type","Definition"],"rows":[["Primary index","On the ordering key field of a sorted file; usually sparse"],["Clustering index","On a non-key ordering field of a sorted file"],["Secondary index","On a non-ordering field; must be dense; many per table"],["Dense","An index entry for every record"],["Sparse","An entry per block; file must be sorted on that key"],["Multilevel","An index on the index; B-trees are the balanced form"],["Unique","Also enforces uniqueness"],["Composite (multicolumn)","On several columns; usable by the leftmost-prefix rule"],["Covering","Contains every column the query needs, so the table is never visited (index-only scan)"]]},{"k":"h","t":"B-tree vs B+ tree"},{"k":"table","head":["","B-tree","B+ tree"],"rows":[["Data pointers","In every node","Only in leaf nodes"],["Internal nodes hold","Keys + data pointers","Keys only (more keys per node, higher fan-out, shorter tree)"],["Leaves linked","No","Yes, in a sequence: great for range scans"],["Search cost","Variable","Always root-to-leaf (same height)"]]},{"k":"ul","t":["A B+ tree of order p: internal node holds up to p-1 keys and p pointers; leaf holds up to p-1 key/pointer pairs; nodes are at least half full.","Height grows like log base fan-out of N. With fan-out of a few hundred, 3 or 4 levels hold hundreds of millions of rows.","Lookup, insert and delete are O(log N). Range queries find the first key then walk the leaf chain.","Order calculation: block 1024 B, key 10 B, pointer 6 B → p×6 + (p-1)×10 ≤ 1024 → p = 64 (internal node fits 64 pointers and 63 keys)."]},{"k":"h","t":"Hash indexes"},{"k":"ul","t":["Equality only, O(1) average, no ranges or ordering.","**Static hashing:** fixed number of buckets, overflow chains degrade performance.","**Extendible hashing:** a directory doubles when a bucket splits. **Linear hashing:** splits buckets in a round-robin order without a directory.","Bitmap indexes: one bit-vector per distinct value, good for low-cardinality columns in warehouses (Oracle, not default in PostgreSQL/MySQL)."]},{"k":"h","t":"Index design rules"},{"k":"ul","t":["Index columns used in WHERE, JOIN ON, ORDER BY and GROUP BY of frequent queries.","Foreign key columns are not indexed automatically in PostgreSQL (and InnoDB creates one if none exists); index them for joins and for fast parent deletes.","Composite index (a, b, c) serves filters on a; a,b; a,b,c; but not b alone or c alone.","Put equality columns first, then the range column.","**Selectivity:** an index on a column with few distinct values (gender) rarely helps. High-cardinality columns are best.","Indexes cost writes and space: every INSERT, UPDATE of an indexed column and DELETE must maintain them.","A function on the column defeats the index: WHERE UPPER(name) = 'ASHA' cannot use an index on name (use an expression index in PostgreSQL, or a generated column in MySQL).","A leading wildcard defeats it: LIKE '%son' scans; LIKE 'son%' can use the index."]},{"k":"pg","t":"Index types: **btree** (default), **hash**, **GIN** (arrays, jsonb, full-text), **GiST** (geometry, ranges, nearest neighbour), **SP-GiST**, **BRIN** (very large, naturally ordered tables like time-series). Partial and expression indexes are supported."},{"k":"my","t":"InnoDB tables ARE a B+ tree on the primary key (clustered index). Secondary indexes store the primary key value as the row pointer, so a long primary key bloats every secondary index. MyISAM has a heap with separate indexes. Also FULLTEXT and SPATIAL indexes."},{"k":"ask","t":"\"Clustered vs non-clustered index?\" Clustered: the table rows themselves are stored in key order (one per table, InnoDB primary key; PostgreSQL has CLUSTER as a one-time reorder only). Non-clustered: separate structure with pointers to the rows (many per table)."}],"test":[{"q":"3,200 records of 200 bytes each with 1,000-byte blocks occupy:","o":["640 blocks","800 blocks","160 blocks","3,200 blocks"],"a":0,"w":"bf = 1000 / 200 = 5 records per block, so 3200 / 5 = 640 blocks."},{"q":"Why do B+ trees beat B-trees for range queries?","o":["They store fewer keys","They use hashing","Leaf nodes are linked in sorted order","They have no leaves"],"a":2,"w":"Find the start, then follow leaf pointers."},{"q":"An index on (last_name, first_name) can help which query?","o":["WHERE last_name = 'Rao'","WHERE UPPER(last_name) = 'RAO'","WHERE first_name = 'Asha'","WHERE first_name LIKE '%a'"],"a":0,"w":"Leftmost-prefix rule; the other filters skip the first column or wrap it in a function."},{"q":"Which is true of a hash index?","o":["Supports ORDER BY","Fast for equality lookups","Is the default in PostgreSQL","Supports range queries"],"a":1,"w":"Hashing gives O(1) equality but no ordering."},{"q":"In InnoDB a secondary index entry stores:","o":["The row's physical address","Nothing","A copy of the whole row","The primary key value"],"a":3,"w":"Lookup through a secondary index then goes through the clustered primary key index."}],"star":false,"kw":"index btree b+ tree hash clustered covering composite selectivity blocking factor","mins":25},{"id":"query-processing","group":"C. Transactions, storage and architecture","title":"Query processing and optimization","intro":"How SQL text becomes an execution plan, and how to read it. This is what 'optimize this slow query' questions are about.","blocks":[{"k":"h","t":"The pipeline"},{"k":"code","lang":"txt","code":"SQL text -> parser (syntax, names) -> rewriter (views expanded)\n        -> optimizer (choose a plan using statistics) -> executor (run the plan)","cap":null,"run":false},{"k":"h","t":"Heuristic rules"},{"k":"ul","t":["Perform selections as early as possible (push σ down).","Perform projections early, but keep join columns.","Replace Cartesian product followed by selection with a join.","Join the smallest intermediate results first; choose join order with the fewest rows.","Use indexes for selective predicates."]},{"k":"h","t":"Join algorithms"},{"k":"table","head":["Algorithm","Idea","Best when"],"rows":[["Nested loop","For each outer row, scan the inner table","Tiny inputs, or inner table indexed (index nested loop)"],["Block nested loop","Read the outer in blocks, scan inner once per block","No index, small outer"],["Hash join","Build a hash table on the smaller input, probe with the other","Large unsorted inputs, equality joins"],["Sort-merge join","Sort both inputs on the join key, merge","Inputs already sorted, or non-equality range joins"]]},{"k":"code","lang":"txt","code":"Cost with nr, ns blocks for outer/inner and M buffer blocks:\n nested loop (block):  nr + ceil(nr / (M-2)) * ns\n hash join:            3 * (nr + ns)   when the build side fits after one partitioning\n sort-merge:           sort cost of each input + (nr + ns)","cap":null,"run":false},{"k":"h","t":"Reading a plan"},{"k":"code","lang":"pg","code":"EXPLAIN ANALYZE\nSELECT e.name FROM employees e JOIN departments d ON d.id = e.dept_id WHERE d.name = 'Data';\n-- look for: Seq Scan (full table), Index Scan, Hash Join / Nested Loop / Merge Join,\n-- estimated rows vs actual rows (big mismatch means stale statistics -> run ANALYZE)","cap":null,"run":false},{"k":"code","lang":"my","code":"EXPLAIN SELECT e.name FROM employees e JOIN departments d ON d.id = e.dept_id WHERE d.name = 'Data';\n-- columns to read: type (ALL = full scan, ref/eq_ref/const = index use), key, rows, Extra (Using filesort, Using temporary are warnings)\nEXPLAIN ANALYZE ...   -- MySQL 8.0.18+ shows real timings","cap":null,"run":false},{"k":"code","lang":"sql","code":"EXPLAIN QUERY PLAN SELECT * FROM employees WHERE dept_id = 2;","cap":"SQLite's own flavour, runs here","run":true},{"k":"h","t":"Writing SARGable queries"},{"k":"p","t":"A predicate is SARGable (search-argument-able) if the engine can use an index for it. Keep the column bare on one side."},{"k":"table","head":["Slow (cannot use an index on the column)","Fast rewrite"],"rows":[["WHERE YEAR(hire_date) = 2022","WHERE hire_date >= '2022-01-01' AND hire_date < '2023-01-01'"],["WHERE salary * 12 > 1200000","WHERE salary > 100000"],["WHERE name LIKE '%an'","full-text / trigram index, or reverse-string index"],["WHERE UPPER(city) = 'PUNE'","expression index on UPPER(city), or store normalised"],["WHERE a = 1 OR b = 2","UNION of two indexed queries, or a bitmap-or plan"],["WHERE col::text = '5' (cast on the column)","compare with the column's own type"]]},{"k":"h","t":"Common tuning moves"},{"k":"ul","t":["Select only the columns you need, not SELECT *.","Add an index for the filter + join columns; check with EXPLAIN that it is used.","Replace correlated subqueries with joins or window functions.","Use EXISTS instead of IN with huge lists, and keyset pagination (WHERE id > last_id LIMIT 50) instead of large OFFSET.","Batch inserts (multi-row INSERT, COPY / LOAD DATA).","Keep statistics fresh: ANALYZE in PostgreSQL, ANALYZE TABLE in MySQL.","Avoid functions on indexed columns; avoid implicit type conversions (comparing a varchar column to a number).","Partition very large tables and archive old data."]},{"k":"ask","t":"\"A query is slow, what do you do?\" Run EXPLAIN (ANALYZE). Look for full scans, wrong row estimates, sorts and temp tables. Add or fix an index, rewrite non-SARGable predicates, update statistics, cut columns and rows early."}],"test":[{"q":"Which rule belongs to heuristic optimization?","o":["Delay selections until after joins","Always select all columns","Push selections down before joins","Always use nested loop"],"a":2,"w":"Filtering early reduces the size of intermediate results."},{"q":"Which predicate can use a plain B-tree index on hire_date?","o":["WHERE hire_date + 1 > '2022-01-01'","WHERE YEAR(hire_date) = 2022","WHERE hire_date >= '2022-01-01' AND hire_date < '2023-01-01'","WHERE CAST(hire_date AS TEXT) LIKE '2022%'"],"a":2,"w":"The bare column is compared to constants."},{"q":"A hash join is typically chosen when:","o":["Inputs are tiny","The join is a < comparison","Inputs are large, unsorted, joined on equality","There is an index on both sides"],"a":2,"w":"Hash join excels for large equality joins."},{"q":"In EXPLAIN output, 'Seq Scan' (PostgreSQL) or type=ALL (MySQL) means:","o":["A constant lookup","A full table scan","A hash join","The index was used"],"a":1,"w":"No index was used for that access."},{"q":"Stale optimizer statistics are fixed by:","o":["ANALYZE","TRUNCATE","Restarting the app","VACUUM FULL only"],"a":0,"w":"ANALYZE (PostgreSQL) or ANALYZE TABLE (MySQL) refreshes the stats."}],"star":false,"kw":"query processing optimizer explain join algorithm hash nested loop merge sargable tuning","mins":25},{"id":"distributed-olap","group":"C. Transactions, storage and architecture","title":"OLTP vs OLAP, warehousing, NoSQL, CAP, replication, sharding","intro":"The wider picture beyond a single relational server. Short definitions are enough for most interviews, but you must be crisp.","blocks":[{"k":"h","t":"OLTP vs OLAP"},{"k":"table","head":["","OLTP","OLAP"],"rows":[["Purpose","Run the business (orders, payments)","Analyse the business (trends, reports)"],["Operations","Many short reads/writes of single rows","Few huge scans and aggregations"],["Design","Highly normalized (3NF)","Denormalized star / snowflake schema"],["Data","Current, detailed","Historical, summarised"],["Metric","Transactions per second","Query response time on big data"],["Examples","PostgreSQL, MySQL","Redshift, BigQuery, Snowflake, ClickHouse"]]},{"k":"h","t":"Data warehouse schemas"},{"k":"ul","t":["**Fact table:** measurable events (sales amount, quantity) with foreign keys to dimensions. Very large.","**Dimension tables:** descriptive context (customer, product, date, store). Small, wide, denormalized.","**Star schema:** one fact table surrounded by flat dimensions. **Snowflake:** dimensions normalized into sub-tables (less storage, more joins).","**ETL:** extract, transform, load. **ELT** loads first and transforms in the warehouse.","OLAP operations: **roll-up** (aggregate up a hierarchy), **drill-down**, **slice** (fix one dimension), **dice** (fix several), **pivot**. SQL: GROUP BY ROLLUP / CUBE / GROUPING SETS."]},{"k":"h","t":"NoSQL families"},{"k":"table","head":["Type","Model","Examples","Good for"],"rows":[["Key-value","key -> blob","Redis, DynamoDB","Caching, sessions"],["Document","JSON documents","MongoDB, Couchbase","Flexible schema, aggregates read as a unit"],["Wide-column","Row key + column families","Cassandra, HBase","Huge write volumes, time-series"],["Graph","Nodes and edges","Neo4j","Relationships, recommendations"]]},{"k":"h","t":"CAP, ACID and BASE"},{"k":"ul","t":["**CAP theorem:** in the presence of a network partition a distributed store can guarantee only one of Consistency and Availability. (Partition tolerance is not optional.)","CP systems refuse requests to stay consistent (HBase, MongoDB by default). AP systems keep answering and reconcile later (Cassandra, DynamoDB).","**BASE:** Basically Available, Soft state, Eventually consistent: the NoSQL counterpart to ACID.","**PACELC** extends CAP: else, trade latency against consistency."]},{"k":"h","t":"Scaling out"},{"k":"ul","t":["**Replication:** copies of the same data. Primary-replica (writes to primary, reads from replicas), synchronous (safe, slower) or asynchronous (fast, replica lag). Gives availability and read scale.","**Partitioning:** split one big table inside one server (range, list, hash). Helps pruning and maintenance.","**Sharding:** split data across servers by a shard key. Gives write scale. Cross-shard joins and transactions are hard; a bad shard key creates hot spots.","**Distributed transactions:** two-phase commit (2PC): prepare/vote, then commit/abort. Blocks if the coordinator dies. Sagas (compensating actions) are the usual alternative.","**Consistency models:** strong, eventual, read-your-writes, causal."]},{"k":"ask","t":"\"When would you choose NoSQL over a relational DB?\" Huge scale with simple access patterns, flexible or changing schema, very high write throughput, or data that is naturally a document or graph. Stay relational for multi-row transactions, complex joins and reporting."}],"test":[{"q":"A star schema consists of:","o":["A fact table with normalized sub-dimensions","A fact table surrounded by denormalized dimension tables","Only dimension tables","A single flat table"],"a":1,"w":"Snowflake normalizes dimensions; star keeps them flat."},{"q":"According to CAP, during a network partition a system must choose between:","o":["Atomicity and Durability","Speed and Cost","Consistency and Availability","Isolation and Consistency"],"a":2,"w":"Partition tolerance is required, so pick C or A."},{"q":"Splitting rows of one logical table across several servers by a key is:","o":["Indexing","Sharding","Replication","Normalization"],"a":1,"w":"Sharding = horizontal partitioning across machines."},{"q":"Which is an OLAP operation?","o":["Rollback","Row-level lock","Roll-up from city to country","INSERT a new order"],"a":2,"w":"Roll-up aggregates along a dimension hierarchy."},{"q":"In two-phase commit the coordinator first asks participants to:","o":["Rollback","Prepare and vote","Take a snapshot","Commit"],"a":1,"w":"Phase 1: prepare/vote. Phase 2: commit or abort."}],"star":false,"kw":"oltp olap warehouse star snowflake nosql cap base replication sharding partitioning 2pc","mins":20},{"id":"data-types","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Data types: standard, PostgreSQL and MySQL","intro":"Picking the right type is half of table design. Interviewers ask why you chose NUMERIC for money, TIMESTAMPTZ for time, or VARCHAR over CHAR.","blocks":[{"k":"table","head":["Need","PostgreSQL","MySQL","Notes"],"rows":[["Small / normal / big integer","SMALLINT, INTEGER, BIGINT","TINYINT, SMALLINT, MEDIUMINT, INT, BIGINT (UNSIGNED allowed)","PostgreSQL has no unsigned types; use CHECK (x >= 0)"],["Exact decimal","NUMERIC(p,s) / DECIMAL(p,s)","DECIMAL(p,s)","p = total digits, s = digits after the point. Use for money."],["Approximate decimal","REAL, DOUBLE PRECISION","FLOAT, DOUBLE","Rounding errors: never for money"],["Fixed text","CHAR(n)","CHAR(n)","Padded with spaces to n"],["Variable text","VARCHAR(n), TEXT","VARCHAR(n), TEXT family","In PostgreSQL TEXT and VARCHAR perform the same; MySQL VARCHAR is limited by row size"],["True/false","BOOLEAN","BOOLEAN (alias of TINYINT(1))","PostgreSQL has a real boolean type"],["Date only","DATE","DATE",""],["Time of day","TIME","TIME",""],["Date and time","TIMESTAMP, TIMESTAMPTZ","DATETIME, TIMESTAMP","PostgreSQL TIMESTAMPTZ stores UTC and converts to the session zone. MySQL TIMESTAMP is UTC-converted with a 1970-2038 range; DATETIME is not converted"],["Duration","INTERVAL","no equivalent (use TIME or integers)",""],["JSON","JSON, JSONB (binary, indexable)","JSON","Prefer JSONB in PostgreSQL"],["UUID","UUID","CHAR(36) or BINARY(16)","gen_random_uuid() in PostgreSQL 13+, UUID() in MySQL"],["Binary","BYTEA","BLOB, VARBINARY",""],["Enumeration","CREATE TYPE mood AS ENUM (...)","column ENUM('a','b')","Or use a lookup table / CHECK (more flexible)"],["Array","INTEGER[], TEXT[]","none","PostgreSQL only"],["Network / geometric","INET, CIDR, POINT, ranges (tstzrange)","SPATIAL types",""]]},{"k":"h","t":"Rules of thumb (the answers interviewers want)"},{"k":"ul","t":["**Money:** NUMERIC(12,2) (or integer paise/cents). Never FLOAT.","**Timestamps:** store in UTC; use TIMESTAMPTZ (PostgreSQL) so zones are handled correctly.","**Phone numbers and pin codes:** TEXT/VARCHAR, not integers (leading zeros, plus signs, no arithmetic).","**Age:** do not store it, store date of birth and compute age.","**CHAR vs VARCHAR:** CHAR for truly fixed-length codes (country code CHAR(2)); VARCHAR otherwise.","**Booleans** as BOOLEAN, not 'Y'/'N' strings.","**Primary keys:** BIGINT identity (or UUID if ids are created in many places).","**Enums vs lookup table:** a lookup table (with FK) is easier to extend than an ENUM."]},{"k":"dif","t":"PostgreSQL does strict type checking (you cannot compare text to integer without a cast). MySQL silently converts in many cases, which can hide bugs. PostgreSQL also rejects over-length strings; MySQL in non-strict mode truncates with a warning."},{"k":"code","lang":"sql","code":"SELECT CAST('42' AS INTEGER) + 1 AS n,\n       CAST(3.14159 AS REAL)  AS r,\n       typeof(1.0 * 2)        AS t;","cap":"casting (SQLite flavour: typeof is SQLite only)","run":true},{"k":"code","lang":"my","code":"SELECT CAST('42' AS SIGNED) + 1 AS n,\n       CAST(3.14159 AS DECIMAL(10,5)) AS r;      -- MySQL has no INTEGER/REAL cast targets and no typeof()","cap":"MySQL: cast to SIGNED / DECIMAL","run":false},{"k":"code","lang":"pg","code":"SELECT '42'::int + 1;          -- PostgreSQL shorthand cast\nSELECT CAST('2026-10-23' AS date);\nSELECT now()::date, now() AT TIME ZONE 'Asia/Kolkata';","cap":null,"run":false}],"test":[{"q":"Which type should store a price like 199.99?","o":["FLOAT","NUMERIC(10,2)","DOUBLE","TEXT"],"a":1,"w":"Exact decimal arithmetic; binary floating point cannot represent most decimal fractions exactly."},{"q":"Which PostgreSQL type stores a point in time with time-zone awareness?","o":["DATETIME","TIMESTAMPTZ","TIME","TIMESTAMP"],"a":1,"w":"TIMESTAMPTZ normalises to UTC and displays in the session zone. DATETIME is a MySQL type."},{"q":"A pin code or phone number is best stored as:","o":["BIGINT","INTEGER","NUMERIC","VARCHAR/TEXT"],"a":3,"w":"No arithmetic is done on it, and leading zeros and + signs must survive."},{"q":"PostgreSQL has which type that MySQL lacks?","o":["DATE","ARRAY","BOOLEAN native","VARCHAR"],"a":1,"w":"Array columns exist only in PostgreSQL (MySQL has BOOLEAN as an alias, VARCHAR and DATE too)."},{"q":"Better to store date_of_birth than age because:","o":["Age becomes stale; it can be derived","DATE is faster","Age is bigger","Age cannot be an integer"],"a":0,"w":"Derived data that changes with time should be computed, not stored."}],"star":true,"kw":"data types numeric varchar text timestamp timestamptz boolean json uuid enum money","mins":20},{"id":"create-table","group":"D. Designing tables (DDL, constraints, scenarios)","title":"CREATE TABLE: every clause and every constraint","intro":"The most common practical question: 'write the DDL for this scenario with proper constraints'. Know the full syntax and the checklist.","blocks":[{"k":"h","t":"Syntax"},{"k":"code","lang":"sql","code":"CREATE TABLE [IF NOT EXISTS] table_name (\n  column_name  data_type  [column_constraints...],\n  ...,\n  [CONSTRAINT name] table_constraint,\n  ...\n);","cap":"skeleton","run":false},{"k":"h","t":"The six constraints"},{"k":"table","head":["Constraint","Purpose","Column level","Table level"],"rows":[["PRIMARY KEY","Unique + NOT NULL row identifier (one per table)","id INTEGER PRIMARY KEY","PRIMARY KEY (a, b) for composite"],["FOREIGN KEY","Value must exist in a parent table","dept_id INT REFERENCES dept(id)","FOREIGN KEY (dept_id) REFERENCES dept(id)"],["UNIQUE","No duplicate values (NULLs allowed)","email TEXT UNIQUE","UNIQUE (a, b)"],["NOT NULL","Value required","name TEXT NOT NULL","column level only"],["CHECK","Boolean rule per row","age INT CHECK (age >= 18)","CHECK (end_date >= start_date)"],["DEFAULT","Value used when none supplied","status TEXT DEFAULT 'new'","column level only"]]},{"k":"note","t":"Use a **table-level** constraint when it involves more than one column (composite key, cross-column CHECK). Name important constraints with CONSTRAINT name so error messages and ALTERs are readable."},{"k":"h","t":"A full example"},{"k":"code","lang":"sql","code":"CREATE TABLE customer (\n  customer_id INTEGER PRIMARY KEY,\n  email       TEXT NOT NULL,\n  full_name   TEXT NOT NULL,\n  phone       TEXT,\n  created_on  TEXT NOT NULL DEFAULT CURRENT_DATE,\n  CONSTRAINT uq_customer_email UNIQUE (email),\n  CONSTRAINT ck_customer_email CHECK (email LIKE '%_@_%.__%')\n);\n\nCREATE TABLE purchase (\n  purchase_id  INTEGER PRIMARY KEY,\n  customer_id  INTEGER NOT NULL,\n  placed_on    TEXT NOT NULL DEFAULT CURRENT_DATE,\n  status       TEXT NOT NULL DEFAULT 'new',\n  total        NUMERIC NOT NULL CHECK (total >= 0),\n  CONSTRAINT fk_purchase_customer FOREIGN KEY (customer_id)\n      REFERENCES customer (customer_id) ON DELETE RESTRICT ON UPDATE CASCADE,\n  CONSTRAINT ck_purchase_status CHECK (status IN ('new','paid','shipped','cancelled'))\n);\n\nINSERT INTO customer (customer_id, email, full_name) VALUES (1,'a@x.com','Asha');\nINSERT INTO purchase (purchase_id, customer_id, total) VALUES (1, 1, 499.50);\nSELECT * FROM purchase;","cap":"portable version, runs here","run":true},{"k":"p","t":"The same tables in PostgreSQL production style:"},{"k":"code","lang":"pg","code":"CREATE TABLE customer (\n  customer_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  email       TEXT NOT NULL,\n  full_name   TEXT NOT NULL,\n  phone       TEXT,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),\n  CONSTRAINT uq_customer_email UNIQUE (email),\n  CONSTRAINT ck_customer_email CHECK (email ~* '^[^@]+@[^@]+\\.[^@]+$')\n);\n\nCREATE TABLE purchase (\n  purchase_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  customer_id BIGINT NOT NULL,\n  placed_at   TIMESTAMPTZ NOT NULL DEFAULT now(),\n  status      TEXT NOT NULL DEFAULT 'new',\n  total       NUMERIC(12,2) NOT NULL CHECK (total >= 0),\n  CONSTRAINT fk_purchase_customer FOREIGN KEY (customer_id)\n      REFERENCES customer (customer_id) ON DELETE RESTRICT ON UPDATE CASCADE,\n  CONSTRAINT ck_purchase_status CHECK (status IN ('new','paid','shipped','cancelled'))\n);\nCREATE INDEX idx_purchase_customer ON purchase (customer_id);   -- index the FK","cap":null,"run":false},{"k":"code","lang":"my","code":"CREATE TABLE customer (\n  customer_id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  email       VARCHAR(255) NOT NULL,\n  full_name   VARCHAR(100) NOT NULL,\n  phone       VARCHAR(20),\n  created_at  TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  UNIQUE KEY uq_customer_email (email)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE purchase (\n  purchase_id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  customer_id BIGINT UNSIGNED NOT NULL,\n  status      ENUM('new','paid','shipped','cancelled') NOT NULL DEFAULT 'new',\n  total       DECIMAL(12,2) NOT NULL,\n  CONSTRAINT ck_purchase_total CHECK (total >= 0),\n  CONSTRAINT fk_purchase_customer FOREIGN KEY (customer_id)\n      REFERENCES customer (customer_id) ON DELETE RESTRICT ON UPDATE CASCADE\n) ENGINE=InnoDB;","cap":null,"run":false},{"k":"my","t":"CHECK constraints are enforced from MySQL 8.0.16. Older versions parse and ignore them. Foreign keys only work on InnoDB, not MyISAM."},{"k":"h","t":"More column-level features"},{"k":"code","lang":"pg","code":"-- generated (computed) column\nprice NUMERIC(10,2), qty INT, line_total NUMERIC(12,2) GENERATED ALWAYS AS (price * qty) STORED\n\n-- copy structure of another table\nCREATE TABLE purchase_archive (LIKE purchase INCLUDING ALL);\n\n-- create from a query\nCREATE TABLE big_orders AS SELECT * FROM purchase WHERE total > 10000;\n\n-- session-only table\nCREATE TEMP TABLE scratch (id INT, note TEXT);","cap":null,"run":false},{"k":"code","lang":"my","code":"line_total DECIMAL(12,2) GENERATED ALWAYS AS (price * qty) STORED\nCREATE TABLE purchase_archive LIKE purchase;\nCREATE TEMPORARY TABLE scratch (id INT, note VARCHAR(50));","cap":null,"run":false},{"k":"h","t":"Scenario checklist (use this every time)"},{"k":"ol","t":["List the entities. Each gets a table with a PRIMARY KEY.","Pick types (NUMERIC for money, TIMESTAMPTZ, TEXT/VARCHAR with sensible lengths).","Mark required columns NOT NULL.","Natural unique things (email, ISBN, registration number) get UNIQUE.","Business rules go in CHECK (price > 0, end_date >= start_date, status IN (...)).","Relationships: FK on the many side, junction table for M:N, with ON DELETE chosen deliberately.","Composite PK or UNIQUE for 'one per pair' rules (a student enrolls in a course once).","Index the foreign keys and the columns you filter on."]},{"k":"ask","t":"\"Write the DDL for a library/bank/hospital system.\" Show the checklist aloud as you write: keys, types, NOT NULL, UNIQUE, CHECK, FKs with actions, junction tables, indexes."}],"test":[{"q":"Which constraint enforces a cross-column rule like end_date >= start_date?","o":["CHECK at table level","UNIQUE","DEFAULT","NOT NULL"],"a":0,"w":"A CHECK that references several columns is a table-level constraint."},{"q":"How many PRIMARY KEY constraints can a table have?","o":["One","Unlimited","One per column","Two"],"a":0,"w":"One primary key per table (it may be composite)."},{"q":"Which statement creates a composite primary key on enrollment?","o":["UNIQUE (student_id), UNIQUE (course_id)","CHECK (student_id, course_id)","PRIMARY KEY (student_id, course_id)","student_id INT PRIMARY KEY, course_id INT PRIMARY KEY"],"a":2,"w":"A composite key is declared at table level over both columns."},{"q":"In PostgreSQL the modern standard way to auto-generate ids is:","o":["COUNTER","AUTO_INCREMENT","GENERATED ALWAYS AS IDENTITY","ROWID"],"a":2,"w":"SERIAL still works but IDENTITY is the SQL-standard replacement. AUTO_INCREMENT is MySQL."},{"q":"Foreign key enforcement in MySQL requires which storage engine?","o":["MEMORY","MyISAM","InnoDB","CSV"],"a":2,"w":"Only InnoDB supports foreign keys and transactions."},{"q":"Where should you put UNIQUE (email)?","o":["On a natural identifier that must not repeat","Only on primary keys","On a derived column","On every column"],"a":0,"w":"Natural candidate keys (email, ISBN) get UNIQUE even when a surrogate PK exists."}],"star":true,"kw":"create table constraints primary key foreign key unique check not null default composite generated","mins":30},{"id":"fk-actions","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Foreign keys in depth: actions, composite, self-reference, deferrable","intro":"Foreign key behaviour is a favourite scenario question: 'what happens when a department is deleted?'","blocks":[{"k":"h","t":"Syntax"},{"k":"code","lang":"sql","code":"FOREIGN KEY (child_col) REFERENCES parent (parent_col)\n    [ON DELETE action] [ON UPDATE action]","cap":"skeleton","run":false},{"k":"table","head":["Action","On parent DELETE / UPDATE"],"rows":[["NO ACTION (default)","Rejects if children exist; checked at end of statement"],["RESTRICT","Rejects immediately"],["CASCADE","Delete (or update the key of) the children too"],["SET NULL","Child FK becomes NULL (column must be nullable)"],["SET DEFAULT","Child FK becomes its DEFAULT value (PostgreSQL; not usable in MySQL InnoDB)"]]},{"k":"h","t":"Choosing the action"},{"k":"ul","t":["**Owned child rows** (order lines of an order, dependents of an employee): ON DELETE CASCADE.","**Important history** (orders of a customer, payments): ON DELETE RESTRICT; use a soft delete (is_active) instead.","**Optional link** (employee.manager_id, product.category_id): ON DELETE SET NULL.","**Key changes** are rare with surrogate keys; ON UPDATE CASCADE is harmless."]},{"k":"code","lang":"sql","code":"PRAGMA foreign_keys = ON;\nCREATE TABLE team (team_id INTEGER PRIMARY KEY, name TEXT);\nCREATE TABLE player (\n  player_id INTEGER PRIMARY KEY, name TEXT,\n  team_id INTEGER REFERENCES team(team_id) ON DELETE SET NULL\n);\nCREATE TABLE kit (\n  kit_id INTEGER PRIMARY KEY,\n  player_id INTEGER REFERENCES player(player_id) ON DELETE CASCADE\n);\nINSERT INTO team VALUES (1,'Blue');\nINSERT INTO player VALUES (1,'Asha',1),(2,'Rohan',1);\nINSERT INTO kit VALUES (1,1),(2,2);\nDELETE FROM team WHERE team_id = 1;        -- players survive with NULL team\nDELETE FROM player WHERE player_id = 1;    -- kit 1 disappears with it\nSELECT p.name, p.team_id, (SELECT COUNT(*) FROM kit) AS kits_left FROM player p;","cap":"SET NULL and CASCADE in action","run":true},{"k":"code","lang":"my","code":"CREATE TABLE team (team_id INT PRIMARY KEY, name VARCHAR(50));\nCREATE TABLE player (\n  player_id INT PRIMARY KEY, name VARCHAR(50), team_id INT,\n  FOREIGN KEY (team_id) REFERENCES team(team_id) ON DELETE SET NULL\n);\nCREATE TABLE kit (\n  kit_id INT PRIMARY KEY, player_id INT,\n  FOREIGN KEY (player_id) REFERENCES player(player_id) ON DELETE CASCADE\n);\nINSERT INTO team VALUES (1,'Blue');\nINSERT INTO player VALUES (1,'Asha',1),(2,'Rohan',1);\nINSERT INTO kit VALUES (1,1),(2,2);\nDELETE FROM team WHERE team_id = 1;\nDELETE FROM player WHERE player_id = 1;\nSELECT p.name, p.team_id, (SELECT COUNT(*) FROM kit) AS kits_left FROM player p;      -- no PRAGMA: InnoDB enforces foreign keys by default","cap":"MySQL: no PRAGMA needed","run":false},{"k":"trap","t":"Without ON DELETE CASCADE, deleting a parent that has children fails with a foreign key violation. In SQLite foreign keys are OFF unless you run PRAGMA foreign_keys = ON."},{"k":"h","t":"Self-referencing foreign key"},{"k":"code","lang":"sql","code":"CREATE TABLE staff (\n  staff_id   INTEGER PRIMARY KEY,\n  name       TEXT NOT NULL,\n  manager_id INTEGER REFERENCES staff(staff_id)   -- NULL for the top boss\n);\nINSERT INTO staff VALUES (1,'CEO',NULL),(2,'Lead',1),(3,'Dev',2);\nSELECT s.name AS employee, m.name AS manager FROM staff s LEFT JOIN staff m ON m.staff_id = s.manager_id;","cap":null,"run":true},{"k":"h","t":"Composite foreign key"},{"k":"code","lang":"sql","code":"CREATE TABLE section (\n  course_id INTEGER, term TEXT, room TEXT,\n  PRIMARY KEY (course_id, term)\n);\nCREATE TABLE class_session (\n  session_id INTEGER PRIMARY KEY,\n  course_id INTEGER NOT NULL, term TEXT NOT NULL,\n  FOREIGN KEY (course_id, term) REFERENCES section (course_id, term)\n);","cap":"both columns must match one parent row","run":true},{"k":"h","t":"Referencing a non-primary column"},{"k":"p","t":"An FK can reference any UNIQUE (or primary key) column set, e.g. REFERENCES customer(email). PostgreSQL requires a unique constraint on the referenced columns. Use primary keys unless you have a reason."},{"k":"h","t":"Deferrable constraints (PostgreSQL)"},{"k":"code","lang":"pg","code":"-- two tables referencing each other (circular) or swapping keys inside one transaction\nALTER TABLE employee ADD CONSTRAINT fk_emp_dept\n  FOREIGN KEY (dept_id) REFERENCES department (dept_id)\n  DEFERRABLE INITIALLY DEFERRED;       -- checked at COMMIT, not per statement\n\nBEGIN;\nINSERT INTO employee (emp_id, dept_id) VALUES (1, 10);   -- department 10 does not exist yet\nINSERT INTO department (dept_id, head) VALUES (10, 1);   -- now it does\nCOMMIT;                                                   -- constraint checked here","cap":null,"run":false},{"k":"my","t":"MySQL InnoDB checks foreign keys row by row immediately and has no DEFERRABLE. To bulk load out of order, temporarily SET FOREIGN_KEY_CHECKS = 0 and turn it back on afterwards."},{"k":"h","t":"Dropping and adding foreign keys later"},{"k":"code","lang":"pg","code":"ALTER TABLE purchase DROP CONSTRAINT fk_purchase_customer;\nALTER TABLE purchase ADD CONSTRAINT fk_purchase_customer FOREIGN KEY (customer_id) REFERENCES customer(customer_id);","cap":null,"run":false},{"k":"code","lang":"my","code":"ALTER TABLE purchase DROP FOREIGN KEY fk_purchase_customer;\nALTER TABLE purchase ADD CONSTRAINT fk_purchase_customer FOREIGN KEY (customer_id) REFERENCES customer(customer_id);","cap":null,"run":false},{"k":"ask","t":"\"What happens if you delete a department that has employees?\" Depends on ON DELETE: default NO ACTION rejects; CASCADE removes employees; SET NULL orphans them with NULL dept_id. Good design: RESTRICT or SET NULL, never casually CASCADE on business history."}],"test":[{"q":"With ON DELETE SET NULL, deleting a parent row:","o":["Sets the child's FK to NULL","Deletes children","Sets it to 0","Rejects the delete"],"a":0,"w":"Children survive with NULL, so the FK column must be nullable."},{"q":"Which action is the default if none is specified?","o":["SET DEFAULT","CASCADE","NO ACTION","SET NULL"],"a":2,"w":"NO ACTION (reject if children exist)."},{"q":"A foreign key must reference a column that is:","o":["A NOT NULL column only","Any column","A primary key or UNIQUE column(s)","A column with an index only"],"a":2,"w":"The parent side must be unique so every child matches exactly one row."},{"q":"Which lets you insert a child before its parent inside one transaction in PostgreSQL?","o":["CHECK","TRUNCATE","ON DELETE CASCADE","DEFERRABLE INITIALLY DEFERRED"],"a":3,"w":"Deferred constraints are checked at COMMIT."},{"q":"An employee table with manager_id referencing employee_id is:","o":["A composite key","Invalid","A self-referencing foreign key","A many-to-many relationship"],"a":2,"w":"A recursive relationship implemented as a FK pointing to the same table."}],"star":true,"kw":"foreign key on delete cascade set null restrict deferrable self reference composite","mins":30},{"id":"alter-drop","group":"D. Designing tables (DDL, constraints, scenarios)","title":"ALTER, DROP, TRUNCATE, RENAME and DELETE compared","intro":"Changing a live schema, and the classic question: DELETE vs TRUNCATE vs DROP.","blocks":[{"k":"h","t":"ALTER TABLE cheat sheet"},{"k":"table","head":["Task","PostgreSQL","MySQL"],"rows":[["Add column","ALTER TABLE t ADD COLUMN c INT;","ALTER TABLE t ADD COLUMN c INT [AFTER x];"],["Drop column","ALTER TABLE t DROP COLUMN c;","ALTER TABLE t DROP COLUMN c;"],["Change type","ALTER TABLE t ALTER COLUMN c TYPE BIGINT USING c::bigint;","ALTER TABLE t MODIFY c BIGINT;"],["Rename column","ALTER TABLE t RENAME COLUMN c TO d;","ALTER TABLE t RENAME COLUMN c TO d; (8.0+) or CHANGE c d INT"],["Rename table","ALTER TABLE t RENAME TO t2;","RENAME TABLE t TO t2;  or ALTER TABLE t RENAME t2"],["Set NOT NULL","ALTER TABLE t ALTER COLUMN c SET NOT NULL;","ALTER TABLE t MODIFY c INT NOT NULL;"],["Drop NOT NULL","ALTER TABLE t ALTER COLUMN c DROP NOT NULL;","ALTER TABLE t MODIFY c INT NULL;"],["Set default","ALTER TABLE t ALTER COLUMN c SET DEFAULT 5;","ALTER TABLE t ALTER COLUMN c SET DEFAULT 5;"],["Add primary key","ALTER TABLE t ADD PRIMARY KEY (id);","ALTER TABLE t ADD PRIMARY KEY (id);"],["Add unique","ALTER TABLE t ADD CONSTRAINT u UNIQUE (c);","ALTER TABLE t ADD CONSTRAINT u UNIQUE (c);"],["Add check","ALTER TABLE t ADD CONSTRAINT ck CHECK (c > 0);","ALTER TABLE t ADD CONSTRAINT ck CHECK (c > 0);"],["Add foreign key","ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (c) REFERENCES p(id);","same"],["Drop constraint","ALTER TABLE t DROP CONSTRAINT name;","DROP PRIMARY KEY / DROP FOREIGN KEY name / DROP INDEX name / DROP CHECK name"]]},{"k":"code","lang":"sql","code":"CREATE TABLE gadget (id INTEGER PRIMARY KEY, name TEXT);\nALTER TABLE gadget ADD COLUMN price NUMERIC DEFAULT 0;\nALTER TABLE gadget RENAME COLUMN name TO title;\nINSERT INTO gadget (id, title) VALUES (1, 'lamp');\nSELECT * FROM gadget;","cap":"SQLite supports ADD / RENAME COLUMN","run":true},{"k":"h","t":"DELETE vs TRUNCATE vs DROP"},{"k":"table","head":["","DELETE","TRUNCATE","DROP"],"rows":[["Kind","DML","DDL","DDL"],["What it removes","Chosen rows (WHERE) or all rows","All rows, keeps the table","The whole table: rows, structure, indexes, constraints"],["WHERE clause","Yes","No","No"],["Speed on big tables","Slow (row by row, logs each row)","Fast (deallocates pages)","Fast"],["Fires row triggers","Yes","No (PostgreSQL fires TRUNCATE triggers)","No"],["Rollback","Yes","MySQL: no. PostgreSQL: yes","MySQL: no. PostgreSQL: yes"],["Resets auto-increment","No","Yes (MySQL), PostgreSQL only with RESTART IDENTITY","Gone"],["Needs FK care","Child rows must be handled","Blocked if referenced by FK (PostgreSQL: use CASCADE)","Blocked if referenced (CASCADE in PostgreSQL)"]]},{"k":"code","lang":"pg","code":"TRUNCATE TABLE orders, order_items RESTART IDENTITY CASCADE;\nDROP TABLE IF EXISTS scratch CASCADE;","cap":null,"run":false},{"k":"code","lang":"my","code":"TRUNCATE TABLE orders;           -- fails if a FK references it (unless checks are off)\nDROP TABLE IF EXISTS scratch;","cap":null,"run":false},{"k":"h","t":"Other DDL objects"},{"k":"code","lang":"sql","code":"CREATE SCHEMA hr;              -- namespace (PostgreSQL schema; in MySQL a schema = a database)\nCREATE DATABASE shop;           -- PostgreSQL / MySQL\nDROP DATABASE shop;\nCOMMENT ON TABLE customer IS 'people who buy';   -- PostgreSQL; MySQL: COMMENT 'text' in the column definition","cap":"not runnable here","run":false},{"k":"trap","t":"Adding a NOT NULL column with no default to a table that already has rows fails. Add it nullable, backfill, then SET NOT NULL, or supply a DEFAULT."},{"k":"ask","t":"\"Difference between DELETE, TRUNCATE and DROP?\" Delete = remove some or all rows (DML, loggable, WHERE, triggers). Truncate = remove all rows quickly keeping structure (DDL). Drop = remove the table itself."}],"test":[{"q":"Which removes all rows fastest while keeping the table definition?","o":["UPDATE t SET ...","TRUNCATE TABLE t","DELETE FROM t","DROP TABLE t"],"a":1,"w":"TRUNCATE deallocates data pages instead of deleting row by row."},{"q":"Which supports a WHERE clause?","o":["DELETE","DROP","TRUNCATE","ALTER"],"a":0,"w":"Only DELETE (and UPDATE/SELECT) take a WHERE filter."},{"q":"In PostgreSQL, to change a column's type you write:","o":["UPDATE COLUMN c BIGINT","ALTER TABLE t ALTER COLUMN c TYPE BIGINT","ALTER TABLE t MODIFY c BIGINT","CHANGE COLUMN c BIGINT"],"a":1,"w":"MODIFY is the MySQL spelling."},{"q":"Adding a NOT NULL column without a default to a table with data:","o":["Fails","Fills 0","Deletes rows","Works, fills NULL"],"a":0,"w":"Existing rows would violate NOT NULL, so supply a default or backfill first."},{"q":"Which is DML?","o":["TRUNCATE","DROP","DELETE","ALTER"],"a":2,"w":"DELETE is a data manipulation statement."}],"star":true,"kw":"alter drop truncate delete rename add column modify cascade","mins":20},{"id":"identity-seq","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Auto-generated keys: SERIAL, IDENTITY, sequences, AUTO_INCREMENT, UUID","intro":"How surrogate keys are generated in each system, why gaps appear, and the surrogate vs natural key debate.","blocks":[{"k":"table","head":["System","Syntax","Notes"],"rows":[["PostgreSQL (modern)","id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY","Standard SQL. ALWAYS rejects manual values unless OVERRIDING SYSTEM VALUE; BY DEFAULT allows them"],["PostgreSQL (legacy)","id SERIAL / BIGSERIAL PRIMARY KEY","Creates a sequence and sets a default nextval(...). Still very common"],["PostgreSQL sequence","CREATE SEQUENCE s START 1; nextval('s'); currval('s'); setval('s', 100);","Independent object, can be shared"],["MySQL","id BIGINT AUTO_INCREMENT PRIMARY KEY","One per table; must be indexed (usually the PK). LAST_INSERT_ID() returns the last value generated in this session"],["SQLite","id INTEGER PRIMARY KEY (AUTOINCREMENT optional)","INTEGER PRIMARY KEY is an alias for rowid"],["UUID","id UUID DEFAULT gen_random_uuid()","MySQL: BINARY(16) with UUID_TO_BIN(UUID())"]]},{"k":"code","lang":"pg","code":"CREATE TABLE ticket (\n  ticket_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  subject   TEXT NOT NULL\n);\nINSERT INTO ticket (subject) VALUES ('printer down') RETURNING ticket_id;   -- get the generated id back\nSELECT currval(pg_get_serial_sequence('ticket', 'ticket_id'));\nALTER TABLE ticket ALTER COLUMN ticket_id RESTART WITH 1000;","cap":null,"run":false},{"k":"code","lang":"my","code":"CREATE TABLE ticket (\n  ticket_id BIGINT AUTO_INCREMENT PRIMARY KEY,\n  subject VARCHAR(200) NOT NULL\n);\nINSERT INTO ticket (subject) VALUES ('printer down');\nSELECT LAST_INSERT_ID();\nALTER TABLE ticket AUTO_INCREMENT = 1000;","cap":null,"run":false},{"k":"code","lang":"sql","code":"CREATE TABLE note (id INTEGER PRIMARY KEY AUTOINCREMENT, body TEXT);\nINSERT INTO note (body) VALUES ('first'), ('second');\nSELECT last_insert_rowid() AS last_id;","cap":"SQLite","run":true},{"k":"code","lang":"my","code":"CREATE TABLE note (id INT AUTO_INCREMENT PRIMARY KEY, body VARCHAR(100));\nINSERT INTO note (body) VALUES ('first'), ('second');\nSELECT LAST_INSERT_ID() AS last_id;","cap":"MySQL: AUTO_INCREMENT and LAST_INSERT_ID()","run":false},{"k":"h","t":"Why do gaps appear?"},{"k":"p","t":"The counter is not transactional on purpose (otherwise inserts would serialize). A rolled-back insert, a failed insert, or a crash still consumed a number. Gaps are normal; never use an id as a gapless counter (invoice numbers need a separate controlled process)."},{"k":"h","t":"Surrogate vs natural key"},{"k":"table","head":["","Surrogate (id)","Natural (email, ISBN)"],"rows":[["Stability","Never changes","May change (email) and then cascade everywhere"],["Size","Small (4-8 bytes) so indexes and FKs are compact","Can be long text"],["Meaning","None","Real-world meaning, no extra lookup"],["Rule of thumb","Use as PK + keep the natural key as UNIQUE","Fine for stable codes (country code)"]]},{"k":"h","t":"UUID vs sequential ids"},{"k":"ul","t":["UUIDs can be generated anywhere without coordination and do not leak counts.","Random UUIDs (v4) fragment B-tree indexes and need 16 bytes; time-ordered versions (UUIDv7, ULID) fix locality.","In InnoDB the PK is the clustered index, so a random UUID PK hurts inserts badly."]},{"k":"ask","t":"\"Why are there gaps in an auto-increment column?\" Rollbacks and failed inserts consume values and the counter is intentionally non-transactional."}],"test":[{"q":"MySQL function that returns the last auto-generated id of the session:","o":["SCOPE_IDENTITY()","CURRVAL()","LAST_INSERT_ID()","LAST_ID()"],"a":2,"w":"LAST_INSERT_ID() is per connection."},{"q":"Which clause returns the new id from an INSERT in PostgreSQL?","o":["RETURNING","SELECT LAST","GET ID","OUTPUT"],"a":0,"w":"INSERT ... RETURNING id."},{"q":"Gaps in a sequence appear because:","o":["Bugs","Deletes renumber","Rollbacks still consume values","Indexes fragment"],"a":2,"w":"Sequences are non-transactional by design."},{"q":"Best practice for a table with a natural unique identifier such as email:","o":["Two primary keys","Surrogate PK plus UNIQUE on email","No key","Use email as PK only"],"a":1,"w":"Stable small surrogate PK; the natural key still gets its UNIQUE constraint."},{"q":"In InnoDB a random UUID primary key mainly causes:","o":["Index fragmentation and slower inserts","Smaller indexes","Faster joins","Gapless ids"],"a":0,"w":"The PK is the clustered index, so random inserts split pages all over the tree."}],"star":false,"kw":"auto increment serial identity sequence uuid surrogate natural key nextval last_insert_id","mins":25},{"id":"scenario-ddl-1","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Scenario to tables: library and online shop","intro":"Interviewers describe a system in two sentences and say 'create the tables'. Here are full answers in PostgreSQL style. Read the requirement, try it yourself first, then compare.","blocks":[{"k":"h","t":"Scenario 1: Library management"},{"k":"code","lang":"txt","code":"Requirements:\n- Members borrow books. A book title can have several authors and an author can write several books.\n- The library owns several physical copies of a title. A loan is for one copy, has a loan date, due date and optional return date.\n- A member can have at most 5 open loans (enforce in a trigger/app). A copy cannot be on loan twice at the same time.\n- Fines are charged per overdue loan.","cap":"try first","run":false},{"k":"p","t":"Reasoning: entities = member, author, book (title), copy, loan, fine. author-book is M:N (junction). book-copy is 1:N. loan links member and copy (1:N each). fine belongs to a loan (1:1 optional)."},{"k":"code","lang":"pg","code":"CREATE TABLE member (\n  member_id   BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  full_name   TEXT NOT NULL,\n  email       TEXT NOT NULL UNIQUE,\n  joined_on   DATE NOT NULL DEFAULT CURRENT_DATE,\n  is_active   BOOLEAN NOT NULL DEFAULT TRUE\n);\n\nCREATE TABLE author (\n  author_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name      TEXT NOT NULL\n);\n\nCREATE TABLE book (\n  book_id   BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  isbn      CHAR(13) NOT NULL UNIQUE,\n  title     TEXT NOT NULL,\n  publisher TEXT,\n  published_year SMALLINT CHECK (published_year BETWEEN 1450 AND 2100)\n);\n\nCREATE TABLE book_author (                       -- M:N junction\n  book_id   BIGINT REFERENCES book(book_id)     ON DELETE CASCADE,\n  author_id BIGINT REFERENCES author(author_id) ON DELETE RESTRICT,\n  PRIMARY KEY (book_id, author_id)\n);\n\nCREATE TABLE book_copy (\n  copy_id   BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  book_id   BIGINT NOT NULL REFERENCES book(book_id) ON DELETE RESTRICT,\n  shelf     TEXT,\n  status    TEXT NOT NULL DEFAULT 'available' CHECK (status IN ('available','on_loan','lost'))\n);\n\nCREATE TABLE loan (\n  loan_id     BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  member_id   BIGINT NOT NULL REFERENCES member(member_id) ON DELETE RESTRICT,\n  copy_id     BIGINT NOT NULL REFERENCES book_copy(copy_id) ON DELETE RESTRICT,\n  loaned_on   DATE NOT NULL DEFAULT CURRENT_DATE,\n  due_on      DATE NOT NULL,\n  returned_on DATE,\n  CONSTRAINT ck_loan_dates CHECK (due_on >= loaned_on AND (returned_on IS NULL OR returned_on >= loaned_on))\n);\n-- a copy cannot be on loan twice: only one open loan per copy\nCREATE UNIQUE INDEX uq_open_loan_per_copy ON loan (copy_id) WHERE returned_on IS NULL;\n\nCREATE TABLE fine (\n  loan_id   BIGINT PRIMARY KEY REFERENCES loan(loan_id) ON DELETE CASCADE,   -- 1:1, shares the key\n  amount    NUMERIC(8,2) NOT NULL CHECK (amount > 0),\n  paid      BOOLEAN NOT NULL DEFAULT FALSE\n);\n\nCREATE INDEX idx_loan_member ON loan (member_id);","cap":null,"run":false},{"k":"note","t":"The partial unique index is the PostgreSQL way to say 'at most one open loan per copy'. In MySQL (no partial indexes) use a trigger or a generated column trick. Mention both."},{"k":"h","t":"Scenario 2: Online shop"},{"k":"code","lang":"txt","code":"Requirements:\n- Customers have several saved addresses. Products belong to one category (categories form a tree).\n- An order is placed by a customer, ships to one address and contains many products with quantity.\n- The price paid must be kept on the order line even if the product price changes later.\n- Payments: an order can be paid in several instalments. Stock must never go negative.","cap":"try first","run":false},{"k":"code","lang":"pg","code":"CREATE TABLE customer (\n  customer_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  email       TEXT NOT NULL UNIQUE,\n  full_name   TEXT NOT NULL,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n\nCREATE TABLE address (\n  address_id  BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  customer_id BIGINT NOT NULL REFERENCES customer(customer_id) ON DELETE CASCADE,\n  line1 TEXT NOT NULL, city TEXT NOT NULL, pincode CHAR(6) NOT NULL,\n  is_default BOOLEAN NOT NULL DEFAULT FALSE\n);\n\nCREATE TABLE category (\n  category_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name        TEXT NOT NULL,\n  parent_id   BIGINT REFERENCES category(category_id) ON DELETE SET NULL     -- tree\n);\n\nCREATE TABLE product (\n  product_id  BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  sku         TEXT NOT NULL UNIQUE,\n  name        TEXT NOT NULL,\n  category_id BIGINT REFERENCES category(category_id),\n  price       NUMERIC(10,2) NOT NULL CHECK (price >= 0),\n  stock       INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0)\n);\n\nCREATE TABLE orders (                           -- \"order\" is a reserved word\n  order_id    BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  customer_id BIGINT NOT NULL REFERENCES customer(customer_id),\n  address_id  BIGINT NOT NULL REFERENCES address(address_id),\n  placed_at   TIMESTAMPTZ NOT NULL DEFAULT now(),\n  status      TEXT NOT NULL DEFAULT 'new' CHECK (status IN ('new','paid','shipped','delivered','cancelled'))\n);\n\nCREATE TABLE order_item (\n  order_id    BIGINT REFERENCES orders(order_id) ON DELETE CASCADE,\n  product_id  BIGINT REFERENCES product(product_id),\n  quantity    INTEGER NOT NULL CHECK (quantity > 0),\n  unit_price  NUMERIC(10,2) NOT NULL CHECK (unit_price >= 0),   -- snapshot of the price at purchase time\n  PRIMARY KEY (order_id, product_id)\n);\n\nCREATE TABLE payment (\n  payment_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  order_id   BIGINT NOT NULL REFERENCES orders(order_id),\n  amount     NUMERIC(10,2) NOT NULL CHECK (amount > 0),\n  method     TEXT NOT NULL CHECK (method IN ('card','upi','cod','netbanking')),\n  paid_at    TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n\nCREATE INDEX idx_orders_customer ON orders (customer_id);\nCREATE INDEX idx_order_item_product ON order_item (product_id);\nCREATE INDEX idx_product_category ON product (category_id);","cap":null,"run":false},{"k":"h","t":"Points to say out loud"},{"k":"ul","t":["order_item stores unit_price so history is stable (a deliberate, justified duplication).","stock >= 0 CHECK protects against overselling at the database level; concurrent decrements are made safe by UPDATE product SET stock = stock - 1 WHERE product_id = ? AND stock >= 1.","Customer deletion is blocked (orders reference it); use is_active or anonymize.","Address FK from orders gives a snapshot problem: if the address is edited, old orders change. Real systems copy the address into the order or make addresses immutable."]},{"k":"ask","t":"\"Why did you store unit_price in order_item?\" Because product prices change; the order must record what was actually charged. It is controlled duplication, not a normalization failure."}],"test":[{"q":"Why is book_author a separate table?","o":["It implements the many-to-many relation between books and authors","To enable triggers","Because ISBN is long","To save space"],"a":0,"w":"An M:N relationship needs a junction table with both FKs as a composite PK."},{"q":"How do you ensure a copy cannot have two open loans in PostgreSQL?","o":["Partial unique index on copy_id WHERE returned_on IS NULL","NOT NULL on copy_id","UNIQUE (copy_id) on all rows","A CHECK on dates"],"a":0,"w":"Only open loans (returned_on IS NULL) are constrained."},{"q":"order_item.unit_price duplicates product.price on purpose because:","o":["FKs require it","It speeds up INSERT","Normalization requires it","Prices change, the order needs the historical price"],"a":3,"w":"Snapshot of the price at the time of purchase."},{"q":"Why is the table named orders and not order?","o":["ORDER is a reserved SQL keyword","PostgreSQL forbids singular names","Because of FK rules","Convention only"],"a":0,"w":"ORDER (BY) is reserved; quote it or avoid it."},{"q":"Which keeps stock from going negative?","o":["DEFAULT 0","UNIQUE","NOT NULL","CHECK (stock >= 0)"],"a":3,"w":"A CHECK constraint rejects any update that would make it negative."}],"star":true,"kw":"scenario library shop ecommerce create tables design junction partial unique snapshot price","mins":20},{"id":"scenario-ddl-2","group":"D. Designing tables (DDL, constraints, scenarios)","title":"Scenario to tables: hospital, bank, college, hotel booking","intro":"More full designs. Notice the recurring tricks: junction tables, CHECK rules, overlap prevention, immutable ledgers, and where triggers are needed.","blocks":[{"k":"h","t":"Scenario 3: Hospital appointments"},{"k":"code","lang":"txt","code":"- Doctors belong to a department and have a specialty. Patients have a unique national id.\n- A patient books an appointment with a doctor at a time slot. A doctor cannot be double-booked.\n- Each appointment may result in prescriptions listing medicines with dosage and days.","cap":"try first","run":false},{"k":"code","lang":"pg","code":"CREATE TABLE department (\n  dept_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name    TEXT NOT NULL UNIQUE\n);\nCREATE TABLE doctor (\n  doctor_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  full_name TEXT NOT NULL,\n  specialty TEXT NOT NULL,\n  dept_id   BIGINT NOT NULL REFERENCES department(dept_id)\n);\nCREATE TABLE patient (\n  patient_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  national_id TEXT NOT NULL UNIQUE,\n  full_name  TEXT NOT NULL,\n  dob        DATE NOT NULL CHECK (dob <= CURRENT_DATE),\n  phone      TEXT\n);\nCREATE TABLE appointment (\n  appt_id    BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  patient_id BIGINT NOT NULL REFERENCES patient(patient_id),\n  doctor_id  BIGINT NOT NULL REFERENCES doctor(doctor_id),\n  slot_start TIMESTAMPTZ NOT NULL,\n  slot_end   TIMESTAMPTZ NOT NULL,\n  status     TEXT NOT NULL DEFAULT 'booked' CHECK (status IN ('booked','done','cancelled','no_show')),\n  CHECK (slot_end > slot_start),\n  UNIQUE (doctor_id, slot_start)                       -- simple double-booking guard\n);\nCREATE TABLE medicine (\n  medicine_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name TEXT NOT NULL UNIQUE\n);\nCREATE TABLE prescription (\n  appt_id     BIGINT REFERENCES appointment(appt_id) ON DELETE CASCADE,\n  medicine_id BIGINT REFERENCES medicine(medicine_id),\n  dosage      TEXT NOT NULL,\n  days        SMALLINT NOT NULL CHECK (days > 0),\n  PRIMARY KEY (appt_id, medicine_id)\n);","cap":null,"run":false},{"k":"code","lang":"pg","code":"-- stronger rule: no OVERLAPPING slots for the same doctor (needs btree_gist)\nCREATE EXTENSION IF NOT EXISTS btree_gist;\nALTER TABLE appointment ADD CONSTRAINT no_overlap\n  EXCLUDE USING gist (doctor_id WITH =, tstzrange(slot_start, slot_end) WITH &&)\n  WHERE (status = 'booked');","cap":null,"run":false},{"k":"h","t":"Scenario 4: Banking (ledger style)"},{"k":"code","lang":"txt","code":"- A customer can have several accounts (savings, current). An account has a balance that must never be negative for savings.\n- Every deposit, withdrawal or transfer is recorded and never edited or deleted.\n- A transfer moves money between two accounts atomically.","cap":"try first","run":false},{"k":"code","lang":"pg","code":"CREATE TABLE bank_customer (\n  customer_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  pan         CHAR(10) NOT NULL UNIQUE,\n  full_name   TEXT NOT NULL\n);\nCREATE TYPE account_kind AS ENUM ('savings', 'current');\nCREATE TABLE account (\n  account_no  BIGINT GENERATED ALWAYS AS IDENTITY (START WITH 100000) PRIMARY KEY,\n  customer_id BIGINT NOT NULL REFERENCES bank_customer(customer_id),\n  kind        account_kind NOT NULL,\n  balance     NUMERIC(14,2) NOT NULL DEFAULT 0,\n  opened_on   DATE NOT NULL DEFAULT CURRENT_DATE,\n  CONSTRAINT ck_savings_non_negative CHECK (kind <> 'savings' OR balance >= 0)\n);\nCREATE TABLE ledger_entry (                       -- append-only\n  entry_id    BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  account_no  BIGINT NOT NULL REFERENCES account(account_no),\n  amount      NUMERIC(14,2) NOT NULL CHECK (amount <> 0),   -- +credit / -debit\n  txn_id      UUID NOT NULL,                                -- groups the two legs of a transfer\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),\n  note        TEXT\n);\nCREATE INDEX idx_ledger_account ON ledger_entry (account_no, created_at);","cap":null,"run":false},{"k":"code","lang":"pg","code":"-- atomic transfer: either both legs happen or neither\nBEGIN;\nUPDATE account SET balance = balance - 500 WHERE account_no = 100001;   -- CHECK stops overdraft\nUPDATE account SET balance = balance + 500 WHERE account_no = 100002;\nINSERT INTO ledger_entry (account_no, amount, txn_id) VALUES (100001, -500, gen_random_uuid());\nCOMMIT;","cap":null,"run":false},{"k":"h","t":"Scenario 5: College"},{"k":"code","lang":"txt","code":"- Departments offer courses. Instructors teach course sections each term. Students enroll in sections.\n- A student cannot enroll twice in the same section. Grades are only allowed for enrolled students.\n- A course can have prerequisite courses (a course may need several).","cap":"try first","run":false},{"k":"code","lang":"pg","code":"CREATE TABLE course (\n  course_id  TEXT PRIMARY KEY,                    -- natural code like 'CS301'\n  title      TEXT NOT NULL,\n  credits    SMALLINT NOT NULL CHECK (credits BETWEEN 1 AND 6)\n);\nCREATE TABLE prerequisite (                       -- self M:N on course\n  course_id TEXT REFERENCES course(course_id) ON DELETE CASCADE,\n  requires  TEXT REFERENCES course(course_id),\n  PRIMARY KEY (course_id, requires),\n  CHECK (course_id <> requires)\n);\nCREATE TABLE instructor (\n  instructor_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name TEXT NOT NULL\n);\nCREATE TABLE section (\n  section_id    BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  course_id     TEXT NOT NULL REFERENCES course(course_id),\n  term          TEXT NOT NULL,                    -- '2026-ODD'\n  instructor_id BIGINT NOT NULL REFERENCES instructor(instructor_id),\n  capacity      SMALLINT NOT NULL CHECK (capacity > 0),\n  UNIQUE (course_id, term, instructor_id)\n);\nCREATE TABLE student (\n  usn  TEXT PRIMARY KEY,\n  name TEXT NOT NULL\n);\nCREATE TABLE enrollment (\n  usn        TEXT REFERENCES student(usn) ON DELETE CASCADE,\n  section_id BIGINT REFERENCES section(section_id),\n  grade      CHAR(2) CHECK (grade IN ('O','A+','A','B+','B','C','F')),\n  PRIMARY KEY (usn, section_id)                   -- one enrollment per student per section\n);","cap":null,"run":false},{"k":"h","t":"Scenario 6: Hotel booking (no double booking)"},{"k":"code","lang":"pg","code":"CREATE TABLE room (\n  room_no INT PRIMARY KEY,\n  kind    TEXT NOT NULL CHECK (kind IN ('single','double','suite')),\n  rate    NUMERIC(8,2) NOT NULL CHECK (rate > 0)\n);\nCREATE TABLE guest (\n  guest_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name TEXT NOT NULL, phone TEXT NOT NULL\n);\nCREATE TABLE booking (\n  booking_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  room_no  INT    NOT NULL REFERENCES room(room_no),\n  guest_id BIGINT NOT NULL REFERENCES guest(guest_id),\n  check_in DATE NOT NULL, check_out DATE NOT NULL,\n  CHECK (check_out > check_in),\n  EXCLUDE USING gist (room_no WITH =, daterange(check_in, check_out) WITH &&)   -- needs btree_gist\n);","cap":null,"run":false},{"k":"my","t":"MySQL has no EXCLUDE constraints. Prevent overlaps with a trigger that checks SELECT 1 FROM booking WHERE room_no = NEW.room_no AND check_in < NEW.check_out AND check_out > NEW.check_in, or store one row per room-night with UNIQUE (room_no, night)."},{"k":"h","t":"Patterns to name in interviews"},{"k":"ul","t":["**Junction table** for M:N, with relationship attributes.","**Composite PK or UNIQUE** for 'once per pair'.","**CHECK** for ranges, state lists, date ordering, conditional rules.","**Snapshot columns** for history (price, address).","**Append-only ledger** instead of editing balances only.","**Soft delete** (is_active, deleted_at) where deleting would break history.","**Overlap prevention:** EXCLUDE (PostgreSQL), triggers or per-slot rows (MySQL).","**State machine** columns with CHECK lists; transitions in the application or a trigger."]}],"test":[{"q":"To stop a doctor being booked for overlapping time ranges in PostgreSQL you would use:","o":["An EXCLUDE USING gist constraint on a time range","A plain UNIQUE on slot_start","A foreign key","A CHECK on slot_end"],"a":0,"w":"Exclusion constraints reject rows whose ranges overlap with an existing row."},{"q":"Why model a bank ledger as append-only entries?","o":["Faster queries","Smaller table","Because balances cannot be stored","Auditability: history is never edited
