{"area":"Scenarios and design","q":"An order must keep the price a customer actually paid even if the product price later changes. Where do you store it?","o":["Only in product.price","In the customer table","In a trigger log only","In order_item.unit_price copied at purchase time"],"a":3,"w":"A deliberate snapshot of the price on the order line keeps history stable."},{"area":"Scenarios and design","q":"Each employee has at most one parking spot and each spot belongs to at most one employee. Which constraint pair models it?","o":["Two primary keys in employee","A junction table without keys","employee.parking_id without UNIQUE","parking.employee_id with UNIQUE and a foreign key"],"a":3,"w":"A 1:1 relationship is a foreign key with a UNIQUE constraint on it."},{"area":"Scenarios and design","q":"Which CREATE TABLE has a bug?","o":["CREATE TABLE t (id INT, id2 INT, PRIMARY KEY (id, id2));","CREATE TABLE t (id INT PRIMARY KEY, PRIMARY KEY (id));","CREATE TABLE t (id INT PRIMARY KEY, a INT NOT NULL, b INT CHECK (b > 0));","CREATE TABLE t (id INT PRIMARY KEY, a INT UNIQUE);"],"a":1,"w":"A table can have only one primary key declaration; here it is declared twice."},{"area":"Scenarios and design","q":"You need 'a student enrolls in a course at most once per term'. Which constraint?","o":["CHECK (term > 0)","PRIMARY KEY (student_id)","FOREIGN KEY (term)","UNIQUE (student_id, course_id, term)"],"a":3,"w":"The combination of the three columns must be unique."},{"area":"Scenarios and design","q":"A comments table needs replies to comments (a tree). Which column does it need?","o":["A separate table per level","A TEXT list of child ids","parent_id referencing comments(id), NULL for top level","reply_count INT"],"a":2,"w":"Adjacency list: a self-referencing foreign key."},{"area":"Scenarios and design","q":"Which is the better primary key for a table of customers that also has a unique email?","o":["email only","A surrogate id plus UNIQUE (email)","No primary key","name"],"a":1,"w":"Emails change; keep a stable surrogate key and still enforce uniqueness of the natural key."},{"area":"Scenarios and design","q":"When a department is deleted its employees should stay but lose the department link. Which foreign key action?","o":["ON DELETE SET NULL","ON UPDATE CASCADE","ON DELETE RESTRICT","ON DELETE CASCADE"],"a":0,"w":"SET NULL orphans the children gracefully (the FK column must allow NULL)."},{"area":"Scenarios and design","q":"An invoice number must never repeat and never have gaps. What is the right approach?","o":["MAX(id) + 1 in application code","An auto-increment id","A separately controlled counter row updated in the same transaction (with locking)","A random UUID"],"a":2,"w":"Auto-increment can skip values after rollbacks; gapless numbering needs a locked counter."},{"area":"Scenarios and design","q":"Which design allows a doctor to be booked only once for a given start time?","o":["UNIQUE (doctor_id, slot_start) on appointment","An index on slot_start","A trigger on SELECT","CHECK (slot_start > now())"],"a":0,"w":"A unique constraint over the pair prevents a second booking."},{"area":"Scenarios and design","q":"A table has columns (student, course, instructor) with course determined by instructor. Which statement is true?","o":["It is in BCNF","It violates 1NF","It has a multivalued dependency only","It is in 3NF but not BCNF if the keys overlap"],"a":3,"w":"instructor → course has a non-key determinant whose RHS is prime: 3NF, not BCNF."},{"area":"Scenarios and design","q":"To represent a multivalued attribute such as an employee's skills you should:","o":["Store a comma-separated string","Use a derived attribute","Add skill1..skill5 columns","Create employee_skill(emp_id, skill) with a composite key"],"a":3,"w":"Child table keeps 1NF and lets you query and constrain skills."},{"area":"Scenarios and design","q":"Soft delete with a unique email should be implemented in PostgreSQL as:","o":["CHECK (deleted_at IS NULL)","CREATE UNIQUE INDEX ... ON users (email) WHERE deleted_at IS NULL","DEFAULT NULL","UNIQUE (email)"],"a":1,"w":"A partial unique index ignores soft-deleted rows."},{"area":"Scenarios and design","q":"Which is the best type for storing money amounts like 1499.99?","o":["NUMERIC(12,2)","FLOAT","TEXT","DOUBLE PRECISION"],"a":0,"w":"Exact decimals avoid rounding errors."},{"area":"Scenarios and design","q":"A query filters WHERE LOWER(email) = 'a@x.com' on a big table. The right fix in PostgreSQL is:","o":["SELECT *","An index on email","An expression index on LOWER(email)","A hash join"],"a":2,"w":"A plain index cannot serve a function of the column."},{"area":"PostgreSQL vs MySQL","q":"Which statement inserts or updates on a duplicate key in PostgreSQL?","o":["INSERT ... ON DUPLICATE KEY UPDATE","REPLACE INTO","INSERT ... ON CONFLICT (key) DO UPDATE","UPSERT"],"a":2,"w":"ON DUPLICATE KEY UPDATE is the MySQL spelling."},{"area":"PostgreSQL vs MySQL","q":"In MySQL the expression 'a' || 'b' returns (default sql_mode):","o":["NULL","0 (logical OR of two strings)","'ab'","An error"],"a":1,"w":"|| is logical OR in MySQL unless PIPES_AS_CONCAT is on."},{"area":"PostgreSQL vs MySQL","q":"SELECT 7 / 2 returns 3 in:","o":["PostgreSQL","MySQL","Neither","Both"],"a":0,"w":"PostgreSQL performs integer division for two integers; MySQL returns 3.5."},{"area":"PostgreSQL vs MySQL","q":"Which is a PostgreSQL-only feature?","o":["Views","Foreign keys","Transactional DDL","Primary keys"],"a":2,"w":"MySQL implicitly commits on DDL."},{"area":"PostgreSQL vs MySQL","q":"MySQL equivalent of PostgreSQL STRING_AGG(name, ', '):","o":["ARRAY_TO_STRING","GROUP_CONCAT(name SEPARATOR ', ')","CONCAT_AGG","LISTAGG"],"a":1,"w":"GROUP_CONCAT with SEPARATOR."},{"area":"PostgreSQL vs MySQL","q":"You need the first row per group in PostgreSQL in one clause. Use:","o":["GROUP FIRST","DISTINCT ON (group_col)","LIMIT PER GROUP","TOP 1 WITH TIES"],"a":1,"w":"DISTINCT ON keeps the first row per key according to ORDER BY."},{"area":"PostgreSQL vs MySQL","q":"The InnoDB storage layout is best described as:","o":["Clustered B+ tree on the primary key","Column store","Hash table","Heap plus separate primary-key index"],"a":0,"w":"The table is stored inside the primary key index."},{"area":"PostgreSQL vs MySQL","q":"Which command shows the structure of a table in MySQL and in psql respectively?","o":["\\d t / DESCRIBE t","INFO t / \\i t","DESCRIBE t / \\d t","SHOW t / LIST t"],"a":2,"w":"MySQL DESCRIBE, psql \\d."},{"area":"PostgreSQL vs MySQL","q":"Which of these syntaxes is MySQL (not PostgreSQL) for a join-update?","o":["MERGE INTO a USING b","UPDATE a JOIN b ON a.id = b.id SET a.x = b.x","UPDATE a, b WITH","UPDATE a SET x = b.x FROM b WHERE a.id = b.id"],"a":1,"w":"PostgreSQL uses UPDATE ... FROM; MySQL uses UPDATE ... JOIN ... SET."},{"area":"PostgreSQL vs MySQL","q":"Default isolation level: PostgreSQL / MySQL InnoDB:","o":["REPEATABLE READ / READ COMMITTED","READ UNCOMMITTED / READ COMMITTED","READ COMMITTED / REPEATABLE READ","SERIALIZABLE / SERIALIZABLE"],"a":2,"w":"That difference is frequently asked."},{"area":"PostgreSQL vs MySQL","q":"A MySQL column declared TIMESTAMP differs from DATETIME because it:","o":["Has no time part","Stores only dates","Cannot be indexed","Is stored in UTC and limited to 1970-2038"],"a":3,"w":"TIMESTAMP is converted to the session time zone and has a limited range."},{"area":"PostgreSQL vs MySQL","q":"In which database does a partial index exist natively?","o":["Both","MySQL","Neither","PostgreSQL"],"a":3,"w":"CREATE INDEX ... WHERE condition is PostgreSQL."},{"area":"Transactions and triggers","q":"A BEFORE INSERT trigger is the right place to:","o":["Replace a view","Write an audit row for a successful insert","Update other tables after commit","Validate or fix the incoming row"],"a":3,"w":"BEFORE triggers can modify NEW or reject the row."},{"area":"Transactions and triggers","q":"In a PostgreSQL BEFORE row trigger, RETURN NULL means:","o":["Allow the row","Skip the operation for this row","Roll back the transaction","Error"],"a":1,"w":"The row-level operation is silently cancelled."},{"area":"Transactions and triggers","q":"Which trigger event has no NEW row?","o":["UPDATE","INSERT","None","DELETE"],"a":3,"w":"DELETE only has OLD."},{"area":"Transactions and triggers","q":"Two transactions each read balance 100 and write 110. Final balance is 110. This is:","o":["Lost update","Dirty read","Deadlock","Phantom read"],"a":0,"w":"One write overwrote the other."},{"area":"Transactions and triggers","q":"SELECT ... FOR UPDATE SKIP LOCKED is typically used for:","o":["Backups","Reporting","Creating indexes","Job queues with several workers"],"a":3,"w":"Each worker claims a different unlocked row."},{"area":"Transactions and triggers","q":"A transaction in PostgreSQL gets an error. What happens to later statements in the same transaction block?","o":["They run normally","They all fail until ROLLBACK","The connection closes","They auto-commit"],"a":1,"w":"The transaction is aborted."},{"area":"Transactions and triggers","q":"To avoid deadlocks between two transfer transactions you should:","o":["Use autocommit","Always lock accounts in the same order","Increase isolation to READ UNCOMMITTED","Disable indexes"],"a":1,"w":"Consistent lock ordering removes the cycle."},{"area":"Transactions and triggers","q":"MySQL InnoDB cascading foreign-key actions:","o":["Do not fire triggers","Are not supported","Run in a separate transaction","Fire triggers"],"a":0,"w":"Triggers are not activated by foreign key cascades in MySQL."},{"area":"Transactions and triggers","q":"Schedule R1(A) W2(A) W1(A) is checked by a precedence graph. The edges are:","o":["T2 → T1 only","No edges","T1 → T2 only","T1 → T2 and T2 → T1 (cycle)"],"a":3,"w":"R1 before W2 gives T1→T2; W2 before W1 gives T2→T1."},{"area":"Transactions and triggers","q":"Which isolation level prevents phantom reads according to the SQL standard?","o":["READ COMMITTED","REPEATABLE READ","READ UNCOMMITTED","SERIALIZABLE"],"a":3,"w":"Only SERIALIZABLE forbids all three anomalies."},{"area":"Transactions and triggers","q":"A trigger that UPDATEs its own table inside a BEFORE UPDATE trigger is risky because:","o":["It can recurse indefinitely","It locks the database","It cannot see NEW","It is syntactically invalid"],"a":0,"w":"Modify NEW instead, or guard against recursion."},{"area":"Transactions and triggers","q":"Write-ahead logging requires that log records:","o":["Reach disk before the data pages they describe","Are written after commit only","Are kept in memory","Replace the data"],"a":0,"w":"Log first, data later."}],"cheat":[{"id":"skeleton","title":"Query skeleton and order","items":[{"l":"Written order","c":"SELECT [DISTINCT] col, expr AS alias\nFROM table t\n[JOIN other o ON t.k = o.k]\nWHERE row_filter\nGROUP BY col\nHAVING group_filter\nORDER BY col [ASC|DESC]\nLIMIT n [OFFSET m];","s":"","t":"","rc":false},{"l":"Run order (why a SELECT alias fails in WHERE)","c":"FROM/JOIN -> WHERE -> GROUP BY -> HAVING -> window functions -> SELECT -> DISTINCT -> ORDER BY -> LIMIT\n-- MySQL lets you use a SELECT alias in GROUP BY, HAVING and ORDER BY, never in WHERE.","s":"","t":"","rc":false},{"l":"Comments","c":"-- one line\n# MySQL only, one line\n/* many\n   lines */","s":"","t":"","rc":false},{"l":"Run several statements","c":"End every statement with a semicolon. In an OA, run the statement the question asks for, nothing else.","s":"","t":"","rc":false}]},{"id":"where","title":"Filtering (WHERE)","items":[{"l":"Comparison, AND/OR/NOT","c":"SELECT * FROM employees WHERE salary >= 50000 AND (city = 'Pune' OR city = 'Chennai') AND NOT dept_id = 3;\n-- <> and != both mean not equal. AND binds tighter than OR: use brackets.","s":"SELECT columns FROM table WHERE condition [AND|OR condition ...];","t":"","rc":true},{"l":"BETWEEN (inclusive), IN","c":"WHERE salary BETWEEN 50000 AND 90000\nWHERE city IN ('Pune', 'Chennai')\nWHERE dept_id NOT IN (SELECT id FROM departments WHERE budget < 100000)   -- beware NULLs inside NOT IN","s":"WHERE col BETWEEN low AND high      WHERE col [NOT] IN (value, value, ...)","t":"SELECT name, salary, city FROM employees\nWHERE salary BETWEEN 90000 AND 130000 AND city IN ('Bengaluru', 'Hyderabad');","rc":false},{"l":"LIKE: % any length, _ one character","c":"WHERE name LIKE 'A%'       -- starts with A\nWHERE name LIKE '%a'       -- ends with a\nWHERE name LIKE '_a%'      -- second letter a\nWHERE name LIKE '%50\\%%'   -- a literal %, escaped with \\","s":"WHERE col [NOT] LIKE 'pattern'        -- % = any number of characters, _ = exactly one","t":"SELECT name FROM employees WHERE name LIKE 'A%' OR name LIKE '%a' OR name LIKE '_e%';","rc":false},{"l":"Regex (MySQL)","c":"WHERE name REGEXP '^[AEIOU]'          -- starts with a vowel\nWHERE name REGEXP '[aeiou]$'          -- ends with a vowel\nWHERE name RLIKE 'son|sen'","s":"","t":"SELECT name FROM employees WHERE name REGEXP '^[AEIOU]';","rc":false},{"l":"NULL tests (never = NULL)","c":"WHERE manager_id IS NULL\nWHERE manager_id IS NOT NULL\nWHERE manager_id <=> NULL       -- MySQL null-safe equals","s":"WHERE col IS [NOT] NULL","t":"SELECT name, manager_id FROM employees WHERE manager_id IS NULL;","rc":false},{"l":"EXISTS","c":"WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id)","s":"","t":"SELECT d.name FROM departments d WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);","rc":false},{"l":"Case sensitivity","c":"MySQL string comparison is case-insensitive by default (utf8mb4_0900_ai_ci).\nForce it: WHERE name = BINARY 'asha'    or    WHERE name COLLATE utf8mb4_bin = 'Asha'","s":"","t":"","rc":false}]},{"id":"sort","title":"Sorting, limiting, DISTINCT","items":[{"l":"Sort","c":"ORDER BY salary DESC, name ASC;\nORDER BY 2 DESC;                     -- by the 2nd selected column\nORDER BY FIELD(city,'Pune','Delhi'); -- custom order (MySQL)\nORDER BY manager_id IS NULL, manager_id;   -- NULLs last in MySQL","s":"ORDER BY col1 [ASC|DESC], col2 [ASC|DESC], ...","t":"SELECT name, city, salary FROM employees ORDER BY city ASC, salary DESC;","rc":false},{"l":"Top N and pagination","c":"SELECT * FROM employees ORDER BY salary DESC LIMIT 3;\nSELECT * FROM employees ORDER BY id LIMIT 3 OFFSET 6;     -- rows 7-9\nSELECT * FROM employees ORDER BY id LIMIT 6, 3;           -- same: LIMIT offset, count","s":"SELECT ... ORDER BY col [DESC] LIMIT count [OFFSET skip];","t":"","rc":true},{"l":"Always add ORDER BY","c":"Without ORDER BY the row order is not guaranteed. A checker that compares rows in order will fail a correct query.","s":"","t":"","rc":false},{"l":"Distinct","c":"SELECT DISTINCT city FROM employees;\nSELECT DISTINCT dept_id, city FROM employees;         -- distinct pairs\nSELECT COUNT(DISTINCT city) FROM employees;","s":"SELECT DISTINCT col1, col2 FROM table;","t":"","rc":true},{"l":"SQL Server / Oracle top N (for reference)","c":"-- SQL Server:  SELECT TOP 3 * FROM employees ORDER BY salary DESC;\n-- Standard:    ... ORDER BY salary DESC FETCH FIRST 3 ROWS ONLY;   (Postgres, Oracle 12c+, SQL Server with OFFSET 0 ROWS)","s":"","t":"","rc":false}]},{"id":"agg","title":"Aggregates, GROUP BY, HAVING","items":[{"l":"Aggregate functions","c":"COUNT(*)            -- rows\nCOUNT(col)          -- non-NULL values\nCOUNT(DISTINCT col) -- distinct non-NULL values\nSUM(col)  AVG(col)  MIN(col)  MAX(col)      -- all ignore NULL","s":"","t":"SELECT COUNT(*) AS rows_, COUNT(manager_id) AS with_manager, COUNT(DISTINCT city) AS cities, SUM(salary) AS total, ROUND(AVG(salary)) AS avg_sal, MIN(salary) AS lo, MAX(salary) AS hi FROM employees;","rc":false},{"l":"Group and filter groups","c":"SELECT dept_id, COUNT(*) AS n, AVG(salary) AS avg_sal\nFROM employees\nWHERE city <> 'Delhi'          -- filters rows BEFORE grouping\nGROUP BY dept_id\nHAVING COUNT(*) >= 3           -- filters groups AFTER grouping\nORDER BY avg_sal DESC;","s":"SELECT group_col, AGG(col) FROM table [WHERE row_filter] GROUP BY group_col [HAVING group_filter] [ORDER BY ...];","t":"","rc":true},{"l":"Every non-aggregated SELECT column must be in GROUP BY","c":"SELECT dept_id, city, COUNT(*) FROM employees GROUP BY dept_id, city;","s":"","t":"","rc":true},{"l":"Totals with ROLLUP","c":"SELECT dept_id, city, SUM(salary) FROM employees GROUP BY dept_id, city WITH ROLLUP;   -- MySQL spelling","s":"","t":"SELECT dept_id, SUM(salary) AS total FROM employees GROUP BY dept_id\nUNION ALL\nSELECT NULL, SUM(salary) FROM employees;","rc":false},{"l":"Join the values of a group","c":"SELECT dept_id, GROUP_CONCAT(name ORDER BY name SEPARATOR ', ') AS people FROM employees GROUP BY dept_id;","s":"","t":"SELECT dept_id, GROUP_CONCAT(name, ', ') AS people FROM employees GROUP BY dept_id;","rc":false},{"l":"Conditional counting","c":"SELECT dept_id,\n       SUM(city = 'Pune')                       AS in_pune,        -- MySQL: a comparison is 1 or 0\n       SUM(CASE WHEN salary > 90000 THEN 1 ELSE 0 END) AS high_paid\nFROM employees GROUP BY dept_id;","s":"","t":"","rc":true},{"l":"Percent of total","c":"SELECT dept_id, SUM(salary) * 100.0 / (SELECT SUM(salary) FROM employees) AS pct FROM employees GROUP BY dept_id;","s":"","t":"","rc":true}]},{"id":"joins","title":"Joins","items":[{"l":"INNER JOIN (only matches)","c":"SELECT e.name, d.name AS dept FROM employees e JOIN departments d ON d.id = e.dept_id;","s":"SELECT cols FROM a [INNER] JOIN b ON a.key = b.key;","t":"","rc":true},{"l":"LEFT JOIN (all left rows)","c":"SELECT d.name, COUNT(e.id) AS staff          -- COUNT(e.id), not COUNT(*), so empty depts show 0\nFROM departments d LEFT JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name;","s":"SELECT cols FROM a LEFT [OUTER] JOIN b ON a.key = b.key;      -- unmatched b columns are NULL","t":"","rc":true},{"l":"RIGHT JOIN","c":"SELECT e.name, d.name FROM employees e RIGHT JOIN departments d ON d.id = e.dept_id;","s":"","t":"","rc":true},{"l":"FULL JOIN (MySQL has none: UNION a left and a right)","c":"SELECT e.name, d.name FROM employees e LEFT JOIN departments d ON d.id = e.dept_id\nUNION\nSELECT e.name, d.name FROM employees e RIGHT JOIN departments d ON d.id = e.dept_id;","s":"","t":"","rc":true},{"l":"Anti join: rows with no match","c":"SELECT d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;\nSELECT d.name FROM departments d WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);","s":"","t":"","rc":true},{"l":"Self join: employee and manager","c":"SELECT e.name AS employee, m.name AS manager FROM employees e LEFT JOIN employees m ON m.id = e.manager_id;","s":"SELECT x.col, y.col FROM t x JOIN t y ON x.fk = y.pk;        -- the same table twice, two aliases","t":"","rc":true},{"l":"Pairs without duplicates","c":"SELECT a.name, b.name FROM employees a JOIN employees b ON a.city = b.city AND a.id < b.id;","s":"","t":"","rc":true},{"l":"CROSS JOIN","c":"SELECT d.name, c.city FROM departments d CROSS JOIN (SELECT DISTINCT city FROM employees) c;","s":"","t":"","rc":true},{"l":"USING / NATURAL","c":"SELECT * FROM employees JOIN departments USING (id);   -- joins on a column with the same name\n-- SELECT * FROM a NATURAL JOIN b;                    -- avoid in real code","s":"","t":"","rc":true},{"l":"Three tables","c":"SELECT e.name, p.name AS project, a.hours\nFROM employees e\nJOIN assignments a ON a.emp_id = e.id\nJOIN projects p    ON p.id = a.project_id;","s":"","t":"","rc":true},{"l":"Put the filter in ON or WHERE?","c":"With a LEFT JOIN, a condition on the right table in WHERE turns it into an inner join. Put it in ON to keep the unmatched left rows.","s":"","t":"SELECT d.name, COUNT(e.id) AS pune_staff\nFROM departments d LEFT JOIN employees e ON e.dept_id = d.id AND e.city = 'Pune'\nGROUP BY d.id, d.name;","rc":false}]},{"id":"sub","title":"Subqueries","items":[{"l":"Scalar subquery (one value)","c":"SELECT name FROM employees WHERE salary > (SELECT AVG(salary) FROM employees);","s":"SELECT cols FROM t WHERE col > (SELECT AGG(col) FROM t);","t":"","rc":true},{"l":"IN","c":"SELECT name FROM employees WHERE dept_id IN (SELECT id FROM departments WHERE budget > 500000);","s":"SELECT cols FROM t WHERE col IN (SELECT col FROM other WHERE ...);","t":"","rc":true},{"l":"Correlated subquery","c":"SELECT name, salary FROM employees e\nWHERE salary > (SELECT AVG(salary) FROM employees x WHERE x.dept_id = e.dept_id);   -- above their own dept average","s":"SELECT cols FROM t o WHERE col > (SELECT AGG(col) FROM t i WHERE i.group = o.group);","t":"","rc":true},{"l":"ANY / ALL","c":"WHERE salary > ALL (SELECT salary FROM employees WHERE dept_id = 2)\nWHERE salary > ANY (SELECT salary FROM employees WHERE dept_id = 2)","s":"","t":"","rc":false},{"l":"Derived table (needs an alias)","c":"SELECT dept_id, avg_sal FROM (SELECT dept_id, AVG(salary) AS avg_sal FROM employees GROUP BY dept_id) t WHERE avg_sal > 60000;","s":"","t":"","rc":true},{"l":"Subquery in SELECT","c":"SELECT d.name, (SELECT COUNT(*) FROM employees e WHERE e.dept_id = d.id) AS staff FROM departments d;","s":"","t":"","rc":true},{"l":"MySQL cannot UPDATE/DELETE a table it selects from directly","c":"DELETE FROM employees WHERE id IN (SELECT id FROM (SELECT id FROM employees WHERE salary < 20000) t);   -- wrap in a derived table","s":"","t":"","rc":true}]},{"id":"setops","title":"Set operations","items":[{"l":"UNION (removes duplicates) / UNION ALL (keeps them, faster)","c":"SELECT city FROM employees\nUNION\nSELECT city FROM customers;\n-- same number of columns, compatible types; ORDER BY once, at the very end","s":"SELECT ... UNION [ALL] SELECT ...;      -- same number and types of columns","t":"","rc":true},{"l":"INTERSECT / EXCEPT (MySQL 8.0.31+)","c":"SELECT city FROM employees WHERE dept_id = 1\nINTERSECT\nSELECT city FROM employees WHERE dept_id = 2;\n\nSELECT id FROM departments\nEXCEPT\nSELECT dept_id FROM employees;","s":"","t":"","rc":true},{"l":"Older MySQL: without INTERSECT / EXCEPT","c":"SELECT DISTINCT city FROM employees WHERE dept_id = 1 AND city IN (SELECT city FROM employees WHERE dept_id = 2);   -- intersect\nSELECT d.id FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;                        -- except","s":"","t":"","rc":true}]},{"id":"case","title":"CASE, NULL handling","items":[{"l":"CASE","c":"SELECT name,\n  CASE WHEN salary >= 90000 THEN 'high'\n       WHEN salary >= 50000 THEN 'mid'\n       ELSE 'low' END AS band\nFROM employees;","s":"CASE WHEN condition THEN result [WHEN ... THEN ...] [ELSE result] END","t":"","rc":true},{"l":"Simple CASE","c":"CASE dept_id WHEN 1 THEN 'Eng' WHEN 2 THEN 'Ops' ELSE 'Other' END","s":"","t":"SELECT name, CASE dept_id WHEN 1 THEN 'Eng' WHEN 2 THEN 'Data' WHEN 3 THEN 'Platform' ELSE 'Other' END AS dept FROM employees;","rc":false},{"l":"COALESCE, IFNULL, NULLIF, IF","c":"COALESCE(a, b, 0)        -- first non-NULL\nIFNULL(a, 0)             -- MySQL, two arguments\nNULLIF(a, 0)             -- NULL when a = 0 (avoids divide by zero)\nIF(salary > 50000, 'Y', 'N')   -- MySQL only\nx / NULLIF(y, 0)","s":"COALESCE(a, b, ...)   IFNULL(a, b)   NULLIF(a, b)   IF(condition, then, else)","t":"SELECT name, manager_id, COALESCE(manager_id, 0) AS mgr_or_zero, IFNULL(manager_id, -1) AS mgr_or_minus1, NULLIF(dept_id, 1) AS dept_not_1 FROM employees;","rc":false},{"l":"Three-valued logic","c":"NULL = NULL is NULL (not true). NULL + 1 is NULL. AND/OR with NULL can be unknown.\nCOUNT(col) skips NULLs. NOT IN (..., NULL) never matches anything. ORDER BY puts NULLs first in ASC.","s":"","t":"","rc":false}]},{"id":"string","title":"String functions","items":[{"l":"Join","c":"CONCAT('Dr. ', name)           -- never use || in MySQL: it means OR\nCONCAT_WS(', ', city, state)     -- with a separator, skips NULLs","s":"","t":"SELECT name, city, CONCAT('Dr. ', name) AS title, CONCAT(name, ' (', city, ')') AS label FROM employees LIMIT 5;","rc":false},{"l":"Length","c":"CHAR_LENGTH(name)    -- characters\nLENGTH(name)         -- BYTES in MySQL (different for non-ASCII)","s":"","t":"SELECT name, CHAR_LENGTH(name) AS chars FROM employees ORDER BY chars DESC;","rc":false},{"l":"Case, trim, pad","c":"UPPER(name)  LOWER(name)\nTRIM(name)  LTRIM(name)  RTRIM(name)  TRIM(BOTH 'x' FROM name)\nLPAD(id, 5, '0')    RPAD(name, 10, '.')","s":"","t":"SELECT UPPER(name) AS up, LOWER(city) AS low, TRIM('  hi  ') AS trimmed FROM employees LIMIT 4;","rc":false},{"l":"Part of a string (positions start at 1)","c":"SUBSTRING(name, 2, 3)     -- 3 chars from position 2\nSUBSTRING(name, -3)       -- last 3\nLEFT(name, 2)   RIGHT(name, 2)\nSUBSTRING_INDEX(email, '@', 1)    -- before the first @\nSUBSTRING_INDEX(email, '@', -1)   -- after the last @","s":"","t":"SELECT name, SUBSTRING(name, 2, 3) AS mid3, LEFT(name, 2) AS first2, RIGHT(name, 2) AS last2 FROM employees;","rc":false},{"l":"Find, replace, repeat","c":"LOCATE('a', name)   INSTR(name, 'a')    -- 0 when absent\nREPLACE(name, 'a', '@')\nREVERSE(name)   REPEAT('ab', 3)\nFORMAT(1234567.891, 2)       -- '1,234,567.89'","s":"","t":"SELECT name, REPLACE(name, 'a', '@') AS swapped, INSTR(name, 'a') AS pos_of_a FROM employees;","rc":false},{"l":"Compare / match","c":"STRCMP(a, b)             -- -1, 0, 1\nname LIKE 'A%'   name REGEXP '^A'\nREGEXP_REPLACE(name, '[0-9]', '')     -- MySQL 8","s":"","t":"","rc":false},{"l":"Palindrome / vowel count tricks","c":"WHERE name = REVERSE(name)\nCHAR_LENGTH(name) - CHAR_LENGTH(REPLACE(LOWER(name), 'a', ''))   -- how many a's","s":"","t":"SELECT name, CHAR_LENGTH(name) - CHAR_LENGTH(REPLACE(LOWER(name), 'a', '')) AS a_count FROM employees;","rc":false}]},{"id":"num","title":"Numeric functions","items":[{"l":"Rounding and powers","c":"ROUND(3.14159, 2)  ROUND(1234, -2)  CEIL(2.1)  FLOOR(2.9)  TRUNCATE(3.987, 1)\nABS(-5)  POWER(2, 10)  SQRT(16)  SIGN(-3)  MOD(10, 3)  10 % 3","s":"","t":"SELECT ROUND(3.14159, 2) AS r, ABS(-5) AS a, 10 % 3 AS m, 2 * 2 * 2 AS cube;","rc":false},{"l":"Division","c":"SELECT 7 / 2;     -- 3.5000 in MySQL\nSELECT 7 DIV 2;   -- 3  (integer division)\n-- PostgreSQL / SQL Server: 7 / 2 is 3 for integers, so write 7 / 2.0","s":"","t":"","rc":false},{"l":"Others","c":"GREATEST(a, b, c)  LEAST(a, b, c)  RAND()   -- ORDER BY RAND() LIMIT 1 picks a random row\nCAST(x AS DECIMAL(10,2))   CAST('42' AS SIGNED)   CONVERT(x, UNSIGNED)","s":"","t":"SELECT MAX(salary, 100000) AS at_least_100k, MIN(salary, 100000) AS at_most_100k FROM employees;","rc":false}]},{"id":"date","title":"Date and time (MySQL)","items":[{"l":"Now","c":"NOW()  CURDATE()  CURTIME()  CURRENT_TIMESTAMP  UTC_TIMESTAMP()","s":"","t":"SELECT CURDATE() AS today, NOW() AS now_ts;","rc":false},{"l":"Parts","c":"YEAR(d)  MONTH(d)  DAY(d)  HOUR(t)  QUARTER(d)  WEEK(d)  DAYOFWEEK(d)   -- Sunday = 1\nDAYNAME(d)  MONTHNAME(d)  DAYOFYEAR(d)  LAST_DAY(d)  EXTRACT(YEAR FROM d)","s":"","t":"SELECT name, hire_date, YEAR(hire_date) AS y, MONTH(hire_date) AS m, DAY(hire_date) AS d FROM employees LIMIT 5;","rc":false},{"l":"Add / subtract","c":"DATE_ADD(d, INTERVAL 7 DAY)    DATE_SUB(d, INTERVAL 1 MONTH)    d + INTERVAL 1 YEAR\n-- units: SECOND MINUTE HOUR DAY WEEK MONTH QUARTER YEAR","s":"","t":"","rc":false},{"l":"Differences","c":"DATEDIFF(d1, d2)                 -- days, d1 - d2\nTIMESTAMPDIFF(MONTH, d1, d2)     -- whole units, d2 - d1\nTIMESTAMPDIFF(YEAR, birth_date, CURDATE())   -- age","s":"","t":"SELECT name, hire_date, DATEDIFF(CURDATE(), hire_date) AS days_employed FROM employees ORDER BY days_employed DESC LIMIT 5;","rc":false},{"l":"Format and parse","c":"DATE_FORMAT(d, '%Y-%m-%d')   DATE_FORMAT(d, '%d %b %Y')   DATE_FORMAT(d, '%W')\nSTR_TO_DATE('15-08-2026', '%d-%m-%Y')\n-- %Y 2026  %y 26  %m 08  %d 15  %b Aug  %M August  %H 24h  %i minutes  %s seconds  %W weekday","s":"","t":"SELECT name, hire_date, DATE_FORMAT(hire_date, '%d/%m/%Y') AS indian_style, DATE_FORMAT(hire_date, '%Y-%m') AS ym FROM employees LIMIT 5;","rc":false},{"l":"Date types","c":"DATE (2026-10-28)  DATETIME  TIMESTAMP (auto-updating, time zone aware)  TIME  YEAR","s":"","t":"","rc":false},{"l":"Common asks","c":"WHERE hire_date >= '2025-01-01' AND hire_date < '2026-01-01'          -- a year range (uses an index)\nWHERE YEAR(hire_date) = 2025                                 -- fine, but not index friendly\nGROUP BY YEAR(hire_date), MONTH(hire_date)\nWHERE hire_date >= CURDATE() - INTERVAL 30 DAY             -- last 30 days","s":"","t":"SELECT name, hire_date FROM employees WHERE hire_date >= '2020-01-01' AND hire_date < '2021-01-01';","rc":false}]},{"id":"window","title":"Window functions (MySQL 8+)","items":[{"l":"Shape","c":"func() OVER (PARTITION BY group_col ORDER BY sort_col [frame])    -- keeps every row, adds a column","s":"function() OVER ([PARTITION BY cols] [ORDER BY cols] [ROWS BETWEEN ... AND ...])","t":"","rc":false},{"l":"Ranking","c":"ROW_NUMBER() OVER (ORDER BY salary DESC)   -- 1,2,3,4 unique\nRANK()       OVER (ORDER BY salary DESC)   -- 1,2,2,4 gaps after ties\nDENSE_RANK() OVER (ORDER BY salary DESC)   -- 1,2,2,3 no gaps\nNTILE(4)     OVER (ORDER BY salary)        -- quartile bucket","s":"","t":"SELECT name, salary,\n  ROW_NUMBER() OVER (ORDER BY salary DESC) AS row_no,\n  RANK() OVER (ORDER BY salary DESC) AS rnk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) AS dense\nFROM employees;","rc":false},{"l":"Rank inside each group","c":"SELECT * FROM (\n  SELECT name, dept_id, salary, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employees\n) t WHERE r <= 2;                -- top 2 per department","s":"","t":"","rc":true},{"l":"Look at neighbours","c":"LAG(salary, 1, 0) OVER (ORDER BY hire_date)    -- previous row (offset, default)\nLEAD(salary)       OVER (ORDER BY hire_date)    -- next row\nFIRST_VALUE(name) OVER (PARTITION BY dept_id ORDER BY salary DESC)\nLAST_VALUE(name)  OVER (PARTITION BY dept_id ORDER BY salary ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)","s":"","t":"SELECT name, hire_date, salary, LAG(salary) OVER (ORDER BY hire_date) AS prev_salary, LEAD(salary) OVER (ORDER BY hire_date) AS next_salary FROM employees;","rc":false},{"l":"Running and moving totals","c":"SUM(amount) OVER (ORDER BY d)                                    -- running total\nSUM(amount) OVER (ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)   -- 3-row moving sum\nAVG(salary) OVER (PARTITION BY dept_id)                            -- per-group average on every row\nSUM(salary) OVER ()                                                -- grand total on every row","s":"","t":"SELECT sale_date, amount, SUM(amount) OVER (ORDER BY sale_date) AS running, AVG(amount) OVER (ORDER BY sale_date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS moving_avg FROM sales;","rc":false},{"l":"Change from previous row","c":"SELECT yr, hires, hires - LAG(hires) OVER (ORDER BY yr) AS diff_from_prev FROM yearly;","s":"","t":"","rc":true},{"l":"You cannot filter a window result in WHERE","c":"Wrap it: SELECT * FROM (SELECT ..., ROW_NUMBER() OVER (...) AS rn FROM t) x WHERE rn = 1;","s":"","t":"SELECT * FROM (SELECT name, dept_id, salary, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn FROM employees) x WHERE rn = 1;","rc":false}]},{"id":"cte","title":"CTEs and recursion","items":[{"l":"WITH","c":"WITH dept_avg AS (SELECT dept_id, AVG(salary) AS avg_sal FROM employees GROUP BY dept_id)\nSELECT e.name FROM employees e JOIN dept_avg d ON d.dept_id = e.dept_id WHERE e.salary > d.avg_sal;","s":"WITH name AS (SELECT ...) [, name2 AS (SELECT ...)] SELECT ... FROM name;","t":"","rc":true},{"l":"Several CTEs","c":"WITH a AS (SELECT ...), b AS (SELECT ... FROM a) SELECT * FROM b;","s":"","t":"WITH a AS (SELECT dept_id, SUM(salary) AS total FROM employees GROUP BY dept_id),\n     b AS (SELECT dept_id, total, total * 100.0 / (SELECT SUM(total) FROM a) AS pct FROM a)\nSELECT * FROM b ORDER BY pct DESC;","rc":false},{"l":"Recursive: management chain","c":"WITH RECURSIVE org AS (\n  SELECT id, name, manager_id, 0 AS depth, CAST(name AS CHAR(200)) AS path FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, o.depth + 1, CONCAT(o.path, ' > ', e.name)\n  FROM employees e JOIN org o ON e.manager_id = o.id\n)\nSELECT * FROM org ORDER BY path;","s":"","t":"","rc":true},{"l":"Recursive: generate 1..10","c":"WITH RECURSIVE n AS (SELECT 1 AS x UNION ALL SELECT x + 1 FROM n WHERE x < 10) SELECT x FROM n;","s":"","t":"","rc":true}]},{"id":"dml","title":"INSERT, UPDATE, DELETE","items":[{"l":"INSERT","c":"INSERT INTO employees (name, dept_id, salary) VALUES ('Asha', 2, 70000);\nINSERT INTO employees (name, dept_id, salary) VALUES ('A', 1, 10), ('B', 2, 20), ('C', 3, 30);   -- many rows\nINSERT INTO archive (id, name) SELECT id, name FROM employees WHERE salary < 20000;                -- from a query","s":"INSERT INTO table (col1, col2) VALUES (v1, v2) [, (v1, v2) ...];\nINSERT INTO table (cols) SELECT ... ;","t":"CREATE TABLE archive (id INTEGER, name TEXT);\nINSERT INTO archive (id, name) SELECT id, name FROM employees WHERE salary < 100000;\nSELECT * FROM archive;","rc":false},{"l":"Insert or update (upsert)","c":"INSERT INTO stock (sku, qty) VALUES ('A1', 5)\nON DUPLICATE KEY UPDATE qty = qty + VALUES(qty);     -- needs a PRIMARY KEY or UNIQUE on sku\nINSERT IGNORE INTO stock (sku, qty) VALUES ('A1', 5);   -- skip rows that would fail\nREPLACE INTO stock (sku, qty) VALUES ('A1', 5);          -- delete then insert","s":"","t":"INSERT INTO stock (sku, qty) VALUES ('A1', 5)\nON CONFLICT (sku) DO UPDATE SET qty = qty + excluded.qty;\nSELECT * FROM stock;      -- SQLite / PostgreSQL spelling; MySQL uses ON DUPLICATE KEY UPDATE","rc":false},{"l":"UPDATE","c":"UPDATE employees SET salary = salary * 1.10 WHERE dept_id = 3;\nUPDATE employees SET city = 'Pune', salary = salary + 500 WHERE id = 7;","s":"UPDATE table SET col = value [, col = value ...] [WHERE condition];","t":"","rc":true},{"l":"UPDATE with a join (MySQL)","c":"UPDATE employees e JOIN departments d ON d.id = e.dept_id\nSET e.salary = e.salary * 1.05 WHERE d.name = 'Data';","s":"","t":"UPDATE employees SET salary = salary * 1.05 WHERE dept_id = (SELECT id FROM departments WHERE name = 'Data');\nSELECT name, dept_id, salary FROM employees WHERE dept_id = 2;","rc":false},{"l":"UPDATE with CASE","c":"UPDATE employees SET grade = CASE WHEN salary > 90000 THEN 'A' WHEN salary > 50000 THEN 'B' ELSE 'C' END;","s":"","t":"ALTER TABLE employees ADD COLUMN grade TEXT;\nUPDATE employees SET grade = CASE WHEN salary > 90000 THEN 'A' WHEN salary > 50000 THEN 'B' ELSE 'C' END;\nSELECT name, salary, grade FROM employees;","rc":false},{"l":"Swap two values in one UPDATE","c":"UPDATE seat SET gender = CASE gender WHEN 'M' THEN 'F' ELSE 'M' END;","s":"","t":"UPDATE seat SET student = CASE id WHEN 1 THEN 'Bharat' WHEN 2 THEN 'Asha' ELSE student END;\nSELECT * FROM seat;","rc":false},{"l":"DELETE","c":"DELETE FROM employees WHERE id = 7;\nDELETE FROM employees WHERE hire_date < '2015-01-01' ORDER BY id LIMIT 100;","s":"DELETE FROM table [WHERE condition];","t":"DELETE FROM employees WHERE id = 7;\nSELECT id, name FROM employees ORDER BY id;","rc":false},{"l":"DELETE with a join","c":"DELETE e FROM employees e JOIN departments d ON d.id = e.dept_id WHERE d.name = 'Design';","s":"","t":"DELETE FROM employees WHERE dept_id = (SELECT id FROM departments WHERE name = 'Design');\nSELECT id, name, dept_id FROM employees;","rc":false},{"l":"Delete duplicates, keep the smallest id","c":"DELETE e1 FROM person e1 JOIN person e2 ON e1.email = e2.email AND e1.id > e2.id;","s":"","t":"DELETE FROM person WHERE id NOT IN (SELECT MIN(id) FROM person GROUP BY email);\nSELECT * FROM person;","rc":false},{"l":"DELETE vs TRUNCATE vs DROP","c":"DELETE FROM t;      -- row by row, can have WHERE, can roll back, keeps AUTO_INCREMENT counter\nTRUNCATE TABLE t;    -- empties the table, resets the counter, DDL (cannot roll back in MySQL)\nDROP TABLE t;        -- removes the table itself\nDROP TABLE IF EXISTS t;","s":"","t":"","rc":false},{"l":"No RETURNING in MySQL","c":"INSERT ...;  SELECT LAST_INSERT_ID();     -- id of the row just inserted\nSELECT ROW_COUNT();                      -- rows changed by the last statement","s":"","t":"INSERT INTO stock (sku, qty) VALUES ('C3', 1);\nSELECT * FROM stock WHERE sku = 'C3';      -- read the row back, as MySQL has no RETURNING","rc":false}]},{"id":"ddl","title":"CREATE TABLE and data types","items":[{"l":"CREATE TABLE with the common constraints","c":"CREATE TABLE employees (\n  id         INT AUTO_INCREMENT PRIMARY KEY,\n  name       VARCHAR(50)  NOT NULL,\n  email      VARCHAR(100) UNIQUE,\n  dept_id    INT,\n  salary     DECIMAL(10,2) DEFAULT 0 CHECK (salary >= 0),\n  status     ENUM('active','left') DEFAULT 'active',\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  CONSTRAINT fk_dept FOREIGN KEY (dept_id) REFERENCES departments(id)\n      ON DELETE SET NULL ON UPDATE CASCADE\n);","s":"CREATE TABLE name (col type [constraints], ..., [PRIMARY KEY (...)], [FOREIGN KEY (col) REFERENCES t(col) [ON DELETE action]]);","t":"","rc":false},{"l":"Composite keys","c":"CREATE TABLE assignments (\n  emp_id INT, project_id INT, hours INT,\n  PRIMARY KEY (emp_id, project_id),\n  FOREIGN KEY (emp_id) REFERENCES employees(id),\n  FOREIGN KEY (project_id) REFERENCES projects(id)\n);","s":"","t":"","rc":false},{"l":"Foreign key actions","c":"ON DELETE CASCADE      -- delete the children too\nON DELETE SET NULL     -- keep children, clear the link\nON DELETE RESTRICT     -- refuse (default; same as NO ACTION in MySQL)\nON UPDATE CASCADE","s":"","t":"","rc":false},{"l":"Copy a table","c":"CREATE TABLE emp_backup AS SELECT * FROM employees;        -- data, no keys\nCREATE TABLE emp_empty LIKE employees;                      -- structure and keys, no data\nCREATE TEMPORARY TABLE t AS SELECT ...;                     -- vanishes when the session ends","s":"","t":"","rc":false},{"l":"Integer types","c":"TINYINT (1 byte)  SMALLINT  MEDIUMINT  INT (4 bytes)  BIGINT (8 bytes)    -- add UNSIGNED for no negatives\nBOOLEAN is TINYINT(1): TRUE = 1, FALSE = 0","s":"","t":"","rc":false},{"l":"Decimal and float","c":"DECIMAL(10,2)   -- exact: 10 digits, 2 after the point. Use for money.\nFLOAT  DOUBLE   -- approximate","s":"","t":"","rc":false},{"l":"Text types","c":"CHAR(10) fixed   VARCHAR(255) variable   TEXT (up to 64 KB)   MEDIUMTEXT   LONGTEXT\nENUM('a','b')   SET('x','y','z')    JSON    BLOB (binary)","s":"","t":"","rc":false},{"l":"Date types","c":"DATE   DATETIME   TIMESTAMP   TIME   YEAR","s":"","t":"","rc":false},{"l":"Auto numbering","c":"id INT AUTO_INCREMENT PRIMARY KEY          -- MySQL\n-- PostgreSQL: id SERIAL or id INT GENERATED ALWAYS AS IDENTITY     SQL Server: id INT IDENTITY(1,1)\nALTER TABLE t AUTO_INCREMENT = 1000;","s":"","t":"","rc":false},{"l":"Generated column","c":"area DECIMAL(10,2) GENERATED ALWAYS AS (w * h) STORED","s":"","t":"","rc":false}]},{"id":"alter","title":"ALTER, DROP, RENAME","items":[{"l":"Columns","c":"ALTER TABLE employees ADD COLUMN phone VARCHAR(15) AFTER name;\nALTER TABLE employees DROP COLUMN phone;\nALTER TABLE employees MODIFY COLUMN name VARCHAR(100) NOT NULL;     -- change the type\nALTER TABLE employees CHANGE COLUMN name full_name VARCHAR(100);     -- rename and retype\nALTER TABLE employees RENAME COLUMN city TO town;                    -- MySQL 8\nALTER TABLE employees ALTER COLUMN salary SET DEFAULT 0;","s":"","t":"","rc":false},{"l":"Constraints","c":"ALTER TABLE employees ADD PRIMARY KEY (id);\nALTER TABLE employees DROP PRIMARY KEY;\nALTER TABLE employees ADD CONSTRAINT uq_email UNIQUE (email);\nALTER TABLE employees ADD CONSTRAINT fk_dept FOREIGN KEY (dept_id) REFERENCES departments(id);\nALTER TABLE employees DROP FOREIGN KEY fk_dept;\nALTER TABLE employees DROP INDEX uq_email;\nALTER TABLE employees ADD CONSTRAINT ck_sal CHECK (salary >= 0);","s":"","t":"","rc":false},{"l":"Tables","c":"RENAME TABLE old_name TO new_name;      ALTER TABLE old_name RENAME TO new_name;\nDROP TABLE IF EXISTS t;       TRUNCATE TABLE t;","s":"","t":"","rc":false},{"l":"Databases","c":"CREATE DATABASE shop;   USE shop;   DROP DATABASE shop;   SHOW DATABASES;","s":"","t":"","rc":false}]},{"id":"index","title":"Indexes, views, EXPLAIN","items":[{"l":"Index","c":"CREATE INDEX idx_city ON employees (city);\nCREATE UNIQUE INDEX uq_email ON employees (email);\nCREATE INDEX idx_dept_sal ON employees (dept_id, salary);     -- composite: leftmost column first\nDROP INDEX idx_city ON employees;\nSHOW INDEX FROM employees;","s":"CREATE [UNIQUE] INDEX name ON table (col1 [, col2]);","t":"","rc":false},{"l":"When an index is NOT used","c":"A function on the column (WHERE YEAR(d) = 2025), a leading wildcard (LIKE '%abc'), a type mismatch, OR across different columns, or a composite index used without its leftmost column.","s":"","t":"","rc":false},{"l":"View","c":"CREATE VIEW dept_pay AS SELECT dept_id, AVG(salary) AS avg_sal FROM employees GROUP BY dept_id;\nCREATE OR REPLACE VIEW dept_pay AS ...;     DROP VIEW dept_pay;\nSELECT * FROM dept_pay;","s":"CREATE VIEW name AS SELECT ...;","t":"","rc":false},{"l":"See the plan","c":"EXPLAIN SELECT * FROM employees WHERE city = 'Pune';\nEXPLAIN ANALYZE SELECT ...;           -- MySQL 8: runs it and times it\n-- read: type (ALL = full scan, ref/range/const = index), key (index used), rows, Extra","s":"","t":"","rc":false}]},{"id":"txn","title":"Transactions and locking","items":[{"l":"Basic","c":"START TRANSACTION;        -- or BEGIN;\n  UPDATE accounts SET bal = bal - 500 WHERE id = 1;\n  UPDATE accounts SET bal = bal + 500 WHERE id = 2;\nCOMMIT;                    -- make it permanent\n-- ROLLBACK;               -- undo everything since START","s":"START TRANSACTION; statements; COMMIT | ROLLBACK;","t":"","rc":false},{"l":"Savepoint","c":"SAVEPOINT sp1;\n  ...\nROLLBACK TO SAVEPOINT sp1;\nRELEASE SAVEPOINT sp1;","s":"","t":"","rc":false},{"l":"Autocommit","c":"SET autocommit = 0;      -- MySQL commits every statement by default (autocommit = 1)","s":"","t":"","rc":false},{"l":"Isolation levels (weakest to strongest)","c":"SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;   -- dirty reads possible\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED;     -- no dirty reads\nSET TRANSACTION ISOLATION LEVEL REPEATABLE READ;    -- MySQL default; no non-repeatable reads\nSET TRANSACTION ISOLATION LEVEL SERIALIZABLE;       -- no phantoms","s":"","t":"","rc":false},{"l":"Row locks","c":"SELECT * FROM accounts WHERE id = 1 FOR UPDATE;          -- exclusive lock on the rows read\nSELECT * FROM accounts WHERE id = 1 FOR SHARE;           -- shared lock\nSELECT ... FOR UPDATE SKIP LOCKED;                         -- take only unlocked rows (queues)\nLOCK TABLES t WRITE;  UNLOCK TABLES;","s":"","t":"","rc":false},{"l":"ACID","c":"Atomicity (all or nothing)  Consistency (rules hold)  Isolation (transactions do not see each other half done)  Durability (committed data survives a crash)","s":"","t":"","rc":false},{"l":"Problems and which level stops them","c":"Dirty read: RU allows.  Non-repeatable read: RC allows.  Phantom read: RR (standard) allows, MySQL InnoDB mostly stops it.  Serializable stops all.","s":"","t":"","rc":false}]},{"id":"prog","title":"Procedures, functions, triggers, cursors","items":[{"l":"Stored procedure","c":"DELIMITER $$\nCREATE PROCEDURE raise_salary (IN p_dept INT, IN p_pct DECIMAL(5,2), OUT p_rows INT)\nBEGIN\n  UPDATE employees SET salary = salary * (1 + p_pct / 100) WHERE dept_id = p_dept;\n  SET p_rows = ROW_COUNT();\nEND$$\nDELIMITER ;\nCALL raise_salary(3, 10, @n);   SELECT @n;","s":"CREATE PROCEDURE name ([IN|OUT|INOUT] param type, ...) BEGIN ... END;     CALL name(args);","t":"","rc":false},{"l":"Stored function","c":"DELIMITER $$\nCREATE FUNCTION annual (m DECIMAL(10,2)) RETURNS DECIMAL(12,2) DETERMINISTIC\nBEGIN\n  RETURN m * 12;\nEND$$\nDELIMITER ;\nSELECT name, annual(salary) FROM employees;","s":"","t":"","rc":false},{"l":"Variables and control flow","c":"DECLARE total INT DEFAULT 0;    SET total = total + 1;    SET @session_var = 5;\nIF x > 0 THEN ... ELSEIF x = 0 THEN ... ELSE ... END IF;\nCASE WHEN ... THEN ... END CASE;\nWHILE i < 10 DO ... SET i = i + 1; END WHILE;       LOOP ... LEAVE label; END LOOP;","s":"","t":"","rc":false},{"l":"Trigger (BEFORE/AFTER, INSERT/UPDATE/DELETE, row level)","c":"DELIMITER $$\nCREATE TRIGGER trg_salary_audit AFTER UPDATE ON employees\nFOR EACH ROW\nBEGIN\n  IF OLD.salary <> NEW.salary THEN\n    INSERT INTO salary_audit (emp_id, old_salary, new_salary) VALUES (OLD.id, OLD.salary, NEW.salary);\n  END IF;\nEND$$\nDELIMITER ;\nDROP TRIGGER trg_salary_audit;   SHOW TRIGGERS;","s":"CREATE TRIGGER name {BEFORE|AFTER} {INSERT|UPDATE|DELETE} ON table FOR EACH ROW BEGIN ... END;","t":"","rc":false},{"l":"Stop a bad insert with a trigger","c":"CREATE TRIGGER trg_floor BEFORE INSERT ON employees FOR EACH ROW\nBEGIN\n  IF NEW.salary < 20000 THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'salary below minimum'; END IF;\nEND;","s":"","t":"","rc":false},{"l":"OLD and NEW","c":"INSERT: NEW only.   UPDATE: OLD and NEW.   DELETE: OLD only.   BEFORE triggers may change NEW values.","s":"","t":"","rc":false},{"l":"Cursor","c":"DECLARE done INT DEFAULT 0;  DECLARE v_name VARCHAR(50);\nDECLARE cur CURSOR FOR SELECT name FROM employees;\nDECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;\nOPEN cur;\nloop1: LOOP\n  FETCH cur INTO v_name;\n  IF done = 1 THEN LEAVE loop1; END IF;\n  -- use v_name\nEND LOOP;\nCLOSE cur;","s":"","t":"","rc":false},{"l":"Prepared statement (dynamic SQL)","c":"SET @sql = CONCAT('SELECT * FROM ', 'employees', ' WHERE id = ?');\nPREPARE stmt FROM @sql;   SET @id = 3;   EXECUTE stmt USING @id;   DEALLOCATE PREPARE stmt;","s":"","t":"","rc":false},{"l":"Error handling","c":"DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN ROLLBACK; END;","s":"","t":"","rc":false},{"l":"Event (scheduled job)","c":"CREATE EVENT purge_old ON SCHEDULE EVERY 1 DAY DO DELETE FROM logs WHERE created_at < NOW() - INTERVAL 90 DAY;","s":"","t":"","rc":false}]},{"id":"dcl","title":"Users and permissions","items":[{"l":"Users","c":"CREATE USER 'analyst'@'localhost' IDENTIFIED BY 'Str0ng#pass';\nDROP USER 'analyst'@'localhost';","s":"","t":"","rc":false},{"l":"Grant and revoke","c":"GRANT SELECT, INSERT ON shop.* TO 'analyst'@'localhost';\nGRANT ALL PRIVILEGES ON shop.* TO 'admin'@'localhost' WITH GRANT OPTION;\nREVOKE INSERT ON shop.* FROM 'analyst'@'localhost';\nSHOW GRANTS FOR 'analyst'@'localhost';\nFLUSH PRIVILEGES;","s":"GRANT privilege [, privilege] ON db.table TO 'user'@'host';    REVOKE privilege ON db.table FROM 'user'@'host';","t":"","rc":false},{"l":"Roles (MySQL 8)","c":"CREATE ROLE reader;  GRANT SELECT ON shop.* TO reader;  GRANT reader TO 'analyst'@'localhost';","s":"","t":"","rc":false},{"l":"The four sub-languages","c":"DDL: CREATE ALTER DROP TRUNCATE RENAME     DML: INSERT UPDATE DELETE (and SELECT)\nDCL: GRANT REVOKE                           TCL: COMMIT ROLLBACK SAVEPOINT","s":"","t":"","rc":false}]},{"id":"meta","title":"Looking around the database","items":[{"l":"Quick look","c":"SHOW DATABASES;   USE shop;   SHOW TABLES;   DESCRIBE employees;   -- or DESC employees;\nSHOW CREATE TABLE employees;   SHOW COLUMNS FROM employees;   SHOW INDEX FROM employees;","s":"","t":"","rc":false},{"l":"information_schema","c":"SELECT table_name FROM information_schema.tables WHERE table_schema = DATABASE();\nSELECT column_name, data_type, is_nullable FROM information_schema.columns WHERE table_name = 'employees';\nSELECT constraint_name, table_name, referenced_table_name FROM information_schema.key_column_usage WHERE referenced_table_name IS NOT NULL;","s":"","t":"","rc":false},{"l":"Handy","c":"SELECT DATABASE(), USER(), VERSION();   SELECT @@sql_mode;   SELECT @@transaction_isolation;","s":"","t":"","rc":false}]},{"id":"recipes","title":"Classic interview queries","items":[{"l":"2nd highest salary","c":"SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);\nSELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;","s":"","t":"","rc":true},{"l":"Nth highest salary (N = 3)","c":"SELECT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r FROM employees) t WHERE r = 3 GROUP BY salary;","s":"","t":"","rc":true},{"l":"Highest salary in each department","c":"SELECT e.* FROM employees e JOIN (SELECT dept_id, MAX(salary) m FROM employees GROUP BY dept_id) x ON x.dept_id = e.dept_id AND x.m = e.salary;","s":"","t":"","rc":true},{"l":"Top 2 per department","c":"SELECT * FROM (SELECT *, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employees) t WHERE r <= 2;","s":"","t":"","rc":true},{"l":"Find duplicates","c":"SELECT email, COUNT(*) FROM person GROUP BY email HAVING COUNT(*) > 1;","s":"","t":"","rc":true},{"l":"Employees earning more than their manager","c":"SELECT e.name FROM employees e JOIN employees m ON m.id = e.manager_id WHERE e.salary > m.salary;","s":"","t":"","rc":true},{"l":"Departments with no employees","c":"SELECT d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL;","s":"","t":"","rc":true},{"l":"Customers who never ordered","c":"SELECT c.name FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);","s":"","t":"","rc":true},{"l":"Running total","c":"SELECT sale_date, amount, SUM(amount) OVER (ORDER BY sale_date) AS running FROM sales;","s":"","t":"","rc":true},{"l":"Month-over-month change","c":"SELECT m, total, total - LAG(total) OVER (ORDER BY m) AS change_vs_prev FROM (SELECT DATE_FORMAT(sale_date,'%Y-%m') AS m, SUM(amount) AS total FROM sales GROUP BY DATE_FORMAT(sale_date,'%Y-%m')) t;","s":"","t":"SELECT m, total, total - LAG(total) OVER (ORDER BY m) AS change_vs_prev FROM (SELECT strftime('%Y-%m', sale_date) AS m, SUM(amount) AS total FROM sales GROUP BY m) t;","rc":true},{"l":"Median salary","c":"SELECT AVG(salary) FROM (SELECT salary, ROW_NUMBER() OVER (ORDER BY salary) AS rn, COUNT(*) OVER () AS c FROM employees) t WHERE rn IN (FLOOR((c + 1) / 2), CEIL((c + 1) / 2));","s":"","t":"","rc":true},{"l":"Pivot with CASE","c":"SELECT dept_id,\n  SUM(CASE WHEN city = 'Pune'    THEN 1 ELSE 0 END) AS pune,\n  SUM(CASE WHEN city = 'Chennai' THEN 1 ELSE 0 END) AS chennai\nFROM employees GROUP BY dept_id;","s":"","t":"","rc":true},{"l":"Consecutive days (gaps and islands)","c":"WITH x AS (\n  SELECT emp_id, login_date, DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) DAY) AS grp FROM logins\n)\nSELECT emp_id, COUNT(*) AS streak, MIN(login_date) AS from_date, MAX(login_date) AS to_date FROM x GROUP BY emp_id, grp ORDER BY streak DESC;","s":"","t":"WITH x AS (\n  SELECT emp_id, login_date,\n         date(login_date, '-' || ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) || ' day') AS grp\n  FROM logins\n)\nSELECT emp_id, COUNT(*) AS streak, MIN(login_date) AS from_date, MAX(login_date) AS to_date\nFROM x GROUP BY emp_id, grp ORDER BY streak DESC;","rc":false},{"l":"Employees hired in the last 6 months","c":"SELECT name FROM employees WHERE hire_date >= CURDATE() - INTERVAL 6 MONTH;","s":"","t":"SELECT name, hire_date FROM employees WHERE hire_date >= date('now', '-6 months');   -- none: nobody was hired recently","rc":false},{"l":"Percentage of total","c":"SELECT name, salary, ROUND(salary * 100.0 / SUM(salary) OVER (), 2) AS pct FROM employees;","s":"","t":"","rc":true},{"l":"Cumulative count of rows meeting a condition","c":"SELECT SUM(salary > 50000) FROM employees;     -- MySQL: true counts as 1","s":"","t":"","rc":true},{"l":"Swap adjacent seats","c":"SELECT CASE WHEN id % 2 = 1 AND id < (SELECT MAX(id) FROM seat) THEN id + 1 WHEN id % 2 = 0 THEN id - 1 ELSE id END AS id, student FROM seat ORDER BY id;","s":"","t":"","rc":true},{"l":"Rows to a comma list","c":"SELECT dept_id, GROUP_CONCAT(name ORDER BY name SEPARATOR ',') FROM employees GROUP BY dept_id;","s":"","t":"SELECT dept_id, GROUP_CONCAT(name, ',') AS people FROM employees GROUP BY dept_id;","rc":false},{"l":"Odd or even id rows","c":"SELECT * FROM employees WHERE id % 2 = 1;   SELECT * FROM employees WHERE MOD(id, 2) = 0;","s":"","t":"SELECT * FROM employees WHERE id % 2 = 1;","rc":false},{"l":"Last row / first row","c":"SELECT * FROM employees ORDER BY id DESC LIMIT 1;   SELECT * FROM employees ORDER BY id LIMIT 1;","s":"","t":"SELECT * FROM employees ORDER BY id DESC LIMIT 1;","rc":false},{"l":"Names that start and end with a vowel","c":"SELECT DISTINCT city FROM station WHERE city REGEXP '^[aeiou].*[aeiou]$';","s":"","t":"","rc":true}]},{"id":"oa","title":"OA checklist (queries right but test fails)","items":[{"l":"Before you write","c":"1. Look at the engine in the language box.  2. Read the output columns and their exact names.  3. Note the required order.","s":"","t":"","rc":false},{"l":"Output must match","c":"Use AS to name every column exactly as the problem shows.  Add ORDER BY even if the problem does not say.  Round exactly as asked: ROUND(x, 2).","s":"","t":"","rc":false},{"l":"Division","c":"Make one side decimal: x * 1.0 / y or x / y.  MySQL already returns decimals; PostgreSQL and SQL Server truncate integers.","s":"","t":"","rc":false},{"l":"NULL traps","c":"= NULL never matches: use IS NULL.  COUNT(col) skips NULLs.  NOT IN with a NULL in the list returns nothing: use NOT EXISTS.  SUM of no rows is NULL: COALESCE(SUM(x), 0).","s":"","t":"","rc":false},{"l":"Strings and case","c":"Use CONCAT, never ||.  LIKE is case-insensitive in MySQL.  CHAR_LENGTH counts characters.","s":"","t":"","rc":false},{"l":"Dates","c":"Compare with ranges (>= start AND < next_start) rather than wrapping the column in YEAR().  DATEDIFF gives days.","s":"","t":"","rc":false},{"l":"Ties","c":"Top N with ties: DENSE_RANK or RANK.  Exactly N rows: ROW_NUMBER or LIMIT.","s":"","t":"","rc":false},{"l":"Semicolons and quotes","c":"Single quotes for strings, backticks for names that clash with keywords (`order`, `rank`, `change`, `group`).  Double quotes are strings in default MySQL.","s":"","t":"","rc":false},{"l":"Reserved words used as names","c":"order, group, rank, key, index, desc, change, date (fine but risky), value, row.  Alias them or use backticks.","s":"","t":"","rc":false}]},{"id":"diff","title":"MySQL vs PostgreSQL vs SQL Server (when you must switch)","items":[{"l":"First N rows","c":"MySQL / PostgreSQL / SQLite:  LIMIT n          SQL Server:  SELECT TOP n          Standard:  FETCH FIRST n ROWS ONLY","s":"","t":"","rc":false},{"l":"Join strings","c":"MySQL: CONCAT(a, b)       PostgreSQL: a || b  (or CONCAT)       SQL Server: a + b  (or CONCAT)","s":"","t":"","rc":false},{"l":"NULL default","c":"MySQL: IFNULL(x, 0)       PostgreSQL / standard: COALESCE(x, 0)       SQL Server: ISNULL(x, 0)","s":"","t":"","rc":false},{"l":"Today","c":"MySQL: CURDATE() NOW()       PostgreSQL: CURRENT_DATE NOW()       SQL Server: GETDATE()","s":"","t":"","rc":false},{"l":"Year of a date","c":"MySQL: YEAR(d)       PostgreSQL: EXTRACT(YEAR FROM d)       SQL Server: YEAR(d)","s":"","t":"","rc":false},{"l":"Add days","c":"MySQL: DATE_ADD(d, INTERVAL 7 DAY)       PostgreSQL: d + INTERVAL '7 days'       SQL Server: DATEADD(day, 7, d)","s":"","t":"","rc":false},{"l":"Days between","c":"MySQL: DATEDIFF(a, b)       PostgreSQL: a - b       SQL Server: DATEDIFF(day, b, a)","s":"","t":"","rc":false},{"l":"String length","c":"MySQL: CHAR_LENGTH(s)       PostgreSQL: LENGTH(s)       SQL Server: LEN(s)","s":"","t":"","rc":false},{"l":"Auto id","c":"MySQL: AUTO_INCREMENT       PostgreSQL: SERIAL or IDENTITY       SQL Server: IDENTITY(1,1)","s":"","t":"","rc":false},{"l":"Get the new id","c":"MySQL: LAST_INSERT_ID()       PostgreSQL: INSERT ... RETURNING id       SQL Server: SCOPE_IDENTITY() or OUTPUT","s":"","t":"","rc":false},{"l":"Join strings of a group","c":"MySQL: GROUP_CONCAT(x SEPARATOR ',')       PostgreSQL / SQL Server 2017+: STRING_AGG(x, ',')","s":"","t":"","rc":false},{"l":"Upsert","c":"MySQL: ON DUPLICATE KEY UPDATE       PostgreSQL: ON CONFLICT (k) DO UPDATE       SQL Server: MERGE","s":"","t":"","rc":false},{"l":"Full outer join","c":"MySQL: not supported (UNION a LEFT and a RIGHT)       PostgreSQL / SQL Server: FULL OUTER JOIN","s":"","t":"","rc":false},{"l":"Case-insensitive match","c":"MySQL: LIKE is already case-insensitive       PostgreSQL: ILIKE       SQL Server: depends on the collation","s":"","t":"","rc":false},{"l":"Quoting names","c":"MySQL: `name`       PostgreSQL: \"name\"       SQL Server: [name] or \"name\"","s":"","t":"","rc":false},{"l":"Boolean","c":"MySQL: TINYINT(1), TRUE=1       PostgreSQL: real BOOLEAN       SQL Server: BIT","s":"","t":"","rc":false},{"l":"Window functions","c":"MySQL 8.0+, PostgreSQL, SQL Server 2012+ all support them. MySQL 5.7 does not.","s":"","t":"","rc":false}]}],"cheatSql":"\nCREATE TABLE person (id INTEGER PRIMARY KEY, email TEXT);\nINSERT INTO person VALUES (1,'a@x.com'),(2,'b@x.com'),(3,'a@x.com'),(4,'c@x.com'),(5,'b@x.com');\nCREATE TABLE seat (id INTEGER PRIMARY KEY, student TEXT);\nINSERT INTO seat VALUES (1,'Asha'),(2,'Bharat'),(3,'Chitra'),(4,'Deepak'),(5,'Esha');\nCREATE TABLE accounts (id INTEGER PRIMARY KEY, holder TEXT, bal INTEGER);\nINSERT INTO accounts VALUES (1,'Asha',5000),(2,'Rohan',3000);\nCREATE TABLE stock (sku TEXT PRIMARY KEY, qty INTEGER);\nINSERT INTO stock VALUES ('A1',5),('B2',0);\nCREATE TABLE yearly (yr INTEGER, hires INTEGER);\nINSERT INTO yearly VALUES (2022,3),(2023,5),(2024,4),(2025,7);\nCREATE TABLE station (id INTEGER PRIMARY KEY, city TEXT);\nINSERT INTO station VALUES (1,'Amritsar'),(2,'Indore'),(3,'Aligarh'),(4,'Pune'),(5,'Orai'),(6,'Delhi');\nCREATE TABLE sales (id INTEGER PRIMARY KEY, sale_date TEXT, region TEXT, amount INTEGER);\nINSERT INTO sales VALUES (1,'2025-01-05','North',1200),(2,'2025-01-20','South',800),(3,'2025-02-03','North',1500),\n (4,'2025-02-18','South',950),(5,'2025-03-02','North',700),(6,'2025-03-25','South',1800),(7,'2025-04-09','North',2100);\n","write":{"tasks":[{"id":"c01","kind":"query","db":"co","tier":1,"tag":"filter","title":"Recent hires","task":"List the name and hire_date of every employee hired on or after 2022-01-01, earliest hire first.","want":"two columns: name, hire_date","ref":"SELECT name, hire_date FROM employees WHERE hire_date >= '2022-01-01' ORDER BY hire_date;","ordered":true,"hint":"Dates stored as YYYY-MM-DD text compare correctly as strings.","mins":4,"verify":null},{"id":"c02","kind":"query","db":"co","tier":1,"tag":"filter","title":"Names starting with a vowel","task":"Return the names of employees whose name starts with a vowel (A, E, I, O or U), alphabetically.","want":"one column: name","ref":"SELECT name FROM employees WHERE SUBSTR(name,1,1) IN ('A','E','I','O','U') ORDER BY name;","ordered":true,"hint":"SUBSTR(name,1,1) takes the first letter; LIKE 'A%' OR ... also works.","mins":4,"verify":null},{"id":"c03","kind":"query","db":"co","tier":1,"tag":"filter","title":"Salary band outside Pune","task":"Employees earning between 90000 and 120000 (inclusive) who do not work in Pune. Show name, salary, city, highest salary first, then name.","want":"three columns: name, salary, city","ref":"SELECT name, salary, city FROM employees WHERE salary BETWEEN 90000 AND 120000 AND city <> 'Pune' ORDER BY salary DESC, name;","ordered":true,"hint":"BETWEEN includes both ends. Remember a tiebreaker in ORDER BY.","mins":4,"verify":null},{"id":"c04","kind":"query","db":"co","tier":1,"tag":"filter","title":"Rich departments","task":"Names of departments whose budget is more than 500000, largest budget first.","want":"one column: name","ref":"SELECT name FROM departments WHERE budget > 500000 ORDER BY budget DESC;","ordered":true,"hint":"","mins":4,"verify":null},{"id":"c05","kind":"query","db":"co","tier":1,"tag":"aggregate","title":"Headcount per city","task":"How many employees work in each city? Show city and count, most staff first, ties alphabetical by city.","want":"two columns: city, count","ref":"SELECT city, COUNT(*) FROM employees GROUP BY city ORDER BY COUNT(*) DESC, city;","ordered":true,"hint":"","mins":4,"verify":null},{"id":"c06","kind":"query","db":"co","tier":1,"tag":"join","title":"Departments with projects","task":"List the distinct names of departments that own at least one project.","want":"one column: name","ref":"SELECT DISTINCT d.name FROM departments d JOIN projects p ON p.dept_id = d.id;","ordered":false,"hint":"DISTINCT removes the repeats caused by one department having several projects.","mins":4,"verify":null},{"id":"c07","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Hours per employee","task":"Total hours each employee has logged across all assignments. Show the employee name and total hours, highest total first.","want":"two columns: name, total hours (8 rows)","ref":"SELECT e.name, SUM(a.hours) FROM employees e JOIN assignments a ON a.emp_id = e.id GROUP BY e.id, e.name ORDER BY SUM(a.hours) DESC;","ordered":true,"hint":"","mins":8,"verify":null},{"id":"c08","kind":"query","db":"co","tier":2,"tag":"join","title":"Project staffing","task":"For every project show its name, the number of employees assigned and the total hours. Order by total hours descending.","want":"three columns: project, headcount, total hours","ref":"SELECT p.name, COUNT(a.emp_id), SUM(a.hours) FROM projects p JOIN assignments a ON a.project_id = p.id GROUP BY p.id, p.name ORDER BY SUM(a.hours) DESC;","ordered":true,"hint":"","mins":8,"verify":null},{"id":"c09","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Multi-project employees","task":"Names of employees assigned to more than one project, with the number of projects.","want":"two columns: name, projects","ref":"SELECT e.name, COUNT(*) FROM employees e JOIN assignments a ON a.emp_id = e.id GROUP BY e.id, e.name HAVING COUNT(*) > 1;","ordered":false,"hint":"","mins":8,"verify":null},{"id":"c10","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Well-paid departments","task":"Departments whose average salary exceeds 95000. Show the department name and the average rounded to a whole number.","want":"two columns: name, avg salary","ref":"SELECT d.name, ROUND(AVG(e.salary)) FROM departments d JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name HAVING AVG(e.salary) > 95000;","ordered":false,"hint":"","mins":8,"verify":null},{"id":"c11","kind":"query","db":"co","tier":2,"tag":"subquery","title":"Above department average","task":"Employees who earn more than the average salary of their own department. Show name and salary.","want":"two columns: name, salary","ref":"SELECT e.name, e.salary FROM employees e WHERE e.salary > (SELECT AVG(x.salary) FROM employees x WHERE x.dept_id = e.dept_id);","ordered":false,"hint":"Correlated subquery (or a window AVG). Farhan has no department, so he never qualifies.","mins":8,"verify":null},{"id":"c12","kind":"query","db":"co","tier":2,"tag":"join","title":"Managers with two or more reports","task":"List each manager who has at least 2 direct reports: the manager's name and the number of direct reports.","want":"two columns: manager, reports","ref":"SELECT m.name, COUNT(*) FROM employees e JOIN employees m ON m.id = e.manager_id GROUP BY m.id, m.name HAVING COUNT(*) >= 2;","ordered":false,"hint":"","mins":8,"verify":null},{"id":"c13","kind":"query","db":"co","tier":2,"tag":"anti-join","title":"Never logged in","task":"Names of employees who have no row in the logins table.","want":"one column: name","ref":"SELECT name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM logins l WHERE l.emp_id = e.id);","ordered":false,"hint":"NOT EXISTS (or LEFT JOIN ... IS NULL).","mins":8,"verify":null},{"id":"c14","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Three days in a row","task":"Employees who logged in on every one of the three days 2026-08-01, 2026-08-02 and 2026-08-03. Show their names.","want":"one column: name","ref":"SELECT e.name FROM employees e JOIN logins l ON l.emp_id = e.id WHERE l.login_date IN ('2026-08-01','2026-08-02','2026-08-03') GROUP BY e.id, e.name HAVING COUNT(DISTINCT l.login_date) = 3;","ordered":false,"hint":"Count distinct matching days and compare with 3.","mins":8,"verify":null},{"id":"c15","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Strictly-high-pay departments","task":"Departments where every employee earns at least 85000. Show the department name. (Departments with no employees do not count.)","want":"one column: name","ref":"SELECT d.name FROM departments d JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name HAVING MIN(e.salary) >= 85000;","ordered":false,"hint":"","mins":8,"verify":null},{"id":"c16","kind":"query","db":"co","tier":2,"tag":"aggregate","title":"Payroll leaders","task":"The department(s) with the highest total salary. Show name and total; include every department on a tie.","want":"two columns: name, total salary","ref":"SELECT d.name, SUM(e.salary) FROM departments d JOIN employees e ON e.dept_id = d.id GROUP BY d.id, d.name HAVING SUM(e.salary) = (SELECT MAX(t) FROM (SELECT SUM(salary) AS t FROM employees WHERE dept_id IS NOT NULL GROUP BY dept_id));","ordered":false,"hint":"A subquery over the grouped totals gives the maximum to compare with.","mins":8,"verify":null},{"id":"c17","kind":"query","db":"co","tier":2,"tag":"join","title":"Own-department work","task":"Employees assigned to a project that belongs to their own department. Show the employee name and the project name.","want":"two columns: name, project","ref":"SELECT e.name, p.name FROM employees e JOIN assignments a ON a.emp_id = e.id JOIN projects p ON p.id = a.project_id WHERE p.dept_id = e.dept_id;","ordered":false,"hint":"","mins":8,"verify":null},{"id":"c18","kind":"query","db":"co","tier":2,"tag":"join","title":"Manager in another city","task":"Employees whose manager works in a different city. Show employee, manager and the employee's city.","want":"three columns: e
