<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock OA</title>
<style>
:root{--bg:#070B11;--bg2:#0C121B;--panel:#121A26;--panel2:#182231;--edge:#1E2A3A;--edge2:#2A3A4E;--txt:#E8EEF6;
--dim:#8397AE;--dim2:#5B6E85;--cy:#3FD9EC;--cy-dim:#12333D;--ok:#4BE08B;--ok-dim:#0E2C1D;--no:#FF7A6B;--no-dim:#331612;
--am:#FFC44D;--am-dim:#332714;--vi:#B98CF0;--vi-dim:#241A38;
--mono:ui-monospace,Menlo,Consolas,monospace;--sans:"Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font-family:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;background:var(--panel);border:1px solid var(--edge);border-radius:10px}
.logo{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.sp{flex:1 1 auto}.stat{font-family:var(--mono);font-size:12px;color:var(--dim)}.stat b{color:var(--ok);font-size:15px}
.btn{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--panel2);
 border:1px solid var(--edge2);border-radius:7px;padding:9px 14px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--cy)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--cy);border-color:var(--cy);color:#04222A}.btn.ghost{background:transparent}
.hero,.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}
.hero h1{margin:0 0 6px;font-family:var(--mono);font-size:clamp(22px,4.5vw,30px)}.hero h1 em{font-style:normal;color:var(--cy)}
.hero p,.lead{color:var(--dim);margin:6px 0}.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:12px 0 7px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--edge2);border-radius:7px;padding:8px 12px;cursor:pointer}
.chip:hover{border-color:var(--cy)}.chip.on{background:var(--cy);border-color:var(--cy);color:#04222A;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead h2{margin:0;font-size:20px}.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--edge2);border-radius:5px;padding:3px 7px;color:var(--dim)}
.clock{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--am)}.clock.crit{color:var(--no)}
.wrap.wide{max-width:1500px}
.split{display:grid;grid-template-columns:minmax(0,6fr) minmax(380px,5fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.split .col{max-height:calc(100vh - 150px);overflow-y:auto;padding-right:4px}
.split .side textarea{min-height:220px}
@media(max-width:1000px){.split{grid-template-columns:1fr}.split .col{max-height:none;overflow:visible}.split .story-col{order:-1}}
.story{font-size:15.5px;line-height:1.7;max-width:74ch}.story>p{margin:0 0 16px}
.sec{margin:20px 0 0;padding:12px 14px;background:var(--bg2);border:1px solid var(--edge);border-left:3px solid var(--cy);border-radius:8px}
.sec p{margin:0;font-size:14.5px;color:var(--txt)}.sec.constraints{border-left-color:var(--am)}.sec.output{border-left-color:var(--ok)}
.sec.task{border-left-color:var(--vi)}.sec.sample{border-left-color:var(--dim2)}
.sec pre{margin:0 0 10px;padding:8px 10px;background:var(--bg);border:1px solid var(--edge);border-radius:6px;font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.sech{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
mark.clue{background:var(--ok-dim);color:var(--ok);border-bottom:2px solid var(--ok);border-radius:3px;padding:0 2px}
mark.decoy{background:transparent;color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--no)}
.gp{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);margin:12px 0 6px}
.pbtn,.vbtn{font-size:13px;background:var(--bg2);border:1px solid var(--edge);border-radius:8px;padding:8px 11px;cursor:pointer;text-align:left}
.pbtn:hover,.vbtn:hover{border-color:var(--cy)}.pbtn.open{border-color:var(--cy);background:var(--cy-dim)}
.vbtn.sel{background:var(--cy);border-color:var(--cy);color:#04222A;font-weight:600}
.vrow{background:var(--bg2);border:1px solid var(--edge);border-radius:10px;padding:10px;margin-top:8px}
textarea{width:100%;min-height:74px;background:var(--bg2);border:1px solid var(--edge2);border-radius:8px;color:var(--txt);font:inherit;padding:10px;resize:vertical}
textarea:focus{outline:none;border-color:var(--cy)}
.verd{border-radius:10px;padding:12px 14px;border:1px solid}.verd.ok{background:var(--ok-dim);border-color:var(--ok)}
.verd.part{background:var(--am-dim);border-color:var(--am)}.verd.no{background:var(--no-dim);border-color:var(--no)}
.verd b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.box{background:var(--bg2);border:1px solid var(--edge);border-left:3px solid var(--am);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
.box i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--am);margin-bottom:3px}
.gl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.gl dt{font-family:var(--mono);color:var(--cy)}.gl dd{margin:0;color:var(--dim)}
a.lnk{color:var(--cy)}.res{padding:12px 0;border-bottom:1px solid var(--edge)}.res:last-child{border:0}
.small{font-size:12.5px;color:var(--dim)}.hide{display:none}
@media(max-width:620px){.wrap{padding:12px 10px 80px}}
</style></head><body><div class="wrap" id="app"></div>
<script type="application/json" id="data">{"questions":[{"id":"sc-001","v":"tp-ends","alt":["hs-index"],"dom":"maritime","diff":"E","title":"The Gantry Manifest","story":"Port Merrow has worked cargo since the reign of the second George, and its stevedores are a proud, unhurried body of men who regard the harbourmaster's paperwork as an affliction sent to try them. The present harbourmaster, a thin and anxious man named Crispin Dallimore, inherited the post from an uncle who had held it for thirty-one years and who left behind a filing system that nobody has ever fully understood. Each morning Dallimore receives the day's lading in a manifest that lists every crate waiting on the quay together with its mass in kilograms, and by a custom older than anyone can remember the manifest is sorted from the lightest crate to the heaviest.\n\nThe quay is served by a single travelling gantry, and the gantry's spreader, which is the steel beam that grips a load, can be clamped to exactly two crates at a time. Harbour regulations, drawn up after an accident in 1911 that nobody discusses, stipulate that their combined mass must equal the spreader's rated load L, no more and no less, so that the beam is neither strained nor left slack. Before booking the berth, the harbourmaster merely wishes to ascertain whether any such couple exists in the manifest. He does not need to know which two crates they are, nor how many such couples the manifest contains, nor in what order they might be lifted; the berth is booked or it is not.\n\nThe gantry driver, a cheerful woman named Bettany, keeps a terrier that rides in the cab with her and barks at seagulls. The quay's weighbridge was condemned two years ago and has not been replaced. There is a persistent rumour that the Merrow Company intends to sell the whole wharf to a developer of flats, and the stevedores discuss it endlessly over their tea without ever reaching a conclusion.\n\nInput: the first line gives N, the number of crates, and L, the spreader's rated load. The second line gives the N masses.\n\nOutput: the single word YES if two crates can be clamped together to make exactly L, and NO otherwise.\n\nConstraints: N up to 2*10^5, masses up to 10^9, L up to 2*10^9; the manifest already arrives in non-decreasing order, and Dallimore is forbidden by the Company's auditors from copying it onto fresh paper or keeping working notes longer than a few lines.","clues":["sorted from the lightest crate to the heaviest","exactly two crates at a time","combined mass must equal the spreader's rated load L","whether any such couple exists","already arrives in non-decreasing order"],"decoys":["Before booking the berth","keeps a terrier that rides in the cab with her and barks at seagulls","The quay's weighbridge was condemned two years ago"],"core":"A list that is already in order, and one yes-or-no question: do two of its items add up to a target?","gloss":[["stevedores","dock workers who load and unload ships",true],["lading","the cargo being carried",true],["manifest","a written list of cargo",true],["gantry","a tall frame with a lifting arm",true],["stipulate","to require as a condition",true],["ascertain","to find out",true],["couple","a pair",true]],"why":{"hs-index":"A lookup table also finds a pair, but the list is handed over already sorted and only existence is asked, so no table is needed.","bs-exact":"Searching for each crate's partner repeats work that a single inward sweep avoids."},"tell":"Sorted input plus 'is there a pair that hits a target?' points to two markers closing in from the ends.","task":"Print YES if any two different crates have masses adding to exactly L, otherwise NO.","sample":{"in":"5 10\n1 3 4 6 9","out":"YES","why":"1 + 9 = 10."}},{"id":"sc-002","v":"tp-write","dom":"apothecary","diff":"E","title":"The Dispensary Shelf","story":"The dispensary of Saint Aldric's is a narrow room behind the infirmary, lit by one high window, and it has been run for forty years by an apothecary named Mother Ambrosine, who is said to have cured a bishop of the gout and who certainly cured the abbot of an ailment he has never named. Her apprentice this season is a boy called Tobias, willing enough but easily distracted, and the task that has been set him is the one every apprentice dreads: the apprentice must tidy a long shelf of N phials.\n\nThe phials stand in a single row along the shelf, in the order in which they were filled, and each carries a mark. A phial that has been emptied is marked 0, while a full one carries its dose in drams. Over a long winter of fevers the emptied phials have come to be scattered the whole length of the shelf, mixed in among the full ones, and Mother Ambrosine wants them gathered out of the way. The apothecary has forbidden the use of a second shelf, because the only other shelf in the room holds the poisons and she will not have the two confused, so everything must be rearranged where it stands: every full phial slides toward the front without disturbing the order in which the full ones were arranged, and the emptied ones gather at the far end. The order of the emptied phials among themselves is of no interest to anybody. Report the shelf as it appears afterward.\n\nTobias is under the impression that the dose marks indicate strength, and has been told twice that they do not. The infirmary cat sleeps in the empty crate by the door and objects to being moved. A travelling physician is expected on Thursday and Mother Ambrosine has strong views about him which she shares with anyone who stands still long enough.\n\nInput: the first line gives N. The second line gives the N marks along the shelf, front to back.\n\nOutput: the N marks after the tidying, front to back.\n\nConstraints: N up to 10^6; each dose up to 10^9; only a constant amount of extra room is permitted, and a phial may only be exchanged with another phial already on the shelf.","clues":["forbidden the use of a second shelf","without disturbing the order in which the full ones were arranged","only a constant amount of extra room is permitted"],"decoys":["the apprentice must tidy a long shelf","The infirmary cat sleeps in the empty crate by the door","A travelling physician is expected on Thursday"],"core":"Move the unwanted items to the back of the list, in place, keeping the order of everything else.","gloss":[["dispensary","a place where medicine is prepared and handed out",true],["phial","a small glass bottle",true],["apothecary","an old word for a pharmacist",true],["dram","a tiny unit of weight or volume",true]],"why":{"tp-partition":"Swapping items into groups scrambles the order of the ones you keep; here their order must survive.","hs-freq":"Counting the empties does not rearrange anything."},"tell":"Rewrite in place, keep the survivors' order, and no spare memory.","task":"Print the shelf after every non-zero mark has moved to the front in its original order and every 0 sits at the end.","sample":{"in":"6\n0 5 0 3 8 0","out":"5 3 8 0 0 0","why":"The non-zero marks 5, 3, 8 keep their order; the zeros go last."}},{"id":"sc-003","v":"tp-merge","dom":"monastery","diff":"M","title":"Two Scriptoria","story":"The Cistercian houses of Clairvaux and Fontenay were founded within a decade of one another and have quarrelled, politely, ever since. Each maintains one of the two scriptoria, and each scriptorium maintains a register of the catalogue numbers of the codices it holds. The registers are the pride of their respective librarians: both were begun in the same century, both are written on vellum in a hand that has not changed in two hundred years, and both are entered in strictly ascending order, a discipline the librarians regard as the first duty of a learned house.\n\nThe abbot of the mother house has lately conceived a plan. Books are costly, and a house that holds two copies of a common work while lacking a rare one is a house that has managed its library badly. He therefore wishes to know which numbers appear in BOTH registers, so that duplicate volumes can be exchanged for rarer ones with the booksellers of Troyes. He wants the shared numbers written out in ascending order on a single sheet, and he wants them soon, because the booksellers come only at Michaelmas.\n\nThere is a practical difficulty. The registers are very long, running to as many as a million entries each, and the cellarer, who guards the memory-slates on which any working list would have to be drafted, has refused to issue any extra slate beyond the registers themselves. He has refused in writing, and he has refused twice. The abbot, who dislikes a quarrel with the cellarer more than he dislikes a badly managed library, will not press the point.\n\nThe monk set to the work, Brother Fulbert, suffers from poor eyesight and reads with a lens ground for him in Paris. The refectory has served the same lentil pottage every Friday since Lent. A novice has been caught keeping a dog in the dormitory and the matter is before the chapter.\n\nInput: line one gives A and B, the lengths of the two registers. Line two gives the A numbers of Clairvaux, ascending; line three the B numbers of Fontenay, ascending.\n\nOutput: the numbers present in both, in ascending order, or the word NONE.\n\nConstraints: A and B up to 10^6; catalogue numbers up to 10^9, with no number repeated within a register. Brother Fulbert may read down each register once and may not sort, copy or rewrite either.","clues":["entered in strictly ascending order","which numbers appear in BOTH registers","refused to issue any extra slate beyond the registers themselves"],"decoys":["so that duplicate volumes can be exchanged for rarer ones","suffers from poor eyesight and reads with a lens ground for him in Paris","A novice has been caught keeping a dog in the dormitory"],"core":"Two lists that are already in order: list the values they share, without building any extra storage.","gloss":[["scriptoria","writing rooms of a monastery",true],["codices","hand-written books",true],["cellarer","the monk in charge of supplies",true],["register","an official written list",true]],"why":{"hs-seen":"A set would answer instantly but needs exactly the extra storage the cellarer refuses to give.","hp-merge":"That uses a heap for many lists; with only two, a marker on each is enough."},"tell":"Two sorted sequences, find the common items, with no spare memory.","task":"Print every number that appears in both registers, in ascending order, or NONE if there is none.","sample":{"in":"4 3\n2 5 8 11\n5 9 11","out":"5 11","why":"5 and 11 are in both lists."}},{"id":"sc-004","v":"tp-partition","alt":["hs-freq"],"dom":"railway","diff":"M","title":"The Karst Signal Gantry","story":"On the Karst branch line, which climbs from the river valley to the limestone plateau through eleven tunnels and a viaduct that frightens the nervous, the signalling is done in the old way, by lamps hung along a gantry above the running lines. There are N signal lamps in a row, and each of them shows one of three states: 0 (red), 1 (amber) or 2 (green). The lamps are hung in whatever order the lampman happened to carry them up the ladder, which is to say in no order at all, and the district inspector has decided that this will no longer do.\n\nThe inspector's order is that the lamps be regrouped so that, read from the first lamp to the last, all the reds come first, then all the ambers, then all the greens. The work must be done with the signalman's rotating crank, a device that can swap any two lamps on the gantry. The crank is mounted on a carriage that runs along the gantry, and here is the difficulty: it can be wound along the gantry exactly once, from the first lamp to the last, because winding it backwards strips the pinion, and the Company has not replaced a pinion since the war. There is no room on the gantry for a staging rack, so the lamps cannot be taken down and stood somewhere while the work proceeds. Report the final arrangement.\n\nThe signalman on duty, a laconic man named Vrba, has worked the branch for twenty-two years and can tell which train is coming by the sound it makes in the second tunnel. The branch is famous among enthusiasts for a water tower in the shape of a mushroom. A goat belonging to the stationmaster at Horni Lhota has twice been found standing on the platform canopy, and no one can explain it.\n\nInput: line one gives N. Line two gives the N lamp states in order along the gantry.\n\nOutput: the N states after the regrouping.\n\nConstraints: N up to 10^6; every state is 0, 1 or 2. The inspector has expressly forbidden the obvious dodge of counting how many lamps of each colour there are and then rewriting the gantry from the counts, since he wants the actual lamps moved.","clues":["one of three states","exactly once, from the first lamp to the last","no room on the gantry for a staging rack"],"decoys":["On the Karst branch line","famous among enthusiasts for a water tower in the shape of a mushroom","A goat belonging to the stationmaster at Horni Lhota"],"core":"Arrange items of only three kinds into groups in a single pass, with no extra space.","gloss":[["gantry","a frame over a railway track that carries signals",true],["pinion","a small gear wheel",true],["amber","yellow-orange",true],["signalman","a railway worker who operates signals",true],["laconic","using very few words",true]],"why":{"tp-write":"Compacting handles two groups (keep or drop); three groups need two boundaries moving at once.","hs-freq":"Counting and rewriting is correct but is a second pass; the statement allows only one."},"tell":"Exactly three kinds, one pass, in place.","task":"Print the lamp states rearranged so all 0s come first, then all 1s, then all 2s.","sample":{"in":"7\n2 0 1 2 1 0 0","out":"0 0 0 1 1 2 2","why":"Three 0s, two 1s, two 2s, in that order."}},{"id":"sc-005","v":"sw-fixed","alt":["ps-range"],"dom":"astronomy","diff":"E","title":"The Visiting Astronomer","story":"The Halden Observatory stands on a basalt shoulder above the treeline, four hours by road from the nearest town, and it has been photographing the night sky since 1897. Its director, a formidable woman named Dr Ottilie Brandt, has spent her career defending the place from committees who would rather spend the money on a radio dish. The observatory logs, for each of N consecutive nights, the number of meteors its plates captured, one figure per night, written into a ledger in the order the nights occurred.\n\nAn endowment allows the observatory to host one visiting astronomer each year, and the terms of the endowment, written by a benefactor with a tidy mind and no imagination, are precise: the visitor is permitted a residency of exactly K successive nights. The visitor this year, a young man from Uppsala with a great many opinions, will naturally choose the stretch that yields the greatest total number of captured meteors, since his paper depends upon it. The residency can neither be shortened nor split, and he may begin on any night he pleases so long as K nights remain. The director wonders, before he arrives and begins arguing, what that greatest total could be.\n\nThe observatory's dome has a squeak that appears only in cold weather and that three engineers have failed to locate. The cook makes a cloudberry preserve that visitors write home about. There is a long-running dispute with a neighbouring farmer about a track across his land, and a gate that is sometimes locked and sometimes not.\n\nInput: line one gives N and K. Line two gives the N meteor counts in order of night.\n\nOutput: the greatest total number of meteors over any K consecutive nights.\n\nConstraints: K at most N, N up to 2*10^5, each count up to 10^4. The director's calculating machine is elderly and she would rather not re-add K numbers afresh for every possible starting night, since the same figures would be added over and over.","clues":["exactly K successive nights","the greatest total number of captured meteors","can neither be shortened nor split"],"decoys":["The observatory logs","The cook makes a cloudberry preserve that visitors write home about","a long-running dispute with a neighbouring farmer about a track across his land"],"core":"The biggest total over any run of exactly K neighbouring numbers.","gloss":[["residency","a fixed period of stay",true],["successive","following one right after another",true],["plates","glass photographic sheets used in old telescopes",true],["endowment","money given to support an institution",true]],"why":{"sw-longest":"Nothing asks for the longest or shortest stretch; the length is fixed in advance.","ps-range":"A prefix table also gives every K-total and is a fair alternative; the moving version needs no table."},"tell":"A run of exactly K neighbours, with a total over each.","task":"Print the largest total of any K consecutive nights.","sample":{"in":"6 3\n4 1 7 2 9 3","out":"18","why":"The best three nights are 7 + 2 + 9 = 18."}},{"id":"sc-006","v":"sw-longest","dom":"heraldry","diff":"M","title":"The Eastgate Herald","story":"The Eastgate of the free city of Vehlbruck is the only gate through which an armed company may pass, and by an ordinance of the Diet every pennant carried beneath its arch must be recorded. The work falls to the herald, an elderly gentleman named Ser Albrecht Konigsmann, who stands in a wooden booth in all weathers with a slate and a stick of chalk. As each pennant passes he chalks the sigil of every pennant passing beneath the arch, one glyph per pennant, in strict order of passage. He has held the post for thirty-four years and is said never once to have left his booth before the gate was shut.\n\nThe registrar of heraldry, a younger and more ambitious official, has been asked by the Diet to prepare a report on the movement of companies through the city, and he has fixed on a particular measurement. He wishes to learn the length of the longest unbroken procession in which no sigil recurs, since such a procession needs no cross-checking of the tally. A procession, for his purposes, is a run of pennants that passed one after another with none left out in the middle; he is not interested in which pennants it was made of, nor when it passed, only in how many pennants it contained.\n\nThe herald is elderly and works slowly, but he has never once skipped a pennant. His chalk is supplied by the city at a cost that appears in the accounts each year and that the Treasurer has twice queried. The booth has a leaking roof. A pedlar sells hot chestnuts by the gate in winter and has an understanding with the gatekeeper that nobody writes down.\n\nInput: line one gives N, the number of glyphs in the chalk-log. Line two gives the N glyphs as a string of characters, in order of passage.\n\nOutput: the length of the longest run of consecutive glyphs in which no glyph appears twice.\n\nConstraints: N up to 10^6; glyphs are printable characters from an alphabet of at most 256 marks. The registrar's clerk will not accept a method that examines every possible run separately.","clues":["in strict order of passage","the longest unbroken procession in which no sigil recurs"],"decoys":["since such a procession needs no cross-checking of the tally","The booth has a leaking roof","A pedlar sells hot chestnuts by the gate in winter"],"core":"The longest stretch of a sequence in which nothing repeats.","gloss":[["sigil","a symbol or emblem",true],["pennant","a small pointed flag",true],["heraldry","the study of coats of arms and emblems",true],["ordinance","a local law",true],["recurs","happens again",false],["unbroken","continuous, with no gap",false]],"why":{"hs-seen":"A set only says whether something was seen before; it cannot tell you where the valid stretch begins.","sw-exact":"That counts stretches with exactly K of something; here you want the single longest one."},"tell":"The longest unbroken stretch obeying a rule that a repeat would break.","task":"Print the length of the longest run of consecutive glyphs containing no glyph twice.","sample":{"in":"7\npqrpqsq","out":"4","why":"The run r, p, q, s has no repeat and is 4 long; nothing longer works."}},{"id":"sc-007","v":"sw-shortest","dom":"irrigation","diff":"M","title":"The Drought Petition","story":"The Lower Fen Canal Authority administers a system of waterways cut across the peat in the eighteenth century by a company that went bankrupt twice before finishing. The Authority has strung N sluice basins in a row along the main cut, each basin fed from the one above it, and the engineer's book records what each can give: basin i can release a[i] kilolitres each day. The basins are numbered from the head of the cut to its mouth, and that numbering has not changed since 1802, which is why basin seventeen lies between basins four and five on the ground, a fact that causes trouble every summer.\n\nThis has been the driest spring in living memory. A drought-stricken farmer whose land lies along the cut needs a daily draw of at least T kilolitres to keep her herd alive, and she is entitled to apply for it. But under the canal statutes she may only draw from a run of basins that adjoin one another, with no gap, because the Authority will not open a gate that has a closed gate below it. Every basin she petitions for must be surveyed by an inspector at her own expense, at eleven guineas a basin, and she has not got eleven guineas to spare. She therefore wishes to petition as few basins as possible. Report the least number of adjoining basins whose combined release reaches T, or 0 if even the whole canal cannot.\n\nThe Authority's offices are in a converted maltings and smell of it. The clerk who issues the petitions has a cold he has had since Candlemas. A heron has taken up residence on basin nine and is regarded by the lightermen as a bird of ill omen, though the engineer says it is simply a heron.\n\nInput: line one gives N and T. Line two gives the N daily releases in order along the cut.\n\nOutput: the smallest number of adjoining basins whose releases total at least T, or 0.\n\nConstraints: N up to 10^5, T up to 10^9, a[i] at least 1 and at most 10^4. Checking every possible run of basins separately would cost the farmer her summer.","clues":["a run of basins that adjoin one another, with no gap","as few basins as possible","at least T kilolitres","a[i] at least 1"],"decoys":["drought-stricken","petition","A heron has taken up residence on basin nine","The Authority's offices are in a converted maltings and smell of it"],"core":"The shortest stretch of neighbouring positive numbers whose total reaches a target.","gloss":[["sluice","a gate that controls the flow of water",true],["statutes","written laws",true],["petition","to formally request",true],["adjoin","to lie right next to",true],["maltings","a building where grain is prepared for brewing",true]],"why":{"sw-longest":"That wants the longest valid stretch; here shorter is better.","ps-count":"There are no negatives, so no table of earlier totals is needed."},"tell":"Neighbouring, as few as possible, 'at least', and every value positive.","task":"Print the smallest number of adjoining basins whose releases total at least T, or 0 if even all of them fall short.","sample":{"in":"6 11\n2 3 1 2 4 3","out":"5","why":"No 4 basins reach 11 (the best is 10); five basins such as 3+1+2+4+3 = 13 do."}},{"id":"sc-008","v":"sw-exact","dom":"textile","diff":"H","title":"The Guild Examiner","story":"Calder Mill has dyed cloth for six generations of the same family, and the dye-works at the bottom of the yard is the oldest part of it, a low building of blackened brick where the vats stand in two rows and the floor is permanently wet. Bolts of cloth emerge from the vats in a fixed sequence, each stamped with a shade number as it comes off the roller, and the sequence is never shuffled afterwards, because the stamping clerk writes the numbers into the day-book as they pass and the day-book is what the Guild inspects.\n\nThe guild examiner, a dry and unhurried man named Mr Pargeter, comes twice a year from Halifax. He inspects any run of consecutive bolts, meaning a stretch of the day's output with nothing left out in the middle, and he will certify a run only if it displays exactly K distinct shades, no more and no fewer, a rule that dates from a dispute about the mixing of dye-lots and that nobody has thought to revise. Two runs are different if their first or last bolt differs, even if the shades in them are the same. For the pattern-book, the examiner needs the total number of certifiable runs in the day's output.\n\nThe mill's own pattern-book is bound in green buckram and kept in a cupboard that sticks. Mr Pargeter takes his tea with three sugars, a thing the office remarks on every time. The dye-works cat has a patch of permanently blue fur from an incident with a vat of woad, and is known throughout the valley on that account.\n\nInput: line one gives N, the number of bolts, and K. Line two gives the N shade numbers in the order they came off the roller.\n\nOutput: the number of runs of consecutive bolts containing exactly K distinct shades.\n\nConstraints: N up to 10^5 bolts, 1 <= K <= N, shade numbers up to 10^9. The answer may be large enough to need a 64-bit integer. Mr Pargeter has a train to catch and will not wait while every run is examined against every other.","clues":["any run of consecutive bolts","exactly K distinct shades, no more and no fewer","the total number of certifiable runs"],"decoys":["For the pattern-book","takes his tea with three sugars","The dye-works cat has a patch of permanently blue fur"],"core":"Count every stretch that contains exactly K different values.","gloss":[["bolts","rolls of cloth",true],["guild","a trade association",true],["certify","to officially approve",true],["vats","large tubs for liquids",true],["buckram","a stiff cloth used for binding books",true]],"why":{"sw-longest":"That finds one best stretch; this counts every qualifying stretch.","ps-count":"Prefix totals count stretches with a given sum; 'K different values' is not a sum."},"tell":"A COUNT of stretches with EXACTLY K distinct items.","task":"Print how many runs of consecutive bolts contain exactly K different shades.","sample":{"in":"5 2\n1 2 1 2 3","out":"7","why":"The runs are 12, 21, 12, 23, 121, 212 and 1212: seven in all."}},{"id":"sc-009","v":"sw-deque","dom":"lighthouse","diff":"M","title":"The Skerry Light","story":"The Skerry light stands on a rock three miles off a coast that has wrecked more ships than the county has churches, and it is kept by a man named Ewan Blaikie, who came out for a six-month relief in 1978 and never went back. The light's duties include a weather log, and the log is exacting: the keeper records the swell height in the channel once every minute for N minutes, one figure per minute, in the order the minutes occur. He has done it through two hurricanes and one appendicitis.\n\nThe Board of Trinity, which has authority over the lights, has issued a new instruction. It demands, for every unbroken span of K minutes, the single highest swell seen in that span, so that mariners may be warned of surges before they reach the shipping lane. The spans overlap: the first covers minutes one to K, the next covers minutes two to K plus one, and so on to the end of the log. The keeper must produce one figure per span, from the earliest span to the latest, within a time proportional to N, because the figures go out on the shipping forecast and the forecast will not be held back for him.\n\nBlaikie's first attempt at the instruction was to look through all K minutes of each span and pick out the largest, which took him until the following afternoon and produced a letter from the Board. The rock has a colony of grey seals that bark through the night in spring. The relief boat comes fortnightly, weather permitting, and in February it often does not. There is a chess game in progress by letter with a keeper in the Hebrides that has lasted eleven months.\n\nInput: line one gives N and K. Line two gives the N swell heights in order of minute.\n\nOutput: N - K + 1 figures, the highest swell within each span, in order.\n\nConstraints: K at most N, N up to 10^6, heights up to 10^9. The work done per minute of the log must stay roughly constant, however large K becomes.","clues":["every unbroken span of K minutes","the single highest swell seen in that span","within a time proportional to N"],"decoys":["so that mariners may be warned of surges","The rock has a colony of grey seals that bark through the night","There is a chess game in progress by letter with a keeper in the Hebrides"],"core":"For every fixed-size stretch, report its maximum, within linear time.","gloss":[["swell","a long rolling wave",true],["Board of Trinity","an old authority over lighthouses",true],["mariners","sailors",true],["proportional","growing at the same rate as",true],["relief","a replacement worker, or their period of duty",true]],"why":{"sw-fixed":"A running total can add one number and drop one; a maximum cannot be updated that way.","hp-topk":"That works in N log N; the linear limit asks for something leaner."},"tell":"The maximum of EVERY fixed-size stretch, in linear time.","task":"For every span of K consecutive minutes, print the highest swell in it, in order.","sample":{"in":"8 3\n1 3 2 0 5 3 6 7","out":"3 3 5 5 6 7","why":"Spans: [1,3,2]->3, [3,2,0]->3, [2,0,5]->5, [0,5,3]->5, [5,3,6]->6, [3,6,7]->7."}},{"id":"sc-010","v":"ps-range","dom":"archive","diff":"E","title":"The Muniment Room","story":"Castle Harrow has been in the same family since the Conquest, give or take a confiscation under the Tudors, and the muniment room on its second floor holds the paper record of all of it. The room has N shelves along one wall; shelf i holds a[i] bound deeds, and nothing is ever added or removed, the family having deposited the whole archive with the county under an agreement that forbids it. The archivist, a patient man named Mr Enderby, has catalogued the shelves from the window end to the door end and considers the job the great work of his life.\n\nSince the agreement was signed, surveyors descend in great numbers. They come from the Land Registry, from two universities, from a firm of solicitors pursuing a boundary dispute that began in 1736, and from a television company. Each wishes to know, for a stretch of shelves from L to R, how many deeds lie upon them in total, because the fee they pay the county is reckoned per deed consulted and they must budget in advance. The stretches they ask about are all different, some covering two shelves and some covering nearly the whole wall, and they ask one after another, all day.\n\nWith as many as 2*10^5 surveyors and shelves, the archivist declines to count by hand each time. He has noticed, in the course of a long and irritating fortnight, that he keeps adding up the very same shelves over and over for one surveyor after another.\n\nThe muniment room is kept at a fixed humidity by a machine that hums. The castle's tea room sells a fruit cake made to a recipe attributed, on no evidence at all, to a Victorian countess. A barn owl roosts in the gatehouse and is on the county's letterhead.\n\nInput: line one gives N and Q, the number of shelves and of surveyors. Line two gives the N shelf counts. Each of the next Q lines gives L and R.\n\nOutput: for each surveyor, the total number of deeds on shelves L to R inclusive.\n\nConstraints: N and Q up to 2*10^5; each shelf holds up to 10^4 deeds. Every answer should take about the same time to produce, however wide the stretch asked about.","clues":["nothing is ever added or removed","for a stretch of shelves from L to R, how many deeds lie upon them in total","as many as 2*10^5 surveyors"],"decoys":["Castle Harrow","A barn owl roosts in the gatehouse and is on the county's letterhead","a fruit cake made to a recipe attributed, on no evidence at all, to a Victorian countess"],"core":"Many questions about the total of a range of a list that never changes.","gloss":[["muniment room","a room for keeping important documents",true],["deeds","legal documents about owning property",true],["archivist","a keeper of records",true],["confiscation","the taking of property by authority",true]],"why":{"sw-fixed":"A fixed-width window handles one repeated width; these ranges differ in length and position.","ps-diff":"That is for many updates read once; here the data is fixed and the questions are many."},"tell":"Many range totals over data that never changes.","task":"For each question, print the total of shelf counts from shelf L to shelf R inclusive.","sample":{"in":"5 3\n2 4 1 3 5\n1 3\n2 5\n4 4","out":"7\n13\n3","why":"2+4+1 = 7; 4+1+3+5 = 13; shelf 4 alone is 3."}},{"id":"sc-011","v":"ps-count","dom":"commerce","diff":"M","title":"The Counting-House Daybook","story":"The counting-house of Merchant Orsini occupies the ground floor of a tall narrow building on the Riva degli Schiavoni, and it has traded in pepper, alum and, latterly, insurance since the reign of the old duke. Its books are famously tidy. Each day the counting-house enters either a gain or a loss, never both and never nothing, so the daybook is a row of N signed figures, one for each day the house has traded, in the order the days fell.\n\nAn auditor has been appointed by the Council, following an unrelated scandal at a rival house, and he has become curious about unbroken stretches of days. His question is this: how many different stretches have a net result of exactly T? A stretch is a run of days with none omitted from the middle, and stretches are distinct when their first or last day differ, even if the figures within them happen to be the same. He does not want the stretches themselves written out, which would fill a room; he wants the count.\n\nThe auditor is aware of a trap. Because the house enters losses as well as gains, figures may be negative, and so lengthening a stretch does not necessarily push its total upward; a long stretch can have a smaller total than a short one inside it. He mentions this in his instructions because his predecessor got it wrong and the resulting report was withdrawn.\n\nOrsini's clerk keeps a tame starling in the office that can imitate the bell of the Arsenale. The house's gondolier is paid more than its bookkeeper, a fact the bookkeeper raises annually. There is a painting of the founder in the hall which the family privately agrees is a poor likeness.\n\nInput: line one gives N and T. Line two gives the N daily figures in order.\n\nOutput: the number of runs of consecutive days whose figures total exactly T.\n\nConstraints: N up to 2*10^5; each figure between -10^9 and 10^9; T between -10^14 and 10^14. The answer may need a 64-bit integer. Examining every stretch against every other is beyond the auditor's patience and his fee.","clues":["how many different stretches have a net result of exactly T","figures may be negative","unbroken stretches of days"],"decoys":["Merchant Orsini","keeps a tame starling in the office that can imitate the bell of the Arsenale","There is a painting of the founder in the hall which the family privately agrees is a poor likeness"],"core":"Count the stretches whose total equals a target, when values can be negative.","gloss":[["daybook","an old ledger of daily transactions",true],["auditor","someone who checks accounts",true],["net","what is left after subtracting losses",true],["alum","a mineral salt used in dyeing",true]],"why":{"sw-exact":"Shrinking a stretch only lowers its total when the numbers are positive; with negatives that fails.","ps-longest":"That wants the single longest such stretch, not how many there are."},"tell":"A count, a target total, and negatives allowed.","task":"Print how many runs of consecutive days have figures totalling exactly T.","sample":{"in":"5 5\n1 2 3 -1 2","out":"2","why":"The runs 2,3 and 1,2,3,-1 both total 5."}},{"id":"sc-012","v":"ps-longest","dom":"beekeeping","diff":"M","title":"The Apiarist's Scale","story":"Mrs Honoria Veale, an apiarist by trade, keeps bees on the edge of a heath in the west of the county, and she has done so for long enough that the local honey show has been renamed in her honour, a thing she affects to find embarrassing. Her hives stand on scales of her late husband's making, and she weighs the hive at dusk on each of N evenings and notes how much it gained or lost since the previous evening (a loss is a negative figure). The figures go into a notebook with a rubber band round it, one line per evening, in order.\n\nA scientist from the agricultural college has written to her about a theory of his concerning forage and colony mass, and he wants a particular measurement from her records. He hopes to find the most extended run of consecutive evenings during which the hive's net change was exactly K grams. A run is a stretch of evenings with none skipped in the middle; he does not care when it occurred, nor how many such runs there were, only which is the longest. Report the number of evenings in that longest run, or 0 if no run reaches K.\n\nMrs Veale has pointed out, in a letter the scientist has not yet answered, that because a hive can lose weight as easily as gain it, a longer stretch is not necessarily a heavier one, and that this has caught out at least one previous correspondent of hers from a university she declines to name.\n\nThe heath is grazed by Dartmoor ponies that lean on the hive stands. Her smoker is fuelled with dried lavender, which she maintains the bees prefer and which the college man says can make no difference. A badger took three frames in 2019 and the fence has been electrified ever since.\n\nInput: line one gives N and K. Line two gives the N nightly changes in order of evening.\n\nOutput: the number of evenings in the longest run of consecutive evenings whose changes total exactly K, or 0.\n\nConstraints: N up to 2*10^5; each change between -10^6 and 10^6; K between -10^9 and 10^9. Trying every start against every end will not finish before the honey show.","clues":["the most extended run of consecutive evenings","net change was exactly K grams","a loss is a negative figure"],"decoys":["weighs the hive at dusk","Her smoker is fuelled with dried lavender","The heath is grazed by Dartmoor ponies that lean on the hive stands"],"core":"The longest stretch whose total equals a target, with negative values possible.","gloss":[["apiarist","a beekeeper",true],["extended","long, covering a large span",true],["net change","the overall difference after gains and losses are combined",true],["forage","food that animals find for themselves",true]],"why":{"sw-longest":"A moving stretch needs totals that only grow; negatives break that.","ps-count":"That counts stretches; you need only the widest one."},"tell":"The longest stretch, a target total, and negatives present.","task":"Print the number of evenings in the longest run of consecutive evenings whose changes total exactly K, or 0 if none.","sample":{"in":"6 3\n2 1 -1 1 1 -2","out":"4","why":"Evenings 1 to 4: 2 + 1 - 1 + 1 = 3, and nothing longer totals 3."}},{"id":"sc-013","v":"ps-2d","dom":"vineyard","diff":"M","title":"The Brevet Vineyard","story":"Chateau Brevet lies on a south-facing slope above a river that floods about once a decade, and it has been making a wine of respectable rather than distinguished quality since the eighteen-forties. The estate is surveyed as a grid of R rows by C columns of vines, a scheme imposed by a Napoleonic surveyor and never revised, and each plot is recorded by a single digit, the number of crates it yielded at the last harvest. The register of yields hangs in the cellar office on a board, and the regisseur consults it a dozen times a day.\n\nThe estate sells chiefly to brokers, and brokers telephone constantly with requests of the form: for the rectangle whose opposite corners are (r1, c1) and (r2, c2), what was the total yield? They ask because they buy by the parcel and a parcel is always a rectangle of plots. The rectangles they ask about overlap one another freely, some covering a few vines and some covering most of the slope, and the broker on the line expects an answer while he waits, because he has four other estates to call before noon.\n\nThe yields are never revised; the harvest is over and the figures are lodged with the appellation authority, so no plot's number will change between one telephone call and the next. But there may be up to 10^5 calls in a season, and each answer must be returned almost instantly. The regisseur, who has been adding up plots by hand with a ruler laid across the board, has observed that he adds the same plots again and again, call after call.\n\nThe estate's dog is a lurcher of uncertain parentage that sleeps in the fermentation shed. A heatwave in the third week of August is still discussed. The owner's son has ideas about orange wine which the owner has described, in writing, as a fashion.\n\nInput: line one gives R, C and Q. The next R lines give C digits each, the yields. The next Q lines each give r1, c1, r2, c2.\n\nOutput: for each call, the total yield inside that rectangle, borders included.\n\nConstraints: R and C up to 1000; Q up to 10^5; each yield a single digit 0 to 9.","clues":["for the rectangle whose opposite corners are (r1, c1) and (r2, c2), what was the total yield","never revised","up to 10^5 calls"],"decoys":["Chateau Brevet","The estate's dog is a lurcher of uncertain parentage","The owner's son has ideas about orange wine"],"core":"Many questions about the total of a rectangle in a grid that never changes.","gloss":[["brokers","middlemen who arrange sales",true],["surveyed","measured and mapped",true],["yield","the amount produced",true],["plot","a small piece of land",true],["regisseur","the manager of a wine estate",true]],"why":{"ps-range":"A one-dimensional table handles a stretch of one row; a rectangle needs both directions.","dp-grid":"That finds best paths or counts of paths; these are plain totals."},"tell":"Many rectangle totals over a grid that never changes.","task":"For each call, print the total yield inside the rectangle whose corners are (r1, c1) and (r2, c2), counting rows and columns from 1.","sample":{"in":"3 4 2\n1234\n5678\n9012\n1 1 2 2\n2 2 3 4","out":"14\n24","why":"1+2+5+6 = 14; 6+7+8+0+1+2 = 24."}},{"id":"sc-014","v":"ps-diff","alt":["iv-sweep"],"dom":"textile restoration","diff":"M","title":"The Aubrey Tapestry","story":"The Aubrey tapestry is a seventeenth-century hunting scene twenty-two feet long, and it has been hanging in the long gallery of a house in Wiltshire since it was woven, which is precisely the trouble: three centuries of daylight and coal smoke have left the wool as fragile as ash. The restorers of the Aubrey tapestry have divided its border into N numbered panels, each beginning with no thread repaired, and the whole programme of work is reckoned panel by panel.\n\nMoney arrives in fits and starts, from a trust, from a county fund, and from the family itself, and each gift pays for a different stretch of the border. Throughout the season there are M commissions, and each instructs the weavers to add V stitches' worth of reinforcement to every panel from L through R, both panels included. The commissions overlap freely, since a benefactor rarely knows or cares what another has already paid for, and some of them cover almost the whole border while others cover a handful of panels.\n\nThe conservator in charge, Dr Annelise Fairbrother, is a careful woman who refuses to be hurried. She never inspects the border between commissions, holding that a tapestry handled repeatedly is a tapestry damaged repeatedly; only when the last is done will she ask how much reinforcement each panel carries, panel by panel from the first to the last, for her final report to the trust.\n\nHer predecessor's method was to work through every commission panel by panel, entering the figure against each panel in turn, and he retired early. Applying every commission panel by panel would take far too long for M and N up to 2*10^5.\n\nThe gallery is kept at eighteen degrees and the family complains of it. A conservation student has written a dissertation on the dog in the bottom left corner, which may be a later addition. The house cat is banned from the gallery and resents it visibly.\n\nInput: line one gives N and M. Each of the next M lines gives L, R and V.\n\nOutput: N numbers, the reinforcement standing against each panel at the end of the season, in panel order.\n\nConstraints: M and N up to 2*10^5; V between 1 and 10^4; 1 <= L <= R <= N.","clues":["add V stitches' worth of reinforcement to every panel from L through R","never inspects the border between commissions","only when the last is done will she ask","M and N up to 2*10^5"],"decoys":["The restorers of the Aubrey tapestry","a dissertation on the dog in the bottom left corner","The house cat is banned from the gallery and resents it visibly"],"core":"Many additions to ranges of a list, with the final values read only once at the very end.","gloss":[["tapestry","a woven wall hanging",true],["conservator","an expert who preserves old artefacts",true],["commissions","jobs given to someone to carry out",true],["reinforcement","extra strengthening",true],["benefactor","someone who gives money to a cause",true]],"why":{"ps-range":"Prefix tables answer many reads over fixed data; here the data is rewritten again and again and read once.","iv-sweep":"The same idea seen as a timeline of starts and ends; a fair alternative to the difference array."},"tell":"Many range updates, read once at the end.","task":"After all commissions, print the reinforcement standing against each panel, in panel order.","sample":{"in":"5 3\n1 3 2\n2 5 3\n4 4 -1","out":"2 5 5 2 3","why":"Panel 1: 2; panel 2: 2+3; panel 3: 2+3; panel 4: 3-1; panel 5: 3."}},{"id":"sc-015","v":"ps-suffix","dom":"statecraft","diff":"M","title":"The Council Seals","story":"The Venetian Council of Ten, which was never composed of ten men and which outlasted every republic around it, conducted its business by a system of seals so elaborate that its own clerks complained. The Council assigns each of its N sworn auditors a seal multiplier m[i], a small whole number struck into a brass token that the auditor carries on a chain and surrenders only at death.\n\nEvery report an auditor submits must be sealed before the Council will read it, and the rule of sealing is the Council's own protection against a single corrupt official: the sealing of each auditor's report requires the product of the multipliers of every OTHER auditor, never including the auditor's own. The reasoning, set down in 1457, is that no auditor can forge his own seal without the cooperation of all his colleagues, and the Council of Ten did not believe that all its auditors could agree on anything.\n\nThe work falls to the Doge's cipher-clerk, a careful and much-abused man named Zanetto Barbarigo, who must derive every report's seal. His difficulty is a mechanical one: his abacus cannot perform division, having been built in Ragusa to a design that never provided for it, and the Arsenal has twice refused his request for a new one. He must therefore reach each seal by multiplication alone.\n\nThe council meets only on feast days and its auditors are elected for life, so the roll changes rarely. Barbarigo's office has a window that will not close and a view of a wall. He is owed eleven months of salary, a matter he has raised in writing four times.\n\nInput: line one gives N. Line two gives the N multipliers.\n\nOutput: N numbers, the seal for each auditor's report, in the order the auditors appear on the roll.\n\nConstraints: N up to 10^5, 1 <= m[i] <= 100; every seal fits in a signed 64-bit integer. Division is not available at any point, so a grand total divided by each multiplier is not open to him.","clues":["the product of the multipliers of every OTHER auditor","never including the auditor's own","cannot perform division"],"decoys":["The council meets only on feast days and its auditors are elected for life","Barbarigo's office has a window that will not close and a view of a wall","He is owed eleven months of salary"],"core":"For each item, the product of all the other items, without dividing.","gloss":[["auditors","officials who check accounts",true],["multiplier","a number you multiply by",true],["abacus","an ancient counting frame",true],["cipher-clerk","someone who handles coded messages",true],["Doge","the elected ruler of Venice",true]],"why":{"ps-range":"A range total adds a contiguous block; the excluded auditor sits in the middle, so you need what lies on both sides.","hs-freq":"Counting does not produce products."},"tell":"Everything except me, and division is forbidden.","task":"For each auditor, print the product of every OTHER auditor's multiplier.","sample":{"in":"4\n1 2 3 4","out":"24 12 8 6","why":"Without the first: 2*3*4 = 24; without the second: 1*3*4 = 12; and so on."}},{"id":"sc-016","v":"bs-exact","alt":["hs-seen"],"dom":"library","diff":"E","title":"The Ostrava Ledger","story":"The Ostrava lending library was founded by a steelworkers' benevolent society in 1891 and has been run since the war on a budget that its keeper describes as theoretical. The keeper, a brisk woman named Mrs Blazena Dvorakova, holds N accession numbers on a ledger, ordered from the smallest to the largest, with none repeated, because a number is issued once when a book enters the collection and is never reissued, even when the book itself is lost, stolen or eaten by a reader's dog.\n\nSince the catalogue went onto the regional network, readers send enquiries by the thousand, each naming one accession number and asking only whether the library has ever recorded it. A reader asks because another library's catalogue has pointed them here, or because they are tracing a book mentioned in a footnote; what they want is a yes or a no, and the staff are instructed to give one without comment. The enquiries arrive in no connection with the order of the ledger, and each must be answered on its own.\n\nWith N and the count of enquiries both near 10^6, scanning the ledger from its first line for every enquiry would keep the readers waiting for years, as the one member of staff who attempted it can confirm. Mrs Dvorakova also declines to have the ledger copied into any other arrangement, since the ledger's order is the order in which the library grew and is itself a historical record.\n\nThe reading room has a stove that must be lit by hand. A retired metallurgist comes every Tuesday to read the newspapers and falls asleep in the same chair. The library's cat is called Svejk and is fed, against the rules, by three separate members of staff who are each unaware of the others.\n\nInput: line one gives N and Q. Line two gives the N accession numbers in increasing order. Each of the next Q lines gives one number enquired about.\n\nOutput: for each enquiry, YES or NO.\n\nConstraints: N and Q up to 10^6; accession numbers up to 10^18.","clues":["ordered from the smallest to the largest","whether the library has ever recorded it","N and the count of enquiries both near 10^6"],"decoys":["Ostrava lending library","A retired metallurgist comes every Tuesday to read the newspapers","The library's cat is called Svejk"],"core":"A sorted list and a huge number of yes-or-no membership questions.","gloss":[["accession number","a number given to a newly acquired item",true],["ledger","an official book of records",true],["enquiries","questions",true],["benevolent society","a club that supports its members in hardship",true]],"why":{"hs-seen":"A set also answers each query instantly and is a fair alternative; the order you are handed makes it unnecessary.","tp-ends":"Two markers look for a pair; each enquiry here is about a single value."},"tell":"A sorted list and a huge number of membership questions.","task":"For each enquiry, print YES if the number is on the ledger, otherwise NO.","sample":{"in":"6 3\n3 8 15 20 42 77\n20\n21\n3","out":"YES\nNO\nYES","why":"20 and 3 are on the ledger; 21 is not."}},{"id":"sc-017","v":"bs-bound","dom":"commerce","diff":"M","title":"The Lisbon Cut-Off","story":"Bidding at the Lisbon wool exchange is done by bell: a bidder presses a brass button at his desk, a bell sounds in the clerks' gallery above, and the moment is filed. The auctioneer at the Lisbon wool exchange files the arrival time of every bid on a slate that is sorted from earliest to latest, because the filing clerk writes each bid down as the bell rings and has never once been asked to rearrange them. Several bidders may press the bell within the same second, so times can repeat, sometimes four or five times over when the bidding is fierce.\n\nA dispute has arisen over a lot of merino that was knocked down at a price two bidders say they had already beaten. A magistrate has been appointed, and his method is statistical rather than testimonial: he distrusts witnesses and trusts slates. Wishing to know how many bids arrived strictly before a stated cut-off instant, he will pose many such questions, naming a different instant each time as he works through the afternoon's lots one by one. An instant he names need not be an instant at which any bid actually arrived.\n\nThe exchange's clerks have been instructed to cooperate fully, an instruction they resent. The building has a tiled frontage that appears on postcards. The auctioneer, Senhor Vasconcelos, has a parrot in his office which the magistrate has asked to have removed during the hearing, and the request has been refused on the grounds that the parrot predates the magistrate.\n\nInput: line one gives N and Q. Line two gives the N bid times in non-decreasing order. Each of the next Q lines gives one cut-off instant.\n\nOutput: for each, the number of bids that arrived strictly before it.\n\nConstraints: N and the number of cut-offs up to 10^6; times up to 10^9. Each answer must be found without reading most of the slate.","clues":["sorted from earliest to latest","times can repeat","how many bids arrived strictly before a stated cut-off instant"],"decoys":["at the Lisbon wool exchange","The building has a tiled frontage that appears on postcards","has a parrot in his office which the magistrate has asked to have removed"],"core":"In a sorted list with repeats, count how many items are strictly below a given value, for many different values.","gloss":[["slate","a writing tablet",true],["magistrate","a judge or public official",true],["cut-off instant","a deadline moment",true],["strictly","not counting equal values",true],["merino","a fine kind of wool",true]],"why":{"bs-exact":"That finds one specific value; the cut-off may not be in the list, and repeats mean you want the FIRST place it could sit.","hs-freq":"A tally per value does not give you everything below a boundary."},"tell":"A count of items below a threshold in sorted data, which is where the threshold would be inserted.","task":"For each cut-off instant, print how many bids arrived strictly before it.","sample":{"in":"7 3\n1 3 3 3 6 8 8\n3\n4\n9","out":"1\n4\n7","why":"Before 3: just the 1. Before 4: 1,3,3,3. Before 9: all seven."}},{"id":"sc-018","v":"bs-answer","dom":"brewing","diff":"M","title":"The Lubeck Malting Floor","story":"The Hanse brewers of Lubeck hold their privileges from the Emperor himself, and among those privileges is the right to sell at the autumn fair, which is the single event on which the year's accounts turn. Before they can brew they must malt, and this season they must malt N barley lots before the autumn fair, lot i weighing c[i] stone. The lots arrive from the estates of the hinterland in whatever order the carters bring them, and the guild's book records their weights in that same order.\n\nThe brewers share a single malting floor, a vast heated room beneath the guild hall, and it can process exactly R stone per day at a steady pace. By guild custom, which is enforced by a warden with a ledger and a bad temper, the floor never mixes two lots within a day; whatever remains of a lot after its last pass that day waits idle until the morrow. So a day's work is spent on lots taken in order, and a lot that will not fit in what is left of the day's capacity must wait.\n\nThe fair opens in D days, and every lot must be done by then, or the guild forfeits its stall and, worse, its precedence in the procession. The brewers are therefore not asking how long the work will take at a given rate. They want to know what rate they must hire the floor at, and since the floor is charged by its daily rate they want the cheapest that will serve: find the lowest daily rate R that suffices.\n\nThe guild's seal shows a barrel and a lion. One of the brewers has introduced a hopped beer that the elders mistrust. The warden's ledger was dropped in the Trave in 1483 and has been illegible from page sixty onwards ever since.\n\nInput: line one gives N and D. Line two gives the N lot weights in the order the carters delivered them.\n\nOutput: the smallest whole-number daily rate R with which all lots are malted within D days.\n\nConstraints: N up to 10^5, c[i] and D up to 10^9. A faster floor can never make the work take longer.","clues":["lowest daily rate R that suffices","never mixes two lots within a day","c[i] and D up to 10^9"],"decoys":["before the autumn fair","The guild's seal shows a barrel and a lion","The warden's ledger was dropped in the Trave in 1483"],"core":"Find the smallest value of a setting such that a job finishes in time, when the range of settings is enormous.","gloss":[["malt","to prepare grain for brewing",true],["lot","a batch",true],["stone","an old unit of weight",true],["morrow","the next day",true],["suffices","is enough",true],["hinterland","the land behind a port",true]],"why":{"bs-exact":"There is no sorted list to search; the thing you search is the range of possible rates.","dp-coin":"That builds a minimum over combinations; here a faster rate can only help, which is what lets you halve the range."},"tell":"The smallest value of a dial that makes a condition hold, with a huge range and an easy test.","task":"Print the smallest whole-number daily rate R with which every lot is malted within D days (a lot of weight c takes ceil(c / R) days).","sample":{"in":"4 8\n7 4 9 3","out":"4","why":"At R=4 the days are 2+1+3+1 = 7 (within 8); at R=3 they are 3+2+3+1 = 9, too many."}},{"id":"sc-019","v":"bs-rotated","dom":"horology","diff":"M","title":"The Prague Drum","story":"The great clock of Prague has been rebuilt, repaired, and in one disastrous year improved, by clockmakers of six centuries, and the mechanism that strikes the hours is the oldest surviving part of it. Deep in the frame it turns a drum bearing N bell-tags engraved with distinct numbers, each number the pitch of a bell the tag releases. When cast, the tags ran in increasing order from the first notch, climbing from the deepest bell to the highest, a pleasing arrangement that the founder recorded in his will.\n\nThe drum has since been rotated by some unknown number of notches. It happened during a repair, probably the repair of 1787, and no record was kept; the result is that the sequence now begins mid-way and wraps around, running up to the highest pitch, falling to the deepest, and climbing again to the tag that originally stood just before the new start. Nobody knows how far it was turned, and the frame cannot now be opened without dismantling the striking train.\n\nThe bell-ringer, who is also the clock's custodian and sells postcards in the interval, must decide whether a given number is on the drum at all, because visiting campanologists write to ask and the city has promised them an answer. The guild's rule, laid down when the clock was first put under guild care, says each decision must take time proportional only to the logarithm of N, a rule the guild inherited from a mathematician mayor and has never understood but always obeyed.\n\nThe clock's astronomical dial is admired by tourists who do not know what it shows. A legend says the builder was blinded so he could not repeat the work, which is untrue. A pigeon problem has defeated three successive contractors.\n\nInput: line one gives N and the pitch P being asked about. Line two gives the N pitches as the drum now reads them, from the first notch onward.\n\nOutput: the position of P on the drum counting from 1, or -1 if it is absent.\n\nConstraints: N up to 10^6; pitches are distinct and up to 10^9.","clues":["rotated by some unknown number of notches","begins mid-way and wraps around","proportional only to the logarithm of N"],"decoys":["The great clock of Prague","A legend says the builder was blinded so he could not repeat the work","A pigeon problem has defeated three successive contractors"],"core":"A sorted list that has been rotated by an unknown amount: is a value present, in logarithmic time?","gloss":[["drum","a rotating cylinder",true],["notches","small cuts or marks",true],["engraved","carved into a surface",true],["campanologists","people who study or ring bells",true],["logarithm","how many times you can halve something",false]],"why":{"bs-exact":"Plain halving assumes the whole list is in order; after a rotation only one half around the middle is guaranteed sorted.","tp-ends":"A sweep is linear, which the logarithmic rule rules out."},"tell":"Sorted, then rotated by an unknown amount, in logarithmic time.","task":"Print the 1-based position of pitch P on the drum, or -1 if it is absent.","sample":{"in":"7 20\n40 50 60 10 20 25 30","out":"5","why":"20 is the fifth number on the drum."}},{"id":"sc-020","v":"bs-partition","dom":"medicine","diff":"H","title":"The Physician's Two Rolls","story":"The apothecary guilds of Padua and Bologna have been rivals since the universities were founded, and the rivalry is conducted chiefly through their price rolls. Two apothecary guilds, one in Padua and one in Bologna, each keep a price roll of their remedies, listed from cheapest to dearest, and each guild regards the other's roll as a work of fiction. The rolls are long, because the guilds list every preparation they have ever sold, including several that are now illegal.\n\nA visiting physician from Montpellier has been engaged by the city of Verona to advise on what it should pay for medicines, and his method is to take the typical price rather than the cheapest or the dearest, since a city that buys only the cheapest medicine soon buys a great deal of it. He therefore wants the median price across both rolls combined, meaning the middle value if all prices were gathered in one list, and where the combined number of prices is even he wants the average of the two middle values.\n\nThere are two difficulties. The guilds will not permit their rolls to be copied, transcribed or merged, each suspecting the other of wanting a look; and the physician's satchel has no room for a merged copy in any case, since it already holds his instruments and a change of linen. The city, which is paying him by the day, has stipulated that the answer must be found in time proportional to the logarithm of the smaller roll.\n\nThe physician is a believer in the new anatomy and has quarrelled about it publicly. Verona's own apothecary has written to the council objecting to the whole enquiry. The rolls hold up to 10^6 prices each, which neither guild considers excessive.\n\nInput: line one gives A and B. Line two gives the A prices of Padua, ascending; line three the B prices of Bologna, ascending.\n\nOutput: the median price of all A + B prices, to one decimal place.\n\nConstraints: A and B up to 10^6, at least one non-empty; prices up to 10^9.","clues":["listed from cheapest to dearest","the median price across both rolls combined","no room for a merged copy","logarithm of the smaller roll"],"decoys":["A visiting physician","The physician is a believer in the new anatomy and has quarrelled about it publicly","Verona's own apothecary has written to the council objecting to the whole enquiry"],"core":"The middle value of two sorted lists taken together, without merging them, in logarithmic time.","gloss":[["price roll","a list of prices",true],["remedies","cures or medicines",true],["satchel","a small shoulder bag",true],["transcribed","copied out by hand",true],["median","the middle value",false]],"why":{"tp-merge":"Walking both lists together costs time proportional to their total length, which the limit forbids.","hp-two":"Two heaps track the median of a stream; these are two fixed sorted lists."},"tell":"The median of two sorted arrays, with no merging, in logarithmic time.","task":"Print the median of all A + B prices together, to one decimal place.","sample":{"in":"3 2\n1 3 8\n7 9","out":"7.0","why":"All prices in order: 1 3 7 8 9, so the middle one is 7."}},{"id":"sc-021","v":"hs-seen","dom":"theatre","diff":"E","title":"The Salzburg Tape","story":"The opera house at Salzburg has a front-of-house manager named Herr Kasimir Stettner, a man whose devotion to procedure is spoken of with awe by the ushers and with weariness by everyone else. At his insistence, every patron's ticket is stamped with a serial at the door, and the stamping machine prints the serial onto a continuous paper tape as it works, producing a long tape of N serials in no particular order, since the order is simply the order in which people happened to arrive.\n\nThis season the house has had trouble. Two patrons were found in the same seat during the second act of a Mozart, and a third produced a ticket for a performance that had been cancelled in 1998. Herr Stettner suspects forgery, and specifically he suspects that a forger has copied a genuine ticket, which would show itself as the same serial coming through the door twice. He wishes to discover, the moment the doors close, whether any serial was stamped more than once. He does not want to know which serial, nor how many duplicates there were; a single yes or no will tell him whether to call the police before the interval.\n\nThe serials cannot be put in order: the tape is evidence and the Staatsanwalt has said so in writing. They are also large, each as large as a billion, because the house's numbering scheme encodes the season, the performance and the price band, a scheme Herr Stettner devised himself and defends vigorously.\n\nThe orchestra has already begun the overture, and the manager is anxious to return to his box. The house's chandelier is lowered once a year for cleaning, an operation that draws a small crowd. The chief usher has worked there for forty years and claims to recognise every regular patron by their cough.\n\nInput: line one gives N. Line two gives the N serials in the order they were stamped.\n\nOutput: YES if any serial appears more than once, NO otherwise.\n\nConstraints: N up to 10^6; serials up to 10^9.","clues":["in no particular order","whether any serial was stamped more than once","each as large as a billion"],"decoys":["The orchestra has already begun the overture","The house's chandelier is lowered once a year for cleaning","claims to recognise every regular patron by their cough"],"core":"An unsorted list of big numbers: does any value appear twice?","gloss":[["patron","a regular customer",true],["serial","a unique identifying number",true],["forgery","a fake copy",true],["overture","the opening piece of music",true],["Staatsanwalt","a public prosecutor",true]],"why":{"tp-ends":"Two markers need sorted data, and sorting adds cost without telling you anything extra.","hs-cyclic":"Marking inside the list only works if values are valid positions, 1 to N; here they reach a billion."},"tell":"Unsorted, large values, and the only question is 'have I seen this before?'","task":"Print YES if any serial number appears more than once, otherwise NO.","sample":{"in":"6\n14 9 31 9 5 2","out":"YES","why":"The serial 9 appears twice."}},{"id":"sc-022","v":"hs-freq","dom":"caravan trade","diff":"E","title":"The Caravanserai Record","story":"The caravanserai at Tash Rabat stands where three roads meet, a squat stone building with a courtyard and a well, and it has sheltered merchants, pilgrims and a certain number of thieves for seven hundred years. Its keeper is required by the khan's writ to keep a record, and so the caravanserai records the origin of each camel train as it halts, one letter per train, naming the oasis it set out from. The letters go into a scroll in the order the trains arrive, which is the order in which they happen to come over the pass, and nothing is ever reordered.\n\nAt the end of the season the scroll goes to the khan, who has lately become interested in where his traffic actually comes from, having been told by one of his ministers that it comes chiefly from the west and by another that it comes chiefly from the south. After a season of N halts, the khan wishes to learn which single oasis supplied the greatest number of trains and exactly how many that was. He is not interested in the order of arrivals, nor in when the busiest month fell, nor in any oasis but the first; and he has been assured by the keeper that there is guaranteed to be no tie for first place.\n\nDust storms delayed the record-keeping twice, and the scribe complains about the heat, a complaint he has entered into the scroll itself on two occasions. The well was redug in the spring and the water is said to be better. A dispute between two merchants over a lame camel was settled by the keeper in a manner neither party has accepted.\n\nInput: line one gives N. Line two gives a string of N letters, the origins in order of arrival.\n\nOutput: the letter of the busiest oasis, and the number of trains it supplied.\n\nConstraints: N up to 10^6; origins are lowercase letters a to z.","clues":["which single oasis supplied the greatest number of trains","exactly how many that was","no tie for first place"],"decoys":["Dust storms delayed the record-keeping twice","The well was redug in the spring","A dispute between two merchants over a lame camel"],"core":"Find the most frequent item in a long list, and how many times it occurs.","gloss":[["caravanserai","an inn for travelling merchants",true],["oasis","a green spot in a desert",true],["khan","a ruler or chief",true],["halts","stops",true],["writ","a formal written order",true]],"why":{"hs-seen":"A set only remembers that something happened, not how often.","sw-longest":"The order of the records does not matter at all."},"tell":"How many times each thing occurs, and the answer is the biggest count.","task":"Print the letter of the oasis that supplied the most trains, and how many it supplied.","sample":{"in":"9\nabcabaaca","out":"a 5","why":"The letter a appears five times; b and c twice each."}},{"id":"sc-023","v":"hs-index","dom":"moneylending","diff":"M","title":"The Pawnbroker's Shelf","story":"Signor Fosco Malatesta keeps a pawnbroker's shop in a street so narrow that the upper storeys almost meet, and he is, by the standards of his trade, an honest man: his interest is usurious but his records are exact. A pawnbroker's shelf behind the counter holds N pledges in a row, and pledge i is valued at p[i] ducats, the valuation being Malatesta's own and entered in his book when the pledge came in. The pledges stand in the order they were pawned, so the values are unsorted and always have been.\n\nA client arrives on a wet evening with a debt of exactly B ducats to settle and a proposal. He wishes to redeem precisely two different pledges whose values add to B, so that the redemption exactly cancels the debt and no coin need change hands, an arrangement that suits him for reasons he does not explain and that suits Malatesta because it closes an account. The clerk, a nephew of the house, must hand them over by their shelf positions, counting from zero, since the shelf is labelled by position
