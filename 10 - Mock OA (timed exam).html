ery serial is more than is needed; only whether this one has been met before.","ps-count":"No totals are involved."},"tell":"Going through in order and asking 'have I met this value already?': remember what has been seen in a set that answers instantly.","task":"Print the 1-based position of the first entry whose serial appeared earlier, or 0.","sample":{"in":"7\n5 9 2 7 9 5 1","out":"5","why":"The fifth entry, 9, is the first repeat."}},{"id":"sc-122","v":"hs-freq","dom":"letterpress printing","diff":"M","title":"The Compositor's Case","story":"In the cellar of a print shop in the old town of Ostrava stands a wooden type case, the last of its kind still in daily use, and its compositor, a stooped and cheerful man named Vaclav Hrdina, sets every poster and pamphlet by hand. The case holds individual pieces of metal type, called sorts, each bearing one raised letter, and the shop owns only so many of each letter. Vaclav's trade secret, which he reveals to no one but his apprentice, is that he counts the sorts of each letter at the start of every day and writes the tallies on a slate beside the case.\n\nThis morning a customer has brought in a handwritten message, a single long line of letters and spaces, which he wants printed on a banner for his daughter's wedding. Vaclav must decide whether the shop's stock of sorts can set the message at all. Each letter of the message needs one sort of that letter, used once and not returned to the case until the printing is done, and spaces do not need sorts. If the message needs, say, five of the letter 'e' but the case holds only four, then the banner cannot be set, no matter how much stock of other letters remains. Vaclav does not care in what order the letters appear in the message, nor where the sorts are physically stored, only whether, letter by letter, supply meets demand.\n\nThe print shop also publishes a small gazette of parish news, which is chiefly read by people who appear in it. The cellar is damp and smells faintly of linseed oil. A feud with the printer next door over the exact placement of a shared drainpipe has simmered for eleven years.\n\nInput: line one gives the length N of the customer's message and the total number M of sorts in the case. Line two gives the message as a string of N characters. Line three gives the case contents as a string of M letters, one per sort.\n\nOutput: YES if the message can be set, NO otherwise.\n\nConstraints: N and M up to 10^6; letters are lowercase a to z and spaces appear only in the message. Do not try to match letters by searching the case afresh for each letter of the message; Vaclav wants a method that scales with the lengths of the two strings, not with their product.","clues":["Each letter of the message needs one sort of that letter, used once","letter by letter, supply meets demand","does not care in what order the letters appear in the message","scales with the lengths of the two strings, not with their product"],"decoys":["a small gazette of parish news, which is chiefly read by people who appear in it","A feud with the printer next door over the exact placement of a shared drainpipe"],"core":"Decide whether a message can be built from a pool of letters: for each letter, is there enough supply?","gloss":[["compositor","a person who arranges type for printing",true],["sorts","individual pieces of metal type",true],["tallies","running counts",true],["stooped","bent forward at the shoulders",true],["supply","the amount available",false]],"why":{"hs-seen":"Whether a letter exists in the case is not enough; how many are needed matters.","hs-group":"Nothing here is being gathered into groups."},"tell":"'How many of each' on both sides, compared kind by kind: tally each side in a table that maps each letter to a count.","task":"Print YES if the message can be set from the sorts in the case (one sort per letter, spaces need none), otherwise NO.","sample":{"in":"11 10\nhello world\nehllloowrd","out":"YES","why":"The case has three l's and two o's, enough for the message."}},{"id":"sc-123","v":"hs-index","dom":"tulip auction","diff":"M","title":"The Budget of Mynheer van der Linden","story":"In the great auction hall at Haarlem, the tulip season brings merchants from across Europe, and among them Mynheer Willem van der Linden, whose estate in the countryside has an enormous conservatory and an insatiable appetite for rare bulbs. This year he has set his steward a task. The auctioneer has published a catalogue of lots, each lot being a single bulb offered at a stated price in guilders, and the lots are printed in the order in which they will come under the hammer. Prices are all whole numbers, and the same price can well appear for two different lots.\n\nVan der Linden's steward must choose exactly two different lots whose prices add up to precisely the sum that Van der Linden has set aside, no more and no less, since he distrusts debts and refuses to carry cash home. The steward need not find all such pairs; any one will do. But because Van der Linden will be at the back of the hall, and must be told which two lots to raise a finger for, the steward must report their positions in the catalogue, counted as they are printed, and not the prices. The catalogue is NOT in order of price; it is printed in order of sale, which was decided by lot.\n\nThe auction hall is celebrated for a particularly ornate chandelier, which was installed after a fire and is said to be insured for more than the building. The auctioneer's assistant, a young man with a spectacular moustache, has been known to wave his gavel at the wrong moment. Outside, the canal is frozen and a boy is skating in widening circles.\n\nInput: line one gives N, the number of lots, and the budget T. Line two gives the N prices in catalogue order.\n\nOutput: two positions (1-based, smaller first) of lots whose prices sum to T, or the word NONE.\n\nConstraints: N up to 10^6; prices and T up to 10^9; there may be several valid pairs and any is accepted. Reordering the catalogue would lose the positions that the steward is asked to report, and examining every pair of lots is hopeless at this size; he wants to settle each lot in a constant amount of effort as he reads down the catalogue once.","clues":["exactly two different lots whose prices add up to precisely the sum","the steward must report their positions in the catalogue","The catalogue is NOT in order of price","settle each lot in a constant amount of effort as he reads down the catalogue once"],"decoys":["a particularly ornate chandelier, which was installed after a fire","The auctioneer's assistant, a young man with a spectacular moustache"],"core":"Find two entries in an unsorted list that add to a target, and report their original positions in a single pass.","gloss":[["conservatory","a glass room for growing plants",true],["bulb","the underground storage part of a plant like a tulip",true],["guilders","the old Dutch currency",true],["steward","someone who manages another person's affairs",true],["insatiable","impossible to satisfy",true]],"why":{"tp-ends":"Closing in from both ends needs sorted data, but sorting would destroy the positions the steward must report."},"alt":[],"tell":"Unsorted, a pair that totals a target, original positions needed: remember each value's position and ask what partner would complete the total.","task":"Print the two lot positions (1-based, smaller first) whose prices add to T, or NONE.","sample":{"in":"5 11\n2 5 4 15 9","out":"1 5","why":"2 + 9 = 11."}},{"id":"sc-124","v":"hs-group","dom":"calligraphy","diff":"M","title":"The Practice Words of Master Kuan","story":"Master Kuan Li runs a school of calligraphy in a lantern-lit alley of an old river city, and the first lesson he gives every new pupil is that a word is a pattern of strokes, and that rearranging the strokes can produce a quite different word. To drive the point home, he writes a long list of practice words on a scroll, all in lower-case Latin letters for the benefit of the foreign students, and asks his senior pupil, Mei, to sort the list into families.\n\nA family, by Kuan's definition, is a set of words that are rearrangements of one another: they contain exactly the same letters, each letter appearing the same number of times, though possibly in a different order. For example, if the words 'listen' and 'silent' appear, they belong to the same family. A word that is not a rearrangement of any other forms a family of one. Mei is to present the families on a fresh scroll, each family on its own line, in any order, and the words inside each family in the order they appeared on the original scroll. The master is not at all interested in the meanings of the words, or whether they belong to any language; only in whether two words are made of the same letters.\n\nKuan's inkstone is said to have belonged to a minor poet of the Tang dynasty, and a brisk trade in forgeries has sprung up among the antique dealers. The pupils' tea is brewed with jasmine. A swallow has made a nest in the eaves above the practice room, and the master forbids anyone to disturb it, with the result that the students have grown accustomed to chirping in the middle of lessons.\n\nInput: line one gives N, the number of words. The next N lines each give one word.\n\nOutput: the families, each on its own line, with the words of a family separated by spaces; families may be printed in any order but the words within a family must appear in input order.\n\nConstraints: N up to 10^5; each word up to 100 letters. Comparing every pair of words against each other letter by letter would take Mei the whole school year; she needs something that assigns each word to its family in one step, as she reads it.","clues":["a set of words that are rearrangements of one another","they contain exactly the same letters, each letter appearing the same number of times","assigns each word to its family in one step, as she reads it","Comparing every pair of words against each other letter by letter"],"decoys":["Kuan's inkstone is said to have belonged to a minor poet of the Tang dynasty","A swallow has made a nest in the eaves above the practice room"],"core":"Group words that are made of the same letters; the words are assigned to a family by some form of identity of their letters.","gloss":[["calligraphy","the art of beautiful handwriting",true],["strokes","marks made by a pen or brush",true],["rearrangements","the same items in a different order",false],["forgeries","fake copies passed off as genuine",true],["senior","older or more advanced",true]],"why":{"hs-freq":"Counting letters for a single word is only the first step; the question wants the words gathered under a shared label.","ps-count":"No ranges are being totalled."},"tell":"Words belong together if they share some signature: compute a canonical signature for each word and collect words under it.","task":"Print each family on its own line, words in input order.","sample":{"in":"6\neat\ntea\ntan\nate\nnat\nbat","out":"eat tea ate\ntan nat\nbat","why":"Words made of the same letters are grouped."}},{"id":"sc-125","v":"hs-cyclic","dom":"cloakroom","diff":"H","title":"The Lost Tag of the Aldwych Hall","story":"The Aldwych Concert Hall issues a numbered brass tag to every patron who checks a coat, and the tags are numbered consecutively from 1 upward, one per patron, with no skipped numbers on any given evening. Tonight, however, a number of tags have been lost, the tags that remain in the hands of the cloakroom attendant, a retired sergeant named Humphrey Bell, having been dropped by a careless porter into a basket and scrambled. The attendant now holds a jumble of tags in an order that tells him nothing, and the manager has asked him to find the smallest positive tag number that is NOT among those in the basket.\n\nSome tags in the basket are duplicates; the porter, trying to be helpful, ran off copies of a few. Some are zero or negative, being the blanks used for practice, and may be ignored. Some are far larger than the number of tags in the basket, belonging to some enormous cloakroom at the other end of town and to be ignored for the purpose of this calculation. What matters is the smallest positive whole number, starting from 1, that appears nowhere in the basket. For instance, if the basket contained tags numbered 3, 4, -1, 1, the answer would be 2.\n\nThe sergeant is fussy about space. The cloakroom is tiny, there is no spare desk, and he will not allow another basket, another table or a ledger to be brought in: whatever he does must be done by shuffling and marking the tags in the one basket he has, using nothing beyond a few scribbles of his own. He must also be quick; the concert's interval is about to begin, and the first patrons are already queuing.\n\nThe hall's acoustics are praised by visiting orchestras, and its foyer has a marble staircase on which a famous soprano once tripped. The programme tonight includes a long piece for solo viola.\n\nInput: line one gives N, the number of tags in the basket. Line two gives the N tag numbers, in no order.\n\nOutput: the smallest positive integer missing.\n\nConstraints: N up to 10^6; tag numbers between -10^9 and 10^9. Extra memory must not grow with N.","clues":["the smallest positive tag number that is NOT among those in the basket","shuffling and marking the tags in the one basket he has","nothing beyond a few scribbles of his own","numbered consecutively from 1 upward"],"decoys":["a famous soprano once tripped","The programme tonight includes a long piece for solo viola"],"core":"Find the smallest missing positive whole number in an unsorted list, using no extra memory: the list itself must serve as the record.","gloss":[["consecutively","one after another in order",false],["sergeant","a rank of non-commissioned officer",true],["scrambled","mixed up",true],["acoustics","the qualities that affect how sound is heard in a room",true],["patron","a customer or regular supporter",true]],"why":{"hs-seen":"A set of seen numbers works, but the story forbids extra memory beyond a few marks.","bs-exact":"The tags are unordered; sorting them would cost extra effort and still not satisfy the memory limit as stated."},"tell":"Values that double as positions, and no extra memory allowed: put each tag at the slot matching its number, then see which slot is wrong.","task":"Print the smallest positive integer that does not appear.","sample":{"in":"4\n3 4 -1 1","out":"2","why":"1 is there; 2 is not."}},{"id":"sc-126","v":"ms-next","dom":"signal fires","diff":"M","title":"The Beacon Ridge of Carrow Fell","story":"Along the spine of Carrow Fell, from the coast to the border, stand the old beacon towers that once carried warning of invasion from one hilltop to the next. They are all different in height, since they were built by different lords at different centuries and from different quarries, and some are only the stumps of what they once were. A local historical society, led by an indefatigable amateur named Cordelia Fenwick, is trying to reconstruct how the fire signals might have passed along the ridge.\n\nCordelia's working theory is simple: from any given tower, the watchman looked eastward along the ridge, and the first tower he could see that was strictly taller than his own was the one to which he would pass the signal. Any tower lower than or equal to his own was hidden behind the shoulder of the hill and could not be seen. If he could see none, because no taller tower stood anywhere to the east, the signal died there. Cordelia has the heights of all the towers listed from west to east. For EVERY tower, she wishes to know the distance, in towers counted eastward, to the nearest taller tower, or zero if there is none.\n\nThe society meets on Thursdays in a draughty village hall, and the tea urn has a tendency to boil over. Cordelia's late husband was a keen kite flier and the hall is decorated with his kites, which is nobody's idea of a safe arrangement. A local farmer insists that the beacon on Carrow Fell was once the site of an alien landing, though he is not taken seriously.\n\nInput: line one gives N, the number of towers. Line two gives N heights, west to east.\n\nOutput: N integers, the eastward distance from each tower to the nearest strictly taller tower, or 0 if none.\n\nConstraints: N up to 10^6; heights up to 10^9. A method that, for each tower, looks eastward until it finds a taller one, takes far too long when the ridge descends gently from a great peak, because every tower must look past almost every other. Cordelia needs each tower to be settled using only a small amount of average effort.","clues":["the first tower he could see that was strictly taller than his own","For EVERY tower, she wishes to know the distance","for each tower, looks eastward until it finds a taller one, takes far too long"],"decoys":["The society meets on Thursdays in a draughty village hall","A local farmer insists that the beacon on Carrow Fell was once the site of an alien landing"],"core":"For each position, find the nearest later position holding a strictly larger value.","gloss":[["beacon","a fire or light used as a signal",true],["indefatigable","never tiring",true],["stumps","short remaining pieces",true],["strictly","excluding equal values",false],["draughty","full of cold air currents",true]],"why":{"ms-hist":"Both use an ordered structure, but histogram areas combine neighbours on both sides; here only the next larger value to one side matters.","sw-deque":"No frame of fixed length is involved."},"tell":"For each element, the nearest larger one to its right: keep unresolved elements in order and resolve them when something bigger arrives.","task":"For each tower, print the eastward distance to the nearest strictly taller tower, or 0.","sample":{"in":"6\n73 74 75 71 69 72","out":"1 1 0 2 1 0","why":"73 -> 74 is 1 away; 71 -> 72 is 2 away."}},{"id":"sc-127","v":"ms-hist","dom":"great halls","diff":"H","title":"The Banner Beneath the Beams of Wrenhall","story":"The great hall at Wrenhall Castle is spanned by a row of oak beams, each one hung at a slightly different height above the flagstones, because the hall was built piecemeal across four centuries and the carpenters of each age had their own ideas of what a beam ought to be. The steward of the household, a nervous man named Aldous Pemberley, has been instructed by the lady of the castle to hang a single rectangular banner in celebration of her daughter's betrothal. The banner is a flat sheet that must hang straight down from the beams, its top edge level and fastened along an unbroken run of neighbouring beams, and its bottom edge must clear the floor by a reasonable margin.\n\nThe difficulty is the uneven beams. The banner can only hang as far down from its fastenings as the LOWEST beam among those it spans permits, because a lower beam would otherwise cut across the sheet. The sheet may be as wide as the steward likes, covering as many neighbouring beams as he chooses, but a wide banner is limited in depth by the lowest beam it crosses. The lady has stated that she wants the banner to be as large in area as the hall will allow: width times depth, maximised. Aldous has measured, for each beam in the row from the west wall to the east, the depth available beneath it, in hand-spans.\n\nThe hall's minstrels' gallery is said to be haunted by a lady in grey who sings out of tune. The kitchen servants dislike the steward intensely, and he returns the sentiment. A wild cat has taken up residence in the rafters and has defeated three attempts to dislodge it.\n\nInput: line one gives N, the number of beams. Line two gives N depths available beneath each beam, from west to east.\n\nOutput: the largest area of any banner, where area is the number of neighbouring beams spanned multiplied by the least depth among them.\n\nConstraints: N up to 10^6; depths up to 10^9. Considering every possible pair of end beams and scanning between them for the lowest is hopeless at this size.","clues":["an unbroken run of neighbouring beams","limited in depth by the lowest beam it crosses","width times depth, maximised","Considering every possible pair of end beams and scanning between them for the lowest is hopeless"],"decoys":["The hall's minstrels' gallery is said to be haunted by a lady in grey who sings out of tune","A wild cat has taken up residence in the rafters"],"core":"Find the largest rectangle formed by a run of neighbouring bars, where the height is the shortest bar in the run.","gloss":[["betrothal","an engagement to be married",true],["piecemeal","done a little at a time",true],["flagstones","large flat paving stones",true],["minstrels","medieval musicians",true],["fastenings","the points where something is attached",true]],"why":{"ms-next":"Finding the next lower beam is a step inside the solution, but the question asks to combine a width and the shortest height into the largest area.","sw-longest":"The 'rule' here is not a cap but a product to be maximised."},"tell":"Area limited by the shortest in a run: for each beam find how far it can stretch left and right before something lower stops it.","task":"Print the largest banner area (neighbouring beams spanned x the least depth among them).","sample":{"in":"6\n2 1 5 6 2 3","out":"10","why":"Two beams of depth 5 and 6 give 2 x 5 = 10."}},{"id":"sc-128","v":"ms-match","dom":"lantern festival","diff":"M","title":"The Lantern Rites of Yuen Shan","story":"The Lantern Festival of Yuen Shan is held on the fifteenth night of the first moon, and its most revered tradition is the Rite of Opening and Closing. A chief lamplighter walks the length of a long processional avenue carrying a roll of coloured paper strips, and at each station along the way she performs exactly one act: she either opens a lantern of a certain colour, or closes one. The colours are red, gold and jade, and each colour has its own symbol in the festival record: opening is written as the left half of a pair of marks, and closing as the right half. Red uses round marks, gold uses square marks, and jade uses angled marks.\n\nThe temple elders have laid down the following rule. Whenever a lantern is closed, it must be the lantern that was opened MOST RECENTLY among those still open, and it must be of the same colour as the act of closing; for to close a gold lantern while a jade one burns inside it would be a grave discourtesy to the ancestors. By the end of the avenue, every lantern that was opened must have been closed. A record of acts that obeys all these conditions is called a harmonious rite; anything else is a blemish.\n\nA young scribe named Wen has been asked to check dozens of festival records, each a string of marks, and say for each whether it is a harmonious rite. The scribe's brush, unfortunately, has been dipped in the wrong ink, and some of the marks are smudged beyond reading, though that is a problem for the next paragraph and not this one. The lamplighters' guild holds a banquet after the festival at which an enormous dumpling is served.\n\nInput: the first line gives T, the number of records. Each of the next T lines gives a string made of the characters ( ) [ ] { }.\n\nOutput: for each record, YES if it is a harmonious rite, NO otherwise.\n\nConstraints: T up to 10^4; each record up to 10^6 characters. Wen would like to read each record once from left to right and decide as he goes, without rewriting the record or looking back more than the most recent unclosed act.","clues":["it must be the lantern that was opened MOST RECENTLY among those still open","it must be of the same colour as the act of closing","every lantern that was opened must have been closed","read each record once from left to right and decide as he goes"],"decoys":["The lamplighters' guild holds a banquet after the festival at which an enormous dumpling is served","The scribe's brush, unfortunately, has been dipped in the wrong ink"],"core":"Check that three kinds of paired marks are properly nested: each closing mark must match the latest unclosed opening one.","gloss":[["revered","greatly respected",true],["processional","relating to a ceremonial march",true],["discourtesy","rudeness",true],["harmonious","fitting together well",true],["blemish","a flaw",true]],"why":{"ms-greedy":"No building of a best result is going on; it is a validity check on nesting.","td-up":"No tree is given, although nesting is tree-like."},"tell":"Last opened, first closed, and everything must be closed by the end: remember the unclosed openers and check each closer against the latest.","task":"For each record, print YES if it is a harmonious rite, otherwise NO.","sample":{"in":"3\n{[()]}\n([)]\n((","out":"YES\nNO\nNO","why":"Only the first closes everything it opens in the right order."}},{"id":"sc-129","v":"ms-greedy","dom":"lock museum","diff":"H","title":"The Combination of the Strongroom at Tolbrook","story":"The lock museum at Tolbrook exhibits the strongroom of a Victorian bank, preserved with every bolt and lever in place, and its most treasured item is a leather-bound manual that records the combination in a long string of digits. For reasons of insurance, the museum's director, a fastidious man called Barnabas Quill, is obliged to reduce the displayed combination to a shorter, harmless figure, so that no visitor may use it. The rule agreed with the insurers is exact: the director must strike out exactly K digits from the string, leaving the remaining digits in their ORIGINAL left-to-right order, with no digit moved from its place relative to the others.\n\nBarnabas has his own aesthetic preference, however. Of all the figures he could leave behind by striking out K digits, he wants the numerically smallest, because a small number looks tidy on the display card and because, he says, it is more insulting to a would-be thief. If the remaining digits begin with zeros, those leading zeros are simply dropped when reading the figure as a number, and if everything is struck out, or only zeros remain, the figure is read as 0. He needs to know what that smallest figure is, as a string of digits without leading zeros.\n\nThe museum is conveniently situated next to a railway station, and the passing trains rattle the cases. A volunteer guide wears a deerstalker hat, which visitors find either charming or tiresome. The gift shop sells replica keys, none of which open anything. The strongroom's famous scratches on the floor were left by a clerk who dragged a safe across it in 1893.\n\nInput: line one gives N, the number of digits, and K. Line two gives the string of N digits.\n\nOutput: the smallest number obtainable after striking out exactly K digits, without leading zeros (print 0 if the result is empty or all zeros).\n\nConstraints: N up to 10^6; K between 0 and N. Trying every possible choice of K digits to strike out is impossible; and since the digits must stay in order, the director wants a single left-to-right pass, deciding each time whether the digit just read ought to push out a larger digit read earlier.","clues":["strike out exactly K digits from the string, leaving the remaining digits in their ORIGINAL left-to-right order","the numerically smallest","a single left-to-right pass","whether the digit just read ought to push out a larger digit read earlier"],"decoys":["The museum is conveniently situated next to a railway station","A volunteer guide wears a deerstalker hat"],"core":"Remove exactly K digits from a number, keeping order, so that the result is as small as possible.","gloss":[["fastidious","very particular about details",true],["strongroom","a secure room for valuables",true],["aesthetic","concerned with beauty",true],["insurers","companies that cover losses for a fee",true],["lever","a bar that pivots to move something",true]],"why":{"ms-next":"Next-smaller relationships are used inside, but the question is about building a final smallest figure by dropping digits.","dp-linear":"A table over positions would work but is heavier than the single-pass way the director asks for."},"tell":"Build the smallest result left to right, discarding a previous bigger digit whenever a smaller one arrives and removals remain.","task":"Print the smallest number obtainable after striking out exactly K digits (no leading zeros; 0 if nothing is left).","sample":{"in":"7 3\n1432219","out":"1219","why":"Remove 4, 3 and a 2."}},{"id":"sc-130","v":"hp-topk","dom":"pearl diving","diff":"M","title":"The Heaviest Pearls of the Aurelian Banks","story":"Along the Aurelian Banks, in the warm shallows of the southern sea, the pearl divers of the Marisol cooperative work from dawn until the sun climbs too high to see beneath the surface. Every pearl brought up is weighed on the cooperative's brass scales at the quay by the weighmaster, an elderly woman called Catalina Ruiz, and its weight in grains is shouted aloud and noted by a clerk. Pearls arrive one at a time, continually, over the long days of the season, and an astonishing number of them pass the scales: tens of millions, if the cooperative's boast is to be believed.\n\nThe cooperative has a contract with the royal jeweller to deliver, at the end of the season, the K heaviest pearls that were found, K being a smallish number such as fifty. Unfortunately, the cooperative has no record of every weight: the clerk's notebook holds room for only a few hundred entries and was long since filled and thrown away, and the quay has no warehouse for pearls that are not among the best. At any moment during the season, the weighmaster must be able to answer the question 'which are the K heaviest pearls seen so far, and what is the lightest of these?' because the jeweller's agent likes to drop in and ask. She will be told each new weight just once, as it is shouted aloud, and she cannot ask for it to be repeated.\n\nThe quay is overrun with gulls, who have a taste for the divers' lunches. A rival cooperative to the east is thought to be selling coloured glass beads to credulous tourists. Catalina's grandson sells coconut sweets from a barrow by the customs shed.\n\nInput: line one gives N, the number of pearls weighed and K. Line two gives the N weights in the order they were announced.\n\nOutput: the K greatest weights seen, in decreasing order.\n\nConstraints: N up to 10^7; K up to 100; weights up to 10^9. Memory may grow with K, not with N. Sorting the entire stream at the end is not allowed, as the stream has already gone by.","clues":["the K heaviest pearls that were found, K being a smallish number","the clerk's notebook holds room for only a few hundred entries","She will be told each new weight just once","Memory may grow with K, not with N"],"decoys":["The quay is overrun with gulls, who have a taste for the divers' lunches","Catalina's grandson sells coconut sweets from a barrow by the customs shed"],"core":"From a long stream, keep only the K largest values, using memory proportional to K.","gloss":[["grains","a small unit of weight used for pearls",true],["weighmaster","an official who weighs goods",true],["cooperative","a business owned jointly by its members",true],["credulous","too ready to believe",true],["quay","a landing place for ships",true]],"why":{"hp-two":"Balancing two halves is for a middle value; here only the top K matter.","bs-answer":"No threshold is being searched for."},"tell":"A running record of the best K from a stream: hold K candidates and, for each new arrival, evict the weakest if it loses.","task":"Print the K greatest weights seen, in decreasing order.","sample":{"in":"8 3\n40 7 91 15 63 22 88 5","out":"91 88 63","why":"The three heaviest pearls."}},{"id":"sc-131","v":"hp-merge","dom":"river gauges","diff":"H","title":"The Gauge Stations of the Severn Weir","story":"The Water Board's hydrological office at Severn Weir receives readings from a chain of gauge stations strung along a river basin, each of which keeps its own logbook of water level. Every station writes in its logbook in strict order of time, earliest reading first, and the logbooks are mailed to the office in the form of long telex strips, one per station. The office wants a single chronological record, covering every reading from every station, in order of the time at which the reading was taken, so that the engineers can study the passage of a flood wave from one station to the next.\n\nThe complication is the telex machinery. There are K stations, K being at most a couple of thousand. The office's machine can only pull one reading at a time from each strip, from its current end, and it cannot go back; nor can it hold on the desk more than one reading from each strip, for a strip that has been fed in can never be unspooled again. The office's stock of paper is limited, so the combined record must be produced as the readings come, writing each line to the final record as soon as the next one in time order is known, without copying all the strips into one pile and sorting that pile afterwards.\n\nThe river basin includes a famous salmon ladder, which attracts tourists, and a weir whose roar can be heard for a mile. The head hydrologist, Gwendolen Rees, owns three spaniels, all of which accompany her to work. The canteen's rice pudding is considered a local delicacy, though those who dislike it say so only in whispers.\n\nInput: line one gives K. Each of the next K lines begins with a count M_i followed by M_i timestamps in increasing order.\n\nOutput: all the timestamps from all stations in one non-decreasing sequence.\n\nConstraints: K up to 2000; total readings up to 5 * 10^6; timestamps up to 10^9. The office would like to keep in view only one reading per station at any moment, and to select the earliest among those K in good time, rather than compare each new reading against all the others.","clues":["Every station writes in its logbook in strict order of time","a single chronological record, covering every reading from every station","it hold on the desk more than one reading from each strip","select the earliest among those K in good time, rather than compare each new reading against all the others"],"decoys":["a famous salmon ladder, which attracts tourists","The head hydrologist, Gwendolen Rees, owns three spaniels"],"core":"Merge K sorted lists into one sorted list, holding only the current front item of each list.","gloss":[["hydrological","relating to water and its movement",true],["telex","an old text-message machine on paper strips",true],["gauge","an instrument for measuring a quantity",true],["chronological","in order of time",false],["unspooled","unwound",true]],"why":{"tp-merge":"Two sorted sequences can be merged with a cursor each, but with a couple of thousand sources, comparing all fronts each time is slow; something must pick the earliest of many quickly.","iv-sortkey":"Sorting everything at the end is exactly what the office is forbidden to do."},"tell":"Many sorted sources merged into one: keep each source's current front in a structure that always gives the smallest.","task":"Print all timestamps from every station as one non-decreasing sequence.","sample":{"in":"3\n3 1 5 9\n2 2 6\n4 3 4 7 8","out":"1 2 3 4 5 6 7 8 9","why":"Merge the three ordered lists."}},{"id":"sc-132","v":"hp-two","dom":"fish market","diff":"H","title":"The Middle Price at Grimsby Dock","story":"At the fish market on Grimsby Dock, the auction starts before dawn, and the auctioneer, a barrel-chested man named Obadiah Teague, calls out the price per stone for each lot as it is knocked down. The Fisheries Board, anxious to reassure the public that no single bumper catch or freak shortage distorts the picture, publishes a figure called the Middle Price: the price of the lot that would stand exactly in the middle if all lots sold so far that morning were lined up in order of price, or, when an even number of lots have been sold, the average of the two in the middle.\n\nThe Middle Price must be updated after every single lot, because the Board's ticker, mounted on a pole over the dock, shows the figure live. There may be hundreds of thousands of lots in the course of a season's busiest day, and no lot, once sold, is ever withdrawn or changed. Obadiah's clerk, a boy of sixteen, cannot afford to re-sort the whole record of the morning's prices each time a new one arrives, for the ticker would fall hopelessly behind; yet the Board will not accept a figure that is approximate or that omits any lot.\n\nThere is a long and bitter rivalry between the herring merchants and the cod merchants, and fights occasionally break out over the position of a stall. The market's cat, a one-eyed tom named Admiral, patrols the cod stalls with an air of proprietorship. A visiting inspector from the capital has complained of the smell, which is regarded locally as a compliment.\n\nInput: line one gives N, the number of lots. Line two gives the N prices in the order they were sold.\n\nOutput: N numbers, the Middle Price after each lot, each to one decimal place.\n\nConstraints: N up to 5 * 10^5; prices up to 10^9. Each update should cost only a small, slowly growing amount of effort, and the method must be able to give the middle at any moment without holding the prices in sorted order or re-sorting them.","clues":["the price of the lot that would stand exactly in the middle","must be updated after every single lot","cannot afford to re-sort the whole record","no lot, once sold, is ever withdrawn"],"decoys":["a long and bitter rivalry between the herring merchants and the cod merchants","The market's cat, a one-eyed tom named Admiral"],"core":"After each new value arrives in a stream, report the median of everything so far.","gloss":[["auction","a sale where goods go to the highest bidder",true],["bumper","unusually large",true],["proprietorship","the feeling of owning something",true],["ticker","a display that shows changing figures",true],["approximate","close but not exact",true]],"why":{"hp-topk":"Keeping only the top few discards the lower values, but a median needs both halves kept.","bs-partition":"That is for two fixed sorted lists, not a stream."},"tell":"Running middle of a stream: keep the lower half and upper half in two structures that expose their boundaries, and rebalance.","task":"After each lot print the Middle Price so far (average of the two middle prices if the count is even), to one decimal place.","sample":{"in":"5\n12 4 8 20 6","out":"12.0\n8.0\n8.0\n10.0\n8.0","why":"After 12: 12. After 12,4: 8. After 12,4,8: 8. After 4 numbers: 10. After 5: 8."}},{"id":"sc-133","v":"hp-greedy","dom":"rope walks","diff":"M","title":"The Splicing Charges of Carrick Ropewalk","story":"The ropewalk at Carrick is a quarter-mile shed in which hemp is twisted into cable for the naval dockyards, and its master, a taciturn man called Silas Pardoe, has received an unusual order. The Admiralty wants the ropewalk to join a collection of separate lengths of rope into one single continuous cable. The lengths are of various sizes, measured in fathoms, and the ropewalk has them lying in the yard in no particular order.\n\nThe only operation available is splicing, in which exactly two lengths, wherever they lie, are joined end to end into one longer length. Splicing is skilled work, and the guild charges for it by the length it creates: splicing a length of 7 fathoms to one of 4 costs 11 fathoms' worth of effort, the sum of the two, and the resulting length of 11 fathoms then takes its place among the lengths in the yard, to be spliced onward in its turn. Silas may choose the order in which lengths are joined and which two to join at each step, so long as every step joins exactly two lengths and the process ends when only a single length remains.\n\nSilas wants to find the least total charge for turning all the lengths in the yard into one cable. He has noticed that some orders are cheaper than others: joining two huge lengths early means their large size is charged again every time the result is spliced again. He does not wish to try every possible order of joining, for the number of orders is astronomical.\n\nA digression: the ropewalk's walkers, who spin the hemp, walk backwards the whole length of the shed, an ancient habit. The apprentices are fed on bread and dripping. A gull sits on the roof every morning and looks down at the proceedings with unconcealed contempt.\n\nInput: line one gives N, the number of lengths. Line two gives N lengths.\n\nOutput: the minimum possible total charge.\n\nConstraints: N up to 2 * 10^5; each length up to 10^9; the answer fits in a 64-bit integer. At each step the cheapest move depends only on which two lengths are currently shortest, and the collection changes after every step.","clues":["exactly two lengths, wherever they lie, are joined end to end into one longer length","the resulting length of 11 fathoms then takes its place among the lengths in the yard","the least total charge","the cheapest move depends only on which two lengths are currently shortest, and the collection changes after every step"],"decoys":["the ropewalk's walkers, who spin the hemp, walk backwards the whole length of the shed","A gull sits on the roof every morning and looks down at the proceedings with unconcealed contempt"],"core":"Repeatedly merge two items at a cost equal to their sum, where the merged item goes back into the collection; minimise the total cost.","gloss":[["ropewalk","a long building where rope is made",true],["splicing","joining ropes by weaving their strands",true],["fathoms","units of length for rope and water depth, about 1.8 m",true],["taciturn","saying very little",true],["hemp","a plant fibre used for rope",true]],"why":{"gr-local":"A one-pass greedy over a fixed order does not apply; the choice changes as merged items re-enter the collection.","dp-interval":"Joining ranges in a fixed order would be range DP; here lengths may be joined in any order."},"tell":"Always combine the two cheapest, and the result goes back in: repeatedly take the two smallest from a structure that gives minimums.","task":"Print the minimum possible total charge for joining all lengths into one (joining two lengths costs their sum).","sample":{"in":"4\n4 3 2 6","out":"29","why":"Join 2+3 (5), then 4+5 (9), then 9+6 (15): 5+9+15 = 29."}},{"id":"sc-134","v":"iv-merge","dom":"canal locks","diff":"E","title":"The Lock Closures on the Wendover Cut","story":"The Wendover Cut is a stretch of canal winding through the chalk hills for twenty miles, with a flight of locks every few furlongs, and the Canal Trust's chief engineer, a fastidious man named Percival Nankivell, has spent the winter compiling a schedule of maintenance closures. Each closure is a period during which a lock is shut to traffic and the navigation notices must be updated: it begins on a stated day and ends on a stated day, and both the first and last day are included in the closure. The closures have been submitted by a dozen different gangs of workmen, each acting independently, and the list that has landed on Percival's desk is in no sensible order whatever.\n\nThe Trust wishes to publish a short list of 'periods of disruption', each of which is a continuous stretch of days during which at least one closure is in force somewhere on the cut, and in which no day is not covered by at least one closure. Where two closures overlap, or where one begins on the very day after another ends, there is no gap between them, and they must be reported as one single longer period. Two periods are separate only if there is at least one free day between them. The published periods should be given in chronological order.\n\nThe canal has a reputation for the quality of its pub landlords, and every lock has its own inn. The Trust's annual dinner features a roast which no one can identify. The chief engineer's moustache is considered an authority on weather, twitching when rain is imminent.\n\nInput: line one gives N, the number of closures. Each of the next N lines gives two integers, the first day and last day of one closure, in no particular order of closures.\n\nOutput: the merged periods, each on its own line as two integers, in order of first day.\n\nConstraints: N up to 10^6; days between 1 and 10^9; the first day of each closure is not later than its last day. The Trust wants the work to stay close to the effort of ordering the list, not to the square of its length.","clues":["Where two closures overlap, or where one begins on the very day after another ends","they must be reported as one single longer period","the list that has landed on Percival's desk is in no sensible order whatever","Two periods are separate only if there is at least one free day between them"],"decoys":["The canal has a reputation for the quality of its pub landlords","The chief engineer's moustache is considered an authority on weather"],"core":"Combine overlapping or touching ranges of days into continuous periods, given in no particular order.","gloss":[["furlong","an eighth of a mile",true],["navigation","the movement of boats along waterways",true],["closure","a period when something is shut",true],["continuous","unbroken",false],["fastidious","very particular about details",true]],"why":{"iv-sweep":"A count of simultaneous closures is not wanted; the question is for the merged periods themselves.","iv-greedy":"Choosing a largest compatible set is a different question."},"tell":"Sort the ranges by start, then extend the current block while the next range begins within or right after it.","task":"Print the merged closure periods, one per line, in order (periods that overlap or touch become one).","sample":{"in":"5\n1 3\n8 10\n2 6\n10 12\n15 18","out":"1 6\n8 12\n15 18","why":"1-3 with 2-6 gives 1-6; 8-10 with 10-12 gives 8-12."}},{"id":"sc-135","v":"iv-insert","dom":"hot springs","diff":"M","title":"The Bath Bookings of Bad Winterau","story":"The spa town of Bad Winterau has a grand bathhouse fed by natural hot springs, and its booking clerk, Hildegard Roth, keeps the reservation book for the private thermal suite. Each reservation in the book occupies the suite from a stated start hour to a stated end hour, counted in hours from the beginning of the month, and the bookings are entered in order of start hour. The bathhouse has a firm rule that no two reservations may overlap, and the book has been carefully kept so that all the reservations in it are already separated from one another by gaps of at least a little, and are already in order. Hildegard has never had to sort it, and she is proud of this.\n\nA distinguished guest, a retired admiral, has now asked for a block of time in the suite, from hour S to hour E. His booking is welcome, but with a condition: the admiral's presence takes precedence over any reservation that clashes with it. Rather than turn away the guests whose slots overlap his, the bathhouse's custom is to combine them: any existing reservations that overlap the admiral's block, or touch it, are absorbed with it into one single, longer reservation, running from the earliest start among them to the latest end among them. Reservations that do not touch his block are left untouched.\n\nHildegard must produce the updated book with the admiral's block inserted. The book is kept as a printed ledger with no room to spare, and she hates to copy it afresh, and particularly dislikes sorting it, since it was kept in order by the clerk before her. The book is long, having been kept for many years.\n\nThe town has a famous brass band that parades on Sundays, and the bathhouse serves a rather watery coffee in the lobby. The admiral is said to snore like a foghorn.\n\nInput: line one gives N and then the admiral's S and E. The next N lines each give a reservation's start and end hour, already sorted by start and with no two overlapping.\n\nOutput: the updated list of reservations, one per line, in order.\n\nConstraints: N up to 10^6; hours up to 10^9. A single sweep along the existing ledger, with no sorting, is expected.","clues":["all the reservations in it are already separated from one another by gaps of at least a little, and are already in order","any existing reservations that overlap the admiral's block, or touch it, are absorbed with it into one single, longer reservation","Reservations that do not touch his block are left untouched","dislikes sorting it"],"decoys":["The town has a famous brass band that parades on Sundays","The admiral is said to snore like a foghorn"],"core":"Insert one new range into a sorted list of non-overlapping ranges, merging whatever it touches, in one pass.","gloss":[["thermal","relating to heat",true],["precedence","priority over others",true],["absorbed","taken in and made part of",true],["clash","to conflict",true],["distinguished","highly respected",true]],"why":{"iv-merge":"That is for an unsorted pile of ranges; here the ledger is already ordered and disjoint, so no sorting is needed.","iv-sweep":"No counting of overlap is involved."},"tell":"A sorted disjoint list plus one new range: copy those that end before it, merge those that overlap it, copy the rest.","task":"Print the updated reservations, one per line, in order (any reservations the admiral's block overlaps or touches are joined to it).","sample":{"in":"4 4 8\n1 2\n3 5\n6 7\n9 10","out":"1 2\n3 8\n9 10","why":"The block 4-8 absorbs 3-5 and 6-7."}},{"id":"sc-136","v":"iv-greedy","dom":"carnival","diff":"M","title":"The Contests of the Midsummer Carnival","story":"The Midsummer Carnival at Kellerby runs for a single day, and its programme lists a bewildering number of contests: pie-eating, tug-of-war, a greasy-pole climb, an egg-and-spoon race, a baking competition, a dog show, and many others. Each contest has a published start time and a published finish time, counted in minutes from the opening of the gates. The programme is printed in no order that makes any sense; it was assembled by a committee, and the printer set the contests in the order in which the committee shouted them out.\n\nA famous judge, Dame Cordelia Fawkes, has been invited to attend as many of the contests as she can. Her rules are strict. She will watch a contest from beginning to end or not at all; she can only be at one contest at a time; and she can move from the end of one contest to the start of another at no cost, so that a contest beginning at the exact minute another ends is still attendable. Dame Cordelia wants to know the greatest number of contests she can attend in a day, though she does not much care which ones, as long as the number is as large as possible.\n\nDame Cordelia's reputation for fairness is such that the carnival committee dare not make a mistake. The committee chairman, a stout man named Horatio Pym, has already made a scene about the placement of the bunting. A brass band plays on the green, and the beer tent is doing a roaring trade. Rain is forecast for the late afternoon.\n\nInput: line one gives N, the number of contests. Each of the next N lines gives the start minute and finish minute of one contest.\n\nOutput: the largest number of contests that can be attended without any two overlapping.\n\nConstraints: N up to 10^6; minutes up to 10^9; the start is strictly before the finish. A tempting plan is to take the contest that starts earliest, or the one that is shortest, but both can lead a judge astray; the committee has also made clear that trying every combination of contests is out of the question.","clues":["She will watch a contest from beginning to end or not at all","she can only be at one contest at a time","the greatest number of contests she can attend","take the contest that starts earliest, or the one that is shortest, but both can lead a judge astray"],"decoys":["The committee chairman, a stout man named Horatio Pym, has already made a scene about the placement of the bunting","A brass band plays on the green, and the beer tent is doing a roaring trade"],"core":"Choose the largest set of time ranges that do not overlap each other.","gloss":[["bewildering","confusing because of the number or variety",true],["attendable","able to be attended",true],["programme","a list of events",true],["contest","a competition",true],["astray","off the right course",false]],"why":{"iv-sweep":"Counting how many overlap at once is a different question; here we pick a set that has no overlap.","dp-knapsack":"Each contest has equal value, so weighted selection is unnecessary."},"tell":"Maximum number of non-clashing ranges: sort by finishing time and keep each one that starts after the last chosen finish.","task":"Print the largest number of contests that can be attended with no two overlapping.","sample":{"in":"5\n0 6\n1 4\n3 5\n5 7\n8 9","out":"3","why":"Contests 1-4, 5-7 and 8-9."}},{"id":"sc-137","v":"iv-sweep","dom":"quarantine island","diff":"M","title":"The Beds of Saint Elmo's Lazaretto","story":"Off the harbour of Port Calder lies the small island of Saint Elmo, where for four centuries the port's ships have discharged sick crews and suspect cargo into a quarantine hospital known as the Lazaretto. The steward of the Lazaretto, a methodical woman named Beatrix Salmon, is planning a renovation and needs to know how many beds the island must be able to supply at the busiest moment in its recent history.\n\nFrom the register of the last ten years, Beatrix has extracted, for each patient, two numbers: the day on which they were admitted and the day on which they were discharged. Each patient occupied exactly one bed, from the whole of their admission day to the whole of their discharge day, both included. A patient discharged on day 40 and another admitted on day 40 therefore needed two separate beds that day, because the first had not yet left. There are tens of thousands of patients in the register, and their records were entered in the order in which the register's clerks happened to reach them, not in any chronological order.\n\nBeatrix does not need to know who occupied the beds, nor how long the average stay lasted. She needs only the largest number of patients present on the island on any single day. The architect has promised to build exactly that many beds, and not one more, to keep within the budget approved by the harbour commissioners.\n\nThe island is home to a colony of ring-tailed lizards, which the patients are encouraged to feed. The Lazaretto's chapel, though tiny, has an altar painting that scholars attribute to a pupil of Titian. Visitors are ferried over on Thursdays by a boatman called Ignatius.\n\nInput: line one gives N, the number of patients. Each of the next N lines gives the admission day and discharge day of one patient.\n\nOutput: the greatest number of patients present at any one time.\n\nConstraints: N up to 10^6; days up to 10^9, so Beatrix cannot afford a separate tally for each day of the ten years; admission day not later than discharge day. Her inspection of the register must be completed in about the time it takes to put the days in order.","clues":["from the whole of their admission day to the whole of their discharge day, both included","the largest number of patients present on the island on any single day","Beatrix cannot afford a separate tally for each day of the ten years","A patient discharged on day 40 and another admitted on day 40 therefore needed two separate beds"],"decoys":["The island is home to a colony of ring-tailed lizards","an altar painting that scholars attribute to a pupil of Titian"],"core":"From many time ranges, find the largest number of them that overlap at any single moment.","gloss":[["quarantine","isolation to prevent disease from spreading",true],["lazaretto","a hospital for people with infectious diseases",true],["methodical","orderly and systematic",true],["discharged","released from hospital",true],["commissioners","officials who oversee a matter",true]],"why":{"iv-greedy":"A largest non-overlapping selection would pick a set; here all patients are present and the count of overlap is wanted.","ps-diff":"Day-by-day tallies would work but the day range is far too wide for that."},"tell":"Peak simultaneous load: turn every range into an arrival and a departure, sort them, and keep a running count.","task":"Print the greatest number of patients present on any one day (admission and discharge days both count).","sample":{"in":"5\n1 5\n2 3\n4 8\n5 6\n9 10","out":"3","why":"On day 5 three patients are present: 1-5, 4-8 and 5-6."}},{"id":"sc-138","v":"iv-sortkey","dom":"desert caravans","diff":"H","title":"The Caravans to the Oasis of Qasr Adan","story":"Across the Rub al-Khali there runs a single track to the oasis of Qasr Adan, and on it, one morning, a number of camel caravans set out for the same well. The track is narrow and the dunes on either side are impassable, so a caravan can never overtake another; if a faster caravan catches up with a slower one ahead of it, it must fall in behind and travel at the slower one's pace for the rest of the journey. A caravan that is joined in this way by others becomes part of a single convoy, and a convoy arrives at the oasis as one: all its members reach the well at the same moment, namely the moment of the slowest one among those in front of it.\n\nThe oasis keeper, an old man named Yusuf al-Tamimi, has been told that N caravans started out on the same morning from different points along the track. For each caravan he has the distance it still had to travel from its starting point to the well, and the steady speed at which it would travel if nothing were in its way. A caravan that starts closer to the well is ahead of one that starts further away. Yusuf has no way of seeing the caravans from the well, only these records, and he wants to know how many separate convoys will actually arrive. Caravans that meet exactly at the well count as one convoy.\n\nThe oasis is famous for its dates, which are packed into sweet cakes, and for a small mosque whose minaret leans noticeably to the east. Yusuf's grandson keeps a pet falcon, which sits on a perch and appears to be perpetually offended. The heat in the afternoon is such that even the lizards seek shade.\n\nInput: line one gives N. Each of the next N lines gives, for one caravan, the distance still to travel and its speed. The caravans are listed in no order.\n\nOutput: the number of separate convoys that arrive at the oasis.\n\nConstraints: N up to 10^6; distances up to 10^9, all distinct; speeds up to 10^6. Simulating the journey minute by minute is out of the question; the question must be answered from the records alone, once they have been put in the proper order.","clues":["a caravan can never overtake another","A caravan that starts closer to the well is ahead of one that starts further away","all its members reach the well at the same moment, namely the moment of the slowest one among those in front of it","The caravans are listed in no order"],"decoys":["The oasis is famous for its dates, which are packed into sweet cakes","Yusuf's grandson keeps a pet falcon"],"core":"Cars on a road cannot overtake; count how many groups arrive, by ordering them by position and comparing arrival times.","gloss":[["oasis","a fertile spot in a desert with water",true],["convoy","a group of vehicles or animals travelling together",true],["caravan","a group of travellers crossing a desert together",true],["minaret","a tall tower of a mosque",true],["impassable","unable to be crossed",true]],"why":{"ms-next":"A structure for nearest-larger could be used, but the heart is ordering by the right key and taking one pass.","iv-sweep":"No overlap counting of time ranges is involved."},"tell":"Order the items by position, then walk from the front deciding who merges into whom by comparing arrival times.","task":"Print the number of separate convoys that arrive (caravans cannot overtake; ones that meet at the well count as one).","sample":{"in":"5\n2 2\n4 4\n12 1\n7 1\n9 3","out":"3","why":"Distances 2 and 4 arrive together; 7 and 9 arrive together; 12 arrives alone."}},{"id":"sc-139","v":"bt-xor","dom":"loom weaving","diff":"E","title":"The Punch Cards of the Jacquard Loom","story":"The silk mills of Lyonne still weave their brocades on antique Jacquard looms, in which the pattern is fed to the machine on a long chain of punched cards. Each card carries a number stamped in its margin, and in the mill's tradition every pattern card is made in a pair: a front card and a back card, bearing the identical number, so that the weaver can check one against the other. If a card is lost, the pattern cannot be woven correctly, and every pair is therefore kept in the mill's archive in a great box, shuffled together with every other pair.\n\nThe master weaver, Jacques Montaigu, has been reorganising the archive when he discovers that exactly one of the numbers in the box appears an odd number of times: all the others appear precisely twice, a front card and its back card, but one number appears only once, because the partner of that card has gone missing, probably when the mill was flooded in the spring. He wants to find that number, so that the lost partner can be recut. There are hundreds of thousands of cards, and they are thoroughly mixed. Jacques has no wish to sort them, because he would have to carry the whole box to the cutting room and the mill's floor is already cramped.\n\nThere is a belief among the weavers that the missing card is always the one for the pattern that happens to be in fashion that season. Jacques ignores this superstition. The mill cat is a large tortoiseshell who sleeps in a basket of silk waste. A shipment of raw silk from the east has been delayed.\n\nInput: line one gives N, the number of cards in the box (always odd). Line two gives the N numbers stamped on the cards, in no order.\n\nOutput: the single number that appears once.\n\nConstraints: N up to 10^6; numbers up to 10^9. Jacques insists on a single pass through the box, with a constant amount of memory: no notes, no tally sheets, and no sorting of the cards. Every other number appears exactly twice.","clues":["every pattern card is made in a pair","exactly one of the numbers in the box appears an odd number of times","a single pass through the box, with a constant amount of memory","Every other number appears exactly twice"],"decoys":["a belief among the weavers that the missing card is always the one for the pattern that happens to be in fashion","The mill cat is a large tortoiseshell who sleeps in a basket of silk waste"],"core":"Every value occurs twice except one; find the odd one out using constant memory in a single pass.","gloss":[["brocade","a rich fabric woven with raised patterns",true],["Jacquard loom","a loom controlled by punched cards",true],["antique","very old",true],["reorganising","arranging in a new order",true],["superstition","a belief not based on evidence",true]],"why":{"hs-freq":"A tally table would work but uses memory proportional to the number of distinct patterns, which the story forbids.","hs-seen":"Remembering what has been seen needs extra memory too."},"tell":"Pairs that cancel and one that remains, with constant memory: combine all values with a self-cancelling operation.","task":"Print the single number that appears once.","sample":{"in":"7\n6 1 6 9 1 4 4","out":"9","why":"Every other number appears twice."}},{"id":"sc-140","v":"bt-subsets","dom":"museum curation","diff":"M","title":"The Jury of the Calloway Collection","story":"The Calloway Museum has inherited a bequest of exhibits, each one a curious object collected by a Victorian physician, and the board of trustees must now decide which of them to display in the new east wing. The collection is small, as these things go: only N objects, N being at most eighteen, and each object has been assigned a weight of cultural significance by the curator, a whole number which may be positive or negative, a negative figure signifying that the object is, in the curator's opinion, an embarrassment that detracts from the others.\n\nThe trustees will choose a selection of objects, any number of them from none to all, and the significance of a selection is the total of the weights of the objects in it. The east wing has a peculiar architectural feature that can be set up only for an exact total: a plaque specifying a target significance T, which must be met precisely. The trustees want to know how many different selections of objects have a combined significance of exactly T. Two selections are different if they differ in at least one object, even if their totals are the same, and the empty selection counts as a valid selection if its total, which is zero, equals T.\n\nThe physician's collection includes a stuffed armadillo, a set of glass eyes, a tin bath, and an alarming quantity of bottled medical specimens. The museum cafe has been criticised for its prices. The chair of the trustees, a lady of formidable bearing, has a habit of tapping her cane during debates.\n\nThe curator, a precise man named Lancelot Pyke, has pointed out that with so few objects one can afford to look at every possible selection once, and that this is the sensible thing to do, provided that each selection is considered only once and the total is computed without any needless repetition of work.\n\nInput: line one gives N and T. Line two gives the N weights.\n\nOutput: the number of selections whose total is exactly T.\n\nConstraints: N up to 18; weights between -10^6 and 10^6; T between -10^8 and 10^8. The answer fits comfortably in a 64-bit integer. The number of objects is deliberately tiny so that the number of all possible selections, two multiplied by itself N times, is manageable.","clues":["only N objects, N being at most eighteen","any number of them from none to all","Two selections are different if they differ in at least one object","the number of all possible selections, two multiplied by itself N times, is manageable"],"decoys":["a stuffed armadillo, a set of glass eyes, a tin bath","The museum cafe has been criticised for its prices"],"core":"With very few items, look at every possible selection of them and count those with a given total.","gloss":[["bequest","property left to someone in a will",true],["trustees","people who manage something for others",true],["significance","importance",true],["detracts","takes away from",true],["physician","a doctor",true]],"why":{"bk-subsets":"Generating subsets with a recursive search finds them too; the tight bound on N and the 'every selection once' wording point at counting through all binary patterns.","dp-knapsack":"A subset-sum table is possible for small weights, but here weights can be negative and huge, and N is tiny."},"alt":["bk-subsets"],"tell":"A tiny number of items and every selection to be checked: each selection is one binary pattern of in/out choices.","task":"Print how many selections of objects (the empty one allowed) total exactly T.","sample":{"in":"5 6\n1 2 3 4 5","out":"3","why":"{1,5}, {2,4} and {1,2,3}."}},{"id":"sc-141","v":"bt-dp","dom":"regatta","diff":"H","title":"The Crew List of the Henley Eights","story":"The rowing club at Marlow is preparing its eight for the summer regatta, and the coach, a tireless woman named Philomena Ashby, has spent the winter measuring her squad of rowers. There are exactly N rowers and exactly N seats in the boat, N being at most sixteen, and every rower must be given exactly one seat, every seat taken by exactly one rower. A rower's suitability for a seat depends on the seat: the stroke seat needs rhythm, the bow seat needs balance, and the engine-room seats need raw power. Philomena has tested every rower in every seat and written down a cost for each pairing, a whole number representing how far that rower falls short of the ideal for that seat. Lower is better.\n\nPhilomena wishes to assign rowers to seats so that the total cost over the whole boat is as small as possible. It is not enough to give each seat to the rower with the lowest cost for it, because the same rower may be the best for several seats and cannot sit in more than one. And she cannot simply try every possible assignment: with sixteen rowers the number of ways to line them up is more than twenty trillion, and she has only an hour on the pontoon before the tide turns.\n\nThe club's boathouse smells of varnish and wet wool, and the veteran rowers tell stories of the great regatta of 1952, when a swan blocked the course. The cox, a diminutive boy named Fergus, has a surprisingly deep voice. The regatta's patron, a duke, is expected to attend, and the committee is nervous about the hospitality tent.\n\nPhilomena has noticed that the best way to assign the first few seats depends only on WHICH rowers have already been placed, not on the order in which they were placed. That observation seems important, but she cannot yet see how to use it.\n\nInput: line one gives N. The next N lines each give N costs: row i, column j is the cost of rower i in seat j.\n\nOutput: the minimum possible total cost of a full assignment.\n\nConstraints: N up to 16; costs up to 10^6. The answer fits in 32 bits.","clues":["N being at most sixteen","every rower must be given exactly one seat, every seat taken by exactly one rower","the same rower may be the best for several seats and cannot sit in more than one","depends only on WHICH rowers have already been placed, not on the order in which they were placed"],"decoys":["the great regatta of 1952, when a swan blocked the course","The cox, a diminutive boy named Fergus, has a surprisingly deep voice"],"core":"Assign each of N (at most 16) workers to a different task at minimum total cost; the state is which workers are already used.","gloss":[["regatta","a series of boat races",true],["pontoon","a floating platform",true],["cox","the person who steers a rowing boat",true],["suitability","how well something fits a purpose",true],["diminutive","very small",true]],"why":{"bk-perms":"Trying all orderings is correct but takes factorial time; the remark about the state being only 'which rowers are placed' invites reuse of work.","gr-pair":"Pairing best with best fails when the same rower is the best for several seats."},"alt":[],"tell":"Tiny N, each item used exactly once, and the future depends only on which items are used so far: remember the best cost for every set of used items.","task":"Print the minimum possible total cost of seating every rower in a different seat.","sample":{"in":"3\n4 2 8\n2 3 7\n3 1 6","out":"10","why":"Rower 1 -> seat 2 (2), rower 2 -> seat 1 (2), rower 3 -> seat 3 (6)."}},{"id":"sc-142","v":"bt-tricks","dom":"organ building","diff":"M","title":"The Stop Registrations of the Great Organ","story":"The Great Organ of Saint Hilda's has 30 stops, which are the knobs the organist draws out to select a family of pipes, and each stop is either drawn or pushed in. A particular arrangement of the stops is called a registration, and the church's librarian, a meticulous woman named Dorothea Quint, records each registration as a single whole number: the number is written in binary, the lowest digit standing for the first stop, the next for the second, and so on, with a digit of one meaning the stop is drawn and a digit of zero meaning it is pushed in.\n\nThe organist, Mr Ambrose Tilling, is composing a sequence of M pieces, and between each consecutive pair of pieces he must change the registration. Changing a stop takes him one second, for he has to reach over and pull or push it, and he can change only one stop at a time. He wants to know, for each consecutive pair of registrations, how many stops differ between the two, since that is the number of seconds he will spend between those two pieces; and in particular, how many seconds the whole performance will spend on changes.\n\nThe librarian also has a second question. For a handful of registrations, she wants to know whether exactly one stop is drawn, because such a registration is considered a 'solo voice' by the choir, and she keeps a separate shelf for them.\n\nThe church roof is leaking above the north transept, and a bucket sits in the aisle. The Reverend Hallam preaches long sermons about humility. The choir's tenors are rumoured to be on strike over the quality of the biscuits provided at rehearsals.\n\nInput: line one gives M. Line two gives M registrations (whole numbers below 2^30).\n\nOutput: on the first line, the total number of stop changes between consecutive registrations; on the second line, the number of registrations in which exactly one stop is drawn.\n\nConstraints: M up to 10^6. Mr Tilling's laptop is old and slow, so Dorothea wants each registration to be handled in a handful of machine operations; she refuses to convert numbers to text strings of digits and count characters, and she has been told that there is a way to flip, test and count the individual digits of a number directly.","clues":["the number is written in binary, the lowest digit standing for the first stop","how many stops differ between the two","exactly one stop is drawn","a way to flip, test and count the individual digits of a number directly"],"decoys":["The church roof is leaking above the north transept","The choir's tenors are rumoured to be on strike over the quality of the biscuits"],"core":"Count how many binary digits differ between two numbers, and test whether a number is a power of two, using direct digit operations.","gloss":[["registration","a chosen combination of organ stops",true],["transept","the arm of a cross-shaped church",true],["meticulous","very careful about detail",true],["binary","a number written with only zeros and ones",true],["humility","modesty",true]],"why":{"bt-xor":"Combining numbers to find differences is part of it, but the questions are about counting differing digits and spotting a single drawn stop, which need digit tricks beyond cancelling.","bt-subsets":"No selection of subsets is enumerated."},"alt":[],"tell":"Per-number questions about individual binary digits: differing digits via combine-then-count, single digit set via a clear-lowest-digit test.","task":"Print the total number of stops that differ between consecutive registrations, then how many registrations have exactly one stop drawn.","sample":{"in":"3\n1 3 8","out":"4\n2","why":"1 vs 3 differ in 1 stop, 3 vs 8 in 3 stops; 1 and 8 each have exactly one stop drawn."}},{"id":"sc-143","v":"ll-fastslow","dom":"pilgrim routes","diff":"M","title":"The Hostels on the Road to Santiago","story":"The old pilgrim road winds through the hills of northern Spain, and at intervals along it stand hostels where tired pilgrims can sleep. Each hostel keeps a register recording the name of the NEXT hostel on the road, to which a pilgrim should walk the following day; the last hostel in the chain, the one at the cathedral, records no next hostel at all. In this way the entire road is described by hostel after hostel, each pointing to the next. A cleric, Brother Anselmo, who has charge of the diocesan archive, has been given a newly discovered set of registers by a parish in the high sierra and is anxious to see whether they describe a proper road.\n\nHe suspects a mischief. A forger, or a muddled clerk, may have written the registers so that some hostel names, as its next stop, a hostel that was already visited earlier in the chain. In that case a pilgrim following the registers would walk in a circle forever and never reach the cathedral. Brother Anselmo has one pilgrim, a scrupulous young man named Tomas, and a handful of coloured pebbles, but he is not permitted to mark the hostels themselves, nor to keep a written list of hostels visited, because the archive is short of paper and the registers are fragile. Tomas must walk the road using only his own two legs and his wits.\n\nBrother Anselmo has two questions. First, does the road ever reach the cathedral, or does it loop? Second, if it does reach the cathedral, which hostel stands exactly in the middle of the road (in the case of an even number of hostels, the later of the two middle ones)?\n\nThe pilgrims of the region are partial to a thick soup made with chestnuts. A shop in the town of Burgos sells shells for hanging round the neck. The weather in the sierra is capricious.\n\nInput: line one gives N, the number of hostels. Line two gives, for each hostel numbered 1 to N, the number of its next hostel, or 0 if none. Hostel 1 is the start.\n\nOutput: LOOP if the road never reaches the cathedral; otherwise the number of the middle hostel.\n\nConstraints: N up to 10^6. Memory used must not grow with N.","clues":["each pointing to the next","a pilgrim following the registers would walk in a circle forever","not permitted to mark the hostels themselves, nor to keep a written list of hostels visited","Memory used must not grow with N"],"decoys":["The pilgrims of the region are partial to a thick soup made with chestnuts","A shop in the town of Burgos sells shells for hanging round the neck"],"core":"In a chain where each node names its successor, detect whether it loops and find the middle node, without marking nodes or using extra memory.","gloss":[["diocesan","belonging to a bishop's district",true],["scrupulous","very careful and honest",true],["sierra","a mountain range",true],["capricious","changing unpredictably",true],["forger","someone who makes fakes",true]],"why":{"hs-seen":"Remembering visited hostels would detect a loop, but the story forbids lists and marks.","ll-reverse":"Rewiring the registers is forbidden, since they are fragile."},"alt":[],"tell":"A chain with possible loops and no extra memory: send two walkers at different speeds; they meet if there is a loop, and the slower is at the middle when the faster ends.","task":"Print LOOP if the road never reaches the cathedral, otherwise the number of the middle hostel (the later of two middles).","sample":{"in":"5\n2 3 4 5 0","out":"3","why":"The road runs 1, 2, 3, 4, 5; the middle one is 3."}},{"id":"sc-144","v":"ll-reverse","dom":"barge towing","diff":"H","title":"The Barge Train of the Kennet Navigation","story":"On the Kennet Navigation, a canal that threads the water-meadows of Berkshire, cargo is carried in trains of narrowboats coupled together one behind the other, and a horse on the towpath draws the whole train at a walking pace. Every boat is coupled to exactly one boat behind it by a short tow-rope, and the lead boat is coupled directly to the horse. The boats are numbered in the order they are coupled, from the lead boat to the last, and each carries a different consignment.\n\nAt Newbury lock the canal company's rules demand that the train be re-coupled in groups. The harbourmaster, a bluff man named Cornelius Hatch, has decreed that the boats shall be taken in consecutive groups of K, counting from the lead, and that within each complete group of K boats the order shall be exactly reversed: the boat which was K-th in the group becomes first, and the boat which was first becomes K-th. If the train has a number of boats that is not a multiple of K, then the boats in the final incomplete group, fewer than K in number, are to be left exactly as they are. The groups themselves stay in their original order, only the boats within each complete group change places.\n\nThe boats cannot be lifted out of the water and set down elsewhere; there is no wharf for that. Cornelius may only undo and re-tie the tow-ropes that join neighbouring boats, and he is determined to do this without ever setting aside more than a few boats' worth of ropes at one time. The numbers painted on the boats must not be changed, for each marks a consignment.\n\nThe lock-keeper's cottage is notable for a garden of improbably large marrows. A heron has taken to fishing from the lock gate. The company's accountant, a worried man, insists on counting the ropes twice.\n\nInput: line one gives N, the number of boats, and K. Line two gives the N painted numbers from
