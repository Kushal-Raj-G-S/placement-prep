 and not by value; so he needs the two POSITIONS, smaller first. It is certain that exactly one such pair exists, Malatesta having already satisfied himself of that much while the client was taking off his cloak.\n\nThe nephew is slow at figures and knows it. The shop's sign is a trio of golden balls, repainted last year. There is a dog on a chain in the back room whose job is to look fiercer than it is, and a canary whose cage is covered at dusk.\n\nInput: line one gives N and B. Line two gives the N pledge values in shelf order.\n\nOutput: the two positions, counting from zero, smaller first.\n\nConstraints: N up to 10^6; values and B up to 10^9. The shelf must not be reordered, since the positions are what the clerk has to report.","clues":["values are unsorted","the two POSITIONS, smaller first","exactly one such pair exists"],"decoys":["A pawnbroker's shelf","The shop's sign is a trio of golden balls, repainted last year","a canary whose cage is covered at dusk"],"core":"In an unsorted list, find the positions of two items that add up to a target.","gloss":[["pawnbroker","a lender who takes goods as security for a loan",true],["pledges","items left as security",true],["ducats","old gold coins",true],["redeem","to buy back",true],["usurious","charging unfairly high interest",true]],"why":{"tp-ends":"Two markers need the data sorted, and sorting scrambles the positions you must report.","bs-exact":"That also needs sorted order and would also lose the original positions."},"tell":"Unsorted, and you must report the positions of the partner.","task":"Print the positions (counting from zero, smaller first) of the two pledges whose values add to B.","sample":{"in":"5 11\n2 5 4 15 9","out":"0 4","why":"2 + 9 = 11, at positions 0 and 4."}},{"id":"sc-024","v":"hs-group","dom":"locksmithing","diff":"M","title":"The Nuremberg Key Families","story":"The locksmiths of Nuremberg were the finest in Europe for two centuries, and the guild's filing system was one of their lesser secrets. A locksmith in the guild of Nuremberg files each master key under a short word stamped on its bow, the word being a mnemonic for the ward pattern inside the lock it opens. The practice began as a convenience and hardened into a rule, and the rule brought with it an oddity that the guild has never resolved.\n\nTwo keys belong to one family whenever the letters of one word can be rearranged to spell the other, so that 'tea', 'ate' and 'eat' are kin. The reason is mechanical: the stamp is cut from the same set of letter punches, and a key whose word uses the same punches in a different order was cut on the same bench from the same blank, whatever lock it was afterwards filed for. A key whose word shares no such relation with any other stands alone and is a family of one.\n\nThe guild secretary, preparing an inventory for the city council, wishes to know how many distinct families exist among the keys now held. He does not want the families written out, nor the keys within them listed; the council's form has a single box for the number. Identical words count as the same family, as one would expect, since two keys stamped with the very same word were certainly cut together.\n\nThe guild's hall has a door with eleven locks, only three of which work. An apprentice was expelled in 1623 for cutting a key for a man who turned out to be a burglar, and the case is still taught. The secretary's own key to the strongbox has been lost since Whitsun and he has told nobody.\n\nInput: line one gives N. Each of the next N lines gives one stamped word.\n\nOutput: the number of distinct families.\n\nConstraints: N up to 10^5, each of up to 20 lowercase letters. Comparing every word against every other letter by letter is too slow at this size.","clues":["letters of one word can be rearranged to spell the other","how many distinct families exist"],"decoys":["guild secretary","The guild's hall has a door with eleven locks, only three of which work","An apprentice was expelled in 1623 for cutting a key for a man who turned out to be a burglar"],"core":"Group words that are rearrangements of each other, and count the groups.","gloss":[["bow","the loop at the top of a key",true],["kin","relatives",true],["stamped","pressed in with a die",true],["mnemonic","something that helps you remember",true],["ward","the ridges inside a lock",true]],"why":{"hs-freq":"A tally counts one kind of thing; here the thing counted is a family, and you must first invent a label shared by every member.","tr-basic":"A prefix tree is for words that share beginnings; rearrangements share letters, not beginnings."},"tell":"Group by rearrangement; the trick is the key you give each item.","task":"Print the number of distinct families (words made of the same letters belong to one family).","sample":{"in":"6\ntea\nate\neat\ntan\nnat\nbat","out":"3","why":"{tea, ate, eat}, {tan, nat} and {bat}."}},{"id":"sc-025","v":"hs-cyclic","dom":"fairground","diff":"H","title":"The Bruges Raffle Drum","story":"The Bruges fair runs for eleven days in May and ends with a raffle whose prize, by tradition, is a live goose. The raffle drum at the Bruges fair holds N tickets, each printed with a number from 1 to N, which is how the printer was instructed and how it has always been done, one ticket for each number and no number left out.\n\nThis year the printing went wrong. A fault in the press duplicated some numbers and therefore omitted others, so that the drum now holds N tickets as it should, but some numbers appear twice or more and the numbers they displaced appear not at all. The fault was not noticed until the drum was sealed, and the guild of mercers, which runs the raffle, has ruled that the drum may not be unsealed; it may only be emptied onto the steward's table and examined there.\n\nThe steward must proclaim every number that never appears, in increasing order, so that anyone holding a ticket with such a number knows at once that it is a forgery and not merely unlucky. The steward's tally-board is tiny: apart from the tickets themselves, which he may freely rearrange, he may keep only a handful of notes. He has asked for a second board and been refused, the mercers having spent the year's budget on the bunting.\n\nThe goose, meanwhile, is kept in a pen behind the weighhouse and has bitten two children. A fire-eater performs at dusk by the belfry and is thought by the guild to be a hazard. The fair's accounts have not balanced since 1544 and nobody expects them to.\n\nInput: line one gives N. Line two gives the N ticket numbers as they came out of the drum, in no order.\n\nOutput: every number from 1 to N that does not appear, in increasing order, or the word NONE.\n\nConstraints: N up to 10^5; every ticket number lies between 1 and N. Extra memory must not grow with N, and the tickets themselves are the only working space available.","clues":["a number from 1 to N","omitted others","apart from the tickets themselves, which he may freely rearrange, he may keep only a handful of notes"],"decoys":["at the Bruges fair","The goose, meanwhile, is kept in a pen behind the weighhouse and has bitten two children","The fair's accounts have not balanced since 1544"],"core":"The values are exactly 1 to N with some repeated; find those that are missing, using almost no extra memory.","gloss":[["steward","an attendant who manages arrangements",true],["proclaim","to announce publicly",true],["omitted","left out",true],["duplicated","copied so it appears twice",true],["mercers","dealers in fine cloth",true]],"why":{"hs-seen":"A set solves it but needs memory proportional to N, which the steward lacks.","bt-xor":"That cancels pairs to find ONE odd item; here several numbers are missing and several duplicated."},"tell":"Every value lies between 1 and N, and spare memory is almost forbidden.","task":"Print every number from 1 to N that does not appear, in increasing order, or NONE.","sample":{"in":"6\n3 1 3 6 6 2","out":"4 5","why":"The tickets show 1, 2, 3 and 6; 4 and 5 never appear."}},{"id":"sc-026","v":"ms-next","dom":"ancient trackways","diff":"M","title":"The Ridgeway Cairns","story":"The Ridgeway is the oldest road in Britain, a chalk track along the crest of the downs that was in use before the stone circles were raised, and a trust now maintains it. Along the Ridgeway, a surveyor has planted N cairns, cairn i rising h[i] metres, at intervals along the path from the eastern end to the western. They are numbered in that order, and the trust's register lists their heights in that order, east to west.\n\nThe cairns are inspected each year by the waymarker, a cheerful fellow who whistles as he walks, and his report this year must answer a question the trust's surveyor has put to him. The surveyor wants to know, for every cairn on the path, the distance to the next cairn that actually stands out above it, because a cairn that is overtopped by nothing for miles is a cairn that sightseers will walk past without noticing. So the waymarker stands at the base of each cairn in turn and gazes westward along the path, wishing to learn how many cairns further on he must walk to reach one strictly taller than the cairn beside him. If the path ends first, he notes 0.\n\nThe waymarker has pointed out that walking westward from every single cairn until he finds a taller one means walking the whole path again and again, and that on the long gentle descent from the barrow at Wayland's Smithy he would be walking almost to the end each time. The surveyor has told him to think of something better.\n\nThe cairns are limewashed every spring. A trust volunteer has planted harebells at the eastern end against instructions. There is an argument with a farmer about a gate, as there always is, and the trust's solicitor has written a letter that has not been answered.\n\nInput: line one gives N. Line two gives the N cairn heights, east to west.\n\nOutput: N numbers, for each cairn the number of cairns onward to the nearest strictly taller one, or 0 if there is none.\n\nConstraints: N up to 10^6; heights up to 10^9.","clues":["gazes westward along the path","how many cairns further on he must walk","strictly taller than the cairn beside him"],"decoys":["a cheerful fellow who whistles as he walks","limewashed every spring","A trust volunteer has planted harebells at the eastern end against instructions"],"core":"For every item, how far along is the nearest strictly larger item on one side?","gloss":[["cairn","a pile of stones used as a marker",true],["waymarker","someone who marks a route",true],["limewashed","painted white with lime",true],["barrow","an ancient burial mound",true],["strictly","greater, not merely equal",true]],"why":{"sw-deque":"That needs the maximum of a fixed-width span; here no width is given, and the answer can be anywhere along the path.","ms-hist":"That asks about an area; this asks only for a distance."},"tell":"For each item, the next bigger one on a chosen side, and how far away it is.","task":"For each cairn, print how many cairns onward lies the nearest strictly taller one, or 0 if none.","sample":{"in":"6\n4 2 3 1 5 2","out":"4 1 2 1 0 0","why":"The first cairn (4) reaches the 5 four cairns on; the 2 reaches the 3 one on; and so on."}},{"id":"sc-027","v":"ms-hist","dom":"signwriting","diff":"H","title":"The Antwerp Hoarding","story":"The redevelopment of the Falconplein in Antwerp has been under way for four years and has reached the stage at which the hole in the ground must be hidden from the public. A hoarding contractor has erected N adjoining timber panels, each exactly one ell wide, panel i standing h[i] ells tall. The panels are of unequal height because they were salvaged from three previous jobs, and the contractor, a thrifty man named Lodewijk Verhoeven, sees no reason to cut good timber down to match bad.\n\nThe guild of sign-painters will commission a single rectangular banner to hang on the hoarding, and the terms are strict. The banner must hang wholly upon the panels: it may span any unbroken run of them, from one panel to as many as the whole row, but it can rise no higher than the lowest panel in that run, since a banner that overtopped a panel would flap loose at that point and tear in the first wind off the Scheldt. The banner is a plain rectangle; it cannot be stepped or notched to follow the tops of the panels.\n\nThe burgomaster, who must approve the commission, demands the greatest banner area obtainable, area being the number of panels spanned multiplied by the height in ells. He does not want to know where the banner will hang, only how large it can be, because the figure goes into a budget and the budget is already late.\n\nVerhoeven's foreman proposed trying every possible pair of end panels and looking along the run between them for the lowest, and gave up on the second afternoon. The hoarding has already been covered in posters for a punk concert, twice. A heron fishes in the flooded excavation and has acquired a following on the internet. The site's night watchman keeps a brazier and a radio.\n\nInput: line one gives N. Line two gives the N panel heights, left to right.\n\nOutput: the greatest obtainable banner area.\n\nConstraints: N up to 10^5, h[i] up to 10^9; the answer may need a 64-bit integer.","clues":["wholly upon the panels","no higher than the lowest panel in that run","the greatest banner area obtainable"],"decoys":["The guild of sign-painters will commission","A heron fishes in the flooded excavation and has acquired a following on the internet","The site's night watchman keeps a brazier and a radio"],"core":"The largest rectangle that fits entirely under a row of bars of different heights.","gloss":[["hoarding","a large board for advertisements",true],["ell","an old unit of length",true],["burgomaster","a town mayor",true],["wholly","completely",true],["salvaged","saved and reused",true]],"why":{"ms-next":"That gives a distance per bar; here you need how far each bar can extend on BOTH sides before a shorter one stops it.","sw-longest":"A moving stretch obeys a fixed rule; the best banner may start and end anywhere, and its height is set by the lowest panel inside."},"tell":"The largest rectangle under bars of different heights.","task":"Print the largest banner area, where area = (number of neighbouring panels spanned) x (the lowest panel in that run).","sample":{"in":"6\n2 1 5 6 2 3","out":"10","why":"Panels 5 and 6 (height 5 and 6) span 2 at height 5: area 10."}},{"id":"sc-028","v":"ms-match","dom":"metalworking","diff":"E","title":"The Sheffield Castings","story":"The foundry at the bottom of Attercliffe has cast steel since the days when Sheffield cast nothing else, and its present foundry-master, a woman named Josephine Hartshorn whose grandfather held the same post, keeps the works' records in a notation her grandfather devised. She records each casting sequence as a string of brackets: round, square and curly, each pair standing for a mould opened and later sealed. A round bracket is a sand mould, a square one an investment mould, a curly one a shell.\n\nMoulds are nested, because a complex casting is built as a mould within a mould within a mould, and the physical order of the work imposes a rule. A sequence is acceptable only if every opened mould is sealed by the SAME kind of bracket and the seals come in the exact reverse order of the openings, so that an inner mould closes before the one enclosing it. A mould sealed with the wrong kind of bracket means a sand mould was closed with a shell, which is impossible; a mould sealed out of order means a mould was closed while something still stood open inside it, which is worse than impossible, because it means molten steel somewhere it should not be. At the end of the sequence every mould must be sealed.\n\nA previous clerk merely compared how many of each kind appeared, declared the sequence sound if the counts matched, and admitted several faulty sequences, one of which cracked a casting worth four months of the works' profit. He is no longer employed there and the notation is now checked properly, which is to say by someone reading it through from the beginning.\n\nThe works' hooter still sounds at seven, to the annoyance of the new flats opposite. A cat called Crucible lives in the pattern shop. The company's apprentice scheme has a waiting list.\n\nInput: line one gives T, the number of sequences. Each of the next T lines gives one sequence as a string of the characters ( ) [ ] { }.\n\nOutput: for each sequence, YES if it is acceptable, NO otherwise.\n\nConstraints: T up to 10^4; each sequence of length up to 10^6.","clues":["sealed by the SAME kind of bracket","exact reverse order of the openings","merely compared how many of each kind appeared"],"decoys":["The works' hooter still sounds at seven, to the annoyance of the new flats opposite","A cat called Crucible lives in the pattern shop","The company's apprentice scheme has a waiting list"],"core":"Check that brackets are properly paired and nested.","gloss":[["foundry","a factory where metal is cast",true],["mould","a hollow shape that metal is poured into",true],["enclosing","surrounding",true],["faulty","broken or wrong",true],["investment mould","a mould made by coating a wax model",true]],"why":{"hs-freq":"Equal counts of each bracket do not prove correct order, as the story itself warns.","ms-next":"That looks for the next bigger value; here the partner must be the matching kind, and the order of closing is what matters."},"tell":"Nesting: the most recently opened thing must be the first to close.","task":"For each sequence print YES if every bracket is closed by the same kind in the right order, otherwise NO.","sample":{"in":"3\n([]{})\n([)]\n((","out":"YES\nNO\nNO","why":"The second closes ] before ); the third never closes."}},{"id":"sc-029","v":"ms-greedy","dom":"watchmaking","diff":"H","title":"The Neuchatel Serial","story":"The house of Perrin-Jaquet has made watches in Neuchatel since 1804, and it survived the quartz crisis by the simple expedient of ignoring it. A watchmaker there engraves each movement with a long serial of decimal digits, struck one digit at a time with a hand punch, recording the plate, the batch, the escapement pattern and a good deal else that only the house understands.\n\nBy a quirk of the guild's lottery, instituted in the eighteen-nineties to settle a dispute about numbering and never since repealed, the house is entitled to strike out exactly K digits from a serial, leaving the rest in their ORIGINAL order, with no digit moved relative to any other. The privilege falls to one movement a year, chosen by ballot, and the buyer of that movement receives the movement whose remaining number is numerically smallest, this being thought, by whoever drafted the rule, to be the more elegant outcome. Any leading zeros are dropped when the number is read, and if nothing remains the number is 0.\n\nGiven the serial and K, report the smallest number the house can leave. The present head of the house, Madame Perrin-Jaquet, has observed that one cannot simply strike out the K largest digits, since where a digit sits matters more than what it is, and that trying every possible choice of K digits would outlast the firm.\n\nThe house's workshop has north light and a bench that has been in use for six generations. A collector in Singapore has offered an indecent sum for the 1911 ledger and been refused. The cat, as in every watch house, is forbidden the workshop and sleeps there anyway.\n\nInput: line one gives N, the number of digits, and K. Line two gives the serial as a string of N digits.\n\nOutput: the smallest number obtainable, without leading zeros, or 0.\n\nConstraints: length up to 10^5; 0 <= K <= N.","clues":["strike out exactly K digits","in their ORIGINAL order","numerically smallest"],"decoys":["A watchmaker there engraves each movement","A collector in Singapore has offered an indecent sum for the 1911 ledger","The house's workshop has north light and a bench that has been in use for six generations"],"core":"Remove exactly K digits, keeping the order of the rest, so the remaining number is as small as possible.","gloss":[["engraves","carves into a surface",true],["quirk","an odd or unusual rule",true],["movement","the inner mechanism of a watch",true],["serial","a long identifying number",true],["escapement","the part of a watch that regulates its ticking",true]],"why":{"iv-sortkey":"Sorting the digits would break the required order; the result must be what remains of the original.","bk-subsets":"Trying every way to strike out K digits is exponential, and the serial has up to 100000 digits."},"tell":"Remove exactly K items, keep the order, make the result as small as possible.","task":"Print the smallest number you can leave by striking out exactly K digits, keeping the rest in order.","sample":{"in":"7 3\n1432219","out":"1219","why":"Strike 4, 3 and one 2 to leave 1 2 1 9."}},{"id":"sc-030","v":"hp-topk","dom":"sailing","diff":"M","title":"The Dubrovnik Regatta","story":"The Dubrovnik regatta is sailed every August in the channel between the old city and the island of Lokrum, and it is organised by a yacht club whose equipment budget has not been revised since Yugoslavia. The scoreboard receives finishing times one at a time, as the boats cross the line, shouted down from a man with a stopwatch on the mole and chalked up as they come; a time is never revisited once announced, because the man with the stopwatch does not write anything down himself and has never been persuaded to.\n\nThe fleet is large, with up to 10^6 recorded times when the junior and veteran classes are counted together with the main race. The harbour-master's slate, which is the only working surface on the mole, can hold at most K+1 entries at any moment, K being at most 100, and the harbour-master has resisted every suggestion that a larger slate be bought.\n\nAt the close of the day the commodore insists on learning the K-th smallest finishing time recorded, that is, the time of the boat placed K-th, because the club's prizes go to the first K boats and the last of them must be identified before the dinner. Sorting the full record is not possible within the slate, and in any case the full record no longer exists: the times went by as they were called.\n\nThe commodore's own boat has not finished a race in nine years. The club's trophy was melted down during the siege and replaced with a replica. A dispute about a port-and-starboard incident in the 1998 race is raised, without fail, at every annual general meeting.\n\nInput: line one gives N and K. Line two gives the N finishing times in the order they were called.\n\nOutput: the K-th smallest finishing time.\n\nConstraints: N up to 10^6, K up to 100 and at most N; times up to 10^9. Memory may grow with K but not with N.","clues":["one at a time","can hold at most K+1 entries","the K-th smallest finishing time"],"decoys":["The scoreboard receives finishing times","The commodore's own boat has not finished a race in nine years","A dispute about a port-and-starboard incident in the 1998 race"],"core":"From a stream of numbers, with memory for only about K of them, report the K-th smallest.","gloss":[["regatta","a boat race meeting",true],["commodore","a senior officer of a yacht club",true],["slate","a small writing tablet",true],["mole","a stone pier or breakwater",true],["fleet","all the boats taking part",true]],"why":{"iv-sortkey":"Sorting everything needs memory for all of it, which the slate cannot hold.","hp-two":"That tracks a median; here only the K-th item matters and K is small."},"tell":"A K-th best from a long stream, with memory for only about K items.","task":"Print the K-th smallest finishing time.","sample":{"in":"8 3\n52 17 40 63 28 35 71 22","out":"28","why":"In order: 17 22 28 ... so the third is 28."}},{"id":"sc-031","v":"hp-merge","dom":"postal history","diff":"M","title":"The Vienna Timetable","story":"The imperial post of the Habsburg lands was the wonder of Europe and the despair of its own clerks, running coaches from Laibach to Lemberg on a timetable published quarterly in three languages. K provincial depots each send the departure times of their coaches, already in ascending order, to the central bureau in Vienna, each depot writing out its own times on its own sheet, as its own postmaster has done since his appointment.\n\nThe bureau's clerk, a Hofrat of the fourth class named Aloys Pemmerl, must weave all of these lists into one single ascending timetable for the printer, who is waiting and who charges by the hour. He may take the sheets in any order he likes, but he may only read down each sheet from its top, since the sheets are gummed into a book at the bureau's insistence and cannot be held open at the middle; and he has desk room for one line from each sheet at a time, no more.\n\nThe Emperor takes a keen interest in punctuality, which is why the timetable exists at all and why Pemmerl's predecessor was transferred to Czernowitz. There are at most 1000 depots, and altogether up to 10^6 times; concatenating and re-sorting everything would waste the fact that every list arrives already ordered, besides needing a desk the bureau has not got.\n\nPemmerl keeps a tin of candied violets in his drawer. The bureau's stove smokes when the wind is in the east. A clerk in the next room has been writing a comic opera for eleven years and has read parts of it aloud to anyone who could not escape.\n\nInput: line one gives K. Each of the next K lines begins with a count M, then M departure times in ascending order.\n\nOutput: all the times from all the depots as one non-decreasing sequence.\n\nConstraints: at most 1000 depots; total times up to 10^6; each time up to 10^9.","clues":["already in ascending order","weave all of these lists into one single ascending timetable","at most 1000 depots"],"decoys":["The Emperor takes a keen interest in punctuality","Pemmerl keeps a tin of candied violets in his drawer","has been writing a comic opera for eleven years"],"core":"Combine K already-sorted lists into a single sorted list.","gloss":[["provincial","of a region away from the capital",true],["depots","storage or dispatch centres",true],["bureau","an office",true],["weave","to interleave together",true],["Hofrat","an Austrian civil-service rank",true]],"why":{"tp-merge":"That handles exactly two lists; with up to a thousand you need to know which list holds the smallest front item.","iv-sortkey":"Re-sorting everything ignores the order you were given and costs more."},"tell":"K sorted sequences to interleave into one.","task":"Print all the departure times from every depot as one ascending sequence.","sample":{"in":"3\n3 1 4 9\n2 2 6\n3 3 5 8","out":"1 2 3 4 5 6 8 9","why":"Interleave the three sorted lists."}},{"id":"sc-032","v":"hp-two","dom":"bullion trading","diff":"H","title":"The Amsterdam Quotations","story":"The bullion trade of Amsterdam is conducted in a room off the Damrak that smells of pipe smoke and wet wool, and its oldest dealer is a man named Gerrit van Oosterhout, who has bought and sold metal through three wars and two currency collapses. He receives prices for a single ingot, one quotation at a time, called across the room or brought in by runners, up to 10^6 of them in the course of a trading season.\n\nAbove his desk hangs a board, and the board is the reason the room is crowded. After EVERY quotation his board must display the middle price of all quotations received so far; if the count is even, the board shows the average of the two middle prices. The custom began as a safeguard: a dealer who posted the highest price would be accused of talking the market up, and one who posted the lowest of talking it down, so the middle is posted and nobody can complain. A quotation once received is never withdrawn or amended.\n\nRewriting and sorting the whole record upon each arrival would take days, as van Oosterhout's own clerk established one miserable winter by attempting it. The board must change before the next quotation arrives, and in a busy hour they arrive every few seconds.\n\nThe dealer's spectacles are always fogged by the canal mist, and he mutters about the cold. There is a stuffed heron in a case by the door that nobody can account for. A junior dealer has suggested posting an average of all the quotations instead, and has been told, at length, why that would be wrong, chiefly by reference to a single enormous quotation received in 1973.\n\nInput: line one gives N. Line two gives the N quotations in the order received.\n\nOutput: N lines, the board's figure after each quotation, each to one decimal place.\n\nConstraints: N up to 10^6; prices up to 10^9. Each update must cost only a small, slowly growing amount of work.","clues":["EVERY quotation his board must display","the middle price of all quotations received so far","one quotation at a time"],"decoys":["The dealer's spectacles are always fogged by the canal mist","There is a stuffed heron in a case by the door that nobody can account for","chiefly by reference to a single enormous quotation received in 1973"],"core":"After each new number arrives, report the median of everything received so far.","gloss":[["bullion","gold or silver in bulk",true],["ingot","a block of metal",true],["quotation","a stated price",true],["amended","changed",true]],"why":{"hp-topk":"That tracks one K-th item; the middle moves as the count grows.","bs-partition":"That works on two fixed sorted lists, not a growing stream."},"tell":"The median of a growing collection, after each arrival.","task":"After each quotation print the middle price so far (the average of the two middle prices when the count is even), to one decimal place.","sample":{"in":"5\n5 15 1 3 8","out":"5.0\n10.0\n5.0\n4.0\n5.0","why":"After 5: 5. After 5,15: 10. After 1,5,15: 5. After 1,3,5,15: 4. After 1,3,5,8,15: 5."}},{"id":"sc-033","v":"hp-greedy","alt":["iv-sweep"],"dom":"trade fairs","diff":"M","title":"The Leipzig Trestles","story":"The Leipzig trade fair has been held twice a year since the twelfth century, and the fairmaster's office still uses the vocabulary of the mediaeval charter, which is why its forms speak of trestles and pitches rather than stands and slots. At the fair, N stallholders each book a pitch for the half-open interval [s, e), the pitch being free again the very moment e arrives, so that a stallholder who books until noon is gone at noon and the next may have it at noon exactly.\n\nTrade is done from trestles, which the fair owns and hires out. A single trestle can serve only one stallholder at a time, but may be moved on to the next stallholder as soon as the previous one leaves, and the porters are paid to do precisely that. The trestles are interchangeable; no stallholder may demand a particular one, a point the charter is explicit about after a quarrel in 1498.\n\nThe fairmaster must now tell the carpenters how many trestles to bring from the store, and he is anxious not to pay for more than he needs, since each is carted in from a yard outside the city and charged for. He wishes to supply the fewest trestles that will serve every booking, every booking being one he has already accepted and must honour.\n\nThe fair's bell is rung by hand and the ringer is paid in beer. A dispute over the right to sell Nuremberg gingerbread has been before the city court for two years. The fairmaster's clerk has a stammer which worsens when the fairmaster is in the room, a fact the fairmaster has never noticed.\n\nInput: line one gives N. Each of the next N lines gives s and e for one booking.\n\nOutput: the smallest number of trestles that serves every booking.\n\nConstraints: N up to 10^5, times up to 10^9, s strictly less than e.","clues":["the pitch being free again the very moment e arrives","moved on to the next stallholder as soon as the previous one leaves","the fewest trestles"],"decoys":["The Leipzig trade fair has been held twice a year since the twelfth century","The fair's bell is rung by hand and the ringer is paid in beer","A dispute over the right to sell Nuremberg gingerbread"],"core":"The smallest number of resources needed so that no booking is turned away, reusing a resource as soon as its booking ends.","gloss":[["pitch","a spot for trading",true],["trestle","a movable table",true],["stallholder","a trader at a stall",true],["charter","a founding legal document",true],["half-open interval","includes the start but not the end",true]],"why":{"iv-greedy":"That picks the most bookings you can accept with one resource; here every booking must be served.","iv-merge":"Merging overlaps ignores how many are needed at once."},"tell":"Reuse the earliest-finishing resource; count the fewest needed to cover every booking.","task":"Print the smallest number of trestles that can serve every booking (a pitch is free again at the moment e arrives).","sample":{"in":"4\n0 30\n5 10\n10 15\n15 20","out":"2","why":"At most two bookings are ever on at once."}},{"id":"sc-034","v":"iv-merge","dom":"road works","diff":"E","title":"The Brenner Closures","story":"The Brenner is the lowest of the great Alpine passes and the busiest, and the road over it is in a permanent condition of being repaired. The wardens of the Brenner Pass close the road for repairs in stretches, each booking a closure window [s, e] by kilometre-marker, and the bookings are submitted independently by the gangs responsible for surfacing, for the avalanche galleries, for the drainage and for the tunnel linings, none of whom speaks to the others more than is strictly required.\n\nTwo bookings that overlap or share an endpoint are treated by the road authority as one continuous closure, because a motorist who can leave the road at kilometre forty and must immediately rejoin a closure at kilometre forty has not in any meaningful sense left the road. The authority therefore publishes not the bookings but the continuous closures, and its notices, which appear on the approach signs at Innsbruck and Vipiteno, must be accurate.\n\nGiven the N bookings in no particular order, the chief warden wants the final list of continuous closures, ordered from the lowest marker upward. He does not want to know which gang is responsible for which stretch, nor how many gangs are at work in any one place; the notice has room only for the stretches themselves.\n\nThe pass has a chapel at the summit and a petrol station that charges what it likes. Lorry drivers have an opinion about the Austrian toll system which they share freely. A marmot colony near kilometre sixty is protected and has halted one gang's work entirely, to the quiet satisfaction of the other three.\n\nInput: line one gives N. Each of the next N lines gives s and e for one booking.\n\nOutput: the continuous closures, one per line as two numbers, from the lowest marker upward.\n\nConstraints: N up to 10^5; markers up to 10^9; s no greater than e.","clues":["overlap or share an endpoint","treated by the road authority as one continuous closure","in no particular order"],"decoys":["The wardens of the Brenner Pass","A marmot colony near kilometre sixty is protected","The pass has a chapel at the summit and a petrol station that charges what it likes"],"core":"Combine overlapping ranges into the smallest set of non-overlapping ranges.","gloss":[["warden","an official guardian of a place",true],["marker","a post showing distance",true],["endpoint","the end of a range",true],["closure","a period when something is shut",true],["galleries","covered sections built to protect a road",true]],"why":{"iv-sweep":"That counts how many overlap at once; it does not produce the combined ranges.","iv-insert":"That adds one range to a list already sorted and disjoint; here everything is unsorted."},"tell":"Combine overlapping ranges into continuous blocks.","task":"Print the continuous closures, one per line, lowest marker first (bookings that overlap or share an endpoint become one).","sample":{"in":"5\n1 3\n8 10\n2 6\n10 12\n15 18","out":"1 6\n8 12\n15 18","why":"1-3 and 2-6 make 1-6; 8-10 and 10-12 make 8-12."}},{"id":"sc-035","v":"iv-insert","alt":["iv-merge"],"dom":"harbours","diff":"M","title":"The Cuxhaven Dredging Schedule","story":"Cuxhaven sits where the Elbe becomes the sea, and the channel that carries the container traffic up to Hamburg silts up as fast as it is cleared. The tide-gauge office there keeps the dredging schedule, and it already holds a schedule of dredging closures as a list of non-overlapping time bands, kept in ascending order. The order and the disjointness are not accidents: the office has maintained the list in that condition for thirty years, and the clerk who maintains it regards any suggestion that it might be otherwise as a slur.\n\nA new closure band arrives by telex from the waterways authority, naming a start and an end. It may fall into a gap between existing bands, in which case it simply takes its place; or it may overlap or touch one or several existing bands, in which case the harbour-master wants the updated schedule, with any bands the newcomer overlaps absorbed into it, so that the result is again a list of non-overlapping bands, still in ascending order.\n\nRe-sorting the entire schedule for a single arrival would be wasteful, and the clerk has said so in a memorandum of some length. The schedule runs to as many as 10^5 existing bands and the telexes arrive all day.\n\nThe gulls, as ever, are indifferent. The office's tide gauge is a float in a well and is checked against a staff gauge every Monday. A pilot boat crew has a long-running feud with a tug crew over a parking space, and the harbour-master has declined three times to adjudicate.\n\nInput: line one gives N and then the new band's s and e. Each of the next N lines gives one existing band, already in ascending order and non-overlapping.\n\nOutput: the updated schedule, one band per line, in ascending order.\n\nConstraints: up to 10^5 existing bands; times up to 10^9. One sweep along the schedule, with no sorting, is expected.","clues":["non-overlapping time bands, kept in ascending order","A new closure band arrives","Re-sorting the entire schedule for a single arrival would be wasteful"],"decoys":["The gulls, as ever, are indifferent","A pilot boat crew has a long-running feud with a tug crew over a parking space","The office's tide gauge is a float in a well"],"core":"Add one range to a sorted, non-overlapping list of ranges, combining it with any it overlaps.","gloss":[["dredging","clearing the bed of a waterway",true],["bands","ranges",true],["absorbed","taken in and combined",true],["schedule","a planned list of times",true],["silts up","fills with fine mud",true]],"why":{"iv-merge":"A fair way (add it and combine everything), but it throws away the sorted order you were given.","iv-sweep":"That counts overlaps; it does not build the updated list."},"tell":"One new range into a list that is already sorted and disjoint.","task":"Print the updated schedule, one band per line in ascending order, with any bands the new one overlaps or touches combined into it.","sample":{"in":"4 4 8\n1 2\n3 5\n6 7\n9 10","out":"1 2\n3 8\n9 10","why":"The new band 4-8 swallows 3-5 and 6-7 into 3-8."}},{"id":"sc-036","v":"iv-greedy","dom":"universities","diff":"M","title":"The Sorbonne Lectures","story":"The Great Hall of the Sorbonne is given over each spring to a season of public lectures, announced on a single poster that the university prints without any attempt to arrange them conveniently. N public lectures are announced, lecture i occupying the hours from s[i] to e[i], and because the hall is shared with the law faculty the times were fixed by whoever applied first. A lecturer may begin exactly when another ends, the porters having become adept at turning the hall round in no time at all.\n\nA single devoted scholar, an elderly woman who has attended the season every year since her retirement and who is known to the porters by name, wishes to attend as many whole lectures as possible. She will not walk out of a lecture before the end, considering it discourteous, and she cannot be in two places at once, so she is never present at two at once. She does not care in the least which lectures they are: the mathematics and the Mesopotamian pottery are of equal interest to her, and she has said so to the Dean.\n\nReport the largest number she can attend. The hall is draughty and the benches are hard, but she is undeterred. Her own first idea was to start with whichever lecture began earliest and carry on from there, which once cost her an entire afternoon on a single lecture about canals.\n\nThe Dean has a theory about the acoustics which the lecturers dispute. A bust of Richelieu in the vestibule is touched for luck by students before examinations, and its nose is correspondingly bright. The university's coffee is notorious.\n\nInput: line one gives N. Each of the next N lines gives s and e for one lecture.\n\nOutput: the largest number of whole lectures that can be attended with no two overlapping.\n\nConstraints: N up to 10^5, times up to 10^9, s strictly less than e.","clues":["as many whole lectures as possible","never present at two at once","may begin exactly when another ends"],"decoys":["The hall is draughty and the benches are hard","A bust of Richelieu in the vestibule is touched for luck by students","The Dean has a theory about the acoustics which the lecturers dispute"],"core":"Choose the largest set of intervals that do not overlap.","gloss":[["devoted","very committed",true],["scholar","a learned person",true],["occupying","taking up",true],["vestibule","an entrance hall",true],["undeterred","not put off",true]],"why":{"hp-greedy":"That finds how many resources are needed to serve every booking; here you choose which bookings to accept.","dp-linear":"A table over the lectures would also work but is slower; sorting by ending time is the whole decision."},"tell":"Choose the most non-overlapping bookings; sort by ending time.","task":"Print the largest number of whole lectures one person can attend with no two overlapping (a lecture may start when another ends).","sample":{"in":"5\n1 3\n2 5\n4 6\n6 8\n5 9","out":"3","why":"Lectures 1-3, 4-6 and 6-8 do not overlap."}},{"id":"sc-037","v":"iv-sweep","alt":["hp-greedy"],"dom":"railways","diff":"M","title":"The Restaurant Car","story":"The Compagnie Internationale des Wagons-Lits is refitting the restaurant car of the Orient Express, and the question of how many seats it should contain has become a matter of some feeling among the staff. To settle it, the company has produced the service records: arrival and departure times are logged for N parties, party i being seated from a[i] until b[i], and a party leaving at the very minute another arrives has already left, the stewards being practised at clearing a table while the next guests are still in the corridor.\n\nThe head waiter, Monsieur Dufour, wants to know how many seats the car must be fitted with, which is to say he needs the largest number of parties dining at the same moment anywhere in the records. He does not want the total number of parties served, which the company's accountants have already produced and which he regards as beside the point; nor the length of the average meal, which the chef has produced and which he regards as propaganda.\n\nThe records were entered by whichever steward was free, so they are in no order of time, and they run to many tens of thousands of parties across several seasons. Monsieur Dufour has also observed that the minutes themselves run into the billions on the company's clock, so a tally kept for every possible minute is out of the question.\n\nThe chef, meanwhile, is quarrelling with the wine steward about the vintage. The car's marquetry panels are by a Belgian firm that no longer exists. A spoon stolen in 1956 was returned anonymously in 1991 with a note of apology.\n\nInput: line one gives N. Each of the next N lines gives a and b for one party.\n\nOutput: the greatest number of parties seated at any one moment.\n\nConstraints: N up to 10^5, times up to 10^9, a no greater than b.","clues":["the largest number of parties dining at the same moment","has already left"],"decoys":["The chef, meanwhile, is quarrelling with the wine steward about the vintage","The car's marquetry panels are by a Belgian firm that no longer exists","A spoon stolen in 1956 was returned anonymously in 1991 with a note of apology"],"core":"The largest number of ranges that overlap at a single instant.","gloss":[["vintage","the year a wine was made",true],["steward","a servant who waits on guests",true],["logged","written down in a record",true],["marquetry","decorative inlaid woodwork",true]],"why":{"hp-greedy":"A fair alternative: it reaches the same number by reusing the earliest-free seat.","iv-merge":"That produces combined blocks, not a count of overlaps at one moment."},"tell":"The most things happening at the same moment.","task":"Print the greatest number of parties dining at the same moment (a party leaving at the minute another arrives has already left).","sample":{"in":"4\n1 4\n2 6\n3 5\n6 8","out":"3","why":"Between minutes 3 and 4 the first three parties are all seated."}},{"id":"sc-038","v":"iv-sortkey","dom":"festivals","diff":"H","title":"The Binche Procession","story":"The carnival of Binche is older than any record of it and is guarded by its town with a ferocity that outsiders find hard to credit. Its central event is the procession of the Gilles, who wear hats of ostrich plumes so tall that the wearer must duck under the tram wires, and the order in which they walk is fixed by custom and argued over all year.\n\nThis year the marshal has lost the running order and must rebuild it from the performers' own statements. N performers line up for the procession, and each performer is described by a pair (h, k): h is the height of the hat, and k is the number of performers standing IN FRONT of her whose hats are at least as tall as hers. Each performer gave her own pair from memory, having been asked at the end of last year's procession what she could see ahead of her, and the town's archivist wrote them down in the order the answers came in.\n\nThe marshal has these pairs in no particular order and wishes to reconstruct the one line-up that agrees with every performer's description, from the front of the procession to the back. It is promised that such a line-up exists and that it is the only one. He does not want to know who is where by name, only the sequence of hat heights.\n\nThe plumes are hired from a firm in Brussels at a cost the town council publishes reluctantly. Oranges are thrown into the crowd on the final day and it is an offence to throw one back. A film crew was expelled in 1987 for reasons the town will not discuss with journalists.\n\nInput: line one gives N. Each of the next N lines gives h and k for one performer, in no particular order.\n\nOutput: the N hat heights in line-up order, front to back.\n\nConstraints: N up to 2000; heights up to 10^6; 0 <= k < N.","clues":["k is the number of performers standing IN FRONT of her whose hats are at least as tall as hers","reconstruct the one line-up","in no particular order"],"decoys":["The carnival of Binche is older than any record of it","Oranges are thrown into the crowd on the final day","A film crew was expelled in 1987 for reasons the town will not discuss"],"core":"Rebuild an ordering from each item's (size, how many items at least as big stand before it).","gloss":[["marshal","an official who organises a procession",true],["procession","a parade",true],["performers","people who take part in a show",true],["plumes","large feathers",true],["archivist","a keeper of records",true]],"why":{"bk-perms":"Trying every ordering is factorial; the right sorting key makes it one pass.","dp-lis":"Nothing here asks for a longest chain."},"tell":"Choosing the right sort key turns the rebuild into a single pass.","task":"Print the hat heights of the line-up, front to back, that agrees with every performer's (h, k).","sample":{"in":"6\n7 0\n4 4\n7 1\n5 0\n6 1\n5 2","out":"5 7 5 6 4 7","why":"Check the last 7: exactly one 7 or taller stands in front of it."}},{"id":"sc-039","v":"bt-xor","dom":"coinage","diff":"M","title":"The Kremnica Dies","story":"The mint at Kremnica has struck coin since 1328 and is the oldest working mint in the world, a fact the town puts on its road signs. The mint stamps each coin die with an identification number, and every die is used in a matched pair so that the pair can be compared for wear: when the two faces of a pair begin to differ, both are withdrawn and recut, which is how the mint has kept its coin consistent for seven centuries.\n\nOne die, however, was used alone after its twin cracked. It happened during the silver shortage, when the mint was running three shifts and the warden of the day signed off a batch he should not have signed off, and the resulting coins are now a famous variety among collectors and a quiet embarrassment to the mint. The present warden has been instructed by the ministry to identify the die in question.\n\nShe has the list of N die numbers, taken from the vault in whatever order they came off the racks, and the vault's counting-board has room for only a few numbers beyond the list itself, the vault being a strongroom and not an office. She may read the list through as many times as she likes but may not copy it out, sort it, or carry it upstairs. Report the number of the unpaired die.\n\nThe mint's museum sells replica thalers to tourists. A fire in 1636 destroyed the records of the preceding century, which is why the mint's own history before that date is vague. The warden's predecessor retired after an argument about the alloy.\n\nInput: line one gives N. Line two gives the N die numbers in no order.\n\nOutput: the number of the one die that appears an odd number of times.\n\nConstraints: N odd, up to 10^6, each number up to 10^9. Every other die number appears exactly twice, and extra memory must not grow with N.","clues":["matched pair","used alone","room for only a few numbers beyond the list itself"],"decoys":["The mint at Kremnica has struck coin since 1328","The mint's museum sells replica thalers to tourists","A fire in 1636 destroyed the records of the preceding century"],"core":"Every item appears twice except one; find it using almost no extra memory.","gloss":[["mint","a place where coins are made",true],["die","a metal stamp used to strike coins",true],["warden","an official keeper",true],["twin","its identical partner",true],["thaler","an old silver coin",true]],"why":{"hs-freq":"A tally needs memory proportional to the list, which the counting-board lacks.","hs-cyclic":"That needs the values to lie between 1 and N; here they reach a billion."},"tell":"Pairs cancel, and extra memory is nearly forbidden.","task":"Print the one die number that appears an odd number of times.","sample":{"in":"7\n4 9 4 2 9 7 2","out":"7","why":"4, 9 and 2 each appear twice; 7 appears once."}},{"id":"sc-040","v":"bt-subsets","alt":["bk-subsets"],"dom":"spice trade","diff":"M","title":"The Zanzibar Coffers","story":"The spice-merchant Abdulrahman bin Salim keeps a warehouse on the shore road at Zanzibar, below the old fort, and his trade in cloves has made him rich enough to be worth taxing and not quite rich enough to be left alone. He owns N sealed coffers, the i-th holding v[i] gold dinars, and the seals are his own, stamped with a device his grandfather brought from Muscat.\n\nA tax assessor has arrived from the mainland with a warrant and a clerk. He insists on examining some selection of coffers, any selection including the empty one, which the merchant finds absurd and the assessor defends by reference to the regulation as written. The sultan, who has taken a personal interest for reasons connected with a disputed cargo of ivory, will pardon the merchant only if the combined value of the chosen coffers equals exactly S dinars, where S may be as large as 10^9.\n\nThe sultan's question, put to his own treasurer rather than to the merchant, is this: in how many different selections does the combined value equal S? Two selections differ if they include different coffers, even if their totals are the same, and a coffer is either in a selection or it is not; none may be opened and part of its contents taken.\n\nThe merchant has few coffers but very large sums in them, N being at most 18, which is why his grandfather preferred a few strong boxes to many weak ones. The warehouse cats are fed on fish heads and are a byword in the quarter. The assessor's clerk has a cough that the merchant hopes, uncharitably, will carry him off before the audit concludes. A dhow from Sur is overdue and the merchant has not slept well.\n\nInput: line one gives N and S. Line two gives the N coffer values.\n\nOutput: the number of selections of coffers whose values total exactly S.\n\nConstraints: N up to 18; each value up to 10^9; S up to 10^9. The answer fits in a 64-bit integer.","clues":["N being at most 18","any selection including the empty one","S may be as large as 10^9","how many different selections does the combined value equal S"],"decoys":["The spice-merchant Abdulrahman bin Salim","The warehouse cats are fed on fish heads","A dhow from Sur is overdue and the merchant has not slept well"],"core":"Count the subsets with a given total, when there are very few items but the total can be huge.","gloss":[["coffers","strong boxes for valuables",true],["dinars","old gold coins",true],["assessor","an official who judges value",true],["pardon","to forgive",true],["dhow","a traditional Arab sailing boat",true]],"why":{"dp-knapsack":"A table indexed by the total would be 10^9 wide; with so few items, trying every subset is cheaper.","bk-subsets":"Also enumerates subsets and is a fair alternative; the bit-mask form is the compact one."},"tell":"A tiny N (about 18) and a huge target: enumerate every subset.","task":"Print how many selections of coffers (the empty one allowed) total exactly S dinars.","sample":{"in":"4 7\n2 3 4 5","out":"2","why":"{2,5} and {3,4}."}},{"id":"sc-041","v":"bt-dp","dom":"opera","diff":"H","title":"The Milan Impresario","story":"Signor Gualtiero Bassani has been an impresario in Milan for thirty years, which is to say he has been bankrupt three times and celebrated twice. He is assembling a season, and a season is a matter of arithmetic before it is a matter of art. He has N tenors under consideration and N operas to fill, N being at most 16, and his agent has produced a table: engaging tenor i for opera j costs c[i][j] lire, a figure that takes in the fee, the lodging, the tenor's wife and whatever else the tenor's representative has thought to put in it.\n\nThe costs vary wildly and not sensibly. A tenor who is cheap in one opera may be ruinous in another, because he has sung the first a hundred times and must learn the second, or because he has quarrelled with the conductor of one and not the other. Every tenor must sing exactly one opera, since a tenor engaged for the season and left idle must still be paid, and every opera must be sung by exactly one tenor, since the subscribers have bought tickets for all of them.\n\nThe impresario wants the least total cost of such an assignment. Simply trying all N! pairings would exceed the season, as his nephew demonstrated with a pencil and a great deal of paper. He has also noticed that once he has decided which tenors are already placed, it makes no difference at all in what order he placed them: what the remaining choices cost depends only on who is left.\n\nThe accountant, who is a gloomy man, weeps at every figure. The theatre's chandelier was lowered onto a dowager in 1894. A claque in the upper gallery can be hired for forty lire and the impresario budgets for it without writing it down.\n\nInput: line one gives N. The next N lines give N costs each: row i, column j is the cost of tenor i in opera j.\n\nOutput: the least total cost of a complete assignment.\n\nConstraints: N up to 16; each cost up to 10^6.","clues":["N tenors under consideration and N operas to fill, N being at most 16","exactly one opera","exactly one tenor","the least total cost","it makes no difference at all in what order he placed them"],"decoys":["accountant, who is a gloomy man, weeps at every figure","The theatre's chandelier was lowered onto a dowager in 1894","A claque in the upper gallery can be hired for forty lire"],"core":"Assign N workers to N jobs at least total cost, when N is small enough to remember which jobs are already taken.","gloss":[["impresario","a manager of theatrical productions",true],["tenor","a male singer",true],["lire","old Italian money",true],["engaging","hiring",true],["claque","a group paid to applaud",true]],"why":{"gr-pair":"Matching the cheapest pairs first fails because early choices block later ones.","bt-subsets":"That counts selections; here the state must remember WHICH jobs are used while the assignment is built."},"tell":"N about 16 and a one-to-one assignment: remember which are used.","task":"Print the least total cost of giving every tenor a different opera.","sample":{"in":"3\n9 2 7\n6 4 3\n5 8 1","out":"9","why":"Tenor 1 -> opera 2 (2), tenor 2 -> opera 1 (6), tenor 3 -> opera 3 (1)."}},{"id":"sc-042","v":"bt-tricks","dom":"railway signalling","diff":"E","title":"The Crewe Signal-Box","story":"Crewe is the busiest junction on the West Coast line and its signalling has been rebuilt four times without ever being simplified. The signal-box keeps a status word for each of its signals: a 32-bit number in which every set bit means one lamp is lit, the bits standing for the aspects, the route indications, the track circuits and a dozen other things that the men in the box read at a glance and that nobody else can read at all.\n\nThe regional inspector, Mr Haverfield, is compiling a report on lamp failures, a subject on which he has become monomaniacal since a signal at Basford Hall was found dark for three weeks. He sends in 10^6 status words, taken from the box's recording drum over a period of months, and wishes to learn, for each, how many lamps are lit, so that the fault log can be filled in at once. He wants the count only, not which lamps, and he wants one figure per word in the order the words were recorded.\n\nReading each of the 32 positions for every word would be wasteful when only a handful of lamps are usually lit, a point the box's own relief signalman made to the inspector and which the inspector has conceded in writing. He has also asked, in a postscript, to be told which of the words have precisely one lamp lit, since a single lamp usually means the box has been switched out.\n\nThe box has a stove and a kettle and a cat that is officially not there. A model of the layout, built by a signalman over eleven years, hangs in the mess room. The drum's paper tape jams in damp weather and is beaten with a ruler.\n\nInput: line one gives M. Line two gives the M status words.\n\nOutput: on the first line, M counts of lit lamps in order; on the second line, the number of words with precisely one lamp lit.\n\nConstraints: M up to 10^6; each status word below 2^32.","clues":["32-bit number","every set bit means one lamp is lit","how many lamps are lit","only a handful of lamps are usually lit","precisely one lamp lit"],"decoys":["so that the fault log can be filled in at once","A model of the layout, built by a signalman over eleven years, hangs in the mess room","The box has a stove and a kettle and a cat that is officially not there"],"core":"Count how many 1-bits are set in each of many numbers, quickly.","gloss":[["signal-box","a small building from which railway signals are controlled",true],["status word","a number that records the state of something",true],["lit","switched on",true],["monomaniacal","obsessed with one subject",true],["aspects","the colours a railway signal can show",true]],"why":{"bt-xor":"That cancels pairs to find an odd one out; this counts set bits.","hs-freq":"That counts occurrences of values; here you count bits inside a single number."},"tell":"Count the set bits of a number.","task":"Print, for each status word, how many lamps are lit; then print how many words have exactly one lamp lit.","sample":{"in":"4\n5 8 255 0","out":"2 1 8 0\n1","why":"5 is 101 (two lit), 8 is 1000 (one), 255 has eight, 0 has none; only 8 has exactly one."}},{"id":"sc-043","v":"ll-fastslow","dom":"lighthouses","diff":"M","title":"The Scottish Beacon Chain","story":"Before the telegraph reached the west coast, the Commissioners of Northern Lights maintained a chain of beacons by which word of a wreck could be passed from headland to headland. A lighthouse chain on the Scottish coast joins N beacons, each knowing only the beacon after it; the last beacon knows no successor, and no beacon knows the one behind it, because the sight-lines were cut one way along the coast and never surveyed in the other direction.\n\nEach beacon has a value engraved on its lintel, a number assigned when it was built, and the Commissioners have asked the present keeper for one particular figure. Standing at the first beacon, she can walk the chain once from first to last, following each beacon's instruction to the next, but she cannot count the beacons beforehand and has no list of them: the register was lost when the Commissioners' office at Oban burned in 1901 and has never been reconstructed. Yet at the end of that single walk, she must name the value engraved on the middle beacon, and where N is even she must name the second of the two middle ones.\n\nShe may carry what she can hold in her head, which is to say a few numbers, and she cannot retrace her steps once she has moved on, since the path between two beacons runs one way round a cliff and the tide takes it.\n\nThe chain is still lit once a year on the anniversary, chiefly for photographers. A seal colony at the third beacon has been counted annually since 1963. The keeper's predecessor wrote a monograph on lichens which is held in some regard by people who care about lichens.\n\nInput: line one gives N. Line two gives the N engraved values, from the first beacon to the last.\n\nOutput: the value on the middle beacon.\n\nConstraints: N up to 10^6; values up to 10^9. Extra memory must not grow with N.","clues":["each knowing only the beacon after it","cannot count the beacons beforehand","that single walk","the middle beacon"],"decoys":["A lighthouse chain on the Scottish coast","A seal colony at the third beacon has been counted annually since 1963","wrote a monograph on lichens which is held in some regard"],"core":"Find the middle item of a one-way chain in a single pass, without knowing its length.","gloss":[["beacon","a signal fire or light",true],["engraved","carved into a surface",true],["successor","the one that follows",true],["lintel","the stone across the top of a door",true],["monograph","a detailed study of one subject",true]],"why":{"ll-reverse":"Reversing the chain rewires links but does not locate the middle.","hs-index":"Storing every beacon by position needs memory for the whole chain."},"tell":"The middle of a one-way chain, in one pass, with the length unknown.","task":"Print the value engraved on the middle beacon (the later of the two middle ones if N is even).","sample":{"in":"5\n10 20 30 40 50","out":"30","why":"The third of five."}},{"id":"sc-044","v":"ll-reverse","dom":"rail travel","diff":"E","title":"The Trans-Siberian Carriages","story":"At Vladivostok the Trans-Siberian is made up for its return journey, and the making-up is done in a yard laid out in 1908 for shorter trains than the ones that use it now. The carriages of the Trans-Siberian, N in all, are coupled one behind another, each carriage knowing only the one it is coupled to, because the coupling records are kept on a plate at the rear of each carriage and there is no corresponding plate at the front.\n\nThe yardmaster wishes to turn the whole train around so that the last carriage leads and the first trails. The reason is the restaurant car, which must sit behind the locomotive on the westbound run and ahead of it on the eastbound, a rule that dates from a minister's complaint about smoke and that has survived both the revolution and the end of steam.\n\nThe siding has no spare track: the carriages must be re-coupled in place, without moving them to a second track or copying the list. The yard's only spare road has been occupied since March by a crane that cannot be moved until a part arrives from Yekaterinburg. Report the new order from the engine's end.\n\nThe samovar in carriage four has been in service since the Brezhnev era and is the subject of a preservation campaign. A conductor keeps a cactus on the window ledge of her compartment. The yard cat has produced four kittens in the brake van and the yardmaster has been told about it by everyone except the conductor responsible.\n\nInput: line one gives N. Line two gives the N carriage numbers from the engine's end to the tail.\n\nOutput: the N carriage numbers after the turning, from the engine's end.\n\nConstraints: N up to 10^6; carriage numbers up to 10^9. Only the couplings between neighbours may be altered, and extra memory must not grow with N.","clues":["each carriage knowing only the one it is coupled to","re-coupled in place","without moving them to a second track or copying the list"],"decoys":["The yardmaster wishes to turn the whole train around","The samovar in carriage four has been in service since the Brezhnev era","The yard cat has produced four kittens in the brake van"],"core":"Reverse a one-way chain of items in place.","gloss":[["coupled","joined together",true],["yardmaster","the officer in charge of a railway yard",true],["siding","a short side track",true],["trails","comes last",true],["samovar","a Russian urn for heating water",true]],"why":{"ll-dummy":"A dummy front node helps when the first item might be deleted; here nothing is deleted.","tp-ends":"That reverses an array by swapping from both ends; a one-way chain cannot be walked backward."},"tell":"Reverse a linked list in place.","task":"Print the carriage numbers after the train is turned around.","sample":{"in":"5\n1 2 3 4 5","out":"5 4 3 2 1","why":"The order is reversed."}},{"id":"sc-045","v":"ll-dummy","dom":"church bells","diff":"M","title":"The Bell-Ringers' Roll","story":"St Mary's has a ring of eight and a band of ringers who have fallen out with one another in every possible combination over the past forty years. The bell-ringers' roll is a chain of N entries, each holding a peal number and knowing only the entry after it, kept in that form since the Victorian restoration because the roll is written on a single long strip pasted into the tower book.\n\nA difficulty has arisen over the peals rung during the incumbency of a previous vicar, which the diocese has ruled were not properly recorded and must come out of the roll. The present vicar therefore decrees that every entry bearing the forbidden number V be struck from the roll, wherever it stands, and V may well appear in the very first entry as well as in later ones, even several in a row, since the peals in question were rung in a burst one summer.\n\nThe chain must be edited where it stands, the strip being pasted in and the tower book being, by the diocese's own ruling, the primary record. What survives must stay in its original order, and the vicar wants the new first entry, since the roll is read aloud from its head at the annual meeting.\n\nThe tenor bell is cracked and has been rung half-muffled since 2011. A ringer has been banned from the tower twice and reinstated twice. The tower captain keeps a biscuit tin to which he alone has the key, a fact that is resented more than the bell.\n\nInput: line one gives N and V. Line two gives the N peal numbers in roll order.\n\nOutput: the surviving peal numbers in order, or the word EMPTY if none survive.\n\nConstraints: N up to 10^6; peal numbers up to 10^9. The chain is edited in place by re-linking; no second roll may be written out.","clues":["every entry bearing the forbidden number V be struck from the roll","in the very first entry as well as in later ones","even several in a row"],"decoys":["The present vicar therefore decrees","The tenor bell is cracked and has been rung half-muffled since 2011","The tower captain keeps a biscuit tin to which he alone has the key"],"core":"Delete every item with a given value from a one-way chain, including possibly the first.","gloss":[["peal","a set of bell chimes",true],["vicar","a parish priest",true],["decrees","orders officially",true],["struck","removed",true],["incumbency","the period someone holds a post",true]],"why":{"ll-reverse":"Nothing here asks for the order to be reversed.","tp-write":"That compacts an array in place; a chain is edited by re-linking, and the first entry may be removed."},"tell":"Deleting from a linked list where the head itself may go.","task":"Print the peal numbers left after every entry equal to V is struck out, in order, or EMPTY.","sample":{"in":"6 7\n7 7 3 7 5 7","out":"3 5","why":"Every 7 is removed, including the first two."}},{"id":"sc-046","v":"ll-merge","dom":"navigation","diff":"E","title":"The Two Almanacs","story":"The two university presses have published rival tide almanacs since the seventeenth century, and the rivalry is now the only reason either of them still does it. Two almanac-makers, one in Oxford and one in Cambridge, each keep a chain of tide entries, every entry knowing only the next, and each chain already ordered by ascending hour, because each maker enters his observations as he makes them and neither has ever had cause to reorder anything.\n\nThis year the Admiralty, which pays for both and has grown tired of paying twice, has required a single combined almanac. The printer, who is notoriously impatient and who has the presses standing idle, demands a single chain, ordered by ascending hour, formed by re-linking the existing entries; no new entry may be created, since the type has already been set for each entry individually and setting a fresh one would mean a fresh plate and a fresh bill.\n\nIf two entries share the same hour, either may come first; the Admiralty has ruled on the point specifically, to the disappointment of both makers, each of whom had prepared an argument.\n\nThe two makers have not spoken since a quarrel over a misprinted equinox. One of them keeps racing pigeons, and the Cambridge maker once compiled a table of eclipses that was wrong and has never quite lived it down. The Admiralty's representative is a retired commander who refers to both presses, in his letters, as the contractors, which neither of them has forgiven.\n\nInput: line one gives A and B, the lengths of the two chains. Line two gives A hours in ascending order; line three gives B hours in ascending order.\n\nOutput: the combined chain's hours from its head, in non-decreasing order.\n\nConstraints: A and B up to 10^6; hours up to 10^9. The existing entries are to be re-linked; no new entry may be allocated.","clues":["each chain already ordered by ascending hour","a single chain","no new entry may be created"],"decoys":["The printer, who is notoriously impatient","The two makers have not spoken since a quarrel over a misprinted equinox","One of them keeps racing pigeons"],"core":"Merge two sorted one-way chains into one by re-linking.","gloss":[["almanac","a yearly book of tide, weather and calendar facts",true],["tide entries","records of when the sea rises and falls",true],["re-linking","joining up again differently",true],["equinox","when day and night are equal length",true]],"why":{"tp-merge":"That merges arrays by position; chains are rewired, not indexed.","hp-merge":"That handles many lists with a heap; two need only a front marker on each."},"tell":"Merge two sorted linked lists.","task":"Print the hours of the combined chain in non-decreasing order.","sample":{"in":"3 3\n2 5 9\n1 5 12","out":"1 2 5 5 9 12","why":"Merge the two ordered chains."}},{"id":"sc-047","v":"td-up","alt":["tb-levels"],"dom":"empire","diff":"E","title":"The Ottoman Divan","story":"The Divan of the Sublime Porte was the council through which the Ottoman state was governed, and its structure, as recorded in the registers of the chancery, was a strict hierarchy. The Grand Vizier stands at the top, and every official has at most two direct subordinates, a left and a right, the left being the senior by custom and the right the junior, a distinction that mattered enormously to the officials and not at all to anyone else.\n\nThe sultan has conceived a suspicion about the length of his own chain of command. He has been told by the Grand Vizier that an order reaches the humblest clerk in four steps, and by a disaffected pasha that it reaches him in eleven. He therefore asks for the longest chain of command, counting the officials along it from the Grand Vizier down to the most junior official at the bottom of that chain, so that he may know which of the two men has been lying to him.\n\nThe hierarchy is given level by level, with a dot for a missing subordinate, as the chancery's own registers set it out. The sultan wants the number of officials in that longest chain, not their names; he has made clear that names can wait until after the number.\n\nThe Divan met in a chamber with a grilled window behind the throne through which the sultan could listen unseen, and everyone knew it. The chancery's seals were kept in a bag carried by an official whose sole duty that was. A pasha's dismissal was traditionally conveyed by a gift of a particular kind of robe, and the recipients learned to dread tailors.\n\nInput: line one gives N, the number of officials. Line two gives the hierarchy level by level from the Grand Vizier, with a dot for a missing subordinate.\n\nOutput: the number of officials in the longest chain of command.\n\nConstraints: up to 10^5 officials.","clues":["at most two direct subordinates, a left and a right","the longest chain of command","from the Grand Vizier down to the most junior official"],"decoys":["The Divan of the Sublime Porte was the council through which the Ottoman state was governed","A pasha's dismissal was traditionally conveyed by a gift of a particular kind of robe","The chancery's seals were kept in a bag carried by an official whose sole duty that was"],"core":"The height (number of levels) of a binary tree.","gloss":[["Divan","a council of state",true],["vizier","a high minister",true],["hierarchy","ranked levels of authority",true],["subordinates","people ranked beneath someone",true],["chancery","an office that keeps official records",true]],"why":{"tb-levels":"Counting levels by sweeping across each one also gives the height, a fair alternative.","td-down":"That passes information from the root toward the leaves; here each official reports upward."},"tell":"Information flows up: an official's answer is built from the subordinates' answers.","task":"Print the number of officials on the longest chain of command, from the Grand Vizier downward.","sample":{"in":"5\n1 2 3 4 . . 5","out":"3","why":"1 -> 2 -> 4 has three officials (so does 1 -> 3 -> 5)."}},{"id":"sc-048","v":"td-down","dom":"caravan trade","diff":"M","title":"The Oasis Tolls","story":"The caravan routes of the western desert were mapped in the ninth century by a geographer whose work survives in a single copy, and the map has an unusual property: a caravan route between oases forms a tree. From the first oasis, each oasis leads on to at most two further oases, a left road and a right road, and no road ever rejoins another, because the wells that make a route possible lie where they lie and the geographer recorded only the routes that water allows.\n\nEach oasis levies a toll on every caravan that halts there, the toll being set by whoever holds the well and varying from a few coins to an extortion. A journey runs from the first oasis down to a terminal oasis, one with no further roads, and the cost of a journey is the sum of the tolls at every oasis along it, the first and the terminal one included.\n\nThe vizier, who is drafting a complaint to the caliph about the tolls and wants a figure in it, wishes to know how many such journeys have tolls totalling exactly T. He has chosen T because it is the sum a merchant petitioned him about last spring, and he wants to know whether that merchant's route was unusual or whether half the desert is paying the same. He does not want the routes themselves listed.\n\nThe geographer's copy is in a library in Cairo and is not lent. One of the wells has been poisoned twice in living memory, each time during a succession dispute. A species of small fox at the fourth oasis is considered lucky and is fed by the caravaneers against the advice of everyone.\n\nInput: line one gives N and T. The next N lines each give an oasis's toll and the numbers of its left and right roads, 0 meaning none; oasis 1 is the first.\n\nOutput: the number of journeys whose tolls total exactly T.\n\nConstraints: up to 10^5 oases; tolls between -1000 and 1000; T between -10^9 and 10^9.","clues":["from the first oasis down to a terminal oasis","one with no further roads","how many such journeys have tolls totalling exactly T"],"decoys":["The caravan routes of the western desert were mapped in the ninth century","A species of small fox at the fourth oasis is considered lucky","One of the wells has been poisoned twice in living memory"],"core":"Count root-to-leaf paths whose values add up to a target.","gloss":[["levies","charges",true],["terminal","at the very end",true],["toll","a fee for passing",true],["vizier","a high minister",true],["caliph","a Muslim ruler",true]],"why":{"td-up":"That builds an answer from the children's answers; here the running total travels down from above.","ps-count":"That counts stretches of an array; this is a tree with a fixed start and a fixed kind of end."},"tell":"Root-to-leaf paths, with a running total carried downward.","task":"Print how many journeys from the first oasis to an end oasis have tolls totalling exactly T.","sample":{"in":"5 11\n5 2 3\n4 4 5\n3 0 0\n2 0 0\n8 0 0","out":"1","why":"Oasis 1 -> 2 -> 4 costs 5 + 4 + 2 = 11; the other two journeys cost 17 and 8."}},{"id":"sc-049","v":"td-bst","dom":"merchant league","diff":"M","title":"The Hanseatic Tally-House","story":"The tally-house of the Hanse at Bergen is a timber building on the wharf that has burned down five times and been rebuilt five times to the same plan. Inside, merchants' ledgers hang from a frame in an arrangement that strikes every visitor as eccentric and that the clerks defend as the only sensible one: the left branch of any ledger holds only strictly smaller account numbers, and the right branch only strictly larger. No two accounts share a number, the league having been strict about that since a fraud in 1398.\n\nAn auditor has come from Lubeck with instructions to report on the smaller accounts, the league suspecting that a number of dormant accounts are being used to move goods without duty. He wants the K-th smallest account number in the whole tally-house, without gathering and sorting every number first, since the ledgers are heavy, hang from hooks, and may not be taken down without the permission of the merchant whose account they record.\n\nHe would also prefer to stop as soon as he has what he came for, rather than handle every ledger in the building, and he has been told that the arrangement of the frame already puts the accounts in their order if only he will read them in the right way.\n\nThe tally-house smells of old parchment and cold tallow, and its clerks work by candlelight, which the league's own fire regul
