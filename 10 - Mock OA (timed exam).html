lead boat to last.\n\nOutput: the painted numbers after re-coupling, lead boat first.\n\nConstraints: N up to 10^6; K between 1 and N; numbers up to 10^9. Only the links between neighbours may be changed; extra memory must not grow with N.","clues":["coupled to exactly one boat behind it by a short tow-rope","within each complete group of K boats the order shall be exactly reversed","the boats in the final incomplete group, fewer than K in number, are to be left exactly as they are","may only undo and re-tie the tow-ropes that join neighbouring boats"],"decoys":["The lock-keeper's cottage is notable for a garden of improbably large marrows","A heron has taken to fishing from the lock gate"],"core":"In a chain of linked items, reverse each complete block of K in place by rewiring links, leaving a short final block alone.","gloss":[["narrowboat","a long, thin canal boat",true],["towpath","a path beside a canal for towing animals",true],["consignment","a batch of goods sent together",true],["harbourmaster","an official in charge of a harbour",true],["decreed","ordered officially",true]],"why":{"ll-dummy":"A dummy head is useful here too, but it is a helper for removing or changing the first node; reversal in groups is the main idea.","tp-ends":"Swapping two ends needs random access, which a chain does not have."},"alt":[],"tell":"Reverse blocks in a linked chain: re-tie each link to point backward within a block, then connect block to block.","task":"Print the painted numbers after every complete group of K boats is reversed (a short last group is left as it is).","sample":{"in":"5 2\n1 2 3 4 5","out":"2 1 4 3 5","why":"Groups (1,2) and (3,4) are reversed; the lone 5 stays."}},{"id":"sc-145","v":"ll-dummy","dom":"bead stringing","diff":"M","title":"The Flawed Beads of Master Okonkwo","story":"Master Adebayo Okonkwo is the last stringer of ceremonial beads in the market quarter of Ilesha, and his craft is to thread hundreds of small glass beads on a single cord so that they hang in a long chain, each bead joined to the next bead along. The first bead on the chain is the one hung nearest the neck of the wearer; the last bead is the one that rests at the waist. Every bead carries a code number stamped into its base by the glassmaker, and beads of the same code can be found in many places along a chain.\n\nA shipment from a new glassmaker has been found to contain a flaw. Beads stamped with a certain code, X, have a hairline crack that makes them break if worn. Master Okonkwo must remove every bead with code X from the chain, wherever it lies, however many there are, and join together the beads on either side of each removed bead so that the chain remains a single unbroken chain in the original order of the remaining beads. The beads are far too delicate to be unthreaded and rethreaded on a new cord: the chain must be repaired where it stands, by cutting out the flawed beads and rejoining neighbours.\n\nThere is a particular difficulty that has caught out his apprentices before. If the very first bead of the chain happens to be flawed, there is no earlier bead to join to the next, and the position the wearer thinks of as 'the start of the chain' has to change. Likewise, several flawed beads may sit side by side, or the whole chain may turn out to be flawed. He has devised a way of handling the start of the chain just like any other place in the chain, rather than treating it as a special case with its own rules.\n\nThe market is famed for its dyed cottons and for a particularly pungent fish stew. The master's wife sells palm wine from a stall opposite. A travelling photographer has been pestering him to pose.\n\nInput: line one gives N and X. Line two gives the N code numbers from the neck end to the waist end.\n\nOutput: the codes of the remaining beads in order, or the word EMPTY if none remain.\n\nConstraints: N up to 10^6; codes up to 10^9. Modify the chain in place; no new cord.","clues":["each bead joined to the next bead along","must remove every bead with code X from the chain, wherever it lies","the chain must be repaired where it stands","If the very first bead of the chain happens to be flawed","handling the start of the chain just like any other place in the chain"],"decoys":["The master's wife sells palm wine from a stall opposite","A travelling photographer has been pestering him to pose"],"core":"Delete every node with a given value from a linked chain, including possibly the first, without special-casing the start.","gloss":[["ceremonial","used for formal rituals",true],["stringer","a person who threads items onto a string",true],["hairline","very thin",true],["pungent","having a sharp smell",true],["apprentices","people learning a craft",true]],"why":{"ll-reverse":"No reversing is involved.","ll-merge":"There is only one chain, so nothing is merged."},"alt":[],"tell":"Deleting from a linked chain where the first item may go: put a placeholder in front so the start behaves like any other link.","task":"Print the codes of the remaining beads in order, or EMPTY.","sample":{"in":"6 4\n4 4 1 4 2 3","out":"1 2 3","why":"Every 4 is removed, including the first two."}},{"id":"sc-146","v":"ll-merge","dom":"parades","diff":"E","title":"The Float Procession of Saint Crispin's Day","story":"The town of Bellmouth holds a procession every year on Saint Crispin's Day, and this year two guilds have each prepared a train of decorated floats: the Cordwainers' Guild and the Drapers' Guild. Each train is a line of floats, each float being tied by a tow-rope to the float behind it, and the lead float of the train is tied to the tractor at the front. The floats of each train have been arranged by their heights, from the shortest at the head to the tallest at the tail, because the old town gate has a low arch and a tall float at the front would topple the ones behind it as it squeezed through.\n\nThe mayor has decreed that the two trains must process as ONE train through the gate, with the floats of both guilds interleaved in order of height, shortest first, so that the tall floats pass the gate last. The floats are heavy and delicate, and the parade marshal, a bustling woman named Georgiana Pike, refuses to have them detached from their wheels and lifted onto other chassis, nor has the town the money to build a third set of tow-ropes. She will only allow the existing tow-ropes between floats to be untied and re-tied to different floats, so that every float of both guilds finishes up in one single train, each float tied to the next-taller one, with ties between floats of the same height settled in favour of the Cordwainers, who march first by ancient custom.\n\nThe Cordwainers' float this year depicts a giant boot, and the Drapers' float depicts a bolt of cloth unrolling. A band of pipers will lead the march, and a retired colonel has been appointed to throw sweets to the children. The weather forecast promises drizzle by the afternoon.\n\nInput: line one gives A and B, the number of floats in each guild's train. Line two gives A heights, in non-decreasing order, for the Cordwainers; line three gives B heights in non-decreasing order for the Drapers.\n\nOutput: the heights of the combined train from head to tail.\n\nConstraints: A and B up to 10^6; heights up to 10^9. The existing floats and ropes are to be reused; no new floats may be created.","clues":["each float being tied by a tow-rope to the float behind it","arranged by their heights, from the shortest at the head to the tallest at the tail","only allow the existing tow-ropes between floats to be untied and re-tied","ties between floats of the same height settled in favour of the Cordwainers"],"decoys":["The Cordwainers' float this year depicts a giant boot","a retired colonel has been appointed to throw sweets to the children"],"core":"Merge two sorted linked chains into one sorted chain by relinking the existing nodes, preferring the first on ties.","gloss":[["cordwainers","shoemakers",true],["drapers","cloth merchants",true],["float","a decorated vehicle in a parade",true],["chassis","the frame of a vehicle",true],["interleaved","mixed together in alternation",true]],"why":{"tp-merge":"That merges arrays by reading from two cursors into a new output; here existing linked items are relinked and no new output structure is created.","ll-dummy":"A placeholder head helps, but the main idea is combining two ordered chains."},"alt":[],"tell":"Two sorted linked chains become one by relinking: repeatedly attach whichever front is smaller to the tail of the result.","task":"Print the heights of the combined train from head to tail (ties favour the first guild).","sample":{"in":"3 3\n2 5 9\n1 5 12","out":"1 2 5 5 9 12","why":"Merge the two ordered trains."}},{"id":"sc-147","v":"td-up","dom":"cave systems","diff":"H","title":"The Longest Crawl in the Wookey Caverns","story":"Beneath the Mendip Hills lies a cave system that the cavers of Wells have mapped over three generations. The system has a single entrance, and from it the tunnels branch, at every chamber, into at most two further tunnels leading to deeper chambers; no tunnels ever rejoin, so the whole system, drawn on paper, looks like an upside-down tree, with the entrance at the top. Every chamber is recorded by its identification number, and the length of each tunnel between two chambers is taken to be exactly one unit, because the cavers count the number of tunnels they must crawl through, not their lengths in metres.\n\nThe Cave Rescue Organisation has asked for the length of the longest crawl that exists in the cave. A crawl is a route from some chamber to some other chamber that passes through each tunnel at most once, and it need not pass through the entrance: it may start in a deep chamber, climb up to a junction, and go down again into a different branch. The length of the crawl is the number of tunnels in it. The Organisation is not interested in which chambers are the endpoints, only in the length of the longest route that can be found anywhere in the system. They have noted that the longest route may or may not pass through the entrance, and that the system is huge, so a method that starts a fresh journey from every chamber and explores everything reachable is bound to repeat enormous amounts of work.\n\nThe Organisation holds a pub quiz every Friday at the Hunters' Lodge. A mascot hedgehog is stuffed and mounted in the clubhouse. A visiting professor of geology has been unwise enough to criticise the maps.\n\nInput: line one gives N, the number of chambers, numbered 1 to N, with chamber 1 the entrance. The next N lines each give two numbers: the left and right child tunnels' chambers of chamber i, with 0 meaning none.\n\nOutput: the number of tunnels in the longest crawl.\n\nConstraints: N up to 10^6; the structure is a binary tree rooted at chamber 1. Each chamber should be examined a constant number of times in all.","clues":["branch, at every chamber, into at most two further tunnels","no tunnels ever rejoin","it need not pass through the entrance: it may start in a deep chamber, climb up to a junction, and go down again into a different branch","starts a fresh journey from every chamber and explores everything reachable is bound to repeat enormous amounts of work"],"decoys":["The Organisation holds a pub quiz every Friday at the Hunters' Lodge","A mascot hedgehog is stuffed and mounted in the clubhouse"],"core":"The longest path between any two nodes of a binary tree; each node can combine the depths reported by its two children.","gloss":[["cavers","people who explore caves",true],["chamber","a cave room",true],["crawl","a low tunnel route",true],["generations","periods of about thirty years",true],["system","a connected set of things",true]],"why":{"td-down":"Passing context down the branches does not help; the answer at each junction is made from what its two branches report upward.","gr-bfs":"Exploring from a start does not apply, since the route has no fixed start."},"alt":[],"tell":"Each junction combines the best depths from its two branches, then reports a single depth upward; track the best combination seen.","task":"Print the number of tunnels on the longest crawl between any two chambers.","sample":{"in":"6\n2 3\n4 5\n0 0\n6 0\n0 0\n0 0","out":"4","why":"Chamber 6 up through 4, 2 and 1 and down to 3 is four tunnels."}},{"id":"sc-148","v":"td-down","dom":"river deltas","diff":"M","title":"The Toll Stations of the Indus Delta","story":"In the delta of a great river, the water divides and divides again as it nears the sea, until it reaches the coast through a score of channels. The boatmen of the delta pay tolls at stations placed at each fork of the channels, and the Delta Authority has recorded, for every station, a toll in rupees that a boat must pay to pass through it. A boat enters at the head of the delta, at the first station, and from every station it can continue into at most two lower channels, a left channel or a right channel, each leading to a further station; once a boat has entered a channel, it never returns to the station it left, and the channels never merge again. A boat that reaches a station with no lower channels, being a station on the coast, goes out to sea; the journey ends there.\n\nThe Authority's accountant, Ravindra Menon, wishes to know how many of the possible journeys from the head of the delta to the sea cost exactly a given total toll, T. Each journey is a route from the first station to a coastal station, and the cost of the journey is the sum of the tolls at all the stations it passes through, including the first and the coastal one. Two journeys are different if they end at different coastal stations. Ravindra has the delta recorded as a map of stations with each station's left and right neighbours.\n\nThe delta is famous for its mangroves, which shelter a variety of crabs, and for a species of freshwater dolphin that is said to be blind. A local festival involves floating thousands of tiny lamps on the water. Ravindra's tea is, on the day in question, unusually weak.\n\nThe key to his method must be that a boat's cost so far is known as it arrives at a station; the cost has to be carried from the head of the delta to each station along the way, so that when the boat reaches the coast the total is ready to compare with T. The toll at one station does not change according to the stations beyond it.\n\nInput: line one gives N and T. The next N lines each give a station's toll and its left and right neighbours (0 meaning none). Station 1 is the head.\n\nOutput: the number of coast-bound journeys costing exactly T.\n\nConstraints: N up to 10^6; tolls between -1000 and 1000; T between -10^9 and 10^9.","clues":["continue into at most two lower channels","the sum of the tolls at all the stations it passes through, including the first and the coastal one","the cost has to be carried from the head of the delta to each station along the way","never returns to the station it left, and the channels never merge again"],"decoys":["The delta is famous for its mangroves, which shelter a variety of crabs","A local festival involves floating thousands of tiny lamps on the water"],"core":"Count root-to-leaf paths in a binary tree whose node values add to exactly T, by carrying the running total downward.","gloss":[["delta","where a river splits before reaching the sea",true],["tolls","fees for passing",true],["rupees","the currency of several Asian countries",true],["mangroves","trees growing in salty coastal water",true],["coastal","at the coast",true]],"why":{"td-up":"Reporting values upward is the opposite direction; the question needs context from the root as you go down.","ps-count":"Running totals of a list are similar, but the structure branches, so each route has its own."},"alt":[],"tell":"A running total that starts at the top and is handed down to each child, checked at the leaves.","task":"Print how many journeys from the head to an end station have tolls totalling exactly T.","sample":{"in":"4 11\n3 2 3\n5 4 0\n8 0 0\n2 0 0","out":"1","why":"Station 1 -> 3 costs 3 + 8 = 11; the other journey costs 10."}},{"id":"sc-149","v":"td-bst","dom":"numismatics","diff":"M","title":"The Coin Cabinet of Sir Reginald Fane","story":"Sir Reginald Fane, a Georgian collector of coins, arranged his cabinet in a novel manner. Instead of keeping his coins in trays by country, he kept them in a branching arrangement of little drawers. Each drawer holds exactly one coin, identified by the year in which it was minted, and each drawer has at most two drawers hanging below it, one to the left and one to the right. Sir Reginald's rule of arrangement, which his butler memorised, is this: for any drawer, every coin in the subtree of drawers hanging to its left was minted in an earlier year than the coin in the drawer itself, and every coin hanging to its right was minted in a later year. All years in the cabinet are different.\n\nThe cabinet has passed into the care of the Fitzwilliam Museum, whose keeper of coins, Dr Philippa Ormerod, wishes to answer the question, asked by many visitors: 'which is the K-th earliest coin in the cabinet?' That is, if all the years of all the coins were written in a list from earliest to latest, which year stands in position K? Dr Ormerod has the cabinet recorded as a tree of drawers, with each drawer's left and right neighbours, and the recorded years. She does not wish to write out all the years and sort them, since Sir Reginald's arrangement, as she is perfectly aware, already has the order built into it. She would also prefer to stop looking the moment she has found the K-th, rather than examine every drawer in the cabinet, and to use memory proportional to the height of the arrangement, no more.\n\nSir Reginald, it is recorded, kept a pet monkey that once stole a Roman denarius and was found asleep with it in a hat. The museum's tea room serves a lemon cake of local renown. Dr Ormerod's cat is called Constantine.\n\nInput: line one gives N and K. The next N lines each give a drawer's year and its left and right neighbours (0 meaning none). Drawer 1 is the top.\n\nOutput: the year of the K-th earliest coin.\n\nConstraints: N up to 10^6; K between 1 and N; years between 1 and 3000. It is guaranteed that Sir Reginald's rule of arrangement holds throughout.","clues":["every coin in the subtree of drawers hanging to its left was minted in an earlier year than the coin in the drawer itself, and every coin hanging to its right was minted in a later year","the K-th earliest coin","the order built into it","stop looking the moment she has found the K-th"],"decoys":["kept a pet monkey that once stole a Roman denarius","The museum's tea room serves a lemon cake of local renown"],"core":"In a binary search tree, find the K-th smallest value; reading the tree in sorted order gives it directly.","gloss":[["cabinet","a piece of furniture with drawers",true],["minted","made by stamping metal",true],["denarius","a silver coin of ancient Rome",true],["subtree","a node together with everything below it",true],["novel","new and unusual",true]],"why":{"td-up":"Combining children's answers would also work but ignores the order the arrangement already gives.","hp-topk":"Selecting the K-th by a heap over the values ignores that they are already arranged in order."},"alt":[],"tell":"A tree where left is smaller and right is larger: visiting left, self, right produces the values in order, so stop at the K-th.","task":"Print the year of the K-th earliest coin.","sample":{"in":"4 2\n1700 2 3\n1650 0 0\n1750 4 0\n1720 0 0","out":"1700","why":"Years in order: 1650, 1700, 1720, 1750."}},{"id":"sc-150","v":"td-lca","dom":"chivalric orders","diff":"M","title":"The Common Superior of the Order of Saint Agnes","story":"The Order of Saint Agnes is a chivalric order founded in the twelfth century, and its structure is strictly hierarchical. At its summit stands the Grand Master, who has no superior in the Order. Every other knight reports to exactly one knight above him, his commander, and no knight has more than two knights reporting directly to him, for the founder, a mathematician as well as a crusader, believed that no one could properly supervise more than two. In this way the Order forms a tree, with the Grand Master at its root; there are no loops, and every knight has a chain of command that leads upward, commander by commander, to the Grand Master.\n\nWhen two knights are involved in a dispute, the Order's statutes require that it be settled by the nearest superior whom they both have in their chains of command: the knight who lies in the chain of command of both and who stands lowest in the hierarchy, so that the dispute goes no higher than necessary. A knight is considered to be in his own chain of command, so that if one disputant is the commander, direct or indirect, of the other, then the commander himself settles the matter. The Chancellor of the Order, Sir Evelyn Thorne, receives many such disputes and is tired of hunting through the rolls.\n\nThe Order's chapel has a famous stained-glass window depicting a pelican. The knights are required to wear a grey cloak on feast days, a requirement that they resent in summer. The Order owns a small vineyard whose wine is said to be only just drinkable.\n\nSir Evelyn has the Order recorded as a tree: for each knight, his number, and the numbers of the knights reporting directly to him, left and right. Knights are numbered from 1 to N, and every knight has a different number. He receives Q disputes, each naming two knights who are certain to be in the Order.\n\nInput: line one gives N and Q. The next N lines each give the left and right subordinates of knight i (0 meaning none); knight 1 is the Grand Master. The next Q lines each give two knight numbers.\n\nOutput: for each dispute, the number of the knight who settles it.\n\nConstraints: N up to 10^5; Q up to 10^5. Moving upward from each disputant, one step at a time, will be far too slow if the Order is a long, thin line of commanders.","clues":["the nearest superior whom they both have in their chains of command","A knight is considered to be in his own chain of command","the knight who lies in the chain of command of both and who stands lowest in the hierarchy","there are no loops"],"decoys":["The Order's chapel has a famous stained-glass window depicting a pelican","The Order owns a small vineyard whose wine is said to be only just drinkable"],"core":"For two nodes of a tree, find the deepest node that is an ancestor of both (a node counts as its own ancestor).","gloss":[["chivalric","relating to the code and customs of knights",true],["hierarchical","arranged in ranks",true],["statutes","formal written rules",true],["subordinate","someone of lower rank",true],["chancellor","a senior official",true]],"why":{"td-up":"Reporting values upward is the mechanism, but the question is specifically for the lowest node above two given ones.","gr-bfs":"No fewest-moves question is asked."},"alt":[],"tell":"The lowest shared ancestor of two nodes: look for the first node where the two chains of command meet.","task":"For each dispute, print the number of the knight who settles it (the nearest superior of both).","sample":{"in":"5 2\n2 3\n4 5\n0 0\n0 0\n0 0\n4 5\n5 3","out":"2\n1","why":"4 and 5 both report to 2; 5 and 3 only meet at 1."}},{"id":"sc-151","v":"tb-levels","dom":"mycology","diff":"E","title":"The Mycelium Survey at Lathbury Wood","story":"Lathbury Wood is a very old oak wood, and under its floor a mycologist named Dr Wilhelmina Sauer has mapped a network of fungal threads, a mycelium, which she believes to be many centuries old. The network begins at a single point, the mother node, and from every node there branch out at most two further threads, each leading to a daughter node; no thread ever rejoins another, so the whole network is, on the page, a tree with the mother node at the top. Dr Sauer has measured the nutrient concentration at every node, a whole number in micrograms per gram of soil.\n\nA botanist visiting from Prague has asked a question that sounds simple. He wants the AVERAGE nutrient concentration at each depth below the mother node. The mother node is at depth zero by itself, the daughter nodes immediately below it are at depth one, their daughters at depth two, and so on, each depth being a whole layer of the network, with every node of that depth, from the far left to the far right. For each depth, he wants the total concentration of all the nodes at that depth divided by the number of nodes at that depth. The botanist does not want an overall average, nor an average along any one thread; he wants one figure per layer, from the topmost layer to the bottommost.\n\nThe wood is a nature reserve and visitors are asked to keep to the paths. Dr Sauer's research assistant, a student called Bartholomew, has a phobia of slugs, which is a drawback in his chosen field. The local ranger has an alarming moustache.\n\nThe obvious way to produce the answer is to take the network one layer at a time, finishing every node of one depth before starting on the nodes of the next depth, and to note, as each layer is completed, how many nodes it had.\n\nInput: line one gives N, the number of nodes, numbered 1 to N, node 1 being the mother node. The next N lines give, for node i, its concentration and the numbers of its left and right daughters (0 meaning none).\n\nOutput: the average concentration of each depth, from depth zero downward, one per line, to one decimal place.\n\nConstraints: N up to 10^6; concentrations up to 10^6.","clues":["the AVERAGE nutrient concentration at each depth below the mother node","one figure per layer, from the topmost layer to the bottommost","finishing every node of one depth before starting on the nodes of the next depth"],"decoys":["has a phobia of slugs, which is a drawback in his chosen field","The local ranger has an alarming moustache"],"core":"For each level of a binary tree, compute something over all nodes at that level (here the average), level by level from the top.","gloss":[["mycologist","a scientist who studies fungi",true],["mycelium","the thread-like body of a fungus",true],["nutrient","a substance that nourishes",true],["daughter node","a node directly below another",true],["layer","one level of a structure",false]],"why":{"td-down":"Carrying a value down a single path does not give a figure over a whole layer.","gr-bfs":"A shortest-route question is not asked."},"alt":[],"tell":"One answer per depth: process the tree a full layer at a time, noting the layer's size as you go.","task":"Print the average concentration at each depth, top first, to one decimal place.","sample":{"in":"5\n10 2 3\n4 4 5\n6 0 0\n8 0 0\n2 0 0","out":"10.0\n5.0\n5.0","why":"Depth 1: (4+6)/2; depth 2: (8+2)/2."}},{"id":"sc-152","v":"tr-basic","dom":"street directories","diff":"M","title":"The Street Index of the Almanac of Brevoort","story":"The Almanac of Brevoort is the city's annual directory, and its editor, a magisterial gentleman called Cornelius Vandermeer, is preparing a new section: an index of street names for the use of cab drivers and postmen. The city has a hundred thousand streets, and the names have been supplied by the council in no particular order, with a great deal of overlap in their beginnings: dozens of streets begin with 'Saint', hundreds with 'New', and scores begin with 'King', 'Queen', 'Market', and 'Upper'.\n\nThe index must answer three kinds of request. First, a clerk may ADD a new street name, as the council approves new building estates. Second, a postman may ask whether a certain name is a complete street name, in full, that exists in the index. Third, and most commonly, a cab driver may ask whether ANY street in the index starts with a given sequence of letters, because he remembers only that the street he wants begins with 'Wil' or 'Pem' and is trying to jog his memory. The answer to the third kind need not list the streets; yes or no will do. All three kinds of request arrive one after another, in any order, and must each be answered at once, as the almanac's compositors work at speed.\n\nCornelius has pointed out that if each request were answered by looking through the entire list of street names from the beginning, the process would take the cab drivers so long that they would give up and ask a policeman instead. He wants the cost of each request to depend only on the length of the name or beginning being asked about, and not on the number of streets in the index. The names share their beginnings, and he would like the index to take advantage of this, storing each shared beginning only once.\n\nThe almanac's cover is bound in a green cloth that fades horribly in sunlight. The printing works has a clock tower that is always seven minutes slow. Cornelius is rumoured to compose limericks in his spare time.\n\nInput: line one gives Q, the number of requests. Each of the next Q lines gives a type (1, 2 or 3) and a lowercase string.\n\nOutput: for each request of type 2 or 3, YES or NO.\n\nConstraints: Q up to 5 * 10^5; total length of all strings up to 5 * 10^6.","clues":["whether ANY street in the index starts with a given sequence of letters","the cost of each request to depend only on the length of the name or beginning being asked about","storing each shared beginning only once","must each be answered at once"],"decoys":["The almanac's cover is bound in a green cloth that fades horribly in sunlight","The printing works has a clock tower that is always seven minutes slow"],"core":"Support adding words and asking whether a word exists or whether any word starts with a given prefix, in time depending only on the string length.","gloss":[["magisterial","having an air of authority",true],["directory","a list of names and addresses",true],["compositors","people who set type for printing",true],["overlap","shared beginnings",false],["jog","to refresh",true]],"why":{"hs-seen":"A set can tell whether a whole name exists but cannot answer 'does anything start with these letters' without scanning.","tr-search":"No board or grid is being searched."},"alt":[],"tell":"Insert, find a whole word, and find any word with this beginning: letters stored as a tree where words share their beginnings.","task":"For each request of type 2 or 3, print YES or NO.","sample":{"in":"5\n1 car\n1 card\n2 car\n3 ca\n3 do","out":"YES\nYES\nNO","why":"'car' is stored; 'ca' begins a stored word; nothing begins 'do'."}},{"id":"sc-153","v":"tr-search","dom":"mosaic halls","diff":"H","title":"The Lettered Floor of the Basilica of Santa Veronica","story":"The floor of the Basilica of Santa Veronica is a vast mosaic of lettered tiles, laid in the eleventh century by a guild of masons who were evidently fond of word games. The floor forms a rectangle of R rows and C columns of square tiles, each tile bearing a single capital letter. A pilgrim may spell out a word by starting on any tile and stepping, one tile at a time, to a tile immediately above, below, to the left or to the right of the one he is standing on, collecting the letters in the order he steps; he may not stand on the same tile twice while spelling a single word, although different words may reuse tiles.\n\nThe basilica's sacristan, a patient man named Fra Bonaventura, keeps a list of sacred words, some of them in Latin, and some in the local dialect: there are W words in the list, many thousands of them, and many of them share their opening letters, for the Church favours words like 'beatitude', 'beatific' and 'beatification'. Fra Bonaventura wants to know which words of the list can be spelled on the floor under the above rules, and he wants each such word reported once, no matter in how many ways it can be spelled.\n\nHe has already attempted the simplest approach: for each word in the list, search the whole floor for a path that spells it. This took so long that the evening bells rang before he had finished the Bs. He noticed the waste: a hundred words that begin with the same few letters are each searched from the start, even when the floor offers no path at all for those first few letters. He would like to avoid following any path that cannot possibly lead to some word of the list.\n\nThe basilica's crypt contains the relics of a saint whose finger is said to have healed a king. A stray cat has taken up residence behind the high altar. The bishop, who is always cold, has been fitted with a woollen mitre.\n\nInput: line one gives R, C and W. The next R lines give the rows of the floor as strings of C capital letters. The next W lines give one word each.\n\nOutput: the words that can be spelled, one per line, in any order.\n\nConstraints: R and C up to 12; W up to 3 * 10^4; each word up to 10 letters.","clues":["stepping, one tile at a time, to a tile immediately above, below, to the left or to the right","many of them share their opening letters","a hundred words that begin with the same few letters are each searched from the start","avoid following any path that cannot possibly lead to some word of the list"],"decoys":["The basilica's crypt contains the relics of a saint whose finger is said to have healed a king","The bishop, who is always cold, has been fitted with a woollen mitre"],"core":"Find which words from a large list can be spelled by a path through a grid; share the work across words with common beginnings and drop paths that match no word.","gloss":[["mosaic","a picture made of small tiles",true],["sacristan","a church officer in charge of sacred objects",true],["beatitude","supreme blessedness",true],["pilgrim","a traveller to a holy place",true],["dialect","a regional form of a language",true]],"why":{"bk-board":"Searching a board by trying and undoing paths is right, but one word at a time wastes work; the beginnings of words need to be shared.","gr-flood":"No count of regions is wanted."},"alt":["bk-board"],"tell":"Many words, one board: arrange the words by their beginnings so one walk over the board prunes every dead end.","task":"Print every word that can be spelled on the floor (neighbouring tiles up, down, left, right; no tile twice in a word).","sample":{"in":"2 3 3\nTEA\nRON\ntea\neon\nrot","out":"tea\neon","why":"'rot' cannot be spelled: the T is not next to the O."}},{"id":"sc-154","v":"gr-flood","dom":"horticulture","diff":"E","title":"The Blight Survey at Quillhurst Glasshouses","story":"The great glasshouses at Quillhurst Botanical Garden were built in the reign of Queen Victoria, and they are cared for by a head gardener, Mrs Genevieve Plunkett, who knows every plant by its Latin name and most by a pet name as well. This winter a fungal blight has appeared among the rows of the tropical collection, and Mrs Plunkett has commissioned a survey. The glasshouse floor is divided into square beds, laid out in R rows and C columns, and a thermal camera mounted in the roof has produced a map in which each bed is marked either '1', meaning that the bed shows signs of blight, or '0', meaning it is healthy.\n\nThe curator of the collection wants to know how many separate patches of blight there are. A patch is a group of blighted beds in which every bed can be reached from every other by stepping from bed to bed, each step going to the bed immediately above, below, left or right, and all the beds along the way being blighted. Beds that touch only at a corner do NOT belong to the same patch, because the spores travel on the damp air along the rows and across the paths, but they do not cross corners. Two patches are separate if no chain of neighbouring blighted beds joins them.\n\nOne question remains: Mrs Plunkett also wants the number of beds in the largest patch, because she will use that as the measure of how bad the outbreak is. But the curator wants first the number of patches, and the other figure can wait until after lunch.\n\nThe glasshouse boasts a pond of giant water lilies, whose leaves are strong enough to bear the weight of a small child. A peacock is allowed to wander the central avenue. The coffee at the garden's cafe is much better than the tea.\n\nInput: line one gives R and C. The next R lines each give a string of C characters, each '0' or '1'.\n\nOutput: the number of separate patches of blight.\n\nConstraints: R and C up to 2000. The map must not be altered permanently if it can be avoided; and the count must not depend on which blighted bed the survey happens to start from. A patch must be counted exactly once, however large it is.","clues":["every bed can be reached from every other by stepping from bed to bed, each step going to the bed immediately above, below, left or right","Beds that touch only at a corner do NOT belong to the same patch","how many separate patches of blight there are","A patch must be counted exactly once, however large it is"],"decoys":["The glasshouse boasts a pond of giant water lilies","A peacock is allowed to wander the central avenue"],"core":"Count the connected groups of marked cells in a grid, where cells connect up, down, left and right.","gloss":[["blight","a plant disease that destroys crops",true],["glasshouse","a building made of glass for growing plants",true],["commissioned","officially asked for and paid for",true],["spores","tiny reproductive cells of fungi",true],["patch","a connected area",false]],"why":{"gr-bfs":"A fewest-steps question is not asked; only the number of separate groups.","dsu-connect":"Merging groups works too, but it is heavier than a plain sweep."},"alt":["dsu-connect"],"tell":"Count separate connected clusters in a grid: scan for an unvisited marked cell, spread over its whole cluster, and count one.","task":"Print the number of separate patches of blight (beds joined up, down, left or right).","sample":{"in":"4 5\n10010\n11000\n00001\n00011","out":"3","why":"The top-left group, the lone bed on row 1, and the bottom-right group."}},{"id":"sc-155","v":"gr-bfs","dom":"hedge mazes","diff":"M","title":"The Hedge Maze of Dunmorrow Court","story":"The gardens of Dunmorrow Court are famous for a hedge maze planted by the third Earl in 1741, and the present Countess, a cheerful woman with no sense of direction, has decided to open the maze to visitors in the summer. For the benefit of those who become hopelessly lost, she wishes to install signs showing the quickest route from the entrance to the centre. The head gardener, Septimus Marsh, has mapped the maze as a rectangle of R rows and C columns of square cells. Each cell is either a path, marked '.', or a hedge, marked '#'. A visitor may stand on any path cell, and a single step takes him from one path cell to the path cell immediately above, below, left or right of it; he cannot step through a hedge, nor diagonally. The entrance is marked 'S' and the centre is marked 'E'; both are path cells.\n\nSeptimus wants the smallest number of steps a visitor needs to get from the entrance to the centre, or the word IMPOSSIBLE if some cruel error in planting has walled the centre off. He does not care how the route actually runs, only the count; the Countess will paint the arrows on the signposts later. Every step costs the same, whether it goes round a bend or straight ahead, because all the cells are the same size.\n\nThe Countess has mentioned, irrelevantly, that the third Earl was buried in a coffin shaped like a boat. The garden also boasts a sundial that tells the wrong time on purpose. A family of badgers has a sett beneath the yew walk and cannot be moved. The ice cream sold at the gate is made by the head gardener's sister.\n\nInput: line one gives R and C. The next R lines each give a string of C characters from '.', '#', 'S' and 'E'.\n\nOutput: the smallest number of steps from S to E, or IMPOSSIBLE.\n\nConstraints: R and C up to 1500. Exactly one S and one E. Septimus has already attempted following one corridor as far as it goes and then backing up to try another, but he finds that this finds A route, not necessarily the shortest, and the Countess wants the shortest.","clues":["a single step takes him from one path cell to the path cell immediately above, below, left or right of it","the smallest number of steps a visitor needs to get from the entrance to the centre","Every step costs the same","finds A route, not necessarily the shortest"],"decoys":["the third Earl was buried in a coffin shaped like a boat","A family of badgers has a sett beneath the yew walk and cannot be moved"],"core":"Find the fewest steps between two cells in a grid with walls, where every step costs the same.","gloss":[["earl","a nobleman ranking below a marquess",true],["sett","a badger's burrow",true],["sundial","a device that tells time by the sun's shadow",true],["hedge","a fence of closely planted shrubs",true],["signposts","posts with directions on them",true]],"why":{"gr-flood":"That counts clusters, not distances.","sp-dijkstra":"Weighted routes are for unequal costs; here every step costs the same."},"alt":["sp-dijkstra"],"tell":"Equal-cost steps and the fewest needed: spread outward from the start one step-distance at a time until the target is reached.","task":"Print the smallest number of steps from S to E, or IMPOSSIBLE.","sample":{"in":"3 4\nS.#.\n.#..\n...E","out":"5","why":"Down, down, then right three times."}},{"id":"sc-156","v":"gr-multi","dom":"cheese caves","diff":"M","title":"The Mould in the Maturing Caves of Brienne","story":"The maturing caves of Brienne are cut into the limestone of a hillside and hold some four thousand wheels of mountain cheese, laid out on long wooden shelves in rows and columns. The affineur, a stern woman called Odette Rambaud, knows that cheese must be turned and brushed regularly, and that a single wheel gone bad can spoil its neighbours. Today she has found trouble. The cave floor is mapped as a rectangle of R rows and C columns of shelf-places, each place marked in one of three ways: '0' for an empty place, '1' for a wheel in good condition, and '2' for a wheel that has already gone mouldy.\n\nMould spreads on a strict timetable. Each minute, every good wheel that stands immediately above, below, to the left or to the right of a mouldy wheel becomes mouldy itself. Wheels standing only diagonally from a mouldy one are not affected. Empty places do not carry mould. Odette, who is anxious to know how long she has before the whole stock is lost, wishes to know the minimum number of minutes that must pass until no good wheel remains. If some good wheel is cut off from all the mould by empty places, so that it can never be reached, she wants the answer -1. If there are no good wheels at all, the answer is 0.\n\nThere is more than one mouldy wheel to begin with: several were found at the same moment, scattered across the cave, and each of them begins spreading at the same instant, so that the spreading fronts from different starting points meet and merge as time passes. Odette's apprentice has proposed calculating, for each mouldy wheel separately, how long it would take to spoil every good wheel, and then combining the results, but Odette finds this tedious and suspects it is not what actually happens in the cave.\n\nThe cave maintains a constant temperature that makes visitors shiver. The goats that provide the milk are named after saints. A trade delegation from the capital is expected on Friday and will be served an extravagant lunch.\n\nInput: line one gives R and C. The next R lines each give C digits from 0, 1, 2.\n\nOutput: the number of minutes until no good wheel remains, or -1.\n\nConstraints: R and C up to 1000.","clues":["every good wheel that stands immediately above, below, to the left or to the right of a mouldy wheel becomes mouldy itself","There is more than one mouldy wheel to begin with","each of them begins spreading at the same instant","the minimum number of minutes that must pass until no good wheel remains"],"decoys":["The goats that provide the milk are named after saints","A trade delegation from the capital is expected on Friday and will be served an extravagant lunch"],"core":"Find how long until a spread starting from several sources simultaneously has reached every cell of a grid, or report that some cell is never reached.","gloss":[["affineur","a person who ages cheese",true],["maturing","ageing until ripe",true],["limestone","a type of rock",true],["mouldy","covered in mould",true],["diagonally","corner to corner",true]],"why":{"gr-bfs":"A single start is spreading in the usual way; here many starts begin at once.","gr-flood":"No clusters are counted."},"alt":[],"tell":"Many sources spreading at the same moment: start the layered spreading from all of them together and count the layers.","task":"Print the number of minutes until no good wheel remains, or -1 (0 = empty place, 1 = good wheel, 2 = mouldy wheel).","sample":{"in":"3 3\n211\n110\n011","out":"4","why":"Mould reaches the far corner wheel four minutes after it starts."}},{"id":"sc-157","v":"to-kahn","dom":"cathedral building","diff":"M","title":"The Building Programme of Saint Aldhelm's Spire","story":"The master mason of Saint Aldhelm's, a methodical man called Thaddeus Wren, has been asked to complete the great spire in the shortest possible time, and the Chapter has provided him with N separate tasks to be done, numbered from 1 to N: quarrying, cutting, scaffolding, laying the courses, lifting the capstone, fitting the lead, and many more. Some tasks cannot begin until others have been completed. The Chapter's list of such dependencies consists of pairs (A, B), each of which means that task A must be fully finished before task B may begin. Every task takes exactly one working day.\n\nThaddeus has more workmen than tasks that can be done at once: on any given day he may assign as many tasks as he likes to as many gangs, provided that every task assigned that day already has all its prerequisites completed on earlier days. So on the first day he will begin every task that has no prerequisites at all; on the second, everything whose prerequisites were all completed on the first day; and so on, and he will always begin each task as early as the dependencies allow, so that work is never delayed unnecessarily.\n\nThe Chapter wishes to know the total number of working days the whole programme will take, that is, the day on which the last task is finished. And in case the list of dependencies has been drawn up wrongly, so that some tasks wait in a circle for one another and can never begin, he must report that the programme is impossible. A task cannot be begun if it is part of such a circle or if it depends on one.\n\nThe cathedral choir has been practising a new anthem, which carries across the close at all hours. The dean's dog, a bad-tempered terrier, bites only curates. Wren has a habit of drawing the spire on the back of his hand when he is thinking.\n\nInput: line one gives N and M, the number of tasks and the number of dependency pairs. The next M lines each give A and B.\n\nOutput: the number of working days needed, or IMPOSSIBLE.\n\nConstraints: N up to 10^5; M up to 3 * 10^5. All tasks that are ready may be done on the same day, and each round of work begins with every task that currently has no unfinished prerequisite.","clues":["task A must be fully finished before task B may begin","on the first day he will begin every task that has no prerequisites at all","everything whose prerequisites were all completed on the first day","some tasks wait in a circle for one another and can never begin"],"decoys":["The cathedral choir has been practising a new anthem","The dean's dog, a bad-tempered terrier, bites only curates"],"core":"With prerequisite pairs among tasks, find how many rounds are needed when every ready task is done in the same round, or report a circular dependency.","gloss":[["Chapter","the governing body of a cathedral",true],["spire","a tall pointed top of a tower",true],["prerequisites","things that must come first",true],["courses","horizontal layers of stone",true],["curates","junior clergy",true]],"why":{"to-dfs":"A depth-first ordering also produces an order and finds circles, but the question asks in terms of rounds starting with tasks that have no unfinished prerequisites.","sp-bellman":"No distances or negative costs are involved."},"alt":["to-dfs"],"tell":"Rounds of tasks whose prerequisites are all done: repeatedly take everything with no remaining prerequisites and release what depended on it.","task":"Print the number of working days needed (tasks numbered from 1), or IMPOSSIBLE.","sample":{"in":"5 5\n1 2\n1 3\n2 4\n3 4\n4 5","out":"4","why":"Day 1: task 1; day 2: tasks 2 and 3; day 3: task 4; day 4: task 5."}},{"id":"sc-158","v":"to-dfs","dom":"encyclopaedias","diff":"H","title":"The Cross-References of the Ashmore Encyclopaedia","story":"The Ashmore Encyclopaedia is a work in thirty volumes, and its editor, a donnish and absent-minded man called Professor Eustace Quarrington, has made the dubious decision to cross-reference the entries heavily. Each of its N entries cites some number of other entries: the reader is told to 'consult' them before the citing entry can be fully understood. The entries are numbered from 1 to N, and a citation is a directed link from an entry to an entry it requires.\n\nThe publisher has a request. Before the encyclopaedia is printed, the entries must be arranged in a reading order in which every entry appears AFTER all the entries it cites, so that a reader reading straight through never meets an entry whose prerequisites have not yet appeared. If such an arrangement exists, the publisher wants one such arrangement; if two or more exist, any will do. If there is a circle of citations, A citing B citing C citing A, then no reading order exists and the publisher wants to be told so, because the editorial board will have to remove a citation.\n\nProfessor Quarrington proposes to settle the matter by following citations as far as they will go. He takes an entry nobody has looked at, follows its first citation to an entry not yet looked at, and so on until he reaches an entry that cites nothing new; then he steps back one entry and attempts its next citation. In doing this, he marks each entry in one of three ways: untouched, in progress (currently being followed, with its citations not yet finished), or finished (all its citations dealt with). If, while following citations, he reaches an entry that is marked in progress, he has found a circle. Each entry is, once finished, placed in the reading order, and the professor's own notes suggest that the correct order is the opposite of the order in which entries finish.\n\nThe university's tea room serves a famous seed cake. The professor wears odd socks, a fact that no one dares to mention. An undergraduate on the editorial staff has been seen reading a novel at his desk.\n\nInput: line one gives N and M. The next M lines each give A and B, meaning entry A cites entry B.\n\nOutput: a reading order (entries separated by spaces), or IMPOSSIBLE if there is a circle.\n\nConstraints: N up to 10^5; M up to 3 * 10^5. Chains of citations may be very long.","clues":["every entry appears AFTER all the entries it cites","follows its first citation to an entry not yet looked at","untouched, in progress (currently being followed, with its citations not yet finished), or finished","the correct order is the opposite of the order in which entries finish"],"decoys":["The university's tea room serves a famous seed cake","The professor wears odd socks, a fact that no one dares to mention"],"core":"Produce an order of items in which each comes after everything it depends on, using a depth-first walk with three states per item, and detect a circle of dependencies.","gloss":[["donnish","like a university teacher, bookish",true],["dubious","doubtful",true],["encyclopaedia","a reference work covering all subjects",true],["citation","a reference to a source",true],["absent-minded","forgetful",true]],"why":{"to-kahn":"Releasing items with no remaining prerequisites also works, but the story describes following citations deep and finishing them in turn.","dsu-cycle":"That is for undirected loops; these links have a direction."},"alt":["to-kahn"],"tell":"Follow each dependency as deep as it goes and note the order in which items finish; seeing an in-progress item again means a circle.","task":"Print a reading order (entries numbered from 1) in which every entry comes after the entries it cites, or IMPOSSIBLE.","sample":{"in":"3 3\n1 2\n1 3\n3 2","out":"2 3 1","why":"Entry 1 cites 2 and 3; entry 3 cites 2."}},{"id":"sc-159","v":"sp-dijkstra","dom":"mule trails","diff":"M","title":"The Mule Trains of the Karakoram Passes","story":"In the high valleys of the northern frontier, the villages are linked by mule trails, and the traders of the region pay a toll to the headman of each trail for the use of it. The Frontier Trading Company, which wishes to move a consignment of apricots and dried fruit from the village of Aksu to the market town of Kharabad, has obtained from its agents a list of every trail. For each trail they record the two villages it joins and the toll in silver coins for using it. The trails can be walked in either direction, and the toll is the same both ways, and no toll is ever negative; indeed no toll is ever refunded.\n\nThe Company's manager, a cautious Parsi named Jamshedji Tata, wishes to know the cheapest total toll for a journey from Aksu to Kharabad, taking any combination of trails that links the two villages. He is not interested in the number of trails, nor in the distance walked, nor in the time taken; the Company is only concerned with the total of the tolls paid. The headmen are famously grasping and the tolls vary widely, from a few coins to hundreds, so a route with many cheap trails may well cost less than a route with a single expensive one, and vice versa.\n\nJamshedji's first plan was to enumerate every possible route from Aksu to Kharabad and add up the tolls on each, but a clerk pointed out that the number of routes in a network of this size is more than anyone can count. His second plan was to go to Kharabad by whichever trail out of Aksu was cheapest, and then continue the same way, always taking the cheapest trail from wherever he happened to be. A clerk pointed out that this might lead him into a dead end, or on a long way round.\n\nThe region is famous for apricot brandy, which Jamshedji, being teetotal, has never tasted. The mules are of a sullen disposition. A travelling photographer has recently arrived by the northern pass and is charging a small fortune for portraits.\n\nInput: line one gives N, M, S and T: the number of villages, the number of trails, the start village and the destination. The next M lines each give U, V and W: the two villages and the toll.\n\nOutput: the cheapest total toll, or -1 if the destination cannot be reached.\n\nConstraints: N up to 10^5; M up to 3 * 10^5; tolls between 0 and 10^6.","clues":["the cheapest total toll for a journey from Aksu to Kharabad","no toll is ever negative","a route with many cheap trails may well cost less than a route with a single expensive one","always taking the cheapest trail from wherever he happened to be"],"decoys":["The region is famous for apricot brandy","A travelling photographer has recently arrived by the northern pass"],"core":"Find the cheapest total cost between two nodes in a network where connection costs are never negative.","gloss":[["toll","a fee for using a road",true],["headman","the chief of a village",true],["consignment","a batch of goods sent together",true],["teetotal","never drinking alcohol",true],["disposition","natural mood or tendency",true]],"why":{"gr-bfs":"Counting steps works only when each step costs the same; here tolls differ.","sp-bellman":"Negative costs would force a slower method, and the story says they never occur."},"alt":[],"tell":"Weighted links, none negative, cheapest total between two points: always settle the cheapest-so-far point and relax its neighbours.","task":"Print the cheapest total toll from the start village to the destination, or -1 (villages numbered from 1).","sample":{"in":"4 4 1 4\n1 2 7\n1 3 2\n3 2 3\n2 4 1","out":"6","why":"1 -> 3 -> 2 -> 4 costs 2 + 3 + 1 = 6."}},{"id":"sc-160","v":"sp-bellman","dom":"tramp steamers","diff":"H","title":"The Coastal Packets of the Skerry Line","story":"The Skerry Line is a small shipping company operating coastal steamers around the north of Scotland, calling at harbours so tiny that some of them can scarcely be found on a map. The company's traffic manager, Mungo MacAskill, has a ledger of every sailing the line offers: each entry records the harbour of departure, the harbour of arrival and the fare in pounds. The fare is generally positive, but the company occasionally pays passengers to travel on a leg that it is anxious to fill, such as an unpopular winter crossing, so that some fares in the ledger are negative figures.\n\nA wealthy passenger, Lady Arabella Drummond, wishes to travel from the harbour of Scrabster to the harbour of Stornoway by the cheapest route that the line can offer. However, Lady Arabella suffers from seasickness, and has stipulated that she will not travel on more than K sailings in the whole journey; that is, her route may include no more than K legs, counting each sailing from one harbour to the next, though it may include fewer. If no route with at most K legs connects the two harbours, she will take the train, and Mungo should say so.\n\nMungo has observed that the cheapest route with, say, two legs might be quite different from the cheapest route with three; a cheaper journey might use a very large number of legs, and he must be careful not to report a journey that exceeds the stipulated number. Furthermore, because some fares are negative, it is conceivable that a sufficiently long journey might loop through harbours profitably and be paid to do so, an arrangement the company's accountants are keen to prevent but which, for Lady Arabella, is simply a nuisance, since the limit of K legs rules it out.\n\nThe Line's flagship, the Hebridean Maid, is known for a dining saloon of surprising elegance. The company's offices overlook a harbour in which a seal sometimes loiters. Mungo takes his tea very strong.\n\nInput: line one gives N, M, S, T and K. The next M lines each give U, V and W: a sailing from U to V with fare W.\n\nOutput: the cheapest fare of a journey from S to T using at most K sailings, or -1 if none exists.\n\nConstraints: N up to 2000; M up to 10^4; K up to 100; fares between -1000 and 1000.","clues":["some fares in the ledger are negative figures","she will not travel on more than K sailings in the whole journey","the cheapest route with, say, two legs might be quite different from the cheapest route with three","the limit of K legs rules it out"],"decoys":["The Line's flagship, the Hebridean Maid, is known for a dining saloon of surprising elegance","The company's offices overlook a harbour in which a seal sometimes loiters"],"core":"Find the cheapest route between two nodes using at most K links, where some link costs may be negative.","gloss":[["skerry","a small rocky island",true],["harbour","a sheltered place where ships can anchor",true],["stipulated","specified as a condition",true],["saloon","a large public room on a ship",true],["loiters","lingers without purpose",true]],"why":{"sp-dijkstra":"Dijkstra fails with negative fares and does not respect a limit on the number of legs.","dp-grid":"The network is not a grid."},"alt":[],"tell":"Negative costs and an edge-count limit: improve all route costs by one more link at a time, K times.","task":"Print the cheapest fare from S to T using at most K sailings, or -1.","sample":{"in":"4 5 1 4 2\n1 2 100\n2 3 100\n3 4 100\n1 3 500\n2 4 600","out":"600","why":"1 -> 3 -> 4 costs 500 + 100 = 600 with two sailings."}},{"id":"sc-161","v":"sp-floyd","dom":"mountain huts","diff":"M","title":"The Hut-to-Hut Distances of the Dolomite High Route","story":"The Dolomite High Route is a long-distance trail through the Italian Alps, and along it stand N mountain huts, where walkers sleep and eat polenta. The Alpine Club, which maintains the huts, has surveyed every path that directly joins one hut to another, and has recorded for each such path the walking time in minutes. Paths can be walked in either direction, and the time is the same both ways. Not every pair of huts is directly joined, but the huts are numbered from 1 to N, and the club's secretary, a precise and unhurried man called Ludovico Pellegrini, has calculated that a walker can get from any hut to any other, if need be by passing through other huts on the way.\n\nThe club's guidebook is to include a table giving, for every pair of huts, the shortest walking time between them by any route whatever. Guidebook readers like tables, and Ludovico has promised to supply the complete table, and also to answer a question that arrives by telephone from walkers planning their routes: 'how long from hut A to hut B?' He expects up to a hundred thousand such calls during the summer, each naming two huts, and he cannot afford to work out each answer afresh from the paths while the walker waits on the line.\n\nThe number of huts is modest, never more than 400, because the High Route is a trail for the dedicated, not the casual, and few huts have survived the avalanches. The club's records are perfectly accurate on all the paths, and all the times are positive. Ludovico has decided that the work should be done once, in advance, for ALL pairs together, and kept in a table to be read off.\n\nThe club has a long tradition of annual dinners, at which a grappa of alarming strength is served. A chamois is sometimes seen on the ridge above the Rifugio Lagazuoi. The dog that belongs to the warden of the highest hut is called Bruno and has been known to fetch walkers' boots.\n\nInput: line one gives N and M, the number of huts and of direct paths, and Q, the number of phone calls. The next M lines each give U, V and W: a direct path of W minutes. The next Q lines each give two huts.\n\nOutput: for each call, the shortest walking time between the huts.\n\nConstraints: N up to 400; M up to 80000; Q up to 10^5; times between 1 and 10^4.","clues":["the shortest walking time between them by any route whatever","for every pair of huts","a hundred thousand such calls","The number of huts is modest, never more than 400","for ALL pairs together"],"decoys":["The club has a long tradition of annual dinners, at which a grappa of alarming strength is served","The dog that belongs to the warden of the highest hut is called Bruno"],"core":"With a small number of nodes, compute the shortest distance between every pair of nodes once, then answer many queries by lookup.","gloss":[["Alpine Club","an association of mountaineers",true],["rifugio","an Italian mountain hut",true],["polenta","a dish of boiled cornmeal",true],["chamois","a mountain antelope",true],["grappa","an Italian brandy",true]],"why":{"sp-dijkstra":"One start at a time works but would need to be repeated for every hut; with so few huts a single all-pairs computation is cheaper and gives the table.","dsu-connect":"Connectedness alone does not give times."},"alt":["sp-dijkstra"],"tell":"Every-pair distances on a small graph: allow each hut in turn as a possible stop-over and see whether it shortens any pair.","task":"For each call, print the shortest walking time in minutes between the two huts (huts numbered from 1).","sample":{"in":"4 4 3\n1 2 5\n2 3 3\n3 4 4\n1 4 20\n1 4\n2 4\n1 3","out":"12\n7\n8","why":"1 to 4 by way of 2 and 3 is 12; the direct path is 20."}},{"id":"sc-162","v":"dsu-connect","dom":"guild alliances","diff":"M","title":"The Treaties of the Hanseatic Guilds","story":"In the late Middle Ages, the merchant guilds of the Baltic coast formed alliances with one another, and a historian, Dr Sigrid Halvorsen, has assembled a list of the treaties made over three hundred years. Each treaty joined two guilds in a pact of mutual aid. Alliance was transitive in practice: if the guild of Lübeck was allied to Hamburg, and Hamburg to Bremen, then in time of trouble Lübeck could call on Bremen, and Bremen on Lübeck, so that all three formed a single league. Alliances were never broken, only added, and the historian is working through the treaties in the order in which they were signed.\n\nShe has been asked a pair of questions about the state of the alliances, many times over, at different points in her narrative. The first is whether two named guilds belonged to the same league at that moment, that is, whether a chain of treaties, direct or through others, linked them. The second is how many separate leagues existed at that moment, counting every guild that had no treaty as a league of its own. The questions are interleaved with the treaties themselves: first a treaty, then a question, then a treaty, and so on, in the order of the narrative, and she must answer each question as it comes, using only the treaties signed up to that point.\n\nThe historian's first approach was to keep a table showing, for each pair of guilds, whether they were linked, and to update the whole table with every treaty. This took so long that she had a nervous collapse and was ordered to rest in the country. Her assistant has now proposed a cleverer method in which each league keeps a representative, so that checking two guilds means comparing their representatives, and joining two leagues means merging them under one representative.\n\nLübeck is famed for its marzipan. The historian's cat, an elderly ginger, has taken to sleeping on the manuscripts. The archives are damp.\n\nInput: line one gives N, the number of guilds, and Q, the number of events. Each of the next Q lines gives either '1 A B' (a treaty between A and B) or '2 A B' (are A and B in the same league?) or '3' (how many leagues?).\n\nOutput: for each event of type 2, YES or NO; for each type 3, the number of leagues.\n\nConstraints: N up to 10^6; Q up to 10^6. Alliances are only ever added.","clues":["Alliance was transitive in practice","Alliances were never broken, only added","whether two named guilds belonged to the same league at that moment","each league keeps a representative"],"decoys":["Lübeck is famed for its marzipan","The historian's cat, an elderly ginger, has taken to sleeping on the manuscripts"],"core":"Groups only ever merge; answer whether two items are in the same group and how many groups exist, as merges arrive.","gloss":[["treaty","a formal agreement between parties",true],["transitive","if A relates to B and B to C, then A relates to C",true],["league","a group of allies",true],["pact","a formal agreement",true],["representative","a member who stands for the group",false]],"why":{"gr-flood":"A single map to be swept is not the case; the groups change over time as events arrive.","hs-group":"Grouping by a fixed key will not handle merges as they happen."},"alt":[],"tell":"Groups that only merge and 'same group?' questions in between: give each group a representative and compare representatives.","task":"For each type-2 event print YES or NO; for each type-3 event print the number of leagues.","sample":{"in":"5 6\n1 1 2\n1 3 4\n2 1 3\n1 2 3\n2 1 4\n3","out":"NO\nYES\n2","why":"After the first two treaties 1 and 3 are apart; after the third they are linked."}},{"id":"sc-163","v":"dsu-cycle","dom":"telegraph cables","diff":"M","title":"The Cables Laid by the Imperial Telegraph Company","story":"The Imperial Telegraph Company is laying cables between the N stations of its network, which lie scattered across a vast colony. The company's policy, laid down by a thrifty founder, is that the stations shall be joined by exactly the cables needed to connect them all together, and no more; a surplus cable is a waste of copper and a liability in case of sabotage. The cables are laid one at a time, in a fixed order of the company's schedule, each connecting two stations directly. Messages can pass along a cable in either direction, and can pass through any station on to the next cable, so that two stations are in communication if there is any chain of cables between them.\n\nAfter a long campaign, the company's chief inspector, Mr Ptolemy Branch, reviewed the schedule of laid cables and discovered to his horror that it contained one cable too many. All the stations are connected to one another, but if any one particular cable were taken away, the stations would STILL be connected. Such a cable is called redundant, and the company wishes to know which cable on the schedule was the first to become redundant: that is, the earliest cable on the schedule whose laying joined two stations that were already in communication with each other through the cables laid before it. The inspector needs to report its position on the schedule so that the other cables can be left alone.\n\nMr Branch's own strategy, to remove each cable in turn and test whether the network still holds together, was abandoned when someone worked out how many tests that would require. The company's headquarters is a gloomy building in the City of London. The staff are given a free copy of the company's anniversary hymn. A clerk has been rebuked for whistling in the corridor.\n\nIt is worth knowing that the schedule contains N - 1 cables that are needed and one extra; no cable joins a station to itself, and no two cables join the same pair of stations.\n\nInput: line one gives N. The next N lines each give the two stations joined by one cable, in the order laid.\n\nOutput: the position (1-based) of the first cable which joined two stations that were already in communication.\n\nConstraints: N up to 2 * 10^5. As each cable is laid, one wants to be able to tell, in very short time, whether its two stations are already linked.","clues":["exactly the cables needed to connect them all together, and no more","the earliest cable on the schedule whose laying joined two stations that were already in communication","if any one particular cable were taken away, the stations would STILL be connected","very short time, whether its two stations are already linked"],"decoys":["The staff are given a free copy of the company's anniversary hymn","A clerk has been rebuked for whistling in the corridor"],"core":"Add links one by one; report the first link that connects two points already connected.","gloss":[["redundant","unnecessary because already covered",true],["sabotage","deliberate damage",true],["telegraph","a system of sending messages by wire",true],["liability","something that is a burden or risk",true],["thrifty","careful with money",true]],"why":{"dsu-connect":"Same structure, but the question is not about groups or counts; it is the first link that closes a loop.","to-dfs":"The links are undirected, so ordering and cycle colours do not apply."},"alt":[],"tell":"Each new link either joins two separate groups or closes a loop; find the first closing link by comparing group representatives.","task":"Print the position (1-based) of the first cable that joined two stations already in communication.","sample":{"in":"4\n1 2\n2 3\n1 3\n3 4","out":"3","why":"Stations 1 and 3 were already linked through 2."}},{"id":"sc-164","v":"dsu-kruskal","dom":"hill forts","diff":"M","title":"The Military Roads of the Marcher Lords","story":"In the border marches between the two kingdoms, the lords of the borderlands hold a scattering of hill forts, N in all, and the King has commanded them to join the forts by roads so that troops can pass between any two forts, if need be by way of others. The royal engineer, a sceptical man named Hugo de Brabant, has surveyed every road that could possibly be built: he has a list of candidate roads, each linking two forts and each with a cost in marks of silver for its construction, which depends on the steepness of the ground and the number of rivers to be bridged. The roads are all two-way, and no road is free.\n\nThe King's treasury is not generous. The engineer has been told to choose from the candidate roads a set that connects ALL the forts together, so that every fort can be reached from every other, and the total cost of the roads chosen is as small as it can possibly be. He may choose any number of roads. He does not need the roads to be short, nor the journeys between forts to be quick, nor any particular fort to be central: only that the forts are all connected, and the bill is the least possible. If the candidate roads cannot connect all the forts, whatever he chooses, he must report that the task is impossible.\n\nHugo knows that choosing the cheapest road from each fort is not good enough, since the cheapest roads from different forts might all lead to the same two or three forts and leave the rest stranded. He also knows that any road that would only join two forts that are already linked by earlier chosen roads would be a waste of money.\n\nOne of the marcher lords has a collection of ornamental daggers. Another keeps bees, which he regards as more reliable than his vassals. The King's last visit to the border was cut short by a cold.\n\nInput: line one gives N and M. The next M lines each give U, V and W: a candidate road between forts U and V costing W.\n\nOutput: the least total cost of a set of roads connecting all forts, or IMPOSSIBLE.\n\nConstraints: N up to 10^5; M up to 3 * 10^5; costs up to 10^6.","clues":["a set that connects ALL the forts together","the total cost of the roads chosen is as small as it can possibly be","any road that would only join two forts that are already linked by earlier chosen roads would be a waste of money","choosing the cheapest road from each fort is not good enough"],"decoys":["One of the marcher lords has a collection of ornamental daggers","Another keeps bees, which he regards as more reliable than his vassals"],"core":"Connect all points with the cheapest set of links, skipping any link that joins points already connected.","gloss":[["marches","border regions",true],["sceptical","doubting",true],["vassals","people who owe loyalty to a lord",true],["stranded","left without a way to move on",true],["ornamental","decorative",true]],"why":{"sp-dijkstra":"Cheapest single routes are not the cheapest network that joins everything.","dsu-cycle":"Detecting a redundant link is part of this, but the goal here is the cheapest complete network."},"alt":[],"tell":"Cheapest network connecting everything: consider links from cheapest upward, keeping each one that joins two different groups.","task":"Print the least total cost of roads connecting all forts, or IMPOSSIBLE (forts numbered from 1).","sample":{"in":"4 5\n1 2 1\n2 3 4\n1 3 2\n3 4 3\n2 4 7","out":"6","why":"Take the roads costing 1, 2 and 3."}},{"id":"sc-165","v":"dp-linear","dom":"night markets","diff":"E","title":"The Stalls of the Lantern Night Market","story":"On the third night of the autumn festival in the old town of Kaoshan, the Lantern Night Market sets up along a single narrow street, with N stalls in a row, one after another. Each stall sells a different delicacy, and each has paid the market warden a licence fee, which is whatever the stallholder reckoned the evening's trade would be worth: a number of coins. A visiting inspector from the capital, a gaunt man called Mr Zhou, has been told to collect these licence fees on behalf of the imperial treasury, but there is a snag. The stallholders look out for each other, and a stallholder who sees the inspector arrive at the stall next to his will at once pass the word along the row. The inspector has therefore learned that if he collects from two stalls that are neighbours in the row, the rest of the street will be warned and he will collect nothing more.\n\nMr Zhou must choose a set of stalls to collect from, such that no two chosen stalls are neighbours in the row, and he would like the largest possible total of licence fees. He may choose none at all, although that would not be much of an inspection. He may skip as many stalls as he likes between chosen ones. He does not mind which stalls he collects from, nor how many, so long as the total of the fees is as great as it can be.\n\nThe warden's assistant has said that the simplest thing is for the inspector to take the biggest fee, then the next biggest that is not a neighbour of a chosen one, and so on. Mr Zhou, who suspects this is a trap, has tested it on a small example in which the stalls have fees 4, 5, 4 and found that it gives 5, whereas taking the first and the third gives 8.\n\nThe market is famous for its sesame dumplings and for a vendor who sells hand-painted fans. A fortune-teller sits in a booth at the corner. A sudden shower sent the crowds scurrying, to the delight of the umbrella seller.\n\nInput: line one gives N. Line two gives the N licence fees in the order of the stalls.\n\nOutput: the largest total that can be collected without choosing two neighbouring stalls.\n\nConstraints: N up to 10^6; fees between 0 and 10^9.","clues":["if he collects from two stalls that are neighbours in the row","no two chosen stalls are neighbours in the row","the largest possible total of licence fees","take the biggest fee, then the next biggest that is not a neighbour"],"decoys":["The market is famous for its sesame dumplings and for a vendor who sells hand-painted fans","A fortune-teller sits in a booth at the corner"],"core":"Choose items from a row, no two adjacent, to maximise the total.","gloss":[["snag","an unexpected difficulty",true],["gaunt","thin and haggard",true],["delicacy","a rare or special food",true],["imperial","of an empire or emperor",true],["inspection","an official check",true]],"why":{"gr-local":"Taking the best available first looks natural but is shown wrong by the story's own example.","dp-kadane":"That is for contiguous runs, not for picking separated items."},"alt":[],"tell":"Take-or-skip with a no-neighbours rule: the best up to this stall is either the best without it, or this stall plus the best up to two before.","task":"Print the largest total that can be collected without choosing two neighbouring stalls.","sample":{"in":"5\n2 7 9 3 1","out":"12","why":"Stalls 1, 3 and 5: 2 + 9 + 1."}},{"id":"sc-166","v":"dp-kadane","dom":"whaling","diff":"E","title":"The Ledger of the Whaler Perseverance","story":"The whaling ship Perseverance has spent three years in the Southern Ocean, and her owners in New Bedford, a firm of cautious Quakers, have asked the first mate to examine the ship's daily ledger with an eye to understanding when the voyage went well and when it went badly. The ledger has one line for each day at sea, in order, from the day the ship left port to the day she returned. Each line records a single whole number: the net result of that day in dollars, counting the value of the oil taken and subtracting the day's costs, such as wages, provisions and repairs. A good day yields a positive figure, a day of calm and no whales yields a negative one, and many days in between yield small figures either way.\n\nThe owners want to identify the best stretch of the voyage: a period of consecutive days, at least one day long, with no day left out in the middle, over which the net results add up to the largest total. They do not care when the stretch began or how long it lasted, only how much it earned. If every single day of the voyage lost money, the best stretch is simply the least bad single day. The owners have heard that some captains choose the best stretch by looking at every possible start and every possible end, but the ledger has some two million lines and the owners' clerk is elderly.\n\nThe mate has noticed that at any given day, the best stretch that finishes on that day is either that day on its own, or that day added to the best stretch that finished on the previous
