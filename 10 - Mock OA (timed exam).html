 day, whichever is better. That seems to him to be the key to the problem.\n\nThe ship's cat, called Ahab by the crew, once fell overboard and was recovered by a boat hook. The cook's biscuits were so hard that the sailors used them as ballast. The captain read the Psalms aloud on Sundays, but only if the weather allowed.\n\nInput: line one gives N, the number of days. Line two gives the N daily net results, each between -10^9 and 10^9.\n\nOutput: the largest total of any run of consecutive days.\n\nConstraints: N up to 2 * 10^6.","clues":["a period of consecutive days, at least one day long, with no day left out in the middle","the largest total","the best stretch that finishes on that day is either that day on its own, or that day added to the best stretch that finished on the previous day"],"decoys":["The ship's cat, called Ahab by the crew, once fell overboard","The cook's biscuits were so hard that the sailors used them as ballast"],"core":"Find the run of consecutive values with the largest total, where values may be negative and the run must have at least one value.","gloss":[["whaling","hunting whales for oil and other products",true],["provisions","supplies of food",true],["ballast","heavy material carried to steady a ship",true],["net","after deductions",true],["Quakers","members of a Christian religious group",true]],"why":{"ps-longest":"Running totals can solve it, but the story points at the 'best run ending today' relation, the direct approach.","sw-longest":"No cap or rule bounds the run."},"alt":["ps-longest"],"tell":"Best run ending at each day: either start again today, or extend yesterday's best run.","task":"Print the largest total of any run of consecutive days.","sample":{"in":"6\n3 -4 5 -1 2 -6","out":"6","why":"Days 3 to 5: 5 - 1 + 2 = 6."}},{"id":"sc-167","v":"dp-coin","dom":"penny arcades","diff":"M","title":"The Token Machine of the Brighton Arcade","story":"On the pier at Brighton there stands a penny arcade of the old school, and its proprietor, a stout and cheerful gentleman by the name of Alfred Pettigrew, has issued a series of brass tokens for use in his machines. The tokens come in several different values, written on their faces in pennies: perhaps a 1, a 5, a 12, a 21, and so on, as Alfred's whims have taken him over the years. There are a great many tokens of each value in the till, as many as are needed, so that no value can ever run out.\n\nAn eccentric lady visits the arcade each Tuesday and insists on paying for her amusements with the fewest tokens possible. Today she wishes to pay exactly A pennies for a go on the mechanical horse-racing game, and no more or less; the machine does not give change. She can use any number of tokens of any value, as many of one value as she likes. Alfred wishes to tell her the fewest number of tokens she needs to hand over so that their values add up to exactly A pennies. If it cannot be done with the denominations he has issued, he must say so.\n\nAlfred has observed something peculiar about his own choice of denominations. When he takes the largest token that fits, then the largest that fits into what remains, and so on, he sometimes gets an answer that is not the fewest. For instance, with tokens of 1, 5 and 12 pennies and a sum of 15, taking the 12 first requires three more 1-pence tokens, four tokens in all, whereas three 5-pence tokens suffice. So the lady's amount cannot simply be paid by grabbing the biggest token each time.\n\nThe arcade has a fortune-telling machine, a brass automaton called Madame Zara, who has a distinctive laugh. The seagulls on the pier have a notorious fondness for chips. A brass band plays on Sundays, weather permitting.\n\nInput: line one gives K and A: the number of denominations and the amount to pay. Line two gives the K denominations.\n\nOutput: the fewest tokens that sum to exactly A, or -1 if impossible.\n\nConstraints: K up to 100; denominations between 1 and 10^4; A up to 10^6.","clues":["as many as are needed, so that no value can ever run out","the fewest number of tokens she needs to hand over so that their values add up to exactly A pennies","takes the largest token that fits, then the largest that fits into what remains","with tokens of 1, 5 and 12 pennies and a sum of 15"],"decoys":["The arcade has a fortune-telling machine, a brass automaton called Madame Zara","The seagulls on the pier have a notorious fondness for chips"],"core":"Fewest items, each denomination usable unlimited times, to reach an exact total; the largest-first idea fails.","gloss":[["proprietor","an owner of a business",true],["denominations","the face values of coins or tokens",true],["eccentric","unconventional and odd",true],["automaton","a mechanical figure",true],["whims","sudden fancies",true]],"why":{"gr-local":"Taking the largest first is shown wrong by the story's own example.","dp-knapsack":"Here each value can be used any number of times, not just once."},"alt":[],"tell":"Unlimited items of fixed values making an exact total: the answer for an amount is one more than the best of the answers for amounts a token smaller.","task":"Print the fewest tokens that sum to exactly A, or -1.","sample":{"in":"3 27\n2 5 10","out":"4","why":"10 + 10 + 5 + 2 = 27."}},{"id":"sc-168","v":"dp-lis","dom":"zen gardens","diff":"M","title":"The Stepping Stones of the Kōrin Garden","story":"The Kōrin Garden in Kyoto is a place of quiet where a gardener, Master Hideo Tanabe, has laid a path of stepping stones across a pond of white gravel raked to resemble water. There are N stones, set out in a long line from the gate to the teahouse, and each stone is a different height above the gravel, in centimetres, because the gardener holds that a rising path leads the mind upward, though not necessarily in a straight, even slope. The heights are recorded in order of position, from the gate to the teahouse. Stones may have the same height as a neighbour, since the quarry supplied them by the cartload.\n\nThe abbot of the neighbouring temple, a man of unusual fastidiousness, has decreed that on the Day of Falling Leaves a procession shall walk to the teahouse, and that each monk of the procession shall step on a number of stones in a manner dictated by the abbot's rule. The rule is this: the monk steps on stones in the order they lie from gate to teahouse, but need not step on every stone; the stones he does tread on must rise in height, each one strictly higher than the one before it. He may skip any stone he pleases, even long runs of them, so long as he never goes backwards towards the gate.\n\nMaster Tanabe has been asked by the abbot how many stones the longest such sequence of treads could contain, so that the abbot may arrange the procession to give the greatest number of monks a seat on the path. He is not interested in which stones form the sequence, only in its length.\n\nThe garden has a famous moss, cultivated over centuries, which visitors are forbidden to touch. A carp in the pond is said to be older than the temple. The tea served in the teahouse is bitter, as it should be.\n\nInput: line one gives N. Line two gives the N heights in order from the gate.\n\nOutput: the greatest number of stones that can be chosen, in order of position, with strictly rising heights.\n\nConstraints: N up to 10^5; heights up to 10^9. Considering every possible choice of stones to tread on is impossible, since the number of choices doubles with each additional stone.","clues":["need not step on every stone","must rise in height, each one strictly higher than the one before it","never goes backwards towards the gate","how many stones the longest such sequence of treads could contain"],"decoys":["The garden has a famous moss, cultivated over centuries","A carp in the pond is said to be older than the temple"],"core":"Find the length of the longest strictly rising subsequence (not necessarily consecutive) of a list.","gloss":[["fastidiousness","great attention to detail and tidiness",true],["decreed","ordered officially",true],["teahouse","a building for the tea ceremony",true],["tread","to step on",true],["cartload","the amount a cart carries",true]],"why":{"dp-kadane":"That is for consecutive runs; here items may be skipped.","sw-longest":"A moving frame over neighbours cannot skip stones."},"alt":[],"tell":"A longest rising selection with skipping allowed: for each stone, the best chain ending there extends the best chain of any lower earlier stone.","task":"Print the greatest number of stones that can be chosen, in order of position, with strictly rising heights.","sample":{"in":"8\n0 8 4 12 2 10 6 14","out":"4","why":"For example 0, 4, 10, 14."}},{"id":"sc-169","v":"dp-grid","dom":"rice paddies","diff":"M","title":"The Water Carrier of the Yunnan Terraces","story":"In the mountains of Yunnan, a farming family tends a hillside of rice paddies cut into a rectangular grid, R rows by C columns, each paddy a small square field with its own embankment. Water comes down from a spring at the top left corner of the grid, and must be carried by a family member to the shrine at the bottom right corner, where it is poured out as an offering on the first day of planting. The carrier walks along the embankments, and may step from a paddy only to the paddy immediately to the right of it or the paddy immediately below it, never up the hill or back to the left, because the slope is too steep and the embankments too slippery.\n\nEach paddy has a different effort of crossing, depending on the depth of mud and the height of the embankment: a whole number, positive, written on a stone marker at its corner. The carrier pays the effort of every paddy she stands in, including the first and the last. The grandmother of the family, who has carried the water for fifty years, claims that she can always tell the easiest route by looking at the fields, but her granddaughter, a student of mathematics at the provincial university, suspects that the grandmother's route is not always the best one.\n\nThe family wants to know the smallest total effort for a carrier going from the top left paddy to the bottom right paddy, moving only right or down. They do not want the route itself. The student has also pointed out that the number of different routes through even a modest grid is enormous, and that trying every one is out of the question.\n\nThe terraces are lit at dusk by thousands of tiny oil lamps, a sight that attracts photographers from distant provinces. The family keeps ducks in the flooded paddies. A cousin in the city sends parcels of tea.\n\nInput: line one gives R and C. The next R lines each give C efforts.\n\nOutput: the smallest total effort of a route from the top-left paddy to the bottom-right paddy using only moves right and down.\n\nConstraints: R and C up to 2000; efforts between 1 and 1000. Because the carrier can only move right or down, the cheapest way to reach any paddy depends only on the cheapest ways to reach the paddy above it and the paddy to its left.","clues":["may step from a paddy only to the paddy immediately to the right of it or the paddy immediately below it","pays the effort of every paddy she stands in, including the first and the last","the number of different routes through even a modest grid is enormous","the cheapest way to reach any paddy depends only on the cheapest ways to reach the paddy above it and the paddy to its left"],"decoys":["The terraces are lit at dusk by thousands of tiny oil lamps","The family keeps ducks in the flooded paddies"],"core":"Cheapest route from the top-left to the bottom-right of a grid, moving only right or down.","gloss":[["paddy","a flooded field for growing rice",true],["embankment","a raised bank of earth",true],["shrine","a holy place",true],["provincial","of a region outside the capital",true],["terraces","flat steps cut into a hillside",true]],"why":{"gr-bfs":"Fewest steps is trivial here, since every route has the same number; cost is what varies.","sp-dijkstra":"It would work, but the restricted moves make a simpler table enough."},"alt":["sp-dijkstra"],"tell":"Moves limited to right and down: the best cost into a cell comes from the cell above or the cell to its left, so fill the table in order.","task":"Print the smallest total effort of a route from the top-left paddy to the bottom-right paddy moving only right or down.","sample":{"in":"3 3\n2 1 3\n4 6 1\n5 2 1","out":"8","why":"Right, right, down, down: 2+1+3+1+1 = 8."}},{"id":"sc-170","v":"dp-twostring","dom":"palaeography","diff":"H","title":"The Two Copies of the Lindisbrook Gospel","story":"Dr Winifred Aldous, a palaeographer at the university library, has been given two manuscript copies of the same short passage, made by two different scribes in the same monastery. Copied by hand in an age before print, the two versions differ here and there, where a scribe grew tired or misread his exemplar. Dr Aldous has transcribed each passage into a string of letters, without spaces or punctuation, so that the two strings, call them A and B, can be compared character by character. A is the earlier copy and B the later.\n\nShe wishes to measure the distance between the two copies in the following way. A correction is one of three operations on a string: inserting a single letter at any position; deleting a single letter from any position; or replacing one letter by another. The distance between A and B is the smallest number of corrections needed to turn A into B exactly. For example, turning 'kitten' into 'sitting' takes three corrections: replace k by s, replace e by i, and insert g at the end. Dr Aldous does not need to know which corrections they are, only how many.\n\nHer first method was to try every possible sequence of corrections until A became B, and her second was to compare the strings position by position, counting the mismatches. The first method took longer than the lifetime of the manuscript, and the second gave nonsense whenever the scribe had omitted a single early letter, shifting everything after it by one place.\n\nThe library is said to be haunted by the ghost of a bibliophile who died while reading in the rare books room. The reading room's radiators clank alarmingly. A rival palaeographer in Edinburgh has published a fierce review of Dr Aldous's last paper and she has not forgiven him.\n\nInput: line one gives the lengths N and M of A and B. Line two gives A and line three gives B, both in lowercase letters.\n\nOutput: the smallest number of insertions, deletions and replacements needed to turn A into B.\n\nConstraints: N and M up to 3000. The best distance between a front part of A and a front part of B is built from the distances between slightly shorter front parts.","clues":["inserting a single letter at any position; deleting a single letter from any position; or replacing one letter by another","the smallest number of corrections needed to turn A into B exactly","compare the strings position by position, counting the mismatches","The best distance between a front part of A and a front part of B is built from the distances between slightly shorter front parts"],"decoys":["The library is said to be haunted by the ghost of a bibliophile","A rival palaeographer in Edinburgh has published a fierce review"],"core":"The minimum number of insertions, deletions and replacements needed to turn one string into another.","gloss":[["palaeographer","a scholar of ancient handwriting",true],["exemplar","the original that a copy is made from",true],["transcribed","written out from another form",true],["manuscript","a handwritten document",true],["bibliophile","a lover of books",true]],"why":{"dp-grid":"A table over two strings looks like a grid, but the moves are insert, delete and replace, not right and down with costs.","ms-match":"No nesting is involved."},"alt":[],"tell":"Two sequences compared with edit operations: the answer for a pair of front parts comes from the three neighbouring pairs in a table.","task":"Print the smallest number of insertions, deletions and replacements that turn A into B.","sample":{"in":"5 3\nhorse\nros","out":"3","why":"horse -> rorse -> rose -> ros."}},{"id":"sc-171","v":"dp-knapsack","dom":"polar expeditions","diff":"M","title":"The Sledge Load of the Erebus Party","story":"The Erebus Party is a polar expedition preparing for its final push towards the pole, and the leader, Captain Reginald Falconer, must decide which of the N items in the stores the men should drag on the last sledge. Each item has been weighed and has also been assigned a value by the expedition's committee, a whole number reflecting how greatly it contributes to the success of the mission: a theodolite, a tin of pemmican, a spare pair of snow goggles, the Union Jack, and so on. There is exactly one of each item in the stores; there are no duplicates, and the Captain cannot take half of an item or take it twice.\n\nThe sledge, having been built by a local carpenter of limited ambition, cannot haul more than W kilograms in total, and any greater load would see the runners dig into the snow and the men exhausted within a mile. The Captain must therefore choose a set of items, each at most once, with the combined weight not exceeding W, so that the combined value is as great as possible. He does not care how many items are taken or which ones, only that the value is the best the sledge can carry.\n\nThe Captain's second-in-command, Lieutenant Barrow, has proposed that they take the items in order of value per kilogram, starting with the best and continuing until the sledge is full. The Captain, who dislikes the lieutenant, has nevertheless noticed that this can lose. If the sledge may carry 10 kilograms, and there are items of weights 6, 5 and 5 with values 10, 8 and 8, then taking the item with the best ratio first (the first, weight 6, ratio 1.67) blocks the pair of 5-kilogram items, which together are worth 16.\n\nThe expedition's ship is frozen into the ice a hundred miles from the nearest land. The cook has acquired a taste for penguin eggs. A gramophone plays Gilbert and Sullivan on the evenings when the wind is not too fierce.\n\nInput: line one gives N and W. The next N lines each give an item's weight and its value.\n\nOutput: the greatest total value of a set of items whose total weight is at most W.\n\nConstraints: N up to 200; W up to 10^4; weights up to W; values up to 10^6.","clues":["exactly one of each item in the stores","cannot take half of an item or take it twice","the combined weight not exceeding W, so that the combined value is as great as possible","take the items in order of value per kilogram"],"decoys":["The cook has acquired a taste for penguin eggs","A gramophone plays Gilbert and Sullivan on the evenings when the wind is not too fierce"],"core":"Choose items, each at most once, within a weight limit, to maximise total value; best-ratio-first can fail.","gloss":[["theodolite","a surveying instrument for measuring angles",true],["pemmican","a mixture of dried meat and fat",true],["sledge","a vehicle for sliding over snow",true],["pole","the northern or southern end of the earth's axis",true],["committee","a group chosen to decide a matter",true]],"why":{"gr-local":"Taking the best ratio first is shown wrong by the story's own example.","dp-coin":"Items here may be taken only once, not repeatedly."},"alt":[],"tell":"Each item once, weight limit, best value: for each item, the best with a given capacity is either without it or with it plus the best on the smaller capacity.","task":"Print the greatest total value of a set of items with total weight at most W (each item at most once).","sample":{"in":"3 50\n10 60\n20 100\n30 120","out":"220","why":"Take the items of weight 20 and 30."}},{"id":"sc-172","v":"dp-interval","dom":"paper mills","diff":"H","title":"The Reel Mergers at Thornley Mill","story":"The paper mill at Thornley produces newsprint on long reels, and at the end of each week the reels that remain unsold are stored in a line on the warehouse floor, side by side, in the order in which they were made. There are N reels in the line, and each has a known weight in kilograms. The mill's manager, a practical man named Obadiah Sneddon, wishes to join the reels into a single great reel so that the whole stock can be shipped in one consignment to a customer in the capital.\n\nThe only machine that can join reels is a splicing frame in the corner of the warehouse, and it can join only two reels at a time. Moreover, because the warehouse floor is narrow and the reels are heavy, the frame can only be fed two reels that are NEXT TO EACH OTHER in the line: the reels cannot be lifted out and moved. When two neighbouring reels are joined, they become a single reel whose weight is the sum of the two, and which takes their place in the line between the reels that had been on either side of them. The cost of a joining is the weight of the reel it produces, because the heavier the reel, the more power the frame uses.\n\nObadiah wishes to find the least total cost of joining all the reels into one. The order in which neighbouring pairs are joined matters: with three reels of weights 1, 100 and 1, joining the first two (cost 101) and then the result with the third (cost 102) costs 203, whereas joining the last two first (cost 101) and then the first with the result (cost 102) costs the same, but with reels of 10, 1, 10, 1, 10 the costs vary widely depending on the order.\n\nThe warehouse is notorious for mice, and the manager keeps two cats on the payroll. The canteen serves an enormous meat pudding on Thursdays. A union delegate from the city is due to visit next week, and Obadiah has been practising diplomacy.\n\nInput: line one gives N. Line two gives the N reel weights in order of the line.\n\nOutput: the smallest total cost of joining all reels into one.\n\nConstraints: N up to 400; weights up to 10^4. Considering every possible order of joinings is out of the question, as the number of orders grows astronomically. The best way to join the reels from the i-th to the j-th depends on the best ways of joining shorter stretches within.","clues":["the frame can only be fed two reels that are NEXT TO EACH OTHER in the line","the reels cannot be lifted out and moved","The order in which neighbouring pairs are joined matters","The best way to join the reels from the i-th to the j-th depends on the best ways of joining shorter stretches within"],"decoys":["The warehouse is notorious for mice, and the manager keeps two cats on the payroll","A union delegate from the city is due to visit next week"],"core":"Merge adjacent items repeatedly into one, minimising total cost, where the best way for a stretch depends on the best ways for shorter stretches inside it.","gloss":[["newsprint","cheap paper used for newspapers",true],["splicing","joining ends together",true],["consignment","a batch of goods sent together",true],["unsold","not yet purchased",true],["diplomacy","skill in handling people tactfully",true]],"why":{"hp-greedy":"If any two reels could be joined, always joining the two lightest would work; here only neighbours can be joined, which forbids that.","dp-knapsack":"There is no weight limit or choice of items."},"alt":[],"tell":"Only neighbours may be merged, so the last merge splits the line in two: try each split point for every stretch, shortest stretches first.","task":"Print the smallest total cost of joining all reels into one (only neighbouring reels may be joined; a joining costs the new reel's weight).","sample":{"in":"4\n3 2 4 1","out":"20","why":"Join 3+2 (5), then 4+1 (5), then 5+5 (10): 5+5+10 = 20."}},{"id":"sc-173","v":"bk-subsets","dom":"assay offices","diff":"M","title":"The Weights of the Goldsmiths' Assay Office","story":"The Assay Office of Goldsmiths' Row has a set of N brass weights of known masses, which the assayer, a precise lady named Perpetua Lovegrove, uses to weigh gold against. Each weight is a whole number of grains, and the weights are laid out in a rack in increasing order of size, with no two weights of the same mass. The office has a ceremonial duty each year: to demonstrate to the Guild all the different ways in which a weight of T grains can be balanced using the brass weights from the rack. A particular way is a collection of weights taken from the rack, any weights may be used at most once in a collection, and the masses in the collection add up to exactly T.\n\nThe Guild has asked for the full list. It does not want a count; it wants every collection written out, one per line, with the masses in each collection given in increasing order, and the collections themselves in no particular order. Two collections are the same if they use the same weights, regardless of the order in which they might be placed on the scale. If there is no way to balance T, the list is empty, and the Guild will be quite satisfied to be told so.\n\nThe assayer has observed that while building a collection, if the weights chosen so far already exceed T, there is no point adding anything more or considering the later weights in the rack, since they are heavier still. She wants to avoid building collections that cannot possibly succeed. She also needs to avoid listing the same collection twice. The rack is small, with at most twenty weights, and T is at most a few hundred grains, so the list of ways will not be very long.\n\nThe Assay Office has a stamp which it uses to hallmark gold, depicting a leopard's head. The Guild's annual feast includes a roast swan, though this custom has recently been questioned. Perpetua's hat is the subject of local legend.\n\nInput: line one gives N and T. Line two gives the N masses in increasing order.\n\nOutput: each collection on its own line, masses in increasing order; print nothing if no collection exists.\n\nConstraints: N up to 20; masses up to 500; T up to 500.","clues":["any weights may be used at most once in a collection","it wants every collection written out","if the weights chosen so far already exceed T, there is no point adding anything more","She also needs to avoid listing the same collection twice"],"decoys":["The Assay Office has a stamp which it uses to hallmark gold","The Guild's annual feast includes a roast swan"],"core":"List every selection of items from a small set that adds up to a target, avoiding repeats and cutting off any selection that already exceeds the target.","gloss":[["assayer","a person who tests the purity of metals",true],["grains","a small unit of weight",true],["hallmark","an official mark stamped on precious metal",true],["ceremonial","used for formal rituals",true],["collection","a group of things gathered together",true]],"why":{"bt-subsets":"Counting subsets by walking all binary patterns does not list them with early cutoffs; here a pruned search is wanted, and the size is only small enough for it.","dp-knapsack":"A table could count the ways, but the Guild wants every way written out."},"alt":["bt-subsets"],"tell":"List every qualifying selection: pick or skip each item in turn, abandon a path once its total exceeds the target, and undo the pick on return.","task":"Print each collection of weights totalling exactly T, one per line, masses in increasing order.","sample":{"in":"5 9\n1 2 3 4 5","out":"1 3 5\n2 3 4\n4 5","why":"Each line is a set of rack weights adding to 9."}},{"id":"sc-174","v":"bk-perms","dom":"tea ceremony","diff":"E","title":"The Seven Utensils of Master Rikyū's School","story":"In the Way of Tea, as taught at a certain school in the old capital of Kyoto, the host arranges the utensils for the ceremony in a precise order, and the order is itself a form of expression, a language in which an experienced guest may read the host's mood. A student of the school, a young woman named Sakura Mizuno, has been set an exercise by her master. She is given N distinct utensils, N being at most eight, among them a tea bowl, a whisk, a scoop, a caddy, a ladle, a kettle and a cloth. Her task is to write out every possible order in which the host might lay out all N utensils, using each utensil exactly once in each arrangement.\n\nThe master insists on completeness. Each different order must appear once and only once in her list, and no order may be missing. The order in which the orders themselves are listed does not matter. If N is three and the utensils are named A, B and C, then she must write six orders: ABC, ACB, BAC, BCA, CAB and CBA. With eight utensils she would have to write out more than forty thousand orders, and the master is a patient man.\n\nSakura's first plan was to write the orders by hand, one after another, hoping to remember which she had done; she very quickly lost track and wrote the order BAC three times. Her second plan, to generate random orders and keep the new ones, was abandoned after she calculated how long it would take to be sure that none were missing. Her friend Haruka suggested a method in which she fixes the first utensil, then fixes the second from those remaining, and so on, laying them out one at a time and picking each up again when she has finished with that arrangement, to try the next option.\n\nThe school's garden is famous for its moss and for the quality of its autumn maples. The tea served at the end of lessons is considerably better than the tea made by students. A wandering monk sometimes stops at the gate for a bowl of rice.\n\nInput: line one gives N. Line two gives N distinct names of utensils.\n\nOutput: every order of the names, one per line, each name separated by spaces, each order exactly once, in any order of listing.\n\nConstraints: N at most 8.","clues":["every possible order in which the host might lay out all N utensils, using each utensil exactly once","Each different order must appear once and only once in her list","she fixes the first utensil, then fixes the second from those remaining","picking each up again when she has finished with that arrangement"],"decoys":["The school's garden is famous for its moss and for the quality of its autumn maples","A wandering monk sometimes stops at the gate for a bowl of rice"],"core":"List every ordering of N distinct items, each used exactly once, with no repeats.","gloss":[["caddy","a small container for tea leaves",true],["whisk","a tool for beating",true],["host","the person who receives guests",true],["expression","a way of showing a feeling or idea",true],["completeness","having nothing missing",true]],"why":{"bk-subsets":"Selecting some of the items is different from ordering all of them.","bt-dp":"No cost is being minimised."},"alt":[],"tell":"All orderings of distinct items: fix one position at a time with any unused item, recurse, then put it back.","task":"Print every order of the utensils, one per line.","sample":{"in":"3\nbowl whisk scoop","out":"bowl whisk scoop\nbowl scoop whisk\nwhisk bowl scoop\nwhisk scoop bowl\nscoop bowl whisk\nscoop whisk bowl","why":"Three utensils make six orders."}},{"id":"sc-175","v":"bk-board","dom":"castle garrisons","diff":"H","title":"The Sentinels of the Courtyard at Rhydd Castle","story":"The garrison commander of Rhydd Castle, a taciturn veteran named Sir Gawain Pritchard, has been given the task of posting N sentinels in the castle's courtyard, which is paved in a square of N by N flagstones. His orders from the lord of the castle are exact. Each sentinel stands on a single flagstone, and a sentinel can see, and so guard against, any intruder who stands anywhere on his own row, anywhere on his own column, and anywhere along either of the two diagonals that pass through his flagstone, as far as the walls of the courtyard. A sentinel does not block the view of another; they see straight through one another, as they were trained to do.\n\nSir Gawain must post all N sentinels so that no sentinel can see any other sentinel: that is, no two sentinels may share a row, a column, or a diagonal. If this cannot be done, he is to report that the courtyard cannot be guarded in this fashion. The lord of the castle, a man whose reasoning is occasionally capricious, wants to know in how many different ways the sentinels can be posted. Two postings are different if at least one flagstone holds a sentinel in one and not in the other. The sentinels themselves are indistinguishable.\n\nThe commander's first idea was to try every possible set of N flagstones from the N-squared available, but even for a courtyard of eight by eight flagstones that is billions of sets. His second idea was to place sentinels one row at a time, working from the top, choosing a column for each row that does not clash with those already posted, and, whenever he finds there is nowhere in a row to put a sentinel, to withdraw the sentinel posted in the row above and move him to a different column.\n\nThe castle is built on a rock above a river that floods in spring. The cook is a Breton, a fact that the garrison's palates have never forgiven. A family of ravens has nested in the keep for generations, and are said to bring good fortune.\n\nInput: a single integer N.\n\nOutput: the number of distinct ways to post N sentinels with none visible to another.\n\nConstraints: N at most 12.","clues":["no two sentinels may share a row, a column, or a diagonal","in how many different ways the sentinels can be posted","place sentinels one row at a time, working from the top","withdraw the sentinel posted in the row above and move him to a different column"],"decoys":["The cook is a Breton, a fact that the garrison's palates have never forgiven","A family of ravens has nested in the keep for generations"],"core":"Count the ways to place N pieces on an N by N board so that none share a row, column or diagonal, placing row by row and undoing when stuck.","gloss":[["sentinel","a guard posted to watch",true],["flagstone","a flat paving stone",true],["capricious","changing unpredictably",true],["garrison","troops stationed in a place",true],["indistinguishable","impossible to tell apart",true]],"why":{"bk-perms":"Orderings are part of it, but the board's diagonal rule is the heart of the problem and calls for early abandonment of clashing placements.","gr-flood":"No clusters are counted."},"alt":[],"tell":"Place pieces one row at a time, reject clashes at once, and undo the last placement when a row has no free square.","task":"Print the number of ways to post N sentinels so that none is visible to another.","sample":{"in":"4","out":"2","why":"A four by four courtyard has two valid postings."}},{"id":"sc-176","v":"gr-reach","dom":"ice floes","diff":"M","title":"The Floes of the Breaking Fjord","story":"When the spring thaw comes to the fjord at Narvik, the ice breaks into floes that drift side by side across the water, and every year the schoolchildren of the village perform a traditional crossing, hopping from floe to floe, in an ancient ceremony meant to bring luck to the fishing season. The floes are numbered from 0, the shore floe on which the children begin, to N - 1, the far floe by the harbour wall, which is where they must end. The floes lie in a line across the fjord, each floe next to the one numbered one higher.\n\nThe floes differ in how firmly the child may push off them. Standing on floe i, a child can jump forward a distance of at most A[i] floes: that is, to any floe numbered from i + 1 up to i + A[i], whichever the child prefers, but no further and never backwards. A floe with a push-off of zero is rotten and gives no purchase at all, so that a child standing there cannot jump anywhere. The numbers A[i] are known from the village elders' survey, and a child may choose to jump a shorter distance than the maximum if it suits.\n\nThe schoolmistress, Mrs Solveig Haugen, wants to know the smallest number of jumps with which the whole crossing can be made, from floe 0 to floe N - 1, because the children are small and the water is cold. If the far floe cannot be reached, she wishes to be told so. She does not want the route.\n\nShe has noted that it is not necessary to try all possibilities at each floe. At every step she needs only to ask, among all the floes the children could reach with the jumps taken so far, how far along the line the best of them could take them next, and to commit to a further jump only when the current reach has been exhausted.\n\nThe village is famous for its salted cod and its brass band. A wind from the north has brought a fine drizzle. The fjord's herring have been late this year.\n\nInput: line one gives N. Line two gives N push-off values A[0] to A[N-1].\n\nOutput: the smallest number of jumps to reach floe N - 1, or -1 if it cannot be reached.\n\nConstraints: N up to 10^6; A[i] up to 10^5.","clues":["a child can jump forward a distance of at most A[i] floes","the smallest number of jumps with which the whole crossing can be made","among all the floes the children could reach with the jumps taken so far, how far along the line the best of them could take them next","commit to a further jump only when the current reach has been exhausted"],"decoys":["The village is famous for its salted cod and its brass band","The fjord's herring have been late this year"],"core":"Find the fewest jumps to reach the end of an array where each position allows a jump up to a given length, by tracking the furthest reach.","gloss":[["fjord","a long narrow sea inlet between cliffs",true],["floes","sheets of floating ice",true],["purchase","a firm grip",true],["thaw","a spell of warmer weather melting ice",true],["survey","a detailed examination",true]],"why":{"dp-linear":"A table of best counts for each floe would work but costs more than a single sweep tracking the furthest reach.","gr-bfs":"The same idea appears as layers, but the floes are in a line, and a sweep with a running furthest reach is the direct approach."},"alt":["dp-linear","gr-bfs"],"tell":"Furthest reach: keep how far the current jump can reach and how far the next could reach; when you pass the current limit, count a jump.","task":"Print the smallest number of jumps to reach floe N - 1, or -1.","sample":{"in":"5\n2 3 1 1 4","out":"2","why":"Jump 1 from floe 0, then 3 from floe 1."}},{"id":"sc-177","v":"gr-pair","dom":"elephant rides","diff":"E","title":"The Howdahs of the Jaipur Pageant","story":"At the great winter fair in Jaipur, tourists may ride the festival elephants up the hill to the palace in howdahs, which are the canopied seats strapped to the elephants' backs. Each elephant carries a single howdah, which has room for at most two passengers, and its frame can bear a total weight of at most L kilograms, no more, or the straps will break. The elephant keepers, each of whom is paid by the trip, wish to carry a party of N tourists up the hill in the fewest trips possible. The tourists have all been weighed at the gate, and every tourist weighs at most L, so that any tourist can ride alone if need be.\n\nA trip carries either one tourist or two tourists together, and two tourists may travel together only if their combined weight does not exceed L. Every tourist must be carried up exactly once. The head keeper, an old man named Hari Singh, wishes to know the smallest number of trips that will carry the whole party. He does not mind which tourists ride together, only that no trip is overloaded and that the count of trips is as small as it can be.\n\nHari Singh has noticed a few things. The heaviest tourist in the party is going to be hard to pair, and if the heaviest cannot be paired with the lightest, then there is no one in the party with whom he can be paired, and he must ride alone. The lightest tourist, by contrast, is a good partner for anybody. An apprentice has attempted to pair the tourists in the order in which they arrived, but found that this led to more trips than were needed, because he had paired two light tourists together, leaving two heavy ones who had to ride alone.\n\nThe palace at the top of the hill is pink and has more than nine hundred windows. A snake charmer sets up near the gate, and a boy sells paper kites. The elephants are decorated with painted patterns that take an hour to apply and are gone after a single rain.\n\nInput: line one gives N and L. Line two gives the N tourist weights.\n\nOutput: the smallest number of trips.\n\nConstraints: N up to 10^6; weights between 1 and L; L up to 10^9. The weights are given in the order the tourists were weighed at the gate, which is no order at all.","clues":["room for at most two passengers","two tourists may travel together only if their combined weight does not exceed L","the smallest number of trips","if the heaviest cannot be paired with the lightest, then there is no one in the party with whom he can be paired"],"decoys":["The palace at the top of the hill is pink and has more than nine hundred windows","A snake charmer sets up near the gate, and a boy sells paper kites"],"core":"Pair people so that each pair's total is within a limit, using the fewest groups; try pairing the heaviest with the lightest.","gloss":[["howdah","a canopied seat on an elephant's back",true],["canopied","covered by a roof or awning",true],["passengers","people carried by a vehicle or animal",true],["keeper","a person who looks after animals",true],["apprentice","someone learning a trade",true]],"why":{"tp-ends":"Two ends are used in the solution, but only after sorting; the underlying decision is the choice of which pairs to make.","dp-coin":"No amounts are being made up from denominations."},"alt":["tp-ends"],"tell":"Sort by weight and pair from the ends: if the lightest fits with the heaviest, they go together; otherwise the heaviest rides alone.","task":"Print the smallest number of trips that carry every tourist (at most two per trip, combined weight at most L).","sample":{"in":"4 3\n3 1 2 2","out":"3","why":"Only 1 + 2 can share a trip."}},{"id":"sc-178","v":"gr-local","dom":"bookbinding","diff":"E","title":"The Leather Budget of the Marlowe Bindery","story":"The Marlowe Bindery is a small workshop in the old quarter of the city, where the master bookbinder, Aurelia Fenwick, binds volumes in calf, goatskin and the occasional rare shagreen. The bindery has received a large order, for N books of a particular size, and each book needs one whole hide of leather. At the leather merchant's, the hides are sold individually, each at a price in guineas that depends on the animal, the tanning and the blemishes. The merchant has N hides on his shelves, and every hide will serve for any book equally well, so that Aurelia does not care which hides she buys, only how many.\n\nAurelia has a budget: she has set aside B guineas for leather this month. She wishes to buy as many hides as she can, so as to bind as many books as possible, and she will pay for the hides she buys at the prices marked, with no discount for quantity. She cannot buy part of a hide, and she cannot buy the same hide twice. She is not required to spend all the money; any left over will be put towards the rent.\n\nShe wonders whether it would be better to buy a few expensive hides of finer quality, since they will make the nicer books, but the client's order says only that the books must be bound, and nothing about the leather, and the client is notoriously indifferent to how his books look. Her apprentice, a young man called Cuthbert, proposes buying the hides in the order in which they are displayed on the shelf, stopping when the money runs out; Aurelia dislikes the idea, since an expensive hide at the beginning of the shelf would use up the money for no reason.\n\nThe bindery is fragrant with the smell of paste and old leather. A parrot owned by the neighbouring bookseller can recite the opening lines of the Aeneid. The binder's bone folders are worn smooth by decades of use.\n\nInput: line one gives N and B. Line two gives the N prices.\n\nOutput: the largest number of hides that can be bought with a total price not exceeding B.\n\nConstraints: N up to 10^6; prices up to 10^9; B up to 10^15. Each hide that is bought removes the same amount of money from the budget as its price, and nothing else changes; and a cheaper hide always leaves at least as much money as a dearer one.","clues":["She wishes to buy as many hides as she can","every hide will serve for any book equally well","she cannot buy the same hide twice","a cheaper hide always leaves at least as much money as a dearer one"],"decoys":["A parrot owned by the neighbouring bookseller can recite the opening lines of the Aeneid","The binder's bone folders are worn smooth by decades of use"],"core":"With a budget and items of different prices, buy as many items as possible; buy the cheapest first.","gloss":[["shagreen","a rough leather made from sharkskin or rayskin",true],["guineas","an old British currency unit",true],["tanning","turning hide into leather",true],["bindery","a place where books are bound",true],["indifferent","not caring",true]],"why":{"dp-knapsack":"Each hide counts for one, so there is no value to maximise beyond the count; a table is overkill.","hp-greedy":"Always taking the cheapest does not need a structure that keeps changing; sorting once suffices."},"alt":[],"tell":"Maximise the number of purchases within a budget: take the cheapest first until the money runs out.","task":"Print the largest number of hides that can be bought with a total price not exceeding B.","sample":{"in":"5 20\n4 9 3 12 6","out":"3","why":"Hides costing 3, 4 and 6 come to 13; adding the 9 would make 22."}}],"patterns":[{"id":"two-pointers","name":"Two pointers","group":"linear","groupName":"Arrays & strings","variants":[{"id":"tp-ends","name":"Opposite ends, closing in"},{"id":"tp-write","name":"Same direction — read fast, write slow"},{"id":"tp-merge","name":"One pointer per sequence"},{"id":"tp-partition","name":"Three-way partition (Dutch flag)"},{"id":"tp-centre","name":"Expand around the centre"}]},{"id":"sliding-window","name":"Sliding window","group":"linear","groupName":"Arrays var LS = "mock-oa-v2";

try { var raw = localStorage.getItem(LS); if (raw) { var o = JSON.parse(raw); for (var k in ST) if (o[k] != null) ST[k] = o[k]; } } catch (e) {}

function shuffle(a) { var r = a.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function pick(cfg) {
  var pool = Q.slice();
  if (cfg.focus === "unseen") pool.sort(function (a, b) { return (ST.seen[a.id] || 0) - (ST.seen[b.id] || 0) || Math.random() - .5; });
  else if (cfg.focus === "weak") {
    var acc = function (q) { var s = ST.vstat[q.v]; return s && s.n ? s.ok / s.n : 0.5; };
    pool.sort(function (a, b) { return acc(a) - acc(b) || Math.random() - .5; });
  } else pool = shuffle(pool);
  var n = cfg.n === "all" ? pool.length : Math.min(cfg.n, pool.length);
  return shuffle(pool.slice(0, n));
}
function fmt(s) { s = Math.max(0, Math.floor(s)); var m = Math.floor(s / 60), x = s % 60; return m + ":" + (x < 10 ? "0" : "") + x; }

/* ---- the coach: the model reads what you typed, judges it, and nudges you toward what you missed.
        It runs on the hub's server, so the API key never reaches this page. Opened without the hub,
        or with no key in .env, the page still works: you read the reveal and mark yourself. ---- */
var COACH = { on: false, why: "open this page from the hub (python app.py) to use the coach" };
function coachStatus() {
  try {
    fetch("/api/coach").then(function (r) { return r.json(); }).then(function (d) {
      COACH = { on: !!d.on, model: d.model, why: d.why };
      if (V.screen === "quiz") renderKeep();
    }).catch(function () {});
  } catch (e) {}
}
function askCoach(it, message, teach) {
  it.busy = true; it.cerr = null; it.t0 = Date.now(); renderKeep();
  var body = { qid: it.q.id, answer: it.ans, hints: it.hints || 0, verdict: it.cv || null, message: message || null, teach: !!teach };
  fetch("/api/coach", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      it.busy = false; it.log = it.log || [];
      if (message) it.log.push({ who: "me", text: message });
      if (d.verdict) it.cv = d.verdict;
      if (d.reply) it.log.push({ who: "coach", text: d.reply, v: teach ? null : (d.verdict || it.cv), fallback: !teach && d.source !== "model", teach: !!teach });
      if (teach && d.ok) it.taught = true;
      it.cerr = d.ok ? null : (d.error || "the coach is unavailable");
      it.hints = (it.hints || 0) + 1;
      save(); renderKeep();
    })
    .catch(function () { it.busy = false; it.cerr = "could not reach the coach - is the hub still running?"; renderKeep(); });
}

var VLAB = { right: "that is it", close: "right neighbourhood", wrong: "not this one", unclear: "not enough to judge" };
var VCLS = { right: "ok", close: "part", wrong: "no", unclear: "" };

/* ---- grading: the coach's verdict, which you can overrule on the reveal if you disagree ---- */
function grade(q, it) {
  if (it.ovr != null) return { pts: it.ovr, kind: it.ovr === 1 ? "ok" : it.ovr === 0.5 ? "pattern" : "no" };
  if (it.taught) return { pts: 0, kind: "taught" };
  if (it.cv === "right") return { pts: 1, kind: "ok" };
  if (it.cv === "close") return { pts: 0.5, kind: "pattern" };
  if (it.cv === "wrong") return { pts: 0, kind: "no" };
  if (it.cv === "unclear") return { pts: 0, kind: "unclear" };
  return { pts: 0, kind: (it.ans || "").trim() ? "ungraded" : "none" };
}

/* ---- highlight clue / decoy phrases inside the story without ever using innerHTML ---- */
/* ---- the story, laid out like a HackerRank statement: short paragraphs, then Input Format / Output Format /
        Constraints as their own labelled blocks. `marked` adds the green clue / struck-through decoy marks. ---- */
var SECS = { "Input:": "Input Format", "Output:": "Output Format", "Constraints:": "Constraints" };
function paintStory(q, marked) {
  var story = q.story, marks = [];
  if (marked) {
    (q.clues || []).forEach(function (p) { var i = story.indexOf(p); if (i >= 0) marks.push([i, i + p.length, "clue"]); });
    (q.decoys || []).forEach(function (p) { var i = story.indexOf(p); if (i >= 0) marks.push([i, i + p.length, "decoy"]); });
    marks.sort(function (a, b) { return a[0] - b[0]; });
  }
  var box = el("div", "story"), off = 0, taskShown = false;
  story.split("\n\n").forEach(function (para) {
    var start = off, end = off + para.length; off = end + 2;
    if (!taskShown && para.indexOf("Input:") === 0 && q.task) { taskShown = true; box.appendChild(taskBox(q)); }
    var label = null, key = Object.keys(SECS).filter(function (k) { return para.indexOf(k) === 0; })[0];
    var host;
    if (key) { label = SECS[key]; start += key.length; while (story.charAt(start) === " ") start++;
      host = el("div", "sec " + label.split(" ")[0].toLowerCase()); host.appendChild(el("div", "sech", label)); }
    else host = box;
    var p = el("p"), pos = start;
    marks.forEach(function (m) {
      if (m[0] < pos || m[1] > end) return;
      p.appendChild(document.createTextNode(story.slice(pos, m[0])));
      p.appendChild(el("mark", m[2], story.slice(m[0], m[1])));
      pos = m[1];
    });
    p.appendChild(document.createTextNode(story.slice(pos, end)));
    if (key && p.firstChild && !marks.length) p.firstChild.textContent = p.firstChild.textContent.charAt(0).toUpperCase() + p.firstChild.textContent.slice(1);
    host.appendChild(p);
    if (key) box.appendChild(host);
  });
  if (!taskShown && q.task) box.appendChild(taskBox(q));
  if (q.sample) box.appendChild(sampleBox(q.sample));
  return box;
}
function taskBox(q) {
  var h = el("div", "sec task"); h.appendChild(el("div", "sech", "Your task")); h.appendChild(el("p", null, q.task)); return h;
}
function sampleBox(sm) {
  var h = el("div", "sec sample");
  h.appendChild(el("div", "sech", "Sample Input")); var a = el("pre", null, sm["in"]); h.appendChild(a);
  h.appendChild(el("div", "sech", "Sample Output")); var b = el("pre", null, sm.out || " "); h.appendChild(b);
  h.appendChild(el("div", "sech", "Explanation")); h.appendChild(el("p", null, sm.why));
  return h;
}
function highlighted(q) { return paintStory(q, true); }
function plainStory(q) { return paintStory(q, false); }

/* ---- the conversation with the coach, under the answer box ---- */
function coachPanel(it) {
  var c = el("div", "card");
  c.appendChild(el("div", "lab", "the coach"));
  (it.log || []).forEach(function (m, i) {
    if (m.who === "me") {
      var y = el("div", "box"); y.style.borderLeftColor = "var(--dim2)";
      y.appendChild(el("i", null, "you")); y.appendChild(document.createTextNode(m.text)); c.appendChild(y);

    }
    if (i === it.log.length - 1 && m.v) {
      var vd = el("div", "verd " + (VCLS[m.v] || "")); vd.style.marginBottom = "8px";
      vd.appendChild(el("b", null, VLAB[m.v] || m.v));
      var note = m.v === "right" ? "A full point for this one. Open the answer when you want to compare your reading against the clues."
        : m.v === "close" ? "Half a point as it stands. Rewrite your answer above and check again to go for the full point."
        : "Rewrite your answer above and check again, or write back to the coach below.";
      vd.appendChild(el("div", null, note));
      c.appendChild(vd);
    }
    var b = el("div", "box"); b.appendChild(el("i", null, m.teach ? "coach - the full explanation" : "coach"));
    if (m.teach) b.style.borderLeftColor = "var(--ok)";
    b.appendChild(document.createTextNode(m.text));
    if (m.fallback) b.appendChild(el("div", "small", "(a standard hint: the AI's first reply would have given the answer away, so this safe one was used)"));
    c.appendChild(b);
  });
  if (it.busy) {
    var w = el("div", "box"); w.appendChild(el("i", null, "coach"));
    w.appendChild(document.createTextNode("reading your answer against the story. "));
    var tick = el("span", null, "0s"); w.appendChild(tick);
    w.appendChild(el("div", "small", "Usually 15 to 40 seconds; longer if the first reply gave too much away and has to be asked again."));
    var t0 = it.t0 || Date.now();
    var iv = setInterval(function () {
      if (!it.busy || !tick.isConnected) { clearInterval(iv); return; }
      tick.textContent = Math.round((Date.now() - t0) / 1000) + "s";
    }, 1000);
    c.appendChild(w);
  }
  if (it.cerr) {
    var e = el("div", "box"); e.style.borderLeftColor = "var(--no)";
    e.appendChild(el("i", null, "coach unavailable")); e.appendChild(document.createTextNode(it.cerr));
    e.appendChild(el("div", "small", "You can still open the answer and mark yourself."));
    c.appendChild(e);

    tb.onclick = function () { askCoach(it, null, true); }; c.appendChild(tb);
    c.appendChild(el("div", "small", "This gives the full explanation, so the question will not score."));
  }

    c.appendChild(el("div", "lab", "write back, or ask for another nudge"));
    var mi = document.createElement("input"); mi.type = "text"; mi.autocomplete = "off";
    mi.placeholder = "e.g. the second sentence says the run cannot skip any barrel, so does that rule out what I said?";
    mi.style.cssText = "width:100%;background:var(--bg2);border:1px solid var(--edge2);border-radius:8px;color:var(--txt);font:inherit;padding:11px 12px";
    var send = el("button", "btn", "send"); send.type = "button"; send.style.marginTop = "10px";
    send.onclick = function () { var t = mi.value.trim(); if (t) askCoach(it, t); };
    mi.onkeydown = function (ev) { if (ev.key === "Enter") send.onclick(); };
    c.appendChild(mi); c.appendChild(send);
  }
  return c;
}

function renderKeep() { var y = window.scrollY; render(); window.scrollTo(0, y); }

function submit(timedOut) {

  ST.seen[it.q.id] = (ST.seen[it.q.id] || 0) + 1;
  var g = grade(it.q, it); it.gpts = g.pts; var vs = ST.vstat[it.q.v] || { n: 0, ok: 0 };
  vs.n++; vs.ok += g.pts; ST.vstat[it.q.v] = vs;
  if (g.pts < 1) (it.q.gloss || []).forEach(function (w) { ST.words[w[0]] = { meaning: w[1] }; });

}

  stopT();

  ST.hist.push({ when: Date.now(), n: V.run.length, pts: pts, mode: V.cfg.mode }); save();
  V.screen = "result"; render();

  V.run.forEach(function (it) { pts += grade(it.q, it).pts; });
  var h = el("div", "hero"); var h1 = el("h1"); h1.textContent = pts + " / " + V.run.length; h.appendChild(h1);
  h.appendChild(el("p", null, "A full point for the right variant, half for the right pattern. Open each scenario to see which words you were meant to catch."));
  f.appendChild(h);
  var c = el("div", "card");
  V.run.forEach(function (it, i) {
    var g = grade(it.q, it), row = el("div", "res");
    var d = document.createElement("details"), s = document.createElement("summary"); s.style.cursor = "pointer";
    s.textContent = (i + 1) + ". " + it.q.title + "   [" + (g.pts === 1 ? "right" : g.pts === 0.5 ? "pattern only" : "missed") + "]";
    d.appendChild(s); var lazy = false;
    d.addEventListener("toggle", function () { if (d.open && !lazy) { lazy = true; d.appendChild(reveal(it)); } });
    row.appendChild(d); c.appendChild(row);
  });
  f.appendChild(c);
  var cp = el("button", "btn", "copy my answers"); cp.type = "button"; cp.style.alignSelf = "flex-start";
  cp.onclick = function () {
    var t = V.run.map(function (it, i) { return (i + 1) + ". " + it.q.title + " | I wrote: " + (it.ans || "-") + " | answer: " + VNAME[it.q.v] + ""; }).join("\n");
    try { navigator.clipboard.writeText(t); cp.textContent = "copied"; } catch (e) { cp.textContent = "copy failed"; }
  };
  f.appendChild(cp);
  var again = el("button", "btn primary", "new sitting"); again.type = "button"; again.style.alignSelf = "flex-start"; again.onclick = function () { V.screen = "setup"; render(); };
  f.appendChild(again);
  return f;
}

function render() {
  app.textContent = ""; app.className = "wrap" + (V.screen === "quiz" ? " wide" : ""); app.appendChild(bar());
  if (V.screen === "setup") app.appendChild(setup());
  else if (V.screen === "quiz") app.appendChild(quiz());
  else if (V.screen === "reveal1") app.appendChild(reveal1());
  else app.appendChild(result());
}
coachStatus();
render();
})();
</script></body></html>
