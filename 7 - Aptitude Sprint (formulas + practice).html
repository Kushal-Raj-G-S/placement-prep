t one shows a six?","o":["1/6","11/36","1/3","5/36"],"a":1,"sc":"1 − (5/6)² = 11/36."},{"t":"quant","s":"Probability","tgt":75,"q":"A solves a problem with probability 1/3 and B with 1/4, independently. What is the probability it gets solved?","o":["7/12","5/12","1/12","1/2"],"a":3,"sc":"1 − (2/3)(3/4) = 1 − 1/2 = 1/2."},{"t":"quant","s":"Probability","tgt":45,"q":"Two dice are thrown. What is the probability that the sum is 7?","o":["5/36","1/12","7/36","1/6"],"a":3,"sc":"6 of 36 outcomes."},{"t":"quant","s":"Probability","tgt":60,"q":"A card is drawn from a deck. What is the probability it is a king or a heart?","o":["17/52","1/4","5/13","4/13"],"a":3,"sc":"4 + 13 − 1 = 16 cards: 16/52 = 4/13."},{"t":"quant","s":"Probability","tgt":60,"q":"A coin is tossed 4 times. What is the probability of exactly 2 heads?","o":["3/8","1/4","5/16","1/2"],"a":0,"sc":"4C2/16 = 6/16 = 3/8."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the HCF of 36 and 48?","o":["12","24","4","6"],"a":0,"sc":"36 = 2²·3², 48 = 2⁴·3. Lowest powers: 2²·3 = 12."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the LCM of 36 and 48?","o":["144","288","12","72"],"a":0,"sc":"Highest powers: 2⁴·3² = 144."},{"t":"quant","s":"Number system","tgt":60,"q":"HCF = 6, LCM = 180 and one number is 30. What is the other?","o":["60","18","30","36"],"a":3,"sc":"Product = HCF × LCM = 1080; 1080/30 = 36."},{"t":"quant","s":"Number system","tgt":60,"q":"What is the smallest number that leaves remainder 3 when divided by 8, 12 and 20?","o":["120","243","63","123"],"a":3,"sc":"LCM(8, 12, 20) = 120; answer LCM + r = 123."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the unit digit of 7⁴³?","o":["9","7","3","1"],"a":2,"sc":"43 mod 4 = 3; 7³ = 343 ends in 3."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the unit digit of 3⁵⁸?","o":["7","3","1","9"],"a":3,"sc":"58 mod 4 = 2; 3² = 9."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the unit digit of 4⁵⁷?","o":["4","6","2","8"],"a":0,"sc":"Powers of 4 alternate 4, 6. Odd exponent → 4."},{"t":"quant","s":"Number system","tgt":60,"q":"How many trailing zeros does 130! have?","o":["30","32","25","26"],"a":1,"sc":"26 + 5 + 1 = 32."},{"t":"quant","s":"Number system","tgt":60,"q":"What is the greatest number that divides 60, 84 and 108 exactly?","o":["12","24","4","6"],"a":0,"sc":"HCF of the three = 12."},{"t":"quant","s":"Number system","tgt":75,"q":"What is the greatest number that divides 100 and 160 leaving remainders 4 and 7 respectively?","o":["6","12","9","3"],"a":3,"sc":"Divisor divides 96 and 153. HCF(96, 153) = 3."},{"t":"quant","s":"Number system","tgt":60,"q":"How many factors does 72 have?","o":["8","9","10","12"],"a":3,"sc":"72 = 2³·3²: (3+1)(2+1) = 12."},{"t":"quant","s":"Number system","tgt":60,"q":"How many factors does 360 have?","o":["18","20","24","30"],"a":2,"sc":"360 = 2³·3²·5: 4 × 3 × 2 = 24."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the largest 4-digit number divisible by 12?","o":["9984","9999","9992","9996"],"a":3,"sc":"9999 mod 12 = 3 → 9996."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the largest 3-digit number divisible by 17?","o":["999","986","982","969"],"a":1,"sc":"999 mod 17 = 13 → 999 − 13 = 986."},{"t":"quant","s":"Number system","tgt":60,"q":"Three bells toll at intervals of 6, 8 and 12 minutes. After how many minutes will they toll together again?","o":["36","12","24","48"],"a":2,"sc":"LCM(6, 8, 12) = 24."},{"t":"quant","s":"Number system","tgt":45,"q":"What is the smallest number to be added to 1000 to make it divisible by 7?","o":["6","7","1","2"],"a":2,"sc":"1000 = 7×142 + 6, so add 1."},{"t":"quant","s":"Progressions","tgt":45,"q":"What is the 5th term of the AP 3, 7, 11, …?","o":["23","15","19","17"],"a":2,"sc":"a + 4d = 3 + 16 = 19."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum of the first 20 terms of the AP 2, 5, 8, …?","o":["610","590","600","620"],"a":0,"sc":"n/2 [2a + (n − 1)d] = 10 × (4 + 57) = 610."},{"t":"quant","s":"Progressions","tgt":45,"q":"What is 1 + 2 + 3 + … + 50?","o":["1300","1225","1275","1250"],"a":2,"sc":"n(n + 1)/2 = 50 × 51/2 = 1275."},{"t":"quant","s":"Progressions","tgt":45,"q":"What is the sum of the first 15 odd numbers?","o":["210","225","255","240"],"a":1,"sc":"First n odd numbers sum to n² = 225."},{"t":"quant","s":"Progressions","tgt":45,"q":"What is the sum of the first 10 even numbers?","o":["90","120","100","110"],"a":3,"sc":"n(n + 1) = 10 × 11 = 110."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the 6th term of the GP 2, 6, 18, …?","o":["324","1458","162","486"],"a":3,"sc":"a r^(n−1) = 2 × 3⁵ = 486."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum of the first 6 terms of the GP 3, 6, 12, …?","o":["93","126","189","192"],"a":2,"sc":"a(rⁿ − 1)/(r − 1) = 3 × 63 = 189."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum to infinity of 12, 4, 4/3, …?","o":["24","15","16","18"],"a":3,"sc":"a/(1 − r) = 12/(2/3) = 18."},{"t":"quant","s":"Progressions","tgt":60,"q":"How many terms are in the AP 7, 11, 15, …, 99?","o":["25","24","22","23"],"a":1,"sc":"n = (last − first)/d + 1 = 92/4 + 1 = 24."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum of the squares 1² + 2² + … + 10²?","o":["440","330","385","423.5"],"a":2,"sc":"n(n + 1)(2n + 1)/6 = 10 × 11 × 21/6 = 385."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum of the cubes 1³ + 2³ + … + 8³?","o":["1024","1296","1600","1156"],"a":1,"sc":"[n(n + 1)/2]² = 36² = 1296."},{"t":"quant","s":"Progressions","tgt":75,"q":"In an AP the 3rd term is 11 and the 7th is 27. What is the 10th term?","o":["35","41","43","39"],"a":3,"sc":"d = (27 − 11)/4 = 4; a = 3; 10th = 3 + 36 = 39."},{"t":"quant","s":"Progressions","tgt":60,"q":"What is the sum of all multiples of 7 from 1 to 100?","o":["735","770","700","686"],"a":0,"sc":"7 × (1 + … + 14) = 7 × 105 = 735."},{"t":"quant","s":"Progressions","tgt":75,"q":"A GP has first term 5 and common ratio 2. Which term is 320?","o":["8","7","9","6"],"a":1,"sc":"5 × 2^(n−1) = 320 → 2^(n−1) = 64 → n = 7."},{"t":"quant","s":"Progressions","tgt":75,"q":"The sum of the first n terms of an AP is n(n + 2). What is the 10th term?","o":["22","20","24","21"],"a":3,"sc":"T₁₀ = S₁₀ − S₉ = 120 − 99 = 21."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"Sales were ₹200 in January and ₹250 in February. What is the percentage growth?","o":["30%","25%","50%","20%"],"a":1,"sc":"Growth is on the PREVIOUS value: 50/200 = 25%."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"Revenue fell from ₹400 to ₹300. What is the percentage decline?","o":["100%","20%","25%","33.33%"],"a":2,"sc":"100/400 = 25%."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"A product's market share rose from 20% to 25%. By how many percentage points, and by what percentage growth?","o":["25 points, 5%","5%, 5%","5 points, 20%","5 points, 25%"],"a":3,"sc":"Points are subtracted (5). Growth = 5/20 = 25%."},{"t":"quant","s":"Data interpretation","tgt":75,"q":"A company's profit was 120 (2019), 150 (2020), 180 (2021). Which year's growth rate was higher?","o":["Both equal","2021 (20% vs 25%)","2021 (30 vs 30)","2020 (25% vs 20%)"],"a":3,"sc":"Both rises are 30, but 30/120 = 25% beats 30/150 = 20%."},{"t":"quant","s":"Data interpretation","tgt":45,"q":"Production over five years was 40, 50, 60, 70, 80 units. What was the mean annual production?","o":["55","50","65","60"],"a":3,"sc":"Sum 300 / 5 = 60."},{"t":"quant","s":"Data interpretation","tgt":45,"q":"In a household budget pie chart, rent takes 25%. What angle does the rent sector subtend?","o":["90°","100°","45°","72°"],"a":0,"sc":"25% of 360° = 90°."},{"t":"quant","s":"Data interpretation","tgt":45,"q":"Sales were 450 in 2021 and 540 in 2022. The percentage growth is","o":["18%","25%","16.67%","20%"],"a":3,"sc":"90/450 = 20%."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"Three branches sold 240, 320 and 440 units. What share of the total did the second branch have?","o":["30%","40%","36%","32%"],"a":3,"sc":"320/1000 = 32%."},{"t":"quant","s":"Data interpretation","tgt":45,"q":"A student scored 45 out of 60 in Physics. What percentage is that?","o":["80%","75%","70%","72%"],"a":1,"sc":"45/60 = 0.75."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"Output in year X was 20% higher than in year Y, and Y was 250. What was X?","o":["270","320","300","275"],"a":2,"sc":"250 × 1.2 = 300."},{"t":"quant","s":"Data interpretation","tgt":75,"q":"A town of 50,000 grows 10% each year. What is its population after 2 years?","o":["60500","55000","61000","60000"],"a":0,"sc":"Compound: 50000 × 1.1 × 1.1 = 60500."},{"t":"quant","s":"Data interpretation","tgt":75,"q":"Exports were 80, 100, 90 (in crore) over three years. What was the percentage change from the 2nd to the 3rd year?","o":["11.11% fall","10% fall","10% rise","12.5% fall"],"a":1,"sc":"(90 − 100)/100 = −10%. Base is the previous year (100)."},{"t":"quant","s":"Data interpretation","tgt":60,"q":"In a pie chart totalling ₹1200, one sector is 72°. What value does it represent (₹)?","o":["240","200","300","180"],"a":0,"sc":"72/360 = 20% of 1200 = 240."},{"t":"quant","s":"Data interpretation","tgt":75,"q":"Table: Sales (A) 120, (B) 150. B's sales are what percentage more than A's, and A's what percentage less than B's?","o":["25% more, 25% less","30% more, 20% less","20% more, 25% less","25% more, 20% less"],"a":3,"sc":"30/120 = 25% more; 30/150 = 20% less. The base changes."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 3, 7, 11, 15, ?","o":["18","23","20","19"],"a":3,"sc":"Constant difference +4: an AP."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 1, 4, 9, 16, 25, ?","o":["34","49","36","30"],"a":2,"sc":"Squares: 6² = 36."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 2, 5, 10, 17, 26, ?","o":["35","38","36","37"],"a":3,"sc":"n² + 1: 6² + 1 = 37. Differences 3, 5, 7, 9 → 11."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 3, 6, 12, 24, ?","o":["36","30","42","48"],"a":3,"sc":"Each term × 2."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 1, 8, 27, 64, ?","o":["125","120","100","216"],"a":0,"sc":"Cubes: 5³ = 125."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 2, 3, 5, 7, 11, ?","o":["12","17","15","13"],"a":3,"sc":"Consecutive primes."},{"t":"logic","s":"Number series","tgt":60,"q":"Find the next term: 1, 2, 6, 24, 120, ?","o":["480","600","720","840"],"a":2,"sc":"Factorials, or × 2, × 3, × 4, × 5, × 6."},{"t":"logic","s":"Number series","tgt":60,"q":"Find the next term: 4, 5, 7, 10, 14, ?","o":["21","20","18","19"],"a":3,"sc":"Differences 1, 2, 3, 4 → next 5."},{"t":"logic","s":"Number series","tgt":60,"q":"Find the next term: 1, 3, 7, 13, 21, ?","o":["33","29","30","31"],"a":3,"sc":"Differences 2, 4, 6, 8 → next 10."},{"t":"logic","s":"Number series","tgt":60,"q":"Find the next term: 2, 4, 8, 14, 22, ?","o":["34","32","30","31"],"a":1,"sc":"Differences 2, 4, 6, 8 → next 10."},{"t":"logic","s":"Number series","tgt":75,"q":"Find the next term: 120, 99, 80, 63, 48, ?","o":["33","36","35","34"],"a":2,"sc":"n² − 1 counting down: 11²−1 … 6²−1 = 35. Differences −21, −19, −17, −15 → −13."},{"t":"logic","s":"Number series","tgt":45,"q":"Find the next term: 1, 1, 2, 3, 5, 8, ?","o":["13","14","12","11"],"a":0,"sc":"Each term is the sum of the previous two (Fibonacci)."},{"t":"logic","s":"Number series","tgt":60,"q":"Find the missing term: 5, 10, 20, ?, 80","o":["35","30","40","45"],"a":2,"sc":"Each term doubles, so ? = 40."},{"t":"logic","s":"Number series","tgt":75,"q":"Find the next term: 3, 8, 15, 24, 35, ?","o":["50","46","47","48"],"a":3,"sc":"n² − 1 starting from 2²: next 7² − 1 = 48. Differences 5, 7, 9, 11 → 13."},{"t":"logic","s":"Number series","tgt":90,"q":"Find the next term: 2, 12, 36, 80, 150, ?","o":["252","250","260","240"],"a":0,"sc":"Terms are n²(n + 1): 1²·2, 2²·3, 3²·4, 4²·5, 5²·6, so next is 6²·7 = 252."},{"t":"logic","s":"Letter series","tgt":45,"q":"Find the next letter: A, C, E, G, ?","o":["H","J","I","K"],"a":2,"sc":"+2 each time."},{"t":"logic","s":"Letter series","tgt":45,"q":"Find the next letter: Z, X, V, T, ?","o":["P","Q","S","R"],"a":3,"sc":"−2 each time."},{"t":"logic","s":"Letter series","tgt":45,"q":"Find the next letter: B, E, H, K, ?","o":["O","N","M","L"],"a":1,"sc":"+3 each time."},{"t":"logic","s":"Letter series","tgt":60,"q":"Find the next pair: AZ, BY, CX, ?","o":["DW","EW","DV","CW"],"a":0,"sc":"First letter moves forward, second moves back; mirrors sum to 27."},{"t":"logic","s":"Letter series","tgt":45,"q":"Which letter is the 8th from the end of the alphabet?","o":["Q","R","S","T"],"a":2,"sc":"26 − 8 + 1 = 19, which is S."},{"t":"logic","s":"Letter series","tgt":45,"q":"What is the mirror letter of K (A↔Z, B↔Y…)?","o":["L","Q","O","P"],"a":3,"sc":"Mirrors sum to 27: K = 11, 27 − 11 = 16 = P."},{"t":"logic","s":"Letter series","tgt":45,"q":"What is the sum of the positions of the letters in CAB (A=1…Z=26)?","o":["5","7","6","9"],"a":2,"sc":"3 + 1 + 2 = 6."},{"t":"logic","s":"Letter series","tgt":60,"q":"Find the next pair: AB, DE, GH, ?","o":["KL","IJ","JL","JK"],"a":3,"sc":"Each pair moves 3 forward as a block."},{"t":"logic","s":"Letter series","tgt":60,"q":"Find the next pair: ZA, YB, XC, ?","o":["XD","WD","WC","VD"],"a":1,"sc":"First letter goes back, second goes forward."},{"t":"logic","s":"Letter series","tgt":60,"q":"Find the next letter: A, B, D, G, ?","o":["L","K","J","I"],"a":1,"sc":"Gaps 1, 2, 3, 4 → G + 4 = K."},{"t":"logic","s":"Letter series","tgt":45,"q":"Find the next letter: C, F, I, L, ?","o":["O","M","N","P"],"a":0,"sc":"+3 each time."},{"t":"logic","s":"Letter series","tgt":45,"q":"Which letter is 14th from the end of the alphabet?","o":["L","O","N","M"],"a":3,"sc":"26 − 14 + 1 = 13 = M."},{"t":"logic","s":"Letter series","tgt":60,"q":"Find the next group: ACE, BDF, CEG, ?","o":["EGI","DEG","CFH","DFH"],"a":3,"sc":"Each group shifts forward by 1."},{"t":"logic","s":"Letter series","tgt":75,"q":"Find the next letter: A, C, F, J, ?","o":["M","P","O","N"],"a":2,"sc":"Gaps +2, +3, +4, then +5: J + 5 = O."},{"t":"logic","s":"Letter series","tgt":60,"q":"What is the position value of the letter N (A=1…Z=26)?","o":["14","13","15","12"],"a":0,"sc":"N is the 14th letter."},{"t":"logic","s":"Coding–decoding","tgt":45,"q":"If PEN is coded as QFO, how is INK coded?","o":["JOL","HMJ","JNK","KPM"],"a":0,"sc":"Each letter moves +1."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If BOLD is written as ANKC, how is CAST written?","o":["BZSR","DBTU","BZSU","BZRS"],"a":3,"sc":"Each letter moves −1."},{"t":"logic","s":"Coding–decoding","tgt":45,"q":"If FAN is coded as HCP, how is TEA coded?","o":["VGB","VGC","WHD","UFB"],"a":1,"sc":"Each letter moves +2."},{"t":"logic","s":"Coding–decoding","tgt":45,"q":"If DELHI is written as IHLED, how is MUMBAI written?","o":["IBAMUM","MUMBAI","IABUMM","IABMUM"],"a":3,"sc":"The word is simply reversed."},{"t":"logic","s":"Coding–decoding","tgt":45,"q":"If A=1, B=2, … Z=26, what is the value of DOG?","o":["25","26","27","24"],"a":1,"sc":"4 + 15 + 7 = 26."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If A↔Z, B↔Y, C↔X (mirror coding), how is CAB written?","o":["YZX","XZY","XYZ","ZXY"],"a":1,"sc":"C→X, A→Z, B→Y."},{"t":"logic","s":"Coding–decoding","tgt":75,"q":"If ABCD is coded as BDDF (alternating +1, +2), how is EFGH coded?","o":["GHIJ","FHIJ","FHHJ","FGHI"],"a":2,"sc":"E+1=F, F+2=H, G+1=H, H+2=J."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If CAT is written as 3-1-20, how is BAD written?","o":["2-1-4","1-2-4","2-2-4","2-1-5"],"a":0,"sc":"Alphabet positions: B=2, A=1, D=4."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If TABLE is written as 20-1-2-12-5, how is LAKE written?","o":["12-1-11-5","12-2-11-5","12-1-10-5","11-1-12-5"],"a":0,"sc":"L=12, A=1, K=11, E=5."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If RAIN is written as SBJO, how is SNOW written?","o":["UPQY","TOPX","RMNV","TNPX"],"a":1,"sc":"Each letter +1."},{"t":"logic","s":"Coding–decoding","tgt":75,"q":"If MONDAY is coded as NPOEBZ, how is FRIDAY coded?","o":["GSJEBZ","GSJEBY","EQHCZX","HTKFCA"],"a":0,"sc":"Check the first two letters: M→N, O→P. Rule +1 applied to every letter."},{"t":"logic","s":"Coding–decoding","tgt":75,"q":"If in a code, 'LION' is written as 'NKQP', how is 'TIGER' written?","o":["UJHFS","WLJHU","VKIGS","VKIGT"],"a":3,"sc":"L→N, I→K: each letter +2."},{"t":"logic","s":"Coding–decoding","tgt":60,"q":"If the letters of 'CLOCK' are written by their positions and added, what is the total?","o":["45","43","47","44"],"a":3,"sc":"3 + 12 + 15 + 3 + 11 = 44."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 3×3×3 cube is painted on all faces and cut into unit cubes. How many have exactly one face painted?","o":["6","1","24","12"],"a":0,"sc":"Face centres = 6(n − 2)² = 6 × 1 = 6."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 4×4×4 cube is painted on all faces and cut into unit cubes. How many have exactly one face painted?","o":["54","24","8","34"],"a":1,"sc":"Face centres = 6(n − 2)² = 6 × 4 = 24."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 5×5×5 cube is painted on all faces and cut into unit cubes. How many have exactly one face painted?","o":["96","27","54","36"],"a":2,"sc":"Face centres = 6(n − 2)² = 6 × 9 = 54."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 6×6×6 cube is painted on all faces and cut into unit cubes. How many have exactly one face painted?","o":["64","96","150","48"],"a":1,"sc":"Face centres = 6(n − 2)² = 6 × 16 = 96."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 4×4×4 painted cube is cut into unit cubes. How many have exactly two faces painted?","o":["34","8","24","36"],"a":2,"sc":"Edges = 12(n − 2) = 24."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 5×5×5 painted cube is cut into unit cubes. How many have exactly two faces painted?","o":["54","36","48","8"],"a":1,"sc":"Edges = 12(n − 2) = 36."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 6×6×6 painted cube is cut into unit cubes. How many have exactly two faces painted?","o":["60","96","8","48"],"a":3,"sc":"Edges = 12(n − 2) = 48."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 3×3×3 painted cube is cut into unit cubes. How many have no paint at all?","o":["19","1","6","8"],"a":1,"sc":"Interior = (n − 2)³ = 1."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 5×5×5 painted cube is cut into unit cubes. How many have no paint at all?","o":["27","117","54","64"],"a":0,"sc":"Interior = (n − 2)³ = 27."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 6×6×6 painted cube is cut into unit cubes. How many have no paint at all?","o":["125","208","96","64"],"a":3,"sc":"Interior = (n − 2)³ = 64."},{"t":"logic","s":"Cubes","tgt":45,"q":"How many small cubes of a painted cube always have three faces painted, whatever its size?","o":["4","12","8","6"],"a":2,"sc":"Corners: a cube always has 8."},{"t":"logic","s":"Cubes","tgt":60,"q":"A 4 cm cube is painted and cut into 1 cm cubes. How many have at least one painted face?","o":["64","32","48","56"],"a":3,"sc":"64 − interior (2³ = 8) = 56."},{"t":"logic","s":"Cubes","tgt":75,"q":"A 5 cm cube is painted and cut into 1 cm cubes. How many have exactly one or two faces painted?","o":["90","36","54","98"],"a":0,"sc":"One face: 6 × 9 = 54. Two faces: 12 × 3 = 36. Sum 90."},{"t":"logic","s":"Cubes","tgt":75,"q":"A cube of side 6 is cut into unit cubes. How many cuts (one plane each, no rearranging) are needed in total?","o":["12","15","18","6"],"a":1,"sc":"5 cuts along each of 3 directions = 15."},{"t":"logic","s":"Ranking","tgt":45,"q":"A is 7th from the top and 12th from the bottom in a class. How many students are there?","o":["20","17","18","19"],"a":2,"sc":"7 + 12 − 1 = 18."},{"t":"logic","s":"Ranking","tgt":45,"q":"Rank 5 from the top in a class of 40. What is the rank from the bottom?","o":["36","35","34","37"],"a":0,"sc":"40 + 1 − 5 = 36."},{"t":"logic","s":"Ranking","tgt":60,"q":"Rahul is 15th from the left and Mohan is 20th from the right in a row of 40. How many people are between them?","o":["6","4","3","5"],"a":3,"sc":"Mohan is 21st from the left; between = 21 − 15 − 1 = 5."},{"t":"logic","s":"Ranking","tgt":45,"q":"A is 10th from the left and B is 18th from the left. How many people are between them?","o":["6","7","8","9"],"a":1,"sc":"|18 − 10| − 1 = 7."},{"t":"logic","s":"Ranking","tgt":45,"q":"Kiran is 14th from the front and 17th from the back of a queue. How many are in the queue?","o":["31","29","32","30"],"a":3,"sc":"14 + 17 − 1 = 30."},{"t":"logic","s":"Ranking","tgt":45,"q":"In a row of 25, a boy is 10th from the left. What is his position from the right?","o":["17","16","14","15"],"a":1,"sc":"25 + 1 − 10 = 16."},{"t":"logic","s":"Ranking","tgt":75,"q":"In a class of 40, 25 passed Maths and 22 passed English, and everyone passed at least one. How many passed both?","o":["3","8","7","10"],"a":2,"sc":"Overlap = sum − total = 25 + 22 − 40 = 7."},{"t":"logic","s":"Ranking","tgt":60,"q":"In a row of 20 students, Ram is 7th from the left and Sham is 9th from the right. How many are between them?","o":["3","5","6","4"],"a":3,"sc":"Sham is 12th from the left; 12 − 7 − 1 = 4."},{"t":"logic","s":"Ranking","tgt":75,"q":"X is 11th from the top and Y is 11th from the bottom, and there are 7 students between them. How many students in all?","o":["31","28","30","29"],"a":3,"sc":"10 above X, 7 between, 10 below Y plus X and Y themselves: 10 + 1 + 7 + 1 + 10 = 29."},{"t":"logic","s":"Ranking","tgt":60,"q":"A man is 6th from the left and 9th from the right of a row. How many are in the row?","o":["14","16","13","15"],"a":0,"sc":"6 + 9 − 1 = 14."},{"t":"logic","s":"Ranking","tgt":75,"q":"In an exam, 18 students are ahead of Neha and she is 9th from the last. How many students took the exam?","o":["26","27","28","25"],"a":1,"sc":"Her rank is 19th from the top: 19 + 9 − 1 = 27."},{"t":"logic","s":"Ranking","tgt":60,"q":"Seema is 12th from the left. After she swaps places with the person 8 places to her right she is on which position from the left?","o":["21","19","4","20"],"a":3,"sc":"12 + 8 = 20."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 3:30?","o":["75°","55°","82.5°","90°"],"a":0,"sc":"|30H − 5.5M| = |90 − 165.0| = 75°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 4:20?","o":["40°","10°","17.5°","25°"],"a":1,"sc":"|30H − 5.5M| = |120 − 110.0| = 10°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 7:45?","o":["45°","52.5°","17.5°","37.5°"],"a":3,"sc":"|30H − 5.5M| = |210 − 247.5| = 37.5°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 9:15?","o":["172.5°","152.5°","187.5°","180°"],"a":0,"sc":"|30H − 5.5M| = |270 − 82.5| = 187.5; over 180, so 360 − that = 172.5°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 12:30?","o":["145°","165°","172.5°","180°"],"a":1,"sc":"|30H − 5.5M| = |360 − 165.0| = 195; over 180, so 360 − that = 165°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 2:40?","o":["140°","167.5°","160°","175°"],"a":2,"sc":"|30H − 5.5M| = |60 − 220.0| = 160°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 10:10?","o":["130°","122.5°","115°","95°"],"a":2,"sc":"|30H − 5.5M| = |300 − 55.0| = 245; over 180, so 360 − that = 115°."},{"t":"logic","s":"Clocks","tgt":75,"q":"What is the angle between the hands of a clock at 6:25?","o":["42.5°","22.5°","50°","57.5°"],"a":0,"sc":"|30H − 5.5M| = |180 − 137.5| = 42.5°."},{"t":"logic","s":"Clocks","tgt":45,"q":"How many degrees does the minute hand move in 25 minutes?","o":["180°","75°","125°","150°"],"a":3,"sc":"6° per minute."},{"t":"logic","s":"Clocks","tgt":45,"q":"How many degrees does the hour hand move in 40 minutes?","o":["30°","20°","40°","10°"],"a":1,"sc":"0.5° per minute."},{"t":"logic","s":"Clocks","tgt":60,"q":"How many times do the hands of a clock overlap in 24 hours?","o":["23","24","22","44"],"a":2,"sc":"Every 65 5/11 minutes: 22 times a day."},{"t":"logic","s":"Clocks","tgt":75,"q":"At what time between 4 and 5 do the hands coincide?","o":["21 9/11 min past 4","22 min past 4","20 min past 4","21 min past 4"],"a":0,"sc":"H × 60/11 = 240/11 = 21 9/11."},{"t":"logic","s":"Clocks","tgt":60,"q":"How many times do the hands of a clock make a right angle in 12 hours?","o":["12","11","22","24"],"a":2,"sc":"Hands are at right angles twice every hour, except that in 12 hours two of those coincide: 22 in all."},{"t":"logic","s":"Calendars","tgt":60,"q":"Today is Monday. What day will it be after 100 days?","o":["Thursday","Tuesday","Friday","Wednesday"],"a":3,"sc":"100 mod 7 = 2; Monday + 2 = Wednesday."},{"t":"logic","s":"Calendars","tgt":45,"q":"Which of these is a leap year?","o":["2100","2000","2200","1900"],"a":1,"sc":"Centuries must divide by 400: only 2000 does."},{"t":"logic","s":"Calendars","tgt":45,"q":"If 1 January 2021 was Friday, what day was 1 January 2022?","o":["Sunday","Saturday","Thursday","Friday"],"a":1,"sc":"2021 is an ordinary year: +1 day."},{"t":"logic","s":"Calendars","tgt":60,"q":"If 1 January 2024 was a Monday, what day was 1 January 2025?","o":["Monday","Wednesday","Tuesday","Thursday"],"a":1,"sc":"2024 is a leap year: +2 days."},{"t":"logic","s":"Calendars","tgt":90,"q":"On what day of the week was 15 August 1947?","o":["Saturday","Friday","Sunday","Thursday"],"a":1,"sc":"Count odd days: century odd days + remaining years (with leap years) + days into the year, all mod 7."},{"t":"logic","s":"Calendars","tgt":90,"q":"On what day of the week was 26 January 1950?","o":["Thursday","Saturday","Wednesday","Friday"],"a":0,"sc":"Count odd days: century odd days + remaining years (with leap years) + days into the year, all mod 7."},{"t":"logic","s":"Calendars","tgt":90,"q":"On what day of the week was 1 January 2000?","o":["Sunday","Friday","Monday","Saturday"],"a":3,"sc":"Count odd days: century odd days + remaining years (with leap years) + days into the year, all mod 7."},{"t":"logic","s":"Calendars","tgt":45,"q":"How many odd days are there in 100 years?","o":["4","6","5","1"],"a":2,"sc":"100 years = 76 ordinary + 24 leap: 76 + 48 = 124 = 17 weeks + 5."},{"t":"logic","s":"Calendars","tgt":45,"q":"How many odd days are there in 200 years?","o":["2","5","4","3"],"a":3,"sc":"5 × 2 = 10 = 7 + 3."},{"t":"logic","s":"Calendars","tgt":45,"q":"How many odd days are there in 400 years?","o":["1","2","0","7"],"a":2,"sc":"A full 400-year cycle is a whole number of weeks."},{"t":"logic","s":"Calendars","tgt":60,"q":"A 30-day month begins on a Saturday. How many Sundays does it contain?","o":["5","6","3","4"],"a":0,"sc":"Sundays fall on 2, 9, 16, 23 and 30."},{"t":"logic","s":"Calendars","tgt":60,"q":"How many days are there from 15 January to 15 March in an ordinary year?","o":["60","59","61","58"],"a":1,"sc":"16 (Jan) + 28 (Feb) + 15 (Mar) = 59."},{"t":"logic","s":"Calendars","tgt":60,"q":"1 February 2024 was a Thursday. How many Sundays were there in February 2024?","o":["3","5","2","4"],"a":3,"sc":"Leap year, 29 days. Sundays fall on 4, 11, 18, 25."},{"t":"logic","s":"Calendars","tgt":75,"q":"1 January 2000 was a Saturday. What day was 1 March 2000?","o":["Thursday","Monday","Wednesday","Tuesday"],"a":2,"sc":"2000 is leap: 31 + 29 = 60 days; 60 mod 7 = 4; Saturday + 4 = Wednesday."},{"t":"logic","s":"Directions","tgt":60,"q":"A man walks 6 km east and then 8 km north. How far is he from the start?","o":["11 km","2 km","14 km","10 km"],"a":3,"sc":"Perpendicular legs: √(6² + 8²) = 10."},{"t":"logic","s":"Directions","tgt":60,"q":"A man walks 9 km east and then 12 km north. How far is he from the start?","o":["15 km","16 km","21 km","3 km"],"a":0,"sc":"Perpendicular legs: √(9² + 12²) = 15."},{"t":"logic","s":"Directions","tgt":60,"q":"A man walks 5 km east and then 12 km north. How far is he from the start?","o":["14 km","7 km","13 km","17 km"],"a":2,"sc":"Perpendicular legs: √(5² + 12²) = 13."},{"t":"logic","s":"Directions","tgt":60,"q":"A man walks 8 km east and then 15 km north. How far is he from the start?","o":["7 km","18 km","23 km","17 km"],"a":3,"sc":"Perpendicular legs: √(8² + 15²) = 17."},{"t":"logic","s":"Directions","tgt":60,"q":"A walks 5 km north, 8 km east and 5 km south. In which direction is he from the start, and how far?","o":["South-east, 10 km","East, 8 km","North, 5 km","East, 18 km"],"a":1,"sc":"North and south cancel, leaving 8 km east."},{"t":"logic","s":"Directions","tgt":60,"q":"A walks 4 km north, 3 km west and 4 km south. How far is he from the start?","o":["3 km","7 km","11 km","5 km"],"a":0,"sc":"Opposite legs cancel; 3 km remains."},{"t":"logic","s":"Directions","tgt":75,"q":"A walks 20 km north and then 15 km east. How far is he from the start?","o":["5 km","25 km","35 km","30 km"],"a":1,"sc":"√(20² + 15²) = 25."},{"t":"logic","s":"Directions","tgt":45,"q":"Facing north, a man turns 90° right, then 90° right again. Which direction does he face?","o":["North","East","West","South"],"a":3,"sc":"N → E → S."},{"t":"logic","s":"Directions","tgt":60,"q":"Facing east, a man turns 90° left, then 180°, then 90° right. Which direction does he face?","o":["West","East","North","South"],"a":0,"sc":"East → left → North → 180° → South → right → West."},{"t":"logic","s":"Directions","tgt":60,"q":"Facing south-west, a man turns 135° clockwise. Which direction does he face?","o":["North","North-east","South","East"],"a":0,"sc":"SW is 225°; +135° = 360°, which is North."},{"t":"logic","s":"Directions","tgt":75,"q":"A walks 10 m north, 6 m east, 10 m south and 2 m west. How far from the start and in which direction?","o":["4 m west","8 m east","4 m east","16 m east"],"a":2,"sc":"North/south cancel. East 6 − west 2 = 4 east."},{"t":"logic","s":"Directions","tgt":75,"q":"A walks 12 m west, turns right and walks 5 m. How far is he from the start?","o":["13 m","12 m","7 m","17 m"],"a":0,"sc":"Perpendicular: √(12² + 5²) = 13."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: All pens are books. All books are tables. Conclusions: I. All pens are tables.  II. All tables are pens.","o":["Both I and II follow","Neither I nor II follows","Only II follows","Only I follows"],"a":3,"sc":"All A are B and all B are C gives all A are C. The reverse never follows."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: Some cats are dogs. All dogs are birds. Conclusions: I. Some cats are birds.  II. All cats are birds.","o":["Only II follows","Both I and II follow","Only I follows","Neither I nor II follows"],"a":2,"sc":"Some A are B plus all B are C gives some A are C. 'All cats' is too strong."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: Some books are pens. Some pens are pencils. Conclusions: I. Some books are pencils.  II. Some pencils are books.","o":["Only I follows","Both I and II follow","Neither I nor II follows","Only II follows"],"a":2,"sc":"Two 'some' premises: nothing follows."},{"t":"logic","s":"Syllogisms","tgt":60,"q":"Statements: All fruits are sweet. Some sweet things are cold. Conclusions: I. Some fruits are cold.  II. All cold things are sweet.","o":["Neither I nor II follows","Both I and II follow","Only I follows","Only II follows"],"a":0,"sc":"The cold sweet things may be entirely outside the fruit circle, so neither is forced."},{"t":"logic","s":"Syllogisms","tgt":75,"q":"Statements: No stone is paper. All paper is glass. Conclusions: I. No stone is glass.  II. Some glass is paper.","o":["Only I follows","Only II follows","Neither I nor II follows","Both I and II follow"],"a":1,"sc":"All paper is glass, so some glass is paper. Stones may still be glass, so I fails."},{"t":"logic","s":"Syllogisms","tgt":60,"q":"Statements: All teachers are readers. No reader is lazy. Conclusions: I. No teacher is lazy.  II. Some teachers are lazy.","o":["Only I follows","Only II follows","Neither I nor II follows","Both I and II follow"],"a":0,"sc":"Teachers sit inside readers, which sit outside lazy. II contradicts that."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: Some doctors are singers. All singers are tall. Conclusions: I. Some doctors are tall.  II. All doctors are tall.","o":["Neither I nor II follows","Only I follows","Only II follows","Both I and II follow"],"a":1,"sc":"The doctors who sing are tall, so some doctors are tall; 'all' is not forced."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: All lions are animals. Conclusions: I. All animals are lions.  II. Some animals are lions.","o":["Only I follows","Both I and II follow","Neither I nor II follows","Only II follows"],"a":3,"sc":"'All A are B' never gives 'All B are A', but it does give 'Some B are A'."},{"t":"logic","s":"Syllogisms","tgt":75,"q":"Statements: No man is a bird. Some birds are fish. Conclusions: I. Some fish are not men.  II. No fish is a man.","o":["Neither I nor II follows","Both I and II follow","Only II follows","Only I follows"],"a":3,"sc":"The fish that are birds cannot be men, so some fish are not men. Other fish are unconstrained, so II fails."},{"t":"logic","s":"Syllogisms","tgt":75,"q":"Statements: Some roads are lanes. Some lanes are streets. All streets are paths. Conclusions: I. Some lanes are paths.  II. Some roads are streets.","o":["Only I follows","Both I and II follow","Only II follows","Neither I nor II follows"],"a":0,"sc":"Some lanes are streets and streets are paths: I follows. Roads and streets link only via 'some lanes', so II is not forced."},{"t":"logic","s":"Syllogisms","tgt":60,"q":"Statements: All metals are conductors. Some conductors are costly. Conclusions: I. Some metals are costly.  II. All metals are costly.","o":["Only II follows","Only I follows","Neither I nor II follows","Both I and II follow"],"a":2,"sc":"The costly conductors need not be metals."},{"t":"logic","s":"Syllogisms","tgt":75,"q":"Statements: All books are papers. All papers are leaves. No leaf is a stone. Conclusions: I. No book is a stone.  II. Some stones are papers.","o":["Both I and II follow","Neither I nor II follows","Only I follows","Only II follows"],"a":2,"sc":"Books ⊂ papers ⊂ leaves, and leaves exclude stones, so I follows and II is false."},{"t":"logic","s":"Syllogisms","tgt":45,"q":"Statements: Some flowers are red. All red things are bright. Conclusions: I. Some flowers are bright.  II. All bright things are red.","o":["Neither I nor II follows","Only I follows","Both I and II follow","Only II follows"],"a":1,"sc":"The red flowers are bright. The reverse is not given."},{"t":"logic","s":"Syllogisms","tgt":60,"q":"Statements: No cow is a horse. No horse is a goat. Conclusions: I. No cow is a goat.  II. Some goats are cows.","o":["Neither I nor II follows","Both I and II follow","Only I follows","Only II follows"],"a":0,"sc":"Two 'no' premises give nothing. Do not chain them."},{"t":"logic","s":"Blood relations","tgt":60,"q":"A is B's sister. B is C's father. How is A related to C?","o":["Mother","Aunt","Grandmother","Sister"],"a":1,"sc":"A is the sister of C's father: C's paternal aunt."},{"t":"logic","s":"Blood relations","tgt":75,"q":"Pointing to a girl, Ravi says, \"She is the daughter of my grandfather's only son.\" How is the girl related to Ravi?","o":["Mother","Sister","Aunt","Cousin"],"a":1,"sc":"Grandfather's only son is Ravi's father; his daughter is Ravi's sister."},{"t":"logic","s":"Blood relations","tgt":60,"q":"What is the relation of the person who is 'my mother's only brother's son' to me?","o":["Brother","Cousin","Nephew","Uncle"],"a":1,"sc":"Mother's brother is the maternal uncle; his son is a cousin."},{"t":"logic","s":"Blood relations","tgt":60,"q":"B is a man and the brother of A's mother. How is B related to A?","o":["Grandfather","Father","Paternal uncle","Maternal uncle"],"a":3,"sc":"A's mother's brother is the maternal uncle."},{"t":"logic","s":"Blood relations","tgt":75,"q":"Pointing to a man, Sita says, \"His mother is the only daughter of my mother.\" How is the man related to Sita?","o":["Nephew","Son","Father","Brother"],"a":1,"sc":"My mother's only daughter is Sita herself; his mother is Sita, so he is her son."},{"t":"logic","s":"Blood relations","tgt":75,"q":"A is the brother of B. B is the sister of C. C is the father of D. How is A related to D?","o":["Brother","Cousin","Father","Uncle"],"a":3,"sc":"A, B and C are siblings; D is C's child, so A is D's uncle."},{"t":"logic","s":"Blood relations","tgt":60,"q":"X's father is Y's son. How is Y related to X?","o":["Uncle","Great-grandfather","Grandfather","Father"],"a":2,"sc":"Y's son is X's father, so Y is X's grandfather."},{"t":"logic","s":"Blood relations","tgt":60,"q":"Who is 'my father's father's only son's wife'?","o":["Mother","Grandmother","Aunt","Sister"],"a":0,"sc":"Father's father's only son is my father; his wife is my mother."},{"t":"logic","s":"Blood relations","tgt":60,"q":"Rahul is the son of Meena. Meena is the daughter of Kishan. How is Kishan related to Rahul?","o":["Uncle","Father","Maternal grandfather","Paternal grandfather"],"a":2,"sc":"Kishan is the father of Rahul's mother."},{"t":"logic","s":"Blood relations","tgt":75,"q":"A man says, \"Her mother is the only daughter of my mother.\" How is the lady related to him?","o":["Daughter","Niece","Sister","Cousin"],"a":1,"sc":"My mother's only daughter is my sister; her daughter is my niece."},{"t":"logic","s":"Blood relations","tgt":75,"q":"A is B's brother. C is A's mother. D is C's father. E is D's mother. How is B related to D?","o":["Nephew","Great-grandchild","Child","Grandchild"],"a":3,"sc":"B's mother C is D's child, so B is D's grandchild."},{"t":"logic","s":"Blood relations","tgt":75,"q":"A and B are a married couple, A is male. C is B's brother and D is C's father. How is A related to D?","o":["Son-in-law","Son","Nephew","Brother-in-law"],"a":0,"sc":"D is B's father, so A (B's husband) is D's son-in-law."},{"t":"logic","s":"Blood relations","tgt":75,"q":"P is the brother of Q. Q is the mother of R. S is R's father. How is P related to S?","o":["Brother-in-law","Father-in-law","Brother","Uncle"],"a":0,"sc":"Q is S's wife; P is her brother, hence S's brother-in-law."},{"t":"logic","s":"Blood relations","tgt":60,"q":"A is the mother of B. B is the father of C. C is the sister of D. How is A related to D?","o":["Aunt","Grandmother","Sister","Mother"],"a":1,"sc":"D's father is B, whose mother is A."},{"t":"logic","s":"Blood relations","tgt":45,"q":"A is B's mother. B is C's sister. How is A related to C?","o":["Sister","Grandmother","Mother","Aunt"],"a":2,"sc":"Siblings share parents."},{"t":"logic","s":"Ages","tgt":75,"q":"A father is 3 times as old as his son. In 12 years he will be twice as old. What is the son's present age?","o":["14","12","8","10"],"a":1,"sc":"3x + 12 = 2(x + 12) gives x = 12."},{"t":"logic","s":"Ages","tgt":75,"q":"The sum of A's and B's ages is 40. Five years ago A was twice as old as B. What is A's present age?","o":["28","20","25","30"],"a":2,"sc":"A = 2B − 5 and A + B = 40 give 3B = 45, B = 15, A = 25."},{"t":"logic","s":"Ages","tgt":75,"q":"The ages of two people are in the ratio 4:5. After 5 years the ratio is 5:6. What is the elder's present age?","o":["20","24","25","30"],"a":2,"sc":"(4k + 5)/(5k + 5) = 5/6 gives k = 5; elder = 25."},{"t":"logic","s":"Ages","tgt":75,"q":"A father is 30 years older than his son. After 5 years he will be 3 times as old. What is the son's present age?","o":["15","8","12","10"],"a":3,"sc":"S + 35 = 3(S + 5) gives S = 10."},{"t":"logic","s":"Ages","tgt":60,"q":"The average age of A, B and C is 30. B and C average 33. What is A's age?","o":["27","30","21","24"],"a":3,"sc":"Total 90, B + C = 66, so A = 24."},{"t":"logic","s":"Ages","tgt":75,"q":"A mother is 24 years older than her son. In 8 years she will be 3 times as old as him. What is the son's present age?","o":["8","6","4","5"],"a":2,"sc":"S + 32 = 3(S + 8) gives S = 4."},{"t":"logic","s":"Ages","tgt":75,"q":"The sum of a father's and son's ages is 56. Four years ago the father was 3 times the son's age. What is the father's present age?","o":["38","36","40","42"],"a":2,"sc":"F = 3S − 8 and F + S = 56 give S = 16, F = 40."},{"t":"logic","s":"Ages","tgt":75,"q":"Ten years ago A was half of A's age 10 years from now. What is A's present age?","o":["40","25","30","20"],"a":2,"sc":"A − 10 = (A + 10)/2 gives A = 30."},{"t":"logic","s":"Ages","tgt":60,"q":"The ages of A and B are in the ratio 3:5 and sum to 40. What is the difference of their ages?","o":["12","10","15","8"],"a":1,"sc":"Parts: 15 and 25. Difference 10."},{"t":"logic","s":"Ages","tgt":75,"q":"Ramu is 4 times as old as Shyam. After 6 years Ramu will be 2.5 times as old as Shyam. What is Ramu's present age?","o":["28","32","20","24"],"a":3,"sc":"4S + 6 = 2.5(S + 6) gives S = 6, so Ramu = 24."},{"t":"logic","s":"Ages","tgt":60,"q":"A is 8 years older than B. In 4 years the sum of their ages will be 48. What is B's present age?","o":["16","18","20","14"],"a":0,"sc":"A + B = 40 now; B = 16, A = 24."},{"t":"logic","s":"Ages","tgt":45,"q":"A is 6 years older than B. What is the difference of their ages after 10 years?","o":["10","16","4","6"],"a":3,"sc":"The age difference never changes."},{"t":"logic","s":"Ages","tgt":60,"q":"Five years ago a boy was one-third of his father's age then. The father is 38 now. What is the boy's age now?","o":["14","15","16","11"],"a":2,"sc":"Father then was 33, boy then 11, boy now 16."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the price of one pen? (I) 3 pens and 2 pencils cost ₹40. (II) A pencil costs ₹5.","o":["Statement I alone is sufficient","Either statement alone is sufficient","Both together are needed","Statement II alone is sufficient"],"a":2,"sc":"I alone has two unknowns; II gives pencil = 5, so 3p + 10 = 40 and p = 10. Both are needed."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the value of x? (I) x² = 9. (II) x > 0.","o":["Statement II alone is sufficient","Both together are needed","Either statement alone is sufficient","Statement I alone is sufficient"],"a":1,"sc":"I gives ±3. II removes the negative. Both together give x = 3."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"Is Priya taller than Riya? (I) Priya is taller than Sana. (II) Sana is taller than Riya.","o":["Statement II alone is sufficient","Either statement alone is sufficient","Both together are needed","Statement I alone is sufficient"],"a":2,"sc":"Only the chain Priya > Sana > Riya settles it."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the area of a square? (I) The perimeter is 20 cm. (II) The diagonal is 5√2 cm.","o":["Either statement alone is sufficient","Statement I alone is sufficient","Statement II alone is sufficient","Both together are needed"],"a":0,"sc":"Either gives side 5, area 25. Each alone is sufficient."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the speed of the train? (I) It covers 120 km. (II) It takes 2 hours.","o":["Both together are needed","Either statement alone is sufficient","Statement II alone is sufficient","Statement I alone is sufficient"],"a":0,"sc":"Speed = distance/time needs both."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What day is it today? (I) The day after tomorrow is Friday. (II) Yesterday was Tuesday.","o":["Statement I alone is sufficient","Statement II alone is sufficient","Both together are needed","Either statement alone is sufficient"],"a":3,"sc":"Both fix today as Wednesday."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"How many students are in the class? (I) 40% are girls. (II) 24 are boys.","o":["Both together are needed","Statement I alone is sufficient","Statement II alone is sufficient","Either statement alone is sufficient"],"a":0,"sc":"Boys are 60% = 24, so total 40. Needs both."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"Is x even? (I) x is divisible by 4. (II) x is a multiple of 3.","o":["Both together are needed","Either statement alone is sufficient","Statement II alone is sufficient","Statement I alone is sufficient"],"a":3,"sc":"Every multiple of 4 is even. II alone can be odd or even."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the cost price of an article? (I) The profit is 20%. (II) The selling price is ₹600.","o":["Statement I alone is sufficient","Both together are needed","Statement II alone is sufficient","Either statement alone is sufficient"],"a":1,"sc":"CP = 600/1.2 = 500, using both."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"How old is Raj? (I) Raj is 5 years older than Sam. (II) Sam is 5 years older than Tina.","o":["Statement I alone is sufficient","Both together are needed","Statement II alone is sufficient","Even both together are not sufficient"],"a":3,"sc":"Only relative differences; no age is pinned."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the average of three numbers? (I) Their sum is 45. (II) The largest is 20.","o":["Statement I alone is sufficient","Statement II alone is sufficient","Both together are needed","Either statement alone is sufficient"],"a":0,"sc":"Average = sum/count = 15 from I alone."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the HCF of a and b? (I) a × b = 360. (II) LCM(a, b) = 60.","o":["Both together are needed","Statement II alone is sufficient","Statement I alone is sufficient","Either statement alone is sufficient"],"a":0,"sc":"HCF = product/LCM = 6, needs both."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"In how many days can A alone finish the job? (I) A and B together finish it in 6 days. (II) B alone finishes it in 10 days.","o":["Statement II alone is sufficient","Statement I alone is sufficient","Both together are needed","Either statement alone is sufficient"],"a":2,"sc":"1/6 − 1/10 = 1/15 → 15 days. Both are needed."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"Is n positive? (I) n² = 16. (II) n + 3 > 0.","o":["Both together are needed","Either statement alone is sufficient","Statement I alone is sufficient","Statement II alone is sufficient"],"a":0,"sc":"I gives ±4; II rules out −4 (−1 is not > 0). Both together give n = 4."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"What is the length of the rectangle? (I) Its area is 48 cm². (II) Its breadth is 6 cm.","o":["Statement II alone is sufficient","Either statement alone is sufficient","Statement I alone is sufficient","Both together are needed"],"a":3,"sc":"Length = 48/6 = 8; one statement alone leaves two unknowns."},{"t":"logic","s":"Data sufficiency","tgt":75,"q":"Who is the tallest of A, B and C? (I) A is taller than B. (II) C is shorter than A.","o":["Both together are needed","Statement I alone is sufficient","Statement II alone is sufficient","Either statement alone is sufficient"],"a":0,"sc":"Together: A is taller than B and taller than C, so A is the tallest. Each alone leaves one comparison open."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: The government has banned plastic bags in the city. Which assumption is implicit?","o":["Every citizen will obey the ban","Other cities will follow","Plastic bags are considered harmful","Paper bags are cheaper"],"a":2,"sc":"A ban only makes sense if the thing banned is seen as harmful. The rest add outside claims."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: 'Wear a helmet; it can save your life.' Which assumption is implicit?","o":["Accidents are always fatal","People value their lives","Helmets are fashionable","Helmets are cheap"],"a":1,"sc":"The advice persuades only if the reader cares about survival."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: Students must submit assignments online from next month. Which assumption is implicit?","o":["All students own laptops","Online assignments score higher","Teachers dislike paper","Students have access to the internet"],"a":3,"sc":"The rule is workable only if students can get online. Owning a laptop is too specific."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: 'Mobile phones must be switched off in the library.' Which assumption is implicit?","o":["Libraries have no signal","Phones are banned everywhere","Phones can disturb readers","Readers dislike technology"],"a":2,"sc":"The rule exists because phones cause disturbance."},{"t":"logic","s":"Statement & conclusion","tgt":75,"q":"Statement: A shop announced a 10% discount on bulk orders. Which assumption is implicit?","o":["Competitors give no discount","Prices were too high earlier","Bulk buyers need no discount","Discounts attract bulk buyers"],"a":3,"sc":"The offer makes sense only if discounts draw such buyers."},{"t":"logic","s":"Statement & conclusion","tgt":75,"q":"Statement: All students who scored above 90% got scholarships. Ravi got a scholarship. Conclusion: Ravi scored above 90%.","o":["Definitely false","Definitely true","Cannot be determined","Follows from statement"],"a":2,"sc":"The rule goes one way. Ravi may have qualified another way."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: Some employees of Firm X work from home. Conclusion: All employees of Firm X work in the office.","o":["Cannot be determined","Probably true","Definitely false","Definitely true"],"a":2,"sc":"If some work from home, it cannot be that all work in the office."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: Rain is forecast for tomorrow. Conclusion: Tomorrow's cricket match will be cancelled.","o":["Follows","Follows partly","Does not follow","Definitely true"],"a":2,"sc":"Cancellation is an outside inference; the statement says nothing about the match."},{"t":"logic","s":"Statement & conclusion","tgt":75,"q":"Statement: A hotel advertises, 'Stay with us for the best view of the city.' Which assumption is implicit?","o":["The hotel is full","Other hotels are cheaper","Guests come only for the view","Guests value a good view"],"a":3,"sc":"The ad persuades only if a good view matters to guests."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: Only those with ID cards are allowed inside the premises. Conclusion: Anyone inside has an ID card.","o":["Definitely false","Does not follow","Follows","Cannot be determined"],"a":2,"sc":"Entry requires an ID card, so everyone inside must hold one."},{"t":"logic","s":"Statement & conclusion","tgt":75,"q":"Statement: The price of tomatoes rose sharply last month due to heavy rain. Conclusion: Heavy rain affected the supply of tomatoes.","o":["Definitely false","Cannot be determined","Follows","Does not follow"],"a":2,"sc":"The statement itself links the rain to the price rise through supply."},{"t":"logic","s":"Statement & conclusion","tgt":60,"q":"Statement: 'Buy a ticket early to get a cheaper fare.' Which assumption is implicit?","o":["Airlines lose money otherwise","All seats will be sold out","Fares rise as the date approaches","Late tickets are unavailable"],"a":2,"sc":"The advice assumes early buying actually saves money."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 3, 5, 7, 9, 11?","o":["3","11","7","9"],"a":3,"sc":"All others are prime; 9 = 3²."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 16, 25, 36, 49, 50?","o":["50","49","36","16"],"a":0,"sc":"The rest are perfect squares."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: Apple, Mango, Potato, Banana, Grape?","o":["Grape","Potato","Banana","Mango"],"a":1,"sc":"The rest are fruits; a potato is a vegetable."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 121, 144, 169, 196, 200?","o":["169","196","200","121"],"a":2,"sc":"Squares of 11–14; 200 is not a square."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 12, 18, 24, 30, 35?","o":["35","24","30","12"],"a":0,"sc":"Multiples of 6 except 35."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 8, 27, 64, 125, 150?","o":["8","64","125","150"],"a":3,"sc":"Cubes of 2, 3, 4, 5."},{"t":"logic","s":"Odd one out","tgt":60,"q":"Which does not belong: 41, 43, 47, 51, 53?","o":["53","47","51","41"],"a":2,"sc":"51 = 3 × 17; the rest are prime."},{"t":"logic","s":"Odd one out","tgt":60,"q":"Which does not belong: 18, 27, 36, 45, 52?","o":["45","18","52","36"],"a":2,"sc":"The rest have a digit sum of 9."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 14, 21, 28, 35, 40?","o":["40","14","28","35"],"a":0,"sc":"Multiples of 7."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: 2, 4, 8, 16, 18?","o":["8","18","4","16"],"a":1,"sc":"Powers of 2."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: Lion, Tiger, Leopard, Cow, Cheetah?","o":["Cow","Tiger","Lion","Cheetah"],"a":0,"sc":"The rest are big cats."},{"t":"logic","s":"Odd one out","tgt":60,"q":"Which does not belong: 1, 8, 27, 64, 100?","o":["100","1","27","64"],"a":0,"sc":"Perfect cubes, except 100."},{"t":"logic","s":"Odd one out","tgt":45,"q":"Which does not belong: Delhi, Mumbai, Chennai, Kolkata, Nile?","o":["Kolkata","Chennai","Nile","Delhi"],"a":2,"sc":"The rest are cities."},{"t":"logic","s":"Odd one out","tgt":60,"q":"Which does not belong: 6, 28, 496, 100?","o":["28","100","6","496"],"a":1,"sc":"6, 28, 496 are perfect numbers."},{"t":"logic","s":"Seating","tgt":90,"q":"Five people sit in a row. A is at the left end; C sits immediately right of A; E is at the right end; B is to the left of D. Who sits in the middle?","o":["B","A","C","D"],"a":0,"sc":"Order: A, C, B, D, E."},{"t":"logic","s":"Seating","tgt":75,"q":"Four friends A, B, C, D sit around a square table facing the centre. A is opposite C, and B is on A's left. Who is on A's right?","o":["D","C","Cannot be determined","B"],"a":0,"sc":"B is left, C is opposite, so D must be on the right."},{"t":"logic","s":"Seating","tgt":75,"q":"In a row of 9, P sits third from the left and Q sits fourth from the right. How many people are between them?","o":["1","3","4","2"],"a":3,"sc":"Q is 6th from the left; between = 6 − 3 − 1 = 2."},{"t":"logic","s":"Seating","tgt":75,"q":"In a row, A is left of B and right of C. D is right of B and left of E. Who is in the middle?","o":["B","C","A","D"],"a":0,"sc":"Order: C, A, B, D, E."},{"t":"logic","s":"Seating","tgt":60,"q":"X is 7th from the left and 9th from the right in a row. How many people are in the row?","o":["14","17","16","15"],"a":3,"sc":"7 + 9 − 1 = 15."},{"t":"logic","s":"Seating","tgt":75,"q":"In a row facing north, M is to the immediate right of N and O is to the immediate left of N. Who is at the extreme left of the three?","o":["N","Cannot be determined","M","O"],"a":3,"sc":"Left to right: O, N, M."},{"t":"logic","s":"Seating","tgt":75,"q":"Seats are numbered 1–8 in a row. P sits at 3, Q two seats to the right of P and R immediately left of Q. Who sits between P and Q?","o":["S","Nobody","Q","R"],"a":3,"sc":"P at 3, Q at 5, R at 4."},{"t":"logic","s":"Seating","tgt":75,"q":"Six people A–F sit in a row. A is immediately left of B; F is at the right end; C is left of A; D is right of B; E is between D and F. Who is at the left end?","o":["B","A","D","C"],"a":3,"sc":"Order: C, A, B, D, E, F."}]}

  function SHELL() {
    var out = ['<meta charset="utf-8">',
               '<meta name="viewport" content="width=device-width,initial-scale=1">'];
    var t = document.querySelector("title");
    if (t) out.push(t.outerHTML);
    Array.prototype.forEach.call(document.querySelectorAll("link"), function (n) {
      var h = n.getAttribute("href") || "";
      if (h.indexOf("fonts.googleapis") !== -1 || h.indexOf("fonts.gstatic") !== -1) out.push(n.outerHTML);
    });
    Array.prototype.forEach.call(document.querySelectorAll("style"), function (n) {
      var s = n.textContent || "";
      if (s.indexOf("--mono:") !== -1) out.push(n.outerHTML);
    });
    return out.join("\n");
  }

  var BANK = JSON.parse(document.getElementById("bank").textContent);

  var EXAM_N = 20, EXAM_MIN = 25;   // TCS Foundation section shape: ~20 questions, 25 minutes

  var LS = "aptitude-v1";
  function migrate(s) {
    if (!s || typeof s !== "object") s = {};
    ["seen", "wrong", "tot", "ok", "time"].forEach(function (k) { if (!s[k]) s[k] = {}; });
    if (!Array.isArray(s.exams)) s.exams = [];
    if (typeof s.rev !== "number") s.rev = 0;

  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function topicOf(k) { return TOPICS.filter(function (t) { return t.k === k; })[0]; }
  function tot(k) { return state.tot[k] || 0; }
  function okc(k) { return state.ok[k] || 0; }
  function acc(k) { return tot(k) ? Math.round((okc(k) / tot(k)) * 100) : 0; }
  function nQ(k) { return Q.filter(function (q) { return q.t === k; }).length; }
  function seenIn(k) { return Q.filter(function (q) { return q.t === k && state.seen[q._i]; }).length; }
  function wrongList() { return Q.filter(function (q) { return state.wrong[q._i]; }); }
  function subsOf(k) {
    var m = {};
    Q.forEach(function (q) { if (q.t === k) m[q.s] = (m[q.s] || 0) + 1; });

  }
  function avgTime() {
    var ks = Object.keys(state.time);

  /* ---------- formula & trick sheet: read this, THEN drill ---------- */

  function start(queue, mode) {
    V.queue = queue.map(function (q) { return { q: q, p: present(q) }; });
    V.at = 0; V.picked = null; V.mode = mode; V.answers = []; V.times = [];
    V.screen = "quiz";
    if (mode === "exam") { V.left = EXAM_MIN * 60; startClock(); }
    beginQ(); render();
  }
  function startClock() {
    stopClock();

      V.left--;

      if (V.left <= 0) { stopClock(); finishExam(); }
    }, 1000);
  }
  function stopClock() { if (V.tid) { clearInterval(V.tid); V.tid = null; } }

  }
  function stopQ() { if (V.qtid) { clearInterval(V.qtid); V.qtid = null; } }

  /* ---------- quiz ---------- */
  function quiz() {
    var f = document.createDocumentFragment();

    var crumb = el("div", "crumb");

    f.appendChild(crumb);

    var qb = el("div", "qbox");

        else if (shown === V.picked) b.className = "opt wrong";

      sk.type = "button"; sk.id = "nextBtn";

  function answer(shown) {
    var item = V.queue[V.at], q = item.q, p = item.p;
    V.times[V.at] = V.qElapsed;
    if (V.mode === "exam") {
      V.answers[V.at] = shown;
      if (V.at + 1 < V.queue.length) { V.at++; V.picked = null; beginQ(); }
      render();
      return;
    }
    if (V.picked != null) return;
    stopQ();
    V.picked = shown;
    var right = shown === p.correctAt;
    state.seen[q._i] = 1;
    state.time[q._i] = V.qElapsed;
    state.tot[q.t] = tot(q.t) + 1;
    if (right) { state.ok[q.t] = okc(q.t) + 1; delete state.wrong[q._i]; }
    else state.wrong[q._i] = 1;
    save(); render();
  }

  function next() {
    V.picked = null;
    if (V.at + 1 < V.queue.length) { V.at++; beginQ(); render(); }
    else { stopQ(); V.screen = "home"; render(); }
  }

  function finishExam() {
    stopClock(); stopQ();
    var right = 0, wrongN = 0, blank = 0;
    V.queue.forEach(function (item, i) {
      var a = V.answers[i];
      state.seen[item.q._i] = 1;
      if (V.times[i]) state.time[item.q._i] = V.times[i];
      state.tot[item.q.t] = tot(item.q.t) + 1;
      if (a == null) { blank++; state.wrong[item.q._i] = 1; }
      else if (a === item.p.correctAt) { right++; state.ok[item.q.t] = okc(item.q.t) + 1; delete state.wrong[item.q._i]; }
      else { wrongN++; state.wrong[item.q._i] = 1; }
    });
    var marks = state.neg ? right - 0.25 * wrongN : right;
    state.exams.push({ n: V.queue.length, right: right, wrongN: wrongN, blank: blank,
                       marks: Math.round(marks * 100) / 100, used: EXAM_MIN * 60 - V.left, neg: state.neg });
    V.res = { right: right, wrongN: wrongN, blank: blank, marks: Math.round(marks * 100) / 100 };
    V.screen = "result";
    save(); render();
  }

  function result() {
    var f = document.createDocumentFragment();
    var n = V.queue.length, r = V.res;
    var pct = Math.round((r.marks / n) * 100);
    var pass = pct >= 60;
    var used = EXAM_MIN * 60 - V.left;
    var card = el("div", "score");
    card.appendChild(el("div", "big " + (pass ? "pass" : "fail"), r.marks + "/" + n));
    card.appendChild(el("h2", null, pct + "%" + (state.neg ? " after negative marking" : "")));
    card.appendChild(el("p", null, state.neg
      ? "With 0.25 negative marking, " + r.wrongN + " wrong answers cost you " + (0.25 * r.wrongN) + " marks. Blanks cost nothing — so if you cannot eliminate two options, skipping genuinely scores better than guessing."
      : "Aptitude cut-offs sit around 60 to 70% and the sections auto-lock, so pace matters as much as accuracy. Turn on negative marking to practise the DE Shaw and Arcesium format."));

    var g = el("div", "grid3");
    [[r.right, "right"], [r.wrongN, "wrong"], [r.blank, "blank"],
     [fmt(used), "time used"], [Math.round(used / n) + "s", "avg per q"],
     [Math.round((r.right / n) * 100) + "%", "raw accuracy"]].forEach(function (x) {
      var c = el("div", "cell");
      c.appendChild(el("div", "v", String(x[0])));
      c.appendChild(el("div", "l", x[1]));
      g.appendChild(c);
    });
    card.appendChild(g);

    var missed = 0;
    var rv = el("div", "review");
    V.queue.forEach(function (item, i) {
      var a = V.answers[i], q = item.q;
      var wrong = a == null || a !== item.p.correctAt;
      var slow = !wrong && V.times[i] > q.tgt;
      if (!wrong && !slow) return;
      missed++;
      var d = el("div", "ritem" + (slow ? " slowr" : ""));
      d.appendChild(el("div", "rq", q.s + " · " + q.q));
      d.appendChild(el("div", "ra", "correct: " + q.o[q.a]));
      if (a == null) d.appendChild(el("div", "rp", "left blank"));
      else if (wrong) d.appendChild(el("div", "rp", "you: " + q.o[item.p.order[a]]));
      else d.appendChild(el("div", "rp", "right, but took " + V.times[i] + "s against a " + q.tgt + "s target"));
      d.appendChild(el("div", "re", q.sc));
      rv.appendChild(d);
    });
    if (missed) card.appendChild(rv);

    var row = el("div", "cta");
    var again = el("button", "btn exam", "retake"); again.type = "button";
    again.addEventListener("click", function () { start(shuffle(Q).slice(0, EXAM_N), "exam"); });
    row.appendChild(again);
    if (wrongList().length) {
      var rb = el("button", "btn primary", "drill mistakes"); rb.type = "button";
      rb.addEventListener("click", function () { start(shuffle(wrongList()), "drill"); });
      row.appendChild(rb);
    }
    var hm = el("button", "btn ghost", "menu"); hm.type = "button";
    hm.addEventListener("click", function () { V.screen = "home"; V.mode = "drill"; render(); });
    row.appendChild(hm);
    card.appendChild(row);
    f.appendChild(card);
    return f;
  }

  document.addEventListener("keydown", function (ev) {
    if (V.screen !== "quiz") {
      if (ev.key === "Enter") { var b = document.getElementById("nextBtn"); if (b) { b.click(); ev.preventDefault(); } }
      return;
    }
    var n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 4) {
      var btns = document.querySelectorAll(".opt");
      if (btns[n - 1] && !btns[n - 1].disabled) { btns[n - 1].click(); ev.preventDefault(); return; }
    }
    if (ev.key === "Enter") { var b2 = document.getElementById("nextBtn"); if (b2) { b2.click(); ev.preventDefault(); } }
  });

  function render() {
    var y = window.scrollY;
    app.textContent = "";
    app.appendChild(bar());
    if (V.screen === "home") app.appendChild(home());
    else if (V.screen === "sheet") app.appendChild(sheetScreen());
    else if (V.screen === "all") app.appendChild(allSheets());
    else if (V.screen === "quiz") app.appendChild(quiz());
    else app.appendChild(result());
    window.scrollTo(0, V.screen === "home" ? y : 0);
  }

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) { if (a) api = a; }).catch(function () {});
  }
})();
</script>
