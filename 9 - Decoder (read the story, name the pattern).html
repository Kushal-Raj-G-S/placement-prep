 + BFS also works.)","cx":"O(E log V).","o":["Union-Find (DSU)","Dynamic programming","Graph: BFS / Dijkstra","Greedy"],"a":2},{"pat":"graph","ak":"graph","st":"Water rises over a grid of cell elevations; at time t you may move between cells whose elevation is at most t. Find the least time to travel from the top-left to the bottom-right.","cn":"grid <= 50 x 50","core":"Dijkstra minimising the maximum elevation on the path (equivalently binary-search the time with BFS, or union-find as cells activate).","tell":"Reach the goal minimising the highest cell crossed -- a max-elevation Dijkstra.","cx":"O(E log V).","o":["Union-Find (DSU)","Dynamic programming","Greedy","Graph: BFS / Dijkstra"],"a":3},{"pat":"graph","ak":"graph","st":"For every cell of a binary matrix, compute its distance to the nearest zero cell (moving orthogonally).","cn":"grid <= 10^4 cells","core":"Multi-source BFS seeded with all zero cells at once, filling outward.","tell":"Distance to the nearest source for every cell -- multi-source BFS from all the zeros.","cx":"O(rows*cols).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":0},{"pat":"graph","ak":"graph","st":"Given a grid of land and water, find the water cell whose distance to the nearest land cell is as large as possible, and return that distance.","cn":"grid <= 100 x 100","core":"Multi-source BFS from all land cells; the last water cell reached gives the maximum distance.","tell":"Maximise the distance-to-nearest-source -- multi-source BFS; the final expansion layer is the answer.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":1},{"pat":"graph","ak":"topo","st":"Given course prerequisite pairs, decide whether it is possible to finish all courses.","cn":"courses <= 2000, prereqs <= 5000","core":"Attempt a topological order (process zero-in-degree nodes); if any node never reaches in-degree zero, a cycle exists.","tell":"'Prerequisites, can it be ordered' -- topological sort; a leftover node means a directed cycle.","cx":"O(V+E).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Topological sort","Dynamic programming"],"a":2},{"pat":"graph","ak":"topo","st":"Given course prerequisite pairs, return a valid order in which to take all the courses, or an empty list if it is impossible.","cn":"courses <= 2000, prereqs <= 5000","core":"Kahn's algorithm: repeatedly output a zero-in-degree course and decrement its dependents.","tell":"Produce the actual ordering -- Kahn's BFS on in-degrees.","cx":"O(V+E).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Topological sort"],"a":3},{"pat":"graph","ak":"graph","st":"On a grid, water flows from a cell to an equal-or-lower orthogonal neighbour. Find all cells from which water can reach BOTH the top/left ocean and the bottom/right ocean.","cn":"grid <= 200 x 200","core":"Flood-fill inward from each ocean's border (uphill), then intersect the two reachable sets.","tell":"Reachability from two borders -- flood-fill inward from each ocean, then intersect.","cx":"O(rows*cols).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":0},{"pat":"graph","ak":"graph","st":"A 4-wheel combination lock starts at 0000; each move turns one wheel one step. Some codes are dead-ends you must avoid. Find the fewest moves to reach a target code, or -1.","cn":"dead-ends <= 500","core":"BFS over the 10000 code-states, treating each single-wheel turn as an edge and skipping dead-ends.","tell":"Fewest moves across a state space with forbidden states -- BFS, each code a node.","cx":"O(10000*8).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":1},{"pat":"graph","ak":"graph","st":"Edges of a directed graph are coloured red or blue. Find, for every node, the length of the shortest path from node 0 that strictly alternates edge colours.","cn":"nodes <= 100","core":"BFS over states (node, colour-of-last-edge) so the alternation constraint is baked into the state.","tell":"Shortest steps under an alternation constraint -- BFS on (node, last-colour) states.","cx":"O(V+E).","o":["Union-Find (DSU)","Dynamic programming","Graph: BFS / Dijkstra","Greedy"],"a":2},{"pat":"graph","ak":"graph","st":"Count the land cells in a grid from which you CANNOT walk off the edge of the grid moving only through land.","cn":"grid <= 500 x 500","core":"Flood-fill from every border land cell to mark escapable land, then count the unmarked land.","tell":"Cells that cannot escape to the edge -- flood-fill from the border, count what's left.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Dynamic programming","Greedy","Graph: BFS / Dijkstra"],"a":3},{"pat":"graph","ak":"graph","st":"In a grid of 'X' and 'O', capture every region of 'O' that is completely surrounded by 'X' by flipping it to 'X'; regions touching the border are safe.","cn":"grid <= 200 x 200","core":"Flood-fill from border 'O' cells to mark the safe regions, then flip every unmarked 'O'.","tell":"Border-connected regions survive -- flood-fill from the edges to mark survivors, flip the rest.","cx":"O(rows*cols).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":0},{"pat":"graph","ak":"graph","st":"A grid contains exactly two islands of land. Find the fewest water cells you must flip to land to connect the two islands into one.","cn":"grid <= 100 x 100","core":"Flood-fill one island, then BFS outward through water until you reach the second island; the layers crossed is the bridge length.","tell":"Flood-fill one island, then BFS the water outward to the other -- the layer count is the bridge.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":1},{"pat":"graph","ak":"graph","st":"Each edge carries a probability of success. Find the path from a start node to an end node that maximises the product of edge probabilities, and return that probability.","cn":"nodes <= 10^4, edges <= 2*10^4","core":"Dijkstra with a max-heap maximising the running product (taking logs turns it into a shortest-path).","tell":"Maximise a product of edge weights -- a Dijkstra variant with a max-heap; log-transform makes it a standard shortest path.","cx":"O(E log V).","o":["Union-Find (DSU)","Dynamic programming","Graph: BFS / Dijkstra","Greedy"],"a":2},{"pat":"graph","ak":"graph","st":"Given a bordered maze with an entrance, find the fewest steps to reach any exit on the border (the entrance itself does not count as an exit), or -1 if none is reachable.","cn":"grid <= 10^5 cells","core":"BFS from the entrance; the first border cell you reach (other than the entrance) gives the answer.","tell":"Fewest steps to any exit -- BFS from the start; the first border cell reached wins.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Dynamic programming","Greedy","Graph: BFS / Dijkstra"],"a":3}],"whynot":{"dsu":{"Graph: BFS / Dijkstra":"BFS/DFS can find components too, but when links arrive as a stream, or you must answer 'are these two already connected?' before acting, traversing the whole graph each time is wasteful. Union-find answers each query in near-O(1).","Dynamic programming":"Nothing is being optimised over choices and there are no overlapping subproblems. It is pure connectivity between elements.","Greedy":"There is no sort-then-pick optimisation. You are grouping elements by a transitive relation, not making locally-best choices.","Topological sort":"Topo sort needs directed prerequisites and yields an ORDER. Here the relation is mutual ('connected') and you want groups, not an order.","Two pointers":"Two pointers exploits a sorted linear array. This merges arbitrary pairs into groups, with no linear order to walk.","Backtracking":"Nothing is searched or undone; union is deterministic, not a search over choices.","Sorting":"Sorting the items does not reveal which are connected; connectivity is transitive across arbitrary pairs, which is what union-find tracks.","Sliding window":"There is no contiguous range here; elements are joined by arbitrary pairwise links, not by adjacency.","Prefix sum":"There is no range-sum being queried; the question is about group membership."},"bsa":{"Greedy":"A single greedy pass cannot land on the optimal threshold directly. Greed is used INSIDE the check: you binary-search the answer, then verify each candidate greedily.","Dynamic programming":"DP would compute exact costs over states, usually far slower. When the answer is monotone (bigger is always feasible, or always not), binary-searching it is simpler and faster.","Two pointers":"Two pointers scans indices of a structure. Here you search over the VALUE of the answer itself (a capacity, a speed, a gap), not over array positions.","Heap / priority queue":"A heap orders elements; it does not exploit the monotone 'is X feasible?' structure that is the whole reason binary-search-on-answer works.","Sorting":"Sorting alone cannot find the optimal threshold. The feasibility check may want sorted data, but the search itself is a binary search over the answer.","Sliding window":"There is no contiguous range being optimised; you are searching over a numeric answer value.","Dynamic programming ":""},"greedy":{"Dynamic programming":"DP is only needed when a locally-best choice can be regretted later. Here an exchange argument proves the greedy choice is always safe, so DP's overhead is wasted.","Heap / priority queue":"A heap is sometimes the greedy tool, but if one sort plus a single pass suffices, you do not need the log-factor.","Binary search on the answer":"There is no monotone 'is X feasible' threshold to search. You build the optimal answer directly by repeated safe choices.","Sliding window":"No contiguous-range condition is being optimised. The greedy choice is over sorted items or events, not a moving window.","Two pointers":"Two pointers can implement the greedy pairing, but the decision rule (which to pick) is the greedy insight; if you called it 'two pointers' you'd miss why the pairing is optimal.","Sorting":"Sorting is only step one; the answer comes from the choice rule applied during the pass, which is the greedy part."},"dp":{"Greedy":"The tempting greedy pick fails on some input here (arbitrary coin sets, take-or-skip with future cost). When a local choice can be regretted, you need DP over states.","Backtracking":"Plain backtracking re-solves the same subproblems exponentially. The subproblems OVERLAP, so memoising them collapses it to polynomial, which is DP.","Binary search on the answer":"There is no single monotone numeric answer to search. You are counting or optimising over combinations of choices.","Sliding window":"The sub-structure is not a contiguous window; a choice depends on earlier decisions, not just a range.","Two pointers":"Two pointers needs monotonic movement over sorted or paired data; here the state carries forward decisions, which needs a table.","Heap / priority queue":"No extreme of a live set is being pulled; you are combining subproblem answers via a recurrence."},"win":{"Two pointers":"A sliding window IS two pointers, but the tell is a CONTIGUOUS subarray/substring with a 'longest / shortest / at most K' condition where both pointers only move forward. If elements can be anywhere, or the array is sorted for a pair, it is the generic two-pointer instead.","Prefix sum":"Prefix sums answer arbitrary range-sum queries, but not 'longest/shortest range with a property' cleanly. With a distinctness or at-most-K condition, a window is the tool. (Prefix sum wins only when negatives break the window.)","Heap / priority queue":"A heap tracks an extreme over a changing set. Unless you need the max/min INSIDE the window fast, a plain window with counts is enough.","Dynamic programming":"No recurrence is needed; the answer is read straight off one forward-moving window.","Greedy":"There is a window rule, not a sort-and-pick; the 'choice' is only how far to expand or shrink the current range.","Sorting":"Sorting would destroy the contiguity that the window depends on (unless the problem explicitly allows a reorder first)."},"heap":{"Greedy":"This IS greedy, but the greedy step is 'repeatedly take the current largest/smallest', and doing that fast over a CHANGING set needs a heap, not a one-time sort.","Sorting":"A single sort works only if the set never changes. Here elements are inserted, removed, or unlocked over time, so you need a structure that keeps the extreme live: a heap.","Sliding window":"Nothing here is a contiguous range; you are pulling the k-th best or the running extreme from an unordered or streaming set.","Dynamic programming":"No overlapping subproblems; you are maintaining an extreme over a live set, a data-structure job, not a recurrence.","Two pointers":"Two pointers needs a sorted linear layout; a heap is for pulling extremes from a set that keeps changing.","Binary search on the answer":"There is no monotone feasibility to search; you are repeatedly extracting the current extreme."},"graph":{"Union-Find (DSU)":"Union-find answers connectivity but cannot give shortest DISTANCES or an actual path. When you need fewest steps or a min-weight path, you must traverse: BFS (unweighted) or Dijkstra (weighted).","Dynamic programming":"DP fits DAGs and grids without cycles. General graphs with cycles need a traversal that revisits by priority (Dijkstra) or by layer (BFS), not a fixed DP sweep.","Greedy":"Dijkstra is a greedy traversal, but 'pick the best now' without the visited-set and frontier gives wrong paths. The graph machinery is essential.","Backtracking":"Backtracking explores exponentially many paths; BFS/Dijkstra find the optimum in polynomial time using a frontier.","Topological sort":"Topo sort applies only to a DAG and yields an ORDER, not distances. With cycles, or when you need shortest steps, use BFS/Dijkstra.","Sorting":"Sorting the cells or nodes ignores adjacency; you must explore neighbours through the graph structure."},"topo":{"Graph: BFS / Dijkstra":"Plain BFS gives shortest steps, not a valid dependency order. Ordering by prerequisites needs in-degree processing (Kahn) or DFS post-order.","Union-Find (DSU)":"Union-find groups nodes but ignores edge DIRECTION, so it cannot produce an order or detect a directed cycle.","Dynamic programming":"Nothing is being optimised; you need a linear ordering that respects directed prerequisites.","Greedy":"The only greedy that works is repeatedly taking a zero-in-degree node, which is exactly Kahn's topological sort.","Backtracking":"You do not need to search; process zero-in-degree nodes in order (Kahn) in linear time.","Sorting":"A plain value sort ignores the dependency edges; the order must respect prerequisites, not magnitudes."}}}</script>

  try { var raw = localStorage.getItem(LS); if (raw) local = migrate(JSON.parse(raw)); } catch (e) {}
  if (local && local.rev > embedded.rev) state = local;

  var app = document.getElementById("app");
  var api = null, saveT = null;
  var V = { screen: "home", queue: [], at: 0, picked: null, started: 0 };

  function save() {
    state.rev++;
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (!api) return;
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var o = "<" + "script", c = "<" + "/" + "script>";
      api.publish('<!doctype html>\n<html lang="en">\n<head>\n' + SHELL() + '\n</head>\n<body>\n' +
        '<div class="wrap" id="app"></div>\n' +
        o + ' type="application/json" id="bank">' + JSON.stringify(BANK, function (k, v) { return k === "_i" ? undefined : v; }) + c + '\n' +
        o + ' type="application/json" id="state">' + JSON.stringify(state) + c + '\n' +
        o + ' id="code">' + document.getElementById("code").textContent + c + '\n' +
        '</body>\n</html>').catch(function () {});
    }, 1800);
  }

  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function solved() { return Q.filter(function (q) { return state.seen[q._i] && !state.wrong[q._i]; }).length; }
  function wrongList() { return Q.filter(function (q) { return state.wrong[q._i]; }); }
  function acc() {
    var t = 0, o = 0;
    PATS.forEach(function (p) { t += (state.pat[p.key] || 0); o += (state.patok[p.key] || 0); });
    return t ? Math.round(o / t * 100) : null;
  }
  function patAcc(k) { var t = state.pat[k] || 0, o = state.patok[k] || 0; return t ? Math.round(o / t * 100) : null; }
  function patDone(k) { return Q.filter(function (q) { return q.pat === k && state.seen[q._i]; }).length; }
  function shuffle(a) { var r = a.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; }

  /* ---------- top bar ---------- */
  function bar() {
    var b = el("div", "bar");
    b.appendChild(el("div", "logo", "DECODER"));
    b.appendChild(el("div", "sp"));
    var s1 = el("div", "stat"); s1.appendChild(el("b", null, String(solved()))); var sp1 = el("span", null, "decoded"); s1.appendChild(sp1); b.appendChild(s1);
    var a = acc();
    var s2 = el("div", "stat" + (a != null && a >= 75 ? " ok" : (a != null && a < 55 ? " warn" : ""))); s2.appendChild(el("b", null, a == null ? "--" : a + "%")); s2.appendChild(el("span", null, "read right")); b.appendChild(s2);
    if (V.screen !== "home") {
      var h = el("button", "btn ghost", "\u2039 Home"); h.onclick = function () { V.screen = "home"; render(); }; b.appendChild(h);
    }
    return b;
  }

  /* ---------- home ---------- */
  function home() {
    var w = el("div", "wrap"); w.style.padding = "0"; w.style.maxWidth = "none";

    var hero = el("div", "hero");
    var h1 = el("h1"); h1.innerHTML = "Read the story. <em>Name the pattern.</em>"; hero.appendChild(h1);
    hero.appendChild(el("p", null,
      "The OA never hands you the clean problem \u2014 it buries it in a paragraph of cities, servers, or children. This drills the one skill that beats that: strip the story to its core and name the pattern fast. " +
      Q.length + " original statements you will not find on any judge, across seven optimisation families. Every reveal names the exact clue, and tells you why NOT the tempting wrong answer \u2014 so you stop second-guessing. Under each family: real problems to grind on LeetCode, Codeforces, HackerEarth and HackerRank."));
    var cta = el("div", "cta");
    var b1 = el("button", "btn primary", "Start decode drill \u2192"); b1.onclick = function () { startDrill(Q.map(function (q) { return q._i; })); }; cta.appendChild(b1);
    var wl = wrongList();
    if (wl.length) { var b2 = el("button", "btn", "Redo missed (" + wl.length + ")"); b2.onclick = function () { startDrill(wl.map(function (q) { return q._i; })); }; cta.appendChild(b2); }
    hero.appendChild(cta);
    w.appendChild(hero);

    // method
    var meth = el("div", "sheet");
    var mh = el("div", "sheet-h"); mh.appendChild(el("h2", null, "The four-line decode")); var mb = el("span", "badge", "do this every time"); mh.appendChild(mb); meth.appendChild(mh);
    var steps = [
      ["1. Entities", "What are the objects? (cities, houses, characters, tasks) Ignore the flavour \u2014 they are just nodes, an array, or a string."],
      ["2. What changes / what is asked", "Merge over time? Longest contiguous run? Fewest steps? Minimise a maximum? The verb is the pattern, not the nouns."],
      ["3. Read the constraints FIRST", "n \u2264 20 screams bitmask. n \u2264 1000 allows O(n\u00b2). n \u2264 10\u2075 forces O(n log n). n \u2265 10\u2079 means log or maths. The bound shortlists the algorithm before you finish the story."],
      ["4. Name it, then commit", "Say the pattern and the complexity out loud before writing a line. If you catch yourself doubting 'why not X', that is exactly what the reveals here train away."]
    ];
    steps.forEach(function (s) {
      var sec = el("div", "sec");
      sec.appendChild(el("div", "lab", s[0]));
      var p = el("div"); p.style.color = "var(--txt)"; p.style.fontSize = "14px"; p.textContent = s[1]; sec.appendChild(p);
      meth.appendChild(sec);
    });
    w.appendChild(meth);

    // library
    var lib = el("div", "sheet");
    var lh = el("div", "sheet-h"); lh.appendChild(el("h2", null, "The seven families")); lh.appendChild(el("span", "badge", "drill one \u00b7 grind the real ones")); lib.appendChild(lh);
    PATS.forEach(function (p) {
      var sec = el("div", "sec");
      var row = el("div"); row.style.display = "flex"; row.style.alignItems = "baseline"; row.style.gap = "10px"; row.style.flexWrap = "wrap";
      var nm = el("div"); nm.style.fontFamily = "var(--mono)"; nm.style.fontSize = "15px"; nm.style.color = "var(--cy)"; nm.style.fontWeight = "600"; nm.textContent = p.label; row.appendChild(nm);
      var pa = patAcc(p.key), pd = patDone(p.key);
      var pill = el("div", "prow " + (pa != null && pa >= 75 ? "strong" : (pa != null && pa < 55 ? "weak" : "")));
      pill.style.padding = "3px 9px"; pill.style.display = "inline-grid"; pill.style.gridTemplateColumns = "auto";
      pill.appendChild(el("div", "c", pd + "/20 seen" + (pa != null ? " \u00b7 " + pa + "% right" : "")));
      row.appendChild(el("div", "sp")); row.appendChild(pill);
      sec.appendChild(row);
      var bl = el("div"); bl.style.color = "var(--dim)"; bl.style.fontSize = "13.5px"; bl.style.margin = "6px 0 4px"; bl.textContent = p.blurb; sec.appendChild(bl);

      var det = el("details"); det.style.marginTop = "6px";
      var sum = el("summary"); sum.style.cursor = "pointer"; sum.style.fontFamily = "var(--mono)"; sum.style.fontSize = "11px"; sum.style.letterSpacing = ".08em"; sum.style.textTransform = "uppercase"; sum.style.color = "var(--dim2)";
      sum.textContent = "what it is + " + (p.grind.length + p.cf.length) + " problems to grind, across judges";
      det.appendChild(sum);
      var dd = el("div"); dd.style.padding = "10px 0 2px"; dd.style.color = "var(--txt)"; dd.style.fontSize = "13.5px"; dd.style.lineHeight = "1.6"; dd.textContent = p.desc; det.appendChild(dd);
      function sublab(txt) {
        var l = el("div"); l.style.fontFamily = "var(--mono)"; l.style.fontSize = "9.5px"; l.style.letterSpacing = ".1em"; l.style.textTransform = "uppercase"; l.style.color = "var(--cy)"; l.style.margin = "13px 0 6px"; l.textContent = txt; return l;
      }
      function probGrid(list) {
        var g = el("div", "pgrid");
        list.forEach(function (x) {
          var a = el("a"); a.href = x.u; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.className = "prow"; a.style.textDecoration = "none"; a.style.color = "var(--txt)";
          var nmc = el("div"); nmc.textContent = x.n; nmc.style.fontSize = "12.5px"; a.appendChild(nmc);
          var dg = el("div", "c"); dg.textContent = x.d; dg.style.color = (x.d === "E" ? "var(--ok)" : x.d === "H" ? "var(--no)" : "var(--am)"); a.appendChild(dg);
          g.appendChild(a);
        });
        return g;
      }
      det.appendChild(sublab("LeetCode — clean statement, one problem per link"));
      det.appendChild(probGrid(p.grind));
      det.appendChild(sublab("Codeforces — long narrative statements, closest to a real OA"));
      det.appendChild(probGrid(p.cf));
      det.appendChild(sublab("Grind more — topic hubs (HackerEarth & HackerRank run most OAs)"));
      var hbrow = el("div"); hbrow.style.display = "flex"; hbrow.style.flexWrap = "wrap"; hbrow.style.gap = "7px";
      p.hubs.forEach(function (h) {
        var a = el("a"); a.href = h.u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = h.label;
        a.style.fontFamily = "var(--mono)"; a.style.fontSize = "11px"; a.style.color = "var(--cy)";
        a.style.border = "1px solid var(--edge2)"; a.style.borderRadius = "6px"; a.style.padding = "5px 9px"; a.style.textDecoration = "none";
        hbrow.appendChild(a);
      });
      det.appendChild(hbrow);
      sec.appendChild(det);

      var db = el("button", "btn"); db.style.marginTop = "10px"; db.textContent = "Drill these 20 \u2192";
      db.onclick = (function (key) { return function () { startDrill(Q.filter(function (q) { return q.pat === key; }).map(function (q) { return q._i; })); }; })(p.key);
      sec.appendChild(db);
      lib.appendChild(sec);
    });
    w.appendChild(lib);

    var ft = el("div", "foot");
    ft.innerHTML = 'Companion tools: <a href="./10%20-%20Mock%20OA%20%28timed%20exam%29.html" target="_blank" rel="noopener noreferrer">Mock OA</a> · <a href="./8%20-%20Pattern%20Radar%20%28name%20the%20pattern%29.html" target="_blank" rel="noopener noreferrer">Pattern Radar</a> \u00b7 <a href="./1%20-%20Twenty%20Weeks%20to%20AC%20%28tracker%29.html" target="_blank" rel="noopener noreferrer">the plan</a> \u00b7 <a href="./2%20-%20Stdin%20Trainer%20%28drill%29.html" target="_blank" rel="noopener noreferrer">Stdin Trainer</a> \u00b7 <a href="./5%20-%20SQL%20Lab%20%28practice%29.html" target="_blank" rel="noopener noreferrer">SQL Lab</a> \u00b7 <a href="./6%20-%20CS%20Core%20Drill%20%28OS%20DBMS%20CN%20OOP%20C%29.html" target="_blank" rel="noopener noreferrer">CS Core Drill</a> \u00b7 <a href="./7%20-%20Aptitude%20Sprint%20%28formulas%20%2B%20practice%29.html" target="_blank" rel="noopener noreferrer">Aptitude Sprint</a>';
    w.appendChild(ft);
    return w;
  }

  /* ---------- drill ---------- */
  function startDrill(ids) {
    V.queue = shuffle(ids); V.at = 0; V.picked = null; V.screen = "drill"; V.started = Date.now(); render();
  }

  function drill() {
    var w = el("div", "wrap"); w.style.padding = "0"; w.style.maxWidth = "none";
    var q = Q[V.queue[V.at]];
    var p = PATMAP[q.pat];

    var crumb = el("div", "crumb");
    crumb.appendChild(el("span", "now", "Q " + (V.at + 1) + " / " + V.queue.length));
    var pr = el("div", "prog"); var pi = el("i"); pi.style.width = ((V.at) / V.queue.length * 100) + "%"; pr.appendChild(pi); crumb.appendChild(pr);
    var tm = el("span", "qtimer", "0s"); crumb.appendChild(tm);
    w.appendChild(crumb);

    var box = el("div", "qbox");
    var stmt = el("div", "stmt", q.st); box.appendChild(stmt);
    var cons = el("div", "cons"); cons.innerHTML = "<b>Constraints \u2014 read these first</b>" + escapeHtml(q.cn); box.appendChild(cons);

    var q2 = el("div"); q2.style.fontFamily = "var(--mono)"; q2.style.fontSize = "11px"; q2.style.letterSpacing = ".08em"; q2.style.textTransform = "uppercase"; q2.style.color = "var(--dim2)"; q2.textContent = "Which pattern is hiding in here?"; box.appendChild(q2);

    var opts = el("div", "opts");
    q.o.forEach(function (label, oi) {
      var o = el("button", "opt");
      o.appendChild(el("div", "k", String.fromCharCode(65 + oi)));
      o.appendChild(el("div", null, label));
      if (V.picked != null) {
        o.disabled = true;
        if (oi === q.a) o.className = "opt right";
        else if (oi === V.picked) o.className = "opt wrong";
      } else {
        o.onclick = (function (idx) { return function () { pick(idx); }; })(oi);
      }
      opts.appendChild(o);
    });
    box.appendChild(opts);

    if (V.picked != null) box.appendChild(feedback(q));
    w.appendChild(box);

    // count-up timer
    if (V.picked == null) {
      var t0 = V.started;
      var tick = function () {
        if (V.picked != null) return;
        var s = Math.floor((Date.now() - t0) / 1000);
        tm.textContent = s + "s"; tm.className = "qtimer" + (s > TARGET ? " over" : "");
        requestAnimationFrame(function () { setTimeout(tick, 500); });
      };
      tick();
    } else {
      var sp = Math.floor((V.answeredAt - V.started) / 1000);
      tm.textContent = sp + "s"; tm.className = "qtimer" + (sp > TARGET ? " over" : "");
    }
    return w;
  }

  function pick(oi) {
    if (V.picked != null) return;
    V.picked = oi; V.answeredAt = Date.now();
    var q = Q[V.queue[V.at]];
    var ok = (oi === q.a);
    state.seen[q._i] = 1;
    state.pat[q.pat] = (state.pat[q.pat] || 0) + 1;
    if (ok) { state.patok[q.pat] = (state.patok[q.pat] || 0) + 1; delete state.wrong[q._i]; }
    else { state.wrong[q._i] = 1; }
    save();
    render();
  }

  function feedback(q) {
    var ok = (V.picked === q.a);
    var f = el("div", "fb " + (ok ? "good" : "bad"));
    f.appendChild(el("b", null, ok ? "AC \u2014 you read it right" : "WA \u2014 misread"));

    var clue = el("div", "tellbox");
    clue.appendChild(el("i", null, "The clue"));
    clue.appendChild(document.createTextNode(q.tell));
    f.appendChild(clue);

    var core = el("div"); core.style.fontSize = "13.5px";
    core.innerHTML = "<span style='font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy)'>Stripped to its core</span><br>" + escapeHtml(q.core);
    f.appendChild(core);

    var cxl = el("div", "cx", q.cx); f.appendChild(cxl);

    // why NOT the others
    var wmap = WHY[q.ak] || {};
    var wns = [];
    q.o.forEach(function (label, oi) {
      if (oi === q.a) return;
      var txt = wmap[label];
      if (txt) wns.push([label, oi === V.picked, txt]);
    });
    if (wns.length) {
      var wrap = el("div"); wrap.style.marginTop = "4px"; wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "6px";
      wrap.appendChild(el("div", null, "")).style.display = "none";
      var lab = el("div"); lab.style.fontFamily = "var(--mono)"; lab.style.fontSize = "9.5px"; lab.style.letterSpacing = ".1em"; lab.style.textTransform = "uppercase"; lab.style.color = "var(--am)"; lab.textContent = "Why not the others"; wrap.appendChild(lab);
      wns.forEach(function (wn) {
        var row = el("div", "whywrong"); row.style.fontSize = "13px";
        var strong = el("strong"); strong.textContent = wn[0] + (wn[1] ? " (your pick): " : ": "); strong.style.color = wn[1] ? "var(--no)" : "var(--am)";
        row.appendChild(strong);
        row.appendChild(document.createTextNode(wn[2]));
        wrap.appendChild(row);
      });
      f.appendChild(wrap);
    }

    var frow = el("div", "fbrow");
    var nb = el("button", "btn primary", V.at + 1 >= V.queue.length ? "See result \u2192" : "Next \u2192");
    nb.onclick = next; frow.appendChild(nb);
    var hint = el("span", "kbd", "the pattern is: " + q.o[q.a]); frow.appendChild(hint);
    f.appendChild(frow);
    return f;
  }

  function next() {
    V.at++; V.picked = null; V.started = Date.now();
    if (V.at >= V.queue.length) V.screen = "result";
    render();
  }

  /* ---------- result ---------- */
  function result() {
    var w = el("div", "wrap"); w.style.padding = "0"; w.style.maxWidth = "none";
    var seen = 0, right = 0;
    V.queue.forEach(function (id) { var q = Q[id]; if (state.seen[q._i]) seen++; });
    // recompute this run's accuracy from the queue via patok is global; show global instead
    var a = acc();
    var sc = el("div", "score");
    sc.appendChild(el("div", "big " + (a != null && a >= 70 ? "pass" : "fail"), a == null ? "--" : a + "%"));
    sc.appendChild(el("h2", null, "You decoded " + solved() + " of " + Q.length + " cleanly"));
    var wl = wrongList();
    sc.appendChild(el("p", null, wl.length ? ("Still misreading " + wl.length + ". The misses are where the story fooled you \u2014 redo them until the clue jumps out before the flavour does.") : "Every statement decoded correctly at least once. Now do a full mixed pass against the clock \u2014 under " + TARGET + "s each."));
    var row = el("div", "cta"); row.style.justifyContent = "center";
    if (wl.length) { var rb = el("button", "btn primary", "Redo the " + wl.length + " misses"); rb.onclick = function () { startDrill(wl.map(function (q) { return q._i; })); }; row.appendChild(rb); }
    var ab = el("button", "btn", "Full mixed pass"); ab.onclick = function () { startDrill(Q.map(function (q) { return q._i; })); }; row.appendChild(ab);
    var hb = el("button", "btn ghost", "Home"); hb.onclick = function () { V.screen = "home"; render(); }; row.appendChild(hb);
    sc.appendChild(row);
    w.appendChild(sc);
    return w;
  }

  function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function render() {
    var y = window.scrollY;
    app.textContent = "";
    app.appendChild(bar());
    if (V.screen === "home") app.appendChild(home());
    else if (V.screen === "drill") app.appendChild(drill());
    else app.appendChild(result());
    window.scrollTo(0, V.screen === "home" ? y : 0);
  }

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) { if (a) api = a; }).catch(function () {});
  }
})();
</script>
