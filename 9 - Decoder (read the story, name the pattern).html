<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#070B11; --bg2:#0C121B; --panel:#121A26; --panel2:#182231; --edge:#1E2A3A; --edge2:#2A3A4E;
    --txt:#E8EEF6; --dim:#8397AE; --dim2:#5B6E85;
    --cy:#3FD9EC; --cy-dim:#12333D;
    --ok:#4BE08B; --ok-dim:#0E2C1D;
    --no:#FF7A6B; --no-dim:#331612;
    --am:#FFC44D; --am-dim:#332714;
    --vi:#B98CF0; --vi-dim:#241A38;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:4px}
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:14px}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;background:var(--panel);border:1px solid var(--edge);border-radius:10px}
  .logo{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
  .bar .sp{flex:1 1 auto}
  .stat{display:flex;align-items:baseline;gap:5px;font-family:var(--mono)}
  .stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
  .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--am)}

  .btn{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
       background:var(--panel2);border:1px solid var(--edge2);border-radius:7px;padding:9px 14px;cursor:pointer;
       transition:transform .08s ease,background .15s ease,border-color .15s ease}
  .btn:hover:not(:disabled){background:var(--edge);border-color:var(--cy)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--cy);border-color:var(--cy);color:#04222A}
  .btn.primary:hover:not(:disabled){background:#5FE6F5}
  .btn.ghost{background:transparent}

  .hero{padding:24px 20px;background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--edge);border-radius:14px;display:flex;flex-direction:column;gap:13px}
  .hero h1{margin:0;font-family:var(--mono);font-weight:700;font-size:clamp(24px,4.8vw,35px);letter-spacing:-.02em;line-height:1.06}
  .hero h1 em{font-style:normal;color:var(--cy)}
  .hero p{margin:0;color:var(--dim);max-width:66ch;font-size:14.5px}
  .cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}

  .sheet{background:var(--panel);border:1px solid var(--cy);border-radius:12px;overflow:hidden}
  .sheet-h{padding:12px 16px;background:var(--cy-dim);border-bottom:1px solid var(--cy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sheet-h h2{margin:0;font-size:18px}
  .sheet-h .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--cy);border:1px solid var(--cy);border-radius:5px;padding:2px 7px}
  .sec{padding:14px 16px;border-bottom:1px solid var(--edge)}
  .sec:last-child{border-bottom:0}
  .sec .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-bottom:9px}

  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);text-align:left;
     font-weight:500;padding:0 12px 7px 0;border-bottom:1px solid var(--edge2);white-space:nowrap}
  td{padding:7px 12px 7px 0;border-bottom:1px solid var(--edge);vertical-align:top;color:var(--dim)}
  tr:last-child td{border-bottom:0}
  td.n{font-family:var(--mono);color:var(--txt);white-space:nowrap}
  td.o{font-family:var(--mono);color:var(--cy);white-space:nowrap}
  .tscroll{overflow-x:auto}

  .tells{display:flex;flex-direction:column;gap:0}
  .tell{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--edge);align-items:baseline}
  .tell:last-child{border-bottom:0}
  .tell .cue{font-size:13.5px;color:var(--txt)}
  .tell .cue b{color:var(--am);font-weight:600}
  .tell .pat{font-family:var(--mono);font-size:12.5px;color:var(--cy)}

  .crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);flex-wrap:wrap}
  .crumb .now{color:var(--cy)}
  .prog{flex:1 1 90px;height:3px;background:var(--edge);border-radius:2px;overflow:hidden;min-width:70px}
  .prog i{display:block;height:100%;background:var(--cy);transition:width .3s ease}
  .qtimer{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .qtimer.over{color:var(--no)}

  .qbox{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .stmt{font-size:16px;line-height:1.6}
  .cons{font-family:var(--mono);font-size:12.5px;color:var(--am);background:var(--am-dim);border:1px solid var(--am);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
  .cons b{color:var(--am);font-weight:600;display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;margin-bottom:4px}

  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:baseline;text-align:left;
       background:var(--bg2);border:1px solid var(--edge);border-radius:8px;padding:11px 12px;cursor:pointer;
       font-size:14px;transition:border-color .12s ease,background .12s ease}
  .opt:hover:not(:disabled){border-color:var(--cy);background:var(--panel2)}
  .opt .k{font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--edge2);border-radius:4px;text-align:center;padding:1px 0}
  .opt.right{border-color:var(--ok);background:var(--ok-dim)}
  .opt.right .k{color:var(--ok);border-color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--no-dim);animation:shk .3s}
  .opt.wrong .k{color:var(--no);border-color:var(--no)}
  .opt:disabled{cursor:default}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .fb{border-radius:9px;padding:12px 13px;font-size:14px;line-height:1.6;border:1px solid;display:flex;flex-direction:column;gap:8px}
  .fb.good{background:var(--ok-dim);border-color:var(--ok)}
  .fb.bad{background:var(--no-dim);border-color:var(--no)}
  .fb b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .fb.good b{color:var(--ok)} .fb.bad b{color:var(--no)}
  .fb .tellbox{font-size:13.5px;color:var(--txt);background:rgba(0,0,0,.35);border-radius:7px;padding:10px 12px;border-left:3px solid var(--am)}
  .fb .tellbox i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--am);display:block;margin-bottom:4px}
  .fb .cx{font-family:var(--mono);font-size:12.5px;color:var(--cy)}
  .fb .whywrong{color:var(--am)}
  .fbrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .kbd{font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--edge2);border-radius:4px;padding:1px 5px}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--edge);
        border-radius:9px;padding:10px 12px;font-size:13px}
  .prow.weak{border-color:var(--no)}
  .prow.strong{border-color:var(--ok-dim)}
  .prow .c{font-family:var(--mono);font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}

  .score{text-align:center;padding:28px 20px;background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);
         border:1px solid var(--edge);border-radius:14px;display:flex;flex-direction:column;gap:11px;align-items:center}
  .score .big{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
  .score .big.pass{color:var(--ok)} .score .big.fail{color:var(--no)}
  .score h2{margin:0;font-size:19px}
  .score p{margin:0;color:var(--dim);max-width:58ch;font-size:14px}

  .foot{color:var(--dim2);font-size:12.5px;font-family:var(--mono);text-align:center;padding-top:4px}
  .foot a{color:var(--dim)}

  @media(max-width:620px){
    .wrap{padding:14px 11px 80px;gap:12px}
    .hero{padding:19px 15px}
    .opt{padding:13px 11px}
    .tell{grid-template-columns:1fr;gap:3px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

ems/largest-component-size-by-common-factor/","d":"H"},{"n":"Lexicographically Smallest Equivalent String","u":"https://leetcode.com/problems/lexicographically-smallest-equivalent-string/","d":"M"},{"n":"Similar String Groups","u":"https://leetcode.com/problems/similar-string-groups/","d":"H"},{"n":"Swim in Rising Water","u":"https://leetcode.com/problems/swim-in-rising-water/","d":"H"},{"n":"Rank Transform of a Matrix","u":"https://leetcode.com/problems/rank-transform-of-a-matrix/","d":"H"},{"n":"Graph Connectivity With Threshold","u":"https://leetcode.com/problems/graph-connectivity-with-threshold/","d":"H"}],"cf":[{"n":"Find the Different Ones!","u":"https://codeforces.com/problemset/problem/1927/D","d":"E"},{"n":"News Distribution","u":"https://codeforces.com/problemset/problem/1167/C","d":"M"},{"n":"Cyclic Components","u":"https://codeforces.com/problemset/problem/977/E","d":"M"},{"n":"Learning Languages","u":"https://codeforces.com/problemset/problem/277/A","d":"M"},{"n":"K-Complete Word","u":"https://codeforces.com/problemset/problem/1332/C","d":"M"},{"n":"Solve The Maze","u":"https://codeforces.com/problemset/problem/1365/D","d":"H"},{"n":"Round Dance","u":"https://codeforces.com/problemset/problem/1833/E","d":"M"},{"n":"Double Perspective","u":"https://codeforces.com/problemset/problem/2129/A","d":"E"}],"hubs":[{"label":"HackerEarth — Disjoint data structures","u":"https://www.hackerearth.com/practice/data-structures/disjoint-data-strutures/"},{"label":"HackerRank — Data Structures","u":"https://www.hackerrank.com/domains/data-structures"},{"label":"Codeforces — DSU set","u":"https://codeforces.com/problemset?tags=dsu"},{"label":"GeeksforGeeks — Union-Find","u":"https://www.geeksforgeeks.org/tag/union-find/"}]},{"key":"bsa","label":"Binary search on the answer","blurb":"Guessing the answer value, checking feasibility, halving the range","desc":"When the answer is a single number and 'is X achievable?' flips exactly once from yes to no (or no to yes) as X gr "M"}],"cf":[{"n":"Two Buttons","u":"https://codeforces.com/problemset/problem/520/B","d":"M"},{"n":"Kefa and Park","u":"https://codeforces.com/problemset/problem/580/C","d":"M"},{"n":"Mortal Kombat Tower","u":"https://codeforces.com/problemset/problem/1418/C","d":"M"},{"n":"Rumor","u":"https://codeforces.com/problemset/problem/893/C","d":"E"},{"n":"Ball in Berland","u":"https://codeforces.com/problemset/problem/1475/C","d":"M"},{"n":"Maze","u":"https://codeforces.com/problemset/problem/377/A","d":"M"},{"n":"Polygon","u":"https://codeforces.com/problemset/problem/1360/E","d":"E"},{"n":"News Distribution","u":"https://codeforces.com/problemset/problem/1167/C","d":"M"}],"hubs":[{"label":"HackerEarth — Graphs","u":"https://www.hackerearth.com/practice/algorithms/graphs/"},{"label":"HackerRank — Graphs (interview kit)","u":"https://www.hackerrank.com/interview/interview-preparation-kit/graphs/"},{"label":"Codeforces — Graphs set","u":"https://codeforces.com/problemset?tags=graphs"},{"label":"GeeksforGeeks — Graph","u":"https://www.geeksforgeeks.org/tag/graph/"}]}],"q":[{"pat":"dsu","ak":"dsu","st":"A campus social app records a new friendship every time two students connect. After a semester of connections, the dean wants to know how many separate friend circles the campus has broken into.","cn":"students <= 2*10^5, connections <= 2*10^5","core":"Merge pairs as they arrive, then count how many distinct groups remain.","tell":"Friendships arrive incrementally and the question is 'how many separate groups' -- merge each pair, then count the roots.","cx":"O((n+m) alpha(n)), essentially linear.","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":0},{"pat":"dsu","ak":"dsu","st":"A data centre lays network cables between servers one at a time. Before laying each new cable the technician wants to skip it if the two servers can already reach each other through cables laid earlier.","cn":"servers <= 10^5, cables <= 10^5","core":"For each edge, before uniting, ask whether both endpoints already share a root; if so it is redundant.","tell":"'Already reachable through existing links, before adding' = a find query; equal roots means skip the cable.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":1},{"pat":"dsu","ak":"dsu","st":"You start with an empty plot; builders place a square of land at given grid coordinates one by one. After each placement, report how many separate connected land masses currently exist.","cn":"grid up to 10^4 x 10^4, placements <= 10^4","core":"On each new cell, union it with already-present orthogonal neighbours and keep a running component count.","tell":"Cells appear over time and you must report the island count after each -- union with up to 4 neighbours, adjust a running counter.","cx":"O(k alpha(k)) over k placements.","o":["Graph: BFS / Dijkstra","Dynamic programming","Union-Find (DSU)","Greedy"],"a":2},{"pat":"dsu","ak":"dsu","st":"A support desk holds thousands of customer records. Two records belong to the same person if they share any email address. Group every record that belongs to the same person.","cn":"records <= 10^4, emails <= 10^5","core":"Union records that share an email, then read off each group by its root.","tell":"'Same person if they share ANY email' is a transitive merge -- union records on a shared attribute, then collect groups.","cx":"O(n alpha(n)) after mapping emails to nodes.","o":["Graph: BFS / Dijkstra","Dynamic programming","Greedy","Union-Find (DSU)"],"a":3},{"pat":"dsu","ak":"dsu","st":"You are handed a pile of statements like a==b and c!=d about variables. Decide whether every statement can hold at the same time.","cn":"statements <= 10^4","core":"Union all the equals first, then check that no 'not-equal' pair shares a root.","tell":"== forces two variables into one group, != forbids it -- union all equalities first, then verify the inequalities.","cx":"O(n alpha(n)).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":0},{"pat":"dsu","ak":"dsu","st":"A kingdom's road map should be a tree connecting all n cities with exactly n-1 roads, but a surveyor added one extra road, creating a single loop. Identify a road whose removal restores the tree.","cn":"n <= 1000","core":"Scan edges; the first edge whose two endpoints already share a root is the one closing the loop.","tell":"The edge whose endpoints are already connected is the cycle-closing edge.","cx":"O(n alpha(n)).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":1},{"pat":"dsu","ak":"dsu","st":"In an online battle game, players form squads by merging. You receive a live stream of two commands: 'merge the squads of X and Y', and 'are X and Y in the same squad?'. Answer each query as it arrives.","cn":"commands <= 2*10^5","core":"Process a stream of union and same-group queries directly.","tell":"Interleaved merge and 'same-group?' queries on a live stream are the textbook union-find workload.","cx":"O(q alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Union-Find (DSU)","Greedy"],"a":2},{"pat":"dsu","ak":"dsu","st":"Field sensors communicate if they are in range, and communication passes along transitively. Given all the in-range links, find the size of the single largest cluster of sensors that can all reach one another.","cn":"sensors <= 10^5, links <= 2*10^5","core":"Union linked sensors while tracking set sizes; return the largest size.","tell":"Transitive links plus 'largest cluster' -- union with a size array, report the max.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Greedy","Union-Find (DSU)"],"a":3},{"pat":"dsu","ak":"dsu","st":"Cities are joined by new highways over the course of a decade. After all highways are built, output simply whether city 1 and city n ended up connected.","cn":"cities <= 10^5, highways <= 10^5","core":"Union every highway, then compare the roots of city 1 and city n.","tell":"Final connectivity between two fixed nodes after many merges -- union everything, compare two roots.","cx":"O(m alpha(n)).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":0},{"pat":"dsu","ak":"dsu","st":"A firm has n offices and some existing cables. You may unplug any cable and reuse it elsewhere. Find the fewest moves to make every office reachable from every other, or report it is impossible.","cn":"offices <= 10^5, cables <= 10^5","core":"Count components c and spare (redundant) cables; if spares >= c-1 the answer is c-1, else impossible.","tell":"Count groups and count redundant edges; you need (components-1) moves if you have that many spares.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":1},{"pat":"dsu","ak":"dsu","st":"Given a string and a list of index pairs you may swap any number of times, return the lexicographically smallest string you can reach.","cn":"length <= 10^5, pairs <= 10^5","core":"Indices in the same swap-group can be freely permuted; union them, then sort characters within each group.","tell":"'Swap any number of times' makes the pairs transitive -- union indices into groups, sort each group's letters.","cx":"O(n log n) for the per-group sort.","o":["Graph: BFS / Dijkstra","Dynamic programming","Union-Find (DSU)","Greedy"],"a":2},{"pat":"dsu","ak":"dsu","st":"Fraud investigators link two bank accounts whenever they transact directly; a fraud ring is any maximal set of linked accounts. Report how many rings contain at least three accounts.","cn":"accounts <= 10^5, links <= 2*10^5","core":"Union linked accounts, then count groups whose size is >= 3.","tell":"Maximal linked sets are connected components; filter by group size.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Greedy","Union-Find (DSU)"],"a":3},{"pat":"dsu","ak":"dsu","st":"A binary matrix marks which pairs of n researchers have co-authored. A research group is any set connected directly or indirectly through co-authorship. How many groups are there?","cn":"n <= 200","core":"Count connected components in the relation (union each authored pair, count roots).","tell":"'Connected directly or indirectly' means connected components. (A DFS also works; union-find shines once links stream in or queries interleave.)","cx":"O(n^2 alpha(n)) over the matrix.","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":0},{"pat":"dsu","ak":"dsu","st":"Kingdoms sign alliances through the year, and alliances are transitive. At year's end the king asks a single question: is my kingdom allied, directly or through a chain, with the rival kingdom?","cn":"kingdoms <= 10^5, alliances <= 10^5","core":"Union all alliances, then run one find comparing the two kingdoms.","tell":"Transitive alliances plus a final 'same group?' query -- union all, compare roots.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":1},{"pat":"dsu","ak":"dsu","st":"Files are linked whenever they share a content fingerprint, and linked files are duplicates of one another. After collapsing each duplicate group to a single copy, how many distinct files remain?","cn":"files <= 10^5, links <= 2*10^5","core":"Union linked files; the number of distinct files is the number of roots.","tell":"Collapsing linked groups to one representative each = counting the roots.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Union-Find (DSU)","Greedy"],"a":2},{"pat":"dsu","ak":"dsu","st":"A maze starts completely walled. You knock down the wall between two adjacent cells one at a time. After each knockdown, report how many separate open regions currently exist (a still fully-walled cell counts as its own region).","cn":"cells <= 10^5, knockdowns <= 10^5","core":"Start with every cell its own region; each knockdown unions two cells and decrements the count only if they were in different regions.","tell":"Removing a wall merges two adjacent cells -- the region count drops only when two DIFFERENT groups join.","cx":"O(k alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Greedy","Union-Find (DSU)"],"a":3},{"pat":"dsu","ak":"dsu","st":"A conglomerate acquires companies over years; each acquisition fuses two companies into one entity. After all acquisitions, report how many distinct entities remain and the size of the largest.","cn":"companies <= 10^5, acquisitions <= 10^5","core":"Union each acquisition with size tracking; report the number of roots and the max size.","tell":"Repeated fusing of two groups into one, with a final count and max size = union-find with a size array.","cx":"O(m alpha(n)).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":0},{"pat":"dsu","ak":"dsu","st":"A CRM treats two leads as the same person if they share a phone number OR an email. Merge accordingly and count how many unique people the CRM really has.","cn":"leads <= 10^5","core":"Map each phone and each email to a node, union a lead with its identifiers, count person-groups.","tell":"'Same if they share ANY identifier' -- union on shared attributes of two different kinds; then count groups.","cx":"O(n alpha(n)).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":1},{"pat":"dsu","ak":"dsu","st":"You get offline queries of the form (a, b, limit): is there a route from a to b using only roads shorter than 'limit'? All roads and queries are given up front.","cn":"roads <= 10^5, queries <= 10^5","core":"Sort edges and queries by threshold; add edges as the threshold grows and answer each query with a find.","tell":"Offline queries plus 'using only edges under a threshold' = sort both, add edges as the bound rises, union-find answers connectivity.","cx":"O((m+q) log(m+q)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Union-Find (DSU)","Greedy"],"a":2},{"pat":"dsu","ak":"dsu","st":"In a gossip network, a message passed between two already-connected nodes is wasted bandwidth. Given every gossip link in order, count how many links were wasted.","cn":"nodes <= 10^5, links <= 2*10^5","core":"A link is wasted exactly when its two endpoints already share a root before uniting.","tell":"'Wasted link' = union reports the two are already in the same set.","cx":"O(m alpha(n)).","o":["Graph: BFS / Dijkstra","Dynamic programming","Greedy","Union-Find (DSU)"],"a":3},{"pat":"bsa","ak":"bsa","st":"A zookeeper must finish every banana pile before the vet arrives in H hours. Each hour she picks one pile and eats up to a chosen speed; a partly-eaten pile waits for the next hour. Find the slowest eating speed that still finishes in time.","cn":"piles <= 10^4, pile size <= 10^9, H <= 10^9","core":"Minimum speed s such that total hours needed <= H; hours(s) is monotone decreasing in s.","tell":"'Slowest speed that still finishes in time' -- feasibility is monotone in speed, so binary-search the speed and greedily count hours.","cx":"O(n log(maxPile)).","o":["Binary search on the answer","Greedy","Dynamic programming","Two pointers"],"a":0},{"pat":"bsa","ak":"bsa","st":"A conveyor loads packages onto a ship in their given order, one shipment per day. Given exactly D days, find the smallest ship capacity that ships everything within D days without reordering.","cn":"n <= 5*10^4, weight <= 500, 1 <= D <= n","core":"Minimum capacity c such that days(c) <= D; days needed drops as capacity rises.","tell":"Minimum capacity that fits within D days, order fixed -- binary-search the capacity, greedily count days.","cx":"O(n log(sum)).","o":["Greedy","Binary search on the answer","Dynamic programming","Two pointers"],"a":1},{"pat":"bsa","ak":"bsa","st":"Split an array into K contiguous parts so that the largest part-sum is as small as possible. Return that smallest possible largest sum.","cn":"n <= 1000, K <= n","core":"Smallest value X such that the array can be cut into <= K parts each with sum <= X.","tell":"'Minimise the largest' with a fixed number of contiguous groups -- binary-search the answer (the max allowed sum), greedily count parts.","cx":"O(n log(sum)).","o":["Greedy","Dynamic programming","Binary search on the answer","Two pointers"],"a":2},{"pat":"bsa","ak":"bsa","st":"A florist needs M bouquets, each made of K adjacent flowers that have all bloomed. Flower i blooms on day bloom[i]. Find the earliest day on which all M bouquets can be made.","cn":"n <= 10^5, bloom day <= 10^9","core":"Minimum day d such that the bloomed flowers on day d contain >= M runs of K adjacent; feasibility is monotone in d.","tell":"Earliest day such that enough adjacent-bloomed runs exist -- the day is monotone, binary-search it.","cx":"O(n log(maxDay)).","o":["Greedy","Dynamic programming","Two pointers","Binary search on the answer"],"a":3},{"pat":"bsa","ak":"bsa","st":"Pick a single divisor d and compute the cost as the sum over the array of ceil(a_i / d). Find the smallest d whose cost does not exceed a given threshold.","cn":"n <= 5*10^4, threshold given","core":"Smallest d such that sum(ceil(a_i/d)) <= threshold; cost falls as d grows.","tell":"The cost decreases monotonically as the divisor grows -- binary-search the divisor.","cx":"O(n log(maxA)).","o":["Binary search on the answer","Greedy","Dynamic programming","Two pointers"],"a":0},{"pat":"bsa","ak":"bsa","st":"Place M balls into given basket positions on a line so that the minimum spacing between any two balls is as large as possible. Return that largest achievable minimum spacing.","cn":"positions <= 10^5, M <= positions","core":"Largest gap g such that M balls can be placed pairwise at least g apart; feasibility is monotone in g.","tell":"'Maximise the minimum distance' -- binary-search the gap, greedily place balls left to right.","cx":"O(n log(range)) after sorting.","o":["Greedy","Binary search on the answer","Dynamic programming","Two pointers"],"a":1},{"pat":"bsa","ak":"bsa","st":"Add K new petrol stations anywhere along a highway between the existing ones to make the largest gap between adjacent stations as small as possible. Return that smallest possible largest gap.","cn":"existing <= 2000, K <= 10^6","core":"Smallest gap g such that the number of stations needed to keep every gap <= g is <= K.","tell":"'Minimise the largest gap by adding K points' -- binary-search the gap (real-valued), count stations needed.","cx":"O(n log(1/eps)).","o":["Greedy","Dynamic programming","Binary search on the answer","Two pointers"],"a":2},{"pat":"bsa","ak":"bsa","st":"You have piles of sweets; you may split a pile into smaller piles but never merge two. Give K children equal-size sub-piles that are as large as possible (leftovers discarded). Find the largest sub-pile size.","cn":"piles <= 10^5, size <= 10^7, K <= 10^9","core":"Largest size x such that the total number of pieces of size x you can carve is >= K.","tell":"'Largest size such that you can carve >= K equal pieces' -- monotone in size, binary-search it.","cx":"O(n log(maxSize)).","o":["Greedy","Dynamic programming","Two pointers","Binary search on the answer"],"a":3},{"pat":"bsa","ak":"bsa","st":"Distribute product quantities to stores; each store stocks one product type, and you may split a product across several stores. Minimise the maximum quantity any single store must stock.","cn":"products <= 10^5, stores given","core":"Smallest X such that sum over products of ceil(q_i / X) <= number of stores.","tell":"Minimise the busiest store's load -- binary-search the max load X, check total stores needed.","cx":"O(m log(maxQ)).","o":["Binary search on the answer","Greedy","Dynamic programming","Two pointers"],"a":0},{"pat":"bsa","ak":"bsa","st":"A fleet of buses runs in parallel; bus i takes t_i minutes per round trip. Find the least total time for the fleet to complete at least 'totalTrips' trips combined.","cn":"totalTrips <= 10^7, t_i <= 10^7","core":"Smallest time T such that sum over buses of floor(T / t_i) >= totalTrips.","tell":"Trips completed grows monotonically with time -- binary-search the time.","cx":"O(n log(maxT)).","o":["Greedy","Binary search on the answer","Dynamic programming","Two pointers"],"a":1},{"pat":"bsa","ak":"bsa","st":"A commuter rides several trains in sequence; each leg except the last takes ceil(distance / speed) hours (the last takes the exact fractional time). Find the minimum integer speed to arrive within a given deadline.","cn":"legs <= 10^5, deadline may be fractional","core":"Smallest speed v such that total travel time at speed v <= deadline; time drops as speed rises.","tell":"Arrival time decreases as speed increases -- binary-search the speed.","cx":"O(n log(maxSpeed)).","o":["Greedy","Dynamic programming","Binary search on the answer","Two pointers"],"a":2},{"pat":"bsa","ak":"bsa","st":"In an m x n multiplication table (entry at row i, column j is i*j), find the k-th smallest value without ever building the table.","cn":"m, n <= 3*10^4","core":"Binary-search a value v; count how many table entries are <= v; adjust until the count hits k.","tell":"'k-th smallest' when you cannot materialise the data -- binary-search the value, count entries <= it.","cx":"O(m log(mn)).","o":["Greedy","Dynamic programming","Two pointers","Binary search on the answer"],"a":3},{"pat":"bsa","ak":"bsa","st":"Given an array, find the k-th smallest absolute difference among all pairs of elements.","cn":"n <= 10^4, k <= n(n-1)/2","core":"Binary-search a distance d; count pairs with difference <= d using two pointers on the sorted array.","tell":"'k-th smallest distance' -- binary-search the distance, count pairs <= it with a two-pointer sweep.","cx":"O(n log n + n log(range)).","o":["Binary search on the answer","Greedy","Dynamic programming","Two pointers"],"a":0},{"pat":"bsa","ak":"bsa","st":"You may split any bag of balls into two non-empty bags, any number of times, up to a budget of maxOps splits. Minimise the size of the largest remaining bag.","cn":"bags <= 10^5, maxOps <= 10^9","core":"Smallest penalty p such that the total splits needed to make every bag <= p is <= maxOps.","tell":"Minimise the biggest bag under a split budget -- binary-search the max size, count splits.","cx":"O(n log(maxBall)).","o":["Greedy","Binary search on the answer","Dynamic programming","Two pointers"],"a":1},{"pat":"bsa","ak":"bsa","st":"Build an array of n positive integers where neighbours differ by at most 1, the total sum is at most maxSum, and the value at a chosen index is as large as possible. Return that largest value.","cn":"n <= 10^9, maxSum <= 10^9","core":"Binary-search the peak value; for each candidate compute the minimal sum of the tent shape around the index.","tell":"Maximise a peak under a sum budget -- binary-search the peak, compute the minimum sum it forces.","cx":"O(log(maxSum)).","o":["Greedy","Dynamic programming","Binary search on the answer","Two pointers"],"a":2},{"pat":"bsa","ak":"bsa","st":"Form p disjoint pairs from an array so that the largest difference within any chosen pair is as small as possible. Return that smallest possible largest difference.","cn":"n <= 10^5, p <= n/2","core":"Smallest gap g such that you can greedily form p pairs of sorted neighbours each within g.","tell":"'Minimise the largest pair gap' with a fixed pair count -- binary-search the gap, greedily pair sorted adjacents.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Two pointers","Binary search on the answer"],"a":3},{"pat":"bsa","ak":"bsa","st":"A thief wants to rob exactly k houses, and no two robbed houses may be adjacent. The 'risk' of a plan is the largest amount taken from any single robbed house. Minimise the risk.","cn":"n <= 10^5, k <= (n+1)/2","core":"Smallest cap c such that at least k non-adjacent houses have value <= c can be chosen greedily.","tell":"Minimise the maximum picked, k items with an adjacency rule -- binary-search the cap, greedily count feasible houses.","cx":"O(n log(maxVal)).","o":["Binary search on the answer","Greedy","Dynamic programming","Two pointers"],"a":0},{"pat":"bsa","ak":"bsa","st":"Mechanics repair cars in parallel; mechanic with rank r takes r*k^2 minutes to repair k cars. Find the minimum time to repair all the cars.","cn":"cars <= 10^6, ranks <= 100","core":"Smallest time T such that the total cars repairable by all mechanics within T is >= cars.","tell":"Cars repaired grows with time -- binary-search the time, sum each mechanic's capacity.","cx":"O(n log(maxT)).","o":["Greedy","Binary search on the answer","Dynamic programming","Two pointers"],"a":1},{"pat":"bsa","ak":"bsa","st":"Given a string, a target subsequence, and a fixed order in which characters will be removed, find the greatest number of leading removals you can apply while the target is still a subsequence of what's left.","cn":"n <= 10^5","core":"Largest k such that after removing the first k marked characters, the target is still a subsequence; feasibility is monotone in k.","tell":"'Largest k such that a property still holds after k removals' -- monotone, binary-search k, check subsequence.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Binary search on the answer","Two pointers"],"a":2},{"pat":"bsa","ak":"bsa","st":"On a grid of heights, the effort of a path is the largest absolute height change between any two consecutive cells on it. Find the minimum possible effort of a path from the top-left to the bottom-right.","cn":"grid <= 100 x 100","core":"Binary-search the effort e; check reachability using only steps whose height change is <= e.","tell":"'Minimise the maximum step' on a grid -- binary-search the effort, then BFS using only cheap-enough edges. (A max-edge Dijkstra also solves it.)","cx":"O(nm log(maxH)).","o":["Greedy","Dynamic programming","Two pointers","Binary search on the answer"],"a":3},{"pat":"greedy","ak":"greedy","st":"A token starts on the first cell of a row; the number on each cell is the maximum number of cells it may hop forward from there. Decide whether the token can reach the last cell.","cn":"n <= 10^4","core":"Track the farthest index reachable so far in one pass; if your position ever exceeds it, you are stuck.","tell":"Keep the farthest reachable index; if an index passes it you fail -- one greedy pass, no DP needed.","cx":"O(n).","o":["Greedy","Dynamic programming","Heap / priority queue","Binary search on the answer"],"a":0},{"pat":"greedy","ak":"greedy","st":"Same row of hop-values, but now find the minimum number of hops needed to reach the last cell, assuming it is reachable.","cn":"n <= 10^4","core":"Sweep the current hop's reachable range; when you exhaust it, spend one hop and extend to the new farthest.","tell":"Extend the current jump's range; spend a hop only when you run off its end -- a BFS-like greedy in O(n).","cx":"O(n).","o":["Dynamic programming","Greedy","Heap / priority queue","Binary search on the answer"],"a":1},{"pat":"greedy","ak":"greedy","st":"n petrol stations sit on a circular route; station i gives gas[i] litres and it costs cost[i] litres to drive to the next. Starting with an empty tank, find a station to begin from that lets you complete the loop, or report none exists.","cn":"n <= 10^5","core":"If total gas >= total cost a start exists; it is the station right after the point of lowest running tank.","tell":"One pass tracking a running tank; reset the start whenever it dips below zero -- greedy, O(n).","cx":"O(n).","o":["Dynamic programming","Heap / priority queue","Greedy","Binary search on the answer"],"a":2},{"pat":"greedy","ak":"greedy","st":"A string must be cut into as many pieces as possible so that no letter appears in more than one piece. Return the sizes of the pieces in order.","cn":"length <= 500","core":"Extend the current piece to the last occurrence of any letter seen inside it; cut when you reach that boundary.","tell":"Extend the piece to the farthest last-occurrence of its letters, then cut -- a greedy sweep.","cx":"O(n).","o":["Dynamic programming","Heap / priority queue","Binary search on the answer","Greedy"],"a":3},{"pat":"greedy","ak":"greedy","st":"Given a set of intervals, remove the fewest of them so that none of the remaining intervals overlap. Return how many you removed.","cn":"n <= 10^5","core":"Sort by end time; keep each interval that starts at or after the last kept end, drop the rest.","tell":"Sort by finish time and always keep the one that ends earliest -- classic activity selection.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Heap / priority queue","Binary search on the answer"],"a":0},{"pat":"greedy","ak":"greedy","st":"Balloons are laid on a wall, each spanning a horizontal range [start, end]. A single arrow shot straight up at position p bursts every balloon whose range covers p. Find the minimum arrows to burst them all.","cn":"n <= 10^5","core":"Sort by end; shoot at the current end, skip all balloons that overlap it, then shoot again.","tell":"Sort by end, fire at each end, skip everything it already covers -- greedy interval cover.","cx":"O(n log n).","o":["Dynamic programming","Greedy","Heap / priority queue","Binary search on the answer"],"a":1},{"pat":"greedy","ak":"greedy","st":"Children stand in a line, each with a rating. Every child needs at least one candy, and any child rated higher than a neighbour must get more candies than that neighbour. Find the minimum total candies.","cn":"n <= 2*10^4","core":"One left-to-right pass for rising sequences, one right-to-left pass for falling, take the max at each child.","tell":"Two sweeps -- left-to-right for increases, right-to-left for decreases -- then combine; a greedy, not DP.","cx":"O(n).","o":["Dynamic programming","Heap / priority queue","Greedy","Binary search on the answer"],"a":2},{"pat":"greedy","ak":"greedy","st":"Each rescue boat carries at most two people and a total weight of at most 'limit'. Given everyone's weight, find the minimum number of boats to carry them all.","cn":"people <= 5*10^4","core":"Sort weights; pair the lightest remaining with the heaviest remaining when they fit, else the heaviest goes alone.","tell":"Sort, then two pointers pairing lightest with heaviest -- greedy pairing.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Binary search on the answer","Greedy"],"a":3},{"pat":"greedy","ak":"greedy","st":"You must send 2n job candidates for interviews, exactly n to city A and n to city B, and each candidate has a known travel cost to each city. Minimise the total travel cost.","cn":"2n <= 100","core":"Sort candidates by (costA - costB); send the n with the most negative difference to A, the rest to B.","tell":"Rank by how much cheaper A is than B; send the top half to A -- a greedy exchange argument.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Heap / priority queue","Binary search on the answer"],"a":0},{"pat":"greedy","ak":"greedy","st":"Boxes come in types, each type with a count and a units-per-box value. A truck holds a fixed number of boxes. Load boxes to maximise the total units carried.","cn":"types <= 1000","core":"Sort types by units-per-box descending and fill the truck from the top.","tell":"Load the highest-unit boxes first until the truck is full -- greedy after a sort.","cx":"O(n log n).","o":["Dynamic programming","Greedy","Heap / priority queue","Binary search on the answer"],"a":1},{"pat":"greedy","ak":"greedy","st":"Customers arrive one by one at a lemonade stand where each cup costs 5. They pay with a 5, 10, or 20 bill and you start with no change. Decide whether you can give every customer correct change in order.","cn":"customers <= 10^5","core":"Give change greedily, preferring to break a 20 with a 10+5 before spending three 5s.","tell":"Always hand back the largest useful bill first (a 20 as 10+5 before three 5s) -- greedy change-making.","cx":"O(n).","o":["Dynamic programming","Heap / priority queue","Greedy","Binary search on the answer"],"a":2},{"pat":"greedy","ak":"greedy","st":"Monsters approach your base from various distances at various constant speeds. You fire once per minute, killing one monster; if any monster reaches the base you lose. Maximise the number of monsters you kill first.","cn":"monsters <= 10^5","core":"Compute each monster's arrival minute, sort ascending, and kill in that order until one would arrive on time.","tell":"Sort by arrival time and kill the soonest-arriving first -- greedy on deadlines.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Binary search on the answer","Greedy"],"a":3},{"pat":"greedy","ak":"greedy","st":"Each event occupies a range of days [start, end]; you can attend one event per day, on any single day within its range. Maximise the number of events you attend.","cn":"events <= 10^5","core":"Go day by day; among events available that day, attend the one that ends soonest (a min-heap of end days).","tell":"Each day attend the available event ending soonest -- a greedy that leans on a heap.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Heap / priority queue","Binary search on the answer"],"a":0},{"pat":"greedy","ak":"greedy","st":"You hold a hand of cards with integer values and want to rearrange them against an opponent's fixed cards to win as many head-to-head comparisons as possible (your card strictly greater wins the position).","cn":"n <= 10^5","core":"Sort both; for each opponent card use your smallest card that still beats it, otherwise discard your smallest.","tell":"Sort both, spend the weakest card that still wins, else sacrifice your weakest -- greedy.","cx":"O(n log n).","o":["Dynamic programming","Greedy","Heap / priority queue","Binary search on the answer"],"a":1},{"pat":"greedy","ak":"greedy","st":"You are given a multiset of card numbers and a group size k. Decide whether the cards can be arranged entirely into groups of k consecutive numbers.","cn":"n <= 10^4","core":"Repeatedly start a run at the smallest remaining card and consume k consecutive; fail if any is missing.","tell":"Always start the next straight at the smallest leftover card -- greedy consumption.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Greedy","Binary search on the answer"],"a":2},{"pat":"greedy","ak":"greedy","st":"Each child has a greed factor and each cookie has a size; a cookie satisfies a child only if its size is at least the child's greed. Assign cookies to maximise the number of satisfied children.","cn":"children, cookies <= 10^4","core":"Sort both ascending; give each child the smallest cookie that still satisfies them.","tell":"Sort both, hand each child the smallest sufficient cookie -- greedy matching.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Binary search on the answer","Greedy"],"a":3},{"pat":"greedy","ak":"greedy","st":"A shuttle with a fixed passenger capacity drives a straight route. Given trips as (numPassengers, boardStop, alightStop), decide whether the shuttle never exceeds capacity at any point.","cn":"trips <= 1000, stops <= 1000","core":"Add passengers at board stops and subtract at alight stops along the route; check the running total never exceeds capacity.","tell":"Sort events by location, +on board and -on alight, verify the running load stays within capacity -- a greedy sweep.","cx":"O(n log n).","o":["Greedy","Dynamic programming","Heap / priority queue","Binary search on the answer"],"a":0},{"pat":"greedy","ak":"greedy","st":"Chips sit at integer positions on a line. Moving a chip by 2 positions is free, moving it by 1 costs 1. Find the minimum cost to gather every chip onto a single position.","cn":"chips <= 100","core":"Count chips on odd vs even positions; the answer is the smaller of the two counts.","tell":"Only parity matters -- moving by 2 is free -- so the cost is min(oddCount, evenCount).","cx":"O(n).","o":["Dynamic programming","Greedy","Heap / priority queue","Binary search on the answer"],"a":1},{"pat":"greedy","ak":"greedy","st":"A crew wants to attend as many concerts as possible. Each concert is a fixed time slot, and no two attended concerts may overlap. Maximise the number attended.","cn":"concerts <= 10^5","core":"Sort by finish time and greedily take each concert that starts after the last one taken ends.","tell":"Sort by end time, take the earliest-finishing compatible slot each time -- activity selection.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Greedy","Binary search on the answer"],"a":2},{"pat":"greedy","ak":"greedy","st":"A printer processes documents from a queue but you may reorder them freely. Each document has a print time; minimise the total time documents spend waiting (each document's wait is everything printed before it plus its own time), summed over all.","cn":"documents <= 10^5","core":"Sort documents by print time ascending (shortest job first).","tell":"Minimising total waiting time = shortest-job-first -- sort ascending, a provable greedy.","cx":"O(n log n).","o":["Dynamic programming","Heap / priority queue","Binary search on the answer","Greedy"],"a":3},{"pat":"dp","ak":"dp","st":"You climb a staircase of n steps, taking either 1 or 2 steps at a time. Count the number of distinct ways to reach the top.","cn":"n <= 45","core":"ways(n) = ways(n-1) + ways(n-2), built from the base cases.","tell":"ways(n) = ways(n-1) + ways(n-2) -- overlapping subproblems, so memoise instead of recursing blindly.","cx":"O(n) time, O(1) space.","o":["Dynamic programming","Greedy","Backtracking","Binary search on the answer"],"a":0},{"pat":"dp","ak":"dp","st":"Houses in a row hold cash amounts, but robbing two adjacent houses trips a shared alarm. Find the maximum cash you can rob.","cn":"n <= 100","core":"dp[i] = max(dp[i-1], dp[i-2] + cash[i]).","tell":"'Cannot take two adjacent, maximise the total' -- the take-or-skip recurrence; greedy fails here.","cx":"O(n).","o":["Greedy","Dynamic programming","Backtracking","Binary search on the answer"],"a":1},{"pat":"dp","ak":"dp","st":"Same houses, same alarm rule, except the street is a circle: the first and last houses are neighbours. Find the maximum cash.","cn":"n <= 100","core":"Run the linear robber twice -- once excluding the first house, once excluding the last -- and take the better.","tell":"Circular adjacency -- solve the line twice, dropping either the first or the last house, then max.","cx":"O(n).","o":["Greedy","Backtracking","Dynamic programming","Binary search on the answer"],"a":2},{"pat":"dp","ak":"dp","st":"Given coin denominations in unlimited supply and a target amount, find the fewest coins that sum exactly to the amount, or report it is impossible.","cn":"amount <= 10^4, coins <= 12","core":"dp[a] = 1 + min over coins c of dp[a - c].","tell":"'Fewest coins to hit a target, unlimited supply' -- unbounded-knapsack DP; picking the largest coin greedily can fail.","cx":"O(amount * coins).","o":["Greedy","Backtracking","Binary search on the answer","Dynamic programming"],"a":3},{"pat":"dp","ak":"dp","st":"Given coin denominations in unlimited supply and a target amount, count the number of distinct combinations that sum to the amount (order does not matter).","cn":"amount <= 5000, coins <= 300","core":"dp[a] += dp[a - c] with the coin loop on the OUTSIDE so combinations are not double-counted.","tell":"Counting combinations, not sequences -- loop coins outside, amounts inside, so order is ignored.","cx":"O(amount * coins).","o":["Dynamic programming","Greedy","Backtracking","Binary search on the answer"],"a":0},{"pat":"dp","ak":"dp","st":"Decide whether an array of positive integers can be split into two subsets whose sums are equal.","cn":"n <= 200, sum <= 2*10^4","core":"Ask whether some subset sums to total/2 -- a boolean subset-sum DP.","tell":"'Reach exactly half the total by picking a subset' -- 0/1 knapsack on a boolean table.","cx":"O(n * sum).","o":["Greedy","Dynamic programming","Backtracking","Binary search on the answer"],"a":1},{"pat":"dp","ak":"dp","st":"Find the length of the longest strictly increasing subsequence of an array (the elements need not be contiguous).","cn":"n <= 2500 (or 10^5 for the fast version)","core":"dp[i] = 1 + max dp[j] over j<i with a[j]<a[i]; or maintain a 'tails' array with binary search.","tell":"'Longest increasing subsequence' -- O(n^2) DP, or O(n log n) with a tails array. A window will not work because elements are not contiguous.","cx":"O(n^2) or O(n log n).","o":["Greedy","Backtracking","Dynamic programming","Binary search on the answer"],"a":2},{"pat":"dp","ak":"dp","st":"Given two strings, find the length of their longest common subsequence -- the longest sequence of characters appearing in both in the same relative order.","cn":"lengths <= 1000","core":"dp[i][j]: if characters match, diagonal + 1, else max of the cell above and to the left.","tell":"Two sequences compared for a shared order -- the 2-D grid DP: match means diagonal+1.","cx":"O(nm).","o":["Greedy","Backtracking","Binary search on the answer","Dynamic programming"],"a":3},{"pat":"dp","ak":"dp","st":"Find the minimum number of single-character insertions, deletions, or replacements needed to turn one word into another.","cn":"lengths <= 500","core":"dp[i][j] over prefixes: match costs 0 and takes the diagonal, else 1 + min(insert, delete, replace).","tell":"Transforming one string into another with unit edits -- the edit-distance grid DP.","cx":"O(nm).","o":["Dynamic programming","Greedy","Backtracking","Binary search on the answer"],"a":0},{"pat":"dp","ak":"dp","st":"A robot on an m x n grid starts at the top-left and may move only right or down. Count the number of distinct paths to the bottom-right corner.","cn":"m, n <= 100","core":"paths[i][j] = paths[i-1][j] + paths[i][j-1].","tell":"Counting monotone grid paths -- each cell is the sum of the cell above and the cell to its left.","cx":"O(mn).","o":["Greedy","Dynamic programming","Backtracking","Binary search on the answer"],"a":1},{"pat":"dp","ak":"dp","st":"Each cell of a grid holds a cost. Starting top-left and moving only right or down to the bottom-right, minimise the total cost of visited cells.","cn":"grid <= 200 x 200","core":"dp[i][j] = cell + min(dp[i-1][j], dp[i][j-1]).","tell":"Minimum-cost monotone grid path -- dp[i][j] = cell + min(up, left). Greedy per-step choice is not safe.","cx":"O(mn).","o":["Greedy","Backtracking","Dynamic programming","Binary search on the answer"],"a":2},{"pat":"dp","ak":"dp","st":"Given a string and a dictionary of words, decide whether the string can be segmented into a sequence of one or more dictionary words.","cn":"length <= 300, dict <= 1000","core":"dp[i] is true if some j<i has dp[j] true and s[j..i) is a dictionary word.","tell":"'Can this be cut into valid pieces' -- dp[i] true when a valid earlier cut plus a dictionary word reaches i.","cx":"O(n^2) (times word check).","o":["Greedy","Backtracking","Binary search on the answer","Dynamic programming"],"a":3},{"pat":"dp","ak":"dp","st":"A message is a string of digits where 1..26 map to A..Z. Count how many ways the digit string can be decoded into letters.","cn":"length <= 100","core":"dp[i] gathers dp[i-1] when the single digit is valid and dp[i-2] when the two-digit number is 10..26.","tell":"Counting decodings -- a Fibonacci-shaped DP gated by which one- and two-digit steps are valid.","cx":"O(n).","o":["Dynamic programming","Greedy","Backtracking","Binary search on the answer"],"a":0},{"pat":"dp","ak":"dp","st":"Find the contiguous subarray with the largest sum, and return that sum.","cn":"n <= 10^5, values may be negative","core":"best-ending-here = max(prev + x, x); track the global maximum.","tell":"Largest-sum contiguous run -- a one-line DP (Kadane). The negatives are why a plain running sum is not enough.","cx":"O(n).","o":["Greedy","Dynamic programming","Backtracking","Binary search on the answer"],"a":1},{"pat":"dp","ak":"dp","st":"You may buy and sell one share of a stock any number of times to maximise profit, but after you sell you must rest for exactly one day before buying again.","cn":"days <= 5000","core":"DP over three states per day -- holding, just-sold, idle -- transitioning between them.","tell":"The cooldown rule makes it a state machine over days (holding / just-sold / idle) -- DP over states.","cx":"O(n).","o":["Greedy","Backtracking","Dynamic programming","Binary search on the answer"],"a":2},{"pat":"dp","ak":"dp","st":"Assign a + or - sign to each number in an array so the signed total equals a given target. Count how many sign assignments achieve it.","cn":"n <= 20, sum <= 1000","core":"Rearrange to a subset-sum: find subsets summing to (target + total)/2, then count them with DP.","tell":"+/- sign assignments to hit a target -- algebra turns it into a subset-sum COUNT, which is DP.","cx":"O(n * sum).","o":["Greedy","Backtracking","Binary search on the answer","Dynamic programming"],"a":3},{"pat":"dp","ak":"dp","st":"Given numbers and a target, count the number of ORDERED sequences (reuse allowed) that sum to the target -- so 1+2 and 2+1 count separately.","cn":"target <= 1000","core":"dp[t] += dp[t - num] with the TARGET loop on the outside so order is preserved.","tell":"Order matters -- loop the target outside and numbers inside, the mirror image of the coin-combination DP.","cx":"O(target * nums).","o":["Dynamic programming","Greedy","Backtracking","Binary search on the answer"],"a":0},{"pat":"dp","ak":"dp","st":"Find the fewest perfect squares (1, 4, 9, 16, ...) that sum to a given number n.","cn":"n <= 10^4","core":"dp[i] = 1 + min over squares s<=i of dp[i - s].","tell":"'Fewest items from a fixed set summing to n' -- coin-change-style DP with the squares as the coins.","cx":"O(n sqrt(n)).","o":["Greedy","Dynamic programming","Backtracking","Binary search on the answer"],"a":1},{"pat":"dp","ak":"dp","st":"In a binary matrix, find the area of the largest square consisting entirely of 1s.","cn":"grid <= 300 x 300","core":"dp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) when the cell is 1; track the max.","tell":"Largest all-1 square -- each cell is 1 + the min of its three neighbours, a 2-D DP.","cx":"O(mn).","o":["Greedy","Backtracking","Dynamic programming","Binary search on the answer"],"a":2},{"pat":"dp","ak":"dp","st":"Return the longest substring of a string that reads the same forwards and backwards.","cn":"length <= 1000","core":"Expand around each of the 2n-1 centres, or fill an interval DP over i..j.","tell":"Longest palindromic substring -- expand around each centre, or an interval DP on i..j.","cx":"O(n^2).","o":["Greedy","Backtracking","Binary search on the answer","Dynamic programming"],"a":3},{"pat":"win","ak":"win","st":"Find the length of the longest substring of a string that contains no repeated character.","cn":"length <= 5*10^4","core":"Grow a window to the right; when a character repeats, shrink from the left until it is unique again.","tell":"'Longest contiguous stretch with a property' plus distinctness -- expand right, shrink left on a repeat.","cx":"O(n).","o":["Sliding window","Two pointers","Prefix sum","Heap / priority queue"],"a":0},{"pat":"win","ak":"win","st":"Given strings s and t, find the smallest substring of s that contains every character of t including multiplicities, or empty if none exists.","cn":"lengths <= 10^5","core":"Expand right until the window covers all required counts, then shrink from the left to minimise it.","tell":"Smallest contiguous stretch covering a requirement -- grow to satisfy, shrink to minimise.","cx":"O(n).","o":["Two pointers","Sliding window","Prefix sum","Heap / priority queue"],"a":1},{"pat":"win","ak":"win","st":"You may change at most k characters of a string to any letters. Find the length of the longest substring that can be made all one repeated character.","cn":"length <= 10^5","core":"A window is valid while (window length - count of its most frequent character) <= k.","tell":"The window stays valid while the non-majority characters number at most k -- expand, shrink when that breaks.","cx":"O(n).","o":["Two pointers","Prefix sum","Sliding window","Heap / priority queue"],"a":2},{"pat":"win","ak":"win","st":"Decide whether one string contains any permutation of another as a contiguous substring.","cn":"lengths <= 10^4","core":"Slide a fixed window the size of the pattern and compare character-frequency counts.","tell":"A fixed-length window (the pattern's length) with a matching frequency count.","cx":"O(n).","o":["Two pointers","Prefix sum","Heap / priority queue","Sliding window"],"a":3},{"pat":"win","ak":"win","st":"Return all starting indices in a string s where an anagram of a pattern p begins.","cn":"lengths <= 3*10^4","core":"Slide a fixed window of size len(p); record each position where the counts match p's.","tell":"Fixed window = len(p); slide and compare character counts at each step.","cx":"O(n).","o":["Sliding window","Two pointers","Prefix sum","Heap / priority queue"],"a":0},{"pat":"win","ak":"win","st":"Given a binary array, you may flip at most k zeros to ones. Find the longest run of consecutive ones achievable.","cn":"n <= 10^5","core":"Keep a window containing at most k zeros; expand right, shrink left when zeros exceed k.","tell":"Longest window holding at most k zeros -- expand, and shrink once the zero count passes k.","cx":"O(n).","o":["Two pointers","Sliding window","Prefix sum","Heap / priority queue"],"a":1},{"pat":"win","ak":"win","st":"Walking down a row of fruit trees, you carry two baskets and each basket holds only one fruit type. Starting anywhere, you take one fruit from every tree until you cannot. Find the maximum fruit you can collect.","cn":"trees <= 10^5","core":"Find the longest contiguous stretch containing at most two distinct fruit types.","tell":"'Longest contiguous stretch with at most 2 distinct values' -- a variable window with a size-2 map.","cx":"O(n).","o":["Two pointers","Prefix sum","Sliding window","Heap / priority queue"],"a":2},{"pat":"win","ak":"win","st":"Count the number of contiguous subarrays of positive integers whose product is strictly less than k.","cn":"n <= 3*10^4","core":"Slide a window keeping the product < k; each right index adds (window length) new subarrays.","tell":"All-positive contiguous plus a product bound -- a window; each new right end contributes (window size) subarrays.","cx":"O(n).","o":["Two pointers","Prefix sum","Heap / priority queue","Sliding window"],"a":3},{"pat":"win","ak":"win","st":"Given an array of positive integers and a target, find the length of the shortest contiguous subarray whose sum is at least the target, or 0 if none.","cn":"n <= 10^5","core":"Grow the window until the sum reaches the target, then shrink from the left while it still holds.","tell":"Shortest contiguous stretch meeting a sum threshold, positives only -- a shrinking window.","cx":"O(n).","o":["Sliding window","Two pointers","Prefix sum","Heap / priority queue"],"a":0},{"pat":"win","ak":"win","st":"Count the contiguous subarrays that contain exactly k odd numbers.","cn":"n <= 5*10^4","core":"Compute windows with at most k odds and at most k-1 odds; subtract the counts.","tell":"'Exactly k' = atMost(k) - atMost(k-1), each an ordinary sliding-window count.","cx":"O(n).","o":["Two pointers","Sliding window","Prefix sum","Heap / priority queue"],"a":1},{"pat":"win","ak":"win","st":"Count the substrings of a string over {a, b, c} that contain at least one of each character.","cn":"length <= 5*10^4","core":"For each right end, once the window first contains all three, every further extension to the left is also valid.","tell":"Once the window is valid, every left-extension stays valid -- add (left index + 1) per right end.","cx":"O(n).","o":["Two pointers","Prefix sum","Sliding window","Heap / priority queue"],"a":2},{"pat":"win","ak":"win","st":"You must delete exactly one element from a binary array; afterwards, find the longest run of consecutive ones.","cn":"n <= 10^5","core":"Longest window containing at most one zero (the one you delete), minus one for the forced deletion.","tell":"A window allowing at most one zero -- which you delete -- then subtract one.","cx":"O(n).","o":["Two pointers","Prefix sum","Heap / priority queue","Sliding window"],"a":3},{"pat":"win","ak":"win","st":"Converting s[i] into t[i] costs the absolute difference of their letters. With a fixed total budget, find the longest substring you can fully convert without exceeding it.","cn":"length <= 10^5","core":"Slide a window whose accumulated conversion cost stays within the budget.","tell":"Longest contiguous stretch whose conversion cost stays under budget -- a cost-bounded window.","cx":"O(n).","o":["Sliding window","Two pointers","Prefix sum","Heap / priority queue"],"a":0},{"pat":"win","ak":"win","st":"A shopkeeper is grumpy during certain minutes, losing those minutes' customers, but can stay calm for one stretch of exactly X consecutive minutes. Maximise the total satisfied customers.","cn":"minutes <= 2*10^4","core":"Always-happy customers form a base; a fixed window of size X maximises the extra grumpy-minute customers recovered.","tell":"Fixed window of size X maximising recovered (grumpy) customers, added to the always-happy base.","cx":"O(n).","o":["Two pointers","Sliding window","Prefix sum","Heap / priority queue"],"a":1},{"pat":"win","ak":"win","st":"Find the maximum number of vowels contained in any substring of a given fixed length k.","cn":"length <= 10^5","core":"Roll a fixed window of size k, updating the vowel count as one character enters and one leaves.","tell":"Fixed window of size k -- roll the vowel count as you slide.","cx":"O(n).","o":["Two pointers","Prefix sum","Sliding window","Heap / priority queue"],"a":2},{"pat":"win","ak":"win","st":"Find the longest contiguous subarray in which every pair of elements has bitwise-AND zero (no two share a set bit).","cn":"n <= 10^5","core":"Maintain the OR of the window; a new element clashes if it shares a bit, so shrink from the left until the OR is clean.","tell":"Track the running OR; a shared set bit means shrink -- a bit-aware sliding window.","cx":"O(n).","o":["Two pointers","Prefix sum","Heap / priority queue","Sliding window"],"a":3},{"pat":"win","ak":"win","st":"Find the maximum sum of a contiguous subarray whose elements are all distinct.","cn":"n <= 10^5","core":"Keep a window of unique elements and its running sum; on a duplicate, shrink from the left, subtracting as you go.","tell":"Unique-element window with a running sum -- subtract from the sum as you shrink out duplicates.","cx":"O(n).","o":["Sliding window","Two pointers","Prefix sum","Heap / priority queue"],"a":0},{"pat":"win","ak":"win","st":"You may add 1 to any element up to k total increments. Maximise the number of elements that end up equal to the same value.","cn":"n <= 10^5, k <= 10^5","core":"Sort, then slide a window where raising every element to the rightmost value costs at most k.","tell":"Sort first, then a window where lifting everyone to the right end's value costs <= k. Sorting is the enabler, the window does the counting.","cx":"O(n log n).","o":["Two pointers","Sliding window","Prefix sum","Heap / priority queue"],"a":1},{"pat":"win","ak":"win","st":"From a string of a, b, c you must take characters only from the two ends until you have collected at least a required number of each. Minimise the total characters taken.","cn":"length <= 10^5","core":"Taking from both ends leaves one contiguous middle window untaken; maximise that middle window given the remaining supply must still cover the requirement.","tell":"Taking from the ends = leaving a middle window -- maximise the leftover window under the supply constraint; answer is n minus its length.","cx":"O(n).","o":["Two pointers","Prefix sum","Sliding window","Heap / priority queue"],"a":2},{"pat":"win","ak":"win","st":"A telephone switch logs a stream of call-type codes. Find the longest stretch of consecutive calls that uses at most two distinct call types.","cn":"n <= 10^5","core":"Longest contiguous run with at most two distinct codes, tracked with a size-2 frequency map.","tell":"'At most 2 distinct in a contiguous run' -- a variable window with a two-entry map.","cx":"O(n).","o":["Two pointers","Prefix sum","Heap / priority queue","Sliding window"],"a":3},{"pat":"heap","ak":"heap","st":"Find the k-th largest element in an unsorted array.","cn":"n <= 10^5","core":"Keep a min-heap of size k; its top after processing all elements is the k-th largest.","tell":"'k-th largest' -- maintain a size-k min-heap; its root is the answer. (Quickselect also works.)","cx":"O(n log k).","o":["Heap / priority queue","Greedy","Sorting","Sliding window"],"a":0},{"pat":"heap","ak":"heap","st":"Return the k most frequent elements of an array.","cn":"n <= 10^5","core":"Count frequencies, then keep a size-k heap over the counts (or bucket by frequency).","tell":"Count, then pull the k highest counts -- a size-k heap over frequencies.","cx":"O(n log k).","o":["Greedy","Heap / priority queue","Sorting","Sliding window"],"a":1},{"pat":"heap","ak":"heap","st":"Return the k points closest to the origin from a list of 2-D points.","cn":"n <= 10^5","core":"Keep a size-k max-heap by distance; pop the farthest whenever it overflows.","tell":"'k closest' -- a size-k max-heap on distance keeps the nearest k.","cx":"O(n log k).","o":["Greedy","Sorting","Heap / priority queue","Sliding window"],"a":2},{"pat":"heap","ak":"heap","st":"Design a structure that ingests a stream of numbers and can report the running median at any time.","cn":"operations <= 10^5","core":"Balance a max-heap of the lower half against a min-heap of the upper half.","tell":"Streaming median -- a max-heap (low half) balanced against a min-heap (high half).","cx":"O(log n) per add.","o":["Greedy","Sorting","Sliding window","Heap / priority queue"],"a":3},{"pat":"heap","ak":"heap","st":"Merge k already-sorted lists into a single sorted list.","cn":"total elements <= 10^4","core":"Keep a min-heap of the current front element of each list; repeatedly pop the smallest and push its successor.","tell":"Always pull the smallest current head -- a min-heap over the k front elements.","cx":"O(N log k).","o":["Heap / priority queue","Greedy","Sorting","Sliding window"],"a":0},{"pat":"heap","ak":"heap","st":"Repeatedly take the two heaviest stones and smash them; if unequal, the difference goes back into the pile. Return the weight of the last remaining stone (or 0).","cn":"n <= 30","core":"Use a max-heap; pop the two largest, push their difference, repeat.","tell":"Repeatedly needing the two largest from a shrinking-and-growing set -- a max-heap.","cx":"O(n log n).","o":["Greedy","Heap / priority queue","Sorting","Sliding window"],"a":1},{"pat":"heap","ak":"heap","st":"Support a stream of add(value) operations where each add returns the k-th largest element seen so far.","cn":"operations <= 10^4","core":"Maintain a size-k min-heap across all adds; its top is the running k-th largest.","tell":"A running k-th largest over a stream -- keep a size-k min-heap alive across adds.","cx":"O(log k) per add.","o":["Greedy","Sorting","Heap / priority queue","Sliding window"],"a":2},{"pat":"heap","ak":"heap","st":"Rearrange the characters of a string so that no two adjacent characters are the same, or report it is impossible.","cn":"length <= 500","core":"Repeatedly place the most frequent remaining character that is not the one just placed -- a max-heap by count.","tell":"'Place the most frequent remaining, but not twice in a row' -- a max-heap keyed by remaining count.","cx":"O(n log alpha).","o":["Greedy","Sorting","Sliding window","Heap / priority queue"],"a":3},{"pat":"heap","ak":"heap","st":"You start with capital w and may complete at most k projects; each project needs a minimum capital and yields a profit added to your capital. Maximise your final capital.","cn":"projects <= 10^5","core":"Sort projects by capital; as capital grows, push all now-affordable profits into a max-heap and always take the largest.","tell":"Unlock projects by a rising capital, then take the most profitable affordable one -- sorted pointer plus a max-heap.","cx":"O(n log n).","o":["Heap / priority queue","Greedy","Sorting","Sliding window"],"a":0},{"pat":"heap","ak":"heap","st":"Given two sorted arrays, return the k pairs (one element from each) with the smallest sums.","cn":"arrays <= 10^5, k <= 10^4","core":"Seed a min-heap with the smallest frontier pairs and repeatedly pop the smallest, pushing its neighbours.","tell":"Smallest sums first from a grid of pairs -- a min-heap over the expanding frontier.","cx":"O(k log k).","o":["Greedy","Heap / priority queue","Sorting","Sliding window"],"a":1},{"pat":"heap","ak":"heap","st":"Tasks each have an availability time and a duration. A single CPU, whenever free, runs the shortest available task next (ties by index). Output the processing order.","cn":"tasks <= 10^5","core":"Sort tasks by availability; among currently available tasks a min-heap by duration picks the next to run.","tell":"'Shortest available job next' -- sort by arrival, min-heap by duration over the available set.","cx":"O(n log n).","o":["Greedy","Sorting","Heap / priority queue","Sliding window"],"a":2},{"pat":"heap","ak":"heap","st":"Pick at most k engineers to maximise (sum of their speeds) multiplied by (the minimum efficiency among them).","cn":"n <= 10^5","core":"Sort by efficiency descending; sweep, keeping the k largest speeds in a size-k min-heap, and evaluate at each efficiency as the floor.","tell":"Fix the minimum efficiency by sorting descending; hold the k best speeds in a min-heap as the floor drops.","cx":"O(n log n).","o":["Greedy","Sorting","Sliding window","Heap / priority queue"],"a":3},{"pat":"heap","ak":"heap","st":"Numbered seats can be reserved (always the smallest free seat) and unreserved (a seat returns to the pool). Support both operations efficiently.","cn":"operations <= 10^5","core":"Keep a min-heap of freed seats plus a next-unused counter; reserve pops the heap or takes the counter.","tell":"Always hand out the smallest free number -- a min-heap of released seats.","cx":"O(log n) per op.","o":["Heap / priority queue","Greedy","Sorting","Sliding window"],"a":0},{"pat":"heap","ak":"heap","st":"You cross a skyline of buildings by height; each upward step needs either bricks equal to the height gap or one ladder (any gap). With limited bricks and ladders, reach the furthest building.","cn":"buildings <= 10^5","core":"Spend ladders on the largest climbs: keep the climbs in a size-(ladders) min-heap and pay bricks for whatever falls out.","tell":"Save the ladders for the biggest climbs -- a min-heap of size = ladders decides which climbs use bricks.","cx":"O(n log(ladders)).","o":["Greedy","Heap / priority queue","Sorting","Sliding window"],"a":1},{"pat":"heap","ak":"heap","st":"Hire exactly k workers. Each has a quality and a minimum wage. Within a hired group everyone is paid in proportion to quality, scaled so the group's highest wage-per-quality ratio is met. Minimise total pay.","cn":"n <= 10^4","core":"Sort workers by wage/quality ratio; sweep, keeping the k smallest qualities in a max-heap, and cost each group at the current ratio.","tell":"Sort by the ratio, hold the k smallest qualities in a max-heap as the ratio rises -- the classic heap-plus-sort.","cx":"O(n log n).","o":["Greedy","Sorting","Heap / priority queue","Sliding window"],"a":2},{"pat":"heap","ak":"heap","st":"Servers have processing weights. Tasks arrive over time and each goes to the free server of least weight (ties by index); a busy server frees after its task's duration. Output which server runs each task.","cn":"tasks <= 2*10^5","core":"Two heaps: free servers keyed by (weight, index), and busy servers keyed by free-time.","tell":"Two heaps -- available servers by weight, busy servers by when they free up.","cx":"O(n log n).","o":["Greedy","Sorting","Sliding window","Heap / priority queue"],"a":3},{"pat":"heap","ak":"heap","st":"Given k sorted lists, find the smallest range [a, b] that contains at least one number from each list.","cn":"total <= 10^4","core":"Keep a min-heap of one element per list; the window spans the heap's min to the running max, and you advance the list holding the min.","tell":"Advance the list holding the current minimum, tracking the max -- a min-heap gives the moving minimum across lists.","cx":"O(N log k).","o":["Heap / priority queue","Greedy","Sorting","Sliding window"],"a":0},{"pat":"heap","ak":"heap","st":"Each second you take the single richest pile of coins and are forced to leave behind only the floor of its square root. After k seconds, return the total coins remaining across all piles.","cn":"piles <= 10^3, k <= 10^5","core":"Use a max-heap; each second pop the largest, push floor(sqrt) of it, repeat k times.","tell":"'Repeatedly act on the current maximum' -- a max-heap.","cx":"O(k log n).","o":["Greedy","Heap / priority queue","Sorting","Sliding window"],"a":1},{"pat":"heap","ak":"heap","st":"Pick exactly k indices to maximise (sum of the chosen values from array A) multiplied by (the minimum of the chosen values from array B).","cn":"n <= 10^5","core":"Sort index pairs by B descending; sweep, keeping the k largest A-values in a size-k min-heap, evaluating with the current B as the minimum.","tell":"Sort by the factor being minimised; keep the k best of the summed array in a min-heap.","cx":"O(n log n).","o":["Greedy","Sorting","Heap / priority queue","Sliding window"],"a":2},{"pat":"heap","ak":"heap","st":"A CPU scheduler must run tasks that each need a number of runs, but between two runs of the SAME task there must be a cooldown of n idle slots. Find the least total time (busy or idle) to finish all tasks.","cn":"task types <= 26, runs large","core":"Always schedule the task with the most remaining runs that is off cooldown -- a max-heap by remaining count, cycling through cooldown.","tell":"'Run the most-remaining task that is off cooldown' -- a max-heap by count drives the schedule (a closed-form greedy also exists).","cx":"O(T log alpha).","o":["Greedy","Sorting","Sliding window","Heap / priority queue"],"a":3},{"pat":"graph","ak":"graph","st":"Count the number of separate land regions in a grid of land and water cells, where cells connect through their four orthogonal neighbours.","cn":"grid <= 300 x 300","core":"Flood-fill from each unvisited land cell, marking its whole region, and count how many fills you start.","tell":"Connected regions in a static grid -- flood-fill (BFS/DFS) from each unvisited land cell. (Union-find also works.)","cx":"O(rows*cols).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":0},{"pat":"graph","ak":"graph","st":"Rotten fruit infects any fresh fruit orthogonally adjacent to it each minute. Given a grid, return the minutes until no fresh fruit remains, or -1 if some can never rot.","cn":"grid up to 300 x 300","core":"Run multi-source BFS from all initially-rotten cells; the number of layers is the time.","tell":"Many sources spreading one step per minute -- multi-source BFS; the last layer is the answer.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":1},{"pat":"graph","ak":"graph","st":"Transform a start word into an end word by changing one letter at a time, where every intermediate word must be in a given dictionary. Return the length of the shortest such transformation.","cn":"words <= 5000","core":"BFS over the word graph, where two words are neighbours if they differ in exactly one letter.","tell":"Fewest one-letter steps -- BFS; each word's neighbours differ by a single letter.","cx":"O(N*L*26).","o":["Union-Find (DSU)","Dynamic programming","Graph: BFS / Dijkstra","Greedy"],"a":2},{"pat":"graph","ak":"graph","st":"Find the length of the shortest clear path from the top-left to the bottom-right of a binary grid, moving in any of eight directions through open cells only.","cn":"grid <= 100 x 100","core":"Plain BFS from the start; the first time you reach the goal gives the shortest length.","tell":"Fewest steps in an unweighted grid -- plain BFS.","cx":"O(rows*cols).","o":["Union-Find (DSU)","Dynamic programming","Greedy","Graph: BFS / Dijkstra"],"a":3},{"pat":"graph","ak":"graph","st":"A signal starts at node k and travels along directed edges that each take a known positive time. Return the time for every node to receive the signal, or -1 if some never do.","cn":"nodes <= 100, edges <= 6000","core":"Dijkstra from k; the answer is the maximum shortest-time over all nodes (or -1 if any is unreachable).","tell":"Weighted, non-negative, single source -- Dijkstra; the answer is the farthest arrival time.","cx":"O(E log V).","o":["Graph: BFS / Dijkstra","Union-Find (DSU)","Dynamic programming","Greedy"],"a":0},{"pat":"graph","ak":"graph","st":"Find the cheapest fare from a source city to a destination city using at most k intermediate stops, given directed flights with prices.","cn":"cities <= 100, flights <= 10^4","core":"Bellman-Ford style: relax all edges k+1 times, or BFS by levels capped at k stops.","tell":"Shortest weighted path WITH a hop limit -- bounded relaxations (Bellman-Ford), not plain Dijkstra, because the stop cap breaks Dijkstra's greedy order.","cx":"O(k*E).","o":["Union-Find (DSU)","Graph: BFS / Dijkstra","Dynamic programming","Greedy"],"a":1},{"pat":"graph","ak":"graph","st":"On a grid of heights, the effort of a route is its largest absolute height change between consecutive cells. Find the minimum-effort route from the top-left to the bottom-right.","cn":"grid <= 100 x 100","core":"Dijkstra where a path's cost is the maximum edge on it -- relax by the larger of current cost and the next step.","tell":"Minimise the maximum step across a path -- a Dijkstra variant on the max-edge metric. (Binary-search
